<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伽利略的手指</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>伽利略的手指</h1>
    <div class="sub">阿特金斯：十根手指撑起现代科学的骨架</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>

    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>

", "波长与频率"], "answer": 0, "explain": "配对保证复制，骨架保证稳定。"}, {"id": "ch02-q2", "chapterId": "ch02", "type": "single", "question": "“生物学理性化”指的是？", "options": ["生物学变成数学", "遗传现象可追到分子机制", "放弃实验", "只研究DNA"], "answer": 1, "explain": "黑箱变成可拆解的机制。"}, {"id": "ch03-q1", "chapterId": "ch03", "type": "single", "question": "能量概念的核心作用是？", "options": ["制造能量", "把不同形式的变化换算成同一单位", "解释引力", "测量温度"], "answer": 1, "explain": "可通约是它的方法论价值。"}, {"id": "ch03-q2", "chapterId": "ch03", "type": "single", "question": "“消耗能量”更准确的说法是？", "options": ["能量消失", "能量转为不易利用的形式", "能量变成质量", "能量被存储"], "answer": 1, "explain": "总量守恒，可用性下降。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "熵增原理适用于？", "options": ["所有系统", "孤立系统", "生命体", "发动机"], "answer": 1, "explain": "孤立系统的熵不减；开放系统可局部降熵。"}, {"id": "ch04-q2", "chapterId": "ch04", "type": "single", "question": "时间箭头的来源是？", "options": ["基本方程不可逆", "统计上熵大的状态占绝对多数", "人的错觉", "引力"], "answer": 1, "explain": "宏观方向来自统计，而非微观定律。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "周期表的排列依据是？", "options": ["颜色", "原子序数与电子结构", "密度", "熔点"], "answer": 1, "explain": "电子结构决定族与周期性。"}, {"id": "ch05-q2", "chapterId": "ch05", "type": "single", "question": "化学性质主要由什么决定？", "options": ["原子核质量", "最外层电子", "中子数", "颜色"], "answer": 1, "explain": "成键与反应涉及外层电子。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "诺特定理连接的是？", "options": ["对称与守恒", "能量与温度", "质量与引力", "熵与时间"], "answer": 0, "explain": "连续对称对应守恒量。"}, {"id": "ch06-q2", "chapterId": "ch06", "type": "single", "question": "对称操作的定义是？", "options": ["看起来漂亮", "使对象保持不变的变换", "左右相同", "重复图案"], "answer": 1, "explain": "核心是“变换下不变”。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "量子化的含义是？", "options": ["能量连续", "能量以最小份额成块交换", "粒子不可分", "波粒二象"], "answer": 1, "explain": "分立份额是核心。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "不确定性原理说的是？", "options": ["仪器精度不足", "共轭量不能同时精确", "测量会改变结果", "粒子会消失"], "answer": 1, "explain": "这是原理性限制。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "宇宙膨胀的直接证据是？", "options": ["红移与距离成正比", "恒星颜色", "行星轨道", "潮汐"], "answer": 0, "explain": "哈勃定律是核心证据。"}, {"id": "ch08-q2", "chapterId": "ch08", "type": "single", "question": "大爆炸的正确理解是？", "options": ["在空间某点炸开", "空间本身从高温高密状态膨胀", "星系互相撞击", "恒星爆炸"], "answer": 1, "explain": "没有中心，膨胀处处发生。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "狭义相对论的出发点是？", "options": ["光速不变", "绝对时间", "以太存在", "引力是力"], "answer": 0, "explain": "光速不变迫使时空相对化。"}, {"id": "ch09-q2", "chapterId": "ch09", "type": "single", "question": "广义相对论中引力的本质是？", "options": ["超距作用", "时空弯曲", "电磁力", "弱力"], "answer": 1, "explain": "物体沿弯曲时空的短程线运动。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "哥德尔不完备定理说的是？", "options": ["数学全错", "足够强的系统中存在不可判定的真命题", "所有命题都可证", "数学依赖实验"], "answer": 1, "explain": "可证性有边界，不是全错。"}, {"id": "ch10-q2", "chapterId": "ch10", "type": "single", "question": "“不可思议的有效性”指的是？", "options": ["数学太难", "纯粹数学常能精确描述物理", "物理不需要数学", "数学不可靠"], "answer": 1, "explain": "维格纳的困惑：为何抽象工具如此适配。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "下列哪一组概念回答的是“变化往哪走”？", "options": ["能量与动量", "熵与时间箭头", "原子与周期表", "对称与群"], "answer": 1, "explain": "熵增给出宏观方向。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "诺特定理说明？", "options": ["对称是美学", "连续对称对应守恒定律", "能量不守恒", "量子不确定"], "answer": 1, "explain": "对称性是守恒量的来源。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "哥德尔定理限制的是？", "options": ["实验精度", "形式系统的可证性", "光速", "熵增"], "answer": 1, "explain": "它限定形式化的边界，不是否定数学。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "复杂性不需要设计者：变异提供材料，选择保留有效者，累积起来就是适应。进化的方向是“当时有效”，不是“越来越好”。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "从神话到机制——一句话说清它是什么？", "back": "各文明都有生命起源的神话：骨灰长出葡萄、牙齿长出玉米。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "三要素——一句话说清它是什么？", "back": "**变异**（个体差异）、**遗传**（差异可传递）、**选择**（差异影响存活与繁殖）。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "复杂性的累积——一句话说清它是什么？", "back": "每一步只要求“比上一代稍微有效”，不要求“最优”。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "DNA 双螺旋把遗传从“神秘的力量”变成“可读的序列 + 可复制的化学”，生物学由此获得像物理一样的机制解释。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "孟德尔的遗产——一句话说清它是什么？", "back": "孟德尔用豌豆杂交发现分离与自由组合定律：性状由成对的“因子”决定，可隐可显。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "双螺旋——一句话说清它是什么？", "back": "沃森与克里克的结构模型给出两条关键：碱基配对（A-T、C-G）保证复制精确。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch02", "front": "理性化——一句话说清它是什么？", "back": "在此之前，遗传是“黑箱”。", "tags": ["ch02"]}, {"id": "f009", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "能量是把各种变化（运动、热、化学、电）换算成同一单位的工具；守恒定律说总量不变，变化只是形式转换。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "从亚里士多德到力学——一句话说清它是什么？", "back": "亚里士多德用“空气漩涡推动箭”解释飞行，两千年后被牛顿的惯性定律取代。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "可通约性——一句话说清它是什么？", "back": "焦耳测出机械功与热的换算关系（1 卡 ≈ 4.18 焦），把“热”与“做功”接到同一把尺子上。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch03", "front": "守恒的边界——一句话说清它是什么？", "back": "封闭系统的总能量不变。", "tags": ["ch03"]}, {"id": "f013", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "熵是能量分散程度的度量；孤立系统的熵不会减少，因此变化有方向——这就是时间箭头的物理来源。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "蒸汽机——一句话说清它是什么？", "back": "蒸汽机把热转为功，效率受冷热两端温差限制。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "分散度——一句话说清它是什么？", "back": "熵可理解为“能量分布在多少种方式上”。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch04", "front": "时间箭头——一句话说清它是什么？", "back": "微观方程大多时间可逆，但宏观演化偏向熵增。", "tags": ["ch04"]}, {"id": "f017", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "物质由有限种类的原子组成，原子的电子结构决定化学性质；周期表把这种结构排成可预测的图。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "从元素到原子——一句话说清它是什么？", "back": "古希腊的四元素、中国的五行都是定性分类。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "电子结构——一句话说清它是什么？", "back": "化学性质主要由最外层电子决定。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch05", "front": "解释力——一句话说清它是什么？", "back": "原子论的价值在于：把无穷多种物质还原为有限种原子的组合，把化学从分类学变成结构学。", "tags": ["ch05"]}, {"id": "f021", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "对称不是“好看”，而是“某种变换下不变”；每一种连续对称都对应一条守恒定律。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "对称操作——一句话说清它是什么？", "back": "球体绕任意轴转任意角度都不变，因此对称性最高。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "诺特定理——一句话说清它是什么？", "back": "**诺特定理**（Noether's theorem）：时间平移对称 → 能量守恒。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch06", "front": "美的量化——一句话说清它是什么？", "back": "对称度可用“不变变换的数量”衡量。", "tags": ["ch06"]}, {"id": "f025", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "微观世界的能量与状态是分立的（量子化），位置与动量不能同时精确（不确定性）；这两条把复杂的连续图像简化成可数的状态。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "量子化——一句话说清它是什么？", "back": "能量以普朗克常数为单位成块交换。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "不确定性——一句话说清它是什么？", "back": "位置与动量的不确定度乘积有下限（ħ/2）。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch07", "front": "简化——一句话说清它是什么？", "back": "分立状态让计算变得可数：原子只有有限个能级，分子只有有限种振动模式。", "tags": ["ch07"]}, {"id": "f029", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "星系越远退行越快，说明宇宙在膨胀；把时间反推，得到一个高温高密的起点，这就是大爆炸的含义。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "望远镜扩大宇宙——一句话说清它是什么？", "back": "赫歇尔把“磨盘状星团”的宇宙扩大到远超想象。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "膨胀——一句话说清它是什么？", "back": "哈勃定律：退行速度与距离成正比。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch08", "front": "大爆炸的含义——一句话说清它是什么？", "back": "它不是“在已有空间里炸开”，而是空间本身从高温高密状态膨胀。", "tags": ["ch08"]}, {"id": "f033", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "光速不变迫使时间与空间成为相对的；引力不是力，而是质量-能量让时空弯曲，物体沿弯曲时空的短程线运动。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "绝对时空的崩塌——一句话说清它是什么？", "back": "伽利略变换假设时间绝对、长度不变。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "弯曲时空——一句话说清它是什么？", "back": "质量-能量弯曲时空，物体自由运动沿**短程线**（geodesic）。", "tags": ["ch09"]}, {"id": "f036", "chapterId": "ch09", "front": "舞台变成演员——一句话说清它是什么？", "back": "在牛顿力学里，时空是背景。", "tags": ["ch09"]}, {"id": "f037", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "任何足够强的形式系统都存在无法在系统内证明的真命题；数学的可靠性有边界，但它对自然的描述力又超出预期。", "tags": ["ch10"]}, {"id": "f038", "chapterId": "ch10", "front": "不完备——一句话说清它是什么？", "back": "**哥德尔不完备定理**（Gödel's incompleteness theorems）：足够强、可递归公理化的系统中，存在既不能证明也不能否证的命题。", "tags": ["ch10"]}, {"id": "f039", "chapterId": "ch10", "front": "理性的边界——一句话说清它是什么？", "back": "这不是“数学错了”，而是“形式化有极限”。", "tags": ["ch10"]}, {"id": "f040", "chapterId": "ch10", "front": "有效性之谜——一句话说清它是什么？", "back": "为什么为纯粹好奇发明的数学，几十年后能精确描述物理？维格纳称之为“不可思议的有效性”。", "tags": ["ch10"]}], "companion": "galileos-finger学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：进化：复杂性的萌芽<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自然选择如何在不设目标的情况下产生复杂性\n<\/li><li>\n能指出“进化=进步”这一说法的错误\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂性不需要设计者：变异提供材料，选择保留有效者，累积起来就是适应。进化的方向是“当时有效”，不是“越来越好”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从神话到机制（难度：基础）<\/h3>\n<p>各文明都有生命起源的神话：骨灰长出葡萄、牙齿长出玉米。这些解释的共同点是“用已知的东西类比未知”。达尔文的贡献不是提出“变化”，而是给出一个不需要意图的机制。<\/p>\n<h3>概念 2：三要素（难度：进阶）<\/h3>\n<p><strong>变异<\/strong>（个体差异）、<strong>遗传<\/strong>（差异可传递）、<strong>选择<\/strong>（差异影响存活与繁殖）。三者同时成立，种群就会改变。缺任一项，进化停摆。<\/p>\n<h3>概念 3：复杂性的累积（难度：进阶）<\/h3>\n<p>每一步只要求“比上一代稍微有效”，不要求“最优”。复杂器官是无数次小改进的叠加，不是一次跳跃。这也是为什么进化会产生“能用但笨拙”的结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从神话到机制&quot;]\n  n2[&quot;三要素&quot;]\n  n1 --&gt; n2\n  n3[&quot;复杂性的累积&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像没有设计师的桥梁：每代工匠只改一处，能过河就保留，几百年后结构复杂得看不出起点。边界：工匠有意图，选择没有。\n<\/li><li>\n<strong>实例<\/strong>：细菌在抗生素压力下，耐药突变被保留；停药后耐药株可能因代价高而减少。同一机制，方向随环境翻转。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为进化等于进步——它只保证“当前环境下的繁殖成功”，不保证更复杂或更聪明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自然选择的三要素不包括？\n<ul>\n<li>\nA. 变异\n<\/li><li>\nB. 遗传\n<\/li><li>\nC. 选择\n<\/li><li>\nD. 设计\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：选择无需设计者。\n<\/li><li>\n进化产生笨拙结构的原因是？\n<\/li><li>\nA. 设计失误\n<\/li><li>\nB. 每步只需局部有效，不追求最优\n<\/li><li>\nC. 基因太少\n<\/li><li>\nD. 环境不变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：局部改进的累积会留下历史包袱。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n变异+遗传+选择\n<\/li><li>\n方向是局部有效\n<\/li><li>\n复杂性靠累积\n<\/ul>", "kind": "chapter", "title": "第 1 章 进化：复杂性的萌芽"}, "ch02": {"html": "<h1>第 2 章：DNA：生物学的理性化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明孟德尔定律与 DNA 结构的关系\n<\/li><li>\n能解释“生物学理性化”指什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 双螺旋把遗传从“神秘的力量”变成“可读的序列 + 可复制的化学”，生物学由此获得像物理一样的机制解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：孟德尔的遗产（难度：基础）<\/h3>\n<p>孟德尔用豌豆杂交发现分离与自由组合定律：性状由成对的“因子”决定，可隐可显。他的工作是统计的，不是分子的。<\/p>\n<h3>概念 2：双螺旋（难度：进阶）<\/h3>\n<p>沃森与克里克的结构模型给出两条关键：碱基配对（A-T、C-G）保证复制精确；磷酸-糖骨架保证序列稳定。结构一确定，复制、转录、突变的机制都能接上。<\/p>\n<h3>概念 3：理性化（难度：进阶）<\/h3>\n<p>在此之前，遗传是“黑箱”；之后，每个遗传现象都能追到序列层面的操作。这不是说生物学变成物理，而是它有了可拆解、可干预的机制层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;孟德尔的遗产&quot;]\n  n2[&quot;双螺旋&quot;]\n  n1 --&gt; n2\n  n3[&quot;理性化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把口传的族谱变成可扫描的档案：原先只能看结果，现在能查每一条记录。边界：档案会丢失，DNA 也会突变。\n<\/li><li>\n<strong>实例<\/strong>：镰状细胞贫血：一个碱基替换导致谷氨酸变缬氨酸，蛋白聚合，红细胞变形。一个字母的改变，整条表型链改变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因决定一切——序列提供可能，表达依赖环境与调控。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDNA 结构解决的两个核心问题是？\n<ul>\n<li>\nA. 复制与序列稳定\n<\/li><li>\nB. 能量与熵\n<\/li><li>\nC. 对称与守恒\n<\/li><li>\nD. 波长与频率\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：配对保证复制，骨架保证稳定。\n<\/li><li>\n“生物学理性化”指的是？\n<\/li><li>\nA. 生物学变成数学\n<\/li><li>\nB. 遗传现象可追到分子机制\n<\/li><li>\nC. 放弃实验\n<\/li><li>\nD. 只研究DNA\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：黑箱变成可拆解的机制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n孟德尔：统计层\n<\/li><li>\n双螺旋：分子层\n<\/li><li>\n一个碱基可改变表型\n<\/ul>", "kind": "chapter", "title": "第 2 章 DNA：生物学的理性化"}, "ch03": {"html": "<h1>第 3 章：能量：计量的普遍化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明能量守恒的内容与边界\n<\/li><li>\n能指出“能量”为什么是可通约的\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>能量是把各种变化（运动、热、化学、电）换算成同一单位的工具；守恒定律说总量不变，变化只是形式转换。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从亚里士多德到力学（难度：基础）<\/h3>\n<p>亚里士多德用“空气漩涡推动箭”解释飞行，两千年后被牛顿的惯性定律取代。阿特金斯用这个例子说明：错误的理论往往也能“解释”，但经不起定量检验。<\/p>\n<h3>概念 2：可通约性（难度：进阶）<\/h3>\n<p>焦耳测出机械功与热的换算关系（1 卡 ≈ 4.18 焦），把“热”与“做功”接到同一把尺子上。<strong>能量<\/strong>（energy）因此成为跨领域的通货。<\/p>\n<h3>概念 3：守恒的边界（难度：进阶）<\/h3>\n<p>封闭系统的总能量不变；开放系统可以交换。说“消耗能量”其实不准确，能量只是转成了不易利用的形式（见下一章熵）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从亚里士多德到力学&quot;]\n  n2[&quot;可通约性&quot;]\n  n1 --&gt; n2\n  n3[&quot;守恒的边界&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把不同货币换成同一单位记账：不是钱变多了，是账能算了。边界：汇率会变，能量换算系数是固定的。\n<\/li><li>\n<strong>实例<\/strong>：把 1 千克物体举高 1 米，约需 9.8 焦；把 1 克水升温 1 摄氏度，约需 4.18 焦。两个完全不同的过程，可用同一单位比较。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“消耗能量”是能量消失——它转成了热、声、形变等分散形式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n能量概念的核心作用是？\n<ul>\n<li>\nA. 制造能量\n<\/li><li>\nB. 把不同形式的变化换算成同一单位\n<\/li><li>\nC. 解释引力\n<\/li><li>\nD. 测量温度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可通约是它的方法论价值。\n<\/li><li>\n“消耗能量”更准确的说法是？\n<\/li><li>\nA. 能量消失\n<\/li><li>\nB. 能量转为不易利用的形式\n<\/li><li>\nC. 能量变成质量\n<\/li><li>\nD. 能量被存储\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：总量守恒，可用性下降。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n能量 = 变化的通货\n<\/li><li>\n焦耳换算：1 卡≈4.18 焦\n<\/li><li>\n消耗 = 降级，不是消失\n<\/ul>", "kind": "chapter", "title": "第 3 章 能量：计量的普遍化"}, "ch04": {"html": "<h1>第 4 章：熵：变化发生的源泉<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明熵增原理的内容\n<\/li><li>\n能解释为什么熵增给了时间方向\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>熵是能量分散程度的度量；孤立系统的熵不会减少，因此变化有方向——这就是时间箭头的物理来源。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：蒸汽机（难度：基础）<\/h3>\n<p>蒸汽机把热转为功，效率受冷热两端温差限制。卡诺与克劳修斯从这台机器里抽出<strong>熵<\/strong>（entropy）：可用的能量在每次转换中都会减少一部分。<\/p>\n<h3>概念 2：分散度（难度：进阶）<\/h3>\n<p>熵可理解为“能量分布在多少种方式上”。方式越多，熵越大。一杯热水与室温空气最终同温，是因为热量分散的方式变多了。<\/p>\n<h3>概念 3：时间箭头（难度：进阶）<\/h3>\n<p>微观方程大多时间可逆，但宏观演化偏向熵增。<strong>时间箭头<\/strong>（arrow of time）不是基本定律，而是统计结论：从低熵初始态出发，熵大的状态数目远多于熵小的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;蒸汽机&quot;]\n  n2[&quot;分散度&quot;]\n  n1 --&gt; n2\n  n3[&quot;时间箭头&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一副新牌越洗越乱：洗牌规则可逆，但“乱”的方式远多于“有序”。边界：牌可以按规则复原，孤立系统的熵不会自发下降。\n<\/li><li>\n<strong>实例<\/strong>：把墨水滴进水里会扩散，不会自发聚回一滴。扩散后分子排列方式的数量远大于聚集态，因此熵增。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增意味着“宇宙必然混乱到死”——局部可以变得更有序，只要整体熵增（生命就是这样的局部）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n熵增原理适用于？\n<ul>\n<li>\nA. 所有系统\n<\/li><li>\nB. 孤立系统\n<\/li><li>\nC. 生命体\n<\/li><li>\nD. 发动机\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：孤立系统的熵不减；开放系统可局部降熵。\n<\/li><li>\n时间箭头的来源是？\n<\/li><li>\nA. 基本方程不可逆\n<\/li><li>\nB. 统计上熵大的状态占绝对多数\n<\/li><li>\nC. 人的错觉\n<\/li><li>\nD. 引力\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：宏观方向来自统计，而非微观定律。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n熵 = 能量分散度\n<\/li><li>\n孤立系统熵不减\n<\/li><li>\n时间箭头是统计结论\n<\/ul>", "kind": "chapter", "title": "第 4 章 熵：变化发生的源泉"}, "ch05": {"html": "<h1>第 5 章：原子：物质的产生<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明周期表按什么排列\n<\/li><li>\n能解释“原子论”为什么是解释而非描述\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>物质由有限种类的原子组成，原子的电子结构决定化学性质；周期表把这种结构排成可预测的图。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从元素到原子（难度：基础）<\/h3>\n<p>古希腊的四元素、中国的五行都是定性分类。道尔顿把“元素”变成有重量的原子，门捷列夫按原子量排列，留下空格并预言未知元素。<\/p>\n<h3>概念 2：电子结构（难度：进阶）<\/h3>\n<p>化学性质主要由最外层电子决定。同一族元素最外层电子数相同，因此性质相似。周期表的“列”比“行”更能解释化学。<\/p>\n<h3>概念 3：解释力（难度：进阶）<\/h3>\n<p>原子论的价值在于：把无穷多种物质还原为有限种原子的组合，把化学从分类学变成结构学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从元素到原子&quot;]\n  n2[&quot;电子结构&quot;]\n  n1 --&gt; n2\n  n3[&quot;解释力&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用有限字母拼出无限单词：26 个字母，词库无限。边界：字母不随语境变形，原子会成键。\n<\/li><li>\n<strong>实例<\/strong>：钠（最外层 1 个电子）与氯（最外层 7 个电子）结合成食盐；同族的钾与溴行为类似。周期性由此可预测。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为周期表只是分类表——它按电子结构排列，能预测未发现元素的性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n周期表的排列依据是？\n<ul>\n<li>\nA. 颜色\n<\/li><li>\nB. 原子序数与电子结构\n<\/li><li>\nC. 密度\n<\/li><li>\nD. 熔点\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：电子结构决定族与周期性。\n<\/li><li>\n化学性质主要由什么决定？\n<\/li><li>\nA. 原子核质量\n<\/li><li>\nB. 最外层电子\n<\/li><li>\nC. 中子数\n<\/li><li>\nD. 颜色\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：成键与反应涉及外层电子。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有限原子，无限组合\n<\/li><li>\n周期表按电子结构\n<\/li><li>\n同族性质相似\n<\/ul>", "kind": "chapter", "title": "第 5 章 原子：物质的产生"}, "ch06": {"html": "<h1>第 6 章：对称：美的量化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明对称操作的定义\n<\/li><li>\n能解释对称与守恒定律的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对称不是“好看”，而是“某种变换下不变”；每一种连续对称都对应一条守恒定律。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：对称操作（难度：进阶）<\/h3>\n<p>球体绕任意轴转任意角度都不变，因此对称性最高；正方形只能转 90 度倍数。<strong>对称操作<\/strong>（symmetry operation）就是使对象不变的那些变换。<\/p>\n<h3>概念 2：诺特定理（难度：高难）<\/h3>\n<p><strong>诺特定理<\/strong>（Noether&#x27;s theorem）：时间平移对称 → 能量守恒；空间平移对称 → 动量守恒；旋转对称 → 角动量守恒。守恒定律不是经验巧合，而是对称性的数学结果。<\/p>\n<h3>概念 3：美的量化（难度：进阶）<\/h3>\n<p>对称度可用“不变变换的数量”衡量。这给了“美”一个可计算的定义，也解释了物理学家为何偏爱对称的理论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;对称操作&quot;]\n  n2[&quot;诺特定理&quot;]\n  n1 --&gt; n2\n  n3[&quot;美的量化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一面能照出所有角度的镜子：转多少度都看不出差别，就叫对称。边界：镜子只反射外观，物理对称还涉及定律形式。\n<\/li><li>\n<strong>实例<\/strong>：晶体只能有 2、3、4、6 重旋转对称，不能有 5 重——这是晶格平移周期的数学限制。准晶的发现打破了这条“规律”，并因此获得诺贝尔奖。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对称只是美学问题——它决定了哪些守恒量存在。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n诺特定理连接的是？\n<ul>\n<li>\nA. 对称与守恒\n<\/li><li>\nB. 能量与温度\n<\/li><li>\nC. 质量与引力\n<\/li><li>\nD. 熵与时间\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：连续对称对应守恒量。\n<\/li><li>\n对称操作的定义是？\n<\/li><li>\nA. 看起来漂亮\n<\/li><li>\nB. 使对象保持不变的变换\n<\/li><li>\nC. 左右相同\n<\/li><li>\nD. 重复图案\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：核心是“变换下不变”。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n对称 = 变换下不变\n<\/li><li>\n诺特定理：对称→守恒\n<\/li><li>\n对称度可计量\n<\/ul>", "kind": "chapter", "title": "第 6 章 对称：美的量化"}, "ch07": {"html": "<h1>第 7 章：量子：认识的简化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明量子化与不确定性的含义\n<\/li><li>\n能解释量子力学为何“简化”了认识\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>微观世界的能量与状态是分立的（量子化），位置与动量不能同时精确（不确定性）；这两条把复杂的连续图像简化成可数的状态。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：量子化（难度：进阶）<\/h3>\n<p>能量以普朗克常数为单位成块交换。原子只能处在特定能级，光谱线因此是分立的。<strong>量子<\/strong>（quantum）就是不可再分的最小份额。<\/p>\n<h3>概念 2：不确定性（难度：高难）<\/h3>\n<p>位置与动量的不确定度乘积有下限（ħ/2）。这不是仪器不够好，而是共轭量在原理上不能同时确定。<\/p>\n<h3>概念 3：简化（难度：进阶）<\/h3>\n<p>分立状态让计算变得可数：原子只有有限个能级，分子只有有限种振动模式。复杂系统因此能被离散化处理，半导体、激光、核磁共振都由此而来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;量子化&quot;]\n  n2[&quot;不确定性&quot;]\n  n1 --&gt; n2\n  n3[&quot;简化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像楼梯而不是斜坡：只能站在某一级，不能停在半空。边界：楼梯的级是固定的，量子态还可能是叠加。\n<\/li><li>\n<strong>实例<\/strong>：氢原子光谱的巴尔末系波长可按能级差算出，与观测吻合。分立的线，是量子化最直接的证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不确定性是“测不准因为仪器差”——它是原理性的共轭量限制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n量子化的含义是？\n<ul>\n<li>\nA. 能量连续\n<\/li><li>\nB. 能量以最小份额成块交换\n<\/li><li>\nC. 粒子不可分\n<\/li><li>\nD. 波粒二象\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：分立份额是核心。\n<\/li><li>\n不确定性原理说的是？\n<\/li><li>\nA. 仪器精度不足\n<\/li><li>\nB. 共轭量不能同时精确\n<\/li><li>\nC. 测量会改变结果\n<\/li><li>\nD. 粒子会消失\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是原理性限制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n能量成块\n<\/li><li>\n共轭量不可同时精确\n<\/li><li>\n分立使计算可数\n<\/ul>", "kind": "chapter", "title": "第 7 章 量子：认识的简化"}, "ch08": {"html": "<h1>第 8 章：宇宙：真实的纵览<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明宇宙膨胀的证据\n<\/li><li>\n能指出“大爆炸”不是“在空间中爆炸”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>星系越远退行越快，说明宇宙在膨胀；把时间反推，得到一个高温高密的起点，这就是大爆炸的含义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：望远镜扩大宇宙（难度：基础）<\/h3>\n<p>赫歇尔把“磨盘状星团”的宇宙扩大到远超想象；哈勃在 1920 年代测出星系距离与红移的关系，宇宙尺度再次改写。<\/p>\n<h3>概念 2：膨胀（难度：进阶）<\/h3>\n<p>哈勃定律：退行速度与距离成正比。<strong>红移<\/strong>（redshift）是光被拉长的结果，说明星系在远离。没有中心，每一点都看到同样的远离。<\/p>\n<h3>概念 3：大爆炸的含义（难度：进阶）<\/h3>\n<p>它不是“在已有空间里炸开”，而是空间本身从高温高密状态膨胀。宇宙微波背景是这一状态留下的余温。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;望远镜扩大宇宙&quot;]\n  n2[&quot;膨胀&quot;]\n  n1 --&gt; n2\n  n3[&quot;大爆炸的含义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像葡萄干面包在烤箱里发起来：每颗葡萄干都看到别人远离，没有中心。边界：面包有外部空间，宇宙没有。\n<\/li><li>\n<strong>实例<\/strong>：哈勃常数约 70 km/s/Mpc；距离每增加 1 百万秒差距，退行速度增加约 70 公里/秒。这个线性关系是膨胀的直接证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大爆炸有一个“爆炸中心”——膨胀发生在每一点，没有中心。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n宇宙膨胀的直接证据是？\n<ul>\n<li>\nA. 红移与距离成正比\n<\/li><li>\nB. 恒星颜色\n<\/li><li>\nC. 行星轨道\n<\/li><li>\nD. 潮汐\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：哈勃定律是核心证据。\n<\/li><li>\n大爆炸的正确理解是？\n<\/li><li>\nA. 在空间某点炸开\n<\/li><li>\nB. 空间本身从高温高密状态膨胀\n<\/li><li>\nC. 星系互相撞击\n<\/li><li>\nD. 恒星爆炸\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：没有中心，膨胀处处发生。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n红移-距离线性关系\n<\/li><li>\n无中心的膨胀\n<\/li><li>\nCMB 是余温\n<\/ul>", "kind": "chapter", "title": "第 8 章 宇宙：真实的纵览"}, "ch09": {"html": "<h1>第 9 章：时空：互作用的舞台<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明相对论为什么必须放弃绝对时空\n<\/li><li>\n能解释“引力是时空弯曲”的意思\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>光速不变迫使时间与空间成为相对的；引力不是力，而是质量-能量让时空弯曲，物体沿弯曲时空的短程线运动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：绝对时空的崩塌（难度：进阶）<\/h3>\n<p>伽利略变换假设时间绝对、长度不变；但迈克耳孙-莫雷实验显示光速不随观察者运动改变。爱因斯坦选择保留光速不变，放弃绝对同时性。<\/p>\n<h3>概念 2：弯曲时空（难度：高难）<\/h3>\n<p>质量-能量弯曲时空，物体自由运动沿<strong>短程线<\/strong>（geodesic）。水星近日点进动、光线偏折、引力红移都是这一几何的图像。<\/p>\n<h3>概念 3：舞台变成演员（难度：进阶）<\/h3>\n<p>在牛顿力学里，时空是背景；在广义相对论里，时空参与相互作用，会被物质改变，也会反过来影响物质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;绝对时空的崩塌&quot;]\n  n2[&quot;弯曲时空&quot;]\n  n1 --&gt; n2\n  n3[&quot;舞台变成演员&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像在蹦床上放一个重球：床面凹陷，旁边的小球沿着凹陷滚过去。边界：蹦床是二维弹性膜，时空是四维流形。\n<\/li><li>\n<strong>实例<\/strong>：水星近日点每百年多进动约 43 角秒，牛顿理论算不出，广义相对论算得正好。一个数字定胜负。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相对论说“一切都是相对的”——光速与物理定律的形式恰恰是不变的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n狭义相对论的出发点是？\n<ul>\n<li>\nA. 光速不变\n<\/li><li>\nB. 绝对时间\n<\/li><li>\nC. 以太存在\n<\/li><li>\nD. 引力是力\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：光速不变迫使时空相对化。\n<\/li><li>\n广义相对论中引力的本质是？\n<\/li><li>\nA. 超距作用\n<\/li><li>\nB. 时空弯曲\n<\/li><li>\nC. 电磁力\n<\/li><li>\nD. 弱力\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：物体沿弯曲时空的短程线运动。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n光速不变 → 时空相对\n<\/li><li>\n引力 = 时空弯曲\n<\/li><li>\n时空从背景变成参与者\n<\/ul>", "kind": "chapter", "title": "第 9 章 时空：互作用的舞台"}, "ch10": {"html": "<h1>第 10 章：数学：理性的局限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明哥德尔不完备定理的内容\n<\/li><li>\n能解释“数学有效得不可思议”这一困惑\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>任何足够强的形式系统都存在无法在系统内证明的真命题；数学的可靠性有边界，但它对自然的描述力又超出预期。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：不完备（难度：高难）<\/h3>\n<p><strong>哥德尔不完备定理<\/strong>（Gödel&#x27;s incompleteness theorems）：足够强、可递归公理化的系统中，存在既不能证明也不能否证的命题；系统也无法在内部证明自身一致性。<\/p>\n<h3>概念 2：理性的边界（难度：进阶）<\/h3>\n<p>这不是“数学错了”，而是“形式化有极限”。罗素说“数学是我们不知道自己在说什么的学科”，讲的正是形式系统与意义之间的缝隙。<\/p>\n<h3>概念 3：有效性之谜（难度：高难）<\/h3>\n<p>为什么为纯粹好奇发明的数学，几十年后能精确描述物理？维格纳称之为“不可思议的有效性”。阿特金斯的态度是：这是经验事实，没有最终解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;不完备&quot;]\n  n2[&quot;理性的边界&quot;]\n  n1 --&gt; n2\n  n3[&quot;有效性之谜&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一张地图画得再细，也画不出“这张地图本身”：系统无法把自己完整装进自己。边界：地图可以另画一张，数学系统不能跳出自身。\n<\/li><li>\n<strong>实例<\/strong>：把“本句不可证”编码进算术，就得到一个真但不可证的命题。这是不完备定理的直观版本。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不完备定理否定了数学——它限定的是形式系统的能力，不是数学的价值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔不完备定理说的是？\n<ul>\n<li>\nA. 数学全错\n<\/li><li>\nB. 足够强的系统中存在不可判定的真命题\n<\/li><li>\nC. 所有命题都可证\n<\/li><li>\nD. 数学依赖实验\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可证性有边界，不是全错。\n<\/li><li>\n“不可思议的有效性”指的是？\n<\/li><li>\nA. 数学太难\n<\/li><li>\nB. 纯粹数学常能精确描述物理\n<\/li><li>\nC. 物理不需要数学\n<\/li><li>\nD. 数学不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：维格纳的困惑：为何抽象工具如此适配。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n不完备：可证性有边界\n<\/li><li>\n一致性不能在内部证明\n<\/li><li>\n数学有效性仍是谜\n<\/ul>", "kind": "chapter", "title": "第 10 章 数学：理性的局限"}, "c01": {"html": "<h1>能量与熵：一对方向相反的概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能量管“有多少、怎么转换”，熵管“往哪个方向、还能用多少”。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“变化”拆成两个独立问题：守恒与方向。缺任一条，热机、生命、宇宙都讲不通。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>能量：封闭系统总量不变，形式可变。<\/p>\n<p>熵：孤立系统不减，可用能减少。<\/p>\n<p>合起来：能量守恒告诉你“不会凭空产生”，熵增告诉你“不能全部回收”。<\/p>\n<p>生命是开放系统：局部降熵，整体增熵。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增与能量守恒矛盾——一个管总量，一个管可用性。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>能量<\/td><td>守恒<\/td><\/tr><tr><td>ch04<\/td><td>熵<\/td><td>方向<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n时间箭头、热机\n<\/ul>", "kind": "concept", "title": "能量与熵：一对方向相反的概念"}, "c02": {"html": "<h1>对称与守恒<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一种连续对称变换对应一条守恒定律。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“物理定律为什么长这样”从经验总结变成结构必然，也是现代理论构造的指导原则。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>时间平移 → 能量守恒。<\/p>\n<p>空间平移 → 动量守恒。<\/p>\n<p>旋转 → 角动量守恒。<\/p>\n<p>方法：想找守恒量，先找系统的对称性；想破坏守恒，就引入显式破缺。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对称只是视觉概念——它是定律层面的结构。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>对称<\/td><td>诺特定理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n能量与熵、量子\n<\/ul>", "kind": "concept", "title": "对称与守恒"}, "c03": {"html": "<h1>抽象阶梯<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 03 章、第 05 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>科学进步常表现为换一层更抽象的表述，让原本不可比的现象变得可算。<\/p>\n<h2>为什么重要<\/h2>\n<p>阿特金斯全书的方法：能量把运动与热统一，原子把无穷物质还原为有限元素，数学把规律形式化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>第一层：现象描述（热、颜色、运动）。<\/p>\n<p>第二层：可通约的量（能量、原子量、频率）。<\/p>\n<p>第三层：形式结构（守恒律、对称群、公理系统）。<\/p>\n<p>每上一层，解释力增强，直观性下降。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为抽象就是远离现实——抽象是把不同现实接到同一把尺子上。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>能量<\/td><td>可通约<\/td><\/tr><tr><td>ch05<\/td><td>原子<\/td><td>还原<\/td><\/tr><tr><td>ch10<\/td><td>数学<\/td><td>形式化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n对称与守恒、数学的边界\n<\/ul>", "kind": "concept", "title": "抽象阶梯"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：进化：复杂性的萌芽<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 进化：复杂性的萌芽<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：DNA：生物学的理性化<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 DNA：生物学的理性化<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：能量：计量的普遍化<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 能量：计量的普遍化<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：熵：变化发生的源泉<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 熵：变化发生的源泉<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：原子：物质的产生<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 原子：物质的产生<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：对称：美的量化<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 对称：美的量化<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：量子：认识的简化<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 量子：认识的简化<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：宇宙：真实的纵览<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 宇宙：真实的纵览<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：时空：互作用的舞台<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 时空：互作用的舞台<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：数学：理性的局限<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 数学：理性的局限<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q21.<\/b> 下列哪一组概念回答的是“变化往哪走”？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 能量与动量<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 熵与时间箭头<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 原子与周期表<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 对称与群<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q22.<\/b> 诺特定理说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 对称是美学<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 连续对称对应守恒定律<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 能量不守恒<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 量子不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q23.<\/b> 哥德尔定理限制的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 实验精度<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 形式系统的可证性<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 光速<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 熵增<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章 进化：复杂性的萌芽<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自然选择的三要素不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 变异<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 遗传<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 选择<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 设计<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 进化产生笨拙结构的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 设计失误<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 每步只需局部有效，不追求最优<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 基因太少<\ -q1' value='2'> 质量与引力<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> 熵与时间<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对称操作的定义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q2' value='0'> 看起来漂亮<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='1'> 使对象保持不变的变换<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='2'> 左右相同<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='3'> 重复图案<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章 量子：认识的简化<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 量子化的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 能量连续<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 能量以最小份额成块交换<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 粒子不可分<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 波粒二象<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 不确定性原理说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 仪器精度不足<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 共轭量不能同时精确<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 测量会改变结果<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 粒子会消失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章 宇宙：真实的纵览<\/h1><div class='quiz-item' data-qid='ch08-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 宇宙膨胀的直接证据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q1' value='0'> 红移与距离成正比<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='1'> 恒星颜色<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='2'> 行星轨道<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='3'> 潮汐<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 大爆炸的正确理解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q2' value='0'> 在空间某点炸开<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='1'> 空间本身从高温高密状态膨胀<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='2'> 星系互相撞击<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='3'> 恒星爆炸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章 时空：互作用的舞台<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 狭义相对论的出发点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 光速不变<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 绝对时间<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 以太存在<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 引力是力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 广义相对论中引力的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q2' value='0'> 超距作用<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='1'> 时空弯曲<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 电磁力<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 弱力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章 数学：理性的局限<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 哥德尔不完备定理说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 数学全错<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 足够强的系统中存在不可判定的真命题<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 所有命题都可证<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 数学依赖实验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> “不可思议的有效性”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q2' value='0'> 数学太难<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='1'> 纯粹数学常能精确描述物理<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='2'> 物理不需要数学<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='3'> 数学不可靠<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='自然选择'>自然选择 — 变异、遗传与差异存活的累积机制 <span class=glossary-ref>（第 1 章 进化：复杂性的萌芽）<\/span><\/li><li data-term='双螺旋'>双螺旋 — DNA 的两条互补链结构 <span class=glossary-ref>（第 2 章 DNA：生物学的理性化）<\/span><\/li><li data-term='能量'>能量 — 不同形式变化的统一度量 <span class=glossary-ref>（第 3 章 能量：计量的普遍化）<\/span><\/li><li data-term='熵'>熵 — 能量分散程度与不可用性的度量 <span class=glossary-ref>（第 4 章 熵：变化发生的源泉）<\/span><\/li><li data-term='时间箭头'>时间箭头 — 宏观演化偏向熵增的方向 <span class=glossary-ref>（第 4 章 熵：变化发生的源泉）<\/span><\/li><li data-term='周期表'>周期表 — 按原子序数与电子结构排列的元素表 <span class=glossary-ref>（第 5 章 原子：物质的产生）<\/span><\/li><li data-term='对称操作'>对称操作 — 使对象保持不变的变换 <span class=glossary-ref>（第 6 章 对称：美的量化）<\/span><\/li><li data-term='诺特定理'>诺特定理 — 连续对称对应守恒定律 <span class=glossary-ref>（第 6 章 对称：美的量化）<\/span><\/li><li data-term='量子化'>量子化 — 能量与状态取分立值 <span class=glossary-ref>（第 7 章 量子：认识的简化）<\/span><\/li><li data-term='不确定性原理'>不确定性原理 — 共轭量不能同时精确 <span class=glossary-ref>（第 7 章 量子：认识的简化）<\/span><\/li><li data-term='红移'>红移 — 光被拉长、频率降低 <span class=glossary-ref>（第 8 章 宇宙：真实的纵览）<\/span><\/li><li data-term='短程线'>短程线 — 弯曲时空中最长的固有时路径 <span class=glossary-ref>（第 9 章 时空：互作用的舞台）<\/span><\/li><li data-term='不完备定理'>不完备定理 — 足够强系统中存在不可判定命题 <span class=glossary-ref>（第 10 章 数学：理性的局限）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>伽利略的手指 模式与框架库<\/h1>\n<h2>分析框架：十根手指的串联<\/h2>\n<p>问四个问题把十章串起来：①复杂性从哪来（进化、DNA）？②变化靠什么驱动、往哪走（能量、熵）？③物质由什么构成、受什么约束（原子、对称、量子）？④大尺度与理性的边界在哪（宇宙、时空、数学）？四问能恢复全书骨架。<\/p>\n<h2>决策规则：遇到“新理论解释旧现象”<\/h2>\n<p>if 新理论给出可定量检验的差异 then 用观测裁决（如水星进动 43 角秒） else if 只给出定性重述 then 视为哲学重构，不是科学替代<\/p>\n<h2>反模式：把熵增当成“宇宙末日”<\/h2>\n<p>熵增只约束孤立系统；开放系统可以局部降熵。生命、城市、文明都是靠能量流维持的低熵岛。<\/p>\n<h2>反模式：把对称当装饰<\/h2>\n<p>对称在物理中是守恒的来源。只谈“对称很美”而不谈守恒量，是把结构降格为外观。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>十支柱<\/td><td>进化 / DNA / 能量 / 熵 / 原子 / 对称 / 量子 / 宇宙 / 时空 / 数学<\/td><\/tr><tr><td>1 卡<\/td><td>≈ 4.18 焦<\/td><\/tr><tr><td>诺特对应<\/td><td>时间→能量，空间→动量，旋转→角动量<\/td><\/tr><tr><td>哈勃定律<\/td><td>v = H d，H≈70 km/s/Mpc<\/td><\/tr><tr><td>水星进动<\/td><td>每百年约 43 角秒<\/td><\/tr><tr><td>不确定性<\/td><td>Δx·Δp ≥ ħ/2<\/td><\/tr><tr><td>不完备<\/td><td>强系统内有不可判定命题<\/td><\/tr><tr><td>晶体对称<\/td><td>只能 2、3、4、6 重（准晶例外）<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/10-伽利略的手指", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 进化：复杂性的萌芽", "href": "#/chapter/ch01"}, {"label": "第 2 章 DNA：生物学的理性化", "href": "#/chapter/ch02"}, {"label": "第 3 章 能量：计量的普遍化", "href": "#/chapter/ch03"}, {"label": "第 4 章 熵：变化发生的源泉", "href": "#/chapter/ch04"}, {"label": "第 5 章 原子：物质的产生", "href": "#/chapter/ch05"}, {"label": "第 6 章 对称：美的量化", "href": "#/chapter/ch06"}, {"label": "第 7 章 量子：认识的简化", "href": "#/chapter/ch07"}, {"label": "第 8 章 宇宙：真实的纵览", "href": "#/chapter/ch08"}, {"label": "第 9 章 时空：互作用的舞台", "href": "#/chapter/ch09"}, {"label": "第 10 章 数学：理性的局限", "href": "#/chapter/ch10"}]}, {"label": "概念", "children": [{"label": "能量与熵：一对方向相反的概念", "href": "#/concept/c01"}, {"label": "对称与守恒", "href": "#/concept/c02"}, {"label": "抽象阶梯", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 进化：复杂性的萌芽", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 DNA：生物学的理性化", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 能量：计量的普遍化", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 熵：变化发生的源泉", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 原子：物质的产生", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 对称：美的量化", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 量子：认识的简化", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 宇宙：真实的纵览", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 时空：互作用的舞台", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 数学：理性的局限", "href": "#/quiz/ch10"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：进化：复杂性的萌芽<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自然选择如何在不设目标的情况下产生复杂性\n<\/li><li>\n能指出“进化=进步”这一说法的错误\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂性不需要设计者：变异提供材料，选择保留有效者，累积起来就是适应。进化的方向是“当时有效”，不是“越来越好”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从神话到机制（难度：基础）<\/h3>\n<p>各文明都有生命起源的神话：骨灰长出葡萄、牙齿长出玉米。这些解释的共同点是“用已知的东西类比未知”。达尔文的贡献不是提出“变化”，而是给出一个不需要意图的机制。<\/p>\n<h3>概念 2：三要素（难度：进阶）<\/h3>\n<p><strong>变异<\/strong>（个体差异）、<strong>遗传<\/strong>（差异可传递）、<strong>选择<\/strong>（差异影响存活与繁殖）。三者同时成立，种群就会改变。缺任一项，进化停摆。<\/p>\n<h3>概念 3：复杂性的累积（难度：进阶）<\/h3>\n<p>每一步只要求“比上一代稍微有效”，不要求“最优”。复杂器官是无数次小改进的叠加，不是一次跳跃。这也是为什么进化会产生“能用但笨拙”的结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从神话到机制&quot;]\n  n2[&quot;三要素&quot;]\n  n1 --&gt; n2\n  n3[&quot;复杂性的累积&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像没有设计师的桥梁：每代工匠只改一处，能过河就保留，几百年后结构复杂得看不出起点。边界：工匠有意图，选择没有。\n<\/li><li>\n<strong>实例<\/strong>：细菌在抗生素压力下，耐药突变被保留；停药后耐药株可能因代价高而减少。同一机制，方向随环境翻转。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为进化等于进步——它只保证“当前环境下的繁殖成功”，不保证更复杂或更聪明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自然选择的三要素不包括？\n<ul>\n<li>\nA. 变异\n<\/li><li>\nB. 遗传\n<\/li><li>\nC. 选择\n<\/li><li>\nD. 设计\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：选择无需设计者。\n<\/li><li>\n进化产生笨拙结构的原因是？\n<\/li><li>\nA. 设计失误\n<\/li><li>\nB. 每步只需局部有效，不追求最优\n<\/li><li>\nC. 基因太少\n<\/li><li>\nD. 环境不变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：局部改进的累积会留下历史包袱。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n变异+遗传+选择\n<\/li><li>\n方向是局部有效\n<\/li><li>\n复杂性靠累积\n<\/ul>", "ch02": "<h1>第 2 章：DNA：生物学的理性化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明孟德尔定律与 DNA 结构的关系\n<\/li><li>\n能解释“生物学理性化”指什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 双螺旋把遗传从“神秘的力量”变成“可读的序列 + 可复制的化学”，生物学由此获得像物理一样的机制解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：孟德尔的遗产（难度：基础）<\/h3>\n<p>孟德尔用豌豆杂交发现分离与自由组合定律：性状由成对的“因子”决定，可隐可显。他的工作是统计的，不是分子的。<\/p>\n<h3>概念 2：双螺旋（难度：进阶）<\/h3>\n<p>沃森与克里克的结构模型给出两条关键：碱基配对（A-T、C-G）保证复制精确；磷酸-糖骨架保证序列稳定。结构一确定，复制、转录、突变的机制都能接上。<\/p>\n<h3>概念 3：理性化（难度：进阶）<\/h3>\n<p>在此之前，遗传是“黑箱”；之后，每个遗传现象都能追到序列层面的操作。这不是说生物学变成物理，而是它有了可拆解、可干预的机制层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;孟德尔的遗产&quot;]\n  n2[&quot;双螺旋&quot;]\n  n1 --&gt; n2\n  n3[&quot;理性化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把口传的族谱变成可扫描的档案：原先只能看结果，现在能查每一条记录。边界：档案会丢失，DNA 也会突变。\n<\/li><li>\n<strong>实例<\/strong>：镰状细胞贫血：一个碱基替换导致谷氨酸变缬氨酸，蛋白聚合，红细胞变形。一个字母的改变，整条表型链改变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因决定一切——序列提供可能，表达依赖环境与调控。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDNA 结构解决的两个核心问题是？\n<ul>\n<li>\nA. 复制与序列稳定\n<\/li><li>\nB. 能量与熵\n<\/li><li>\nC. 对称与守恒\n<\/li><li>\nD. 波长与频率\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：配对保证复制，骨架保证稳定。\n<\/li><li>\n“生物学理性化”指的是？\n<\/li><li>\nA. 生物学变成数学\n<\/li><li>\nB. 遗传现象可追到分子机制\n<\/li><li>\nC. 放弃实验\n<\/li><li>\nD. 只研究DNA\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：黑箱变成可拆解的机制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n孟德尔：统计层\n<\/li><li>\n双螺旋：分子层\n<\/li><li>\n一个碱基可改变表型\n<\/ul>", "ch03": "<h1>第 3 章：能量：计量的普遍化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明能量守恒的内容与边界\n<\/li><li>\n能指出“能量”为什么是可通约的\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>能量是把各种变化（运动、热、化学、电）换算成同一单位的工具；守恒定律说总量不变，变化只是形式转换。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从亚里士多德到力学（难度：基础）<\/h3>\n<p>亚里士多德用“空气漩涡推动箭”解释飞行，两千年后被牛顿的惯性定律取代。阿特金斯用这个例子说明：错误的理论往往也能“解释”，但经不起定量检验。<\/p>\n<h3>概念 2：可通约性（难度：进阶）<\/h3>\n<p>焦耳测出机械功与热的换算关系（1 卡 ≈ 4.18 焦），把“热”与“做功”接到同一把尺子上。<strong>能量<\/strong>（energy）因此成为跨领域的通货。<\/p>\n<h3>概念 3：守恒的边界（难度：进阶）<\/h3>\n<p>封闭系统的总能量不变；开放系统可以交换。说“消耗能量”其实不准确，能量只是转成了不易利用的形式（见下一章熵）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从亚里士多德到力学&quot;]\n  n2[&quot;可通约性&quot;]\n  n1 --&gt; n2\n  n3[&quot;守恒的边界&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把不同货币换成同一单位记账：不是钱变多了，是账能算了。边界：汇率会变，能量换算系数是固定的。\n<\/li><li>\n<strong>实例<\/strong>：把 1 千克物体举高 1 米，约需 9.8 焦；把 1 克水升温 1 摄氏度，约需 4.18 焦。两个完全不同的过程，可用同一单位比较。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“消耗能量”是能量消失——它转成了热、声、形变等分散形式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n能量概念的核心作用是？\n<ul>\n<li>\nA. 制造能量\n<\/li><li>\nB. 把不同形式的变化换算成同一单位\n<\/li><li>\nC. 解释引力\n<\/li><li>\nD. 测量温度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可通约是它的方法论价值。\n<\/li><li>\n“消耗能量”更准确的说法是？\n<\/li><li>\nA. 能量消失\n<\/li><li>\nB. 能量转为不易利用的形式\n<\/li><li>\nC. 能量变成质量\n<\/li><li>\nD. 能量被存储\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：总量守恒，可用性下降。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n能量 = 变化的通货\n<\/li><li>\n焦耳换算：1 卡≈4.18 焦\n<\/li><li>\n消耗 = 降级，不是消失\n<\/ul>", "ch04": "<h1>第 4 章：熵：变化发生的源泉<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明熵增原理的内容\n<\/li><li>\n能解释为什么熵增给了时间方向\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>熵是能量分散程度的度量；孤立系统的熵不会减少，因此变化有方向——这就是时间箭头的物理来源。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：蒸汽机（难度：基础）<\/h3>\n<p>蒸汽机把热转为功，效率受冷热两端温差限制。卡诺与克劳修斯从这台机器里抽出<strong>熵<\/strong>（entropy）：可用的能量在每次转换中都会减少一部分。<\/p>\n<h3>概念 2：分散度（难度：进阶）<\/h3>\n<p>熵可理解为“能量分布在多少种方式上”。方式越多，熵越大。一杯热水与室温空气最终同温，是因为热量分散的方式变多了。<\/p>\n<h3>概念 3：时间箭头（难度：进阶）<\/h3>\n<p>微观方程大多时间可逆，但宏观演化偏向熵增。<strong>时间箭头<\/strong>（arrow of time）不是基本定律，而是统计结论：从低熵初始态出发，熵大的状态数目远多于熵小的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;蒸汽机&quot;]\n  n2[&quot;分散度&quot;]\n  n1 --&gt; n2\n  n3[&quot;时间箭头&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一副新牌越洗越乱：洗牌规则可逆，但“乱”的方式远多于“有序”。边界：牌可以按规则复原，孤立系统的熵不会自发下降。\n<\/li><li>\n<strong>实例<\/strong>：把墨水滴进水里会扩散，不会自发聚回一滴。扩散后分子排列方式的数量远大于聚集态，因此熵增。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增意味着“宇宙必然混乱到死”——局部可以变得更有序，只要整体熵增（生命就是这样的局部）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n熵增原理适用于？\n<ul>\n<li>\nA. 所有系统\n<\/li><li>\nB. 孤立系统\n<\/li><li>\nC. 生命体\n<\/li><li>\nD. 发动机\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：孤立系统的熵不减；开放系统可局部降熵。\n<\/li><li>\n时间箭头的来源是？\n<\/li><li>\nA. 基本方程不可逆\n<\/li><li>\nB. 统计上熵大的状态占绝对多数\n<\/li><li>\nC. 人的错觉\n<\/li><li>\nD. 引力\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：宏观方向来自统计，而非微观定律。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n熵 = 能量分散度\n<\/li><li>\n孤立系统熵不减\n<\/li><li>\n时间箭头是统计结论\n<\/ul>", "ch05": "<h1>第 5 章：原子：物质的产生<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明周期表按什么排列\n<\/li><li>\n能解释“原子论”为什么是解释而非描述\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>物质由有限种类的原子组成，原子的电子结构决定化学性质；周期表把这种结构排成可预测的图。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从元素到原子（难度：基础）<\/h3>\n<p>古希腊的四元素、中国的五行都是定性分类。道尔顿把“元素”变成有重量的原子，门捷列夫按原子量排列，留下空格并预言未知元素。<\/p>\n<h3>概念 2：电子结构（难度：进阶）<\/h3>\n<p>化学性质主要由最外层电子决定。同一族元素最外层电子数相同，因此性质相似。周期表的“列”比“行”更能解释化学。<\/p>\n<h3>概念 3：解释力（难度：进阶）<\/h3>\n<p>原子论的价值在于：把无穷多种物质还原为有限种原子的组合，把化学从分类学变成结构学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从元素到原子&quot;]\n  n2[&quot;电子结构&quot;]\n  n1 --&gt; n2\n  n3[&quot;解释力&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用有限字母拼出无限单词：26 个字母，词库无限。边界：字母不随语境变形，原子会成键。\n<\/li><li>\n<strong>实例<\/strong>：钠（最外层 1 个电子）与氯（最外层 7 个电子）结合成食盐；同族的钾与溴行为类似。周期性由此可预测。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为周期表只是分类表——它按电子结构排列，能预测未发现元素的性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n周期表的排列依据是？\n<ul>\n<li>\nA. 颜色\n<\/li><li>\nB. 原子序数与电子结构\n<\/li><li>\nC. 密度\n<\/li><li>\nD. 熔点\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：电子结构决定族与周期性。\n<\/li><li>\n化学性质主要由什么决定？\n<\/li><li>\nA. 原子核质量\n<\/li><li>\nB. 最外层电子\n<\/li><li>\nC. 中子数\n<\/li><li>\nD. 颜色\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：成键与反应涉及外层电子。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有限原子，无限组合\n<\/li><li>\n周期表按电子结构\n<\/li><li>\n同族性质相似\n<\/ul>", "ch06": "<h1>第 6 章：对称：美的量化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明对称操作的定义\n<\/li><li>\n能解释对称与守恒定律的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对称不是“好看”，而是“某种变换下不变”；每一种连续对称都对应一条守恒定律。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：对称操作（难度：进阶）<\/h3>\n<p>球体绕任意轴转任意角度都不变，因此对称性最高；正方形只能转 90 度倍数。<strong>对称操作<\/strong>（symmetry operation）就是使对象不变的那些变换。<\/p>\n<h3>概念 2：诺特定理（难度：高难）<\/h3>\n<p><strong>诺特定理<\/strong>（Noether&#x27;s theorem）：时间平移对称 → 能量守恒；空间平移对称 → 动量守恒；旋转对称 → 角动量守恒。守恒定律不是经验巧合，而是对称性的数学结果。<\/p>\n<h3>概念 3：美的量化（难度：进阶）<\/h3>\n<p>对称度可用“不变变换的数量”衡量。这给了“美”一个可计算的定义，也解释了物理学家为何偏爱对称的理论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;对称操作&quot;]\n  n2[&quot;诺特定理&quot;]\n  n1 --&gt; n2\n  n3[&quot;美的量化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一面能照出所有角度的镜子：转多少度都看不出差别，就叫对称。边界：镜子只反射外观，物理对称还涉及定律形式。\n<\/li><li>\n<strong>实例<\/strong>：晶体只能有 2、3、4、6 重旋转对称，不能有 5 重——这是晶格平移周期的数学限制。准晶的发现打破了这条“规律”，并因此获得诺贝尔奖。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对称只是美学问题——它决定了哪些守恒量存在。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n诺特定理连接的是？\n<ul>\n<li>\nA. 对称与守恒\n<\/li><li>\nB. 能量与温度\n<\/li><li>\nC. 质量与引力\n<\/li><li>\nD. 熵与时间\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：连续对称对应守恒量。\n<\/li><li>\n对称操作的定义是？\n<\/li><li>\nA. 看起来漂亮\n<\/li><li>\nB. 使对象保持不变的变换\n<\/li><li>\nC. 左右相同\n<\/li><li>\nD. 重复图案\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：核心是“变换下不变”。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n对称 = 变换下不变\n<\/li><li>\n诺特定理：对称→守恒\n<\/li><li>\n对称度可计量\n<\/ul>", "ch07": "<h1>第 7 章：量子：认识的简化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明量子化与不确定性的含义\n<\/li><li>\n能解释量子力学为何“简化”了认识\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>微观世界的能量与状态是分立的（量子化），位置与动量不能同时精确（不确定性）；这两条把复杂的连续图像简化成可数的状态。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：量子化（难度：进阶）<\/h3>\n<p>能量以普朗克常数为单位成块交换。原子只能处在特定能级，光谱线因此是分立的。<strong>量子<\/strong>（quantum）就是不可再分的最小份额。<\/p>\n<h3>概念 2：不确定性（难度：高难）<\/h3>\n<p>位置与动量的不确定度乘积有下限（ħ/2）。这不是仪器不够好，而是共轭量在原理上不能同时确定。<\/p>\n<h3>概念 3：简化（难度：进阶）<\/h3>\n<p>分立状态让计算变得可数：原子只有有限个能级，分子只有有限种振动模式。复杂系统因此能被离散化处理，半导体、激光、核磁共振都由此而来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;量子化&quot;]\n  n2[&quot;不确定性&quot;]\n  n1 --&gt; n2\n  n3[&quot;简化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像楼梯而不是斜坡：只能站在某一级，不能停在半空。边界：楼梯的级是固定的，量子态还可能是叠加。\n<\/li><li>\n<strong>实例<\/strong>：氢原子光谱的巴尔末系波长可按能级差算出，与观测吻合。分立的线，是量子化最直接的证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不确定性是“测不准因为仪器差”——它是原理性的共轭量限制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n量子化的含义是？\n<ul>\n<li>\nA. 能量连续\n<\/li><li>\nB. 能量以最小份额成块交换\n<\/li><li>\nC. 粒子不可分\n<\/li><li>\nD. 波粒二象\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：分立份额是核心。\n<\/li><li>\n不确定性原理说的是？\n<\/li><li>\nA. 仪器精度不足\n<\/li><li>\nB. 共轭量不能同时精确\n<\/li><li>\nC. 测量会改变结果\n<\/li><li>\nD. 粒子会消失\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是原理性限制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n能量成块\n<\/li><li>\n共轭量不可同时精确\n<\/li><li>\n分立使计算可数\n<\/ul>", "ch08": "<h1>第 8 章：宇宙：真实的纵览<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明宇宙膨胀的证据\n<\/li><li>\n能指出“大爆炸”不是“在空间中爆炸”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>星系越远退行越快，说明宇宙在膨胀；把时间反推，得到一个高温高密的起点，这就是大爆炸的含义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：望远镜扩大宇宙（难度：基础）<\/h3>\n<p>赫歇尔把“磨盘状星团”的宇宙扩大到远超想象；哈勃在 1920 年代测出星系距离与红移的关系，宇宙尺度再次改写。<\/p>\n<h3>概念 2：膨胀（难度：进阶）<\/h3>\n<p>哈勃定律：退行速度与距离成正比。<strong>红移<\/strong>（redshift）是光被拉长的结果，说明星系在远离。没有中心，每一点都看到同样的远离。<\/p>\n<h3>概念 3：大爆炸的含义（难度：进阶）<\/h3>\n<p>它不是“在已有空间里炸开”，而是空间本身从高温高密状态膨胀。宇宙微波背景是这一状态留下的余温。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;望远镜扩大宇宙&quot;]\n  n2[&quot;膨胀&quot;]\n  n1 --&gt; n2\n  n3[&quot;大爆炸的含义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像葡萄干面包在烤箱里发起来：每颗葡萄干都看到别人远离，没有中心。边界：面包有外部空间，宇宙没有。\n<\/li><li>\n<strong>实例<\/strong>：哈勃常数约 70 km/s/Mpc；距离每增加 1 百万秒差距，退行速度增加约 70 公里/秒。这个线性关系是膨胀的直接证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大爆炸有一个“爆炸中心”——膨胀发生在每一点，没有中心。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n宇宙膨胀的直接证据是？\n<ul>\n<li>\nA. 红移与距离成正比\n<\/li><li>\nB. 恒星颜色\n<\/li><li>\nC. 行星轨道\n<\/li><li>\nD. 潮汐\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：哈勃定律是核心证据。\n<\/li><li>\n大爆炸的正确理解是？\n<\/li><li>\nA. 在空间某点炸开\n<\/li><li>\nB. 空间本身从高温高密状态膨胀\n<\/li><li>\nC. 星系互相撞击\n<\/li><li>\nD. 恒星爆炸\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：没有中心，膨胀处处发生。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n红移-距离线性关系\n<\/li><li>\n无中心的膨胀\n<\/li><li>\nCMB 是余温\n<\/ul>", "ch09": "<h1>第 9 章：时空：互作用的舞台<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明相对论为什么必须放弃绝对时空\n<\/li><li>\n能解释“引力是时空弯曲”的意思\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>光速不变迫使时间与空间成为相对的；引力不是力，而是质量-能量让时空弯曲，物体沿弯曲时空的短程线运动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：绝对时空的崩塌（难度：进阶）<\/h3>\n<p>伽利略变换假设时间绝对、长度不变；但迈克耳孙-莫雷实验显示光速不随观察者运动改变。爱因斯坦选择保留光速不变，放弃绝对同时性。<\/p>\n<h3>概念 2：弯曲时空（难度：高难）<\/h3>\n<p>质量-能量弯曲时空，物体自由运动沿<strong>短程线<\/strong>（geodesic）。水星近日点进动、光线偏折、引力红移都是这一几何的图像。<\/p>\n<h3>概念 3：舞台变成演员（难度：进阶）<\/h3>\n<p>在牛顿力学里，时空是背景；在广义相对论里，时空参与相互作用，会被物质改变，也会反过来影响物质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;绝对时空的崩塌&quot;]\n  n2[&quot;弯曲时空&quot;]\n  n1 --&gt; n2\n  n3[&quot;舞台变成演员&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像在蹦床上放一个重球：床面凹陷，旁边的小球沿着凹陷滚过去。边界：蹦床是二维弹性膜，时空是四维流形。\n<\/li><li>\n<strong>实例<\/strong>：水星近日点每百年多进动约 43 角秒，牛顿理论算不出，广义相对论算得正好。一个数字定胜负。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相对论说“一切都是相对的”——光速与物理定律的形式恰恰是不变的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n狭义相对论的出发点是？\n<ul>\n<li>\nA. 光速不变\n<\/li><li>\nB. 绝对时间\n<\/li><li>\nC. 以太存在\n<\/li><li>\nD. 引力是力\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：光速不变迫使时空相对化。\n<\/li><li>\n广义相对论中引力的本质是？\n<\/li><li>\nA. 超距作用\n<\/li><li>\nB. 时空弯曲\n<\/li><li>\nC. 电磁力\n<\/li><li>\nD. 弱力\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：物体沿弯曲时空的短程线运动。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n光速不变 → 时空相对\n<\/li><li>\n引力 = 时空弯曲\n<\/li><li>\n时空从背景变成参与者\n<\/ul>", "ch10": "<h1>第 10 章：数学：理性的局限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明哥德尔不完备定理的内容\n<\/li><li>\n能解释“数学有效得不可思议”这一困惑\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>任何足够强的形式系统都存在无法在系统内证明的真命题；数学的可靠性有边界，但它对自然的描述力又超出预期。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：不完备（难度：高难）<\/h3>\n<p><strong>哥德尔不完备定理<\/strong>（Gödel&#x27;s incompleteness theorems）：足够强、可递归公理化的系统中，存在既不能证明也不能否证的命题；系统也无法在内部证明自身一致性。<\/p>\n<h3>概念 2：理性的边界（难度：进阶）<\/h3>\n<p>这不是“数学错了”，而是“形式化有极限”。罗素说“数学是我们不知道自己在说什么的学科”，讲的正是形式系统与意义之间的缝隙。<\/p>\n<h3>概念 3：有效性之谜（难度：高难）<\/h3>\n<p>为什么为纯粹好奇发明的数学，几十年后能精确描述物理？维格纳称之为“不可思议的有效性”。阿特金斯的态度是：这是经验事实，没有最终解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;不完备&quot;]\n  n2[&quot;理性的边界&quot;]\n  n1 --&gt; n2\n  n3[&quot;有效性之谜&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一张地图画得再细，也画不出“这张地图本身”：系统无法把自己完整装进自己。边界：地图可以另画一张，数学系统不能跳出自身。\n<\/li><li>\n<strong>实例<\/strong>：把“本句不可证”编码进算术，就得到一个真但不可证的命题。这是不完备定理的直观版本。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不完备定理否定了数学——它限定的是形式系统的能力，不是数学的价值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔不完备定理说的是？\n<ul>\n<li>\nA. 数学全错\n<\/li><li>\nB. 足够强的系统中存在不可判定的真命题\n<\/li><li>\nC. 所有命题都可证\n<\/li><li>\nD. 数学依赖实验\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可证性有边界，不是全错。\n<\/li><li>\n“不可思议的有效性”指的是？\n<\/li><li>\nA. 数学太难\n<\/li><li>\nB. 纯粹数学常能精确描述物理\n<\/li><li>\nC. 物理不需要数学\n<\/li><li>\nD. 数学不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：维格纳的困惑：为何抽象工具如此适配。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n不完备：可证性有边界\n<\/li><li>\n一致性不能在内部证明\n<\/li><li>\n数学有效性仍是谜\n<\/ul>", "c01": "<h1>能量与熵：一对方向相反的概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能量管“有多少、怎么转换”，熵管“往哪个方向、还能用多少”。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“变化”拆成两个独立问题：守恒与方向。缺任一条，热机、生命、宇宙都讲不通。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>能量：封闭系统总量不变，形式可变。<\/p>\n<p>熵：孤立系统不减，可用能减少。<\/p>\n<p>合起来：能量守恒告诉你“不会凭空产生”，熵增告诉你“不能全部回收”。<\/p>\n<p>生命是开放系统：局部降熵，整体增熵。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增与能量守恒矛盾——一个管总量，一个管可用性。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>能量<\/td><td>守恒<\/td><\/tr><tr><td>ch04<\/td><td>熵<\/td><td>方向<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n时间箭头、热机\n<\/ul>", "c02": "<h1>对称与守恒<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一种连续对称变换对应一条守恒定律。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“物理定律为什么长这样”从经验总结变成结构必然，也是现代理论构造的指导原则。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>时间平移 → 能量守恒。<\/p>\n<p>空间平移 → 动量守恒。<\/p>\n<p>旋转 → 角动量守恒。<\/p>\n<p>方法：想找守恒量，先找系统的对称性；想破坏守恒，就引入显式破缺。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对称只是视觉概念——它是定律层面的结构。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>对称<\/td><td>诺特定理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n能量与熵、量子\n<\/ul>", "c03": "<h1>抽象阶梯<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 03 章、第 05 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>科学进步常表现为换一层更抽象的表述，让原本不可比的现象变得可算。<\/p>\n<h2>为什么重要<\/h2>\n<p>阿特金斯全书的方法：能量把运动与热统一，原子把无穷物质还原为有限元素，数学把规律形式化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>第一层：现象描述（热、颜色、运动）。<\/p>\n<p>第二层：可通约的量（能量、原子量、频率）。<\/p>\n<p>第三层：形式结构（守恒律、对称群、公理系统）。<\/p>\n<p>每上一层，解释力增强，直观性下降。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为抽象就是远离现实——抽象是把不同现实接到同一把尺子上。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>能量<\/td><td>可通约<\/td><\/tr><tr><td>ch05<\/td><td>原子<\/td><td>还原<\/td><\/tr><tr><td>ch10<\/td><td>数学<\/td><td>形式化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n对称与守恒、数学的边界\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：进化：复杂性的萌芽<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 进化：复杂性的萌芽<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：DNA：生物学的理性化<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 DNA：生物学的理性化<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：能量：计量的普遍化<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 能量：计量的普遍化<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：熵：变化发生的源泉<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 熵：变化发生的源泉<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：原子：物质的产生<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 原子：物质的产生<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：对称：美的量化<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 对称：美的量化<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：量子：认识的简化<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 量子：认识的简化<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：宇宙：真实的纵览<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 宇宙：真实的纵览<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：时空：互作用的舞台<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 时空：互作用的舞台<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：数学：理性的局限<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 数学：理性的局限<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q21.<\/b> 下列哪一组概念回答的是“变化往哪走”？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 能量与动量<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 熵与时间箭头<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 原子与周期表<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 对称与群<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q22.<\/b> 诺特定理说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 对称是美学<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 连续对称对应守恒定律<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 能量不守恒<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 量子不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q23.<\/b> 哥德尔定理限制的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 实验精度<\/label><label class='quiz-opt
