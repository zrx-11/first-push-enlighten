— 推动宇宙加速膨胀的成分 <span class=glossary-ref>（第 1 章 宇宙的未来）<\/span><\/li><li data-term='宜居三要素'>宜居三要素 — 液态水、能量源、化学原料 <span class=glossary-ref>（第 2 章 我们孤独吗我们在哪儿）<\/span><\/li><li data-term='朴素理论'>朴素理论 — 儿童自造的有结构的解释 <span class=glossary-ref>（第 6 章 儿童会告诉科学家什么）<\/span><\/li><li data-term='行为主义'>行为主义 — 以刺激-反应强化解释学习的流派 <span class=glossary-ref>（第 7 章 走向道德发展的理论）<\/span><\/li><li data-term='反应性'>反应性 — 测量改变被测对象的现象 <span class=glossary-ref>（第 8 章 捉摸不定的心理学）<\/span><\/li><li data-term='享乐适应'>享乐适应 — 对持续好事回到情绪基线 <span class=glossary-ref>（第 9 章 幸福的未来）<\/span><\/li><li data-term='复现'>复现 — 非线性系统能量几乎回到初态 <span class=glossary-ref>（第 11 章 费米的“小发现”和复杂性理论的未来）<\/span><\/li><li data-term='生物砖'>生物砖 — 标准化可组合的基因部件 <span class=glossary-ref>（第 14 章 第二个创生）<\/span><\/li><li data-term='泛在计算'>泛在计算 — 信息嵌入日常空间的计算形态 <span class=glossary-ref>（第 20 章 流动的信息）<\/span><\/li><li data-term='群体社会化'>群体社会化 — 同伴群体是主要社会化环境的理论 <span class=glossary-ref>（第 22 章 我们何以如此：来自2050年的观点）<\/span><\/li><li data-term='修补式医疗'>修补式医疗 — 替换或支持而非根治的治疗 <span class=glossary-ref>（第 25 章 征服疾病）<\/span><\/li><li data-term='奇点'>奇点 — 机器智能超越人且不可预测的假设时点 <span class=glossary-ref>（第 19 章 复杂性的顶点）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>未来50年 模式与框架库<\/h1>\n<h2>分析框架：预测拆解四步<\/h2>\n<ol><li>\n它属于趋势外推、情景设想还是价值判断？\n<\/li><li>\n它的关键前提是什么（曲线、参数、机制）？\n<\/li><li>\n哪个观测能推翻它？\n<\/li><li>\n如果前提不成立，结论还剩什么？\n<p>四步能把“未来学”还原成可讨论的论证。<\/p>\n<\/ol>\n<h2>决策规则：看到指数曲线先找范式<\/h2>\n<p>if 有人在推演无限指数增长 then 问：上一轮范式何时结束的？新范式靠什么？ if 答不出 then 这条曲线只是历史斜率，不是定律<\/p>\n<h2>反模式：把“读到”当“懂了”<\/h2>\n<p>测序、监测、成像都在降低“读”的成本，不降低“懂”的成本。把数据量当理解，是技术乐观论的常见漏洞。<\/p>\n<h2>反模式：把个体问题全推给个体<\/h2>\n<p>抑郁、教育、健康都受结构性因素影响。只讲“心态/努力”会遮蔽可改变的环境变量。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>宇宙三结局<\/td><td>封闭 / 开放减速 / 加速（当前支持加速）<\/td><\/tr><tr><td>宜居三要素<\/td><td>水 + 能量 + 原料<\/td><\/tr><tr><td>生命五能力<\/td><td>复制、做功、低熵、响应、进化<\/td><\/tr><tr><td>测序成本<\/td><td>下降快于摩尔定律<\/td><\/tr><tr><td>FPU 意外<\/td><td>预期热化，实际复现<\/td><\/tr><tr><td>行为主义三前提<\/td><td>刺激-反应、内部不可研究、人兽无差别（均被证伪）<\/td><\/tr><tr><td>奇点三前提<\/td><td>算力指数、智能可计算、可自我改进<\/td><\/tr><tr><td>医疗两型<\/td><td>修补（换/切/支持）vs 根治（机制干预）<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/06-未来50年", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 宇宙的未来", "href": "#/chapter/ch01"}, {"label": "第 2 章 我们孤独吗我们在哪儿", "href": "#/chapter/ch02"}, {"label": "第 3 章 2050年的数学", "href": "#/chapter/ch03"}, {"label": "第 4 章 在文化的阴影里", "href": "#/chapter/ch04"}, {"label": "第 5 章 替换大脑", "href": "#/chapter/ch05"}, {"label": "第 6 章 儿童会告诉科学家什么", "href": "#/chapter/ch06"}, {"label": "第 7 章 走向道德发展的理论", "href": "#/chapter/ch07"}, {"label": "第 8 章 捉摸不定的心理学", "href": "#/chapter/ch08"}, {"label": "第 9 章 幸福的未来", "href": "#/chapter/ch09"}, {"label": "第 10 章 50年后我们还会忧伤吗", "href": "#/chapter/ch10"}, {"label": "第 11 章 费米的“小发现”和复杂性理论的未来", "href": "#/chapter/ch11"}, {"label": "第 12 章 生命是什么", "href": "#/chapter/ch12"}, {"label": "第 13 章 小摩尔定律", "href": "#/chapter/ch13"}, {"label": "第 14 章 第二个创生", "href": "#/chapter/ch14"}, {"label": "第 15 章 预测未来", "href": "#/chapter/ch15"}, {"label": "第 16 章 肉体与机器的结合", "href": "#/chapter/ch16"}, {"label": "第 17 章 物质的未来", "href": "#/chapter/ch17"}, {"label": "第 18 章 我们会更聪明吗", "href": "#/chapter/ch18"}, {"label": "第 19 章 复杂性的顶点", "href": "#/chapter/ch19"}, {"label": "第 20 章 流动的信息", "href": "#/chapter/ch20"}, {"label": "第 21 章 思想，大脑和自我", "href": "#/chapter/ch21"}, {"label": "第 22 章 我们何以如此：来自2050年的观点", "href": "#/chapter/ch22"}, {"label": "第 23 章 药、DNA和躺椅", "href": "#/chapter/ch23"}, {"label": "第 24 章 心理疗法和穿在身上的电脑", "href": "#/chapter/ch24"}, {"label": "第 25 章 征服疾病", "href": "#/chapter/ch25"}]}, {"label": "概念", "children": [{"label": "预测的三种类型", "href": "#/concept/c01"}, {"label": "生命作为能力组合", "href": "#/concept/c02"}, {"label": "信息与意义", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 宇宙的未来", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 我们孤独吗我们在哪儿", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 2050年的数学", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 在文化的阴影里", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 替换大脑", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 儿童会告诉科学家什么", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 走向道德发展的理论", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 捉摸不定的心理学", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 幸福的未来", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 50年后我们还会忧伤吗", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章 费米的“小发现”和复杂性理论的未来", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章 生命是什么", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章 小摩尔定律", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章 第二个创生", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章 预测未来", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章 肉体与机器的结合", "href": "#/quiz/ch16"}, {"label": "测验：第 17 章 物质的未来", "href": "#/quiz/ch17"}, {"label": "测验：第 18 章 我们会更聪明吗", "href": "#/quiz/ch18"}, {"label": "测验：第 19 章 复杂性的顶点", "href": "#/quiz/ch19"}, {"label": "测验：第 20 章 流动的信息", "href": "#/quiz/ch20"}, {"label": "测验：第 21 章 思想，大脑和自我", "href": "#/quiz/ch21"}, {"label": "测验：第 22 章 我们何以如此：来自2050年的观点", "href": "#/quiz/ch22"}, {"label": "测验：第 23 章 药、DNA和躺椅", "href": "#/quiz/ch23"}, {"label": "测验：第 24 章 心理疗法和穿在身上的电脑", "href": "#/quiz/ch24"}, {"label": "测验：第 25 章 征服疾病", "href": "#/quiz/ch25"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：宇宙的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明宇宙未来的三种命运分别对应什么观测参数\n<\/li><li>\n能指出这类预测依赖的前提\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>宇宙的结局取决于暗能量的密度与性质：若它保持恒定，膨胀会一直加速，星系彼此远离，夜空越来越空。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种结局（难度：基础）<\/h3>\n<p><strong>封闭<\/strong>：引力最终拉住膨胀，宇宙回缩；<strong>开放<\/strong>：永远膨胀但减速；<strong>加速<\/strong>：暗能量主导，膨胀越来越快。1998 年超新星观测指向第三种。作者据此推演：远处星系的红移会越来越大，最终超出视界。<\/p>\n<h3>概念 2：推演的前提（难度：进阶）<\/h3>\n<p>这个结论依赖两条：暗能量的密度近似恒定（宇宙常数），以及广义相对论在大尺度上成立。任何一条被推翻，结局就要重写。所以这不是“预言”，是条件句。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三种结局&quot;]\n  n2[&quot;推演的前提&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个不断吹大的气球上的两个点：气球越大，两点离得越快。边界：气球有外部空间，宇宙膨胀没有“外面”。\n<\/li><li>\n<strong>实例<\/strong>：把哈勃常数取 70 km/s/Mpc，距离每增加 1 百万秒差距，退行速度增加 70 公里/秒。这个线性关系是“宇宙在膨胀”的最直接证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“加速膨胀”意味着我们在宇宙中心——实际上每一点都看到同样的远离，没有中心。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n当前观测支持的宇宙结局是？\n<ul>\n<li>\nA. 回缩\n<\/li><li>\nB. 减速膨胀\n<\/li><li>\nC. 加速膨胀\n<\/li><li>\nD. 静止\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：暗能量主导使膨胀加速。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种结局对应密度参数\n<\/li><li>\n加速膨胀 = 暗能量主导\n<\/li><li>\n预测是条件句，不是定论\n<\/ul>", "ch02": "<h1>第 2 章：我们孤独吗我们在哪儿<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出太阳系内几处可能存在生命的候选地点\n<\/li><li>\n能说明“探测到微生物”为何比“找到智慧信号”更可能\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>未来五十年的地外生命搜索会先从太阳系内的微生物级证据开始：火星、木卫二、土卫六；智慧信号搜索仍是最不确定的一项。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：候选地点（难度：基础）<\/h3>\n<p>火星：曾有液态水，地下可能有盐水。木卫二：冰壳下有海洋。土卫六：有有机分子与甲烷循环。三处的共同点是<strong>液态水 + 能量源 + 化学原料<\/strong>，这是目前判定宜居的操作标准。<\/p>\n<h3>概念 2：为什么先找微生物（难度：进阶）<\/h3>\n<p>微生物的痕迹（同位素比、有机分子分布）可以在样本里测出来；智慧信号要求对方恰好在我们能接收的时间窗内发送，概率小得多。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;候选地点&quot;]\n  n2[&quot;为什么先找微生物&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像在自家后院找蚂蚁：比等邻居敲门容易得多。边界：蚂蚁能找到，不等于邻居不存在。\n<\/li><li>\n<strong>实例<\/strong>：火星陨石 ALH84001 曾被认为含微生物化石痕迹，后来多数证据被质疑。这个案例说明“找到痕迹”与“确认生命”之间隔着多重独立验证。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为找到水就等于找到生命——水是必要条件，不是充分条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n目前判定“宜居”的操作标准不包括？\n<ul>\n<li>\nA. 液态水\n<\/li><li>\nB. 能量源\n<\/li><li>\nC. 化学原料\n<\/li><li>\nD. 氧气浓度\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：早期生命不需要氧气，氧不是必要条件。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三处候选：火星、木卫二、土卫六\n<\/li><li>\n先找微生物，再谈智慧\n<\/li><li>\n宜居三要素：水、能量、原料\n<\/ul>", "ch03": "<h1>第 3 章：2050年的数学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明数学发展的两个动力来源\n<\/li><li>\n能举例说明“物理理论被替换，数学留下”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数学有两个动力源：现实问题的刺激与纯粹想象；物理理论会更替，但为它发明的数学往往长期有效。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两个源头（难度：基础）<\/h3>\n<p>一边是物理、工程、经济提出的问题逼出新工具（微积分、傅里叶分析、群论）；另一边是为数学而数学的探索（数论、拓扑）。两条路经常在几十年后交汇。<\/p>\n<h3>概念 2：留下的数学（难度：进阶）<\/h3>\n<p>牛顿力学被相对论修正，但微积分没被废；弦论尚未验证，它带来的几何与代数工具已经在别处使用。这说明数学的价值不完全绑定在某个物理理论上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两个源头&quot;]\n  n2[&quot;留下的数学&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像为修一座桥发明的起重机，桥塌了起重机还能用。边界：起重机的用途有限，数学工具的迁移范围常常超出预期。\n<\/li><li>\n<strong>实例<\/strong>：黎曼为推广几何造出的弯曲空间工具，五十年后成了广义相对论的骨架；这不是为物理定制的，却精确适配。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数学只是物理的附庸——实际上它有独立的想象驱动线。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“物理理论被替换，数学留下”说明？\n<ul>\n<li>\nA. 数学比物理正确\n<\/li><li>\nB. 数学工具的价值不绑定单一理论\n<\/li><li>\nC. 物理没有用\n<\/li><li>\nD. 数学靠实验\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：工具可迁移，理论可更替。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两个动力：现实问题 + 纯粹想象\n<\/li><li>\n数学寿命常长于物理理论\n<\/li><li>\n跨领域迁移是常态\n<\/ul>", "ch04": "<h1>第 4 章：在文化的阴影里<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“阴影”指的是哪些被忽略的文化与知识\n<\/li><li>\n能解释为什么作者要“把目光从未来移开”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>预测未来的前提是看清现在；而现在的大部分被主流叙事遮住，作者要求先看清“阴影里的文化”，再谈五十年。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：阴影是什么（难度：基础）<\/h3>\n<p>指非西方、非主流、非文本化的知识传统：地方性技术、口传医学、被殖民史压掉的科学实践。它们不在期刊里，却影响着多数人的生活。<\/p>\n<h3>概念 2：为什么要回头看（难度：进阶）<\/h3>\n<p>作者认为未来学容易变成主流文化的自我投射。先把目光从未来移开，才能发现哪些“必然趋势”其实是特定文化的偏好。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;阴影是什么&quot;]\n  n2[&quot;为什么要回头看&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像拍照时只看取景框：框外的景物一样真实，只是没进画面。边界：阴影里的知识也需要检验，不能因为“非主流”就自动正确。\n<\/li><li>\n<strong>实例<\/strong>：同一场流行病，主流方案是疫苗与抗生素，地方经验可能是隔离、草药、社区互助。两者都需要证据检验，但后者常被直接忽略。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“非主流”就等于“更智慧”——它同样需要证据，只是不该被默认为无关。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n作者主张先看“阴影”的理由是？\n<ul>\n<li>\nA. 未来无法预测\n<\/li><li>\nB. 避免把主流文化的偏好当成普遍趋势\n<\/li><li>\nC. 阴影更先进\n<\/li><li>\nD. 数据不足\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：先看清现在，才能识别预测里的文化投射。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n阴影 = 被主流叙事遮住的知识\n<\/li><li>\n未来学常是文化自我投射\n<\/li><li>\n非主流也要检验\n<\/ul>", "ch05": "<h1>第 5 章：替换大脑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“逐块替换大脑”思想实验想问什么\n<\/li><li>\n能区分“同一性”与“连续性”两种标准\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>如果一块块把大脑换成人工部件，替换到哪一步“你”就不再是你？这个问题逼出的是同一性标准，而不是技术时间表。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：思想实验（难度：基础）<\/h3>\n<p>假设每次只换一小块，功能不变，记忆与性格都保留。直觉上每一步都“还是我”，但全部换完后，若说“还是我”，那“我”似乎只是模式；若说“不是我”，那从哪一步开始不是？<\/p>\n<h3>概念 2：两种标准（难度：进阶）<\/h3>\n<p><strong>同一性<\/strong>看构成材料（同一堆物质）；<strong>连续性<\/strong>看记忆、性格、因果链是否延续。前者在替换中必然断裂，后者可以一直延续。多数讨论最终落到连续性上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;思想实验&quot;]\n  n2[&quot;两种标准&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把一艘船一块木板一块木板换掉：全换完后还是原来那艘吗？边界：船没有自我意识，人有。\n<\/li><li>\n<strong>实例<\/strong>：把“替换”改成“每天换一个神经元”，一年后全部换完。若你坚持连续性标准，答案仍是“我”；若坚持材料标准，第一天之后就已经不是。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为这个问题能被神经科学实验直接回答——它是概念问题，实验只能提供约束。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“逐块替换”实验主要逼问的是？\n<ul>\n<li>\nA. 手术可行性\n<\/li><li>\nB. 人格同一性的标准\n<\/li><li>\nC. 记忆容量\n<\/li><li>\nD. 脑重量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它把同一性问题变成可操作的步骤问题。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n替换到哪一步不再是“我”\n<\/li><li>\n同一性 vs 连续性\n<\/li><li>\n概念问题，实验只能约束\n<\/ul>", "ch06": "<h1>第 6 章：儿童会告诉科学家什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明儿童为什么是“理论建构者”而非“空容器”\n<\/li><li>\n能举一个儿童朴素理论被实验修正的例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>儿童不是被动接收信息，而是自己造朴素理论来解释世界；研究这些理论怎么被修正，是理解学习机制的捷径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：朴素理论（难度：基础）<\/h3>\n<p>幼儿会认为“重的物体沉得快”“月亮跟着自己走”。这些不是随机错误，而是有结构的<strong>朴素理论<\/strong>（naive theory）。它们像科学理论一样，能预测、能解释，也能被反例推翻。<\/p>\n<h3>概念 2：为什么值得研究（难度：进阶）<\/h3>\n<p>成人已经忘了自己怎么学会的；儿童正在建构的过程中，所以能观察到“概念改变”的现场。这对教育设计与 AI 学习都有参考价值。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;朴素理论&quot;]\n  n2[&quot;为什么值得研究&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个小科学家在没有实验室的条件下造模型：材料少，推理多。边界：儿童不写论文、不做对照实验，理论改变靠日常反例。\n<\/li><li>\n<strong>实例<\/strong>：给 4 岁儿童看两个球同时落地，他会惊讶；重复几次后，他会修改“重的先落地”的规则。这个修正过程可被记录、被比较。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为儿童只是“不懂”——他们的错误有系统结构，是可研究的理论。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“朴素理论”指的是？\n<ul>\n<li>\nA. 儿童随机猜测\n<\/li><li>\nB. 儿童自造的有结构解释\n<\/li><li>\nC. 成人简化版物理\n<\/li><li>\nD. 教科书的简化\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它有预测与解释结构，能被反例修正。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n儿童 = 理论建构者\n<\/li><li>\n错误有结构\n<\/li><li>\n概念改变可现场观察\n<\/ul>", "ch07": "<h1>第 7 章：走向道德发展的理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明行为主义为什么衰落\n<\/li><li>\n能描述道德发展研究从“刺激-反应”转向什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>行为主义把学习看成刺激-反应的强化，无法解释儿童如何获得“规则”与“道德判断”；替代路线转向内部表征与发展的阶段结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：行为主义的三个前提（难度：基础）<\/h3>\n<p>①学习是刺激与反应的联结；②内部状态不可观察，不必研究；③人与动物在学习上没有原则差别。作者指出三条都被证伪：儿童能迁移规则、内部表征可被间接测量、人类语言学习与动物条件化差别巨大。<\/p>\n<h3>概念 2：道德发展（难度：进阶）<\/h3>\n<p>替代路线关注儿童如何形成“应该/不应该”的规则，以及这些规则如何随年龄重组。研究方法是讲故事、看判断，而不是只看行为强化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;行为主义的三个前提&quot;]\n  n2[&quot;道德发展&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像只按铃声训练狗，却发现孩子在学“为什么该这样做”。边界：强化仍然有效，只是不能解释全部。\n<\/li><li>\n<strong>实例<\/strong>：同一句“不许打人”，3 岁儿童理解成“会被罚”，7 岁理解成“别人会疼”，12 岁理解成“规则对所有人都适用”。三层理解对应不同的发展阶段。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为行为主义一无是处——它的实验方法（严格对照、可重复）被后续研究继承。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n行为主义衰落的主要原因是？\n<ul>\n<li>\nA. 实验太少\n<\/li><li>\nB. 三个核心前提被证伪\n<\/li><li>\nC. 缺乏资金\n<\/li><li>\nD. 不研究动物\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：规则迁移、内部表征、人兽差异都推翻了它的前提。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n行为主义三前提被证伪\n<\/li><li>\n道德判断随年龄重组\n<\/li><li>\n方法被继承，理论被替换\n<\/ul>", "ch08": "<h1>第 8 章：捉摸不定的心理学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“内省”作为方法的问题\n<\/li><li>\n能解释心理学对象为何会随研究改变\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>心理学研究的是会自我解释的人；被研究者的自我理解会随研究传播而改变，形成反馈环，这使心理学难以像物理那样稳定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：内省与阶级（难度：基础）<\/h3>\n<p>早期心理学靠受过训练的内省者描述意识内容。作者指出这批人有特定的文化与阶级背景，他们描述出的“意识”其实是特定生活方式的产物。<\/p>\n<h3>概念 2：反馈环（难度：进阶）<\/h3>\n<p>当心理学结论进入大众文化，人们会按结论重新理解自己，下一次研究测到的就是改变后的对象。<strong>反应性<\/strong>（reactivity）使心理学对象不稳定，这是它区别于物理的地方。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;内省与阶级&quot;]\n  n2[&quot;反馈环&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像民意调查公布后改变选民行为：测量本身改变了被测对象。边界：物理测量也有扰动，但对象不会读论文。\n<\/li><li>\n<strong>实例<\/strong>：“幸福设定点”理论流行后，人们开始用“我的基线高不高”解释情绪；这个新框架又影响他们报告幸福的方式。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为心理学不科学——它只是对象具有自我解释能力，因此需要不同的方法论。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n心理学对象的特殊性在于？\n<ul>\n<li>\nA. 无法测量\n<\/li><li>\nB. 会因研究结论而改变自我理解\n<\/li><li>\nC. 没有规律\n<\/li><li>\nD. 只能用动物实验\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：反馈环使研究对象随知识传播而变化。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n内省带有文化背景\n<\/li><li>\n研究对象会自我解释\n<\/li><li>\n反应性造成不稳定\n<\/ul>", "ch09": "<h1>第 9 章：幸福的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明行为遗传学与进化心理学各自的主张\n<\/li><li>\n能指出“幸福可被基因决定”说法的边界\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>行为遗传学发现多数心理特质有中等程度的遗传贡献；进化心理学解释这些倾向为何被选择。两者合起来说明幸福有生物基础，但不等于被基因定死。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：遗传贡献（难度：基础）<\/h3>\n<p>双生子研究把方差拆成遗传、共享环境、非共享环境三部分。多数特质（包括幸福感）的遗传贡献约在三到五成，非共享环境占很大一块。<\/p>\n<h3>概念 2：进化解释（难度：进阶）<\/h3>\n<p>进化心理学主张：情绪机制是被选择出来的适应，幸福不是目标，而是“接近目标”的信号。因此人会不断把基线拉高——这叫<strong>享乐适应<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;遗传贡献&quot;]\n  n2[&quot;进化解释&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像跑步机：跑得再快，位置还在原地。边界：跑步机速度可调，人的适应速度也因人而异。\n<\/li><li>\n<strong>实例<\/strong>：中彩票者在一年后幸福水平多回到基线附近；重大伤病者的恢复也常快于预期。两组数据都说明基线有弹性，但不是无限。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为遗传率高就等于不可改变——遗传给的是倾向，环境与选择仍在起作用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“享乐适应”指的是？\n<ul>\n<li>\nA. 幸福随年龄下降\n<\/li><li>\nB. 人会习惯好事并回到基线\n<\/li><li>\nC. 遗传决定幸福\n<\/li><li>\nD. 财富带来幸福\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：情绪对持续刺激的响应会衰减。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n遗传贡献约三到五成\n<\/li><li>\n幸福是接近目标的信号\n<\/li><li>\n享乐适应拉回基线\n<\/ul>", "ch10": "<h1>第 10 章：50年后我们还会忧伤吗<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明抑郁发病率上升的可能解释\n<\/li><li>\n能区分“诊断扩大”与“真实增加”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>抑郁在流行病学上持续上升，原因不单一：诊断标准放宽、社会压力结构变化、求助行为改变都在起作用，不能简单归因于“人变脆弱了”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：上升的两种解释（难度：基础）<\/h3>\n<p>一是<strong>诊断扩大<\/strong>：标准变宽、筛查普及，原本不被计入的病例被统计进来。二是<strong>真实增加<\/strong>：社会支持减弱、竞争压力上升、睡眠与节律改变。两种解释可以同时成立。<\/p>\n<h3>概念 2：压力的角色（难度：进阶）<\/h3>\n<p>作者强调长期压力对神经内分泌的影响，以及社会经济结构如何把压力分配到不同人群。个体化解释（“你心态不好”）会遮蔽结构性因素。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;上升的两种解释&quot;]\n  n2[&quot;压力的角色&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像测量水位：既可能水真的涨了，也可能换了更敏感的尺子。边界：尺子与水可以同时变化，需要独立证据区分。\n<\/li><li>\n<strong>实例<\/strong>：同一份问卷在 1970 与 2010 年都问“过去一年是否持续两周情绪低落”，阳性率上升；但同时量表条目也变多了。两组数据要分开看。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为发病率上升只说明诊断变宽——结构性压力同样有实证支持。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n抑郁上升的解释中，作者强调不能忽略的是？\n<ul>\n<li>\nA. 个人意志\n<\/li><li>\nB. 社会结构与长期压力\n<\/li><li>\nC. 气候\n<\/li><li>\nD. 遗传突变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把问题全推给个体心态会遮蔽结构性因素。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n上升 = 诊断扩大 + 真实增加\n<\/li><li>\n长期压力有生理后果\n<\/li><li>\n个体化解释会遮蔽结构\n<\/ul>", "ch11": "<h1>第 11 章：费米的“小发现”和复杂性理论的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 Fermi-Pasta-Ulam 实验预期与结果的差别\n<\/li><li>\n能解释“复现”为什么动摇了统计力学的直觉\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>费米等人模拟一维非线性晶格，预期能量会均匀分布（热化），结果能量几乎原样返回初始状态；这个“复现”说明非线性系统不一定热化，复杂性理论因此有了新的问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：预期：热化（难度：进阶）<\/h3>\n<p>按统计力学，非线性耦合会让能量在各模式间分配，最终趋于均分。计算应该看到温度上升式的均衡。<\/p>\n<h3>概念 2：结果：复现（难度：高难）<\/h3>\n<p>实际跑出来的是<strong>复现<\/strong>（recurrence）：能量在少数模式间来回，几乎回到初态。这不是数值误差，而是非线性系统的真实行为，后来被理解为可积系统与孤子的迹象。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;预期：热化&quot;]\n  n2[&quot;结果：复现&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把一壶水搅匀，结果水自己又分层了。边界：这是理想化模型，真实系统有更多耗散渠道。\n<\/li><li>\n<strong>实例<\/strong>：32 个质点、非线性弹簧、初始只给最低模式能量；模拟数千步后，能量分布回到接近初始的形状。改变非线性强度，复现周期随之改变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为复现说明热力学第二定律错了——它说明“热化”需要条件，理想可积系统可以避免。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nFPU 实验的意外结果是？\n<ul>\n<li>\nA. 能量迅速均匀\n<\/li><li>\nB. 能量几乎完全复现\n<\/li><li>\nC. 系统爆炸\n<\/li><li>\nD. 数值不稳定\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：复现表明非线性系统未必热化。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n预期热化，结果复现\n<\/li><li>\n可积系统不热化\n<\/li><li>\n复杂性理论由此获得新问题\n<\/ul>", "ch12": "<h1>第 12 章：生命是什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能列出生命的几个操作性特征\n<\/li><li>\n能说明“细菌做功”为什么重要\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命不是某个神秘成分，而是一组能力的组合：自我复制、做功、维持低熵、响应环境；缺一项就不算完整生命。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：操作性清单（难度：基础）<\/h3>\n<p>①自我复制；②代谢与做功（鞭毛对抗液体做功是典型例子）；③维持内部低熵（不断排出熵）；④对外界刺激作出响应；⑤进化能力。清单是操作性的，不承诺“生命力”。<\/p>\n<h3>概念 2：边界案例（难度：进阶）<\/h3>\n<p>病毒能复制但不在体外做功；朊粒能传播但没有核酸；人工细胞可能复制但代谢依赖外部。边界案例说明清单是连续的，不是开关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;操作性清单&quot;]\n  n2[&quot;边界案例&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家工厂：要进货、要生产、要排废、要能扩建。边界：工厂有老板，细胞没有。\n<\/li><li>\n<strong>实例<\/strong>：细菌鞭毛马达每秒转数百圈，靠质子梯度驱动，逆着黏滞阻力做功。这个“做功”是判定生命活动的硬指标之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“能复制”就等于生命——病毒能复制却不具备独立代谢。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列哪项不属于书中列出的生命特征？\n<ul>\n<li>\nA. 自我复制\n<\/li><li>\nB. 做功\n<\/li><li>\nC. 维持低熵\n<\/li><li>\nD. 必须有大眼睛\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：形态特征不是生命判据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生命 = 复制 + 做功 + 低熵 + 响应 + 进化\n<\/li><li>\n边界案例是连续的\n<\/li><li>\n做功是硬指标\n<\/ul>", "ch13": "<h1>第 13 章：小摩尔定律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“DNA 测序成本”为何可以类比摩尔定律\n<\/li><li>\n能指出“信息不等于意义”这一限制\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 测序的成本下降速度甚至快于摩尔定律；但读出序列不等于理解它，信息的获取与意义的解读是两件事。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：成本曲线（难度：基础）<\/h3>\n<p>测序一个碱基的成本在二十年间下降了几个数量级，快于集成电路的翻倍节奏。作者用“小摩尔定律”形容这条曲线，并讨论它对社会（医疗、隐私、保险）的冲击。<\/p>\n<h3>概念 2：信息与意义（难度：进阶）<\/h3>\n<p>知道一段 DNA 的序列，与知道它在什么条件下表达、编码什么功能，是两回事。测序把“读”变便宜，但没有把“懂”变便宜。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;成本曲线&quot;]\n  n2[&quot;信息与意义&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把整座图书馆扫描进硬盘：扫描很快，读懂很慢。边界：DNA 没有语法书，读懂要靠实验。\n<\/li><li>\n<strong>实例<\/strong>：人类基因组约 30 亿碱基对，测序成本从数十亿美元降到千美元量级，但同一份序列在不同人群中的解读仍需要大量注释数据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为测序便宜了，基因知识就自动普及——解读依赖实验与数据库，成本另算。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“小摩尔定律”描述的是？\n<ul>\n<li>\nA. 芯片速度\n<\/li><li>\nB. DNA 测序成本的快速下降\n<\/li><li>\nC. 人口增长\n<\/li><li>\nD. 药物价格\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：测序成本下降速度是类比的核心。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n测序成本下降快于摩尔定律\n<\/li><li>\n读 ≠ 懂\n<\/li><li>\n冲击在医疗、隐私、保险\n<\/ul>", "ch14": "<h1>第 14 章：第二个创生<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch12\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明合成生物学与“从零造生命”的区别\n<\/li><li>\n能指出这类研究的主要风险点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>合成生物学试图用标准化部件重造生命过程，它更像“第二次创生”，而不是“发现现成生命”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：标准化部件（难度：基础）<\/h3>\n<p>把基因、启动子、代谢通路做成可拼装的<strong>生物砖<\/strong>（biobrick），像电子元件一样组合。目标是让造生命从手艺变成工程。<\/p>\n<h3>概念 2：风险与边界（难度：进阶）<\/h3>\n<p>风险包括：意外释放、双重用途、生态竞争。作者主张的不是停止研究，而是建立可追踪、可隔离、可终止的工程规范。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;标准化部件&quot;]\n  n2[&quot;风险与边界&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用乐高搭房子：积木标准化，组合自由，但搭出的东西仍受物理约束。边界：生物砖会自我复制，乐高不会。\n<\/li><li>\n<strong>实例<\/strong>：把一段荧光蛋白基因接进大肠杆菌，菌落会发光——这是合成生物学最基础的演示，也是“部件可组合”的证明。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为合成生命一定比自然生命简单——最小基因组仍需要大量基因协同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n合成生物学的核心思路是？\n<ul>\n<li>\nA. 寻找外星生命\n<\/li><li>\nB. 把生物部件标准化后组合\n<\/li><li>\nC. 克隆现有生物\n<\/li><li>\nD. 抑制进化\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：标准化、可组合是工程化的前提。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生物砖 = 标准化部件\n<\/li><li>\n第二次创生 vs 发现生命\n<\/li><li>\n风险靠工程规范控制\n<\/ul>", "ch15": "<h1>第 15 章：预测未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch11\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明计算机模型预测的优点与代价\n<\/li><li>\n能指出“模型可运行”与“预测可信”的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算机模型能反复运行、检验极限条件，但建模耗时且依赖假设；模型能跑不等于预测可信。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：模型的优点（难度：基础）<\/h3>\n<p>可重复、可控制变量、可做现实中做不到的极限实验。这三条使它成为预测的常用工具。<\/p>\n<h3>概念 2：代价（难度：进阶）<\/h3>\n<p>建模需要数月到数年；假设一改，结果全变；验证依赖未来数据。所以模型输出应被读作“条件性情景”，不是“预言”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;模型的优点&quot;]\n  n2[&quot;代价&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用飞行模拟器训练：能反复练极端天气，但模拟器不包含所有真实气流。边界：模拟器可以更新，模型也可以，但更新需要新数据。\n<\/li><li>\n<strong>实例<\/strong>：气候模型给出不同排放情景下的升温区间，而不是单一数字。区间宽度就是假设不确定性的体现。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型越复杂越准——参数越多，过拟合风险越大。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n模型预测应被理解为？\n<ul>\n<li>\nA. 确定预言\n<\/li><li>\nB. 条件性情景\n<\/li><li>\nC. 随机猜测\n<\/li><li>\nD. 实验数据\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：结果依赖假设，需按情景读。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n模型三优点：可重复、可控、可极限\n<\/li><li>\n代价：耗时、依赖假设\n<\/li><li>\n输出是情景不是预言\n<\/ul>", "ch16": "<h1>第 16 章：肉体与机器的结合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明人机结合为什么引发不安\n<\/li><li>\n能区分“工具延伸”与“本体改变”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>人机结合的历史就是不断把外部工具变成身体的一部分；真正让人不安的不是技术，而是“人”的边界被重画。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从眼镜到植入（难度：基础）<\/h3>\n<p>眼镜、助听器、起搏器都已是身体的一部分。区别在于：它们可拆卸、不改变自我感。植入式设备与神经接口则可能改变“我在哪”的感觉。<\/p>\n<h3>概念 2：不安的来源（难度：进阶）<\/h3>\n<p>作者认为不安来自世界观被挑战：伽利略把地球移出中心，达尔文把人放进动物谱系，人机结合把“人”放进可改造的谱系。每次都要几十年消化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从眼镜到植入&quot;]\n  n2[&quot;不安的来源&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像手机变成外置记忆：丢了会慌，但它不在体内。边界：植入设备在体内，移除成本与身份感受都不同。\n<\/li><li>\n<strong>实例<\/strong>：助听器从“残疾辅助”变成“可穿戴增强”，社会态度随之改变。同一技术，边界一移，意义就变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为人机结合只是工程问题——它同时重画“人”的定义，因此必然引发文化冲突。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n人机结合引发不安的深层原因是？\n<ul>\n<li>\nA. 技术不成熟\n<\/li><li>\nB. 人的边界与自我感被重画\n<\/li><li>\nC. 成本太高\n<\/li><li>\nD. 电池不耐用\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：争论核心是身份与定义，而非性能。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n工具逐步变成身体\n<\/li><li>\n不安来自世界观被挑战\n<\/li><li>\n边界一移，意义就变\n<\/ul>", "ch17": "<h1>第 17 章：物质的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明化学“完全把握物质”是什么意思\n<\/li><li>\n能举出材料科学的两类方向\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>化学已经能按需设计分子与材料；未来的突破更可能在“按功能设计”而非“发现新元素”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从发现到设计（难度：基础）<\/h3>\n<p>早期化学靠发现天然物质，现代化学靠计算与合成设计目标分子：药物、聚合物、电池材料、超导体。方向从“有什么”转为“要什么”。<\/p>\n<h3>概念 2：两类方向（难度：进阶）<\/h3>\n<p>一是性能极限（更硬、更轻、更耐热）；二是功能集成（自修复、响应环境、可回收）。后者更接近生物材料的路子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从发现到设计&quot;]\n  n2[&quot;两类方向&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像从逛菜市场变成按菜谱点菜：想要什么就能配什么。边界：菜谱受食材限制，化学受元素与键合限制。\n<\/li><li>\n<strong>实例<\/strong>：锂电池的能量密度提升来自正极材料与电解液的组合优化，不是发现新元素。设计空间在组合，不在周期表扩充。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为化学已经“结束”了——组合空间仍然巨大，设计能力才是瓶颈。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n现代化学的重心转向？\n<ul>\n<li>\nA. 发现新元素\n<\/li><li>\nB. 按功能设计分子与材料\n<\/li><li>\nC. 提炼矿石\n<\/li><li>\nD. 制造酸\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：从发现转向设计。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n从发现物质到设计物质\n<\/li><li>\n两类方向：性能极限、功能集成\n<\/li><li>\n瓶颈在设计与组合\n<\/ul>", "ch18": "<h1>第 18 章：我们会更聪明吗<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“智力”测量的争议\n<\/li><li>\n能解释教育与技术对智力的可能影响\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>智力不是单一可加总的量；教育、营养、技术都在改变认知表现，但“更聪明”是否等于“更好”，是另一个问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：测量的局限（难度：基础）<\/h3>\n<p>IQ 测的是特定文化下的认知任务，能预测学业表现，但不能覆盖创造力、社会判断、实践智慧。把 IQ 当智力的全部，是测量工具越界。<\/p>\n<h3>概念 2：环境效应（难度：进阶）<\/h3>\n<p>营养、教育年限、信息环境都能提升测验分数（弗林效应）。技术把记忆外包给搜索，可能改变能力结构：某些技能退化，另一些增强。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;测量的局限&quot;]\n  n2[&quot;环境效应&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用体重秤量身高：秤是真的，量错了东西。边界：IQ 确实预测某些结果，不是完全无效。\n<\/li><li>\n<strong>实例<\/strong>：弗林效应显示多国 IQ 分数在二十世纪持续上升，近几十年在部分发达国家停滞甚至回落。曲线变化说明环境效应显著。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为智力提升必然带来更好的社会——能力与价值判断是两件事。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n弗林效应说明？\n<ul>\n<li>\nA. 智力由基因决定\n<\/li><li>\nB. 环境改善可提升测验分数\n<\/li><li>\nC. IQ 无用\n<\/li><li>\nD. 人类在退化\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：跨代分数上升反映营养、教育与环境变化。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nIQ 是特定任务的测量\n<\/li><li>\n环境效应显著（弗林效应）\n<\/li><li>\n更聪明 ≠ 更好\n<\/ul>", "ch19": "<h1>第 19 章：复杂性的顶点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“奇点”主张的核心假设\n<\/li><li>\n能指出这类预测最薄弱的一环\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>“奇点”说假定技术进步可无限指数外推，直到机器智能超越人；这个论证最薄弱处是“智能可以脱离载体无限加速”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：论证结构（难度：进阶）<\/h3>\n<p>前提一：计算能力指数增长；前提二：智能可被计算；前提三：达到某阈值后机器能自我改进。结论：出现不可预测的“奇点”。三条前提各自都有反例。<\/p>\n<h3>概念 2：薄弱处（难度：进阶）<\/h3>\n<p>物理限制（散热、材料）、经济限制（研发成本）、以及“智能”与“计算”是否等价，都是未决问题。作者的态度是：把它当一个有待检验的情景，而不是日程表。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;论证结构&quot;]\n  n2[&quot;薄弱处&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把股价曲线外推到无限：曲线是真的，外推是假设。边界：技术可以换范式，股价也可以，但都不可无限外推。\n<\/li><li>\n<strong>实例<\/strong>：摩尔定律在 2000 年代后放缓，单核频率停止增长，转向多核与专用芯片。这说明指数曲线会遇范式转换，而不是无限延续。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为奇点论已被技术趋势证明——它依赖三条未验证的前提。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n奇点论证最薄弱的前提是？\n<ul>\n<li>\nA. 计算在增长\n<\/li><li>\nB. 智能可脱离载体无限加速\n<\/li><li>\nC. 人类存在\n<\/li><li>\nD. 机器会耗电\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：物理与经济限制使无限加速难以成立。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n奇点 = 三条前提的推论\n<\/li><li>\n指数曲线会遇范式转换\n<\/li><li>\n当情景，不当日程\n<\/ul>", "ch20": "<h1>第 20 章：流动的信息<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“信息进入空间”指什么\n<\/li><li>\n能指出这种变化对注意力的影响\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算正在从桌面搬进环境：信息贴在物体与地点上，随时可调用；结果是注意力被重新分配，隐私边界也被重画。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从桌面到环境（难度：基础）<\/h3>\n<p><strong>泛在计算<\/strong>（ubiquitous computing）：传感器、标签、无线网络把信息嵌入日常空间。你不必打开电脑，信息在你走过去时就出现。<\/p>\n<h3>概念 2：代价（难度：进阶）<\/h3>\n<p>注意力被切成碎片；行为数据被持续采集；公共空间与私人空间的界线变模糊。技术越“无感”，治理越难。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从桌面到环境&quot;]\n  n2[&quot;代价&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把图书馆的书签贴满整个城市：走到哪都能读到相关的一页。边界：书签不会记录你读了多久，传感器会。\n<\/li><li>\n<strong>实例<\/strong>：超市货架上的电子价签、地铁里的定位信标、手机的地理围栏推送，都是“信息进入空间”的日常形态。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为泛在计算只是便利——它同时把监控能力铺进日常空间。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n泛在计算的核心是？\n<ul>\n<li>\nA. 更快的 CPU\n<\/li><li>\nB. 信息嵌入日常空间，随时可调用\n<\/li><li>\nC. 更大的屏幕\n<\/li><li>\nD. 云计算\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：计算从桌面走向环境。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n信息进入空间\n<\/li><li>\n注意力碎片化\n<\/li><li>\n隐私边界重画\n<\/ul>", "ch21": "<h1>第 21 章：思想，大脑和自我<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明脑成像能回答与不能回答的问题\n<\/li><li>\n能解释“自我”为何不是大脑里的一个部件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>脑成像能定位功能、比较差异，但不能直接读出“自我”；自我更像叙述与整合的产物，而不是某个脑区。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：成像的边界（难度：基础）<\/h3>\n<p>fMRI 测的是血流变化，不是神经元放电；它给的是相关，不是因果。看到某区域“亮”，不等于该区域独自负责某功能。<\/p>\n<h3>概念 2：自我的位置（难度：进阶）<\/h3>\n<p>自我感来自记忆、身体感、社会角色的整合。脑损伤案例显示：记忆断裂会改变人格，但“我”仍在叙述。作者因此主张自我是过程，不是部件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;成像的边界&quot;]\n  n2[&quot;自我的位置&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用城市用电图找“市政府”：用电高峰在商业区，但市政府不在那儿。边界：脑成像的相关性能提供线索，不能单独定案。\n<\/li><li>\n<strong>实例<\/strong>：同一张面孔，在不同语境下激活不同脑区；这说明“识别”不是单一模块，而是网络协作。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为脑成像能读出思想内容——它读的是统计相关的活动模式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nfMRI 主要测量？\n<ul>\n<li>\nA. 神经元放电\n<\/li><li>\nB. 血流变化\n<\/li><li>\nC. 脑电频率\n<\/li><li>\nD. 神经递质\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它以血流作为神经活动的间接指标。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n成像 = 相关，不是因果\n<\/li><li>\n自我是整合过程\n<\/li><li>\n脑损伤改变人格但叙述仍在\n<\/ul>", "ch22": "<h1>第 22 章：我们何以如此：来自2050年的观点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch06、ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“群体社会化”理论的主张\n<\/li><li>\n能指出它对“父母决定孩子人格”的挑战\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同辈群体而非父母，是儿童社会化的主要环境；父母提供基因与家庭氛围，但人格的塑造更多发生在同伴之间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：群体社会化（难度：进阶）<\/h3>\n<p>哈里斯的理论：儿童在家庭外发展“群体内”行为规范，同伴接纳与地位压力塑造社会行为。家庭教养的影响被高估，基因与非共享环境被低估。<\/p>\n<h3>概念 2：争议（难度：进阶）<\/h3>\n<p>批评者指出：父母仍通过选择居住地、学校、同伴圈间接影响；基因与环境的交互也无法完全分离。理论的价值在于纠正“父母万能论”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;群体社会化&quot;]\n  n2[&quot;争议&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像孩子在学校学会一套“宿舍方言”，回家仍说家乡话：两套规范并行。边界：家庭规范并非无效，只是不是唯一来源。\n<\/li><li>\n<strong>实例<\/strong>：移民家庭的孩子在语言与口音上更像同伴而非父母，这个现象是群体社会化的直接证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为这理论在说“父母不重要”——它说的是父母的影响路径不同，更多是间接的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n群体社会化理论强调？\n<ul>\n<li>\nA. 父母决定人格\n<\/li><li>\nB. 同伴群体是主要社会化环境\n<\/li><li>\nC. 基因无用\n<\/li><li>\nD. 学校无关\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：同辈规范与接纳塑造社会行为。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同伴群体是主要社会化环境\n<\/li><li>\n父母影响多为间接\n<\/li><li>\n纠偏“父母万能论”\n<\/ul>", "ch23": "<h1>第 23 章：药、DNA和躺椅<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明精神药物史的三个阶段\n<\/li><li>\n能指出药物治疗与心理治疗的互补关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>精神医学从镇静、到靶向神经递质、再到基因分型用药；药物能缓解症状，但不自动改变生活结构，因此与心理治疗长期并存。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个阶段（难度：基础）<\/h3>\n<p>①偶然发现（锂盐、丙咪嗪）；②机制导向（SSRI 等按神经递质设计）；③分型用药（按基因与代谢差异选药）。每一阶段都比上一阶段更精确，也都更依赖诊断分类。<\/p>\n<h3>概念 2：药与谈话（难度：进阶）<\/h3>\n<p>药物改变生理状态，谈话改变解释与行为模式。两者作用于不同层面，临床上是组合而非替代。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三个阶段&quot;]\n  n2[&quot;药与谈话&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像修车：药物调发动机，谈话改驾驶习惯。边界：人不是车，意义与关系也影响症状。\n<\/li><li>\n<strong>实例<\/strong>：同一剂量 SSRI 在不同人身上效果差异很大，部分可用代谢酶基因差异解释。这就是“分型用药”的动机。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为新药一定优于旧药——疗效与副作用要按人群分层评估。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n精神药物发展的第三阶段特征是？\n<ul>\n<li>\nA. 偶然发现\n<\/li><li>\nB. 按基因与代谢分型用药\n<\/li><li>\nC. 只用安慰剂\n<\/li><li>\nD. 放弃诊断\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：精准用药依赖生物标记。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三阶段：偶然 → 机制 → 分型\n<\/li><li>\n药与谈话互补\n<\/li><li>\n分层评估疗效\n<\/ul>", "ch24": "<h1>第 24 章：心理疗法和穿在身上的电脑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch20、ch23\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明可穿戴设备在心理治疗中的可能角色\n<\/li><li>\n能指出“持续监测”带来的伦理问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>可穿戴设备把治疗从诊室延伸到日常：持续记录生理与行为，随时干预；但它也把私人情绪变成可采集的数据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从诊室到日常（难度：基础）<\/h3>\n<p>心率、睡眠、活动、语音语调都能被连续测量。治疗师可以据此调整干预，用户也能看到自己的模式。<\/p>\n<h3>概念 2：伦理边界（难度：进阶）<\/h3>\n<p>数据归谁？保险公司能否读取？算法误判会不会造成伤害？作者的态度是：技术可行不等于应当无条件部署，需要明确同意与可解释性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从诊室到日常&quot;]\n  n2[&quot;伦理边界&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给情绪装一个行车记录仪：出事能回放，但也被全程记录。边界：行车记录仪记录路况，情绪记录涉及最私人的部分。\n<\/li><li>\n<strong>实例<\/strong>：双相障碍的早期预警可用活动量与睡眠节律的异常变化实现，但误报会导致过度干预，因此必须有人工复核。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为持续监测必然改善治疗——误报与隐私风险会抵消收益。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n可穿戴心理干预的主要伦理风险是？\n<ul>\n<li>\nA. 设备太贵\n<\/li><li>\nB. 情绪数据被采集与滥用\n<\/li><li>\nC. 电池寿命\n<\/li><li>\nD. 屏幕太小\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：持续监测把私人情绪变成可交易数据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n治疗延伸到日常\n<\/li><li>\n持续监测 = 预警 + 误报\n<\/li><li>\n同意与可解释性是底线\n<\/ul>", "ch25": "<h1>第 25 章：征服疾病<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch23\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分“修补式医疗”与“根治式医疗”\n<\/li><li>\n能说明为什么多数现代医疗仍是修补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>现代医学的多数手段是修补与支持，而非根治；未来五十年的突破更可能来自早期诊断与机制干预，而不是更复杂的手术。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：修补为主（难度：基础）<\/h3>\n<p>器官移植、搭桥、多数癌症治疗都是“把坏的部分换掉或切掉”，延长寿命但不消除病因。<strong>修补式医疗<\/strong>（palliative / reparative）在统计上贡献巨大，但成本高、复发率高。<\/p>\n<h3>概念 2：根治的路径（难度：进阶）<\/h3>\n<p>真正根治要靠机制：疫苗、抗生素、靶向药、基因治疗。它们的共同点是在病因层面干预，而不是在结果层面补救。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;修补为主&quot;]\n  n2[&quot;根治的路径&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像漏水先拿桶接，再找管子补：接水是修补，补管是根治。边界：有些病找不到“管子”，只能长期接水。\n<\/li><li>\n<strong>实例<\/strong>：天花被疫苗彻底消灭，是根治式胜利；高血压靠长期服药控制，是修补式管理。两者的成本结构完全不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为技术越复杂越接近根治——复杂手术多半仍是修补。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列哪项属于根治式干预？\n<ul>\n<li>\nA. 心脏搭桥\n<\/li><li>\nB. 透析\n<\/li><li>\nC. 疫苗接种\n<\/li><li>\nD. 止痛药\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：疫苗在病因层面阻断疾病。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多数现代医疗是修补\n<\/li><li>\n根治靠机制干预\n<\/li><li>\n成本结构不同\n<\/ul>", "c01": "<h1>预测的三种类型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 01 章、第 15 章、第 19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>趋势外推（按现有斜率推）、情景设想（给定条件推演）、价值判断（我们想要哪种未来）。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让你在读任何一篇未来学时，先知道作者在做哪一种，而不是把三种混为一谈。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>趋势外推：依赖曲线不变，最容易被范式转换打断。<\/p>\n<p>情景设想：依赖一组假设，结论是条件句，价值在暴露假设。<\/p>\n<p>价值判断：讨论“应该”，不能用数据直接裁决。<\/p>\n<p>读法：先分类，再找前提，最后问“如果前提不成立，结论还剩什么”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为所有未来学都是预言——多数是情景，少数是价值主张。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>宇宙未来<\/td><td>条件句式推演<\/td><\/tr><tr><td>ch19<\/td><td>奇点<\/td><td>趋势外推的极端版<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n模型、奇点\n<\/ul>", "c02": "<h1>生命作为能力组合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 12 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>生命不是神秘本质，而是复制、做功、维持低熵、响应、进化几项能力的组合。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“生命是什么”从哲学争论变成可操作的判据，也支撑合成生物学的工程思路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判据逐项可测：复制看后代，做功看能量流，低熵看内部梯度，响应看刺激-反应，进化看可遗传变异。<\/p>\n<p>边界案例（病毒、朊粒、人工细胞）说明判据是连续谱。<\/p>\n<p>工程含义：只要凑齐能力，就可以“造生命”，不必复制某个物种。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为生命有单一判据——它是组合判据，缺项即边界案例。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch12<\/td><td>生命是什么<\/td><td>组合判据<\/td><\/tr><tr><td>ch14<\/td><td>第二个创生<\/td><td>工程化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n合成生物学、熵\n<\/ul>", "c03": "<h1>信息与意义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 13 章、第 20 章、第 21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>信息是可减少不确定性的差异；意义是这些差异在某个解释系统中的作用。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是贯穿全书的一条暗线：测序、泛在计算、脑成像都在“读信息”，但都不等于“懂意义”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>读：获取差异（序列、信号、图像）。<\/p>\n<p>懂：把差异接到功能、语境、因果上。<\/p>\n<p>代价：读的成本在下降，懂的成本没有同步下降。<\/p>\n<p>风险：把“读到了”当成“明白了”，是当代许多技术乐观论的共同错误。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数据量增加就等于理解增加——理解需要解释框架与实验。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch13<\/td><td>小摩尔定律<\/td><td>读≠懂<\/td><\/tr><tr><td>ch21<\/td><td>脑成像<\/td><td>相关≠因果<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n测序、泛在计算、脑成像\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：宇宙的未来<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 宇宙的未来<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：我们孤独吗我们在哪儿<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 我们孤独吗我们在哪儿<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：2050年的数学<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 2050年的数学<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04 z-opt'><input type='radio' name='ch22-q1' value='0'> 父母决定人格<\/label><label class='quiz-opt'><input type='radio' name='ch22-q1' value='1'> 同伴群体是主要社会化环境<\/label><label class='quiz-opt'><input type='radio' name='ch22-q1' value='2'> 基因无用<\/label><label class='quiz-opt'><input type='radio' name='ch22-q1' value='3'> 学校无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch23__": "<h1>测验：第 23 章 药、DNA和躺椅<\/h1><div class='quiz-item' data-qid='ch23-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 精神药物发展的第三阶段特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch23-q1' value='0'> 偶然发现<\/label><label class='quiz-opt'><input type='radio' name='ch23-q1' value='1'> 按基因与代谢分型用药<\/label><label class='quiz-opt'><input type='radio' name='ch23-q1' value='2'> 只用安慰剂<\/label><label class='quiz-opt'><input type='radio' name='ch23-q1' value='3'> 放弃诊断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch24__": "<h1>测验：第 24 章 心理疗法和穿在身上的电脑<\/h1><div class='quiz-item' data-qid='ch24-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 可穿戴心理干预的主要伦理风险是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch24-q1' value='0'> 设备太贵<\/label><label class='quiz-opt'><input type='radio' name='ch24-q1' value='1'> 情绪数据被采集与滥用<\/label><label class='quiz-opt'><input type='radio' name='ch24-q1' value='2'> 电池寿命<\/label><label class='quiz-opt'><input type='radio' name='ch24-q1' value='3'> 屏幕太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch25__": "<h1>测验：第 25 章 征服疾病<\/h1><div class='quiz-item' data-qid='ch25-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪项属于根治式干预？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch25-q1' value='0'> 心脏搭桥<\/label><label class='quiz-opt'><input type='radio' name='ch25-q1' value='1'> 透析<\/label><label class='quiz-opt'><input type='radio' name='ch25-q1' value='2'> 疫苗接种<\/label><label class='quiz-opt'><input type='radio' name='ch25-q1' value='3'> 止痛药<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='暗能量'>暗能量 — 推动宇宙加速膨胀的成分 <span class=glossary-ref>（第 1 章 宇宙的未来）<\/span><\/li><li data-term='宜居三要素'>宜居三要素 — 液态水、能量源、化学原料 <span class=glossary-ref>（第 2 章 我们孤独吗我们在哪儿）<\/span><\/li><li data-term='朴素理论'>朴素理论 — 儿童自造的有结构的解释 <span class=glossary-ref>（第 6 章 儿童会告诉科学家什么）<\/span><\/li><li data-term='行为主义'>行为主义 — 以刺激-反应强化解释学习的流派 <span class=glossary-ref>（第 7 章 走向道德发展的理论）<\/span><\/li><li data-term='反应性'>反应性 — 测量改变被测对象的现象 <span class=glossary-ref>（第 8 章 捉摸不定的心理学）<\/span><\/li><li data-term='享乐适应'>享乐适应 — 对持续好事回到情绪基线 <span class=glossary-ref>（第 9 章 幸福的未来）<\/span><\/li><li data-term='复现'>复现 — 非线性系统能量几乎回到初态 <span class=glossary-ref>（第 11 章 费米的“小发现”和复杂性理论的未来）<\/span><\/li><li data-term='生物砖'>生物砖 — 标准化可组合的基因部件 <span class=glossary-ref>（第 14 章 第二个创生）<\/span><\/li><li data-term='泛在计算'>泛在计算 — 信息嵌入日常空间的计算形态 <span class=glossary-ref>（第 20 章 流动的信息）<\/span><\/li><li data-term='群体社会化'>群体社会化 — 同伴群体是主要社会化环境的理论 <span class=glossary-ref>（第 22 章 我们何以如此：来自2050年的观点）<\/span><\/li><li data-term='修补式医疗'>修补式医疗 — 替换或支持而非根治的治疗 <span class=glossary-ref>（第 25 章 征服疾病）<\/span><\/li><li data-term='奇点'>奇点 — 机器智能超越人且不可预测的假设时点 <span class=glossary-ref>（第 19 章 复杂性的顶点）<\/span><\/li><\/ul>", "__patterns__": "<h1>未来50年 模式与框架库<\/h1>\n<h2>分析框架：预测拆解四步<\/h2>\n<ol><li>\n它属于趋势外推、情景设想还是价值判断？\n<\/li><li>\n它的关键前提是什么（曲线、参数、机制）？\n<\/li><li>\n哪个观测能推翻它？\n<\/li><li>\n如果前提不成立，结论还剩什么？\n<p>四步能把“未来学”还原成可讨论的论证。<\/p>\n<\/ol>\n<h2>决策规则：看到指数曲线先找范式<\/h2>\n<p>if 有人在推演无限指数增长 then 问：上一轮范式何时结束的？新范式靠什么？ if 答不出 then 这条曲线只是历史斜率，不是定律<\/p>\n<h2>反模式：把“读到”当“懂了”<\/h2>\n<p>测序、监测、成像都在降低“读”的成本，不降低“懂”的成本。把数据量当理解，是技术乐观论的常见漏洞。<\/p>\n<h2>反模式：把个体问题全推给个体<\/h2>\n<p>抑郁、教育、健康都受结构性因素影响。只讲“心态/努力”会遮蔽可改变的环境变量。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>宇宙三结局<\/td><td>封闭 / 开放减速 / 加速（当前支持加速）<\/td><\/tr><tr><td>宜居三要素<\/td><td>水 + 能量 + 原料<\/td><\/tr><tr><td>生命五能力<\/td><td>复制、做功、低熵、响应、进化<\/td><\/tr><tr><td>测序成本<\/td><td>下降快于摩尔定律<\/td><\/tr><tr><td>FPU 意外<\/td><td>预期热化，实际复现<\/td><\/tr><tr><td>行为主义三前提<\/td><td>刺激-反应、内部不可研究、人兽无差别（均被证伪）<\/td><\/tr><tr><td>奇点三前提<\/td><td>算力指数、智能可计算、可自我改进<\/td><\/tr><tr><td>医疗两型<\/td><td>修补（换/切/支持）vs 根治（机制干预）<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
