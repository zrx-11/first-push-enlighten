ong>步骤 09：数学对象的实在性<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 数学对象的实在性<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：我们从数学中得到的要比赋予它的多<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 我们从数学中得到的要比赋予它的多<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q21.<\/b> 下列哪一位最不可能主张“数学对象独立于心灵存在”？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 波金霍尔<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 彭罗斯<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 罗森（简约实在论）<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 严格的结构主义者（结构只是描述方式）<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q22.<\/b> “我们从数学中得到的要比赋予它的多”最直接支持哪种立场？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 数学是纯约定<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 数学有独立于定义者的内容<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 数学无用<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 数学靠实验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q23.<\/b> 对“数学在物理中异常有效，所以数学实在”的最强反驳是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 物理不精确<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 数学结构过多，适配可能是选择偏差<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 数学家会犯错<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 实验不可重复<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章 数学是一种发现还是一种发明？<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 高尔斯对“发现/发明”之争的态度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 发现派<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 发明派<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 区分本身不如理解对象为何能给出新结论重要<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 两者都不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 复数例子说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 数学是纯发明<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 造出符号与发现后果是一件事的两面<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 复数没有用<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 数学靠实验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章 探索巴别数学图书馆<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数学图书馆比喻中，数学家的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 写书<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 按结构线索找到有内容的书<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 随机翻阅<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 销毁无用的书<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数学为什么排斥歧义？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q2' value='0'> 审美偏好<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='1'> 歧义会使证明失效<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='2'> 历史传统<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='3'> 为了显得严谨<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章 数学实在<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “不可理喻的有效性”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 数学计算很快<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 抽象数学对物理的精确适配<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 物理实验很难<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 数学证明很长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对实在论最有力的常见反驳是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q2' value='0'> 数学太难<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='1'> 数学结构过多，适配可能是选择偏差<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='2'> 物理不精确<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='3'> 数学家会犯错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span clas \/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q2' value='0'> 证明太长<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='1'> 判断客观需先有逻辑，逻辑的客观又需证明<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='2'> 数学家意见不一<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='3'> 对象太多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章 数学对象的实在性<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 简约实在论的最小承诺是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 数学对象是物理事物<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 数学对象存在但不多说本性<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 数学只是语言<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 对象由心理构造<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> “欧盟”类比想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q2' value='0'> 数学对象是虚构<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='1'> 非物理实体也能在理论中真实起作用<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 制度比数学重要<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 存在等于可触摸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章 我们从数学中得到的要比赋予它的多<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 欧拉公式说明的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 复数无用<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 定义的后果可远超定义者的预期<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 数学靠实验<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 象棋比数学复杂<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 施泰纳用象棋对照想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q2' value='0'> 数学与游戏相同<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='1'> 数学结论会应用回现实，因此更像发现<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='2'> 规则越多越好<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='3'> 数学没有规则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='不可理喻的有效性'>不可理喻的有效性 — 维格纳语：抽象数学对物理的精确适配 <span class=glossary-ref>（第 3 章 数学实在）<\/span><\/li><li data-term='工具主义'>工具主义 — 数学只是方便描述世界的工具 <span class=glossary-ref>（第 3 章 数学实在）<\/span><\/li><li data-term='三个世界'>三个世界 — 物理、精神、柏拉图数学世界 <span class=glossary-ref>（第 4 章 数学、大脑与物理世界）<\/span><\/li><li data-term='数学理解'>数学理解 — 看出结构必然，而不只是验证步骤 <span class=glossary-ref>（第 5 章 数学的理解）<\/span><\/li><li data-term='因果模型'>因果模型 — 以原因链解释的模型 <span class=glossary-ref>（第 5 章 数学的理解）<\/span><\/li><li data-term='必然模型'>必然模型 — 以必然性解释的模型 <span class=glossary-ref>（第 5 章 数学的理解）<\/span><\/li><li data-term='结构主义'>结构主义 — 数学对象由结构中的位置定义 <span class=glossary-ref>（第 6 章 数学中的创造和发现）<\/span><\/li><li data-term='如果—那么读法'>如果—那么读法 — 把定理读作关于公理结构成立的条件句 <span class=glossary-ref>（第 6 章 数学中的创造和发现）<\/span><\/li><li data-term='概念实在论'>概念实在论 — 概念预先给定并约束判断 <span class=glossary-ref>（第 7 章 发现、发明和实在论：概念实在性）<\/span><\/li><li data-term='对象实在论'>对象实在论 — 数学对象独立存在 <span class=glossary-ref>（第 7 章 发现、发明和实在论：概念实在性）<\/span><\/li><li data-term='程序客观性'>程序客观性 — 证明可被任何人按规则复查 <span class=glossary-ref>（第 8 章 数学与客观性）<\/span><\/li><li data-term='简约实在论'>简约实在论 — 只承诺数学对象存在，不多说本性 <span class=glossary-ref>（第 9 章 数学对象的实在性）<\/span><\/li><li data-term='突现实体'>突现实体 — 非物理构成却在理论中真实起作用的实体 <span class=glossary-ref>（第 9 章 数学对象的实在性）<\/span><\/li><li data-term='巴别图书馆'>巴别图书馆 — 包含所有可能文本的无穷图书馆 <span class=glossary-ref>（第 2 章 探索巴别数学图书馆）<\/span><\/li><li data-term='欧拉公式'>欧拉公式 — e^{iπ}+1=0 <span class=glossary-ref>（第 10 章 我们从数学中得到的要比赋予它的多）<\/span><\/li><\/ul>", "__patterns__": "<h1>数学的意义 模式与框架库<\/h1>\n<h2>分析框架：立场定位四问<\/h2>\n<ol><li>\n数学对象存在吗？（实在论 / 反实在论）\n<\/li><li>\n若存在，是独立的还是由实践确立？（柏拉图 / 简约）\n<\/li><li>\n定理陈述对象还是结构？（对象语言 / 结构主义）\n<\/li><li>\n客观性来自对象、程序还是规范？\n<p>四问能把任何一位作者放到坐标上。<\/p>\n<\/ol>\n<h2>决策规则：判断一个“数学是发明的”论证是否成立<\/h2>\n<p>if 论证只说“符号是人造的” then 追问：定义的后果由谁决定？ if 后果由逻辑决定且不可预期 then “发明”里已含“发现”，论证不完整<\/p>\n<h2>反模式：用哥德尔定理直接证柏拉图主义<\/h2>\n<p>哥德尔只谈给定系统的可证性，不承诺独立存在的对象世界。要用它，必须补上“真理独立于可证性”这一前提。<\/p>\n<h2>反模式：把“有效”当“真实”<\/h2>\n<p>数学在物理中有效，可能来自选择偏差或结构过度丰富。判断时要看是否有精确、可检验、非事后硬套的预言。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>三种发现<\/td><td>经验 / 逻辑 / 概念<\/td><\/tr><tr><td>实在论谱系<\/td><td>对象 → 概念 → 简约（承诺递减）<\/td><\/tr><tr><td>结构主义口号<\/td><td>对象 = 结构中的位置<\/td><\/tr><tr><td>条件句读法<\/td><td>对任何满足公理的结构，结论成立<\/td><\/tr><tr><td>客观性三源<\/td><td>对象 / 程序 / 规范<\/td><\/tr><tr><td>哥德尔→柏拉图<\/td><td>缺“真理独立于可证性”这一前提<\/td><\/tr><tr><td>产出多于投入<\/td><td>i²=−1 ⇒ e^{iπ}+1=0<\/td><\/tr><tr><td>象棋类比<\/td><td>规则后果 vs 可应用回现实的结论<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
