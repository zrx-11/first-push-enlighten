terId": "ch02", "type": "single", "question": "布尔代数中“与”对应哪种算术运算？", "options": ["加法", "乘法", "减法", "除法"], "answer": 1, "explain": "真值 1∧1=1，其余为 0，与乘法一致。"}, {"id": "ch02-q2", "chapterId": "ch02", "type": "single", "question": "布尔代数不能处理的是？", "options": ["命题连接", "真值计算", "量词与关系", "电路实现"], "answer": 2, "explain": "量词与关系需要谓词逻辑，弗雷格才补上。"}, {"id": "ch03-q1", "chapterId": "ch03", "type": "single", "question": "弗雷格比布尔多表达的是？", "options": ["真值表", "量词与关系", "电路", "概率"], "answer": 1, "explain": "概念文字引入了变量与量词，能表达数学结构。"}, {"id": "ch03-q2", "chapterId": "ch03", "type": "single", "question": "罗素悖论否定了哪条朴素原则？", "options": ["排中律", "任意性质都能确定一个集合", "无限不存在", "逻辑不可靠"], "answer": 1, "explain": "无限制概括原则导致自指矛盾。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "判断两个无限集合“一样多”的标准是？", "options": ["元素数量数完比较", "能一一对应", "体积比较", "密度比较"], "answer": 1, "explain": "等势由双射定义。"}, {"id": "ch04-q2", "chapterId": "ch04", "type": "single", "question": "对角线方法的作用是？", "options": ["计算极限", "构造一个不在列表中的元素以证明不可数", "求最大公约数", "排序"], "answer": 1, "explain": "逐位取反保证新对象与每个列出对象都不同。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "希尔伯特计划的两个核心目标是？", "options": ["简洁与优雅", "一致性与完备性", "速度与存储", "可视化与交互"], "answer": 1, "explain": "用有限方法证明数学不会矛盾且能证出所有真理。"}, {"id": "ch05-q2", "chapterId": "ch05", "type": "single", "question": "判定问题问的是？", "options": ["数学题难不难", "是否存在机械程序判定任意命题可证性", "计算机快不快", "公理有多少条"], "answer": 1, "explain": "Entscheidungsproblem 是可判定性的核心问题。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "哥德尔第一定理的前提是系统？", "options": ["足够弱", "足够强且一致", "完备", "有限"], "answer": 1, "explain": "强度足以表达算术，一致性保证不证出矛盾。"}, {"id": "ch06-q2", "chapterId": "ch06", "type": "single", "question": "第二定理说的是？", "options": ["系统能证明自身一致", "系统不能证明自身一致", "系统一定矛盾", "系统一定完备"], "answer": 1, "explain": "一致性证明若形式化，就落入系统内部，从而受限。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "图灵证明判定问题无解，靠的是？", "options": ["造出更快的机器", "停机问题不可判定", "哥德尔第二定理直接套用", "实验测量"], "answer": 1, "explain": "把判定问题归约到停机问题，后者不可解。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "通用图灵机的意义在于？", "options": ["速度最快", "程序可作为数据被模拟", "不需要纸带", "只能算加法"], "answer": 1, "explain": "这是存储程序思想的理论来源。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "ENIAC 编程主要靠？", "options": ["键盘输入", "插线与开关", "纸带", "语音"], "answer": 1, "explain": "改任务需重新接线，耗时很长。"}, {"id": "ch08-q2", "chapterId": "ch08", "type": "single", "question": "存储程序的关键是？", "options": ["指令与数据存放在可寻址存储器", "使用晶体管", "提高主频", "增加显示器"], "answer": 0, "explain": "指令成为可读取的数据，机器因此通用。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "ELIZA 的工作方式是？", "options": ["语义理解", "模式匹配与句式改写", "神经网络训练", "逻辑推理"], "answer": 1, "explain": "它没有语义模型，只按模板重组句子。"}, {"id": "ch09-q2", "chapterId": "ch09", "type": "single", "question": "戴维斯对“机器能思考吗”的态度接近？", "options": ["已经完全实现", "行为相似不等于理解，问题仍开放", "绝不可能", "只是语言问题"], "answer": 1, "explain": "他区分演算与心灵，不下绝对结论。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "从莱布尼茨到图灵，这条线索解决的核心问题是？", "options": ["如何造更快的加法器", "如何把推理变成可机械执行的符号操作，并界定其边界", "如何发明计算机语言", "如何证明上帝存在"], "answer": 1, "explain": "符号演算 + 可计算性界定是主线。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "罗素悖论与哥德尔句的共同结构是？", "options": ["都关于无限", "都靠自指导出矛盾", "都需要实验验证", "都只涉及几何"], "answer": 1, "explain": "自指构造是二者的骨架。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "如果有人说“未来计算机能判定所有数学命题”，最有力的反驳是？", "options": ["算力不够", "停机问题不可判定，且判定问题可归约到它", "数学命题太多", "人比机器聪明"], "answer": 1, "explain": "这是图灵 1936 年的结论，不是工程限制。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "莱布尼茨想造一种没有歧义的符号语言，让争论变成计算；这个梦想的方向是对的，缺的是能执行它的机器与能定义“可计算”的数学。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "争论为什么吵不完——一句话说清它是什么？", "back": "17 世纪的哲学与神学争论，多半败在语言：同一个词在不同人嘴里意思不同，推理靠自然语言的暗示滑过去。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "他还缺什么——一句话说清它是什么？", "back": "缺三样：一是概念的分解规则（怎么把复杂概念拆成基本符号），二是计算的执行装置，三是对“什么算得出”的界定。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "布尔把“真/假”当作 1/0，把“并且/或者/并非”当作乘法、加法、取反，于是逻辑推理变成了可以机械演算的代数。", "tags": ["ch02"]}, {"id": "f005", "chapterId": "ch02", "front": "从词到运算符——一句话说清它是什么？", "back": "**布尔代数**（Boolean algebra）把命题的真值看成两个值，把连接词看成运算：与（∧）像乘法，或（∨）像加法但要处理 1+1=1，非（¬）像 1−x。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "为什么它能变成电路——一句话说清它是什么？", "back": "与门、或门、非门就是这三个运算的物理实现：高电平代表 1，低电平代表 0。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "布尔的局限——一句话说清它是什么？", "back": "布尔代数处理的是命题之间的组合，不能处理“所有”“存在”这类量词，也不能处理关系（“A 大于 B”）。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "弗雷格造出了能表达量词与关系的形式语言，几乎把算术建立在逻辑之上；罗素用一个自指集合把他的地基抽掉。", "tags": ["ch03"]}, {"id": "f009", "chapterId": "ch03", "front": "概念文字——一句话说清它是什么？", "back": "**概念文字**（Begriffsschrift）是弗雷格发明的人工语言：有变量、量词（所有、存在）、谓词与推理规则，能把“每个自然数都有后继”这类句子写成无歧义的形式。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "逻辑主义计划——一句话说清它是什么？", "back": "弗雷格的目标是证明算术可以从纯逻辑推出——数是“集合的集合”的逻辑构造。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "罗素悖论——一句话说清它是什么？", "back": "设 R 为“所有不包含自身的集合组成的集合”。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "无限可以比较大小：两个集合能一一对应就是等势；自然数与实数不能一一对应，因此实数比自然数“更多”，而对角线方法给出了证明的通用套路。", "tags": ["ch04"]}, {"id": "f013", "chapterId": "ch04", "front": "等势：数不过来的东西怎么比——一句话说清它是什么？", "back": "**等势**（白话：两个集合的元素能一一配对，不剩也不多）。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "对角线：造一个漏网之数——一句话说清它是什么？", "back": "假设 0 到 1 之间的实数可以排成一列，每个写成无限小数。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "连续统假设——一句话说清它是什么？", "back": "康托尔证明实数集的基数比自然数大，然后猜测：没有介于两者之间的基数。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "面对悖论，希尔伯特提出把数学整体形式化，再用有限的、可靠的方法证明它一致且完备；判定问题（Entscheidungsproblem）是这套计划的执行入口。", "tags": ["ch05"]}, {"id": "f017", "chapterId": "ch05", "front": "形式主义方案——一句话说清它是什么？", "back": "把所有数学写成符号串与推理规则，证明变成符号操作。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "判定问题——一句话说清它是什么？", "back": "**判定问题**：是否存在一个机械程序，对任意形式命题判定它是否可证？如果有，数学家的工作就可以外包给机器。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "营救的裂缝——一句话说清它是什么？", "back": "布劳威尔等直觉主义者反对排中律在无限情形下使用，希尔伯特视之为威胁。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "任何足够强、一致的形式系统都有一条它证不出的真命题；因此“完备性”不可能，希尔伯特计划的核心目标落空。", "tags": ["ch06"]}, {"id": "f021", "chapterId": "ch06", "front": "算术化——一句话说清它是什么？", "back": "哥德尔给每个符号、公式、证明序列分配一个数（**哥德尔编码**）。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "自指句——一句话说清它是什么？", "back": "用对角线技巧构造命题 G：G 断言“不存在编号为 G 的证明”。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "第二定理与影响——一句话说清它是什么？", "back": "第二不完备定理更进一步：系统无法在自身内部证明自己的一致。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "图灵把“机械程序”定义为图灵机，证明不存在判定停机的一般程序，从而否定判定问题；同一篇论文里的通用机，成了通用计算机的理论原型。", "tags": ["ch07"]}, {"id": "f025", "chapterId": "ch07", "front": "把计算写成机器——一句话说清它是什么？", "back": "图灵机的部件（纸带、读写头、规则表）在《皇帝新脑》一章已出现过，这里重点不同：图灵要的是一个**定义**，而不是一台机器。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "停机问题否定判定问题——一句话说清它是什么？", "back": "如果存在判定任意命题可证性的程序，就能判定任意图灵机是否停机（把停机问题编码成命题）。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "通用机：一台机器模拟所有机器——一句话说清它是什么？", "back": "把某台机器的规则表编码到纸带上，通用机读它并模拟之。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "ENIAC 用插线与开关编程，算得快但改程序极慢；ACE 沿用图灵的存储程序设想，把指令放进存储器，从此改程序只需改数据。", "tags": ["ch08"]}, {"id": "f029", "chapterId": "ch08", "front": "ENIAC：电子管的速度——一句话说清它是什么？", "back": "ENIAC 用真空管做运算，每秒能完成数千次加法，比机电式机器快几个数量级。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "存储程序的分水岭——一句话说清它是什么？", "back": "把指令与数据放在同一个可寻址存储器里，机器就能读指令并执行——这是**存储程序**（stored program）。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "图灵的 ACE 与极简主义——一句话说清它是什么？", "back": "图灵设计的 ACE 追求极简：用最少的硬件，把复杂度放到程序里。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "计算机实现了莱布尼茨的“演算”部分，却没有实现“理解”部分；ELIZA 的对话幻觉提醒我们，行为像理解与真的理解之间仍有距离。", "tags": ["ch09"]}, {"id": "f033", "chapterId": "ch09", "front": "ELIZA 的幻觉——一句话说清它是什么？", "back": "ELIZA 用模式匹配把用户的句子改写成问句，例如把“我很难过”变成“你为什么难过”。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "符号处理与大脑——一句话说清它是什么？", "back": "书末把计算机与大脑放在一起看：两者都在分子层面之上做“符号处理”，但计算机的符号是人给的，大脑的符号是进化与学习形成的。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "莱布尼茨之梦的兑现与缺口——一句话说清它是什么？", "back": "兑现的部分：形式语言、可判定性、通用机、存储程序——争论确实可以变成计算。", "tags": ["ch09"]}], "companion": "engines-of-logic学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：莱布尼茨之梦<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明莱布尼茨设想的“普遍语言”要解决什么问题\n<\/li><li>\n能指出这个梦想为什么在当时无法实现\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>莱布尼茨想造一种没有歧义的符号语言，让争论变成计算；这个梦想的方向是对的，缺的是能执行它的机器与能定义“可计算”的数学。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：争论为什么吵不完（难度：基础）<\/h3>\n<p>17 世纪的哲学与神学争论，多半败在语言：同一个词在不同人嘴里意思不同，推理靠自然语言的暗示滑过去。莱布尼茨的方案是造一套<strong>普遍语言<\/strong>（characteristica universalis）：每个概念对应一个符号，推理变成符号的加减组合，两个人吵起来只需坐下来算。<\/p>\n<h3>概念 2：他还缺什么（难度：进阶）<\/h3>\n<p>缺三样：一是概念的分解规则（怎么把复杂概念拆成基本符号），二是计算的执行装置，三是对“什么算得出”的界定。莱布尼茨自己造过一台能加减乘除的机械计算器，但没有程序的概念。这三样要等布尔、图灵、工程师们分别补上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;争论为什么吵不完&quot;]\n  n2[&quot;他还缺什么&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把菜谱写成一串配方编号：只要编号表统一，谁都能复现同一道菜。边界：菜谱的“味道”没法编号，莱布尼茨的梦想也有同样的边界——并非所有意义都能符号化。\n<\/li><li>\n<strong>实例<\/strong>：用符号化重写一句争论：“自由意志与决定论不相容。”拆成 F（有自由意志）、D（一切被决定）、R（两者相容），写成 ¬(F∧D→R) 之类的形式，争论点就变成某个符号的真值，而不是词义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为莱布尼茨预言了计算机——实际上他预言的是符号演算，机器是后来才有的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n莱布尼茨“普遍语言”的核心想法是？\n<ul>\n<li>\nA. 发明世界语\n<\/li><li>\nB. 用无歧义符号把推理变成计算\n<\/li><li>\nC. 建立百科全书\n<\/li><li>\nD. 改良拉丁文\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：目标是让争论可计算，而非造一门自然语言。\n<\/li><li>\n这个梦想在当时缺的关键条件是？\n<\/li><li>\nA. 纸张\n<\/li><li>\nB. 可执行的计算装置与可计算性概念\n<\/li><li>\nC. 数学家太少\n<\/li><li>\nD. 宗教反对\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：缺机器与理论，符号方案本身并不缺。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n梦想：争论 → 计算\n<\/li><li>\n缺：分解规则、执行装置、可计算性定义\n<\/li><li>\n符号化不等于意义全部可编码\n<\/ul>", "kind": "chapter", "title": "第 1 章 莱布尼茨之梦"}, "ch02": {"html": "<h1>第 2 章：布尔把逻辑变成代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用与、或、非写出一个复合命题的真值表\n<\/li><li>\n能说明布尔代数为什么能用电路实现\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>布尔把“真/假”当作 1/0，把“并且/或者/并非”当作乘法、加法、取反，于是逻辑推理变成了可以机械演算的代数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从词到运算符（难度：基础）<\/h3>\n<p><strong>布尔代数<\/strong>（Boolean algebra）把命题的真值看成两个值，把连接词看成运算：与（∧）像乘法，或（∨）像加法但要处理 1+1=1，非（¬）像 1−x。复合命题的真值可以由子命题的真值算出，不必理解内容。这一步把“推理”从语义拉到了语法。<\/p>\n<h3>概念 2：为什么它能变成电路（难度：进阶）<\/h3>\n<p>与门、或门、非门就是这三个运算的物理实现：高电平代表 1，低电平代表 0。任意布尔表达式都能用门电路搭出来，这就是数字电路的基础。逻辑因此第一次有了“可制造”的形态。<\/p>\n<h3>概念 3：布尔的局限（难度：高难）<\/h3>\n<p>布尔代数处理的是命题之间的组合，不能处理“所有”“存在”这类量词，也不能处理关系（“A 大于 B”）。要表达数学证明，需要更强的语言——这正是弗雷格下一章要做的事。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从词到运算符&quot;]\n  n2[&quot;为什么它能变成电路&quot;]\n  n1 --&gt; n2\n  n3[&quot;布尔的局限&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把“如果下雨就带伞”写成电路：雨=1，伞=1，规则是“雨且无伞”为错误状态，报警器一响就说明推理出错。边界：电路只能检查真值组合，不能判断“带伞”是否合理。\n<\/li><li>\n<strong>实例<\/strong>：命题 P=“下雨”，Q=“地湿”。P→Q 等价于 ¬P∨Q。真值表四行：TT→T，TF→F，FT→T，FF→T。只有“下雨但地没湿”这一行是假——这一行就是反例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为布尔代数只是数学玩具——实际上它是所有数字电路与搜索引擎查询语法的底层。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n布尔代数中“与”对应哪种算术运算？\n<ul>\n<li>\nA. 加法\n<\/li><li>\nB. 乘法\n<\/li><li>\nC. 减法\n<\/li><li>\nD. 除法\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：真值 1∧1=1，其余为 0，与乘法一致。\n<\/li><li>\n布尔代数不能处理的是？\n<\/li><li>\nA. 命题连接\n<\/li><li>\nB. 真值计算\n<\/li><li>\nC. 量词与关系\n<\/li><li>\nD. 电路实现\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：量词与关系需要谓词逻辑，弗雷格才补上。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真/假 → 1/0\n<\/li><li>\n与或非 → 乘加取反\n<\/li><li>\n逻辑 → 门电路\n<\/ul>", "kind": "chapter", "title": "第 2 章 布尔把逻辑变成代数"}, "ch03": {"html": "<h1>第 3 章：弗雷格：从突破到绝望<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明弗雷格的“概念文字”比布尔强在哪\n<\/li><li>\n能复述罗素悖论并指出它击中了什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>弗雷格造出了能表达量词与关系的形式语言，几乎把算术建立在逻辑之上；罗素用一个自指集合把他的地基抽掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：概念文字（难度：进阶）<\/h3>\n<p><strong>概念文字<\/strong>（Begriffsschrift）是弗雷格发明的人工语言：有变量、量词（所有、存在）、谓词与推理规则，能把“每个自然数都有后继”这类句子写成无歧义的形式。它比布尔强的地方在于能表达结构与关系，而不只是命题组合。<\/p>\n<h3>概念 2：逻辑主义计划（难度：进阶）<\/h3>\n<p>弗雷格的目标是证明算术可以从纯逻辑推出——数是“集合的集合”的逻辑构造。如果成功，数学就有了绝对可靠的地基。他在《算术基础》里推进得很远，直到罗素来信。<\/p>\n<h3>概念 3：罗素悖论（难度：高难）<\/h3>\n<p>设 R 为“所有不包含自身的集合组成的集合”。问：R 包含自身吗？若包含，按定义它不该包含；若不包含，按定义它该包含。矛盾。这不是技术细节，它说明“任意性质都能确定一个集合”的朴素原则是错的。弗雷格在附录里承认地基被抽掉。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;概念文字&quot;]\n  n2[&quot;逻辑主义计划&quot;]\n  n1 --&gt; n2\n  n3[&quot;罗素悖论&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个“本店为所有不给自己理发的理发师理发”的招牌：理发师该不该给自己理发？两边都不对。边界：现实里可以加一条规则回避，逻辑系统里加规则就等于改公理。\n<\/li><li>\n<strong>实例<\/strong>：用集合语言复述：设 A={x | x∉x}。若 A∈A，则 A 满足 x∉x，故 A∉A；若 A∉A，则 A 满足 x∉x，故 A∈A。两支都推出矛盾，证明 A 不存在。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为罗素悖论只是文字游戏——实际上它迫使数学界重建集合论公理（如类型论、ZFC）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n弗雷格比布尔多表达的是？\n<ul>\n<li>\nA. 真值表\n<\/li><li>\nB. 量词与关系\n<\/li><li>\nC. 电路\n<\/li><li>\nD. 概率\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：概念文字引入了变量与量词，能表达数学结构。\n<\/li><li>\n罗素悖论否定了哪条朴素原则？\n<\/li><li>\nA. 排中律\n<\/li><li>\nB. 任意性质都能确定一个集合\n<\/li><li>\nC. 无限不存在\n<\/li><li>\nD. 逻辑不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无限制概括原则导致自指矛盾。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n概念文字：量词 + 关系\n<\/li><li>\n逻辑主义：算术从逻辑推出\n<\/li><li>\n罗素悖论抽掉地基\n<\/ul>", "kind": "chapter", "title": "第 3 章 弗雷格：从突破到绝望"}, "ch04": {"html": "<h1>第 4 章：康托尔：在无限中摸索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释“一一对应”如何用来比较无限的大小\n<\/li><li>\n能说明对角线方法的基本构造\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无限可以比较大小：两个集合能一一对应就是等势；自然数与实数不能一一对应，因此实数比自然数“更多”，而对角线方法给出了证明的通用套路。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：等势：数不过来的东西怎么比（难度：进阶）<\/h3>\n<p><strong>等势<\/strong>（白话：两个集合的元素能一一配对，不剩也不多）。自然数与偶数等势（n↔2n），虽然偶数看起来“少一半”。这说明无限集合可以与自己的一部分等势——这正是无限与有限的根本区别。<\/p>\n<h3>概念 2：对角线：造一个漏网之数（难度：高难）<\/h3>\n<p>假设 0 到 1 之间的实数可以排成一列，每个写成无限小数。构造一个新数：第 1 位取第 1 个数的第 1 位加 1，第 2 位取第 2 个数的第 2 位加 1……得到的新数在每一位上都与对应那个数不同，因此不在列表里。矛盾。所以实数不可数。<\/p>\n<h3>概念 3：连续统假设（难度：高难）<\/h3>\n<p>康托尔证明实数集的基数比自然数大，然后猜测：没有介于两者之间的基数。这就是<strong>连续统假设<\/strong>。他没能证明，希尔伯特把它列为第一问题。后来哥德尔与科恩证明它独立于 ZFC——既不能证也不能否。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;等势：数不过来的东西怎么比&quot;]\n  n2[&quot;对角线：造一个漏网之数&quot;]\n  n1 --&gt; n2\n  n3[&quot;连续统假设&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给无限个座位与无限个人配对：只要能一一坐下就“一样多”，哪怕座位看起来只占一半。边界：现实中没有无限旅馆，这个类比只在集合论里成立。\n<\/li><li>\n<strong>实例<\/strong>：自然数与有理数等势：把有理数排成 p/q 的表格，沿对角线蛇形编号，每个有理数都能得到一个自然数编号。看似“更密”的有理数，其实与自然数一样多。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“无限都一樣大”——实际上有可数无限与不可数无限，层级还能一直往上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断两个无限集合“一样多”的标准是？\n<ul>\n<li>\nA. 元素数量数完比较\n<\/li><li>\nB. 能一一对应\n<\/li><li>\nC. 体积比较\n<\/li><li>\nD. 密度比较\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：等势由双射定义。\n<\/li><li>\n对角线方法的作用是？\n<\/li><li>\nA. 计算极限\n<\/li><li>\nB. 构造一个不在列表中的元素以证明不可数\n<\/li><li>\nC. 求最大公约数\n<\/li><li>\nD. 排序\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：逐位取反保证新对象与每个列出对象都不同。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等势 = 一一对应\n<\/li><li>\n实数不可数（对角线法）\n<\/li><li>\n连续统假设独立于 ZFC\n<\/ul>", "kind": "chapter", "title": "第 4 章 康托尔：在无限中摸索"}, "ch05": {"html": "<h1>第 5 章：希尔伯特的营救<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出希尔伯特计划的三个目标\n<\/li><li>\n能解释“判定问题”为什么是关键\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面对悖论，希尔伯特提出把数学整体形式化，再用有限的、可靠的方法证明它一致且完备；判定问题（Entscheidungsproblem）是这套计划的执行入口。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：形式主义方案（难度：基础）<\/h3>\n<p>把所有数学写成符号串与推理规则，证明变成符号操作。然后做两件事：<strong>一致性<\/strong>（不会推出矛盾）、<strong>完备性<\/strong>（每个真命题都能证）。这两件事必须用“有限方法”（finitism）来证，不能用有争议的无限工具——否则就是循环论证。<\/p>\n<h3>概念 2：判定问题（难度：进阶）<\/h3>\n<p><strong>判定问题<\/strong>：是否存在一个机械程序，对任意形式命题判定它是否可证？如果有，数学家的工作就可以外包给机器；如果没有，形式主义计划就缺一个关键工具。希尔伯特相信有，并把它列为重大目标。<\/p>\n<h3>概念 3：营救的裂缝（难度：高难）<\/h3>\n<p>布劳威尔等直觉主义者反对排中律在无限情形下使用，希尔伯特视之为威胁。更深的裂缝在于：要证明一个形式系统一致，所需的工具往往比系统本身更强——这使得“用有限方法证明全部数学一致”变得可疑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;形式主义方案&quot;]\n  n2[&quot;判定问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;营救的裂缝&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给一栋漏水的楼做整体加固：先把每块砖编号（形式化），再证明“这栋楼不会塌”（一致性）。边界：加固用的脚手架本身可能比楼更不稳。\n<\/li><li>\n<strong>实例<\/strong>：把“2+2=4”写成形式证明：从皮亚诺公理出发，逐步应用替换与归纳规则，得到符号串。整个证明可以检查，不需要理解“2”是什么——这就是形式化的意义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式化让数学变得无意义——实际上它让证明可机械检查，意义另在解释层。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n希尔伯特计划的两个核心目标是？\n<ul>\n<li>\nA. 简洁与优雅\n<\/li><li>\nB. 一致性与完备性\n<\/li><li>\nC. 速度与存储\n<\/li><li>\nD. 可视化与交互\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：用有限方法证明数学不会矛盾且能证出所有真理。\n<\/li><li>\n判定问题问的是？\n<\/li><li>\nA. 数学题难不难\n<\/li><li>\nB. 是否存在机械程序判定任意命题可证性\n<\/li><li>\nC. 计算机快不快\n<\/li><li>\nD. 公理有多少条\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：Entscheidungsproblem 是可判定性的核心问题。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n形式化：证明 = 符号操作\n<\/li><li>\n两目标：一致、完备\n<\/li><li>\n判定问题是执行入口\n<\/ul>", "kind": "chapter", "title": "第 5 章 希尔伯特的营救"}, "ch06": {"html": "<h1>第 6 章：哥德尔使计划落空<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出哥德尔第一不完备定理的内容与前提\n<\/li><li>\n能解释“可证性”如何被算术化\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>任何足够强、一致的形式系统都有一条它证不出的真命题；因此“完备性”不可能，希尔伯特计划的核心目标落空。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算术化（难度：进阶）<\/h3>\n<p>哥德尔给每个符号、公式、证明序列分配一个数（<strong>哥德尔编码<\/strong>）。于是“这段符号是证明”变成“这个数满足某个算术关系”，“存在一个证明”变成“存在一个数……”。元数学的陈述被翻译进算术本身。<\/p>\n<h3>概念 2：自指句（难度：高难）<\/h3>\n<p>用对角线技巧构造命题 G：G 断言“不存在编号为 G 的证明”。若系统证出 G，则 G 为假，系统不一致；若系统一致，则 G 不可证，而 G 恰好为真。结论：一致 ⇒ 不完备。<\/p>\n<h3>概念 3：第二定理与影响（难度：高难）<\/h3>\n<p>第二不完备定理更进一步：系统无法在自身内部证明自己的一致。希尔伯特想用有限方法证明数学一致，而这类证明一旦形式化就落在系统内部，于是不可能。戴维斯的叙述强调：这不是数学的失败，而是对“数学能对自己说什么”的边界刻画。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;算术化&quot;]\n  n2[&quot;自指句&quot;]\n  n1 --&gt; n2\n  n3[&quot;第二定理与影响&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个人无法用自己写的简历证明简历全是真的：需要外部见证。边界：外部见证也存在同样的自证问题，所以只能层层外推，没有终点。\n<\/li><li>\n<strong>实例<\/strong>：把“本句不可证”换成算术句：存在一个数 n，它编码了“G 的证明”；G 说“不存在这样的 n”。检查每个 n 都不是证明，就验证了 G 为真——但这个过程不能在系统内部完成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为哥德尔定理说明数学不可靠——实际上它说明数学不能被自身完全把握，可靠性并不因此丧失。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔第一定理的前提是系统？\n<ul>\n<li>\nA. 足够弱\n<\/li><li>\nB. 足够强且一致\n<\/li><li>\nC. 完备\n<\/li><li>\nD. 有限\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：强度足以表达算术，一致性保证不证出矛盾。\n<\/li><li>\n第二定理说的是？\n<\/li><li>\nA. 系统能证明自身一致\n<\/li><li>\nB. 系统不能证明自身一致\n<\/li><li>\nC. 系统一定矛盾\n<\/li><li>\nD. 系统一定完备\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：一致性证明若形式化，就落入系统内部，从而受限。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n哥德尔编码：符号 → 数\n<\/li><li>\nG：我不可证 → 真而不可证\n<\/li><li>\n一致 ⇒ 不完备；一致不能自证\n<\/ul>", "kind": "chapter", "title": "第 6 章 哥德尔使计划落空"}, "ch07": {"html": "<h1>第 7 章：图灵构想通用计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述图灵机并解释它如何回答判定问题\n<\/li><li>\n能说明“通用机”与“存储程序”的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图灵把“机械程序”定义为图灵机，证明不存在判定停机的一般程序，从而否定判定问题；同一篇论文里的通用机，成了通用计算机的理论原型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把计算写成机器（难度：进阶）<\/h3>\n<p>图灵机的部件（纸带、读写头、规则表）在《皇帝新脑》一章已出现过，这里重点不同：图灵要的是一个<strong>定义<\/strong>，而不是一台机器。定义清楚后，“可计算”就有了精确含义：图灵可计算。<\/p>\n<h3>概念 2：停机问题否定判定问题（难度：高难）<\/h3>\n<p>如果存在判定任意命题可证性的程序，就能判定任意图灵机是否停机（把停机问题编码成命题）。图灵证明停机不可判定，因此判定问题无解。希尔伯特计划失去执行工具。<\/p>\n<h3>概念 3：通用机：一台机器模拟所有机器（难度：高难）<\/h3>\n<p>把某台机器的规则表编码到纸带上，通用机读它并模拟之。这意味着“程序”可以作为数据被处理——这正是后来存储程序计算机的思想核心。图灵 1936 年的论文因此不只是数学，它是计算机的出生证明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;把计算写成机器&quot;]\n  n2[&quot;停机问题否定判定问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;通用机：一台机器模拟所有机器&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台能读任何乐谱并演奏的自动钢琴：乐谱是数据，钢琴是通用机。边界：钢琴仍需机械结构，图灵机把结构抽象掉了。\n<\/li><li>\n<strong>实例<\/strong>：把“加法机”的规则表编号写成 0/1 串，喂给通用机；通用机按串里的规则移动读写头，输出和。整个过程没有专门的加法硬件，只有通用规则。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为图灵机只是理论玩具——实际上它定义了“可计算”，并直接启发了真实计算机的架构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n图灵证明判定问题无解，靠的是？\n<ul>\n<li>\nA. 造出更快的机器\n<\/li><li>\nB. 停机问题不可判定\n<\/li><li>\nC. 哥德尔第二定理直接套用\n<\/li><li>\nD. 实验测量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把判定问题归约到停机问题，后者不可解。\n<\/li><li>\n通用图灵机的意义在于？\n<\/li><li>\nA. 速度最快\n<\/li><li>\nB. 程序可作为数据被模拟\n<\/li><li>\nC. 不需要纸带\n<\/li><li>\nD. 只能算加法\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是存储程序思想的理论来源。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图灵机 = 可计算的精确定义\n<\/li><li>\n停机不可判定 ⇒ 判定问题无解\n<\/li><li>\n通用机 = 存储程序原型\n<\/ul>", "kind": "chapter", "title": "第 7 章 图灵构想通用计算机"}, "ch08": {"html": "<h1>第 8 章：研制第一批通用计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出 ENIAC 与 ACE 的设计差别\n<\/li><li>\n能解释“存储程序”为什么是分水岭\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>ENIAC 用插线与开关编程，算得快但改程序极慢；ACE 沿用图灵的存储程序设想，把指令放进存储器，从此改程序只需改数据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ENIAC：电子管的速度（难度：基础）<\/h3>\n<p>ENIAC 用真空管做运算，每秒能完成数千次加法，比机电式机器快几个数量级。但它的“程序”体现为插线板与开关位置，换一个任务要重新接线，几天才能改好。<\/p>\n<h3>概念 2：存储程序的分水岭（难度：进阶）<\/h3>\n<p>把指令与数据放在同一个可寻址存储器里，机器就能读指令并执行——这是<strong>存储程序<\/strong>（stored program）。它让“通用”从理论变成工程：同一台机器，换一份程序就能做完全不同的事。<\/p>\n<h3>概念 3：图灵的 ACE 与极简主义（难度：高难）<\/h3>\n<p>图灵设计的 ACE 追求极简：用最少的硬件，把复杂度放到程序里。戴维斯指出这种极简思路对当时工程影响有限，但它预示了微程序设计——用软件实现硬件指令。历史选择了另一条路：硬件更复杂，软件更通用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;ENIAC：电子管的速度&quot;]\n  n2[&quot;存储程序的分水岭&quot;]\n  n1 --&gt; n2\n  n3[&quot;图灵的 ACE 与极简主义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台可换卡带的游戏机：卡带是程序，机器是通用硬件。边界：早期计算机换“卡带”要重新接线，存储程序才真正实现即换即用。\n<\/li><li>\n<strong>实例<\/strong>：同一台存储程序计算机，装入排序程序就排序，装入求解方程程序就解方程；ENIAC 做同样两件事要两次重新插线。这个差别就是通用性的实际含义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为第一台计算机就是“通用”的——实际上 ENIAC 是专用接线式，存储程序才是通用的起点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nENIAC 编程主要靠？\n<ul>\n<li>\nA. 键盘输入\n<\/li><li>\nB. 插线与开关\n<\/li><li>\nC. 纸带\n<\/li><li>\nD. 语音\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：改任务需重新接线，耗时很长。\n<\/li><li>\n存储程序的关键是？\n<\/li><li>\nA. 指令与数据存放在可寻址存储器\n<\/li><li>\nB. 使用晶体管\n<\/li><li>\nC. 提高主频\n<\/li><li>\nD. 增加显示器\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：指令成为可读取的数据，机器因此通用。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nENIAC：快，但改程序靠接线\n<\/li><li>\n存储程序：指令即数据\n<\/li><li>\nACE 极简主义预示微程序\n<\/ul>", "kind": "chapter", "title": "第 8 章 研制第一批通用计算机"}, "ch09": {"html": "<h1>第 9 章：超越莱布尼茨之梦<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 ELIZA 揭示了什么、又误导了什么\n<\/li><li>\n能判断“机器能思考吗”这个问题在什么意义上仍未解决\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算机实现了莱布尼茨的“演算”部分，却没有实现“理解”部分；ELIZA 的对话幻觉提醒我们，行为像理解与真的理解之间仍有距离。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ELIZA 的幻觉（难度：基础）<\/h3>\n<p>ELIZA 用模式匹配把用户的句子改写成问句，例如把“我很难过”变成“你为什么难过”。它没有任何语义模型，却让不少用户以为它懂自己。戴维斯用这段真实对话说明：<strong>行为层面的相似<\/strong>极易被误读为理解。<\/p>\n<h3>概念 2：符号处理与大脑（难度：进阶）<\/h3>\n<p>书末把计算机与大脑放在一起看：两者都在分子层面之上做“符号处理”，但计算机的符号是人给的，大脑的符号是进化与学习形成的。戴维斯不否认机器智能的可能，只提醒“实现演算”与“拥有心灵”不是同一件事。<\/p>\n<h3>概念 3：莱布尼茨之梦的兑现与缺口（难度：高难）<\/h3>\n<p>兑现的部分：形式语言、可判定性、通用机、存储程序——争论确实可以变成计算。缺口：概念如何被分解、意义从哪来、意识如何出现。戴维斯把这三项留给后来者，不给廉价结论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;ELIZA 的幻觉&quot;]\n  n2[&quot;符号处理与大脑&quot;]\n  n1 --&gt; n2\n  n3[&quot;莱布尼茨之梦的兑现与缺口&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台会自动回复的客服机器人：话术对得上，理解不一定在。边界：真人客服也可能只背话术，所以“像”与“是”的界线不靠行为判定。\n<\/li><li>\n<strong>实例<\/strong>：输入“我觉得没人喜欢我”，ELIZA 回“你觉得没人喜欢你吗？”——语法正确、情绪贴合，但它没有“喜欢”的概念。把输入换成“我觉得没人恨我”，它同样能套模板，语义却反了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为通过图灵测试就等于有意识——实际上测试只检验行为不可区分，不检验内部机制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nELIZA 的工作方式是？\n<ul>\n<li>\nA. 语义理解\n<\/li><li>\nB. 模式匹配与句式改写\n<\/li><li>\nC. 神经网络训练\n<\/li><li>\nD. 逻辑推理\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它没有语义模型，只按模板重组句子。\n<\/li><li>\n戴维斯对“机器能思考吗”的态度接近？\n<\/li><li>\nA. 已经完全实现\n<\/li><li>\nB. 行为相似不等于理解，问题仍开放\n<\/li><li>\nC. 绝不可能\n<\/li><li>\nD. 只是语言问题\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他区分演算与心灵，不下绝对结论。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nELIZA：模式匹配制造理解幻觉\n<\/li><li>\n计算机实现了演算，未实现意义\n<\/li><li>\n行为相似 ≠ 内部理解\n<\/ul>", "kind": "chapter", "title": "第 9 章 超越莱布尼茨之梦"}, "c01": {"html": "<h1>形式化与判定问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 05 章、第 06 章、第 07 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把数学写成符号系统，并追问是否存在机械程序判定任意命题的可证性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整本书的枢纽：往前接弗雷格与康托尔，往后接哥德尔与图灵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>形式化的三件套：字母表、形成规则（什么是合法公式）、推理规则。<\/p>\n<p>判定问题要求一个对所有输入都终止、输出真/假的程序。<\/p>\n<p>历史结局：哥德尔否定了完备性，图灵否定了可判定性。两者合起来终结了希尔伯特计划的原版。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式化等于把数学变成无意义的符号——它只是把“可检查”与“可理解”分开。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>希尔伯特<\/td><td>提出计划<\/td><\/tr><tr><td>ch07<\/td><td>图灵<\/td><td>否定判定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n哥德尔不完备、图灵机\n<\/ul>", "kind": "concept", "title": "形式化与判定问题"}, "c02": {"html": "<h1>自指与对角线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用“对象指涉自身”的构造制造矛盾或证明不可能性，对角线是它最常用的技术形式。<\/p>\n<h2>为什么重要<\/h2>\n<p>罗素悖论、康托尔不可数、哥德尔句、停机问题共用同一个骨架。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种形态：集合自属（罗素）、逐位取反（康托尔）、命题自指（哥德尔）。<\/p>\n<p>共同步骤：假设存在一个完备的列表/系统；构造一个“与每一项都不同”的对象；导出矛盾。<\/p>\n<p>用途：不是制造麻烦，而是划定边界——哪些列表不可能存在，哪些系统不可能完备。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对角线只是技巧——它是关于“自我指涉”的一般方法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>罗素悖论<\/td><td>集合自指<\/td><\/tr><tr><td>ch06<\/td><td>哥德尔<\/td><td>命题自指<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n罗素悖论、哥德尔句、停机问题\n<\/ul>", "kind": "concept", "title": "自指与对角线"}, "c03": {"html": "<h1>可计算性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 07 章、第 08 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个函数可计算，当且仅当存在图灵机对任意输入都在有限步内给出输出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“算法”从直觉变成定义，使“不存在程序”这类命题可以被证明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>丘奇-图灵论题：直觉可计算 = 图灵可计算。它不是定理，而是被广泛接受的界定。<\/p>\n<p>不可计算的典型：停机问题、某些丢番图方程可解性判定。<\/p>\n<p>工程含义：可计算不等于可实行，复杂度与资源另算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不可计算等于没人算得出来——它指不存在任何算法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>图灵<\/td><td>定义与否定<\/td><\/tr><tr><td>ch08<\/td><td>ACE<\/td><td>工程实现<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n图灵机、停机问题、存储程序\n<\/ul>", "kind": "concept", "title": "可计算性"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：莱布尼茨之梦<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 莱布尼茨之梦<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：布尔把逻辑变成代数<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 布尔把逻辑变成代数<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：弗雷格：从突破到绝望<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 弗雷格：从突破到绝望<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：康托尔：在无限中摸索<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 康托尔：在无限中摸索<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：希尔伯特的营救<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 希尔伯特的营救<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：哥德尔使计划落空<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 哥德尔使计划落空<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：图灵构想通用计算机<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 图灵构想通用计算机<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：研制第一批通用计算机<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 研制第一批通用计算机<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：超越莱布尼茨之梦<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 超越莱布尼茨之梦<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q19.<\/b> 从莱布尼茨到图灵，这条线索解决的核心问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 如何造更快的加法器<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 如何把推理变成可机械执行的符号操作，并界定其边界<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 如何发明计算机语言<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 如何证明上帝存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q20.<\/b> 罗素悖论与哥德尔句的共同结构是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 都关于无限<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 都靠自指导出矛盾<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 都需要实验验证<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 都只涉及几何<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q21.<\/b> 如果有人说“未来计算机能判定所有数学命题”，最有力的反驳是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 算力不够<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 停机问题不可判定，且判定问题可归约到它<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 数学命题太多<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 人比机器聪明<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章 莱布尼茨之梦<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 莱布尼茨“普遍语言”的核心想法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 发明世界语<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 用无歧义符号把推理变成计算<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 建立百科全书<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 改良拉丁文<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 这个梦想在当时缺的关键条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 纸张<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 可执行的计算装置与可计算性概念<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 数学家太少<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 宗教反对<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章 布尔把逻辑变成代数<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 布尔代数中“与”对应哪种算术运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 加法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 乘法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 减法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 除法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 布尔代数不能处理的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q2' value='0'> 命题连接<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='1'> 真值计算<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='2'> 量词与关系<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='3'> 电路实现<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章 弗雷格：从突破到绝望<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 弗雷格比布尔多表达的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 真值表<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 量词与关系<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 电路<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 概率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 罗素悖论否定了哪条朴素原则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q2' value='0'> 排中律<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='1'> 任意性质都能确定一个集合<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='2'> 无限不存在<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='3'> 逻辑不可靠<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章 康托尔：在无限中摸索<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断两个无限集合“一样多”的标准是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 元素数量数完比较<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 能一一对应<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 体积比较<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 密度比较<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对角线方法的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q2' value='0'> 计算极限<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='1'> 构造一个不在列表中的元素以证明不可数<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='2'> 求最大公约数<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='3'> 排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章 希尔伯特的营救<\/h1><div class='quiz-item' data-qid='ch05-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 希尔伯特计划的两个核心目标是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q1' value='0'> 简洁与优雅<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='1'> 一致性与完备性<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='2'> 速度与存储<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='3'> 可视化与交互<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 判定问题问的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q2' value='0'> 数学题难不难<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='1'> 是否存在机械程序判定任意命题可证性<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='2'> 计算机快不快<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='3'> 公理有多少条<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章 哥德尔使计划落空<\/h1><div class='quiz-item' data-qid='ch06-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 哥德尔第一定理的前提是系统？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 足够弱<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> 足够强且一致<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> 完备<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> 有限<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 第二定理说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q2' value='0'> 系统能证明自身一致<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='1'> 系统不能证明自身一致<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='2'> 系统一定矛盾<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='3'> 系统一定完备<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章 图灵构想通用计算机<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图灵证明判定问题无解，靠的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 造出更快的机器<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 停机问题不可判定<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 哥德尔第二定理直接套用<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 实验测量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 通用图灵机的意义在于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 速度最快<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 程序可作为数据被模拟<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 不需要纸带<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 只能算加法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章 研制第一批通用计算机<\/h1><div class='quiz-item' data-qid='ch08-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ENIAC 编程主要靠？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q1' value='0'> 键盘输入<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='1'> 插线与开关<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='2'> 纸带<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='3'> 语音<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 存储程序的关键是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q2' value='0'> 指令与数据存放在可寻址存储器<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='1'> 使用晶体管<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='2'> 提高主频<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='3'> 增加显示器<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章 超越莱布尼茨之梦<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ELIZA 的工作方式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 语义理解<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 模式匹配与句式改写<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 神经网络训练<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 逻辑推理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 戴维斯对“机器能思考吗”的态度接近？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q2' value='0'> 已经完全实现<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='1'> 行为相似不等于理解，问题仍开放<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 绝不可能<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 只是语言问题<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='普遍语言'>普遍语言 — 莱布尼茨设想的无歧义符号系统 <span class=glossary-ref>（第 1 章 莱布尼茨之梦）<\/span><\/li><li data-term='布尔代数'>布尔代数 — 以真值 1/0 与与或非运算构成的对策代数 <span class=glossary-ref>（第 2 章 布尔把逻辑变成代数）<\/span><\/li><li data-term='概念文字'>概念文字 — 弗雷格发明的带量词与关系的形式语言 <span class=glossary-ref>（第 3 章 弗雷格：从突破到绝望）<\/span><\/li><li data-term='罗素悖论'>罗素悖论 — 所有不包含自身的集合组成的集合导致的矛盾 <span class=glossary-ref>（第 3 章 弗雷格：从突破到绝望）<\/span><\/li><li data-term='等势'>等势 — 两个集合元素可一一对应 <span class=glossary-ref>（第 4 章 康托尔：在无限中摸索）<\/span><\/li><li data-term='对角线方法'>对角线方法 — 逐位构造与列表中每项都不同的对象 <span class=glossary-ref>（第 4 章 康托尔：在无限中摸索）<\/span><\/li><li data-term='连续统假设'>连续统假设 — 实数基数与自然数基数之间没有其他基数 <span class=glossary-ref>（第 4 章 康托尔：在无限中摸索）<\/span><\/li><li data-term='判定问题'>判定问题 — 是否存在机械程序判定任意命题可证性 <span class=glossary-ref>（第 5 章 希尔伯特的营救）<\/span><\/li><li data-term='有限主义'>有限主义 — 只接受可有限构造的数学对象与方法 <span class=glossary-ref>（第 5 章 希尔伯特的营救）<\/span><\/li><li data-term='哥德尔编码'>哥德尔编码 — 把符号与证明映射为自然数 <span class=glossary-ref>（第 6 章 哥德尔使计划落空）<\/span><\/li><li data-term='第一不完备定理'>第一不完备定理 — 足够强且一致的系统存在不可证的真命题 <span class=glossary-ref>（第 6 章 哥德尔使计划落空）<\/span><\/li><li data-term='第二不完备定理'>第二不完备定理 — 系统不能在自身内部证明自身一致 <span class=glossary-ref>（第 6 章 哥德尔使计划落空）<\/span><\/li><li data-term='图灵机'>图灵机 — 纸带、读写头与规则表构成的抽象计算模型 <span class=glossary-ref>（第 7 章 图灵构想通用计算机）<\/span><\/li><li data-term='停机问题'>停机问题 — 判定任意程序是否终止，不可解 <span class=glossary-ref>（第 7 章 图灵构想通用计算机）<\/span><\/li><li data-term='通用图灵机'>通用图灵机 — 能模拟任何图灵机的机器 <span class=glossary-ref>（第 7 章 图灵构想通用计算机）<\/span><\/li><li data-term='存储程序'>存储程序 — 指令与数据共存于可寻址存储器 <span class=glossary-ref>（第 8 章 研制第一批通用计算机）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>逻辑的引擎 模式与框架库<\/h1>\n<h2>分析框架：逻辑史的四次“地基危机”<\/h2>\n<ol><li>\n弗雷格：集合概括原则 → 罗素悖论；\n<\/li><li>\n康托尔：无限与连续统 → 基数层级未定；\n<\/li><li>\n希尔伯特：完备性要求 → 哥德尔否定；\n<\/li><li>\n希尔伯特：可判定性要求 → 图灵否定。\n<p>每次危机的解法都不是“修补漏洞”，而是重新定义对象（类型论、公理化集合论、可计算性）。<\/p>\n<\/ol>\n<h2>决策规则：遇到“某系统能判定一切”的主张<\/h2>\n<p>if 主张者说系统能判定任意命题 then 问：能否判定“本程序是否停机” if 能 then 与停机问题矛盾，主张不成立<\/p>\n<h2>反模式：把行为相似当理解<\/h2>\n<p>ELIZA 式的对话幻觉：模式匹配能产生“被理解”的感受。判断时要看内部机制，而不是只看输出像不像。<\/p>\n<h2>反模式：把哥德尔定理当万能反驳<\/h2>\n<p>哥德尔只约束“足够强且一致的形式系统”。用它反驳具体计算模型时，必须说明该模型确实对应这样一个系统。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>布尔三运算<\/td><td>与=乘，或=加（1+1=1），非=1−x<\/td><\/tr><tr><td>罗素悖论<\/td><td>R={x<\/td><td>x∉x}，R∈R 与 R∉R 都矛盾<\/td><\/tr><tr><td>等势<\/td><td>存在一一对应（双射）<\/td><\/tr><tr><td>对角线<\/td><td>逐位取反，构造列表外的对象<\/td><\/tr><tr><td>判定问题<\/td><td>Entscheidungsproblem，图灵用停机问题否定<\/td><\/tr><tr><td>哥德尔 G<\/td><td>“本命题不可证”：一致则不可证，故为真<\/td><\/tr><tr><td>可计算<\/td><td>图灵可计算（丘奇-图灵论题）<\/td><\/tr><tr><td>存储程序<\/td><td>指令当数据存，换程序不用接线<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/04-逻辑的引擎", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 莱布尼茨之梦", "href": "#/chapter/ch01"}, {"label": "第 2 章 布尔把逻辑变成代数", "href": "#/chapter/ch02"}, {"label": "第 3 章 弗雷格：从突破到绝望", "href": "#/chapter/ch03"}, {"label": "第 4 章 康托尔：在无限中摸索", "href": "#/chapter/ch04"}, {"label": "第 5 章 希尔伯特的营救", "href": "#/chapter/ch05"}, {"label": "第 6 章 哥德尔使计划落空", "href": "#/chapter/ch06"}, {"label": "第 7 章 图灵构想通用计算机", "href": "#/chapter/ch07"}, {"label": "第 8 章 研制第一批通用计算机", "href": "#/chapter/ch08"}, {"label": "第 9 章 超越莱布尼茨之梦", "href": "#/chapter/ch09"}]}, {"label": "概念", "children": [{"label": "形式化与判定问题", "href": "#/concept/c01"}, {"label": "自指与对角线", "href": "#/concept/c02"}, {"label": "可计算性", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 莱布尼茨之梦", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 布尔把逻辑变成代数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 弗雷格：从突破到绝望", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 康托尔：在无限中摸索", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 希尔伯特的营救", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 哥德尔使计划落空", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 图灵构想通用计算机", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 研制第一批通用计算机", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 超越莱布尼茨之梦", "href": "#/quiz/ch09"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：莱布尼茨之梦<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明莱布尼茨设想的“普遍语言”要解决什么问题\n<\/li><li>\n能指出这个梦想为什么在当时无法实现\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>莱布尼茨想造一种没有歧义的符号语言，让争论变成计算；这个梦想的方向是对的，缺的是能执行它的机器与能定义“可计算”的数学。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：争论为什么吵不完（难度：基础）<\/h3>\n<p>17 世纪的哲学与神学争论，多半败在语言：同一个词在不同人嘴里意思不同，推理靠自然语言的暗示滑过去。莱布尼茨的方案是造一套<strong>普遍语言<\/strong>（characteristica universalis）：每个概念对应一个符号，推理变成符号的加减组合，两个人吵起来只需坐下来算。<\/p>\n<h3>概念 2：他还缺什么（难度：进阶）<\/h3>\n<p>缺三样：一是概念的分解规则（怎么把复杂概念拆成基本符号），二是计算的执行装置，三是对“什么算得出”的界定。莱布尼茨自己造过一台能加减乘除的机械计算器，但没有程序的概念。这三样要等布尔、图灵、工程师们分别补上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;争论为什么吵不完&quot;]\n  n2[&quot;他还缺什么&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把菜谱写成一串配方编号：只要编号表统一，谁都能复现同一道菜。边界：菜谱的“味道”没法编号，莱布尼茨的梦想也有同样的边界——并非所有意义都能符号化。\n<\/li><li>\n<strong>实例<\/strong>：用符号化重写一句争论：“自由意志与决定论不相容。”拆成 F（有自由意志）、D（一切被决定）、R（两者相容），写成 ¬(F∧D→R) 之类的形式，争论点就变成某个符号的真值，而不是词义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为莱布尼茨预言了计算机——实际上他预言的是符号演算，机器是后来才有的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n莱布尼茨“普遍语言”的核心想法是？\n<ul>\n<li>\nA. 发明世界语\n<\/li><li>\nB. 用无歧义符号把推理变成计算\n<\/li><li>\nC. 建立百科全书\n<\/li><li>\nD. 改良拉丁文\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：目标是让争论可计算，而非造一门自然语言。\n<\/li><li>\n这个梦想在当时缺的关键条件是？\n<\/li><li>\nA. 纸张\n<\/li><li>\nB. 可执行的计算装置与可计算性概念\n<\/li><li>\nC. 数学家太少\n<\/li><li>\nD. 宗教反对\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：缺机器与理论，符号方案本身并不缺。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n梦想：争论 → 计算\n<\/li><li>\n缺：分解规则、执行装置、可计算性定义\n<\/li><li>\n符号化不等于意义全部可编码\n<\/ul>", "ch02": "<h1>第 2 章：布尔把逻辑变成代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用与、或、非写出一个复合命题的真值表\n<\/li><li>\n能说明布尔代数为什么能用电路实现\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>布尔把“真/假”当作 1/0，把“并且/或者/并非”当作乘法、加法、取反，于是逻辑推理变成了可以机械演算的代数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从词到运算符（难度：基础）<\/h3>\n<p><strong>布尔代数<\/strong>（Boolean algebra）把命题的真值看成两个值，把连接词看成运算：与（∧）像乘法，或（∨）像加法但要处理 1+1=1，非（¬）像 1−x。复合命题的真值可以由子命题的真值算出，不必理解内容。这一步把“推理”从语义拉到了语法。<\/p>\n<h3>概念 2：为什么它能变成电路（难度：进阶）<\/h3>\n<p>与门、或门、非门就是这三个运算的物理实现：高电平代表 1，低电平代表 0。任意布尔表达式都能用门电路搭出来，这就是数字电路的基础。逻辑因此第一次有了“可制造”的形态。<\/p>\n<h3>概念 3：布尔的局限（难度：高难）<\/h3>\n<p>布尔代数处理的是命题之间的组合，不能处理“所有”“存在”这类量词，也不能处理关系（“A 大于 B”）。要表达数学证明，需要更强的语言——这正是弗雷格下一章要做的事。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从词到运算符&quot;]\n  n2[&quot;为什么它能变成电路&quot;]\n  n1 --&gt; n2\n  n3[&quot;布尔的局限&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把“如果下雨就带伞”写成电路：雨=1，伞=1，规则是“雨且无伞”为错误状态，报警器一响就说明推理出错。边界：电路只能检查真值组合，不能判断“带伞”是否合理。\n<\/li><li>\n<strong>实例<\/strong>：命题 P=“下雨”，Q=“地湿”。P→Q 等价于 ¬P∨Q。真值表四行：TT→T，TF→F，FT→T，FF→T。只有“下雨但地没湿”这一行是假——这一行就是反例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为布尔代数只是数学玩具——实际上它是所有数字电路与搜索引擎查询语法的底层。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n布尔代数中“与”对应哪种算术运算？\n<ul>\n<li>\nA. 加法\n<\/li><li>\nB. 乘法\n<\/li><li>\nC. 减法\n<\/li><li>\nD. 除法\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：真值 1∧1=1，其余为 0，与乘法一致。\n<\/li><li>\n布尔代数不能处理的是？\n<\/li><li>\nA. 命题连接\n<\/li><li>\nB. 真值计算\n<\/li><li>\nC. 量词与关系\n<\/li><li>\nD. 电路实现\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：量词与关系需要谓词逻辑，弗雷格才补上。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真/假 → 1/0\n<\/li><li>\n与或非 → 乘加取反\n<\/li><li>\n逻辑 → 门电路\n<\/ul>", "ch03": "<h1>第 3 章：弗雷格：从突破到绝望<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明弗雷格的“概念文字”比布尔强在哪\n<\/li><li>\n能复述罗素悖论并指出它击中了什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>弗雷格造出了能表达量词与关系的形式语言，几乎把算术建立在逻辑之上；罗素用一个自指集合把他的地基抽掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：概念文字（难度：进阶）<\/h3>\n<p><strong>概念文字<\/strong>（Begriffsschrift）是弗雷格发明的人工语言：有变量、量词（所有、存在）、谓词与推理规则，能把“每个自然数都有后继”这类句子写成无歧义的形式。它比布尔强的地方在于能表达结构与关系，而不只是命题组合。<\/p>\n<h3>概念 2：逻辑主义计划（难度：进阶）<\/h3>\n<p>弗雷格的目标是证明算术可以从纯逻辑推出——数是“集合的集合”的逻辑构造。如果成功，数学就有了绝对可靠的地基。他在《算术基础》里推进得很远，直到罗素来信。<\/p>\n<h3>概念 3：罗素悖论（难度：高难）<\/h3>\n<p>设 R 为“所有不包含自身的集合组成的集合”。问：R 包含自身吗？若包含，按定义它不该包含；若不包含，按定义它该包含。矛盾。这不是技术细节，它说明“任意性质都能确定一个集合”的朴素原则是错的。弗雷格在附录里承认地基被抽掉。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;概念文字&quot;]\n  n2[&quot;逻辑主义计划&quot;]\n  n1 --&gt; n2\n  n3[&quot;罗素悖论&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个“本店为所有不给自己理发的理发师理发”的招牌：理发师该不该给自己理发？两边都不对。边界：现实里可以加一条规则回避，逻辑系统里加规则就等于改公理。\n<\/li><li>\n<strong>实例<\/strong>：用集合语言复述：设 A={x | x∉x}。若 A∈A，则 A 满足 x∉x，故 A∉A；若 A∉A，则 A 满足 x∉x，故 A∈A。两支都推出矛盾，证明 A 不存在。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为罗素悖论只是文字游戏——实际上它迫使数学界重建集合论公理（如类型论、ZFC）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n弗雷格比布尔多表达的是？\n<ul>\n<li>\nA. 真值表\n<\/li><li>\nB. 量词与关系\n<\/li><li>\nC. 电路\n<\/li><li>\nD. 概率\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：概念文字引入了变量与量词，能表达数学结构。\n<\/li><li>\n罗素悖论否定了哪条朴素原则？\n<\/li><li>\nA. 排中律\n<\/li><li>\nB. 任意性质都能确定一个集合\n<\/li><li>\nC. 无限不存在\n<\/li><li>\nD. 逻辑不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无限制概括原则导致自指矛盾。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n概念文字：量词 + 关系\n<\/li><li>\n逻辑主义：算术从逻辑推出\n<\/li><li>\n罗素悖论抽掉地基\n<\/ul>", "ch04": "<h1>第 4 章：康托尔：在无限中摸索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释“一一对应”如何用来比较无限的大小\n<\/li><li>\n能说明对角线方法的基本构造\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无限可以比较大小：两个集合能一一对应就是等势；自然数与实数不能一一对应，因此实数比自然数“更多”，而对角线方法给出了证明的通用套路。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：等势：数不过来的东西怎么比（难度：进阶）<\/h3>\n<p><strong>等势<\/strong>（白话：两个集合的元素能一一配对，不剩也不多）。自然数与偶数等势（n↔2n），虽然偶数看起来“少一半”。这说明无限集合可以与自己的一部分等势——这正是无限与有限的根本区别。<\/p>\n<h3>概念 2：对角线：造一个漏网之数（难度：高难）<\/h3>\n<p>假设 0 到 1 之间的实数可以排成一列，每个写成无限小数。构造一个新数：第 1 位取第 1 个数的第 1 位加 1，第 2 位取第 2 个数的第 2 位加 1……得到的新数在每一位上都与对应那个数不同，因此不在列表里。矛盾。所以实数不可数。<\/p>\n<h3>概念 3：连续统假设（难度：高难）<\/h3>\n<p>康托尔证明实数集的基数比自然数大，然后猜测：没有介于两者之间的基数。这就是<strong>连续统假设<\/strong>。他没能证明，希尔伯特把它列为第一问题。后来哥德尔与科恩证明它独立于 ZFC——既不能证也不能否。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;等势：数不过来的东西怎么比&quot;]\n  n2[&quot;对角线：造一个漏网之数&quot;]\n  n1 --&gt; n2\n  n3[&quot;连续统假设&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给无限个座位与无限个人配对：只要能一一坐下就“一样多”，哪怕座位看起来只占一半。边界：现实中没有无限旅馆，这个类比只在集合论里成立。\n<\/li><li>\n<strong>实例<\/strong>：自然数与有理数等势：把有理数排成 p/q 的表格，沿对角线蛇形编号，每个有理数都能得到一个自然数编号。看似“更密”的有理数，其实与自然数一样多。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“无限都一樣大”——实际上有可数无限与不可数无限，层级还能一直往上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断两个无限集合“一样多”的标准是？\n<ul>\n<li>\nA. 元素数量数完比较\n<\/li><li>\nB. 能一一对应\n<\/li><li>\nC. 体积比较\n<\/li><li>\nD. 密度比较\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：等势由双射定义。\n<\/li><li>\n对角线方法的作用是？\n<\/li><li>\nA. 计算极限\n<\/li><li>\nB. 构造一个不在列表中的元素以证明不可数\n<\/li><li>\nC. 求最大公约数\n<\/li><li>\nD. 排序\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：逐位取反保证新对象与每个列出对象都不同。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等势 = 一一对应\n<\/li><li>\n实数不可数（对角线法）\n<\/li><li>\n连续统假设独立于 ZFC\n<\/ul>", "ch05": "<h1>第 5 章：希尔伯特的营救<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出希尔伯特计划的三个目标\n<\/li><li>\n能解释“判定问题”为什么是关键\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面对悖论，希尔伯特提出把数学整体形式化，再用有限的、可靠的方法证明它一致且完备；判定问题（Entscheidungsproblem）是这套计划的执行入口。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：形式主义方案（难度：基础）<\/h3>\n<p>把所有数学写成符号串与推理规则，证明变成符号操作。然后做两件事：<strong>一致性<\/strong>（不会推出矛盾）、<strong>完备性<\/strong>（每个真命题都能证）。这两件事必须用“有限方法”（finitism）来证，不能用有争议的无限工具——否则就是循环论证。<\/p>\n<h3>概念 2：判定问题（难度：进阶）<\/h3>\n<p><strong>判定问题<\/strong>：是否存在一个机械程序，对任意形式命题判定它是否可证？如果有，数学家的工作就可以外包给机器；如果没有，形式主义计划就缺一个关键工具。希尔伯特相信有，并把它列为重大目标。<\/p>\n<h3>概念 3：营救的裂缝（难度：高难）<\/h3>\n<p>布劳威尔等直觉主义者反对排中律在无限情形下使用，希尔伯特视之为威胁。更深的裂缝在于：要证明一个形式系统一致，所需的工具往往比系统本身更强——这使得“用有限方法证明全部数学一致”变得可疑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;形式主义方案&quot;]\n  n2[&quot;判定问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;营救的裂缝&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给一栋漏水的楼做整体加固：先把每块砖编号（形式化），再证明“这栋楼不会塌”（一致性）。边界：加固用的脚手架本身可能比楼更不稳。\n<\/li><li>\n<strong>实例<\/strong>：把“2+2=4”写成形式证明：从皮亚诺公理出发，逐步应用替换与归纳规则，得到符号串。整个证明可以检查，不需要理解“2”是什么——这就是形式化的意义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式化让数学变得无意义——实际上它让证明可机械检查，意义另在解释层。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n希尔伯特计划的两个核心目标是？\n<ul>\n<li>\nA. 简洁与优雅\n<\/li><li>\nB. 一致性与完备性\n<\/li><li>\nC. 速度与存储\n<\/li><li>\nD. 可视化与交互\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：用有限方法证明数学不会矛盾且能证出所有真理。\n<\/li><li>\n判定问题问的是？\n<\/li><li>\nA. 数学题难不难\n<\/li><li>\nB. 是否存在机械程序判定任意命题可证性\n<\/li><li>\nC. 计算机快不快\n<\/li><li>\nD. 公理有多少条\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：Entscheidungsproblem 是可判定性的核心问题。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n形式化：证明 = 符号操作\n<\/li><li>\n两目标：一致、完备\n<\/li><li>\n判定问题是执行入口\n<\/ul>", "ch06": "<h1>第 6 章：哥德尔使计划落空<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出哥德尔第一不完备定理的内容与前提\n<\/li><li>\n能解释“可证性”如何被算术化\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>任何足够强、一致的形式系统都有一条它证不出的真命题；因此“完备性”不可能，希尔伯特计划的核心目标落空。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算术化（难度：进阶）<\/h3>\n<p>哥德尔给每个符号、公式、证明序列分配一个数（<strong>哥德尔编码<\/strong>）。于是“这段符号是证明”变成“这个数满足某个算术关系”，“存在一个证明”变成“存在一个数……”。元数学的陈述被翻译进算术本身。<\/p>\n<h3>概念 2：自指句（难度：高难）<\/h3>\n<p>用对角线技巧构造命题 G：G 断言“不存在编号为 G 的证明”。若系统证出 G，则 G 为假，系统不一致；若系统一致，则 G 不可证，而 G 恰好为真。结论：一致 ⇒ 不完备。<\/p>\n<h3>概念 3：第二定理与影响（难度：高难）<\/h3>\n<p>第二不完备定理更进一步：系统无法在自身内部证明自己的一致。希尔伯特想用有限方法证明数学一致，而这类证明一旦形式化就落在系统内部，于是不可能。戴维斯的叙述强调：这不是数学的失败，而是对“数学能对自己说什么”的边界刻画。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;算术化&quot;]\n  n2[&quot;自指句&quot;]\n  n1 --&gt; n2\n  n3[&quot;第二定理与影响&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个人无法用自己写的简历证明简历全是真的：需要外部见证。边界：外部见证也存在同样的自证问题，所以只能层层外推，没有终点。\n<\/li><li>\n<strong>实例<\/strong>：把“本句不可证”换成算术句：存在一个数 n，它编码了“G 的证明”；G 说“不存在这样的 n”。检查每个 n 都不是证明，就验证了 G 为真——但这个过程不能在系统内部完成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为哥德尔定理说明数学不可靠——实际上它说明数学不能被自身完全把握，可靠性并不因此丧失。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔第一定理的前提是系统？\n<ul>\n<li>\nA. 足够弱\n<\/li><li>\nB. 足够强且一致\n<\/li><li>\nC. 完备\n<\/li><li>\nD. 有限\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：强度足以表达算术，一致性保证不证出矛盾。\n<\/li><li>\n第二定理说的是？\n<\/li><li>\nA. 系统能证明自身一致\n<\/li><li>\nB. 系统不能证明自身一致\n<\/li><li>\nC. 系统一定矛盾\n<\/li><li>\nD. 系统一定完备\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：一致性证明若形式化，就落入系统内部，从而受限。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n哥德尔编码：符号 → 数\n<\/li><li>\nG：我不可证 → 真而不可证\n<\/li><li>\n一致 ⇒ 不完备；一致不能自证\n<\/ul>", "ch07": "<h1>第 7 章：图灵构想通用计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述图灵机并解释它如何回答判定问题\n<\/li><li>\n能说明“通用机”与“存储程序”的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图灵把“机械程序”定义为图灵机，证明不存在判定停机的一般程序，从而否定判定问题；同一篇论文里的通用机，成了通用计算机的理论原型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把计算写成机器（难度：进阶）<\/h3>\n<p>图灵机的部件（纸带、读写头、规则表）在《皇帝新脑》一章已出现过，这里重点不同：图灵要的是一个<strong>定义<\/strong>，而不是一台机器。定义清楚后，“可计算”就有了精确含义：图灵可计算。<\/p>\n<h3>概念 2：停机问题否定判定问题（难度：高难）<\/h3>\n<p>如果存在判定任意命题可证性的程序，就能判定任意图灵机是否停机（把停机问题编码成命题）。图灵证明停机不可判定，因此判定问题无解。希尔伯特计划失去执行工具。<\/p>\n<h3>概念 3：通用机：一台机器模拟所有机器（难度：高难）<\/h3>\n<p>把某台机器的规则表编码到纸带上，通用机读它并模拟之。这意味着“程序”可以作为数据被处理——这正是后来存储程序计算机的思想核心。图灵 1936 年的论文因此不只是数学，它是计算机的出生证明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;把计算写成机器&quot;]\n  n2[&quot;停机问题否定判定问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;通用机：一台机器模拟所有机器&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台能读任何乐谱并演奏的自动钢琴：乐谱是数据，钢琴是通用机。边界：钢琴仍需机械结构，图灵机把结构抽象掉了。\n<\/li><li>\n<strong>实例<\/strong>：把“加法机”的规则表编号写成 0/1 串，喂给通用机；通用机按串里的规则移动读写头，输出和。整个过程没有专门的加法硬件，只有通用规则。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为图灵机只是理论玩具——实际上它定义了“可计算”，并直接启发了真实计算机的架构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n图灵证明判定问题无解，靠的是？\n<ul>\n<li>\nA. 造出更快的机器\n<\/li><li>\nB. 停机问题不可判定\n<\/li><li>\nC. 哥德尔第二定理直接套用\n<\/li><li>\nD. 实验测量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把判定问题归约到停机问题，后者不可解。\n<\/li><li>\n通用图灵机的意义在于？\n<\/li><li>\nA. 速度最快\n<\/li><li>\nB. 程序可作为数据被模拟\n<\/li><li>\nC. 不需要纸带\n<\/li><li>\nD. 只能算加法\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是存储程序思想的理论来源。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图灵机 = 可计算的精确定义\n<\/li><li>\n停机不可判定 ⇒ 判定问题无解\n<\/li><li>\n通用机 = 存储程序原型\n<\/ul>", "ch08": "<h1>第 8 章：研制第一批通用计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出 ENIAC 与 ACE 的设计差别\n<\/li><li>\n能解释“存储程序”为什么是分水岭\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>ENIAC 用插线与开关编程，算得快但改程序极慢；ACE 沿用图灵的存储程序设想，把指令放进存储器，从此改程序只需改数据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ENIAC：电子管的速度（难度：基础）<\/h3>\n<p>ENIAC 用真空管做运算，每秒能完成数千次加法，比机电式机器快几个数量级。但它的“程序”体现为插线板与开关位置，换一个任务要重新接线，几天才能改好。<\/p>\n<h3>概念 2：存储程序的分水岭（难度：进阶）<\/h3>\n<p>把指令与数据放在同一个可寻址存储器里，机器就能读指令并执行——这是<strong>存储程序<\/strong>（stored program）。它让“通用”从理论变成工程：同一台机器，换一份程序就能做完全不同的事。<\/p>\n<h3>概念 3：图灵的 ACE 与极简主义（难度：高难）<\/h3>\n<p>图灵设计的 ACE 追求极简：用最少的硬件，把复杂度放到程序里。戴维斯指出这种极简思路对当时工程影响有限，但它预示了微程序设计——用软件实现硬件指令。历史选择了另一条路：硬件更复杂，软件更通用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;ENIAC：电子管的速度&quot;]\n  n2[&quot;存储程序的分水岭&quot;]\n  n1 --&gt; n2\n  n3[&quot;图灵的 ACE 与极简主义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台可换卡带的游戏机：卡带是程序，机器是通用硬件。边界：早期计算机换“卡带”要重新接线，存储程序才真正实现即换即用。\n<\/li><li>\n<strong>实例<\/strong>：同一台存储程序计算机，装入排序程序就排序，装入求解方程程序就解方程；ENIAC 做同样两件事要两次重新插线。这个差别就是通用性的实际含义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为第一台计算机就是“通用”的——实际上 ENIAC 是专用接线式，存储程序才是通用的起点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nENIAC 编程主要靠？\n<ul>\n<li>\nA. 键盘输入\n<\/li><li>\nB. 插线与开关\n<\/li><li>\nC. 纸带\n<\/li><li>\nD. 语音\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：改任务需重新接线，耗时很长。\n<\/li><li>\n存储程序的关键是？\n<\/li><li>\nA. 指令与数据存放在可寻址存储器\n<\/li><li>\nB. 使用晶体管\n<\/li><li>\nC. 提高主频\n<\/li><li>\nD. 增加显示器\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：指令成为可读取的数据，机器因此通用。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nENIAC：快，但改程序靠接线\n<\/li><li>\n存储程序：指令即数据\n<\/li><li>\nACE 极简主义预示微程序\n<\/ul>", "ch09": "<h1>第 9 章：超越莱布尼茨之梦<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 ELIZA 揭示了什么、又误导了什么\n<\/li><li>\n能判断“机器能思考吗”这个问题在什么意义上仍未解决\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算机实现了莱布尼茨的“演算”部分，却没有实现“理解”部分；ELIZA 的对话幻觉提醒我们，行为像理解与真的理解之间仍有距离。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ELIZA 的幻觉（难度：基础）<\/h3>\n<p>ELIZA 用模式匹配把用户的句子改写成问句，例如把“我很难过”变成“你为什么难过”。它没有任何语义模型，却让不少用户以为它懂自己。戴维斯用这段真实对话说明：<strong>行为层面的相似<\/strong>极易被误读为理解。<\/p>\n<h3>概念 2：符号处理与大脑（难度：进阶）<\/h3>\n<p>书末把计算机与大脑放在一起看：两者都在分子层面之上做“符号处理”，但计算机的符号是人给的，大脑的符号是进化与学习形成的。戴维斯不否认机器智能的可能，只提醒“实现演算”与“拥有心灵”不是同一件事。<\/p>\n<h3>概念 3：莱布尼茨之梦的兑现与缺口（难度：高难）<\/h3>\n<p>兑现的部分：形式语言、可判定性、通用机、存储程序——争论确实可以变成计算。缺口：概念如何被分解、意义从哪来、意识如何出现。戴维斯把这三项留给后来者，不给廉价结论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;ELIZA 的幻觉&quot;]\n  n2[&quot;符号处理与大脑&quot;]\n  n1 --&gt; n2\n  n3[&quot;莱布尼茨之梦的兑现与缺口&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台会自动回复的客服机器人：话术对得上，理解不一定在。边界：真人客服也可能只背话术，所以“像”与“是”的界线不靠行为判定。\n<\/li><li>\n<strong>实例<\/strong>：输入“我觉得没人喜欢我”，ELIZA 回“你觉得没人喜欢你吗？”——语法正确、情绪贴合，但它没有“喜欢”的概念。把输入换成“我觉得没人恨我”，它同样能套模板，语义却反了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为通过图灵测试就等于有意识——实际上测试只检验行为不可区分，不检验内部机制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nELIZA 的工作方式是？\n<ul>\n<li>\nA. 语义理解\n<\/li><li>\nB. 模式匹配与句式改写\n<\/li><li>\nC. 神经网络训练\n<\/li><li>\nD. 逻辑推理\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它没有语义模型，只按模板重组句子。\n<\/li><li>\n戴维斯对“机器能思考吗”的态度接近？\n<\/li><li>\nA. 已经完全实现\n<\/li><li>\nB. 行为相似不等于理解，问题仍开放\n<\/li><li>\nC. 绝不可能\n<\/li><li>\nD. 只是语言问题\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他区分演算与心灵，不下绝对结论。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nELIZA：模式匹配制造理解幻觉\n<\/li><li>\n计算机实现了演算，未实现意义\n<\/li><li>\n行为相似 ≠ 内部理解\n<\/ul>", "c01": "<h1>形式化与判定问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 05 章、第 06 章、第 07 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把数学写成符号系统，并追问是否存在机械程序判定任意命题的可证性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整本书的枢纽：往前接弗雷格与康托尔，往后接哥德尔与图灵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>形式化的三件套：字母表、形成规则（什么是合法公式）、推理规则。<\/p>\n<p>判定问题要求一个对所有输入都终止、输出真/假的程序。<\/p>\n<p>历史结局：哥德尔否定了完备性，图灵否定了可判定性。两者合起来终结了希尔伯特计划的原版。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式化等于把数学变成无意义的符号——它只是把“可检查”与“可理解”分开。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>希尔伯特<\/td><td>提出计划<\/td><\/tr><tr><td>ch07<\/td><td>图灵<\/td><td>否定判定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n哥德尔不完备、图灵机\n<\/ul>", "c02": "<h1>自指与对角线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用“对象指涉自身”的构造制造矛盾或证明不可能性，对角线是它最常用的技术形式。<\/p>\n<h2>为什么重要<\/h2>\n<p>罗素悖论、康托尔不可数、哥德尔句、停机问题共用同一个骨架。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种形态：集合自属（罗素）、逐位取反（康托尔）、命题自指（哥德尔）。<\/p>\n<p>共同步骤：假设存在一个完备的列表/系统；构造一个“与每一项都不同”的对象；导出矛盾。<\/p>\n<p>用途：不是制造麻烦，而是划定边界——哪些列表不可能存在，哪些系统不可能完备。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对角线只是技巧——它是关于“自我指涉”的一般方法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>罗素悖论<\/td><td>集合自指<\/td><\/tr><tr><td>ch06<\/td><td>哥德尔<\/td><td>命题自指<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n罗素悖论、哥德尔句、停机问题\n<\/ul>", "c03": "<h1>可计算性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 07 章、第 08 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个函数可计算，当且仅当存在图灵机对任意输入都在有限步内给出输出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“算法”从直觉变成定义，使“不存在程序”这类命题可以被证明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>丘奇-图灵论题：直觉可计算 = 图灵可计算。它不是定理，而是被广泛接受的界定。<\/p>\n<p>不可计算的典型：停机问题、某些丢番图方程可解性判定。<\/p>\n<p>工程含义：可计算不等于可实行，复杂度与资源另算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不可计算等于没人算得出来——它指不存在任何算法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>图灵<\/td><td>定义与否定<\/td><\/tr><tr><td>ch08<\/td><td>ACE<\/td><td>工程实现<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n图灵机、停机问题、存储程序\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：莱布尼茨之梦<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 莱布尼茨之梦<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：布尔把逻辑变成代数<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 布尔把逻辑变成代数<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：弗雷格：从突破到绝望<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 弗雷格：从突破到绝望<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：康托尔：在无限中摸索<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 康托尔：在无限中摸索<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：希尔伯特的营救<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 希尔伯特的营救<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：哥德尔使计划落空<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 哥德尔使计划落空<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：图灵构想通用计算机<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 图灵构想通用计算机<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：研制第一批通用计算机<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 研制第一批通用计算机<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：超越莱布尼茨之梦<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 超越莱布尼茨之梦<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q19.<\/b> 从莱布尼茨到图灵，这条线索解决的核心问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 如何造更快的加法器<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 如何把推理变成可机械执行的符号操作，并界定其边界<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 如何发明计算机语言<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 如何证明上帝存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q20.<\/b> 罗素悖论与哥德尔句的共同结构是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 都关于无限<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 都靠自指导出矛盾<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 都需要实验验证<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 都只涉及几何<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q21.<\/b> 如果有人说“未来计算机能判定所有数学命题”，最有力的反驳是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 算力不够<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 停机问题不可判定，且判定问题可归约到它<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 数学命题太多<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 人比机器聪明<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章 莱布尼茨之梦<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 莱布尼茨“普遍语言”的核心想法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 发明世界语<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 用无歧义符号把推理变成计算<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 建立百科全书<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 改良拉丁文<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 这个梦想在当时缺的关键条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 纸张<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 可执行的计算装置与可计算性概念<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 数学家太少<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 宗教反对<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章 布尔把逻辑变成代数<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 布尔代数中“与”对应哪种算术运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 加法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 乘法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 减法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 除法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 布尔代数不能处理的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q2' value='0'> 命题连接<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='1'> 真值计算<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='2'> 量词与关系<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='3'> 电路实现<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章 弗雷格：从突破到绝望<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 弗雷格比布尔多表达的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 真值表<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 量词与关系<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 电路<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 概率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 罗素悖论否定了哪条朴素原则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q2' value='0'> 排中律<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='1'> 任意性质都能确定一个集合<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='2'> 无限不存在<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='3'> 逻辑不可靠<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章 康托尔：在无限中摸索<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断两个无限集合“一样多”的标准是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 元素数量数完比较<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 能一一对应<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 体积比较<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 密度比较<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q2' data-type='single'><p class='quiz-q
