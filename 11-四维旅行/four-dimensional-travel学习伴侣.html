<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四维旅行</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>四维旅行</h1>
    <div class="sub">普瓦德万：空间与时间里的十二个谜</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "four-dimensional-travel", "title": "四维旅行", "subtitle": "普瓦德万：空间与时间里的十二个谜", "book": {"title": "四维旅行", "author": "R.L. 普瓦德万（Robin Le Poidevin），胡凯衡、邹若竹 译", "source": ["第一推动丛书·综合系列（2022年版）"]}, "audience": "零基础", "goal": "读完能辨析“时间是变化吗”“空间有边缘吗”“现在特殊吗”“时间有方向吗”这四个问题各自的不同立场，并知道每个立场的代价", "learningPath": [{"step": "01", "title": "时间的测量", "chapterIds": ["ch01"], "checkpoint": "完成第 1 章自测题，答对 2 题以上"}, {"step": "02", "title": "变化", "chapterIds": ["ch02"], "checkpoint": "完成第 2 章自测题，答对 2 题以上"}, {"step": "03", "title": "没边的盒子？", "chapterIds": ["ch03"], "checkpoint": "完成第 3 章自测题，答对 2 题以上"}, {"step": "04", "title": "曲线和维数", "chapterIds": ["ch04"], "checkpoint": "完成第 4 章自测题，答对 2 题以上"}, {"step": "05", "title": "时间的开端和结尾", "chapterIds": ["ch05"], "checkpoint": "完成第 5 章自测题，答对 2 题以上"}, {"step": "06", "title": "空间的边缘", "chapterIds": ["ch06"], "checkpoint": "完成第 6 章自测题，答对 2 题以上"}, {"step": "07", "title": "无穷和悖论", "chapterIds": ["ch07"], "checkpoint": "完成第 7 章自测题，答对 2 题以上"}, {"step": "08", "title": "时间会流逝吗？", "chapterIds": ["ch08"], "checkpoint": "完成第 8 章自测题，答对 2 题以上"}, {"step": "09", "title": "像放电影的宇宙", "chapterIds": ["ch09"], "checkpoint": "完成第 9 章自测题，答对 2 题以上"}, {"step": "10", "title": "干预历史", "chapterIds": ["ch10"], "checkpoint": "完成第 10 章自测题，答对 2 题以上"}, {"step": "11", "title": "我们之外的时间和空间", "chapterIds": ["ch11"], "checkpoint": "完成第 11 章自测题，答对 2 题以上"}, {"step": "12", "title": "时间箭头", "chapterIds": ["ch12"], "checkpoint": "完成第 12 章自测题，答对 2 题以上"}], "chapters": [{"id": "ch01", "title": "第 1 章 时间的测量", "file": "chapters/ch01-时间的测量.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章 变化", "file": "chapters/ch02-变化.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章 没边的盒子？", "file": "chapters/ch03-没边的盒子.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章 曲线和维数", "file": "chapters/ch04-曲线和维数.md", "difficulty": 2}, {"id": "ch05", "title": "第 5 章 时间的开端和结尾", "file": "chapters/ch05-时间的开端和结尾.md", "difficulty": 3}, {"id": "ch06", "title": "第 6 章 空间的边缘", "file": chapterId": "ch02", "type": "single", "question": "“时间即变化”的主要困难是？", "options": ["无法测量", "难以说明变化之间的间隔", "变化不存在", "时间可逆"], "answer": 1, "explain": "间隔若无变化，时间是否仍在流逝成问题。"}, {"id": "ch03-q1", "chapterId": "ch03", "type": "single", "question": "亚里士多德反对虚空的核心论据是？", "options": ["真空太冷", "运动需要介质，空间不能独立于物体", "原子不存在", "气压太低"], "answer": 1, "explain": "他把空间当作物体间的关系。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "非欧几何的出现说明了？", "options": ["欧氏几何错误", "平行公设可替换且各自自洽", "空间只有三维", "几何是实验科学"], "answer": 1, "explain": "公设替换产生不同的自洽几何。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "奥古斯丁对“创世之前”的回答是？", "options": ["有另一个宇宙", "时间与创世同时被造，问“之前”无意义", "上帝在睡觉", "时间是循环的"], "answer": 1, "explain": "他把时间本身纳入被造物。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "“有限但无边界”的模型是？", "options": ["盒子", "球面", "平面", "直线"], "answer": 1, "explain": "球面面积有限，但走不到边。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "阿基里斯悖论的数学回应核心是？", "options": ["无穷级数收敛", "乌龟更慢", "时间停止", "空间有边"], "answer": 0, "explain": "无穷段之和可收敛到有限值。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "麦克塔格特论证的结论是？", "options": ["时间可逆", "A 系列矛盾，时间不真实", "B 系列矛盾", "现在最重要"], "answer": 1, "explain": "他以 A 系列的自相矛盾否定时间的实在性。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "“飞矢不动”论证的关键假设是？", "options": ["箭会停", "时间由瞬间组成且瞬间内无运动", "空间有限", "速度可变"], "answer": 1, "explain": "把运动拆成瞬间属性导致悖论。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "祖父悖论的“自洽解”主张？", "options": ["过去可随意改", "只有自洽的历史可能", "时间不存在", "多世界"], "answer": 1, "explain": "任何行动都纳入既定历史，不产生矛盾。"}, {"id": "ch11-q1", "chapterId": "ch11", "type": "single", "question": "“遥远副本”依赖的前提是？", "options": ["量子坍缩", "宇宙无限且分布均匀", "时间旅行", "暗能量"], "answer": 1, "explain": "无限空间使有限组合重复。"}, {"id": "ch12-q1", "chapterId": "ch12", "type": "single", "question": "时间箭头不包括？", "options": ["热力学", "宇宙学", "心理学", "电磁学"], "answer": 3, "explain": "三个主要箭头是热、宇宙、心理。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "“现在”在 B 理论中类似于？", "options": ["绝对坐标", "索引词“这里”", "物理常数", "因果力"], "answer": 1, "explain": "它依赖说话者位置，不指向特殊时刻。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "阿基里斯能追上乌龟的数学依据是？", "options": ["乌龟会停", "无穷级数收敛", "空间有限", "时间有开端"], "answer": 1, "explain": "无穷段之和可收敛到有限值。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "三个时间箭头方向一致的最可能解释是？", "options": ["基本定律不可逆", "都继承自宇宙初始低熵条件", "人的错觉", "熵不守恒"], "answer": 1, "explain": "初始条件是共同来源。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "时间不是直接被感知的东西，而是通过比较周期性事件来测量；钟的可靠性靠“全等”检验，而选择哪种运动作标准，含有约定的成分。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "格林威治的意外——一句话说清它是什么？", "back": "本初子午线的位置是政治协商的结果，不是地理事实。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "全等检验——一句话说清它是什么？", "back": "把不同构造的钟放在一起，看它们是否保持同步。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "时间与自然律——一句话说清它是什么？", "back": "如果某个物理过程被选作“标准钟”，时间就成了“该过程的参数”。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "把时间等同于变化，会遇到“变化之间的时间”问题；但设想一段完全没有变化的时间，又似乎可以成立——两种直觉各有代价。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "时间即变化——一句话说清它是什么？", "back": "柏拉图与亚里士多德都把时间与变化绑定：没有变化就没有时间。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "无变化的时间——一句话说清它是什么？", "back": "设想一个完全空无、没有任何事件的宇宙，仍可问“它持续了多久”。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch02", "front": "皆事有因——一句话说清它是什么？", "back": "若时间独立于变化，那么“为什么这一刻而不是那一刻”就缺少理由。", "tags": ["ch02"]}, {"id": "f009", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "虚空是否存在，取决于你把“空间”当容器还是当物体之间的关系；气压实验把“真空”从哲学争论变成可操作的现象。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "亚里士多德的反驳——一句话说清它是什么？", "back": "他主张“自然厌恶真空”：物体运动需要介质，空间不能独立于物体存在。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "罐、泵与气压计——一句话说清它是什么？", "back": "抽气泵把罐内空气抽出，气压计读数下降，说明“空”是可以被制造的状态。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch03", "front": "绝对运动——一句话说清它是什么？", "back": "若空间是容器，就可谈“相对于空间的绝对运动”。", "tags": ["ch03"]}, {"id": "f013", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "欧几里得几何不是唯一的空间描述；平行公设可以被替换，得到自洽的非欧几何。空间是否有内在曲率，成了可检验的问题。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "平行公设的动摇——一句话说清它是什么？", "back": "第五公设（过直线外一点只有一条平行线）不像其他公设那样自明。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "可感知的空间——一句话说清它是什么？", "back": "康德认为空间是感知的先验形式，欧氏几何因此“必然”。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch04", "front": "高于三维——一句话说清它是什么？", "back": "二维生物无法想象第三维，但可以用“投影”“截面”推理。", "tags": ["ch04"]}, {"id": "f017", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "若时间有开端，开端的“之前”无法谈论；若过去无限，又要面对“无穷序列能否完成”。两种选择都有直觉上的代价。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "开端的问题——一句话说清它是什么？", "back": "“时间从何时开始”若答案是“某时刻”，那此前是什么？若答“无此前”，则“开始”这个词失去通常含义。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "过去无限——一句话说清它是什么？", "back": "若过去无限，则今天之前有无限多天。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch05", "front": "结局——一句话说清它是什么？", "back": "开放宇宙永远膨胀。", "tags": ["ch05"]}, {"id": "f021", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "若宇宙有边缘，把手伸出去就需要边缘之外的空间；若没有边缘而有限，空间可以像球面一样闭合——有限但无边界。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "阿基塔的论证——一句话说清它是什么？", "back": "站在宇宙边缘伸手：若能伸出，外面有空间，那原处不是边缘。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "有限无边界——一句话说清它是什么？", "back": "球面是二维的有限无边界例子：面积有限，但走不到边。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch06", "front": "无限的错觉——一句话说清它是什么？", "back": "“宇宙之外还有空间”是直觉的产物，它预设了空间是容器。", "tags": ["ch06"]}, {"id": "f025", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "芝诺悖论把“运动”拆成无穷段，逼出“无穷过程不能完成”的结论；回应的关键是重新理解无穷级数的和与时间的连续性。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "阿基里斯——一句话说清它是什么？", "back": "乌龟先跑一段，阿基里斯要追上必须先到乌龟起点，再到乌龟新位置……每次都要经过前一段的一半或一段，似乎永远差一点。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "两种回应——一句话说清它是什么？", "back": "**无穷小量**：把距离分成越来越小的段，其和收敛到有限值（1/2 + 1/4 + … = 1），所以能追上有明确位置。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch07", "front": "汤姆逊的灯——一句话说清它是什么？", "back": "灯在 1/2 分钟开关一次、1/4 分钟再开关……到 1 分钟时灯是开还是关？这个思想实验说明“无穷多次操作在有限时间完成”在逻辑上会留下未定义状态。", "tags": ["ch07"]}, {"id": "f029", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "麦克塔格特论证：时间若真实，就必须有“过去/现在/未来”的流动（A 系列），但同一事件不能同时具有三种性质，故时间不真实；回应分成现在主义与 B 理论两派。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "A 系列与 B 系列——一句话说清它是什么？", "back": "**A 系列**（A-series）：事件分为过去、现在、未来，且这个划分在变。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "麦克塔格特的论证——一句话说清它是什么？", "back": "每个事件都曾是未来、现在是现在、将是过去——三种性质不能同时成立，除非说“曾经是未来、现在是现在”，但这就引入了 A 系列本身，循环。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch08", "front": "两种回应——一句话说清它是什么？", "back": "**现在主义**（presentism）：只有现在是真实的，过去与未来不实在。", "tags": ["ch08"]}, {"id": "f033", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "若时间由瞬间组成，每个瞬间物体都占据一个确定位置，那瞬间内没有运动；但连续运动又不能由静止的瞬间拼出——这是芝诺问题的现代版。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "飞矢不动——一句话说清它是什么？", "back": "在任一瞬间，箭占据与自身等长的空间，因此在该瞬间静止。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "电影隐喻——一句话说清它是什么？", "back": "电影由静止帧快速播放造成运动错觉。", "tags": ["ch09"]}, {"id": "f036", "chapterId": "ch09", "front": "连续体——一句话说清它是什么？", "back": "数学上，运动可用位置函数 x(t) 描述，瞬时速度为导数。", "tags": ["ch09"]}, {"id": "f037", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "时间旅行若允许改变过去，会产生因果矛盾；两种出路是：过去不可改变（自洽），或存在多条时间线（分支）。", "tags": ["ch10"]}, {"id": "f038", "chapterId": "ch10", "front": "祖父悖论——一句话说清它是什么？", "back": "回到过去杀死祖父，则父亲不会出生，你也不会出生，于是你无法回去杀死祖父。", "tags": ["ch10"]}, {"id": "f039", "chapterId": "ch10", "front": "自洽解——一句话说清它是什么？", "back": "物理上可能只有自洽的历史：你能回去，但任何尝试都会被某种方式阻止，或你的行动本来就是历史的一部分。", "tags": ["ch10"]}, {"id": "f040", "chapterId": "ch10", "front": "分支解——一句话说清它是什么？", "back": "回到过去会分出新时间线，你改变的是另一条线，原线不变。", "tags": ["ch10"]}, {"id": "f041", "chapterId": "ch11", "front": "第 11 章一句话核心是什么？", "back": "多重宇宙不是单一假说，而是几类不同结构：空间上遥远的分区、量子分支、模空间里的不同常数；它们的可检验性各不相同。", "tags": ["ch11"]}, {"id": "f042", "chapterId": "ch11", "front": "空间分区——一句话说清它是什么？", "back": "若宇宙无限，任何有限组合都会在足够远处重复出现。", "tags": ["ch11"]}, {"id": "f043", "chapterId": "ch11", "front": "量子分支——一句话说清它是什么？", "back": "多世界解释把每次测量看成世界分支，所有结果都实现。", "tags": ["ch11"]}, {"id": "f044", "chapterId": "ch11", "front": "可检验性——一句话说清它是什么？", "back": "遥远分区原则上不可访问。", "tags": ["ch11"]}, {"id": "f045", "chapterId": "ch12", "front": "第 12 章一句话核心是什么？", "back": "热力学、宇宙学、心理学各有箭头；它们方向一致，但一致的原因没有定论——可能都源于宇宙初始的低熵条件。", "tags": ["ch12"]}, {"id": "f046", "chapterId": "ch12", "front": "三个箭头——一句话说清它是什么？", "back": "**热力学箭头**：熵增。", "tags": ["ch12"]}, {"id": "f047", "chapterId": "ch12", "front": "一致性问题——一句话说清它是什么？", "back": "为什么三种完全不同的过程方向相同？一种解释是它们都继承自初始条件：宇宙从极低熵状态出发，之后所有过程都沿同一方向展开。", "tags": ["ch12"]}, {"id": "f048", "chapterId": "ch12", "front": "局部的方向——一句话说清它是什么？", "back": "在局部系统中，熵可以减少（生命、冰箱）。", "tags": ["ch12"]}], "companion": "four-dimensional-travel学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：时间的测量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“时间是用周期性事件定义的”\n<\/li><li>\n能区分“约定”与“事实”在计时中的角色\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>时间不是直接被感知的东西，而是通过比较周期性事件来测量；钟的可靠性靠“全等”检验，而选择哪种运动作标准，含有约定的成分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：格林威治的意外（难度：基础）<\/h3>\n<p>本初子午线的位置是政治协商的结果，不是地理事实。普瓦德万用这个例子说明：测量系统里总有一部分是<strong>约定<\/strong>（convention），不是被发现的性质。<\/p>\n<h3>概念 2：全等检验（难度：进阶）<\/h3>\n<p>把不同构造的钟放在一起，看它们是否保持同步。若多种独立机制的钟长期一致，就有理由相信它们测的是同一件事。<strong>全等<\/strong>（isochronism）是时钟可靠性的操作标准。<\/p>\n<h3>概念 3：时间与自然律（难度：进阶）<\/h3>\n<p>如果某个物理过程被选作“标准钟”，时间就成了“该过程的参数”。这会带来一个问题：当定律本身变化时，我们凭什么说时间还在均匀流逝？<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;格林威治的意外&quot;]\n  n2[&quot;全等检验&quot;]\n  n1 --&gt; n2\n  n3[&quot;时间与自然律&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用摆钟给其他钟对表：摆钟成了标准，但标准本身也需要被检验。边界：钟可以被校准，时间本身没有“标准时间”可对。\n<\/li><li>\n<strong>实例<\/strong>：原子钟基于铯-133 的特定跃迁频率，把 9192631770 次周期定义为 1 秒。这个定义是约定，但它的稳定性是可检验的事实。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为时间是“直接看见”的——我们看见的永远是事件与周期，不是时间本身。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计时中“约定”的部分指的是？\n<ul>\n<li>\nA. 物理定律\n<\/li><li>\nB. 人为选定的标准与单位\n<\/li><li>\nC. 钟的误差\n<\/li><li>\nD. 相对论效应\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：标准与单位是协商结果。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n时间靠周期事件测量\n<\/li><li>\n全等检验保证可靠\n<\/li><li>\n标准含约定成分\n<\/ul>", "kind": "chapter", "title": "第 1 章 时间的测量"}, "ch02": {"html": "<h1>第 2 章：变化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述“时间即变化”的立场与其困难\n<\/li><li>\n能说明“没有变化的时间”为何可设想\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把时间等同于变化，会遇到“变化之间的时间”问题；但设想一段完全没有变化的时间，又似乎可以成立——两种直觉各有代价。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：时间即变化（难度：基础）<\/h3>\n<p>柏拉图与亚里士多德都把时间与变化绑定：没有变化就没有时间。若宇宙完全静止，说“过了一小时”似乎没有意义。<\/p>\n<h3>概念 2：无变化的时间（难度：进阶）<\/h3>\n<p>设想一个完全空无、没有任何事件的宇宙，仍可问“它持续了多久”。这说明时间可能独立于变化而存在。<strong>绝对时间<\/strong>（absolute time）的支持者据此主张时间是容器。<\/p>\n<h3>概念 3：皆事有因（难度：进阶）<\/h3>\n<p>若时间独立于变化，那么“为什么这一刻而不是那一刻”就缺少理由。<strong>充足理由律<\/strong>（principle of sufficient reason）在此受限：有些事实可能没有进一步理由。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;时间即变化&quot;]\n  n2[&quot;无变化的时间&quot;]\n  n1 --&gt; n2\n  n3[&quot;皆事有因&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一间空房间：没有家具，房间还在。边界：房间有墙可量，时间没有“墙”。\n<\/li><li>\n<strong>实例<\/strong>：把整个宇宙冻住一小时再解冻，这段时间存在吗？若说存在，时间独立于变化；若说不存在，时间依赖变化。两种回答都能自洽，取舍在于你愿意承担哪种代价。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为这个问题有实验答案——它是概念选择，实验只能约束哪一种更符合物理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“时间即变化”的主要困难是？\n<ul>\n<li>\nA. 无法测量\n<\/li><li>\nB. 难以说明变化之间的间隔\n<\/li><li>\nC. 变化不存在\n<\/li><li>\nD. 时间可逆\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：间隔若无变化，时间是否仍在流逝成问题。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n时间即变化 vs 绝对时间\n<\/li><li>\n无变化的时间可设想\n<\/li><li>\n充足理由律受限\n<\/ul>", "kind": "chapter", "title": "第 2 章 变化"}, "ch03": {"html": "<h1>第 3 章：没边的盒子？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明亚里士多德反对虚空的两个论证\n<\/li><li>\n能解释气压实验如何改变“真空”概念\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>虚空是否存在，取决于你把“空间”当容器还是当物体之间的关系；气压实验把“真空”从哲学争论变成可操作的现象。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：亚里士多德的反驳（难度：基础）<\/h3>\n<p>他主张“自然厌恶真空”：物体运动需要介质，空间不能独立于物体存在。虚空若存在，物体在其中的运动将没有参照，速度无从定义。<\/p>\n<h3>概念 2：罐、泵与气压计（难度：进阶）<\/h3>\n<p>抽气泵把罐内空气抽出，气压计读数下降，说明“空”是可以被制造的状态。<strong>真空<\/strong>（vacuum）从“不可能”变成“可测量”。<\/p>\n<h3>概念 3：绝对运动（难度：进阶）<\/h3>\n<p>若空间是容器，就可谈“相对于空间的绝对运动”。牛顿需要它来定义惯性；马赫与后来的相对论则主张只有相对运动有意义。这场争论一直延续到爱因斯坦。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;亚里士多德的反驳&quot;]\n  n2[&quot;罐、泵与气压计&quot;]\n  n1 --&gt; n2\n  n3[&quot;绝对运动&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像鱼问“水是什么”：生活在介质里，很难把介质本身对象化。边界：鱼能跳出水面，人不能跳出空间。\n<\/li><li>\n<strong>实例<\/strong>：托里拆利实验：把装满水银的管子倒插进水银槽，管顶真空，水银柱高度约 76 厘米，对应大气压。真空的存在由这个高度间接证明。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为真空就是“什么都没有”——量子场论中真空仍有涨落。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n亚里士多德反对虚空的核心论据是？\n<ul>\n<li>\nA. 真空太冷\n<\/li><li>\nB. 运动需要介质，空间不能独立于物体\n<\/li><li>\nC. 原子不存在\n<\/li><li>\nD. 气压太低\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他把空间当作物体间的关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n虚空之争 = 空间是容器还是关系\n<\/li><li>\n气压实验使真空可操作\n<\/li><li>\n绝对运动 vs 相对运动\n<\/ul>", "kind": "chapter", "title": "第 3 章 没边的盒子？"}, "ch04": {"html": "<h1>第 4 章：曲线和维数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明非欧几何如何取代欧几里得几何的独尊地位\n<\/li><li>\n能解释“高于三维”的可设想性\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>欧几里得几何不是唯一的空间描述；平行公设可以被替换，得到自洽的非欧几何。空间是否有内在曲率，成了可检验的问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：平行公设的动摇（难度：进阶）<\/h3>\n<p>第五公设（过直线外一点只有一条平行线）不像其他公设那样自明。罗巴切夫斯基与鲍耶把它换成“有多条”，黎曼换成“没有”，各自得到自洽体系。<\/p>\n<h3>概念 2：可感知的空间（难度：进阶）<\/h3>\n<p>康德认为空间是感知的先验形式，欧氏几何因此“必然”。非欧几何出现后，这条论证失效：空间的形式可以是别的，经验才能决定是哪种。<\/p>\n<h3>概念 3：高于三维（难度：进阶）<\/h3>\n<p>二维生物无法想象第三维，但可以用“投影”“截面”推理。数学上四维、n 维空间都是自洽的；物理上是否需要额外维度，要靠理论预言与实验。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;平行公设的动摇&quot;]\n  n2[&quot;可感知的空间&quot;]\n  n1 --&gt; n2\n  n3[&quot;高于三维&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像蚂蚁在球面上走：它以为走的是直线，实际沿大圆。边界：蚂蚁能感知球面曲率（绕一圈会回来），人感知四维更难。\n<\/li><li>\n<strong>实例<\/strong>：三角形内角和：欧氏为 180°，球面大于 180°，双曲面小于 180°。同一个测量，不同曲率给出不同结果，因此曲率可被测量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为非欧几何只是数学游戏——广义相对论用它描述真实时空。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n非欧几何的出现说明了？\n<ul>\n<li>\nA. 欧氏几何错误\n<\/li><li>\nB. 平行公设可替换且各自自洽\n<\/li><li>\nC. 空间只有三维\n<\/li><li>\nD. 几何是实验科学\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：公设替换产生不同的自洽几何。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n第五公设可替换\n<\/li><li>\n空间曲率可测量\n<\/li><li>\n高维可数学设想\n<\/ul>", "kind": "chapter", "title": "第 4 章 曲线和维数"}, "ch05": {"html": "<h1>第 5 章：时间的开端和结尾<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“时间有开端”与“过去无限”各自的困难\n<\/li><li>\n能解释大坍塌与循环模型的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若时间有开端，开端的“之前”无法谈论；若过去无限，又要面对“无穷序列能否完成”。两种选择都有直觉上的代价。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：开端的问题（难度：高难）<\/h3>\n<p>“时间从何时开始”若答案是“某时刻”，那此前是什么？若答“无此前”，则“开始”这个词失去通常含义。奥古斯丁的回答是：时间与创世同时被造，问“之前”是无意义的。<\/p>\n<h3>概念 2：过去无限（难度：高难）<\/h3>\n<p>若过去无限，则今天之前有无限多天。反对者说无穷不能“完成”；支持者说无限序列不需要被逐个数完，它只是没有起点。<\/p>\n<h3>概念 3：结局（难度：进阶）<\/h3>\n<p>开放宇宙永远膨胀；封闭宇宙回缩成“大坍塌”；循环模型让膨胀与收缩交替。三者的区别在密度参数与暗能量的性质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;开端的问题&quot;]\n  n2[&quot;过去无限&quot;]\n  n1 --&gt; n2\n  n3[&quot;结局&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一条没有起点的线：你可以从任意点往左走，永远走不到头，但线本身已经在那里。边界：线可以在纸上画完，时间不能站在外面看。\n<\/li><li>\n<strong>实例<\/strong>：把“无穷多天”换成“负整数”：…-3, -2, -1, 0。这个序列没有最小元，但每个数都有前一个。过去无限可以是这种结构。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“过去无限”必然导致“无穷过程已完成”——序列可以从无起点处无限延伸，不需要一个完成的动作。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n奥古斯丁对“创世之前”的回答是？\n<ul>\n<li>\nA. 有另一个宇宙\n<\/li><li>\nB. 时间与创世同时被造，问“之前”无意义\n<\/li><li>\nC. 上帝在睡觉\n<\/li><li>\nD. 时间是循环的\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他把时间本身纳入被造物。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n开端使“之前”失效\n<\/li><li>\n过去无限不等于过程完成\n<\/li><li>\n结局取决于密度与暗能量\n<\/ul>", "kind": "chapter", "title": "第 5 章 时间的开端和结尾"}, "ch06": {"html": "<h1>第 6 章：空间的边缘<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述阿基塔“伸手到宇宙之外”的论证\n<\/li><li>\n能解释“有限但无边界”的空间模型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若宇宙有边缘，把手伸出去就需要边缘之外的空间；若没有边缘而有限，空间可以像球面一样闭合——有限但无边界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：阿基塔的论证（难度：进阶）<\/h3>\n<p>站在宇宙边缘伸手：若能伸出，外面有空间，那原处不是边缘；若不能伸出，说明被某物阻挡，那阻挡物之外仍有空间。结论：宇宙不可能有绝对边缘。<\/p>\n<h3>概念 2：有限无边界（难度：高难）<\/h3>\n<p>球面是二维的有限无边界例子：面积有限，但走不到边。三维球面同理，体积有限，没有“外面”。这解决了阿基塔的两难：伸不出去不是被挡住，而是没有“外面”这个方向。<\/p>\n<h3>概念 3：无限的错觉（难度：进阶）<\/h3>\n<p>“宇宙之外还有空间”是直觉的产物，它预设了空间是容器。若空间是内禀的几何结构，问“外面”就是问一个不存在方向。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;阿基塔的论证&quot;]\n  n2[&quot;有限无边界&quot;]\n  n1 --&gt; n2\n  n3[&quot;无限的错觉&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像在地球上一直往北走：不会掉下去，也不会到“北的边缘”，只会绕回来。边界：地球有二维表面，三维空间的闭合需要四维嵌入的数学。\n<\/li><li>\n<strong>实例<\/strong>：球面三角形内角和大于 180°；若宇宙是闭合的，足够大的三角形也会显示类似偏差。这是可观测的判据之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“有限”就必须有边——球面有限而无边，空间可以类似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“有限但无边界”的模型是？\n<ul>\n<li>\nA. 盒子\n<\/li><li>\nB. 球面\n<\/li><li>\nC. 平面\n<\/li><li>\nD. 直线\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：球面面积有限，但走不到边。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n阿基塔两难\n<\/li><li>\n球面：有限无边\n<\/li><li>\n“外面”是容器直觉\n<\/ul>", "kind": "chapter", "title": "第 6 章 空间的边缘"}, "ch07": {"html": "<h1>第 7 章：无穷和悖论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述阿基里斯与乌龟悖论\n<\/li><li>\n能说明“无穷小量”与“有限论”两种回应\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>芝诺悖论把“运动”拆成无穷段，逼出“无穷过程不能完成”的结论；回应的关键是重新理解无穷级数的和与时间的连续性。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：阿基里斯（难度：进阶）<\/h3>\n<p>乌龟先跑一段，阿基里斯要追上必须先到乌龟起点，再到乌龟新位置……每次都要经过前一段的一半或一段，似乎永远差一点。结论：快者追不上慢者。<\/p>\n<h3>概念 2：两种回应（难度：高难）<\/h3>\n<p><strong>无穷小量<\/strong>：把距离分成越来越小的段，其和收敛到有限值（1/2 + 1/4 + … = 1），所以能追上有明确位置。<strong>有限论<\/strong>：空间与时间不是无限可分的，存在最小单位，芝诺的分割在某一步停止。<\/p>\n<h3>概念 3：汤姆逊的灯（难度：高难）<\/h3>\n<p>灯在 1/2 分钟开关一次、1/4 分钟再开关……到 1 分钟时灯是开还是关？这个思想实验说明“无穷多次操作在有限时间完成”在逻辑上会留下未定义状态。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;阿基里斯&quot;]\n  n2[&quot;两种回应&quot;]\n  n1 --&gt; n2\n  n3[&quot;汤姆逊的灯&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把一段路切成无限多段：切得再细，总长度还是那段路。边界：切是思维的，走路是连续的。\n<\/li><li>\n<strong>实例<\/strong>：1/2 + 1/4 + 1/8 + … = 1。无穷多项的和可以是有限的，这正是阿基里斯能追上的数学依据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为芝诺悖论已被“微积分解决”就没事了——它逼问的是“连续体由点组成”这一假设本身。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n阿基里斯悖论的数学回应核心是？\n<ul>\n<li>\nA. 无穷级数收敛\n<\/li><li>\nB. 乌龟更慢\n<\/li><li>\nC. 时间停止\n<\/li><li>\nD. 空间有边\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：无穷段之和可收敛到有限值。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n芝诺：无穷分割\n<\/li><li>\n收敛级数给出有限和\n<\/li><li>\n汤姆逊灯暴露未定义状态\n<\/ul>", "kind": "chapter", "title": "第 7 章 无穷和悖论"}, "ch08": {"html": "<h1>第 8 章：时间会流逝吗？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明麦克塔格特的 A 系列与 B 系列\n<\/li><li>\n能区分现在主义与 B 理论\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>麦克塔格特论证：时间若真实，就必须有“过去/现在/未来”的流动（A 系列），但同一事件不能同时具有三种性质，故时间不真实；回应分成现在主义与 B 理论两派。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：A 系列与 B 系列（难度：进阶）<\/h3>\n<p><strong>A 系列<\/strong>（A-series）：事件分为过去、现在、未来，且这个划分在变。<strong>B 系列<\/strong>（B-series）：事件只有“早于/晚于”的固定关系，没有流动的现在。<\/p>\n<h3>概念 2：麦克塔格特的论证（难度：高难）<\/h3>\n<p>每个事件都曾是未来、现在是现在、将是过去——三种性质不能同时成立，除非说“曾经是未来、现在是现在”，但这就引入了 A 系列本身，循环。结论：A 系列矛盾，时间不真实。<\/p>\n<h3>概念 3：两种回应（难度：高难）<\/h3>\n<p><strong>现在主义<\/strong>（presentism）：只有现在是真实的，过去与未来不实在。<strong>B 理论<\/strong>（B-theory）：所有时刻同等实在，“现在”只是索引词，像“这里”一样依赖说话位置。两者各自要付出代价：前者难解释因果与记忆，后者难解释“流逝感”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;A 系列与 B 系列&quot;]\n  n2[&quot;麦克塔格特的论证&quot;]\n  n1 --&gt; n2\n  n3[&quot;两种回应&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像地图上的“你在这里”：标记随人移动，地图本身不变。边界：地图没有“流动”，人有。\n<\/li><li>\n<strong>实例<\/strong>：把“现在”换成“这里”：说“这里”并没有指向一个特殊地点，只表示说话者位置。B 理论认为“现在”同理。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 B 理论否认时间——它否认的是“流动的现在”，不是时间次序。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n麦克塔格特论证的结论是？\n<ul>\n<li>\nA. 时间可逆\n<\/li><li>\nB. A 系列矛盾，时间不真实\n<\/li><li>\nC. B 系列矛盾\n<\/li><li>\nD. 现在最重要\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他以 A 系列的自相矛盾否定时间的实在性。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nA 系列：流动的过去现在未来\n<\/li><li>\nB 系列：固定的早于晚于\n<\/li><li>\n现在主义 vs B 理论\n<\/ul>", "kind": "chapter", "title": "第 8 章 时间会流逝吗？"}, "ch09": {"html": "<h1>第 9 章：像放电影的宇宙<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“瞬间没有运动”这一论证\n<\/li><li>\n能解释电影帧与连续运动的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若时间由瞬间组成，每个瞬间物体都占据一个确定位置，那瞬间内没有运动；但连续运动又不能由静止的瞬间拼出——这是芝诺问题的现代版。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：飞矢不动（难度：进阶）<\/h3>\n<p>在任一瞬间，箭占据与自身等长的空间，因此在该瞬间静止；若每个瞬间都静止，全程就静止。<strong>瞬间<\/strong>（instant）概念与运动概念在这里冲突。<\/p>\n<h3>概念 2：电影隐喻（难度：进阶）<\/h3>\n<p>电影由静止帧快速播放造成运动错觉。若宇宙像电影，运动就是“帧间差异”，不是帧内属性。但电影需要放映机与观众，宇宙没有。<\/p>\n<h3>概念 3：连续体（难度：高难）<\/h3>\n<p>数学上，运动可用位置函数 x(t) 描述，瞬时速度为导数。导数不是“瞬间内的位移”，而是极限。这解决了“瞬间无运动”的悖论，但把运动变成了极限概念。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;飞矢不动&quot;]\n  n2[&quot;电影隐喻&quot;]\n  n1 --&gt; n2\n  n3[&quot;连续体&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像幻灯片快速翻动看到动画：每张不动，连起来才动。边界：幻灯片有间隔，时间若连续则没有“下一帧”。\n<\/li><li>\n<strong>实例<\/strong>：自由落体 x = ½gt²，在 t=1 秒的瞬时速度是 g。这个值由极限定义，不是某一瞬间的位移除以时间。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“瞬间静止”证明了运动不存在——它只说明“瞬间”这个概念不适合承载运动。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“飞矢不动”论证的关键假设是？\n<ul>\n<li>\nA. 箭会停\n<\/li><li>\nB. 时间由瞬间组成且瞬间内无运动\n<\/li><li>\nC. 空间有限\n<\/li><li>\nD. 速度可变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把运动拆成瞬间属性导致悖论。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n瞬间无运动\n<\/li><li>\n电影隐喻的限度\n<\/li><li>\n导数用极限代替瞬间位移\n<\/ul>", "kind": "chapter", "title": "第 9 章 像放电影的宇宙"}, "ch10": {"html": "<h1>第 10 章：干预历史<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“祖父悖论”的两种解决方向\n<\/li><li>\n能区分“改变过去”与“自洽的历史”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>时间旅行若允许改变过去，会产生因果矛盾；两种出路是：过去不可改变（自洽），或存在多条时间线（分支）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：祖父悖论（难度：进阶）<\/h3>\n<p>回到过去杀死祖父，则父亲不会出生，你也不会出生，于是你无法回去杀死祖父。<strong>因果环<\/strong>（causal loop）让前提自我取消。<\/p>\n<h3>概念 2：自洽解（难度：高难）<\/h3>\n<p>物理上可能只有自洽的历史：你能回去，但任何尝试都会被某种方式阻止，或你的行动本来就是历史的一部分。诺维科夫自洽原则是这一思路的物理版本。<\/p>\n<h3>概念 3：分支解（难度：高难）<\/h3>\n<p>回到过去会分出新时间线，你改变的是另一条线，原线不变。这避免了矛盾，但代价是“改变过去”其实没改变你来自的那条线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;祖父悖论&quot;]\n  n2[&quot;自洽解&quot;]\n  n1 --&gt; n2\n  n3[&quot;分支解&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像录像带：自洽解是带子只能那样放；分支解是每改一次就复制一盘新带。边界：录像带可复制，时间线是否可复制未知。\n<\/li><li>\n<strong>实例<\/strong>：若你回去阻止一场事故，自洽解会说：你正是事故发生的起因（你的出现触发了它）。这个闭环没有矛盾，但很反直觉。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为时间旅行一定自相矛盾——矛盾只出现在“改变过去”的强版本里。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n祖父悖论的“自洽解”主张？\n<ul>\n<li>\nA. 过去可随意改\n<\/li><li>\nB. 只有自洽的历史可能\n<\/li><li>\nC. 时间不存在\n<\/li><li>\nD. 多世界\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：任何行动都纳入既定历史，不产生矛盾。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n因果环导致自我取消\n<\/li><li>\n自洽解：历史只有一种\n<\/li><li>\n分支解：改的是另一条线\n<\/ul>", "kind": "chapter", "title": "第 10 章 干预历史"}, "ch11": {"html": "<h1>第 11 章：我们之外的时间和空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“多重宇宙”的几种版本\n<\/li><li>\n能指出“分支”与“平行”在逻辑上的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多重宇宙不是单一假说，而是几类不同结构：空间上遥远的分区、量子分支、模空间里的不同常数；它们的可检验性各不相同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：空间分区（难度：进阶）<\/h3>\n<p>若宇宙无限，任何有限组合都会在足够远处重复出现。这类“遥远副本”不需要新物理，只需要无限空间。<\/p>\n<h3>概念 2：量子分支（难度：高难）<\/h3>\n<p>多世界解释把每次测量看成世界分支，所有结果都实现。它避免了坍缩假设，但代价是“概率”难以解释。<\/p>\n<h3>概念 3：可检验性（难度：高难）<\/h3>\n<p>遥远分区原则上不可访问；量子分支不可互通；不同常数的模空间更难。作者的态度是：先分清“逻辑可能”与“科学假说”，后者需要可检验的差异。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;空间分区&quot;]\n  n2[&quot;量子分支&quot;]\n  n1 --&gt; n2\n  n3[&quot;可检验性&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一栋无限大的公寓楼：每个房间的组合可能重复，但你走不到隔壁。边界：公寓楼可以造电梯，宇宙分区不能。\n<\/li><li>\n<strong>实例<\/strong>：若宇宙无限且物质分布均匀，则距离足够远处存在与你完全相同的原子排列。这不是科幻，是概率论的推论。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多重宇宙都是同一种东西——空间副本、量子分支、常数不同的区域，证据基础完全不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“遥远副本”依赖的前提是？\n<ul>\n<li>\nA. 量子坍缩\n<\/li><li>\nB. 宇宙无限且分布均匀\n<\/li><li>\nC. 时间旅行\n<\/li><li>\nD. 暗能量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无限空间使有限组合重复。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多重宇宙有多种版本\n<\/li><li>\n空间副本靠无限性\n<\/li><li>\n可检验性各不同\n<\/ul>", "kind": "chapter", "title": "第 11 章 我们之外的时间和空间"}, "ch12": {"html": "<h1>第 12 章：时间箭头<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch11\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能列出至少三个时间箭头\n<\/li><li>\n能说明“箭头为何一致”这一难题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>热力学、宇宙学、心理学各有箭头；它们方向一致，但一致的原因没有定论——可能都源于宇宙初始的低熵条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个箭头（难度：进阶）<\/h3>\n<p><strong>热力学箭头<\/strong>：熵增。<strong>宇宙学箭头<\/strong>：宇宙膨胀。<strong>心理学箭头<\/strong>：我们记得过去、不记得未来。三者都指向同一方向。<\/p>\n<h3>概念 2：一致性问题（难度：高难）<\/h3>\n<p>为什么三种完全不同的过程方向相同？一种解释是它们都继承自初始条件：宇宙从极低熵状态出发，之后所有过程都沿同一方向展开。<\/p>\n<h3>概念 3：局部的方向（难度：高难）<\/h3>\n<p>在局部系统中，熵可以减少（生命、冰箱）。全局箭头不保证每个子系统同向。作者提醒：说“时间有方向”时，要先说清是哪个系统的哪个箭头。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三个箭头&quot;]\n  n2[&quot;一致性问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;局部的方向&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像三条河都往东流：可能因为地势整体向东，不是因为每条河自己选了方向。边界：河有地势，宇宙有初始条件。\n<\/li><li>\n<strong>实例<\/strong>：打碎杯子容易，碎片自发拼回杯子几乎不可能；录像倒放一眼可辨。这个不对称就是热力学箭头的日常证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为时间箭头是基本定律——基本方程大多时间可逆，箭头来自统计与初始条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n时间箭头不包括？\n<ul>\n<li>\nA. 热力学\n<\/li><li>\nB. 宇宙学\n<\/li><li>\nC. 心理学\n<\/li><li>\nD. 电磁学\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：三个主要箭头是热、宇宙、心理。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三箭头：热、宇宙、心理\n<\/li><li>\n一致源于初始低熵\n<\/li><li>\n局部可反向\n<\/ul>", "kind": "chapter", "title": "第 12 章 时间箭头"}, "c01": {"html": "<h1>A 系列与 B 系列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 08 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>A 系列：事件有过去/现在/未来的流动划分；B 系列：事件只有固定的早于/晚于关系。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是当代时间哲学的分水岭：你站哪一边，决定了“现在是否特殊”“流逝是否真实”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>A 系列需要“现在”不断移动，麦克塔格特指出同一事件不能同时具有三种性质。<\/p>\n<p>B 系列把时间排成静态序列，“现在”只是索引词。<\/p>\n<p>代价：A 系列难逃矛盾，B 系列难解释流逝感。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 B 理论否认时间——它否认流动，不否认次序。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>麦克塔格特<\/td><td>论证<\/td><\/tr><tr><td>ch09<\/td><td>电影宇宙<\/td><td>B 系列图像<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n现在主义、时间箭头\n<\/ul>", "kind": "concept", "title": "A 系列与 B 系列"}, "c02": {"html": "<h1>芝诺式悖论与连续体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 07 章、第 09 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把连续运动拆成无穷多瞬间或无穷多段，会得到“运动不可能”的结论；回应要重新定义无穷和或连续性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是数学分析（极限、收敛级数）的哲学起点，也是理解“瞬间”“连续”的关键。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种回应：①收敛级数（1/2+1/4+…=1）；②有限论（存在最小单位）；③极限定义（速度是导数，不是瞬间位移）。<\/p>\n<p>每种回应都改变了对“连续体”的理解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为微积分一出现悖论就消失了——它解决的是计算，留下的是概念。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>阿基里斯<\/td><td>悖论<\/td><\/tr><tr><td>ch09<\/td><td>飞矢<\/td><td>现代版<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nA/B 系列、运动\n<\/ul>", "kind": "concept", "title": "芝诺式悖论与连续体"}, "c03": {"html": "<h1>时间箭头的三个来源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>热力学熵增、宇宙膨胀、心理记忆方向，三者共同构成“时间有方向”的证据。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“时间流逝”从主观感受变成可比较的物理过程，同时留下“为何一致”的难题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>热力学：孤立系统熵增。<\/p>\n<p>宇宙学：膨胀提供整体不对称。<\/p>\n<p>心理学：记忆只指向过去。<\/p>\n<p>一致性的候选解释：初始低熵条件。<\/p>\n<p>注意：局部系统可逆，箭头是全局统计结论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为有箭头就有“时间之流”——箭头是过程的不对称，不自动解释流逝感。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch12<\/td><td>三箭头<\/td><td>综述<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nA/B 系列、熵\n<\/ul>", "kind": "concept", "title": "时间箭头的三个来源"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：时间的测量<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 时间的测量<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：变化<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 变化<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：没边的盒子？<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 没边的盒子？<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：曲线和维数<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 曲线和维数<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：时间的开端和结尾<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 时间的开端和结尾<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：空间的边缘<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 空间的边缘<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：无穷和悖论<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 无穷和悖论<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：时间会流逝吗？<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 时间会流逝吗？<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：像放电影的宇宙<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 像放电影的宇宙<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：干预历史<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 干预历史<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：我们之外的时间和空间<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 我们之外的时间和空间<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-12'><strong>步骤 12：时间箭头<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章 时间箭头<\/a><br>检查点：完成第 12 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q13.<\/b> “现在”在 B 理论中类似于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 绝对坐标<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 索引词“这里”<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 物理常数<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 因果力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q14.<\/b> 阿基里斯能追上乌龟的数学依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 乌龟会停<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 无穷级数收敛<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 空间有限<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 时间有开端<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q15.<\/b> 三个时间箭头方向一致的最可能解释是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 基本定律不可逆<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 都继承自宇宙初始低熵条件<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 人的错觉<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 熵不守恒<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章 时间的测量<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 计时中“约定”的部分指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 物理定律<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 人为选定的标准与单位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 钟的误差<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 相对论效应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz" le'><p class='quiz-q'><b>Q1.<\/b> 祖父悖论的“自洽解”主张？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 过去可随意改<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 只有自洽的历史可能<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 时间不存在<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 多世界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章 我们之外的时间和空间<\/h1><div class='quiz-item' data-qid='ch11-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “遥远副本”依赖的前提是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1' value='0'> 量子坍缩<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='1'> 宇宙无限且分布均匀<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='2'> 时间旅行<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='3'> 暗能量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章 时间箭头<\/h1><div class='quiz-item' data-qid='ch12-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 时间箭头不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q1' value='0'> 热力学<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='1'> 宇宙学<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='2'> 心理学<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='3'> 电磁学<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='约定'>约定 — 人为选定而非发现的标准 <span class=glossary-ref>（第 1 章 时间的测量）<\/span><\/li><li data-term='全等'>全等 — 不同钟保持同步的性质 <span class=glossary-ref>（第 1 章 时间的测量）<\/span><\/li><li data-term='绝对时间'>绝对时间 — 独立于变化的 time 容器 <span class=glossary-ref>（第 2 章 变化）<\/span><\/li><li data-term='虚空'>虚空 — 无物体的空间 <span class=glossary-ref>（第 3 章 没边的盒子？）<\/span><\/li><li data-term='非欧几何'>非欧几何 — 替换平行公设得到的几何 <span class=glossary-ref>（第 4 章 曲线和维数）<\/span><\/li><li data-term='有限无边界'>有限无边界 — 体积有限但走不到边的空间 <span class=glossary-ref>（第 6 章 空间的边缘）<\/span><\/li><li data-term='无穷小量'>无穷小量 — 趋于零但不为零的量 <span class=glossary-ref>（第 7 章 无穷和悖论）<\/span><\/li><li data-term='a 系列'>A 系列 — 过去/现在/未来的流动划分 <span class=glossary-ref>（第 8 章 时间会流逝吗？）<\/span><\/li><li data-term='b 系列'>B 系列 — 固定的早于/晚于关系 <span class=glossary-ref>（第 8 章 时间会流逝吗？）<\/span><\/li><li data-term='现在主义'>现在主义 — 只有现在是实在的 <span class=glossary-ref>（第 8 章 时间会流逝吗？）<\/span><\/li><li data-term='因果环'>因果环 — 原因与结果互为因果 <span class=glossary-ref>（第 10 章 干预历史）<\/span><\/li><li data-term='自洽原则'>自洽原则 — 只有不矛盾的历史可能 <span class=glossary-ref>（第 10 章 干预历史）<\/span><\/li><li data-term='时间箭头'>时间箭头 — 过程的方向性 <span class=glossary-ref>（第 12 章 时间箭头）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>四维旅行 模式与框架库<\/h1>\n<h2>分析框架：概念悖论的四步拆解<\/h2>\n<p>①找出直觉上“显然”的前提；②把它推到极端，看是否自相矛盾；③列出历史上几种解法；④比较每种解法的代价（放弃了哪个直觉）。四步能把“哲学讨论”变成可比较的选择。<\/p>\n<h2>决策规则：区分逻辑可能与科学假说<\/h2>\n<p>if 主张无法给出任何可观测差异 then 它是逻辑/形而上学可能，不是科学假说 else 找它的可检验预言 多重宇宙各版本正需要这样分类。<\/p>\n<h2>反模式：用“常识”终结悖论<\/h2>\n<p>“运动明明存在”不是回应，芝诺问的正是“运动由什么组成”。常识能提示答案方向，不能替代论证。<\/p>\n<h2>反模式：把局部箭头当全局<\/h2>\n<p>冰箱、生命都能局部降熵。说“时间有方向”必须说明是哪个系统、哪个箭头。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>三个时间箭头<\/td><td>热力学 / 宇宙学 / 心理学<\/td><\/tr><tr><td>A 系列<\/td><td>过去-现在-未来，流动<\/td><\/tr><tr><td>B 系列<\/td><td>早于-晚于，静态<\/td><\/tr><tr><td>芝诺回应<\/td><td>收敛级数 / 有限论 / 极限定义<\/td><\/tr><tr><td>有限无边<\/td><td>球面模型<\/td><\/tr><tr><td>祖父悖论解<\/td><td>自洽历史 / 分支时间线<\/td><\/tr><tr><td>多重宇宙类型<\/td><td>空间副本 / 量子分支 / 常数区域<\/td><\/tr><tr><td>时间开端<\/td><td>奥古斯丁：时间与创世同造<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/11-四维旅行", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 时间的测量", "href": "#/chapter/ch01"}, {"label": "第 2 章 变化", "href": "#/chapter/ch02"}, {"label": "第 3 章 没边的盒子？", "href": "#/chapter/ch03"}, {"label": "第 4 章 曲线和维数", "href": "#/chapter/ch04"}, {"label": "第 5 章 时间的开端和结尾", "href": "#/chapter/ch05"}, {"label": "第 6 章 空间的边缘", "href": "#/chapter/ch06"}, {"label": "第 7 章 无穷和悖论", "href": "#/chapter/ch07"}, {"label": "第 8 章 时间会流逝吗？", "href": "#/chapter/ch08"}, {"label": "第 9 章 像放电影的宇宙", "href": "#/chapter/ch09"}, {"label": "第 10 章 干预历史", "href": "#/chapter/ch10"}, {"label": "第 11 章 我们之外的时间和空间", "href": "#/chapter/ch11"}, {"label": "第 12 章 时间箭头", "href": "#/chapter/ch12"}]}, {"label": "概念", "children": [{"label": "A 系列与 B 系列", "href": "#/concept/c01"}, {"label": "芝诺式悖论与连续体", "href": "#/concept/c02"}, {"label": "时间箭头的三个来源", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 时间的测量", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 变化", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 没边的盒子？", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 曲线和维数", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 时间的开端和结尾", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 空间的边缘", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 无穷和悖论", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 时间会流逝吗？", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 像放电影的宇宙", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 干预历史", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章 我们之外的时间和空间", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章 时间箭头", "href": "#/quiz/ch12"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：时间的测量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“时间是用周期性事件定义的”\n<\/li><li>\n能区分“约定”与“事实”在计时中的角色\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>时间不是直接被感知的东西，而是通过比较周期性事件来测量；钟的可靠性靠“全等”检验，而选择哪种运动作标准，含有约定的成分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：格林威治的意外（难度：基础）<\/h3>\n<p>本初子午线的位置是政治协商的结果，不是地理事实。普瓦德万用这个例子说明：测量系统里总有一部分是<strong>约定<\/strong>（convention），不是被发现的性质。<\/p>\n<h3>概念 2：全等检验（难度：进阶）<\/h3>\n<p>把不同构造的钟放在一起，看它们是否保持同步。若多种独立机制的钟长期一致，就有理由相信它们测的是同一件事。<strong>全等<\/strong>（isochronism）是时钟可靠性的操作标准。<\/p>\n<h3>概念 3：时间与自然律（难度：进阶）<\/h3>\n<p>如果某个物理过程被选作“标准钟”，时间就成了“该过程的参数”。这会带来一个问题：当定律本身变化时，我们凭什么说时间还在均匀流逝？<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;格林威治的意外&quot;]\n  n2[&quot;全等检验&quot;]\n  n1 --&gt; n2\n  n3[&quot;时间与自然律&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用摆钟给其他钟对表：摆钟成了标准，但标准本身也需要被检验。边界：钟可以被校准，时间本身没有“标准时间”可对。\n<\/li><li>\n<strong>实例<\/strong>：原子钟基于铯-133 的特定跃迁频率，把 9192631770 次周期定义为 1 秒。这个定义是约定，但它的稳定性是可检验的事实。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为时间是“直接看见”的——我们看见的永远是事件与周期，不是时间本身。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计时中“约定”的部分指的是？\n<ul>\n<li>\nA. 物理定律\n<\/li><li>\nB. 人为选定的标准与单位\n<\/li><li>\nC. 钟的误差\n<\/li><li>\nD. 相对论效应\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：标准与单位是协商结果。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n时间靠周期事件测量\n<\/li><li>\n全等检验保证可靠\n<\/li><li>\n标准含约定成分\n<\/ul>", "ch02": "<h1>第 2 章：变化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述“时间即变化”的立场与其困难\n<\/li><li>\n能说明“没有变化的时间”为何可设想\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把时间等同于变化，会遇到“变化之间的时间”问题；但设想一段完全没有变化的时间，又似乎可以成立——两种直觉各有代价。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：时间即变化（难度：基础）<\/h3>\n<p>柏拉图与亚里士多德都把时间与变化绑定：没有变化就没有时间。若宇宙完全静止，说“过了一小时”似乎没有意义。<\/p>\n<h3>概念 2：无变化的时间（难度：进阶）<\/h3>\n<p>设想一个完全空无、没有任何事件的宇宙，仍可问“它持续了多久”。这说明时间可能独立于变化而存在。<strong>绝对时间<\/strong>（absolute time）的支持者据此主张时间是容器。<\/p>\n<h3>概念 3：皆事有因（难度：进阶）<\/h3>\n<p>若时间独立于变化，那么“为什么这一刻而不是那一刻”就缺少理由。<strong>充足理由律<\/strong>（principle of sufficient reason）在此受限：有些事实可能没有进一步理由。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;时间即变化&quot;]\n  n2[&quot;无变化的时间&quot;]\n  n1 --&gt; n2\n  n3[&quot;皆事有因&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一间空房间：没有家具，房间还在。边界：房间有墙可量，时间没有“墙”。\n<\/li><li>\n<strong>实例<\/strong>：把整个宇宙冻住一小时再解冻，这段时间存在吗？若说存在，时间独立于变化；若说不存在，时间依赖变化。两种回答都能自洽，取舍在于你愿意承担哪种代价。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为这个问题有实验答案——它是概念选择，实验只能约束哪一种更符合物理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“时间即变化”的主要困难是？\n<ul>\n<li>\nA. 无法测量\n<\/li><li>\nB. 难以说明变化之间的间隔\n<\/li><li>\nC. 变化不存在\n<\/li><li>\nD. 时间可逆\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：间隔若无变化，时间是否仍在流逝成问题。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n时间即变化 vs 绝对时间\n<\/li><li>\n无变化的时间可设想\n<\/li><li>\n充足理由律受限\n<\/ul>", "ch03": "<h1>第 3 章：没边的盒子？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明亚里士多德反对虚空的两个论证\n<\/li><li>\n能解释气压实验如何改变“真空”概念\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>虚空是否存在，取决于你把“空间”当容器还是当物体之间的关系；气压实验把“真空”从哲学争论变成可操作的现象。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：亚里士多德的反驳（难度：基础）<\/h3>\n<p>他主张“自然厌恶真空”：物体运动需要介质，空间不能独立于物体存在。虚空若存在，物体在其中的运动将没有参照，速度无从定义。<\/p>\n<h3>概念 2：罐、泵与气压计（难度：进阶）<\/h3>\n<p>抽气泵把罐内空气抽出，气压计读数下降，说明“空”是可以被制造的状态。<strong>真空<\/strong>（vacuum）从“不可能”变成“可测量”。<\/p>\n<h3>概念 3：绝对运动（难度：进阶）<\/h3>\n<p>若空间是容器，就可谈“相对于空间的绝对运动”。牛顿需要它来定义惯性；马赫与后来的相对论则主张只有相对运动有意义。这场争论一直延续到爱因斯坦。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;亚里士多德的反驳&quot;]\n  n2[&quot;罐、泵与气压计&quot;]\n  n1 --&gt; n2\n  n3[&quot;绝对运动&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像鱼问“水是什么”：生活在介质里，很难把介质本身对象化。边界：鱼能跳出水面，人不能跳出空间。\n<\/li><li>\n<strong>实例<\/strong>：托里拆利实验：把装满水银的管子倒插进水银槽，管顶真空，水银柱高度约 76 厘米，对应大气压。真空的存在由这个高度间接证明。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为真空就是“什么都没有”——量子场论中真空仍有涨落。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n亚里士多德反对虚空的核心论据是？\n<ul>\n<li>\nA. 真空太冷\n<\/li><li>\nB. 运动需要介质，空间不能独立于物体\n<\/li><li>\nC. 原子不存在\n<\/li><li>\nD. 气压太低\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他把空间当作物体间的关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n虚空之争 = 空间是容器还是关系\n<\/li><li>\n气压实验使真空可操作\n<\/li><li>\n绝对运动 vs 相对运动\n<\/ul>", "ch04": "<h1>第 4 章：曲线和维数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明非欧几何如何取代欧几里得几何的独尊地位\n<\/li><li>\n能解释“高于三维”的可设想性\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>欧几里得几何不是唯一的空间描述；平行公设可以被替换，得到自洽的非欧几何。空间是否有内在曲率，成了可检验的问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：平行公设的动摇（难度：进阶）<\/h3>\n<p>第五公设（过直线外一点只有一条平行线）不像其他公设那样自明。罗巴切夫斯基与鲍耶把它换成“有多条”，黎曼换成“没有”，各自得到自洽体系。<\/p>\n<h3>概念 2：可感知的空间（难度：进阶）<\/h3>\n<p>康德认为空间是感知的先验形式，欧氏几何因此“必然”。非欧几何出现后，这条论证失效：空间的形式可以是别的，经验才能决定是哪种。<\/p>\n<h3>概念 3：高于三维（难度：进阶）<\/h3>\n<p>二维生物无法想象第三维，但可以用“投影”“截面”推理。数学上四维、n 维空间都是自洽的；物理上是否需要额外维度，要靠理论预言与实验。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;平行公设的动摇&quot;]\n  n2[&quot;可感知的空间&quot;]\n  n1 --&gt; n2\n  n3[&quot;高于三维&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像蚂蚁在球面上走：它以为走的是直线，实际沿大圆。边界：蚂蚁能感知球面曲率（绕一圈会回来），人感知四维更难。\n<\/li><li>\n<strong>实例<\/strong>：三角形内角和：欧氏为 180°，球面大于 180°，双曲面小于 180°。同一个测量，不同曲率给出不同结果，因此曲率可被测量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为非欧几何只是数学游戏——广义相对论用它描述真实时空。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n非欧几何的出现说明了？\n<ul>\n<li>\nA. 欧氏几何错误\n<\/li><li>\nB. 平行公设可替换且各自自洽\n<\/li><li>\nC. 空间只有三维\n<\/li><li>\nD. 几何是实验科学\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：公设替换产生不同的自洽几何。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n第五公设可替换\n<\/li><li>\n空间曲率可测量\n<\/li><li>\n高维可数学设想\n<\/ul>", "ch05": "<h1>第 5 章：时间的开端和结尾<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“时间有开端”与“过去无限”各自的困难\n<\/li><li>\n能解释大坍塌与循环模型的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若时间有开端，开端的“之前”无法谈论；若过去无限，又要面对“无穷序列能否完成”。两种选择都有直觉上的代价。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：开端的问题（难度：高难）<\/h3>\n<p>“时间从何时开始”若答案是“某时刻”，那此前是什么？若答“无此前”，则“开始”这个词失去通常含义。奥古斯丁的回答是：时间与创世同时被造，问“之前”是无意义的。<\/p>\n<h3>概念 2：过去无限（难度：高难）<\/h3>\n<p>若过去无限，则今天之前有无限多天。反对者说无穷不能“完成”；支持者说无限序列不需要被逐个数完，它只是没有起点。<\/p>\n<h3>概念 3：结局（难度：进阶）<\/h3>\n<p>开放宇宙永远膨胀；封闭宇宙回缩成“大坍塌”；循环模型让膨胀与收缩交替。三者的区别在密度参数与暗能量的性质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;开端的问题&quot;]\n  n2[&quot;过去无限&quot;]\n  n1 --&gt; n2\n  n3[&quot;结局&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一条没有起点的线：你可以从任意点往左走，永远走不到头，但线本身已经在那里。边界：线可以在纸上画完，时间不能站在外面看。\n<\/li><li>\n<strong>实例<\/strong>：把“无穷多天”换成“负整数”：…-3, -2, -1, 0。这个序列没有最小元，但每个数都有前一个。过去无限可以是这种结构。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“过去无限”必然导致“无穷过程已完成”——序列可以从无起点处无限延伸，不需要一个完成的动作。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n奥古斯丁对“创世之前”的回答是？\n<ul>\n<li>\nA. 有另一个宇宙\n<\/li><li>\nB. 时间与创世同时被造，问“之前”无意义\n<\/li><li>\nC. 上帝在睡觉\n<\/li><li>\nD. 时间是循环的\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他把时间本身纳入被造物。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n开端使“之前”失效\n<\/li><li>\n过去无限不等于过程完成\n<\/li><li>\n结局取决于密度与暗能量\n<\/ul>", "ch06": "<h1>第 6 章：空间的边缘<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述阿基塔“伸手到宇宙之外”的论证\n<\/li><li>\n能解释“有限但无边界”的空间模型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若宇宙有边缘，把手伸出去就需要边缘之外的空间；若没有边缘而有限，空间可以像球面一样闭合——有限但无边界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：阿基塔的论证（难度：进阶）<\/h3>\n<p>站在宇宙边缘伸手：若能伸出，外面有空间，那原处不是边缘；若不能伸出，说明被某物阻挡，那阻挡物之外仍有空间。结论：宇宙不可能有绝对边缘。<\/p>\n<h3>概念 2：有限无边界（难度：高难）<\/h3>\n<p>球面是二维的有限无边界例子：面积有限，但走不到边。三维球面同理，体积有限，没有“外面”。这解决了阿基塔的两难：伸不出去不是被挡住，而是没有“外面”这个方向。<\/p>\n<h3>概念 3：无限的错觉（难度：进阶）<\/h3>\n<p>“宇宙之外还有空间”是直觉的产物，它预设了空间是容器。若空间是内禀的几何结构，问“外面”就是问一个不存在方向。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;阿基塔的论证&quot;]\n  n2[&quot;有限无边界&quot;]\n  n1 --&gt; n2\n  n3[&quot;无限的错觉&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像在地球上一直往北走：不会掉下去，也不会到“北的边缘”，只会绕回来。边界：地球有二维表面，三维空间的闭合需要四维嵌入的数学。\n<\/li><li>\n<strong>实例<\/strong>：球面三角形内角和大于 180°；若宇宙是闭合的，足够大的三角形也会显示类似偏差。这是可观测的判据之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“有限”就必须有边——球面有限而无边，空间可以类似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“有限但无边界”的模型是？\n<ul>\n<li>\nA. 盒子\n<\/li><li>\nB. 球面\n<\/li><li>\nC. 平面\n<\/li><li>\nD. 直线\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：球面面积有限，但走不到边。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n阿基塔两难\n<\/li><li>\n球面：有限无边\n<\/li><li>\n“外面”是容器直觉\n<\/ul>", "ch07": "<h1>第 7 章：无穷和悖论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述阿基里斯与乌龟悖论\n<\/li><li>\n能说明“无穷小量”与“有限论”两种回应\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>芝诺悖论把“运动”拆成无穷段，逼出“无穷过程不能完成”的结论；回应的关键是重新理解无穷级数的和与时间的连续性。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：阿基里斯（难度：进阶）<\/h3>\n<p>乌龟先跑一段，阿基里斯要追上必须先到乌龟起点，再到乌龟新位置……每次都要经过前一段的一半或一段，似乎永远差一点。结论：快者追不上慢者。<\/p>\n<h3>概念 2：两种回应（难度：高难）<\/h3>\n<p><strong>无穷小量<\/strong>：把距离分成越来越小的段，其和收敛到有限值（1/2 + 1/4 + … = 1），所以能追上有明确位置。<strong>有限论<\/strong>：空间与时间不是无限可分的，存在最小单位，芝诺的分割在某一步停止。<\/p>\n<h3>概念 3：汤姆逊的灯（难度：高难）<\/h3>\n<p>灯在 1/2 分钟开关一次、1/4 分钟再开关……到 1 分钟时灯是开还是关？这个思想实验说明“无穷多次操作在有限时间完成”在逻辑上会留下未定义状态。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;阿基里斯&quot;]\n  n2[&quot;两种回应&quot;]\n  n1 --&gt; n2\n  n3[&quot;汤姆逊的灯&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把一段路切成无限多段：切得再细，总长度还是那段路。边界：切是思维的，走路是连续的。\n<\/li><li>\n<strong>实例<\/strong>：1/2 + 1/4 + 1/8 + … = 1。无穷多项的和可以是有限的，这正是阿基里斯能追上的数学依据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为芝诺悖论已被“微积分解决”就没事了——它逼问的是“连续体由点组成”这一假设本身。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n阿基里斯悖论的数学回应核心是？\n<ul>\n<li>\nA. 无穷级数收敛\n<\/li><li>\nB. 乌龟更慢\n<\/li><li>\nC. 时间停止\n<\/li><li>\nD. 空间有边\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：无穷段之和可收敛到有限值。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n芝诺：无穷分割\n<\/li><li>\n收敛级数给出有限和\n<\/li><li>\n汤姆逊灯暴露未定义状态\n<\/ul>", "ch08": "<h1>第 8 章：时间会流逝吗？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明麦克塔格特的 A 系列与 B 系列\n<\/li><li>\n能区分现在主义与 B 理论\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>麦克塔格特论证：时间若真实，就必须有“过去/现在/未来”的流动（A 系列），但同一事件不能同时具有三种性质，故时间不真实；回应分成现在主义与 B 理论两派。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：A 系列与 B 系列（难度：进阶）<\/h3>\n<p><strong>A 系列<\/strong>（A-series）：事件分为过去、现在、未来，且这个划分在变。<strong>B 系列<\/strong>（B-series）：事件只有“早于/晚于”的固定关系，没有流动的现在。<\/p>\n<h3>概念 2：麦克塔格特的论证（难度：高难）<\/h3>\n<p>每个事件都曾是未来、现在是现在、将是过去——三种性质不能同时成立，除非说“曾经是未来、现在是现在”，但这就引入了 A 系列本身，循环。结论：A 系列矛盾，时间不真实。<\/p>\n<h3>概念 3：两种回应（难度：高难）<\/h3>\n<p><strong>现在主义<\/strong>（presentism）：只有现在是真实的，过去与未来不实在。<strong>B 理论<\/strong>（B-theory）：所有时刻同等实在，“现在”只是索引词，像“这里”一样依赖说话位置。两者各自要付出代价：前者难解释因果与记忆，后者难解释“流逝感”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;A 系列与 B 系列&quot;]\n  n2[&quot;麦克塔格特的论证&quot;]\n  n1 --&gt; n2\n  n3[&quot;两种回应&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像地图上的“你在这里”：标记随人移动，地图本身不变。边界：地图没有“流动”，人有。\n<\/li><li>\n<strong>实例<\/strong>：把“现在”换成“这里”：说“这里”并没有指向一个特殊地点，只表示说话者位置。B 理论认为“现在”同理。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 B 理论否认时间——它否认的是“流动的现在”，不是时间次序。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n麦克塔格特论证的结论是？\n<ul>\n<li>\nA. 时间可逆\n<\/li><li>\nB. A 系列矛盾，时间不真实\n<\/li><li>\nC. B 系列矛盾\n<\/li><li>\nD. 现在最重要\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他以 A 系列的自相矛盾否定时间的实在性。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nA 系列：流动的过去现在未来\n<\/li><li>\nB 系列：固定的早于晚于\n<\/li><li>\n现在主义 vs B 理论\n<\/ul>", "ch09": "<h1>第 9 章：像放电影的宇宙<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“瞬间没有运动”这一论证\n<\/li><li>\n能解释电影帧与连续运动的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若时间由瞬间组成，每个瞬间物体都占据一个确定位置，那瞬间内没有运动；但连续运动又不能由静止的瞬间拼出——这是芝诺问题的现代版。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：飞矢不动（难度：进阶）<\/h3>\n<p>在任一瞬间，箭占据与自身等长的空间，因此在该瞬间静止；若每个瞬间都静止，全程就静止。<strong>瞬间<\/strong>（instant）概念与运动概念在这里冲突。<\/p>\n<h3>概念 2：电影隐喻（难度：进阶）<\/h3>\n<p>电影由静止帧快速播放造成运动错觉。若宇宙像电影，运动就是“帧间差异”，不是帧内属性。但电影需要放映机与观众，宇宙没有。<\/p>\n<h3>概念 3：连续体（难度：高难）<\/h3>\n<p>数学上，运动可用位置函数 x(t) 描述，瞬时速度为导数。导数不是“瞬间内的位移”，而是极限。这解决了“瞬间无运动”的悖论，但把运动变成了极限概念。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;飞矢不动&quot;]\n  n2[&quot;电影隐喻&quot;]\n  n1 --&gt; n2\n  n3[&quot;连续体&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像幻灯片快速翻动看到动画：每张不动，连起来才动。边界：幻灯片有间隔，时间若连续则没有“下一帧”。\n<\/li><li>\n<strong>实例<\/strong>：自由落体 x = ½gt²，在 t=1 秒的瞬时速度是 g。这个值由极限定义，不是某一瞬间的位移除以时间。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“瞬间静止”证明了运动不存在——它只说明“瞬间”这个概念不适合承载运动。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“飞矢不动”论证的关键假设是？\n<ul>\n<li>\nA. 箭会停\n<\/li><li>\nB. 时间由瞬间组成且瞬间内无运动\n<\/li><li>\nC. 空间有限\n<\/li><li>\nD. 速度可变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把运动拆成瞬间属性导致悖论。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n瞬间无运动\n<\/li><li>\n电影隐喻的限度\n<\/li><li>\n导数用极限代替瞬间位移\n<\/ul>", "ch10": "<h1>第 10 章：干预历史<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“祖父悖论”的两种解决方向\n<\/li><li>\n能区分“改变过去”与“自洽的历史”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>时间旅行若允许改变过去，会产生因果矛盾；两种出路是：过去不可改变（自洽），或存在多条时间线（分支）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：祖父悖论（难度：进阶）<\/h3>\n<p>回到过去杀死祖父，则父亲不会出生，你也不会出生，于是你无法回去杀死祖父。<strong>因果环<\/strong>（causal loop）让前提自我取消。<\/p>\n<h3>概念 2：自洽解（难度：高难）<\/h3>\n<p>物理上可能只有自洽的历史：你能回去，但任何尝试都会被某种方式阻止，或你的行动本来就是历史的一部分。诺维科夫自洽原则是这一思路的物理版本。<\/p>\n<h3>概念 3：分支解（难度：高难）<\/h3>\n<p>回到过去会分出新时间线，你改变的是另一条线，原线不变。这避免了矛盾，但代价是“改变过去”其实没改变你来自的那条线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;祖父悖论&quot;]\n  n2[&quot;自洽解&quot;]\n  n1 --&gt; n2\n  n3[&quot;分支解&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像录像带：自洽解是带子只能那样放；分支解是每改一次就复制一盘新带。边界：录像带可复制，时间线是否可复制未知。\n<\/li><li>\n<strong>实例<\/strong>：若你回去阻止一场事故，自洽解会说：你正是事故发生的起因（你的出现触发了它）。这个闭环没有矛盾，但很反直觉。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为时间旅行一定自相矛盾——矛盾只出现在“改变过去”的强版本里。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n祖父悖论的“自洽解”主张？\n<ul>\n<li>\nA. 过去可随意改\n<\/li><li>\nB. 只有自洽的历史可能\n<\/li><li>\nC. 时间不存在\n<\/li><li>\nD. 多世界\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：任何行动都纳入既定历史，不产生矛盾。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n因果环导致自我取消\n<\/li><li>\n自洽解：历史只有一种\n<\/li><li>\n分支解：改的是另一条线\n<\/ul>", "ch11": "<h1>第 11 章：我们之外的时间和空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“多重宇宙”的几种版本\n<\/li><li>\n能指出“分支”与“平行”在逻辑上的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多重宇宙不是单一假说，而是几类不同结构：空间上遥远的分区、量子分支、模空间里的不同常数；它们的可检验性各不相同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：空间分区（难度：进阶）<\/h3>\n<p>若宇宙无限，任何有限组合都会在足够远处重复出现。这类“遥远副本”不需要新物理，只需要无限空间。<\/p>\n<h3>概念 2：量子分支（难度：高难）<\/h3>\n<p>多世界解释把每次测量看成世界分支，所有结果都实现。它避免了坍缩假设，但代价是“概率”难以解释。<\/p>\n<h3>概念 3：可检验性（难度：高难）<\/h3>\n<p>遥远分区原则上不可访问；量子分支不可互通；不同常数的模空间更难。作者的态度是：先分清“逻辑可能”与“科学假说”，后者需要可检验的差异。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;空间分区&quot;]\n  n2[&quot;量子分支&quot;]\n  n1 --&gt; n2\n  n3[&quot;可检验性&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一栋无限大的公寓楼：每个房间的组合可能重复，但你走不到隔壁。边界：公寓楼可以造电梯，宇宙分区不能。\n<\/li><li>\n<strong>实例<\/strong>：若宇宙无限且物质分布均匀，则距离足够远处存在与你完全相同的原子排列。这不是科幻，是概率论的推论。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多重宇宙都是同一种东西——空间副本、量子分支、常数不同的区域，证据基础完全不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“遥远副本”依赖的前提是？\n<ul>\n<li>\nA. 量子坍缩\n<\/li><li>\nB. 宇宙无限且分布均匀\n<\/li><li>\nC. 时间旅行\n<\/li><li>\nD. 暗能量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无限空间使有限组合重复。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多重宇宙有多种版本\n<\/li><li>\n空间副本靠无限性\n<\/li><li>\n可检验性各不同\n<\/ul>", "ch12": "<h1>第 12 章：时间箭头<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch11\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能列出至少三个时间箭头\n<\/li><li>\n能说明“箭头为何一致”这一难题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>热力学、宇宙学、心理学各有箭头；它们方向一致，但一致的原因没有定论——可能都源于宇宙初始的低熵条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个箭头（难度：进阶）<\/h3>\n<p><strong>热力学箭头<\/strong>：熵增。<strong>宇宙学箭头<\/strong>：宇宙膨胀。<strong>心理学箭头<\/strong>：我们记得过去、不记得未来。三者都指向同一方向。<\/p>\n<h3>概念 2：一致性问题（难度：高难）<\/h3>\n<p>为什么三种完全不同的过程方向相同？一种解释是它们都继承自初始条件：宇宙从极低熵状态出发，之后所有过程都沿同一方向展开。<\/p>\n<h3>概念 3：局部的方向（难度：高难）<\/h3>\n<p>在局部系统中，熵可以减少（生命、冰箱）。全局箭头不保证每个子系统同向。作者提醒：说“时间有方向”时，要先说清是哪个系统的哪个箭头。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三个箭头&quot;]\n  n2[&quot;一致性问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;局部的方向&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像三条河都往东流：可能因为地势整体向东，不是因为每条河自己选了方向。边界：河有地势，宇宙有初始条件。\n<\/li><li>\n<strong>实例<\/strong>：打碎杯子容易，碎片自发拼回杯子几乎不可能；录像倒放一眼可辨。这个不对称就是热力学箭头的日常证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为时间箭头是基本定律——基本方程大多时间可逆，箭头来自统计与初始条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n时间箭头不包括？\n<ul>\n<li>\nA. 热力学\n<\/li><li>\nB. 宇宙学\n<\/li><li>\nC. 心理学\n<\/li><li>\nD. 电磁学\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：三个主要箭头是热、宇宙、心理。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三箭头：热、宇宙、心理\n<\/li><li>\n一致源于初始低熵\n<\/li><li>\n局部可反向\n<\/ul>", "c01": "<h1>A 系列与 B 系列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 08 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>A 系列：事件有过去/现在/未来的流动划分；B 系列：事件只有固定的早于/晚于关系。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是当代时间哲学的分水岭：你站哪一边，决定了“现在是否特殊”“流逝是否真实”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>A 系列需要“现在”不断移动，麦克塔格特指出同一事件不能同时具有三种性质。<\/p>\n<p>B 系列把时间排成静态序列，“现在”只是索引词。<\/p>\n<p>代价：A 系列难逃矛盾，B 系列难解释流逝感。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 B 理论否认时间——它否认流动，不否认次序。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>麦克塔格特<\/td><td>论证<\/td><\/tr><tr><td>ch09<\/td><td>电影宇宙<\/td><td>B 系列图像<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n现在主义、时间箭头\n<\/ul>", "c02": "<h1>芝诺式悖论与连续体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 07 章、第 09 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把连续运动拆成无穷多瞬间或无穷多段，会得到“运动不可能”的结论；回应要重新定义无穷和或连续性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是数学分析（极限、收敛级数）的哲学起点，也是理解“瞬间”“连续”的关键。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种回应：①收敛级数（1/2+1/4+…=1）；②有限论（存在最小单位）；③极限定义（速度是导数，不是瞬间位移）。<\/p>\n<p>每种回应都改变了对“连续体”的理解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为微积分一出现悖论就消失了——它解决的是计算，留下的是概念。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>阿基里斯<\/td><td>悖论<\/td><\/tr><tr><td>ch09<\/td><td>飞矢<\/td><td>现代版<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nA/B 系列、运动\n<\/ul>", "c03": "<h1>时间箭头的三个来源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>热力学熵增、宇宙膨胀、心理记忆方向，三者共同构成“时间有方向”的证据。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“时间流逝”从主观感受变成可比较的物理过程，同时留下“为何一致”的难题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>热力学：孤立系统熵增。<\/p>\n<p>宇宙学：膨胀提供整体不对称。<\/p>\n<p>心理学：记忆只指向过去。<\/p>\n<p>一致性的候选解释：初始低熵条件。<\/p>\n<p>注意：局部系统可逆，箭头是全局统计结论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为有箭头就有“时间之流”——箭头是过程的不对称，不自动解释流逝感。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch12<\/td><td>三箭头<\/td><td>综述<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nA/B 系列、熵\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：时间的测量<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 时间的测量<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：变化<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 变化<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：没边的盒子？<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 没边的盒子？<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：曲线和维数<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 曲线和维数<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：时间的开端和结尾<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 时间的开端和结尾<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：空间的边缘<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 空间的边缘<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：无穷和悖论<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 无穷和悖论<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：时间会流逝吗？<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 时间会流逝吗？<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：像放电影的宇宙<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 像放电影的宇宙<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：干预历史<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 干预历史<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：我们之外的时间和空间<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 我们之外的时间和空间<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-12'><strong>步骤 12：时间箭头<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章 时间箭头<\/a><br>检查点：完成第 12 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q13.<\/b> “现在”在 B 理论中类似于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 绝对坐标<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 索引词“这里”<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 物理常数<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 因果力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q14.<\/b> 阿基里斯能追上乌龟的数学依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 乌龟会停<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 无穷级数收敛<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 空间有限<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 时间有开端<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q15.<\/b> 三个时间箭头方向一致的最可能解释是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 基本定律不可逆<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 都继承自宇宙初始低熵条件<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 人的错觉<\/label><label class='quiz-op
