iz-item' data-qid='ch15-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 无标度网络的度分布特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch15-q2' value='0'> 正态分布<\/label><label class='quiz-opt'><input type='radio' name='ch15-q2' value='1'> 均匀分布<\/label><label class='quiz-opt'><input type='radio' name='ch15-q2' value='2'> 幂律分布<\/label><label class='quiz-opt'><input type='radio' name='ch15-q2' value='3'> 双峰分布<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章 真实世界中的网络<\/h1><div class='quiz-item' data-qid='ch16-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 生物网络呈小世界性的主要收益是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch16-q1' value='0'> 节点数量少<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1' value='1'> 短路径 + 局部冗余抗损<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1' value='2'> 没有枢纽<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1' value='3'> 度分布均匀<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch16-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> “引爆点”描述的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch16-q2' value='0'> 网络规模上限<\/label><label class='quiz-opt'><input type='radio' name='ch16-q2' value='1'> 传播率越过阈值后影响突然放大<\/label><label class='quiz-opt'><input type='radio' name='ch16-q2' value='2'> 节点随机失效<\/label><label class='quiz-opt'><input type='radio' name='ch16-q2' value='3'> 幂律的尾部<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch17__": "<h1>测验：第 17 章 比例之谜<\/h1><div class='quiz-item' data-qid='ch17-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 克莱伯定律的指数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch17-q1' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='ch17-q1' value='1'> 2/3<\/label><label class='quiz-opt'><input type='radio' name='ch17-q1' value='2'> 3/4<\/label><label class='quiz-opt'><input type='radio' name='ch17-q1' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch17-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 支持 3/4 的主要机制解释是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch17-q2' value='0'> 体表散热<\/label><label class='quiz-opt'><input type='radio' name='ch17-q2' value='1'> 分形式输送网络的最优填充<\/label><label class='quiz-opt'><input type='radio' name='ch17-q2' value='2'> 心跳频率恒定<\/label><label class='quiz-opt'><input type='radio' name='ch17-q2' value='3'> 食物摄入量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch18__": "<h1>测验：第 18 章 进化，复杂化<\/h1><div class='quiz-item' data-qid='ch18-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪项不是书中提到的复杂化机制？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch18-q1' value='0'> 基因复制<\/label><label class='quiz-opt'><input type='radio' name='ch18-q1' value='1'> 发育调控改变<\/label><label class='quiz-opt'><input type='radio' name='ch18-q1' value='2'> 共生/水平转移<\/label><label class='quiz-opt'><input type='radio' name='ch18-q1' value='3'> 所有突变都朝向更复杂<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch18-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 把基因组直接类比为“程序”会漏掉？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch18-q2' value='0'> 碱基配对规则<\/label><label class='quiz-opt'><input type='radio' name='ch18-q2' value='1'> 非编码调控与可变剪接<\/label><label class='quiz-opt'><input type='radio' name='ch18-q2' value='2'> 双螺旋结构<\/label><label class='quiz-opt'><input type='radio' name='ch18-q2' value='3'> 密码子表<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch19__": "<h1>测验：第 19 章 复杂性科学的过去和未来<\/h1><div class='quiz-item' data-qid='ch19-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 米歇尔对复杂性科学的总体判断是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch19-q1' value='0'> 已完成的统一理论<\/label><label class='quiz-opt'><input type='radio' name='ch19-q1' value='1'> 伪科学<\/label><label class='quiz-opt'><input type='radio' name='ch19-q1' value='2'> 正在成形的工具体系，有成果也有夸饰<\/label><label class='quiz-opt'><input type='radio' name='ch19-q1' value='3'> 只适用于物理学<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch19-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 按本书标准，下面哪种说法最有内容？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch19-q2' value='0'> 经济是复杂系统，所以不可预测<\/label><label class='quiz-opt'><input type='radio' name='ch19-q2' value='1'> 涌现让整体大于部分之和<\/label><label class='quiz-opt'><input type='radio' name='ch19-q2' value='2'> 网络枢纽占少数且传播率过阈值时会出现级联失效<\/label><label class='quiz-opt'><input type='radio' name='ch19-q2' value='3'> 混沌边缘是创新的源泉<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='涌现'>涌现 — 整体出现单个成分不具备的行为 <span class=glossary-ref>（第 1 章 复杂性是什么）<\/span><\/li><li data-term='动力系统'>动力系统 — 状态按固定规则随时间变化的系统 <span class=glossary-ref>（第 2 章 动力学、混沌和预测）<\/span><\/li><li data-term='逻辑斯蒂映射'>逻辑斯蒂映射 — x_{n+1}=r·x_n(1−x_n)，展示分岔与混沌的最简模型 <span class=glossary-ref>（第 2 章 动力学、混沌和预测）<\/span><\/li><li data-term='混沌'>混沌 — 确定性但对初值指数敏感的系统 <span class=glossary-ref>（第 2 章 动力学、混沌和预测）<\/span><\/li><li data-term='熵'>熵 — 一个宏观状态对应的微观排法数量的对数 <span class=glossary-ref>（第 3 章 信息）<\/span><\/li><li data-term='香农信息'>香农信息 — 收到消息后不确定性减少的量，−log₂p <span class=glossary-ref>（第 3 章 信息）<\/span><\/li><li data-term='麦克斯韦妖'>麦克斯韦妖 — 试图靠测量分子速度分离快慢分子以降低熵的思想实验 <span class=glossary-ref>（第 3 章 信息）<\/span><\/li><li data-term='图灵机'>图灵机 — 纸带、读写头与规则表构成的抽象计算模型 <span class=glossary-ref>（第 4 章 计算）<\/span><\/li><li data-term='停机问题'>停机问题 — 判定任意程序是否最终停止的问题，不可解 <span class=glossary-ref>（第 4 章 计算）<\/span><\/li><li data-term='哥德尔编码'>哥德尔编码 — 把命题与证明编码成算术对象的技术 <span class=glossary-ref>（第 4 章 计算）<\/span><\/li><li data-term='现代综合'>现代综合 — 达尔文选择论与孟德尔遗传学合并的理论框架 <span class=glossary-ref>（第 5 章 进化）<\/span><\/li><li data-term='密码子'>密码子 — 三个碱基一组的氨基酸编码单位 <span class=glossary-ref>（第 6 章 遗传学概要）<\/span><\/li><li data-term='算法信息量'>算法信息量 — 描述数据的最短程序长度 <span class=glossary-ref>（第 7 章 度量复杂性）<\/span><\/li><li data-term='逻辑深度'>逻辑深度 — 从最短描述算出结果所需的步数 <span class=glossary-ref>（第 7 章 度量复杂性）<\/span><\/li><li data-term='分形维数'>分形维数 — 刻画自相似结构填充空间程度的维数 <span class=glossary-ref>（第 7 章 度量复杂性）<\/span><\/li><li data-term='自复制'>自复制 — 系统造出包含自身描述的新副本 <span class=glossary-ref>（第 8 章 自我复制的计算机程序）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 用选择、交叉、突变搜索解的算法 <span class=glossary-ref>（第 9 章 遗传算法）<\/span><\/li><li data-term='适应度'>适应度 — 个体在任务上的表现分数 <span class=glossary-ref>（第 9 章 遗传算法）<\/span><\/li><li data-term='元胞自动机'>元胞自动机 — 按局部规则同步更新的格子阵列 <span class=glossary-ref>（第 10 章 元胞自动机、生命和宇宙）<\/span><\/li><li data-term='生命游戏'>生命游戏 — 康威提出的二维元胞自动机 <span class=glossary-ref>（第 10 章 元胞自动机、生命和宇宙）<\/span><\/li><li data-term='粒子（元胞机）'>粒子（元胞机） — 元胞机中自发产生、能稳定传播的局部结构 <span class=glossary-ref>（第 11 章 粒子计算）<\/span><\/li><li data-term='克隆选择'>克隆选择 — 免疫系统从现成多样性中筛选并扩增识别细胞 <span class=glossary-ref>（第 12 章 生命系统中的信息处理）<\/span><\/li><li data-term='类比'>类比 — 在两个表面不同的事物间建立结构对应 <span class=glossary-ref>（第 13 章 如何进行类比（如果你是计算机））<\/span><\/li><li data-term='糖域模型'>糖域模型 — 用糖分布与代谢规则模拟社会现象的仿真 <span class=glossary-ref>（第 14 章 计算机模型）<\/span><\/li><li data-term='六度分隔'>六度分隔 — 真实社交网络平均路径约六步的现象 <span class=glossary-ref>（第 15 章 网络科学）<\/span><\/li><li data-term='小世界网络'>小世界网络 — 局部密集加少量长程连接的网络的统称 <span class=glossary-ref>（第 15 章 网络科学）<\/span><\/li><li data-term='幂律'>幂律 — 概率或规模随量呈指数衰减、无特征尺度的分布 <span class=glossary-ref>（第 15 章 网络科学）<\/span><\/li><li data-term='枢纽节点'>枢纽节点 — 连接数远高于平均的节点 <span class=glossary-ref>（第 16 章 真实世界中的网络）<\/span><\/li><li data-term='引爆点'>引爆点 — 传播率越过阈值后影响突然放大的临界点 <span class=glossary-ref>（第 16 章 真实世界中的网络）<\/span><\/li><li data-term='克莱伯定律'>克莱伯定律 — 代谢率与体重 3/4 次幂成正比的经验规律 <span class=glossary-ref>（第 17 章 比例之谜）<\/span><\/li><li data-term='可变剪接'>可变剪接 — 同一基因转录产物被拼接成多种 mRNA <span class=glossary-ref>（第 18 章 进化，复杂化）<\/span><\/li><\/ul>", "__patterns__": "<h1>复杂 模式与框架库<\/h1>\n<h2>分析框架：三步判断一个系统是否“复杂”<\/h2>\n<ol><li>\n成分是否大量且相对简单？\n<\/li><li>\n互动是否局部（每个成分只看得见邻居）？\n<\/li><li>\n整体行为是否无法从单个成分的规则直接读出？\n<p>三条都成立，才值得用复杂系统的工具去分析；缺一条，先考虑是不是普通控制系统或统计系统。<\/p>\n<\/ol>\n<h2>分析框架：米歇尔的“度量选择”框架<\/h2>\n<p>先问要区分什么：随机 vs 有序用熵；有序 vs 可压缩用算法信息量；可压缩 vs 精巧用逻辑深度；精巧 vs 层级多用层次度量；结构自相似用分形维数。选错尺子，结论必然错。<\/p>\n<h2>决策规则：看到“涌现”先追问机制<\/h2>\n<p>if 有人用“涌现”解释一个现象 then 追问：哪些成分、什么局部互动、什么反馈、哪个可测的整体量 if 答不出 then 这只是隐喻，不是解释<\/p>\n<h2>反模式：把模拟的一次运行当成证据<\/h2>\n<p>作者反对“跑出漂亮图案就宣布发现规律”。替代做法：参数扫描、报告分布、给出反例条件。单次运行只能证明“可能”，不能证明“通常”。<\/p>\n<h2>反模式：把幂律当普适定律<\/h2>\n<p>双对数坐标上的直线可能来自有限尺度、采样偏差或拟合区间选择。先确认生成机制，再谈普适性。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>判断涌现<\/td><td>成分简单 + 互动局部 + 整体新性质，三条齐备<\/td><\/tr><tr><td>混沌判据<\/td><td>李雅普诺夫指数 &gt; 0，相邻轨迹指数分离<\/td><\/tr><tr><td>信息量计算<\/td><td>−log₂p，均匀 8 选 1 为 3 比特<\/td><\/tr><tr><td>熵与排法<\/td><td>S = k log W，W 为微观状态数<\/td><\/tr><tr><td>图灵机三件套<\/td><td>无限纸带 + 读写头 + 规则表<\/td><\/tr><tr><td>遗传算法四步<\/td><td>初始化 → 评估 → 选择 → 交叉与突变<\/td><\/tr><tr><td>生命游戏规则<\/td><td>邻居&lt;2 死，&gt;3 死，死细胞邻居=3 复活<\/td><\/tr><tr><td>沃尔夫勒姆四类<\/td><td>均匀 / 周期 / 混沌 / 局部结构（复杂）<\/td><\/tr><tr><td>小世界生成<\/td><td>规则格子 + 少量随机重连（5 条即可显著缩短路径）<\/td><\/tr><tr><td>克莱伯定律<\/td><td>代谢率 ∝ 体重^{3/4}<\/td><\/tr><tr><td>自复制构造<\/td><td>描述层 + 通用构造器层，避免无限嵌套<\/td><\/tr><tr><td>模拟的证明力<\/td><td>充分性（规则够用），不是必要性（现实如此）<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
