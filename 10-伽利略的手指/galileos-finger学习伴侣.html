ry'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章 量子：认识的简化<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 量子化的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 能量连续<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 能量以最小份额成块交换<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 粒子不可分<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 波粒二象<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 不确定性原理说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 仪器精度不足<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 共轭量不能同时精确<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 测量会改变结果<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 粒子会消失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章 宇宙：真实的纵览<\/h1><div class='quiz-item' data-qid='ch08-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 宇宙膨胀的直接证据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q1' value='0'> 红移与距离成正比<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='1'> 恒星颜色<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='2'> 行星轨道<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='3'> 潮汐<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 大爆炸的正确理解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q2' value='0'> 在空间某点炸开<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='1'> 空间本身从高温高密状态膨胀<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='2'> 星系互相撞击<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='3'> 恒星爆炸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章 时空：互作用的舞台<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 狭义相对论的出发点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 光速不变<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 绝对时间<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 以太存在<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 引力是力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 广义相对论中引力的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q2' value='0'> 超距作用<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='1'> 时空弯曲<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 电磁力<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 弱力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章 数学：理性的局限<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 哥德尔不完备定理说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 数学全错<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 足够强的系统中存在不可判定的真命题<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 所有命题都可证<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 数学依赖实验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> “不可思议的有效性”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q2' value='0'> 数学太难<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='1'> 纯粹数学常能精确描述物理<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='2'> 物理不需要数学<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='3'> 数学不可靠<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='自然选择'>自然选择 — 变异、遗传与差异存活的累积机制 <span class=glossary-ref>（第 1 章 进化：复杂性的萌芽）<\/span><\/li><li data-term='双螺旋'>双螺旋 — DNA 的两条互补链结构 <span class=glossary-ref>（第 2 章 DNA：生物学的理性化）<\/span><\/li><li data-term='能量'>能量 — 不同形式变化的统一度量 <span class=glossary-ref>（第 3 章 能量：计量的普遍化）<\/span><\/li><li data-term='熵'>熵 — 能量分散程度与不可用性的度量 <span class=glossary-ref>（第 4 章 熵：变化发生的源泉）<\/span><\/li><li data-term='时间箭头'>时间箭头 — 宏观演化偏向熵增的方向 <span class=glossary-ref>（第 4 章 熵：变化发生的源泉）<\/span><\/li><li data-term='周期表'>周期表 — 按原子序数与电子结构排列的元素表 <span class=glossary-ref>（第 5 章 原子：物质的产生）<\/span><\/li><li data-term='对称操作'>对称操作 — 使对象保持不变的变换 <span class=glossary-ref>（第 6 章 对称：美的量化）<\/span><\/li><li data-term='诺特定理'>诺特定理 — 连续对称对应守恒定律 <span class=glossary-ref>（第 6 章 对称：美的量化）<\/span><\/li><li data-term='量子化'>量子化 — 能量与状态取分立值 <span class=glossary-ref>（第 7 章 量子：认识的简化）<\/span><\/li><li data-term='不确定性原理'>不确定性原理 — 共轭量不能同时精确 <span class=glossary-ref>（第 7 章 量子：认识的简化）<\/span><\/li><li data-term='红移'>红移 — 光被拉长、频率降低 <span class=glossary-ref>（第 8 章 宇宙：真实的纵览）<\/span><\/li><li data-term='短程线'>短程线 — 弯曲时空中最长的固有时路径 <span class=glossary-ref>（第 9 章 时空：互作用的舞台）<\/span><\/li><li data-term='不完备定理'>不完备定理 — 足够强系统中存在不可判定命题 <span class=glossary-ref>（第 10 章 数学：理性的局限）<\/span><\/li><\/ul>", "__patterns__": "<h1>伽利略的手指 模式与框架库<\/h1>\n<h2>分析框架：十根手指的串联<\/h2>\n<p>问四个问题把十章串起来：①复杂性从哪来（进化、DNA）？②变化靠什么驱动、往哪走（能量、熵）？③物质由什么构成、受什么约束（原子、对称、量子）？④大尺度与理性的边界在哪（宇宙、时空、数学）？四问能恢复全书骨架。<\/p>\n<h2>决策规则：遇到“新理论解释旧现象”<\/h2>\n<p>if 新理论给出可定量检验的差异 then 用观测裁决（如水星进动 43 角秒） else if 只给出定性重述 then 视为哲学重构，不是科学替代<\/p>\n<h2>反模式：把熵增当成“宇宙末日”<\/h2>\n<p>熵增只约束孤立系统；开放系统可以局部降熵。生命、城市、文明都是靠能量流维持的低熵岛。<\/p>\n<h2>反模式：把对称当装饰<\/h2>\n<p>对称在物理中是守恒的来源。只谈“对称很美”而不谈守恒量，是把结构降格为外观。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>十支柱<\/td><td>进化 / DNA / 能量 / 熵 / 原子 / 对称 / 量子 / 宇宙 / 时空 / 数学<\/td><\/tr><tr><td>1 卡<\/td><td>≈ 4.18 焦<\/td><\/tr><tr><td>诺特对应<\/td><td>时间→能量，空间→动量，旋转→角动量<\/td><\/tr><tr><td>哈勃定律<\/td><td>v = H d，H≈70 km/s/Mpc<\/td><\/tr><tr><td>水星进动<\/td><td>每百年约 43 角秒<\/td><\/tr><tr><td>不确定性<\/td><td>Δx·Δp ≥ ħ/2<\/td><\/tr><tr><td>不完备<\/td><td>强系统内有不可判定命题<\/td><\/tr><tr><td>晶体对称<\/td><td>只能 2、3、4、6 重（准晶例外）<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
