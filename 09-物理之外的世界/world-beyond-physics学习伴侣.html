t type='radio' name='ch09-q1' value='1'> 生物体<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 种群<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 生态位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章 扩展适应和螺丝刀<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “使之成为可能”强调的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 必然导致<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 提供可行路径但非必然<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 随机<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 设计<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章 物理之外的世界<\/h1><div class='quiz-item' data-qid='ch11-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “相邻可能”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1' value='0'> 所有可能状态<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='1'> 从当前状态一步可达的状态集合<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='2'> 未来预测<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='3'> 随机突变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='遍历'>遍历 — 系统最终走遍所有可能状态 <span class=glossary-ref>（第 1 章 世界不是一台机器）<\/span><\/li><li data-term='约束闭合'>约束闭合 — 约束相互维持的自我维持闭环 <span class=glossary-ref>（第 3 章 传播组织）<\/span><\/li><li data-term='自催化集合'>自催化集合 — 产物催化自身生成的分子网络 <span class=glossary-ref>（第 5 章 如何制造新陈代谢）<\/span><\/li><li data-term='原初细胞'>原初细胞 — 干湿循环中形成的膜包被结构 <span class=glossary-ref>（第 6 章 原初细胞）<\/span><\/li><li data-term='组成遗传'>组成遗传 — 分裂时组分差异被传递 <span class=glossary-ref>（第 7 章 可遗传变异）<\/span><\/li><li data-term='三和弦'>三和弦 — 感觉-评价-行动的循环 <span class=glossary-ref>（第 8 章 我们玩的游戏）<\/span><\/li><li data-term='生态位'>生态位 — 物种在群落中的资源与角色 <span class=glossary-ref>（第 9 章 舞台已经搭好了）<\/span><\/li><li data-term='扩展适应'>扩展适应 — 旧结构被新功能征用 <span class=glossary-ref>（第 10 章 扩展适应和螺丝刀）<\/span><\/li><li data-term='相邻可能'>相邻可能 — 从当前状态一步可达的状态集合 <span class=glossary-ref>（第 11 章 物理之外的世界）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>物理之外的世界 模式与框架库<\/h1>\n<h2>分析框架：新事物出现的三层解释<\/h2>\n<p>①允许层：物理/化学是否允许？②组织层：是否有约束闭合维持它？③历史层：它是否在相邻可能之内？三层都过，才能说“可能出现”；缺一层，就只是想象。<\/p>\n<h2>决策规则：判断因果还是使能<\/h2>\n<p>if 从 A 能推出 B 的具体形式 then 是 entailment else if A 出现后 B 有了可行路径，但形式不确定 then 是 enablement 写解释时不要混用两种句式。<\/p>\n<h2>反模式：把基因组当全部程序<\/h2>\n<p>序列只是线性代码层，折叠、膜、代谢、空间位置都不在序列里。把 DNA 当生命全图，会低估环境与组织。<\/p>\n<h2>反模式：把演化当目的论<\/h2>\n<p>“为了飞行长出羽毛”是倒果为因。演化只回应当前选择压，新功能是事后征用。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>非遍历论证<\/td><td>10^80 粒子 × 10^17 秒 / 10^-43 秒 ≈ 10^140 次尝试<\/td><\/tr><tr><td>蛋白组合数<\/td><td>20^300 ≈ 10^390<\/td><\/tr><tr><td>约束闭合<\/td><td>膜、代谢、能量互为条件<\/td><\/tr><tr><td>自催化阈值<\/td><td>分子种类与反应数超过临界即大概率出现<\/td><\/tr><tr><td>原初细胞<\/td><td>湿润囊泡 → 干燥胶状 → 矿物表面重组<\/td><\/tr><tr><td>三和弦<\/td><td>感觉 → 评价 → 行动<\/td><\/tr><tr><td>扩展适应<\/td><td>羽毛：保温 → 飞行<\/td><\/tr><tr><td>相邻可能<\/td><td>PC → 互联网 → 电商 → 搜索<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/09-物理之外的世界", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 世界不是一台机器", "href": "#/chapter/ch01"}, {"label": "第 2 章 功能的功能", "href": "#/chapter/ch02"}, {"label": "第 3 章 传播组织", "href": "#/chapter/ch03"}, {"label": "第 4 章 解密生命", "href": "#/chapter/ch04"}, {"label": "第 5 章 如何制造新陈代谢", "href": "#/chapter/ch05"}, {"label": "第 6 章 原初细胞", "href": "#/chapter/ch06"}, {"label": "第 7 章 可遗传变异", "href": "#/chapter/ch07"}, {"label": "第 8 章 我们玩的游戏", "href": "#/chapter/ch08"}, {"label": "第 9 章 舞台已经搭好了", "href": "#/chapter/ch09"}, {"label": "第 10 章 扩展适应和螺丝刀", "href": "#/chapter/ch10"}, {"label": "第 11 章 物理之外的世界", "href": "#/chapter/ch11"}]}, {"label": "概念", "children": [{"label": "相邻可能", "href": "#/concept/c01"}, {"label": "约束闭合", "href": "#/concept/c02"}, {"label": "使之成为可能而非导致", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 世界不是一台机器", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 功能的功能", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 传播组织", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 解密生命", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 如何制造新陈代谢", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 原初细胞", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 可遗传变异", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 我们玩的游戏", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 舞台已经搭好了", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 扩展适应和螺丝刀", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章 物理之外的世界", "href": "#/quiz/ch11"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：世界不是一台机器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能算出“宇宙远未遍历所有可能”的数量级论证\n<\/li><li>\n能说明非遍历性如何否证“物理可推出生命”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>宇宙的粒子数与时间都有限，从未把可能的分子组合试完；因此生命不是被定律“算出来”的，而是在未遍历的空间里长出来的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数量级论证（难度：进阶）<\/h3>\n<p>宇宙约 10^17 秒、10^80 个粒子；最小时间单位是普朗克时间 10^-43 秒。若每个粒子每普朗克时间试一种状态，总尝试次数仍远小于可能的蛋白质序列数（20 种氨基酸、长度数百，组合数是天文量级）。<\/p>\n<h3>概念 2：非遍历的含义（难度：高难）<\/h3>\n<p><strong>遍历<\/strong>（ergodic）指系统最终会走遍所有状态。考夫曼指出宇宙不是遍历的：绝大多数组合从未出现，也不会出现。物理定律给的是允许空间，不是实际走过的路径。<\/p>\n<h3>概念 3：机器隐喻的破产（难度：进阶）<\/h3>\n<p>把世界当机器，预设了“初始条件 + 定律 → 全部未来”。非遍历性破坏了这个预设：未来有一部分是历史上从未出现的新组合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;数量级论证&quot;]\n  n2[&quot;非遍历的含义&quot;]\n  n1 --&gt; n2\n  n3[&quot;机器隐喻的破产&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个只玩了百万分之一的棋局：规则固定，但走过的棋路极少。边界：棋盘状态可枚举，分子组合不可枚举。\n<\/li><li>\n<strong>实例<\/strong>：20 种氨基酸、长度 300 的蛋白链，组合数约 20^300 ≈ 10^390；宇宙总尝试次数约 10^80 × 10^17 / 10^-43 ≈ 10^140。两者相差 250 个数量级。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为非遍历性只是“算不过来”——它是原则上没走完，所以结果不能从定律推出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n考夫曼用数量级论证想说明？\n<ul>\n<li>\nA. 宇宙很小\n<\/li><li>\nB. 宇宙远未遍历所有分子组合\n<\/li><li>\nC. 蛋白质不重要\n<\/li><li>\nD. 量子力学错误\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：尝试次数远小于组合数，遍历不成立。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n宇宙非遍历\n<\/li><li>\n定律给允许空间，不给实际路径\n<\/li><li>\n机器隐喻破产\n<\/ul>", "ch02": "<h1>第 2 章：功能的功能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“功能”为什么在物理层面不可预言\n<\/li><li>\n能解释“功能的功能”这一说法\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>功能是相对于“维持某个整体”而言的；物理只能给出结构，不能预言哪个结构会被选中成为功能，因此功能在出现前不可推导。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：功能的定义（难度：进阶）<\/h3>\n<p>一个部件的作用由它在整体中的角色决定：眼睛的功能是看，因为它帮助生物体生存。同样的结构换个整体，功能就变。<\/p>\n<h3>概念 2：不可预言性（难度：高难）<\/h3>\n<p>在眼睛出现前，物理不会告诉你“会有一种器官用于成像”。功能是事后归因，不是事前推导。这就是“功能的功能”：功能本身有层级，且层级在演化中不断新增。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;功能的定义&quot;]\n  n2[&quot;不可预言性&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一把螺丝刀：物理上是一根带扭力的杆，功能上取决于你拿它拧什么。边界：螺丝刀的用途可穷举，生物功能的新层级不行。\n<\/li><li>\n<strong>实例<\/strong>：中耳的三块小骨由鱼的鳃弓演化而来，听觉功能是后来“用上”的。这套结构在鱼身上不是为听声音存在的。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为功能是设计出来的——多数功能是旧结构在新整体中的新角色。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“功能不可预言”的意思是？\n<ul>\n<li>\nA. 功能不存在\n<\/li><li>\nB. 物理不能事前推出哪个结构会成为功能\n<\/li><li>\nC. 功能都一样\n<\/li><li>\nD. 功能由基因决定\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：功能是事后归因，依赖整体与选择。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n功能 = 部件在整体中的角色\n<\/li><li>\n物理给结构，不给功能\n<\/li><li>\n功能层级不断新增\n<\/ul>", "ch03": "<h1>第 3 章：传播组织<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“约束闭合”是什么意思\n<\/li><li>\n能解释为什么生命传播的是组织而非物质\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命传播的不是分子，而是“约束闭合”的组织：一组约束相互维持，使整体持续存在。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：约束闭合（难度：高难）<\/h3>\n<p>蒙特维尔与莫西奥的<strong>约束闭合<\/strong>（constraint closure）：每个约束由其他约束维持，整个集合自我维持。例如细胞膜维持代谢，代谢合成膜脂，形成闭环。<\/p>\n<h3>概念 2：传播组织（难度：进阶）<\/h3>\n<p>繁殖传下去的是这套闭环关系，不只是 DNA。DNA 是模板，但没有膜、酶、能量流，模板什么也做不了。<\/p>\n<h3>概念 3：与物理的区别（难度：高难）<\/h3>\n<p>物理系统可以有关闭的因果环（如反馈），但约束闭合强调“约束”这一层：不是变量在循环，而是维持循环的条件在互相生产。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;约束闭合&quot;]\n  n2[&quot;传播组织&quot;]\n  n1 --&gt; n2\n  n3[&quot;与物理的区别&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家公司：传下去的不是办公室，是“谁给谁供货、谁付谁工资”的关系网。边界：公司可以破产，细胞不能暂停。\n<\/li><li>\n<strong>实例<\/strong>：膜脂由代谢途径合成，代谢酶由膜内环境维持活性，能量由外部梯度供给。三者互为条件，缺一即崩。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“组织”是抽象比喻——它是可操作的结构条件：每个约束都有其他约束支撑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“约束闭合”强调？\n<ul>\n<li>\nA. 变量循环\n<\/li><li>\nB. 约束相互维持形成闭环\n<\/li><li>\nC. 基因决定\n<\/li><li>\nD. 能量守恒\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：闭合的是维持条件，不只是变量。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生命传播组织\n<\/li><li>\n约束闭合 = 互为条件\n<\/li><li>\nDNA 需要膜与代谢才起作用\n<\/ul>", "ch04": "<h1>第 4 章：解密生命<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 DNA 作为“代码”的限度\n<\/li><li>\n能解释为什么“读懂序列”不等于“造出生命”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 是线性序列，按碱基配对复制；但生命是三维的约束闭合系统，序列只是其中一层信息。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：代码层（难度：进阶）<\/h3>\n<p>A-T、C-G 配对使复制可靠；三联体密码把序列映射到氨基酸。这一层确实是“数字”的，可读、可编辑。<\/p>\n<h3>概念 2：代码之外（难度：高难）<\/h3>\n<p>折叠、膜结构、代谢流、空间位置都不在序列里。把 DNA 当全部程序，等于把建筑图纸当建筑。考夫曼据此说：解释生命不能只靠“解密基因组”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;代码层&quot;]\n  n2[&quot;代码之外&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像乐谱与演奏：谱子能复制，但没有乐器、演奏者与 acoustics，音乐不会出现。边界：乐谱不编码演奏者的身体，DNA 也不编码细胞环境。\n<\/li><li>\n<strong>实例<\/strong>：把一条基因转入大肠杆菌能生产胰岛素，前提是宿主细胞提供核糖体、能量与折叠环境。换一个没有这些条件的试管，序列什么也不做。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因组测完就能“造生命”——序列是必要信息，不是充分条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDNA 不能编码的是？\n<ul>\n<li>\nA. 氨基酸序列\n<\/li><li>\nB. 碱基配对\n<\/li><li>\nC. 折叠与代谢环境\n<\/li><li>\nD. 三联体密码\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：三维结构与动态环境不在线性序列里。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDNA = 线性代码层\n<\/li><li>\n生命 = 三维约束闭合\n<\/li><li>\n序列必要不充分\n<\/ul>", "ch05": "<h1>第 5 章：如何制造新陈代谢<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自催化集合如何维持代谢\n<\/li><li>\n能解释能量流在代谢中的位置\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>代谢是一张自催化网络：反应的产物反过来催化生成它的反应；网络靠外部能量梯度驱动，靠约束闭合维持。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：自催化（难度：进阶）<\/h3>\n<p><strong>自催化集合<\/strong>（autocatalytic set）：每个分子的生成至少被集合内另一个分子催化，整体不依赖外部催化剂。考夫曼用随机图论证：当分子种类与反应数超过阈值，自催化集合几乎必然出现。<\/p>\n<h3>概念 2：能量流（难度：进阶）<\/h3>\n<p>自催化只解决“怎么维持结构”，还需要“怎么驱动”。反应物化学能高于产物，能量沿链条下降，外部输入补上顶端。没有能量流，闭环会停。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;自催化&quot;]\n  n2[&quot;能量流&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一支能自己招人的球队：老队员推荐新队员，队伍不靠外部招聘也能维持。边界：球队需要联赛收入，网络需要能量输入。\n<\/li><li>\n<strong>实例<\/strong>：糖酵解途径中，部分中间产物参与调控上游反应；把关键酶去掉，整条链停摆。自催化与能量流两条都要满足。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自催化等于生命——它只是代谢的骨架，还需要膜与遗传机制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自催化集合的关键特征是？\n<ul>\n<li>\nA. 产物催化自身生成\n<\/li><li>\nB. 需要外部催化剂\n<\/li><li>\nC. 不耗能\n<\/li><li>\nD. 只含一种分子\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：闭环催化是定义特征。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n代谢 = 自催化网络\n<\/li><li>\n靠能量梯度驱动\n<\/li><li>\n自催化≠生命\n<\/ul>", "ch06": "<h1>第 6 章：原初细胞<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述原初细胞的干湿循环三步\n<\/li><li>\n能说明为什么膜是先于基因的可能起点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>热泉边的脂质体在干湿交替中反复聚合、分裂，可能先形成能自我维持的膜结构，再容纳代谢与遗传。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三步循环（难度：基础）<\/h3>\n<p>湿润时脂质体是囊泡；近干时聚成胶状；附着矿物干燥时重新组装成多层膜。每一轮都可能把内容物包进去、把膜分裂开。<\/p>\n<h3>概念 2：为什么膜先（难度：进阶）<\/h3>\n<p>膜提供空间边界与浓度梯度，是约束闭合的物理前提。没有边界，自催化网络会被稀释掉。基因可以后到，边界不能缺。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三步循环&quot;]\n  n2[&quot;为什么膜先&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用反复干湿的泥巴捏出小碗：每一轮都留下更规整的形状。边界：泥碗不会自己装进代谢系统，脂质体可能。\n<\/li><li>\n<strong>实例<\/strong>：实验室中用脂质与矿物表面模拟干湿循环，可观察到囊泡的形成、融合与分裂。这是“原初细胞”假说的实验支撑之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为原初细胞一定先有 RNA——膜与代谢可能先行，遗传机制后嵌入。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n原初细胞假说中，膜的作用是？\n<ul>\n<li>\nA. 储存基因\n<\/li><li>\nB. 提供边界与浓度梯度\n<\/li><li>\nC. 提供能量\n<\/li><li>\nD. 传递信号\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：边界是约束闭合的物理前提。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n干湿循环三步\n<\/li><li>\n膜先于基因的可能\n<\/li><li>\n边界是约束闭合前提\n<\/ul>", "ch07": "<h1>第 7 章：可遗传变异<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自催化集体如何产生可遗传变异\n<\/li><li>\n能解释“变异”不必依赖基因突变\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自催化集体在分裂时会把组分分配不匀，产生组成差异；这种差异可被选择，因此遗传与变异可以早于 DNA 出现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分配不均（难度：进阶）<\/h3>\n<p>囊泡分裂时，内部的分子的数量随机分配；某些集体因此获得更有利于维持的组成比例。这就是<strong>组成遗传<\/strong>（compositional heredity）。<\/p>\n<h3>概念 2：选择的作用（难度：进阶）<\/h3>\n<p>更稳定的集体分裂得更久、留下更多后代。选择不需要基因，只需要“复制 + 变异 + 差异生存”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;分配不均&quot;]\n  n2[&quot;选择的作用&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像分汤时每碗料不一样：味道有差异，好喝的会被再做。边界：汤不会自我复制，集体会。\n<\/li><li>\n<strong>实例<\/strong>：实验室中自催化集合在稀释-转移循环里，某些组成比例会逐渐占优。这是“无基因选择”的演示。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为遗传必须靠 DNA——组成比例的传递也能被选择。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“组成遗传”指的是？\n<ul>\n<li>\nA. 基因突变\n<\/li><li>\nB. 分裂时组分分配差异被传递\n<\/li><li>\nC. 水平转移\n<\/li><li>\nD. 染色体交换\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：不必依赖核酸序列。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分裂造成组成差异\n<\/li><li>\n选择只需复制+变异+差异生存\n<\/li><li>\n遗传可早于 DNA\n<\/ul>", "ch08": "<h1>第 8 章：我们玩的游戏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“感觉—评价—行动”三和弦\n<\/li><li>\n能解释情绪为何是最早整合的感觉\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命体的基本循环是：感知世界、评价对自身有利与否、采取行动；情绪是这三步最早整合成一体的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三和弦（难度：进阶）<\/h3>\n<p>考夫曼借用凯瑟琳·考夫曼的说法：<strong>感觉<\/strong>（sense）、<strong>评价<\/strong>（evaluate）、<strong>行动<\/strong>（act）构成一个循环。没有评价，感觉只是输入；没有行动，评价没有后果。<\/p>\n<h3>概念 2：情绪的位置（难度：高难）<\/h3>\n<p>情绪把“对我有利/有害”直接编码成可行动的状态，比符号推理更早。它是价值判断的原型，不是理性的对立面。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三和弦&quot;]\n  n2[&quot;情绪的位置&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像开车时的仪表盘：读油量（感觉）、判断够不够（评价）、决定加油（行动）。边界：仪表盘没有情绪，生物有。\n<\/li><li>\n<strong>实例<\/strong>：遇到捕食者：心率上升（感觉）→ 威胁评估（评价）→ 逃跑（行动）。三步在一个时间窗内耦合，慢一步就死。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为情绪是理性的干扰——它是最早的价值计算装置。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“三和弦”不包括？\n<ul>\n<li>\nA. 感觉\n<\/li><li>\nB. 评价\n<\/li><li>\nC. 行动\n<\/li><li>\nD. 记忆\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：三和弦是感觉-评价-行动的循环。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n感觉-评价-行动\n<\/li><li>\n情绪 = 最早的价值整合\n<\/li><li>\n价值判断先于符号推理\n<\/ul>", "ch09": "<h1>第 9 章：舞台已经搭好了<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“被选择的是生物体而非基因”这一主张\n<\/li><li>\n能解释生态位与新物种的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>选择作用于完整的生物体，基因只是搭车；生态位提供机会，但不导致新物种出现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：选择单位（难度：进阶）<\/h3>\n<p>道金斯式“自私的基因”把基因当选择单位。考夫曼反驳：被选择的是能存活、繁殖、做功的生物体；基因的传播是结果，不是原因。<\/p>\n<h3>概念 2：生态位（难度：基础）<\/h3>\n<p><strong>生态位<\/strong>（niche）是生物在群落中的资源与角色。新生态位出现（如新的食物源），给已有变异提供机会，但不保证新物种出现。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;选择单位&quot;]\n  n2[&quot;生态位&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像剧场先搭好舞台，演员才有地方演：舞台不等于剧本。边界：舞台不会自己写剧本，生态位不会自己造物种。\n<\/li><li>\n<strong>实例<\/strong>：同一基因型在不同环境中表现不同；环境变，选择压变，存活率变。选择作用在表现型上，不在序列上。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因是唯一因果层——表现型与生态位同样是选择的作用面。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n考夫曼认为选择单位是？\n<ul>\n<li>\nA. 基因\n<\/li><li>\nB. 生物体\n<\/li><li>\nC. 种群\n<\/li><li>\nD. 生态位\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：基因是搭车者，生物体被选择。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n选择作用于生物体\n<\/li><li>\n基因是结果不是原因\n<\/li><li>\n生态位给机会不造物种\n<\/ul>", "ch10": "<h1>第 10 章：扩展适应和螺丝刀<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“使之成为可能”与“导致”的区别\n<\/li><li>\n能举一个扩展适应的例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>演化不是“前者导致后者”，而是“前者使后者成为可能”；扩展适应就是旧结构被新用途征用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：enablement vs entailment（难度：高难）<\/h3>\n<p><strong>使之成为可能<\/strong>（enablement）：A 出现后，B 有了可行的路径，但 B 不是 A 的必然结果。<strong>导致<\/strong>（entailment）：B 可由 A 推出。考夫曼主张前者才是演化的真实关系。<\/p>\n<h3>概念 2：扩展适应（难度：进阶）<\/h3>\n<p><strong>扩展适应<\/strong>（exaptation）：为一种功能演化的结构，被另一种功能征用。羽毛先为保温，后为飞行；鱼鳔由肺演化而来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;enablement vs entailment&quot;]\n  n2[&quot;扩展适应&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用螺丝刀撬开罐子：工具没变，用途变了。边界：螺丝刀不会自我复制，器官会。\n<\/li><li>\n<strong>实例<\/strong>：鸟的羽毛：化石显示早期羽毛用于保温与展示，飞行是后来的功能。因果方向是“先有结构，后被征用”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为演化是“为将来做准备”——它只解决当前问题，新用途是事后征用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“使之成为可能”强调的是？\n<ul>\n<li>\nA. 必然导致\n<\/li><li>\nB. 提供可行路径但非必然\n<\/li><li>\nC. 随机\n<\/li><li>\nD. 设计\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它是可能性关系，不是因果决定关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nenablement ≠ entailment\n<\/li><li>\n扩展适应 = 旧结构新用途\n<\/li><li>\n演化不预备未来\n<\/ul>", "ch11": "<h1>第 11 章：物理之外的世界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明经济演化与生物演化的同构关系\n<\/li><li>\n能用“相邻可能”解释增长的不可预测\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>经济像生物圈：每出现一种商品，就把一批新商品变成“相邻可能”；增长不是被算出来的，是被一步步打开的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：相邻可能（难度：高难）<\/h3>\n<p><strong>相邻可能<\/strong>（adjacent possible）：从当前状态出发，下一步可达到的状态集合。它随历史扩大，且新成员会改变下一步的边界。<\/p>\n<h3>概念 2：经济同构（难度：进阶）<\/h3>\n<p>个人电脑使路由器与文件共享成为可能，后者使互联网、电商、搜索成为可能。每一步都不是前一步的必然结果，但都被前一步打开。<\/p>\n<h3>概念 3：理论的缺口（难度：高难）<\/h3>\n<p>主流增长理论把技术当外生变量或用生产函数拟合，无法解释“新商品从哪来”。考夫曼认为需要一种“相邻可能”的经济学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;相邻可能&quot;]\n  n2[&quot;经济同构&quot;]\n  n1 --&gt; n2\n  n3[&quot;理论的缺口&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像爬一棵不断长出新枝的树：你只能爬到已长出的枝上，但爬到之后新枝才出现。边界：树有遗传程序，经济没有。\n<\/li><li>\n<strong>实例<\/strong>：从个人电脑到互联网到电商到移动支付，每一步都依赖前一步的普及，但没有一步能从前一步“推导”出来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为经济增长可以精确预测——相邻可能的新增本身就是不可预测的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“相邻可能”指的是？\n<ul>\n<li>\nA. 所有可能状态\n<\/li><li>\nB. 从当前状态一步可达的状态集合\n<\/li><li>\nC. 未来预测\n<\/li><li>\nD. 随机突变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它随历史扩大，边界由当前状态决定。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相邻可能随历史扩大\n<\/li><li>\n经济与生物同构\n<\/li><li>\n增长不可精确预测\n<\/ul>", "c01": "<h1>相邻可能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 11 章、第 01 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>从当前状态出发，下一步实际可达到的状态集合；它随历史扩大。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是考夫曼解释“新事物如何出现”的核心工具，从分子组合一路用到商品经济。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义三要素：当前状态、可达操作、边界。<\/p>\n<p>扩大机制：每实现一个新状态，边界外移，新的可达集合出现。<\/p>\n<p>不可预测性：下一步依赖当前边界，而边界是历史产物，所以整体路径无法从初始条件推出。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相邻可能等于“所有可能”——它只包含一步可达的部分。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>非遍历<\/td><td>前提<\/td><\/tr><tr><td>ch11<\/td><td>经济<\/td><td>应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n非遍历性、扩展适应\n<\/ul>", "c02": "<h1>约束闭合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 03 章、第 05 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一组约束相互维持，每个约束的存在由其他约束支撑，形成自我维持的闭环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“生命是什么”从物质清单变成组织条件，解释了为什么生命传播的是关系而非分子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三个例子：膜—代谢—能量；自催化网络；原初细胞的干湿循环。<\/p>\n<p>判据：去掉任一约束，闭环断裂。<\/p>\n<p>与反馈的区别：反馈是变量环，约束闭合是“维持条件的环”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为约束闭合是比喻——它是可检验的结构条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>传播组织<\/td><td>定义<\/td><\/tr><tr><td>ch06<\/td><td>原初细胞<\/td><td>实例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n相邻可能、自催化\n<\/ul>", "c03": "<h1>使之成为可能而非导致<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 10 章、第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>前者提供可行路径但不保证结果，后者可由前提必然推出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是考夫曼对抗“物理决定论”的关键区分，也是理解扩展适应与经济演化的钥匙。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>演化：羽毛先保温，后飞行——不是“为飞行而演化”。<\/p>\n<p>经济：PC 使互联网可能，但不是“必然导致互联网”。<\/p>\n<p>方法论含义：解释新事物要给“可能性条件”，不要伪造“必然因果”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“使之成为可能”是软弱解释——它比虚假的必然性更准确。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch10<\/td><td>扩展适应<\/td><td>区分<\/td><\/tr><tr><td>ch11<\/td><td>经济<\/td><td>应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n相邻可能、扩展适应\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：世界不是一台机器<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 世界不是一台机器<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：功能的功能<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 功能的功能<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：传播组织<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 传播组织<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：解密生命<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 解密生命<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：如何制造新陈代谢<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 如何制造新陈代谢<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：原初细胞<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 原初细胞<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：可遗传变异<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 可遗传变异<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：我们玩的游戏<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 我们玩的游戏<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：舞台已经搭好了<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 舞台已经搭好了<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：扩展适应和螺丝刀<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 扩展适应和螺丝刀<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：物理之外的世界<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 物理之外的世界<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q12.<\/b> 考夫曼论证“物理不能推出生命”的核心依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 物理定律错误<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 宇宙非遍历，组合空间远未穷尽<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 生命没有规律<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 实验不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q13.<\/b> “约束闭合”与普通反馈的关键区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 有变量<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 闭合的是维持条件而非仅变量循环<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 需要能量<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 发生在细胞内<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q14.<\/b> 用“相邻可能”解释经济增长，最恰当的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 增长可精确预测<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 新商品把一批新商品变为可能<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 增长靠资本投入<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 技术是外生变量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章 世界不是一台机器<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 考夫曼用数量级论证想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 宇宙很小<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 宇宙远未遍历所有分子组合<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 蛋白质不重要<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 量子力学错误<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章 功能的功能<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “功能不可预言”的意思是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 功能不存在<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 物理不能事前推出哪个结构会成为功能<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 功能都一样<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 功能由基因决定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章 传播组织<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “约束闭合”强调？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 变量循环<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 约束相互维持形成闭环<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 基因决定<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 能量守恒<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章 解密生命<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> DNA 不能编码的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 氨基酸序列<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 碱基配对<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 折叠与代谢环境<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 三联体密码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章 如何制造新陈代谢<\/h1><div class='quiz-item' data-qid='ch05-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自催化集合的关键特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q1' value='0'> 产物催化自身生成<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='1'> 需要外部催化剂<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='2'> 不耗能<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='3'> 只含一种分子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章 原初细胞<\/h1><div class='quiz-item' data-qid='ch06-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 原初细胞假说中，膜的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 储存基因<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> 提供边界与浓度梯度<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> 提供能量<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> 传递信号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章 可遗传变异<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “组成遗传”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 基因突变<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 分裂时组分分配差异被传递<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 水平转移<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 染色体交换<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章 我们玩的游戏<\/h1><div class='quiz-item' data-qid='ch08-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “三和弦”不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q1' value='0'> 感觉<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='1'> 评价<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='2'> 行动<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='3'> 记忆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章 舞台已经搭好了<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 考夫曼认为选择单位是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 基因<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 生物体<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 种群<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 生态位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章 扩展适应和螺丝刀<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “使之成为可能”强调的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 必然导致<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 提供可行路径但非必然<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 随机<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 设计<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章 物理之外的世界<\/h1><div class='quiz-item' data-qid='ch11-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “相邻可能”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1' value='0'> 所有可能状态<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='1'> 从当前状态一步可达的状态集合<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='2'> 未来预测<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='3'> 随机突变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='遍历'>遍历 — 系统最终走遍所有可能状态 <span class=glossary-ref>（第 1 章 世界不是一台机器）<\/span><\/li><li data-term='约束闭合'>约束闭合 — 约束相互维持的自我维持闭环 <span class=glossary-ref>（第 3 章 传播组织）<\/span><\/li><li data-term='自催化集合'>自催化集合 — 产物催化自身生成的分子网络 <span class=glossary-ref>（第 5 章 如何制造新陈代谢）<\/span><\/li><li data-term='原初细胞'>原初细胞 — 干湿循环中形成的膜包被结构 <span class=glossary-ref>（第 6 章 原初细胞）<\/span><\/li><li data-term='组成遗传'>组成遗传 — 分裂时组分差异被传递 <span class=glossary-ref>（第 7 章 可遗传变异）<\/span><\/li><li data-term='三和弦'>三和弦 — 感觉-评价-行动的循环 <span class=glossary-ref>（第 8 章 我们玩的游戏）<\/span><\/li><li data-term='生态位'>生态位 — 物种在群落中的资源与角色 <span class=glossary-ref>（第 9 章 舞台已经搭好了）<\/span><\/li><li data-term='扩展适应'>扩展适应 — 旧结构被新功能征用 <span class=glossary-ref>（第 10 章 扩展适应和螺丝刀）<\/span><\/li><li data-term='相邻可能'>相邻可能 — 从当前状态一步可达的状态集合 <span class=glossary-ref>（第 11 章 物理之外的世界）<\/span><\/li><\/ul>", "__patterns__": "<h1>物理之外的世界 模式与框架库<\/h1>\n<h2>分析框架：新事物出现的三层解释<\/h2>\n<p>①允许层：物理/化学是否允许？②组织层：是否有约束闭合维持它？③历史层：它是否在相邻可能之内？三层都过，才能说“可能出现”；缺一层，就只是想象。<\/p>\n<h2>决策规则：判断因果还是使能<\/h2>\n<p>if 从 A 能推出 B 的具体形式 then 是 entailment else if A 出现后 B 有了可行路径，但形式不确定 then 是 enablement 写解释时不要混用两种句式。<\/p>\n<h2>反模式：把基因组当全部程序<\/h2>\n<p>序列只是线性代码层，折叠、膜、代谢、空间位置都不在序列里。把 DNA 当生命全图，会低估环境与组织。<\/p>\n<h2>反模式：把演化当目的论<\/h2>\n<p>“为了飞行长出羽毛”是倒果为因。演化只回应当前选择压，新功能是事后征用。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>非遍历论证<\/td><td>10^80 粒子 × 10^17 秒 / 10^-43 秒 ≈ 10^140 次尝试<\/td><\/tr><tr><td>蛋白组合数<\/td><td>20^300 ≈ 10^390<\/td><\/tr><tr><td>约束闭合<\/td><td>膜、代谢、能量互为条件<\/td><\/tr><tr><td>自催化阈值<\/td><td>分子种类与反应数超过临界即大概率出现<\/td><\/tr><tr><td>原初细胞<\/td><td>湿润囊泡 → 干燥胶状 → 矿物表面重组<\/td><\/tr><tr><td>三和弦<\/td><td>感觉 → 评价 → 行动<\/td><\/tr><tr><td>扩展适应<\/td><td>羽毛：保温 → 飞行<\/td><\/tr><tr><td>相邻可能<\/td><td>PC → 互联网 → 电商 → 搜索<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
