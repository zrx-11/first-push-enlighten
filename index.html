d": "ch01-q1", "chapterId": "ch01", "type": "single", "question": "考夫曼用数量级论证想说明？", "options": ["宇宙很小", "宇宙远未遍历所有分子组合", "蛋白质不重要", "量子力学错误"], "answer": 1, "explain": "尝试次数远小于组合数，遍历不成立。"}, {"id": "ch02-q1", "chapterId": "ch02", "type": "single", "question": "“功能不可预言”的意思是？", "options": ["功能不存在", "物理不能事前推出哪个结构会成为功能", "功能都一样", "功能由基因决定"], "answer": 1, "explain": "功能是事后归因，依赖整体与选择。"}, {"id": "ch03-q1", "chapterId": "ch03", "type": "single", "question": "“约束闭合”强调？", "options": ["变量循环", "约束相互维持形成闭环", "基因决定", "能量守恒"], "answer": 1, "explain": "闭合的是维持条件，不只是变量。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "DNA 不能编码的是？", "options": ["氨基酸序列", "碱基配对", "折叠与代谢环境", "三联体密码"], "answer": 2, "explain": "三维结构与动态环境不在线性序列里。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "自催化集合的关键特征是？", "options": ["产物催化自身生成", "需要外部催化剂", "不耗能", "只含一种分子"], "answer": 0, "explain": "闭环催化是定义特征。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "原初细胞假说中，膜的作用是？", "options": ["储存基因", "提供边界与浓度梯度", "提供能量", "传递信号"], "answer": 1, "explain": "边界是约束闭合的物理前提。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "“组成遗传”指的是？", "options": ["基因突变", "分裂时组分分配差异被传递", "水平转移", "染色体交换"], "answer": 1, "explain": "不必依赖核酸序列。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "“三和弦”不包括？", "options": ["感觉", "评价", "行动", "记忆"], "answer": 3, "explain": "三和弦是感觉-评价-行动的循环。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "考夫曼认为选择单位是？", "options": ["基因", "生物体", "种群", "生态位"], "answer": 1, "explain": "基因是搭车者，生物体被选择。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "“使之成为可能”强调的是？", "options": ["必然导致", "提供可行路径但非必然", "随机", "设计"], "answer": 1, "explain": "它是可能性关系，不是因果决定关系。"}, {"id": "ch11-q1", "chapterId": "ch11", "type": "single", "question": "“相邻可能”指的是？", "options": ["所有可能状态", "从当前状态一步可达的状态集合", "未来预测", "随机突变"], "answer": 1, "explain": "它随历史扩大，边界由当前状态决定。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "考夫曼论证“物理不能推出生命”的核心依据是？", "options": ["物理定律错误", "宇宙非遍历，组合空间远未穷尽", "生命没有规律", "实验不足"], "answer": 1, "explain": "尝试次数远小于组合数，路径不可从定律推出。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "“约束闭合”与普通反馈的关键区别是？", "options": ["有变量", "闭合的是维持条件而非仅变量循环", "需要能量", "发生在细胞内"], "answer": 1, "explain": "约束互相生产是定义特征。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "用“相邻可能”解释经济增长，最恰当的说法是？", "options": ["增长可精确预测", "新商品把一批新商品变为可能", "增长靠资本投入", "技术是外生变量"], "answer": 1, "explain": "每一步扩大边界，整体路径不可事前推出。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "宇宙的粒子数与时间都有限，从未把可能的分子组合试完；因此生命不是被定律“算出来”的，而是在未遍历的空间里长出来的。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "数量级论证——一句话说清它是什么？", "back": "宇宙约 10^17 秒、10^80 个粒子。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "非遍历的含义——一句话说清它是什么？", "back": "**遍历**（ergodic）指系统最终会走遍所有状态。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "机器隐喻的破产——一句话说清它是什么？", "back": "把世界当机器，预设了“初始条件 + 定律 → 全部未来”。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "功能是相对于“维持某个整体”而言的；物理只能给出结构，不能预言哪个结构会被选中成为功能，因此功能在出现前不可推导。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "功能的定义——一句话说清它是什么？", "back": "一个部件的作用由它在整体中的角色决定：眼睛的功能是看，因为它帮助生物体生存。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "不可预言性——一句话说清它是什么？", "back": "在眼睛出现前，物理不会告诉你“会有一种器官用于成像”。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "生命传播的不是分子，而是“约束闭合”的组织：一组约束相互维持，使整体持续存在。", "tags": ["ch03"]}, {"id": "f009", "chapterId": "ch03", "front": "约束闭合——一句话说清它是什么？", "back": "蒙特维尔与莫西奥的**约束闭合**（constraint closure）：每个约束由其他约束维持，整个集合自我维持。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "传播组织——一句话说清它是什么？", "back": "繁殖传下去的是这套闭环关系，不只是 DNA。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "与物理的区别——一句话说清它是什么？", "back": "物理系统可以有关闭的因果环（如反馈），但约束闭合强调“约束”这一层：不是变量在循环，而是维持循环的条件在互相生产。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "DNA 是线性序列，按碱基配对复制；但生命是三维的约束闭合系统，序列只是其中一层信息。", "tags": ["ch04"]}, {"id": "f013", "chapterId": "ch04", "front": "代码层——一句话说清它是什么？", "back": "A-T、C-G 配对使复制可靠。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "代码之外——一句话说清它是什么？", "back": "折叠、膜结构、代谢流、空间位置都不在序列里。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "代谢是一张自催化网络：反应的产物反过来催化生成它的反应；网络靠外部能量梯度驱动，靠约束闭合维持。", "tags": ["ch05"]}, {"id": "f016", "chapterId": "ch05", "front": "自催化——一句话说清它是什么？", "back": "**自催化集合**（autocatalytic set）：每个分子的生成至少被集合内另一个分子催化，整体不依赖外部催化剂。", "tags": ["ch05"]}, {"id": "f017", "chapterId": "ch05", "front": "能量流——一句话说清它是什么？", "back": "自催化只解决“怎么维持结构”，还需要“怎么驱动”。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "热泉边的脂质体在干湿交替中反复聚合、分裂，可能先形成能自我维持的膜结构，再容纳代谢与遗传。", "tags": ["ch06"]}, {"id": "f019", "chapterId": "ch06", "front": "三步循环——一句话说清它是什么？", "back": "湿润时脂质体是囊泡。", "tags": ["ch06"]}, {"id": "f020", "chapterId": "ch06", "front": "为什么膜先——一句话说清它是什么？", "back": "膜提供空间边界与浓度梯度，是约束闭合的物理前提。", "tags": ["ch06"]}, {"id": "f021", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "自催化集体在分裂时会把组分分配不匀，产生组成差异；这种差异可被选择，因此遗传与变异可以早于 DNA 出现。", "tags": ["ch07"]}, {"id": "f022", "chapterId": "ch07", "front": "分配不均——一句话说清它是什么？", "back": "囊泡分裂时，内部的分子的数量随机分配。", "tags": ["ch07"]}, {"id": "f023", "chapterId": "ch07", "front": "选择的作用——一句话说清它是什么？", "back": "更稳定的集体分裂得更久、留下更多后代。", "tags": ["ch07"]}, {"id": "f024", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "生命体的基本循环是：感知世界、评价对自身有利与否、采取行动；情绪是这三步最早整合成一体的形式。", "tags": ["ch08"]}, {"id": "f025", "chapterId": "ch08", "front": "三和弦——一句话说清它是什么？", "back": "考夫曼借用凯瑟琳·考夫曼的说法：**感觉**（sense）、**评价**（evaluate）、**行动**（act）构成一个循环。", "tags": ["ch08"]}, {"id": "f026", "chapterId": "ch08", "front": "情绪的位置——一句话说清它是什么？", "back": "情绪把“对我有利/有害”直接编码成可行动的状态，比符号推理更早。", "tags": ["ch08"]}, {"id": "f027", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "选择作用于完整的生物体，基因只是搭车；生态位提供机会，但不导致新物种出现。", "tags": ["ch09"]}, {"id": "f028", "chapterId": "ch09", "front": "选择单位——一句话说清它是什么？", "back": "道金斯式“自私的基因”把基因当选择单位。", "tags": ["ch09"]}, {"id": "f029", "chapterId": "ch09", "front": "生态位——一句话说清它是什么？", "back": "**生态位**（niche）是生物在群落中的资源与角色。", "tags": ["ch09"]}, {"id": "f030", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "演化不是“前者导致后者”，而是“前者使后者成为可能”；扩展适应就是旧结构被新用途征用。", "tags": ["ch10"]}, {"id": "f031", "chapterId": "ch10", "front": "enablement vs entailment——一句话说清它是什么？", "back": "**使之成为可能**（enablement）：A 出现后，B 有了可行的路径，但 B 不是 A 的必然结果。", "tags": ["ch10"]}, {"id": "f032", "chapterId": "ch10", "front": "扩展适应——一句话说清它是什么？", "back": "**扩展适应**（exaptation）：为一种功能演化的结构，被另一种功能征用。", "tags": ["ch10"]}, {"id": "f033", "chapterId": "ch11", "front": "第 11 章一句话核心是什么？", "back": "经济像生物圈：每出现一种商品，就把一批新商品变成“相邻可能”；增长不是被算出来的，是被一步步打开的。", "tags": ["ch11"]}, {"id": "f034", "chapterId": "ch11", "front": "相邻可能——一句话说清它是什么？", "back": "**相邻可能**（adjacent possible）：从当前状态出发，下一步可达到的状态集合。", "tags": ["ch11"]}, {"id": "f035", "chapterId": "ch11", "front": "经济同构——一句话说清它是什么？", "back": "个人电脑使路由器与文件共享成为可能，后者使互联网、电商、搜索成为可能。", "tags": ["ch11"]}, {"id": "f036", "chapterId": "ch11", "front": "理论的缺口——一句话说清它是什么？", "back": "主流增长理论把技术当外生变量或用生产函数拟合，无法解释“新商品从哪来”。", "tags": ["ch11"]}], "companion": "world-beyond-physics学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：世界不是一台机器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能算出“宇宙远未遍历所有可能”的数量级论证\n<\/li><li>\n能说明非遍历性如何否证“物理可推出生命”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>宇宙的粒子数与时间都有限，从未把可能的分子组合试完；因此生命不是被定律“算出来”的，而是在未遍历的空间里长出来的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数量级论证（难度：进阶）<\/h3>\n<p>宇宙约 10^17 秒、10^80 个粒子；最小时间单位是普朗克时间 10^-43 秒。若每个粒子每普朗克时间试一种状态，总尝试次数仍远小于可能的蛋白质序列数（20 种氨基酸、长度数百，组合数是天文量级）。<\/p>\n<h3>概念 2：非遍历的含义（难度：高难）<\/h3>\n<p><strong>遍历<\/strong>（ergodic）指系统最终会走遍所有状态。考夫曼指出宇宙不是遍历的：绝大多数组合从未出现，也不会出现。物理定律给的是允许空间，不是实际走过的路径。<\/p>\n<h3>概念 3：机器隐喻的破产（难度：进阶）<\/h3>\n<p>把世界当机器，预设了“初始条件 + 定律 → 全部未来”。非遍历性破坏了这个预设：未来有一部分是历史上从未出现的新组合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;数量级论证&quot;]\n  n2[&quot;非遍历的含义&quot;]\n  n1 --&gt; n2\n  n3[&quot;机器隐喻的破产&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个只玩了百万分之一的棋局：规则固定，但走过的棋路极少。边界：棋盘状态可枚举，分子组合不可枚举。\n<\/li><li>\n<strong>实例<\/strong>：20 种氨基酸、长度 300 的蛋白链，组合数约 20^300 ≈ 10^390；宇宙总尝试次数约 10^80 × 10^17 / 10^-43 ≈ 10^140。两者相差 250 个数量级。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为非遍历性只是“算不过来”——它是原则上没走完，所以结果不能从定律推出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n考夫曼用数量级论证想说明？\n<ul>\n<li>\nA. 宇宙很小\n<\/li><li>\nB. 宇宙远未遍历所有分子组合\n<\/li><li>\nC. 蛋白质不重要\n<\/li><li>\nD. 量子力学错误\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：尝试次数远小于组合数，遍历不成立。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n宇宙非遍历\n<\/li><li>\n定律给允许空间，不给实际路径\n<\/li><li>\n机器隐喻破产\n<\/ul>", "ch02": "<h1>第 2 章：功能的功能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“功能”为什么在物理层面不可预言\n<\/li><li>\n能解释“功能的功能”这一说法\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>功能是相对于“维持某个整体”而言的；物理只能给出结构，不能预言哪个结构会被选中成为功能，因此功能在出现前不可推导。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：功能的定义（难度：进阶）<\/h3>\n<p>一个部件的作用由它在整体中的角色决定：眼睛的功能是看，因为它帮助生物体生存。同样的结构换个整体，功能就变。<\/p>\n<h3>概念 2：不可预言性（难度：高难）<\/h3>\n<p>在眼睛出现前，物理不会告诉你“会有一种器官用于成像”。功能是事后归因，不是事前推导。这就是“功能的功能”：功能本身有层级，且层级在演化中不断新增。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;功能的定义&quot;]\n  n2[&quot;不可预言性&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一把螺丝刀：物理上是一根带扭力的杆，功能上取决于你拿它拧什么。边界：螺丝刀的用途可穷举，生物功能的新层级不行。\n<\/li><li>\n<strong>实例<\/strong>：中耳的三块小骨由鱼的鳃弓演化而来，听觉功能是后来“用上”的。这套结构在鱼身上不是为听声音存在的。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为功能是设计出来的——多数功能是旧结构在新整体中的新角色。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“功能不可预言”的意思是？\n<ul>\n<li>\nA. 功能不存在\n<\/li><li>\nB. 物理不能事前推出哪个结构会成为功能\n<\/li><li>\nC. 功能都一样\n<\/li><li>\nD. 功能由基因决定\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：功能是事后归因，依赖整体与选择。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n功能 = 部件在整体中的角色\n<\/li><li>\n物理给结构，不给功能\n<\/li><li>\n功能层级不断新增\n<\/ul>", "ch03": "<h1>第 3 章：传播组织<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“约束闭合”是什么意思\n<\/li><li>\n能解释为什么生命传播的是组织而非物质\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命传播的不是分子，而是“约束闭合”的组织：一组约束相互维持，使整体持续存在。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：约束闭合（难度：高难）<\/h3>\n<p>蒙特维尔与莫西奥的<strong>约束闭合<\/strong>（constraint closure）：每个约束由其他约束维持，整个集合自我维持。例如细胞膜维持代谢，代谢合成膜脂，形成闭环。<\/p>\n<h3>概念 2：传播组织（难度：进阶）<\/h3>\n<p>繁殖传下去的是这套闭环关系，不只是 DNA。DNA 是模板，但没有膜、酶、能量流，模板什么也做不了。<\/p>\n<h3>概念 3：与物理的区别（难度：高难）<\/h3>\n<p>物理系统可以有关闭的因果环（如反馈），但约束闭合强调“约束”这一层：不是变量在循环，而是维持循环的条件在互相生产。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;约束闭合&quot;]\n  n2[&quot;传播组织&quot;]\n  n1 --&gt; n2\n  n3[&quot;与物理的区别&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家公司：传下去的不是办公室，是“谁给谁供货、谁付谁工资”的关系网。边界：公司可以破产，细胞不能暂停。\n<\/li><li>\n<strong>实例<\/strong>：膜脂由代谢途径合成，代谢酶由膜内环境维持活性，能量由外部梯度供给。三者互为条件，缺一即崩。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“组织”是抽象比喻——它是可操作的结构条件：每个约束都有其他约束支撑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“约束闭合”强调？\n<ul>\n<li>\nA. 变量循环\n<\/li><li>\nB. 约束相互维持形成闭环\n<\/li><li>\nC. 基因决定\n<\/li><li>\nD. 能量守恒\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：闭合的是维持条件，不只是变量。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生命传播组织\n<\/li><li>\n约束闭合 = 互为条件\n<\/li><li>\nDNA 需要膜与代谢才起作用\n<\/ul>", "ch04": "<h1>第 4 章：解密生命<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 DNA 作为“代码”的限度\n<\/li><li>\n能解释为什么“读懂序列”不等于“造出生命”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 是线性序列，按碱基配对复制；但生命是三维的约束闭合系统，序列只是其中一层信息。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：代码层（难度：进阶）<\/h3>\n<p>A-T、C-G 配对使复制可靠；三联体密码把序列映射到氨基酸。这一层确实是“数字”的，可读、可编辑。<\/p>\n<h3>概念 2：代码之外（难度：高难）<\/h3>\n<p>折叠、膜结构、代谢流、空间位置都不在序列里。把 DNA 当全部程序，等于把建筑图纸当建筑。考夫曼据此说：解释生命不能只靠“解密基因组”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;代码层&quot;]\n  n2[&quot;代码之外&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像乐谱与演奏：谱子能复制，但没有乐器、演奏者与 acoustics，音乐不会出现。边界：乐谱不编码演奏者的身体，DNA 也不编码细胞环境。\n<\/li><li>\n<strong>实例<\/strong>：把一条基因转入大肠杆菌能生产胰岛素，前提是宿主细胞提供核糖体、能量与折叠环境。换一个没有这些条件的试管，序列什么也不做。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因组测完就能“造生命”——序列是必要信息，不是充分条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDNA 不能编码的是？\n<ul>\n<li>\nA. 氨基酸序列\n<\/li><li>\nB. 碱基配对\n<\/li><li>\nC. 折叠与代谢环境\n<\/li><li>\nD. 三联体密码\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：三维结构与动态环境不在线性序列里。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDNA = 线性代码层\n<\/li><li>\n生命 = 三维约束闭合\n<\/li><li>\n序列必要不充分\n<\/ul>", "ch05": "<h1>第 5 章：如何制造新陈代谢<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自催化集合如何维持代谢\n<\/li><li>\n能解释能量流在代谢中的位置\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>代谢是一张自催化网络：反应的产物反过来催化生成它的反应；网络靠外部能量梯度驱动，靠约束闭合维持。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：自催化（难度：进阶）<\/h3>\n<p><strong>自催化集合<\/strong>（autocatalytic set）：每个分子的生成至少被集合内另一个分子催化，整体不依赖外部催化剂。考夫曼用随机图论证：当分子种类与反应数超过阈值，自催化集合几乎必然出现。<\/p>\n<h3>概念 2：能量流（难度：进阶）<\/h3>\n<p>自催化只解决“怎么维持结构”，还需要“怎么驱动”。反应物化学能高于产物，能量沿链条下降，外部输入补上顶端。没有能量流，闭环会停。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;自催化&quot;]\n  n2[&quot;能量流&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一支能自己招人的球队：老队员推荐新队员，队伍不靠外部招聘也能维持。边界：球队需要联赛收入，网络需要能量输入。\n<\/li><li>\n<strong>实例<\/strong>：糖酵解途径中，部分中间产物参与调控上游反应；把关键酶去掉，整条链停摆。自催化与能量流两条都要满足。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自催化等于生命——它只是代谢的骨架，还需要膜与遗传机制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自催化集合的关键特征是？\n<ul>\n<li>\nA. 产物催化自身生成\n<\/li><li>\nB. 需要外部催化剂\n<\/li><li>\nC. 不耗能\n<\/li><li>\nD. 只含一种分子\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：闭环催化是定义特征。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n代谢 = 自催化网络\n<\/li><li>\n靠能量梯度驱动\n<\/li><li>\n自催化≠生命\n<\/ul>", "ch06": "<h1>第 6 章：原初细胞<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述原初细胞的干湿循环三步\n<\/li><li>\n能说明为什么膜是先于基因的可能起点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>热泉边的脂质体在干湿交替中反复聚合、分裂，可能先形成能自我维持的膜结构，再容纳代谢与遗传。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三步循环（难度：基础）<\/h3>\n<p>湿润时脂质体是囊泡；近干时聚成胶状；附着矿物干燥时重新组装成多层膜。每一轮都可能把内容物包进去、把膜分裂开。<\/p>\n<h3>概念 2：为什么膜先（难度：进阶）<\/h3>\n<p>膜提供空间边界与浓度梯度，是约束闭合的物理前提。没有边界，自催化网络会被稀释掉。基因可以后到，边界不能缺。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三步循环&quot;]\n  n2[&quot;为什么膜先&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用反复干湿的泥巴捏出小碗：每一轮都留下更规整的形状。边界：泥碗不会自己装进代谢系统，脂质体可能。\n<\/li><li>\n<strong>实例<\/strong>：实验室中用脂质与矿物表面模拟干湿循环，可观察到囊泡的形成、融合与分裂。这是“原初细胞”假说的实验支撑之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为原初细胞一定先有 RNA——膜与代谢可能先行，遗传机制后嵌入。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n原初细胞假说中，膜的作用是？\n<ul>\n<li>\nA. 储存基因\n<\/li><li>\nB. 提供边界与浓度梯度\n<\/li><li>\nC. 提供能量\n<\/li><li>\nD. 传递信号\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：边界是约束闭合的物理前提。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n干湿循环三步\n<\/li><li>\n膜先于基因的可能\n<\/li><li>\n边界是约束闭合前提\n<\/ul>", "ch07": "<h1>第 7 章：可遗传变异<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自催化集体如何产生可遗传变异\n<\/li><li>\n能解释“变异”不必依赖基因突变\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自催化集体在分裂时会把组分分配不匀，产生组成差异；这种差异可被选择，因此遗传与变异可以早于 DNA 出现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分配不均（难度：进阶）<\/h3>\n<p>囊泡分裂时，内部的分子的数量随机分配；某些集体因此获得更有利于维持的组成比例。这就是<strong>组成遗传<\/strong>（compositional heredity）。<\/p>\n<h3>概念 2：选择的作用（难度：进阶）<\/h3>\n<p>更稳定的集体分裂得更久、留下更多后代。选择不需要基因，只需要“复制 + 变异 + 差异生存”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;分配不均&quot;]\n  n2[&quot;选择的作用&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像分汤时每碗料不一样：味道有差异，好喝的会被再做。边界：汤不会自我复制，集体会。\n<\/li><li>\n<strong>实例<\/strong>：实验室中自催化集合在稀释-转移循环里，某些组成比例会逐渐占优。这是“无基因选择”的演示。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为遗传必须靠 DNA——组成比例的传递也能被选择。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“组成遗传”指的是？\n<ul>\n<li>\nA. 基因突变\n<\/li><li>\nB. 分裂时组分分配差异被传递\n<\/li><li>\nC. 水平转移\n<\/li><li>\nD. 染色体交换\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：不必依赖核酸序列。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分裂造成组成差异\n<\/li><li>\n选择只需复制+变异+差异生存\n<\/li><li>\n遗传可早于 DNA\n<\/ul>", "ch08": "<h1>第 8 章：我们玩的游戏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“感觉—评价—行动”三和弦\n<\/li><li>\n能解释情绪为何是最早整合的感觉\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命体的基本循环是：感知世界、评价对自身有利与否、采取行动；情绪是这三步最早整合成一体的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三和弦（难度：进阶）<\/h3>\n<p>考夫曼借用凯瑟琳·考夫曼的说法：<strong>感觉<\/strong>（sense）、<strong>评价<\/strong>（evaluate）、<strong>行动<\/strong>（act）构成一个循环。没有评价，感觉只是输入；没有行动，评价没有后果。<\/p>\n<h3>概念 2：情绪的位置（难度：高难）<\/h3>\n<p>情绪把“对我有利/有害”直接编码成可行动的状态，比符号推理更早。它是价值判断的原型，不是理性的对立面。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三和弦&quot;]\n  n2[&quot;情绪的位置&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像开车时的仪表盘：读油量（感觉）、判断够不够（评价）、决定加油（行动）。边界：仪表盘没有情绪，生物有。\n<\/li><li>\n<strong>实例<\/strong>：遇到捕食者：心率上升（感觉）→ 威胁评估（评价）→ 逃跑（行动）。三步在一个时间窗内耦合，慢一步就死。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为情绪是理性的干扰——它是最早的价值计算装置。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“三和弦”不包括？\n<ul>\n<li>\nA. 感觉\n<\/li><li>\nB. 评价\n<\/li><li>\nC. 行动\n<\/li><li>\nD. 记忆\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：三和弦是感觉-评价-行动的循环。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n感觉-评价-行动\n<\/li><li>\n情绪 = 最早的价值整合\n<\/li><li>\n价值判断先于符号推理\n<\/ul>", "ch09": "<h1>第 9 章：舞台已经搭好了<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“被选择的是生物体而非基因”这一主张\n<\/li><li>\n能解释生态位与新物种的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>选择作用于完整的生物体，基因只是搭车；生态位提供机会，但不导致新物种出现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：选择单位（难度：进阶）<\/h3>\n<p>道金斯式“自私的基因”把基因当选择单位。考夫曼反驳：被选择的是能存活、繁殖、做功的生物体；基因的传播是结果，不是原因。<\/p>\n<h3>概念 2：生态位（难度：基础）<\/h3>\n<p><strong>生态位<\/strong>（niche）是生物在群落中的资源与角色。新生态位出现（如新的食物源），给已有变异提供机会，但不保证新物种出现。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;选择单位&quot;]\n  n2[&quot;生态位&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像剧场先搭好舞台，演员才有地方演：舞台不等于剧本。边界：舞台不会自己写剧本，生态位不会自己造物种。\n<\/li><li>\n<strong>实例<\/strong>：同一基因型在不同环境中表现不同；环境变，选择压变，存活率变。选择作用在表现型上，不在序列上。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因是唯一因果层——表现型与生态位同样是选择的作用面。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n考夫曼认为选择单位是？\n<ul>\n<li>\nA. 基因\n<\/li><li>\nB. 生物体\n<\/li><li>\nC. 种群\n<\/li><li>\nD. 生态位\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：基因是搭车者，生物体被选择。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n选择作用于生物体\n<\/li><li>\n基因是结果不是原因\n<\/li><li>\n生态位给机会不造物种\n<\/ul>", "ch10": "<h1>第 10 章：扩展适应和螺丝刀<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“使之成为可能”与“导致”的区别\n<\/li><li>\n能举一个扩展适应的例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>演化不是“前者导致后者”，而是“前者使后者成为可能”；扩展适应就是旧结构被新用途征用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：enablement vs entailment（难度：高难）<\/h3>\n<p><strong>使之成为可能<\/strong>（enablement）：A 出现后，B 有了可行的路径，但 B 不是 A 的必然结果。<strong>导致<\/strong>（entailment）：B 可由 A 推出。考夫曼主张前者才是演化的真实关系。<\/p>\n<h3>概念 2：扩展适应（难度：进阶）<\/h3>\n<p><strong>扩展适应<\/strong>（exaptation）：为一种功能演化的结构，被另一种功能征用。羽毛先为保温，后为飞行；鱼鳔由肺演化而来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;enablement vs entailment&quot;]\n  n2[&quot;扩展适应&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用螺丝刀撬开罐子：工具没变，用途变了。边界：螺丝刀不会自我复制，器官会。\n<\/li><li>\n<strong>实例<\/strong>：鸟的羽毛：化石显示早期羽毛用于保温与展示，飞行是后来的功能。因果方向是“先有结构，后被征用”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为演化是“为将来做准备”——它只解决当前问题，新用途是事后征用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“使之成为可能”强调的是？\n<ul>\n<li>\nA. 必然导致\n<\/li><li>\nB. 提供可行路径但非必然\n<\/li><li>\nC. 随机\n<\/li><li>\nD. 设计\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它是可能性关系，不是因果决定关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nenablement ≠ entailment\n<\/li><li>\n扩展适应 = 旧结构新用途\n<\/li><li>\n演化不预备未来\n<\/ul>", "ch11": "<h1>第 11 章：物理之外的世界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明经济演化与生物演化的同构关系\n<\/li><li>\n能用“相邻可能”解释增长的不可预测\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>经济像生物圈：每出现一种商品，就把一批新商品变成“相邻可能”；增长不是被算出来的，是被一步步打开的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：相邻可能（难度：高难）<\/h3>\n<p><strong>相邻可能<\/strong>（adjacent possible）：从当前状态出发，下一步可达到的状态集合。它随历史扩大，且新成员会改变下一步的边界。<\/p>\n<h3>概念 2：经济同构（难度：进阶）<\/h3>\n<p>个人电脑使路由器与文件共享成为可能，后者使互联网、电商、搜索成为可能。每一步都不是前一步的必然结果，但都被前一步打开。<\/p>\n<h3>概念 3：理论的缺口（难度：高难）<\/h3>\n<p>主流增长理论把技术当外生变量或用生产函数拟合，无法解释“新商品从哪来”。考夫曼认为需要一种“相邻可能”的经济学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;相邻可能&quot;]\n  n2[&quot;经济同构&quot;]\n  n1 --&gt; n2\n  n3[&quot;理论的缺口&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像爬一棵不断长出新枝的树：你只能爬到已长出的枝上，但爬到之后新枝才出现。边界：树有遗传程序，经济没有。\n<\/li><li>\n<strong>实例<\/strong>：从个人电脑到互联网到电商到移动支付，每一步都依赖前一步的普及，但没有一步能从前一步“推导”出来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为经济增长可以精确预测——相邻可能的新增本身就是不可预测的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“相邻可能”指的是？\n<ul>\n<li>\nA. 所有可能状态\n<\/li><li>\nB. 从当前状态一步可达的状态集合\n<\/li><li>\nC. 未来预测\n<\/li><li>\nD. 随机突变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它随历史扩大，边界由当前状态决定。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相邻可能随历史扩大\n<\/li><li>\n经济与生物同构\n<\/li><li>\n增长不可精确预测\n<\/ul>", "c01": "<h1>相邻可能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 11 章、第 01 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>从当前状态出发，下一步实际可达到的状态集合；它随历史扩大。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是考夫曼解释“新事物如何出现”的核心工具，从分子组合一路用到商品经济。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义三要素：当前状态、可达操作、边界。<\/p>\n<p>扩大机制：每实现一个新状态，边界外移，新的可达集合出现。<\/p>\n<p>不可预测性：下一步依赖当前边界，而边界是历史产物，所以整体路径无法从初始条件推出。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相邻可能等于“所有可能”——它只包含一步可达的部分。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>非遍历<\/td><td>前提<\/td><\/tr><tr><td>ch11<\/td><td>经济<\/td><td>应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n非遍历性、扩展适应\n<\/ul>", "c02": "<h1>约束闭合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 03 章、第 05 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一组约束相互维持，每个约束的存在由其他约束支撑，形成自我维持的闭环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“生命是什么”从物质清单变成组织条件，解释了为什么生命传播的是关系而非分子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三个例子：膜—代谢—能量；自催化网络；原初细胞的干湿循环。<\/p>\n<p>判据：去掉任一约束，闭环断裂。<\/p>\n<p>与反馈的区别：反馈是变量环，约束闭合是“维持条件的环”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为约束闭合是比喻——它是可检验的结构条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>传播组织<\/td><td>定义<\/td><\/tr><tr><td>ch06<\/td><td>原初细胞<\/td><td>实例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n相邻可能、自催化\n<\/ul>", "c03": "<h1>使之成为可能而非导致<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 10 章、第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>前者提供可行路径但不保证结果，后者可由前提必然推出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是考夫曼对抗“物理决定论”的关键区分，也是理解扩展适应与经济演化的钥匙。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>演化：羽毛先保温，后飞行——不是“为飞行而演化”。<\/p>\n<p>经济：PC 使互联网可能，但不是“必然导致互联网”。<\/p>\n<p>方法论含义：解释新事物要给“可能性条件”，不要伪造“必然因果”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“使之成为可能”是软弱解释——它比虚假的必然性更准确。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch10<\/td><td>扩展适应<\/td><td>区分<\/td><\/tr><tr><td>ch11<\/td><td>经济<\/td><td>应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n相邻可能、扩展适应\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：世界不是一台机器<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch01\">第 1 章 世界不是一台机器<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：功能的功能<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch02\">第 2 章 功能的功能<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：传播组织<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch03\">第 3 章 传播组织<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：解密生命<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch04\">第 4 章 解密生命<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：如何制造新陈代谢<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch05\">第 5 章 如何制造新陈代谢<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：原初细胞<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch06\">第 6 章 原初细胞<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：可遗传变异<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch07\">第 7 章 可遗传变异<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：我们玩的游戏<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch08\">第 8 章 我们玩的游戏<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：舞台已经搭好了<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch09\">第 9 章 舞台已经搭好了<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：扩展适应和螺丝刀<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch10\">第 10 章 扩展适应和螺丝刀<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：物理之外的世界<\/strong><br>阅读：<a href=\"#/book/world-beyond-physics/chapter/ch11\">第 11 章 物理之外的世界<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章 世界不是一台机器<\/h2><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 考夫曼用数量级论证想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 宇宙很小<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 宇宙远未遍历所有分子组合<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 蛋白质不重要<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 量子力学错误<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章 功能的功能<\/h2><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “功能不可预言”的意思是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 功能不存在<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 物理不能事前推出哪个结构会成为功能<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 功能都一样<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 功能由基因决定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章 传播组织<\/h2><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “约束闭合”强调？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 变量循环<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 约束相互维持形成闭环<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 基因决定<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3 组成遗传 — 分裂时组分差异被传递 <span class=glossary-ref>（第 7 章 可遗传变异）<\/span><\/li><li data-term='三和弦'>三和弦 — 感觉-评价-行动的循环 <span class=glossary-ref>（第 8 章 我们玩的游戏）<\/span><\/li><li data-term='生态位'>生态位 — 物种在群落中的资源与角色 <span class=glossary-ref>（第 9 章 舞台已经搭好了）<\/span><\/li><li data-term='扩展适应'>扩展适应 — 旧结构被新功能征用 <span class=glossary-ref>（第 10 章 扩展适应和螺丝刀）<\/span><\/li><li data-term='相邻可能'>相邻可能 — 从当前状态一步可达的状态集合 <span class=glossary-ref>（第 11 章 物理之外的世界）<\/span><\/li><\/ul>", "__patterns__": "<h1>物理之外的世界 模式与框架库<\/h1>\n<h2>分析框架：新事物出现的三层解释<\/h2>\n<p>①允许层：物理/化学是否允许？②组织层：是否有约束闭合维持它？③历史层：它是否在相邻可能之内？三层都过，才能说“可能出现”；缺一层，就只是想象。<\/p>\n<h2>决策规则：判断因果还是使能<\/h2>\n<p>if 从 A 能推出 B 的具体形式 then 是 entailment else if A 出现后 B 有了可行路径，但形式不确定 then 是 enablement 写解释时不要混用两种句式。<\/p>\n<h2>反模式：把基因组当全部程序<\/h2>\n<p>序列只是线性代码层，折叠、膜、代谢、空间位置都不在序列里。把 DNA 当生命全图，会低估环境与组织。<\/p>\n<h2>反模式：把演化当目的论<\/h2>\n<p>“为了飞行长出羽毛”是倒果为因。演化只回应当前选择压，新功能是事后征用。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>非遍历论证<\/td><td>10^80 粒子 × 10^17 秒 / 10^-43 秒 ≈ 10^140 次尝试<\/td><\/tr><tr><td>蛋白组合数<\/td><td>20^300 ≈ 10^390<\/td><\/tr><tr><td>约束闭合<\/td><td>膜、代谢、能量互为条件<\/td><\/tr><tr><td>自催化阈值<\/td><td>分子种类与反应数超过临界即大概率出现<\/td><\/tr><tr><td>原初细胞<\/td><td>湿润囊泡 → 干燥胶状 → 矿物表面重组<\/td><\/tr><tr><td>三和弦<\/td><td>感觉 → 评价 → 行动<\/td><\/tr><tr><td>扩展适应<\/td><td>羽毛：保温 → 飞行<\/td><\/tr><tr><td>相邻可能<\/td><td>PC → 互联网 → 电商 → 搜索<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 世界不是一台机器", "href": "#/chapter/ch01"}, {"label": "第 2 章 功能的功能", "href": "#/chapter/ch02"}, {"label": "第 3 章 传播组织", "href": "#/chapter/ch03"}, {"label": "第 4 章 解密生命", "href": "#/chapter/ch04"}, {"label": "第 5 章 如何制造新陈代谢", "href": "#/chapter/ch05"}, {"label": "第 6 章 原初细胞", "href": "#/chapter/ch06"}, {"label": "第 7 章 可遗传变异", "href": "#/chapter/ch07"}, {"label": "第 8 章 我们玩的游戏", "href": "#/chapter/ch08"}, {"label": "第 9 章 舞台已经搭好了", "href": "#/chapter/ch09"}, {"label": "第 10 章 plain": "孤立系统的熵不减；开放系统可局部降熵。"}, {"id": "ch04-q2", "chapterId": "ch04", "type": "single", "question": "时间箭头的来源是？", "options": ["基本方程不可逆", "统计上熵大的状态占绝对多数", "人的错觉", "引力"], "answer": 1, "explain": "宏观方向来自统计，而非微观定律。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "周期表的排列依据是？", "options": ["颜色", "原子序数与电子结构", "密度", "熔点"], "answer": 1, "explain": "电子结构决定族与周期性。"}, {"id": "ch05-q2", "chapterId": "ch05", "type": "single", "question": "化学性质主要由什么决定？", "options": ["原子核质量", "最外层电子", "中子数", "颜色"], "answer": 1, "explain": "成键与反应涉及外层电子。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "诺特定理连接的是？", "options": ["对称与守恒", "能量与温度", "质量与引力", "熵与时间"], "answer": 0, "explain": "连续对称对应守恒量。"}, {"id": "ch06-q2", "chapterId": "ch06", "type": "single", "question": "对称操作的定义是？", "options": ["看起来漂亮", "使对象保持不变的变换", "左右相同", "重复图案"], "answer": 1, "explain": "核心是“变换下不变”。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "量子化的含义是？", "options": ["能量连续", "能量以最小份额成块交换", "粒子不可分", "波粒二象"], "answer": 1, "explain": "分立份额是核心。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "不确定性原理说的是？", "options": ["仪器精度不足", "共轭量不能同时精确", "测量会改变结果", "粒子会消失"], "answer": 1, "explain": "这是原理性限制。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "宇宙膨胀的直接证据是？", "options": ["红移与距离成正比", "恒星颜色", "行星轨道", "潮汐"], "answer": 0, "explain": "哈勃定律是核心证据。"}, {"id": "ch08-q2", "chapterId": "ch08", "type": "single", "question": "大爆炸的正确理解是？", "options": ["在空间某点炸开", "空间本身从高温高密状态膨胀", "星系互相撞击", "恒星爆炸"], "answer": 1, "explain": "没有中心，膨胀处处发生。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "狭义相对论的出发点是？", "options": ["光速不变", "绝对时间", "以太存在", "引力是力"], "answer": 0, "explain": "光速不变迫使时空相对化。"}, {"id": "ch09-q2", "chapterId": "ch09", "type": "single", "question": "广义相对论中引力的本质是？", "options": ["超距作用", "时空弯曲", "电磁力", "弱力"], "answer": 1, "explain": "物体沿弯曲时空的短程线运动。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "哥德尔不完备定理说的是？", "options": ["数学全错", "足够强的系统中存在不可判定的真命题", "所有命题都可证", "数学依赖实验"], "answer": 1, "explain": "可证性有边界，不是全错。"}, {"id": "ch10-q2", "chapterId": "ch10", "type": "single", "question": "“不可思议的有效性”指的是？", "options": ["数学太难", "纯粹数学常能精确描述物理", "物理不需要数学", "数学不可靠"], "answer": 1, "explain": "维格纳的困惑：为何抽象工具如此适配。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "下列哪一组概念回答的是“变化往哪走”？", "options": ["能量与动量", "熵与时间箭头", "原子与周期表", "对称与群"], "answer": 1, "explain": "熵增给出宏观方向。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "诺特定理说明？", "options": ["对称是美学", "连续对称对应守恒定律", "能量不守恒", "量子不确定"], "answer": 1, "explain": "对称性是守恒量的来源。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "哥德尔定理限制的是？", "options": ["实验精度", "形式系统的可证性", "光速", "熵增"], "answer": 1, "explain": "它限定形式化的边界，不是否定数学。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "复杂性不需要设计者：变异提供材料，选择保留有效者，累积起来就是适应。进化的方向是“当时有效”，不是“越来越好”。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "从神话到机制——一句话说清它是什么？", "back": "各文明都有生命起源的神话：骨灰长出葡萄、牙齿长出玉米。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "三要素——一句话说清它是什么？", "back": "**变异**（个体差异）、**遗传**（差异可传递）、**选择**（差异影响存活与繁殖）。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "复杂性的累积——一句话说清它是什么？", "back": "每一步只要求“比上一代稍微有效”，不要求“最优”。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "DNA 双螺旋把遗传从“神秘的力量”变成“可读的序列 + 可复制的化学”，生物学由此获得像物理一样的机制解释。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "孟德尔的遗产——一句话说清它是什么？", "back": "孟德尔用豌豆杂交发现分离与自由组合定律：性状由成对的“因子”决定，可隐可显。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "双螺旋——一句话说清它是什么？", "back": "沃森与克里克的结构模型给出两条关键：碱基配对（A-T、C-G）保证复制精确。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch02", "front": "理性化——一句话说清它是什么？", "back": "在此之前，遗传是“黑箱”。", "tags": ["ch02"]}, {"id": "f009", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "能量是把各种变化（运动、热、化学、电）换算成同一单位的工具；守恒定律说总量不变，变化只是形式转换。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "从亚里士多德到力学——一句话说清它是什么？", "back": "亚里士多德用“空气漩涡推动箭”解释飞行，两千年后被牛顿的惯性定律取代。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "可通约性——一句话说清它是什么？", "back": "焦耳测出机械功与热的换算关系（1 卡 ≈ 4.18 焦），把“热”与“做功”接到同一把尺子上。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch03", "front": "守恒的边界——一句话说清它是什么？", "back": "封闭系统的总能量不变。", "tags": ["ch03"]}, {"id": "f013", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "熵是能量分散程度的度量；孤立系统的熵不会减少，因此变化有方向——这就是时间箭头的物理来源。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "蒸汽机——一句话说清它是什么？", "back": "蒸汽机把热转为功，效率受冷热两端温差限制。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "分散度——一句话说清它是什么？", "back": "熵可理解为“能量分布在多少种方式上”。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch04", "front": "时间箭头——一句话说清它是什么？", "back": "微观方程大多时间可逆，但宏观演化偏向熵增。", "tags": ["ch04"]}, {"id": "f017", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "物质由有限种类的原子组成，原子的电子结构决定化学性质；周期表把这种结构排成可预测的图。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "从元素到原子——一句话说清它是什么？", "back": "古希腊的四元素、中国的五行都是定性分类。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "电子结构——一句话说清它是什么？", "back": "化学性质主要由最外层电子决定。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch05", "front": "解释力——一句话说清它是什么？", "back": "原子论的价值在于：把无穷多种物质还原为有限种原子的组合，把化学从分类学变成结构学。", "tags": ["ch05"]}, {"id": "f021", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "对称不是“好看”，而是“某种变换下不变”；每一种连续对称都对应一条守恒定律。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "对称操作——一句话说清它是什么？", "back": "球体绕任意轴转任意角度都不变，因此对称性最高。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "诺特定理——一句话说清它是什么？", "back": "**诺特定理**（Noether's theorem）：时间平移对称 → 能量守恒。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch06", "front": "美的量化——一句话说清它是什么？", "back": "对称度可用“不变变换的数量”衡量。", "tags": ["ch06"]}, {"id": "f025", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "微观世界的能量与状态是分立的（量子化），位置与动量不能同时精确（不确定性）；这两条把复杂的连续图像简化成可数的状态。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "量子化——一句话说清它是什么？", "back": "能量以普朗克常数为单位成块交换。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "不确定性——一句话说清它是什么？", "back": "位置与动量的不确定度乘积有下限（ħ/2）。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch07", "front": "简化——一句话说清它是什么？", "back": "分立状态让计算变得可数：原子只有有限个能级，分子只有有限种振动模式。", "tags": ["ch07"]}, {"id": "f029", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "星系越远退行越快，说明宇宙在膨胀；把时间反推，得到一个高温高密的起点，这就是大爆炸的含义。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "望远镜扩大宇宙——一句话说清它是什么？", "back": "赫歇尔把“磨盘状星团”的宇宙扩大到远超想象。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "膨胀——一句话说清它是什么？", "back": "哈勃定律：退行速度与距离成正比。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch08", "front": "大爆炸的含义——一句话说清它是什么？", "back": "它不是“在已有空间里炸开”，而是空间本身从高温高密状态膨胀。", "tags": ["ch08"]}, {"id": "f033", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "光速不变迫使时间与空间成为相对的；引力不是力，而是质量-能量让时空弯曲，物体沿弯曲时空的短程线运动。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "绝对时空的崩塌——一句话说清它是什么？", "back": "伽利略变换假设时间绝对、长度不变。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "弯曲时空——一句话说清它是什么？", "back": "质量-能量弯曲时空，物体自由运动沿**短程线**（geodesic）。", "tags": ["ch09"]}, {"id": "f036", "chapterId": "ch09", "front": "舞台变成演员——一句话说清它是什么？", "back": "在牛顿力学里，时空是背景。", "tags": ["ch09"]}, {"id": "f037", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "任何足够强的形式系统都存在无法在系统内证明的真命题；数学的可靠性有边界，但它对自然的描述力又超出预期。", "tags": ["ch10"]}, {"id": "f038", "chapterId": "ch10", "front": "不完备——一句话说清它是什么？", "back": "**哥德尔不完备定理**（Gödel's incompleteness theorems）：足够强、可递归公理化的系统中，存在既不能证明也不能否证的命题。", "tags": ["ch10"]}, {"id": "f039", "chapterId": "ch10", "front": "理性的边界——一句话说清它是什么？", "back": "这不是“数学错了”，而是“形式化有极限”。", "tags": ["ch10"]}, {"id": "f040", "chapterId": "ch10", "front": "有效性之谜——一句话说清它是什么？", "back": "为什么为纯粹好奇发明的数学，几十年后能精确描述物理？维格纳称之为“不可思议的有效性”。", "tags": ["ch10"]}], "companion": "galileos-finger学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：进化：复杂性的萌芽<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自然选择如何在不设目标的情况下产生复杂性\n<\/li><li>\n能指出“进化=进步”这一说法的错误\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂性不需要设计者：变异提供材料，选择保留有效者，累积起来就是适应。进化的方向是“当时有效”，不是“越来越好”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从神话到机制（难度：基础）<\/h3>\n<p>各文明都有生命起源的神话：骨灰长出葡萄、牙齿长出玉米。这些解释的共同点是“用已知的东西类比未知”。达尔文的贡献不是提出“变化”，而是给出一个不需要意图的机制。<\/p>\n<h3>概念 2：三要素（难度：进阶）<\/h3>\n<p><strong>变异<\/strong>（个体差异）、<strong>遗传<\/strong>（差异可传递）、<strong>选择<\/strong>（差异影响存活与繁殖）。三者同时成立，种群就会改变。缺任一项，进化停摆。<\/p>\n<h3>概念 3：复杂性的累积（难度：进阶）<\/h3>\n<p>每一步只要求“比上一代稍微有效”，不要求“最优”。复杂器官是无数次小改进的叠加，不是一次跳跃。这也是为什么进化会产生“能用但笨拙”的结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从神话到机制&quot;]\n  n2[&quot;三要素&quot;]\n  n1 --&gt; n2\n  n3[&quot;复杂性的累积&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像没有设计师的桥梁：每代工匠只改一处，能过河就保留，几百年后结构复杂得看不出起点。边界：工匠有意图，选择没有。\n<\/li><li>\n<strong>实例<\/strong>：细菌在抗生素压力下，耐药突变被保留；停药后耐药株可能因代价高而减少。同一机制，方向随环境翻转。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为进化等于进步——它只保证“当前环境下的繁殖成功”，不保证更复杂或更聪明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自然选择的三要素不包括？\n<ul>\n<li>\nA. 变异\n<\/li><li>\nB. 遗传\n<\/li><li>\nC. 选择\n<\/li><li>\nD. 设计\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：选择无需设计者。\n<\/li><li>\n进化产生笨拙结构的原因是？\n<\/li><li>\nA. 设计失误\n<\/li><li>\nB. 每步只需局部有效，不追求最优\n<\/li><li>\nC. 基因太少\n<\/li><li>\nD. 环境不变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：局部改进的累积会留下历史包袱。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n变异+遗传+选择\n<\/li><li>\n方向是局部有效\n<\/li><li>\n复杂性靠累积\n<\/ul>", "ch02": "<h1>第 2 章：DNA：生物学的理性化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明孟德尔定律与 DNA 结构的关系\n<\/li><li>\n能解释“生物学理性化”指什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 双螺旋把遗传从“神秘的力量”变成“可读的序列 + 可复制的化学”，生物学由此获得像物理一样的机制解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：孟德尔的遗产（难度：基础）<\/h3>\n<p>孟德尔用豌豆杂交发现分离与自由组合定律：性状由成对的“因子”决定，可隐可显。他的工作是统计的，不是分子的。<\/p>\n<h3>概念 2：双螺旋（难度：进阶）<\/h3>\n<p>沃森与克里克的结构模型给出两条关键：碱基配对（A-T、C-G）保证复制精确；磷酸-糖骨架保证序列稳定。结构一确定，复制、转录、突变的机制都能接上。<\/p>\n<h3>概念 3：理性化（难度：进阶）<\/h3>\n<p>在此之前，遗传是“黑箱”；之后，每个遗传现象都能追到序列层面的操作。这不是说生物学变成物理，而是它有了可拆解、可干预的机制层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;孟德尔的遗产&quot;]\n  n2[&quot;双螺旋&quot;]\n  n1 --&gt; n2\n  n3[&quot;理性化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把口传的族谱变成可扫描的档案：原先只能看结果，现在能查每一条记录。边界：档案会丢失，DNA 也会突变。\n<\/li><li>\n<strong>实例<\/strong>：镰状细胞贫血：一个碱基替换导致谷氨酸变缬氨酸，蛋白聚合，红细胞变形。一个字母的改变，整条表型链改变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因决定一切——序列提供可能，表达依赖环境与调控。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDNA 结构解决的两个核心问题是？\n<ul>\n<li>\nA. 复制与序列稳定\n<\/li><li>\nB. 能量与熵\n<\/li><li>\nC. 对称与守恒\n<\/li><li>\nD. 波长与频率\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：配对保证复制，骨架保证稳定。\n<\/li><li>\n“生物学理性化”指的是？\n<\/li><li>\nA. 生物学变成数学\n<\/li><li>\nB. 遗传现象可追到分子机制\n<\/li><li>\nC. 放弃实验\n<\/li><li>\nD. 只研究DNA\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：黑箱变成可拆解的机制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n孟德尔：统计层\n<\/li><li>\n双螺旋：分子层\n<\/li><li>\n一个碱基可改变表型\n<\/ul>", "ch03": "<h1>第 3 章：能量：计量的普遍化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明能量守恒的内容与边界\n<\/li><li>\n能指出“能量”为什么是可通约的\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>能量是把各种变化（运动、热、化学、电）换算成同一单位的工具；守恒定律说总量不变，变化只是形式转换。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从亚里士多德到力学（难度：基础）<\/h3>\n<p>亚里士多德用“空气漩涡推动箭”解释飞行，两千年后被牛顿的惯性定律取代。阿特金斯用这个例子说明：错误的理论往往也能“解释”，但经不起定量检验。<\/p>\n<h3>概念 2：可通约性（难度：进阶）<\/h3>\n<p>焦耳测出机械功与热的换算关系（1 卡 ≈ 4.18 焦），把“热”与“做功”接到同一把尺子上。<strong>能量<\/strong>（energy）因此成为跨领域的通货。<\/p>\n<h3>概念 3：守恒的边界（难度：进阶）<\/h3>\n<p>封闭系统的总能量不变；开放系统可以交换。说“消耗能量”其实不准确，能量只是转成了不易利用的形式（见下一章熵）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从亚里士多德到力学&quot;]\n  n2[&quot;可通约性&quot;]\n  n1 --&gt; n2\n  n3[&quot;守恒的边界&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把不同货币换成同一单位记账：不是钱变多了，是账能算了。边界：汇率会变，能量换算系数是固定的。\n<\/li><li>\n<strong>实例<\/strong>：把 1 千克物体举高 1 米，约需 9.8 焦；把 1 克水升温 1 摄氏度，约需 4.18 焦。两个完全不同的过程，可用同一单位比较。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“消耗能量”是能量消失——它转成了热、声、形变等分散形式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n能量概念的核心作用是？\n<ul>\n<li>\nA. 制造能量\n<\/li><li>\nB. 把不同形式的变化换算成同一单位\n<\/li><li>\nC. 解释引力\n<\/li><li>\nD. 测量温度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可通约是它的方法论价值。\n<\/li><li>\n“消耗能量”更准确的说法是？\n<\/li><li>\nA. 能量消失\n<\/li><li>\nB. 能量转为不易利用的形式\n<\/li><li>\nC. 能量变成质量\n<\/li><li>\nD. 能量被存储\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：总量守恒，可用性下降。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n能量 = 变化的通货\n<\/li><li>\n焦耳换算：1 卡≈4.18 焦\n<\/li><li>\n消耗 = 降级，不是消失\n<\/ul>", "ch04": "<h1>第 4 章：熵：变化发生的源泉<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明熵增原理的内容\n<\/li><li>\n能解释为什么熵增给了时间方向\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>熵是能量分散程度的度量；孤立系统的熵不会减少，因此变化有方向——这就是时间箭头的物理来源。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：蒸汽机（难度：基础）<\/h3>\n<p>蒸汽机把热转为功，效率受冷热两端温差限制。卡诺与克劳修斯从这台机器里抽出<strong>熵<\/strong>（entropy）：可用的能量在每次转换中都会减少一部分。<\/p>\n<h3>概念 2：分散度（难度：进阶）<\/h3>\n<p>熵可理解为“能量分布在多少种方式上”。方式越多，熵越大。一杯热水与室温空气最终同温，是因为热量分散的方式变多了。<\/p>\n<h3>概念 3：时间箭头（难度：进阶）<\/h3>\n<p>微观方程大多时间可逆，但宏观演化偏向熵增。<strong>时间箭头<\/strong>（arrow of time）不是基本定律，而是统计结论：从低熵初始态出发，熵大的状态数目远多于熵小的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;蒸汽机&quot;]\n  n2[&quot;分散度&quot;]\n  n1 --&gt; n2\n  n3[&quot;时间箭头&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一副新牌越洗越乱：洗牌规则可逆，但“乱”的方式远多于“有序”。边界：牌可以按规则复原，孤立系统的熵不会自发下降。\n<\/li><li>\n<strong>实例<\/strong>：把墨水滴进水里会扩散，不会自发聚回一滴。扩散后分子排列方式的数量远大于聚集态，因此熵增。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增意味着“宇宙必然混乱到死”——局部可以变得更有序，只要整体熵增（生命就是这样的局部）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n熵增原理适用于？\n<ul>\n<li>\nA. 所有系统\n<\/li><li>\nB. 孤立系统\n<\/li><li>\nC. 生命体\n<\/li><li>\nD. 发动机\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：孤立系统的熵不减；开放系统可局部降熵。\n<\/li><li>\n时间箭头的来源是？\n<\/li><li>\nA. 基本方程不可逆\n<\/li><li>\nB. 统计上熵大的状态占绝对多数\n<\/li><li>\nC. 人的错觉\n<\/li><li>\nD. 引力\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：宏观方向来自统计，而非微观定律。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n熵 = 能量分散度\n<\/li><li>\n孤立系统熵不减\n<\/li><li>\n时间箭头是统计结论\n<\/ul>", "ch05": "<h1>第 5 章：原子：物质的产生<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明周期表按什么排列\n<\/li><li>\n能解释“原子论”为什么是解释而非描述\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>物质由有限种类的原子组成，原子的电子结构决定化学性质；周期表把这种结构排成可预测的图。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从元素到原子（难度：基础）<\/h3>\n<p>古希腊的四元素、中国的五行都是定性分类。道尔顿把“元素”变成有重量的原子，门捷列夫按原子量排列，留下空格并预言未知元素。<\/p>\n<h3>概念 2：电子结构（难度：进阶）<\/h3>\n<p>化学性质主要由最外层电子决定。同一族元素最外层电子数相同，因此性质相似。周期表的“列”比“行”更能解释化学。<\/p>\n<h3>概念 3：解释力（难度：进阶）<\/h3>\n<p>原子论的价值在于：把无穷多种物质还原为有限种原子的组合，把化学从分类学变成结构学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从元素到原子&quot;]\n  n2[&quot;电子结构&quot;]\n  n1 --&gt; n2\n  n3[&quot;解释力&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用有限字母拼出无限单词：26 个字母，词库无限。边界：字母不随语境变形，原子会成键。\n<\/li><li>\n<strong>实例<\/strong>：钠（最外层 1 个电子）与氯（最外层 7 个电子）结合成食盐；同族的钾与溴行为类似。周期性由此可预测。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为周期表只是分类表——它按电子结构排列，能预测未发现元素的性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n周期表的排列依据是？\n<ul>\n<li>\nA. 颜色\n<\/li><li>\nB. 原子序数与电子结构\n<\/li><li>\nC. 密度\n<\/li><li>\nD. 熔点\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：电子结构决定族与周期性。\n<\/li><li>\n化学性质主要由什么决定？\n<\/li><li>\nA. 原子核质量\n<\/li><li>\nB. 最外层电子\n<\/li><li>\nC. 中子数\n<\/li><li>\nD. 颜色\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：成键与反应涉及外层电子。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有限原子，无限组合\n<\/li><li>\n周期表按电子结构\n<\/li><li>\n同族性质相似\n<\/ul>", "ch06": "<h1>第 6 章：对称：美的量化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明对称操作的定义\n<\/li><li>\n能解释对称与守恒定律的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对称不是“好看”，而是“某种变换下不变”；每一种连续对称都对应一条守恒定律。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：对称操作（难度：进阶）<\/h3>\n<p>球体绕任意轴转任意角度都不变，因此对称性最高；正方形只能转 90 度倍数。<strong>对称操作<\/strong>（symmetry operation）就是使对象不变的那些变换。<\/p>\n<h3>概念 2：诺特定理（难度：高难）<\/h3>\n<p><strong>诺特定理<\/strong>（Noether&#x27;s theorem）：时间平移对称 → 能量守恒；空间平移对称 → 动量守恒；旋转对称 → 角动量守恒。守恒定律不是经验巧合，而是对称性的数学结果。<\/p>\n<h3>概念 3：美的量化（难度：进阶）<\/h3>\n<p>对称度可用“不变变换的数量”衡量。这给了“美”一个可计算的定义，也解释了物理学家为何偏爱对称的理论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;对称操作&quot;]\n  n2[&quot;诺特定理&quot;]\n  n1 --&gt; n2\n  n3[&quot;美的量化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一面能照出所有角度的镜子：转多少度都看不出差别，就叫对称。边界：镜子只反射外观，物理对称还涉及定律形式。\n<\/li><li>\n<strong>实例<\/strong>：晶体只能有 2、3、4、6 重旋转对称，不能有 5 重——这是晶格平移周期的数学限制。准晶的发现打破了这条“规律”，并因此获得诺贝尔奖。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对称只是美学问题——它决定了哪些守恒量存在。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n诺特定理连接的是？\n<ul>\n<li>\nA. 对称与守恒\n<\/li><li>\nB. 能量与温度\n<\/li><li>\nC. 质量与引力\n<\/li><li>\nD. 熵与时间\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：连续对称对应守恒量。\n<\/li><li>\n对称操作的定义是？\n<\/li><li>\nA. 看起来漂亮\n<\/li><li>\nB. 使对象保持不变的变换\n<\/li><li>\nC. 左右相同\n<\/li><li>\nD. 重复图案\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：核心是“变换下不变”。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n对称 = 变换下不变\n<\/li><li>\n诺特定理：对称→守恒\n<\/li><li>\n对称度可计量\n<\/ul>", "ch07": "<h1>第 7 章：量子：认识的简化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明量子化与不确定性的含义\n<\/li><li>\n能解释量子力学为何“简化”了认识\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>微观世界的能量与状态是分立的（量子化），位置与动量不能同时精确（不确定性）；这两条把复杂的连续图像简化成可数的状态。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：量子化（难度：进阶）<\/h3>\n<p>能量以普朗克常数为单位成块交换。原子只能处在特定能级，光谱线因此是分立的。<strong>量子<\/strong>（quantum）就是不可再分的最小份额。<\/p>\n<h3>概念 2：不确定性（难度：高难）<\/h3>\n<p>位置与动量的不确定度乘积有下限（ħ/2）。这不是仪器不够好，而是共轭量在原理上不能同时确定。<\/p>\n<h3>概念 3：简化（难度：进阶）<\/h3>\n<p>分立状态让计算变得可数：原子只有有限个能级，分子只有有限种振动模式。复杂系统因此能被离散化处理，半导体、激光、核磁共振都由此而来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;量子化&quot;]\n  n2[&quot;不确定性&quot;]\n  n1 --&gt; n2\n  n3[&quot;简化&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像楼梯而不是斜坡：只能站在某一级，不能停在半空。边界：楼梯的级是固定的，量子态还可能是叠加。\n<\/li><li>\n<strong>实例<\/strong>：氢原子光谱的巴尔末系波长可按能级差算出，与观测吻合。分立的线，是量子化最直接的证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不确定性是“测不准因为仪器差”——它是原理性的共轭量限制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n量子化的含义是？\n<ul>\n<li>\nA. 能量连续\n<\/li><li>\nB. 能量以最小份额成块交换\n<\/li><li>\nC. 粒子不可分\n<\/li><li>\nD. 波粒二象\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：分立份额是核心。\n<\/li><li>\n不确定性原理说的是？\n<\/li><li>\nA. 仪器精度不足\n<\/li><li>\nB. 共轭量不能同时精确\n<\/li><li>\nC. 测量会改变结果\n<\/li><li>\nD. 粒子会消失\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是原理性限制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n能量成块\n<\/li><li>\n共轭量不可同时精确\n<\/li><li>\n分立使计算可数\n<\/ul>", "ch08": "<h1>第 8 章：宇宙：真实的纵览<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明宇宙膨胀的证据\n<\/li><li>\n能指出“大爆炸”不是“在空间中爆炸”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>星系越远退行越快，说明宇宙在膨胀；把时间反推，得到一个高温高密的起点，这就是大爆炸的含义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：望远镜扩大宇宙（难度：基础）<\/h3>\n<p>赫歇尔把“磨盘状星团”的宇宙扩大到远超想象；哈勃在 1920 年代测出星系距离与红移的关系，宇宙尺度再次改写。<\/p>\n<h3>概念 2：膨胀（难度：进阶）<\/h3>\n<p>哈勃定律：退行速度与距离成正比。<strong>红移<\/strong>（redshift）是光被拉长的结果，说明星系在远离。没有中心，每一点都看到同样的远离。<\/p>\n<h3>概念 3：大爆炸的含义（难度：进阶）<\/h3>\n<p>它不是“在已有空间里炸开”，而是空间本身从高温高密状态膨胀。宇宙微波背景是这一状态留下的余温。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;望远镜扩大宇宙&quot;]\n  n2[&quot;膨胀&quot;]\n  n1 --&gt; n2\n  n3[&quot;大爆炸的含义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像葡萄干面包在烤箱里发起来：每颗葡萄干都看到别人远离，没有中心。边界：面包有外部空间，宇宙没有。\n<\/li><li>\n<strong>实例<\/strong>：哈勃常数约 70 km/s/Mpc；距离每增加 1 百万秒差距，退行速度增加约 70 公里/秒。这个线性关系是膨胀的直接证据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大爆炸有一个“爆炸中心”——膨胀发生在每一点，没有中心。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n宇宙膨胀的直接证据是？\n<ul>\n<li>\nA. 红移与距离成正比\n<\/li><li>\nB. 恒星颜色\n<\/li><li>\nC. 行星轨道\n<\/li><li>\nD. 潮汐\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：哈勃定律是核心证据。\n<\/li><li>\n大爆炸的正确理解是？\n<\/li><li>\nA. 在空间某点炸开\n<\/li><li>\nB. 空间本身从高温高密状态膨胀\n<\/li><li>\nC. 星系互相撞击\n<\/li><li>\nD. 恒星爆炸\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：没有中心，膨胀处处发生。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n红移-距离线性关系\n<\/li><li>\n无中心的膨胀\n<\/li><li>\nCMB 是余温\n<\/ul>", "ch09": "<h1>第 9 章：时空：互作用的舞台<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明相对论为什么必须放弃绝对时空\n<\/li><li>\n能解释“引力是时空弯曲”的意思\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>光速不变迫使时间与空间成为相对的；引力不是力，而是质量-能量让时空弯曲，物体沿弯曲时空的短程线运动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：绝对时空的崩塌（难度：进阶）<\/h3>\n<p>伽利略变换假设时间绝对、长度不变；但迈克耳孙-莫雷实验显示光速不随观察者运动改变。爱因斯坦选择保留光速不变，放弃绝对同时性。<\/p>\n<h3>概念 2：弯曲时空（难度：高难）<\/h3>\n<p>质量-能量弯曲时空，物体自由运动沿<strong>短程线<\/strong>（geodesic）。水星近日点进动、光线偏折、引力红移都是这一几何的图像。<\/p>\n<h3>概念 3：舞台变成演员（难度：进阶）<\/h3>\n<p>在牛顿力学里，时空是背景；在广义相对论里，时空参与相互作用，会被物质改变，也会反过来影响物质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;绝对时空的崩塌&quot;]\n  n2[&quot;弯曲时空&quot;]\n  n1 --&gt; n2\n  n3[&quot;舞台变成演员&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像在蹦床上放一个重球：床面凹陷，旁边的小球沿着凹陷滚过去。边界：蹦床是二维弹性膜，时空是四维流形。\n<\/li><li>\n<strong>实例<\/strong>：水星近日点每百年多进动约 43 角秒，牛顿理论算不出，广义相对论算得正好。一个数字定胜负。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相对论说“一切都是相对的”——光速与物理定律的形式恰恰是不变的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n狭义相对论的出发点是？\n<ul>\n<li>\nA. 光速不变\n<\/li><li>\nB. 绝对时间\n<\/li><li>\nC. 以太存在\n<\/li><li>\nD. 引力是力\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：光速不变迫使时空相对化。\n<\/li><li>\n广义相对论中引力的本质是？\n<\/li><li>\nA. 超距作用\n<\/li><li>\nB. 时空弯曲\n<\/li><li>\nC. 电磁力\n<\/li><li>\nD. 弱力\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：物体沿弯曲时空的短程线运动。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n光速不变 → 时空相对\n<\/li><li>\n引力 = 时空弯曲\n<\/li><li>\n时空从背景变成参与者\n<\/ul>", "ch10": "<h1>第 10 章：数学：理性的局限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明哥德尔不完备定理的内容\n<\/li><li>\n能解释“数学有效得不可思议”这一困惑\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>任何足够强的形式系统都存在无法在系统内证明的真命题；数学的可靠性有边界，但它对自然的描述力又超出预期。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：不完备（难度：高难）<\/h3>\n<p><strong>哥德尔不完备定理<\/strong>（Gödel&#x27;s incompleteness theorems）：足够强、可递归公理化的系统中，存在既不能证明也不能否证的命题；系统也无法在内部证明自身一致性。<\/p>\n<h3>概念 2：理性的边界（难度：进阶）<\/h3>\n<p>这不是“数学错了”，而是“形式化有极限”。罗素说“数学是我们不知道自己在说什么的学科”，讲的正是形式系统与意义之间的缝隙。<\/p>\n<h3>概念 3：有效性之谜（难度：高难）<\/h3>\n<p>为什么为纯粹好奇发明的数学，几十年后能精确描述物理？维格纳称之为“不可思议的有效性”。阿特金斯的态度是：这是经验事实，没有最终解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;不完备&quot;]\n  n2[&quot;理性的边界&quot;]\n  n1 --&gt; n2\n  n3[&quot;有效性之谜&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一张地图画得再细，也画不出“这张地图本身”：系统无法把自己完整装进自己。边界：地图可以另画一张，数学系统不能跳出自身。\n<\/li><li>\n<strong>实例<\/strong>：把“本句不可证”编码进算术，就得到一个真但不可证的命题。这是不完备定理的直观版本。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不完备定理否定了数学——它限定的是形式系统的能力，不是数学的价值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔不完备定理说的是？\n<ul>\n<li>\nA. 数学全错\n<\/li><li>\nB. 足够强的系统中存在不可判定的真命题\n<\/li><li>\nC. 所有命题都可证\n<\/li><li>\nD. 数学依赖实验\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可证性有边界，不是全错。\n<\/li><li>\n“不可思议的有效性”指的是？\n<\/li><li>\nA. 数学太难\n<\/li><li>\nB. 纯粹数学常能精确描述物理\n<\/li><li>\nC. 物理不需要数学\n<\/li><li>\nD. 数学不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：维格纳的困惑：为何抽象工具如此适配。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n不完备：可证性有边界\n<\/li><li>\n一致性不能在内部证明\n<\/li><li>\n数学有效性仍是谜\n<\/ul>", "c01": "<h1>能量与熵：一对方向相反的概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能量管“有多少、怎么转换”，熵管“往哪个方向、还能用多少”。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“变化”拆成两个独立问题：守恒与方向。缺任一条，热机、生命、宇宙都讲不通。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>能量：封闭系统总量不变，形式可变。<\/p>\n<p>熵：孤立系统不减，可用能减少。<\/p>\n<p>合起来：能量守恒告诉你“不会凭空产生”，熵增告诉你“不能全部回收”。<\/p>\n<p>生命是开放系统：局部降熵，整体增熵。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增与能量守恒矛盾——一个管总量，一个管可用性。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>能量<\/td><td>守恒<\/td><\/tr><tr><td>ch04<\/td><td>熵<\/td><td>方向<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n时间箭头、热机\n<\/ul>", "c02": "<h1>对称与守恒<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一种连续对称变换对应一条守恒定律。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“物理定律为什么长这样”从经验总结变成结构必然，也是现代理论构造的指导原则。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>时间平移 → 能量守恒。<\/p>\n<p>空间平移 → 动量守恒。<\/p>\n<p>旋转 → 角动量守恒。<\/p>\n<p>方法：想找守恒量，先找系统的对称性；想破坏守恒，就引入显式破缺。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对称只是视觉概念——它是定律层面的结构。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>对称<\/td><td>诺特定理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n能量与熵、量子\n<\/ul>", "c03": "<h1>抽象阶梯<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 03 章、第 05 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>科学进步常表现为换一层更抽象的表述，让原本不可比的现象变得可算。<\/p>\n<h2>为什么重要<\/h2>\n<p>阿特金斯全书的方法：能量把运动与热统一，原子把无穷物质还原为有限元素，数学把规律形式化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>第一层：现象描述（热、颜色、运动）。<\/p>\n<p>第二层：可通约的量（能量、原子量、频率）。<\/p>\n<p>第三层：形式结构（守恒律、对称群、公理系统）。<\/p>\n<p>每上一层，解释力增强，直观性下降。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为抽象就是远离现实——抽象是把不同现实接到同一把尺子上。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>能量<\/td><td>可通约<\/td><\/tr><tr><td>ch05<\/td><td>原子<\/td><td>还原<\/td><\/tr><tr><td>ch10<\/td><td>数学<\/td><td>形式化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n对称与守恒、数学的边界\n<\/ul>", "__path__": "< 链结构 <span class=glossary-ref>（第 2 章 DNA：生物学的理性化）<\/span><\/li><li data-term='能量'>能量 — 不同形式变化的统一度量 <span class=glossary-ref>（第 3 章 能量：计量的普遍化）<\/span><\/li><li data-term='熵'>熵 — 能量分散程度与不可用性的度量 <span class=glossary-ref>（第 4 章 熵：变化发生的源泉）<\/span><\/li><li data-term='时间箭头'>时间箭头 — 宏观演化偏向熵增的方向 <span class=glossary-ref>（第 4 章 熵：变化发生的源泉）<\/span><\/li><li data-term='周期表'>周期表 — 按原子序数与电子结构排列的元素表 <span class=glossary-ref>（第 5 章 原子：物质的产生）<\/span><\/li><li data-term='对称操作'>对称操作 — 使对象保持不变的变换 <span class=glossary-ref>（第 6 章 对称：美的量化）<\/span><\/li><li data-term='诺特定理'>诺特定理 — 连续对称对应守恒定律 <span class=glossary-ref>（第 6 章 对称：美的量化）<\/span><\/li><li data-term='量子化'>量子化 — 能量与状态取分立值 <span class=glossary-ref>（第 7 章 量子：认识的简化）<\/span><\/li><li data-term='不确定性原理'>不确定性原理 — 共轭量不能同时精确 <span class=glossary-ref>（第 7 章 量子：认识的简化）<\/span><\/li><li data-term='红移'>红移 — 光被拉长、频率降低 <span class=glossary-ref>（第 8 章 宇宙：真实的纵览）<\/span><\/li><li data-term='短程线'>短程线 — 弯曲时空中最长的固有时路径 <span class=glossary-ref>（第 9 章 时空：互作用的舞台）<\/span><\/li><li data-term='不完备定理'>不完备定理 — 足够强系统中存在不可判定命题 <span class=glossary-ref>（第 10 章 数学：理性的局限）<\/span><\/li><\/ul>", "__patterns__": "<h1>伽利略的手指 模式与框架库<\/h1>\n<h2>分析框架：十根手指的串联<\/h2>\n<p>问四个问题把十章串起来：①复杂性从哪来（进化、DNA）？②变化靠什么驱动、往哪走（能量、熵）？③物质由什么构成、受什么约束（原子、对称、量子）？④大尺度与理性的边界在哪（宇宙、时空、数学）？四问能恢复全书骨架。<\/p>\n<h2>决策规则：遇到“新理论解释旧现象”<\/h2>\n<p>if 新理论给出可定量检验的差异 then 用观测裁决（如水星进动 43 角秒） else if 只给出定性重述 then 视为哲学重构，不是科学替代<\/p>\n<h2>反模式：把熵增当成“宇宙末日”<\/h2>\n<p>熵增只约束孤立系统；开放系统可以局部降熵。生命、城市、文明都是靠能量流维持的低熵岛。<\/p>\n<h2>反模式：把对称当装饰<\/h2>\n<p>对称在物理中是守恒的来源。只谈“对称很美”而不谈守恒量，是把结构降格为外观。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>十支柱<\/td><td>进化 / DNA / 能量 / 熵 / 原子 / 对称 / 量子 / 宇宙 / 时空 / 数学<\/td><\/tr><tr><td>1 卡<\/td><td>≈ 4.18 焦<\/td><\/tr><tr><td>诺特对应<\/td><td>时间→能量，空间→动量，旋转→角动量<\/td><\/tr><tr><td>哈勃定律<\/td><td>v = H d，H≈70 km/s/Mpc<\/td><\/tr><tr><td>水星进动<\/td><td>每百年约 43 角秒<\/td><\/tr><tr><td>不确定性<\/td><td>Δx·Δp ≥ ħ/2<\/td><\/tr><tr><td>不完备<\/td><td>强系统内有不可判定命题<\/td><\/tr><tr><td>晶体对称<\/td><td>只能 2、3、4、6 重（准晶例外）<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 进化：复杂性的萌芽", "href": "#/chapter/ch01"}, {"label": "第 2 章 DNA：生物学的理性化", "href": "#/chapter/ch02"}, {"label": "第 3 章 能量：计量的普遍化", "href": "#/chapter/ch03"}, {"label": "第 4 章 熵：变化发生的源泉", "href": "#/chapter/ch04"}, {"label": "第 5 章 原子：物质的产生", "href": "#/chapter/ch05"}, {"label": "第 6 章 对称：美的量化", "href": "#/chapter/ch06"}, {"label": "第 7 章 量子：认识的简化", "href": "#/chapter/ch07"}, {"label": "第 8 章 宇宙：真实的纵览", "href": "#/chapter/ch08"}, {"label": "第 9 章 时空：互作用的舞台", "href": "#/chapter/ch09"}, {"label": "第 10 章 数学：理性的局限", "href": "#/chapter/ch10"}]}, {"label": "概念", "children": [{"label": "能量与熵：一对方向相反的概念", "href": "#/concept/c01"}, {"label": "对称与守恒", "href": "#/concept/c02"}, {"label": "抽象阶梯", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 进化：复杂性的萌芽", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 DNA：生物学的理性化", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 能量：计量的普遍化", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 熵：变化发生的源泉", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 原子：物质的产生", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 对称：美的量化", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 量子：认识的简化", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 宇宙：真实的纵览", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 时空：互作用的舞台", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 数学：理性的局限", "href": "#/quiz/ch10"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true, "ch06": true, "ch07": true, "ch08": true, "ch09": true, "ch10": true}},"four-dimensional-travel":{"manifest": {"slug": "four-dimensional-travel", "title": "四维旅行", "subtitle": "普瓦德万：空间与时间里的十二个谜", "book": {"title": "四维旅行", "author"
