可行", "纠缠不存在"], "answer": 1, "explain": "结果排除局域隐变量，保留非局域性或非实在性。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "彭罗斯认为时间箭头的根源是？", "options": ["人类记忆", "宇宙极低熵的初始条件", "量子随机", "相对论效应"], "answer": 1, "explain": "初始条件是熵增得以发生的前提。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "韦尔曲率假说的内容是？", "options": ["初始奇点韦尔曲率为零", "宇宙在收缩", "引力不存在", "熵恒为常数"], "answer": 0, "explain": "早期几何极整齐，物质熵可高，从而解释引力为何不混乱。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "黑洞熵正比于？", "options": ["质量", "视界面积", "体积", "温度"], "answer": 1, "explain": "面积律是量子引力研究的重要线索。"}, {"id": "ch08-q2", "chapterId": "ch08", "type": "single", "question": "彭罗斯希望量子引力顺带解释？", "options": ["宇宙膨胀", "波函数坍缩", "电磁力", "生命起源"], "answer": 1, "explain": "客观还原猜想把坍缩与引力能差联系起来。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "突触在神经系统中主要作用是？", "options": ["产生能量", "连接神经元并调节信号强度", "存储 DNA", "维持体温"], "answer": 1, "explain": "突触强度可塑，是学习的关键位点。"}, {"id": "ch09-q2", "chapterId": "ch09", "type": "single", "question": "彭罗斯对连接主义的态度是？", "options": ["完全支持", "承认其能力，但仍属算法过程", "认为它比符号 AI 差", "认为它无需训练"], "answer": 1, "explain": "权重调整仍是算法，因此不解决非算法论证。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "“感受质”指的是？", "options": ["神经放电频率", "主观体验的质的特征", "记忆容量", "量子叠加"], "answer": 1, "explain": "如红色的“红”，无法用物理量完全描述。"}, {"id": "ch10-q2", "chapterId": "ch10", "type": "single", "question": "Orch OR 中“OR”指？", "options": ["有序排列", "客观还原", "光学共振", "开放系统"], "answer": 1, "explain": "objective reduction，引力驱动的波函数坍缩。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "若有人主张“只要模型足够大、行为足够像人，它就一定有意识”，彭罗斯最直接的回应是？", "options": ["模型还不够大", "行为等效不蕴含语义与感受质，且算法无法解释洞察", "意识可以测量", "需要更多数据"], "answer": 1, "explain": "这正是强 AI 立场，彭罗斯用中文房间与非算法论证反驳。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "彭罗斯论证中最容易被攻击的前提是？", "options": ["哥德尔定理成立", "人能看到任意系统的哥德尔句", "图灵机存在", "光速不变"], "answer": 1, "explain": "“人对所有系统都能看出”依赖理想化，是批评集中处。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "把 Orch OR 写进科普文章时，最恰当的表述是？", "options": ["意识就是微管中的量子坍缩", "一个待检验的猜想：微管相干 + 引力驱动的客观还原", "已被实验证实", "与量子力学无关"], "answer": 1, "explain": "它缺乏实验支持，必须标注为猜想。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "争论的焦点不是机器会不会算，而是“按规则运算”这件事本身能不能产生“感觉像什么”的经验；彭罗斯认为不能，而这需要论证而不是直觉。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "三种立场——一句话说清它是什么？", "back": "**强 AI**：只要程序足够好，运行它的机器就真的有理解与意识。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "中文房间：符号操作与理解——一句话说清它是什么？", "back": "塞尔设想：一个不懂中文的人关在屋里，按一本规则手册把中文符号拼成回答递出去。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "彭罗斯为什么不服——一句话说清它是什么？", "back": "他认为塞尔的反驳依赖直觉，而直觉可以被“系统整体有理解”这类说法绕开。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "算法是有限、确定、机械的步骤；图灵机把这种步骤形式化，通用图灵机则说明“一台机器可以模拟任何机器”——这正是“计算等价于算法”的技术基础。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "算法：欧几里得的最大公约数——一句话说清它是什么？", "back": "求 21 与 15 的最大公约数：21 除 15 余 6。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "图灵机与通用性——一句话说清它是什么？", "back": "图灵机用纸带存数据、读写头按规则表操作、内部状态有限。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch02", "front": "不可计算：算法的边界——一句话说清它是什么？", "back": "停机问题说明存在算法无法判定的事。", "tags": ["ch02"]}, {"id": "f009", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "数学对象不是人编出来的约定，而是独立存在的实在；我们通过“看出”它们的性质来发现真理，这种看出不是照着规则算。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "曼德博集：规则极简，边界无限复杂——一句话说清它是什么？", "back": "从 z=0 开始反复做 z→z²+c，看序列是否有界，有界的 c 涂黑。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "复数为什么“不自然”却真实——一句话说清它是什么？", "back": "复数由 i²=−1 引入，看似人为。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch03", "front": "三种世界的三角——一句话说清它是什么？", "back": "物理世界、数学世界、精神世界两两相连：物理世界由数学描述，精神能接触数学真理，数学又约束物理。", "tags": ["ch03"]}, {"id": "f013", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "对任何足够强的一致形式系统，人总能看出“这句在本系统中不可证”是真的，而系统本身证不出它；因此人的洞察不能被任何一个固定系统（也就是任何算法）所包含。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "形式系统与哥德尔句——一句话说清它是什么？", "back": "把数学写成符号游戏：公理 + 推理规则。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "彭罗斯的转身——一句话说清它是什么？", "back": "哥德尔的结果本身只是限制机器。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch04", "front": "反驳与再反驳——一句话说清它是什么？", "back": "常见反驳：人可能出错、人也只是另一台机器、需要的系统可以逐级扩充。", "tags": ["ch04"]}, {"id": "f017", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "经典物理把世界写成场与时空的几何：麦克斯韦方程让光成为电磁波，相对论则说明空间与时间不是绝对的背景，而是彼此耦合的舞台。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "麦克斯韦：把光收进电磁——一句话说清它是什么？", "back": "变化的电场生磁场，变化的磁场生电场，二者互相激发形成波，传播速度由两个常数算出，恰好等于光速。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "相对论：同时性是约定——一句话说清它是什么？", "back": "**狭义相对论**的两条公设：物理规律在所有惯性系相同、光速不变。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch05", "front": "相空间：把状态画成点——一句话说清它是什么？", "back": "一个系统的所有可能状态构成**相空间**，系统演化就是相空间里的一条轨迹。", "tags": ["ch05"]}, {"id": "f021", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "量子力学的计算极其成功，但它对“测量时发生了什么”没有公认答案：叠加、坍缩、纠缠三件事放在一起，就逼出了哲学难题。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "叠加与测量——一句话说清它是什么？", "back": "**叠加**（superposition，白话：一个系统同时处于多个可能状态，直到被测量）。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "EPR 与贝尔——一句话说清它是什么？", "back": "爱因斯坦等人提出 EPR 论证：若两个粒子纠缠，测量一个立刻确定另一个，似乎需要“超距作用”，因此量子力学不完备。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch06", "front": "几种解释——一句话说清它是什么？", "back": "哥本哈根：测量就是边界，不问过程。", "tags": ["ch06"]}, {"id": "f025", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "时间有方向，是因为宇宙从一个极特殊的低熵初始状态出发；这个特殊性不能由现有物理定律解释，彭罗斯把它归因于时空几何的初始约束。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "三种箭头——一句话说清它是什么？", "back": "热力学箭头：熵增。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "低熵初始条件——一句话说清它是什么？", "back": "大爆炸时宇宙的熵极低，才有后来的熵增空间。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch07", "front": "韦尔曲率假说——一句话说清它是什么？", "back": "彭罗斯提出：初始奇点的**韦尔曲率**（描述时空形状畸变的量）为零，而物质熵可以很高。", "tags": ["ch07"]}, {"id": "f029", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "把量子力学与广义相对论放在一起，会在普朗克尺度上产生无法自洽的结论；量子引力就是为填补这一块而提出的理论，而彭罗斯希望它顺带解释坍缩。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "普朗克尺度——一句话说清它是什么？", "back": "在约 10^-35 米、10^-43 秒的尺度上，量子涨落与时空弯曲同样剧烈，现有两套理论都无法给出自洽描述。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "霍金辐射与黑洞熵——一句话说清它是什么？", "back": "黑洞会因视界附近的量子效应发出热辐射，温度与质量成反比。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch08", "front": "彭罗斯的取向——一句话说清它是什么？", "back": "他发展**扭量理论**与自旋网络，试图从组合结构重建时空。", "tags": ["ch08"]}, {"id": "f033", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "大脑是物质系统：神经元以电化学信号传递信息，突触强度可塑；但“这些信号如何变成感觉”仍不是把线路图放大就能回答的问题。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "从神经元到网络——一句话说清它是什么？", "back": "**神经元**（neuron）接收突触输入，加权求和后超过阈值就发放**动作电位**，信号沿轴突传到下一个神经元。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "连接主义与符号主义——一句话说清它是什么？", "back": "符号 AI 把智能写成规则与符号操作。", "tags": ["ch09"]}, {"id": "f036", "chapterId": "ch09", "front": "大脑里有没有“非算法”的位置——一句话说清它是什么？", "back": "彭罗斯的假设是：神经元之间的信号传递在微观上可能依赖量子相干，而量子坍缩是非算法的物理过程。", "tags": ["ch09"]}, {"id": "f037", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "意识最难的部分不是智能行为，而是“感觉像什么”；彭罗斯把它接到量子坍缩上，提出意识发生在微管中的客观还原过程——这是一个可讨论但未证实的猜想。", "tags": ["ch10"]}, {"id": "f038", "chapterId": "ch10", "front": "感受质与难问题——一句话说清它是什么？", "back": "**感受质**（qualia，白话：看到红色时那种“红”的感觉）无法用波长、频率、神经放电完整描述。", "tags": ["ch10"]}, {"id": "f039", "chapterId": "ch10", "front": "Orch OR：三个环节——一句话说清它是什么？", "back": "①**Orch**：神经元微管中有序排列的分子结构，能维持量子相干。", "tags": ["ch10"]}, {"id": "f040", "chapterId": "ch10", "front": "评价：大胆但未证实——一句话说清它是什么？", "back": "支持者认为它把物理与意识接在一个可检验的机制上。", "tags": ["ch10"]}], "companion": "emperors-new-mind学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：电脑能有精神吗<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分强 AI 与弱 AI 的主张\n<\/li><li>\n能复述塞尔“中文房间”的反驳并指出它的薄弱处\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>争论的焦点不是机器会不会算，而是“按规则运算”这件事本身能不能产生“感觉像什么”的经验；彭罗斯认为不能，而这需要论证而不是直觉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种立场（难度：基础）<\/h3>\n<p><strong>强 AI<\/strong>：只要程序足够好，运行它的机器就真的有理解与意识。<strong>弱 AI<\/strong>：机器只能模拟智能行为，不涉及意识。<strong>彭罗斯的立场<\/strong>：精神活动包含非算法的成分，所以任何纯算法系统都不可能拥有精神。三者不是技术路线之争，而是关于“精神是什么”的定义之争。<\/p>\n<h3>概念 2：中文房间：符号操作与理解（难度：进阶）<\/h3>\n<p>塞尔设想：一个不懂中文的人关在屋里，按一本规则手册把中文符号拼成回答递出去。屋外人看来他懂中文，屋里人却什么也不懂。塞尔的结论是：符号操作不等于理解。彭罗斯借用它，但走得更远——他不满足于“现在不行”，他要论证“原则上不行”。<\/p>\n<h3>概念 3：彭罗斯为什么不服（难度：高难）<\/h3>\n<p>他认为塞尔的反驳依赖直觉，而直觉可以被“系统整体有理解”这类说法绕开。他要的是数学证明：存在某些人类能看出真假的命题，任何固定算法都看不出来。这个论证在 ch04 展开。第 1 章只是把靶子立起来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三种立场&quot;]\n  n2[&quot;中文房间：符号操作与理解&quot;]\n  n1 --&gt; n2\n  n3[&quot;彭罗斯为什么不服&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：中文房间像一个只会查表的翻译软件：输入输出都对，但它不知道自己在说什么。边界：房间外有人设计规则，人脑的规则从哪来？这个类比没有回答。\n<\/li><li>\n<strong>实例<\/strong>：让一个程序扮演“懂中文”：输入“今天天气如何”，它按规则输出“我不知道，你怎么看”。语法正确、语义空洞。这个例子说明“通过行为测试”不足以判定理解——也正是图灵测试的争议所在。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为彭罗斯在说“机器永远算不过人”——实际上他说的是“意识不能用算法解释”，与算力无关。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n强 AI 的核心主张是？\n<ul>\n<li>\nA. 机器可模拟智能行为\n<\/li><li>\nB. 合适程序运行即有真正理解与意识\n<\/li><li>\nC. 机器永远不如人\n<\/li><li>\nD. 意识与计算无关\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：强 AI 把“正确程序 + 运行”视为意识充分条件。\n<\/li><li>\n中文房间论证想说明？\n<\/li><li>\nA. 中文太难\n<\/li><li>\nB. 符号操作不等于语义理解\n<\/li><li>\nC. 机器不能翻译\n<\/li><li>\nD. 人比机器快\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：塞尔用规则查表说明语法不等于语义。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n强 AI / 弱 AI / 非算法立场三分\n<\/li><li>\n中文房间：语法 ≠ 语义\n<\/li><li>\n彭罗斯要的是证明，不是直觉\n<\/ul>", "ch02": "<h1>第 2 章：算法和图灵机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.6 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出一个简单算法的步骤并说明其有限性\n<\/li><li>\n能描述图灵机的工作方式与通用图灵机的意义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>算法是有限、确定、机械的步骤；图灵机把这种步骤形式化，通用图灵机则说明“一台机器可以模拟任何机器”——这正是“计算等价于算法”的技术基础。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算法：欧几里得的最大公约数（难度：基础）<\/h3>\n<p>求 21 与 15 的最大公约数：21 除 15 余 6；15 除 6 余 3；6 除 3 余 0；答案是 3。每一步都机械、有限、必然终止。<strong>算法<\/strong>（白话：有限步、每步确定、能机械执行的 procedure）的全部要点都在这四行里。<\/p>\n<h3>概念 2：图灵机与通用性（难度：进阶）<\/h3>\n<p>图灵机用纸带存数据、读写头按规则表操作、内部状态有限。<strong>通用图灵机<\/strong>的关键在于：把“某台图灵机的规则表”编码成纸带上的数据，通用机读这段数据就能模拟那台机器。这一步把“程序”和“数据”的界限打通了，也是现代计算机存储程序设计的雏形。<\/p>\n<h3>概念 3：不可计算：算法的边界（难度：高难）<\/h3>\n<p>停机问题说明存在算法无法判定的事。彭罗斯强调的不是“有些问题难”，而是“存在原则上的边界”。这个边界在 ch04 会被用来对付“精神=算法”的论点：如果人的洞察能越过这条边界，人就不是图灵机。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;算法：欧几里得的最大公约数&quot;]\n  n2[&quot;图灵机与通用性&quot;]\n  n1 --&gt; n2\n  n3[&quot;不可计算：算法的边界&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：算法像一份傻瓜菜谱：每步都写死，不要求厨师理解。边界：菜谱仍需要人执行，图灵机把“执行”也形式化了。\n<\/li><li>\n<strong>实例<\/strong>：把“求最大公约数”写成伪代码：while b≠0: t=b; b=a mod b; a=t。三行，必然终止（余数严格减小）。这就是算法的有限性与确定性。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“通用图灵机”能算一切——实际上它算不了一切，只算“可计算”的；停机问题就在边界外。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n算法的必要条件不包括？\n<ul>\n<li>\nA. 步骤有限\n<\/li><li>\nB. 每步确定\n<\/li><li>\nC. 可机械执行\n<\/li><li>\nD. 必须理解问题含义\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：算法不要求执行者理解语义，只要求按规则执行。\n<\/li><li>\n通用图灵机的关键能力是？\n<\/li><li>\nA. 速度更快\n<\/li><li>\nB. 模拟任何图灵机\n<\/li><li>\nC. 存储无限\n<\/li><li>\nD. 自动纠错\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把规则表编码为数据即可模拟其他机器。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算法：有限、确定、机械\n<\/li><li>\n图灵机 = 纸带 + 读写头 + 规则表\n<\/li><li>\n通用性：程序可当数据\n<\/ul>", "ch03": "<h1>第 3 章：数学和实在<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用曼德博集说明“简单规则生成无穷复杂结构”\n<\/li><li>\n能说清柏拉图主义在彭罗斯论证里的位置\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数学对象不是人编出来的约定，而是独立存在的实在；我们通过“看出”它们的性质来发现真理，这种看出不是照着规则算。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：曼德博集：规则极简，边界无限复杂（难度：进阶）<\/h3>\n<p>从 z=0 开始反复做 z→z²+c，看序列是否有界，有界的 c 涂黑。规则两行，得到的<strong>曼德博集<\/strong>（Mandelbrot set）边界却复杂到无法用有限描述刻画，放大任意倍数都有新结构。彭罗斯用它说明：数学对象的复杂性远超生成它的规则。<\/p>\n<h3>概念 2：复数为什么“不自然”却真实（难度：进阶）<\/h3>\n<p>复数由 i²=−1 引入，看似人为。但它在三角恒等式、波动方程、量子力学里处处出现，且结论与实验吻合。彭罗斯据此主张数学结构有独立于人的实在性——<strong>柏拉图主义<\/strong>（白话：数学真理不依赖谁去想它）。<\/p>\n<h3>概念 3：三种世界的三角（难度：高难）<\/h3>\n<p>物理世界、数学世界、精神世界两两相连：物理世界由数学描述，精神能接触数学真理，数学又约束物理。彭罗斯用这个三角支撑后文：如果数学真理独立存在，那么“看出”它的能力就不能被有限规则穷尽。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;曼德博集：规则极简，边界无限复杂&quot;]\n  n2[&quot;复数为什么“不自然”却真实&quot;]\n  n1 --&gt; n2\n  n3[&quot;三种世界的三角&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：曼德博集像一个用两行菜谱烤出的无限层蛋糕：菜谱极短，蛋糕每切一层都有新花纹。边界：蛋糕是实物，集合是定义出来的，没有“做”的过程。\n<\/li><li>\n<strong>实例<\/strong>：取 c=0：序列 0,0,0… 有界，属于集合。取 c=1：0,1,2,5,26… 迅速发散，不属于。取 c=−1：0,−1,0,−1… 有界，属于。三个手算例子就能验证判据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数学是“人类发明的语言游戏”——实际上彭罗斯主张它有独立实在性，这是他论证的地基。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n曼德博集的生成规则是？\n<ul>\n<li>\nA. z→z²+c，判序列是否有界\n<\/li><li>\nB. z→z+c，判收敛\n<\/li><li>\nC. 随机游走\n<\/li><li>\nD. 矩阵迭代\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：反复平方加常数，按有界性着色。\n<\/li><li>\n柏拉图主义在此书中的作用是？\n<\/li><li>\nA. 宗教立场\n<\/li><li>\nB. 支持“数学真理独立于人”的论证\n<\/li><li>\nC. 解释量子力学\n<\/li><li>\nD. 反对相对论\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：只有数学真理独立存在，才谈得上“人去看出它”。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两行规则生成无限复杂边界\n<\/li><li>\n复数在物理中反复出现\n<\/li><li>\n数学—物理—精神三角\n<\/ul>", "ch04": "<h1>第 4 章：真理、证明和洞察<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02、ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述哥德尔句的构造思路\n<\/li><li>\n能说明彭罗斯如何从“人看得出系统不能证的东西”推出“精神非算法”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对任何足够强的一致形式系统，人总能看出“这句在本系统中不可证”是真的，而系统本身证不出它；因此人的洞察不能被任何一个固定系统（也就是任何算法）所包含。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：形式系统与哥德尔句（难度：进阶）<\/h3>\n<p>把数学写成符号游戏：公理 + 推理规则。<strong>哥德尔编码<\/strong>把符号串映射成自然数，于是“某串是证明”变成算术命题。构造一句 G：“G 在本系统中不可证”。若 G 可证，则系统证出假话，不一致；若 G 不可证，则 G 为真而不可证。结论：一致的系统不完备。<\/p>\n<h3>概念 2：彭罗斯的转身（难度：高难）<\/h3>\n<p>哥德尔的结果本身只是限制机器。彭罗斯加了一步：人能“看出”G 为真（因为我们理解构造），所以人的认识超出了这个系统。若精神等于某台图灵机 T，那么 T 对应的形式系统就会有一条它证不出、而我们看得出的命题——矛盾。因此精神不是 T。这一步的争议在于“人看得出”是否对所有系统都成立。<\/p>\n<h3>概念 3：反驳与再反驳（难度：高难）<\/h3>\n<p>常见反驳：人可能出错、人也只是另一台机器、需要的系统可以逐级扩充。彭罗斯的回应是：扩充得到的仍是系统，仍有新的哥德尔句；而“看出”这件事本身不需要规则。他承认论证依赖对“人类数学洞察”的理想化，但坚持这是理解意识的必要线索。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;形式系统与哥德尔句&quot;]\n  n2[&quot;彭罗斯的转身&quot;]\n  n1 --&gt; n2\n  n3[&quot;反驳与再反驳&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个学生总能看出老师给的规则手册有漏洞，而手册本身写不出“我这里有漏洞”。边界：学生也可能看错；彭罗斯假设理想数学家不会看错。\n<\/li><li>\n<strong>实例<\/strong>：设系统 S 的公理与规则都明确。构造 G_S。我们逐步验证：假设 S 证 G_S → 则 G_S 为假 → S 证了假命题 → 不一致。既然我们相信 S 一致，就只能接受 G_S 不可证，因此 G_S 真。这个推理链就是“看出”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为哥德尔定理只是“有些题做不出”——实际上它给出的是“系统无法在自身内部确认自身一致”的结构性限制。\n<\/li><li>\n别以为彭罗斯的结论已被普遍接受——实际上哲学界与 AI 界对此仍有大量批评。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔句 G 的含义是？\n<ul>\n<li>\nA. G 为假\n<\/li><li>\nB. G 在本系统中不可证\n<\/li><li>\nC. 系统不一致\n<\/li><li>\nD. G 不可读\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：自指构造出“我不可证”的命题。\n<\/li><li>\n彭罗斯论证的关键一跃是？\n<\/li><li>\nA. 机器算得慢\n<\/li><li>\nB. 人能看出系统证不出的真命题\n<\/li><li>\nC. 人脑有量子效应\n<\/li><li>\nD. 数学不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他把哥德尔限制转成对人类洞察非算法性的论证。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n哥德尔句：不可证但为真\n<\/li><li>\n一致 → 不完备\n<\/li><li>\n彭罗斯：洞察超出任何固定系统\n<\/ul>", "ch05": "<h1>第 5 章：经典世界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.8 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明麦克斯韦方程如何统一电、磁、光\n<\/li><li>\n能解释狭义相对论中“同时性相对”的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>经典物理把世界写成场与时空的几何：麦克斯韦方程让光成为电磁波，相对论则说明空间与时间不是绝对的背景，而是彼此耦合的舞台。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：麦克斯韦：把光收进电磁（难度：进阶）<\/h3>\n<p>变化的电场生磁场，变化的磁场生电场，二者互相激发形成波，传播速度由两个常数算出，恰好等于光速。这不是巧合，而是“光就是电磁波”的证明。彭罗斯借此说明：物理理论的力量在于把看似无关的现象统一到一个方程里。<\/p>\n<h3>概念 2：相对论：同时性是约定（难度：进阶）<\/h3>\n<p><strong>狭义相对论<\/strong>的两条公设：物理规律在所有惯性系相同、光速不变。由此推出：不同运动状态的观察者对“同时”的判断不同，时间会膨胀、长度会收缩。<strong>广义相对论<\/strong>进一步把引力解释为时空弯曲：质量告诉时空怎么弯，时空告诉物体怎么走。<\/p>\n<h3>概念 3：相空间：把状态画成点（难度：高难）<\/h3>\n<p>一个系统的所有可能状态构成<strong>相空间<\/strong>，系统演化就是相空间里的一条轨迹。这个工具后面在量子引力与熵的讨论里反复出现——熵是相空间体积的对数，时间箭头与相空间的初始条件有关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;麦克斯韦：把光收进电磁&quot;]\n  n2[&quot;相对论：同时性是约定&quot;]\n  n1 --&gt; n2\n  n3[&quot;相空间：把状态画成点&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：时空像一张会随重物凹陷的蹦床：球滚过去会拐弯，不是被“拉”，而是沿着弯曲的面走。边界：蹦床是二维嵌入三维，时空弯曲是内禀的，不需要外部空间。\n<\/li><li>\n<strong>实例<\/strong>：μ 子寿命约 2.2 微秒，静止时来不及穿过大气；但高速 μ 子因时间膨胀，寿命在实验室参考系变长，能到达地面。这是相对论最日常的验证。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相对论说“一切都是相对的”——实际上光速与物理规律是不变的，变的只是测量结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n麦克斯韦方程最重要的统一是？\n<ul>\n<li>\nA. 电与磁\n<\/li><li>\nB. 电、磁与光\n<\/li><li>\nC. 引力与电磁\n<\/li><li>\nD. 质量与能量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：方程预言电磁波速度等于光速，从而把光纳入电磁理论。\n<\/li><li>\n广义相对论把引力解释为？\n<\/li><li>\nA. 超距作用\n<\/li><li>\nB. 时空弯曲\n<\/li><li>\nC. 以太压力\n<\/li><li>\nD. 量子交换\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：质量弯曲时空，物体沿测地线运动。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n麦克斯韦统一电磁与光\n<\/li><li>\n光速不变 → 同时性相对\n<\/li><li>\n引力 = 时空弯曲\n<\/ul>", "ch06": "<h1>第 6 章：量子魔术和量子神秘<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明测量问题与叠加原理的冲突\n<\/li><li>\n能描述 EPR 与贝尔不等式的意义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>量子力学的计算极其成功，但它对“测量时发生了什么”没有公认答案：叠加、坍缩、纠缠三件事放在一起，就逼出了哲学难题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：叠加与测量（难度：进阶）<\/h3>\n<p><strong>叠加<\/strong>（superposition，白话：一个系统同时处于多个可能状态，直到被测量）。双缝实验中，单个电子似乎同时穿过两条缝，形成干涉条纹；一旦测量它走了哪条缝，条纹消失。计算上这没问题，但“测量为什么让叠加消失”没有一致解释。<\/p>\n<h3>概念 2：EPR 与贝尔（难度：高难）<\/h3>\n<p>爱因斯坦等人提出 EPR 论证：若两个粒子纠缠，测量一个立刻确定另一个，似乎需要“超距作用”，因此量子力学不完备。<strong>贝尔不等式<\/strong>把它变成实验问题：如果存在局域隐变量，某种关联必须小于某个上限；实验结果显示关联超过上限。结论是：世界要么非局域，要么不实在——两者必居其一。<\/p>\n<h3>概念 3：几种解释（难度：高难）<\/h3>\n<p>哥本哈根：测量就是边界，不问过程。多世界：每次测量分裂出多个分支。客观还原（彭罗斯后来提出）：坍缩是真实的物理过程，与引力有关。彭罗斯倾向后者，因为他需要一个能接上意识的物理机制。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;叠加与测量&quot;]\n  n2[&quot;EPR 与贝尔&quot;]\n  n1 --&gt; n2\n  n3[&quot;几种解释&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：纠缠像一双分寄两地的鞋：你打开这箱看到左脚，立刻知道那箱是右脚——但量子版的“鞋”在打开前真的没有左右。边界：鞋的比喻暗含“早已确定”，恰好是贝尔实验否定的。\n<\/li><li>\n<strong>实例<\/strong>：一对纠缠光子分送两地，同时测量偏振。单看任一方都是随机的；比较两方结果，相关性高于任何局域隐变量模型的上限（贝尔不等式被违反）。这不是信号超光速，而是结果无法用“各自预先确定”解释。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为纠缠能超光速通信——实际上关联不能传递信息，需要经典信道对照结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n双缝实验中“测量路径”导致条纹消失，说明？\n<ul>\n<li>\nA. 电子变了\n<\/li><li>\nB. 测量改变了量子态\n<\/li><li>\nC. 缝变窄了\n<\/li><li>\nD. 光速变化\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：测量使叠加被破坏，干涉消失。\n<\/li><li>\n贝尔不等式被违反的实验结论是？\n<\/li><li>\nA. 量子力学错了\n<\/li><li>\nB. 局域隐变量不可能\n<\/li><li>\nC. 超光速通信可行\n<\/li><li>\nD. 纠缠不存在\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：结果排除局域隐变量，保留非局域性或非实在性。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n叠加 + 测量 = 坍缩难题\n<\/li><li>\nEPR：纠缠关联\n<\/li><li>\n贝尔：局域隐变量被实验排除\n<\/ul>", "ch07": "<h1>第 7 章：宇宙论和时间箭头<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch05、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出三种时间箭头及其关系\n<\/li><li>\n能解释彭罗斯的韦尔曲率假说想解决什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>时间有方向，是因为宇宙从一个极特殊的低熵初始状态出发；这个特殊性不能由现有物理定律解释，彭罗斯把它归因于时空几何的初始约束。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种箭头（难度：基础）<\/h3>\n<p>热力学箭头：熵增；宇宙学箭头：宇宙膨胀；心理学箭头：我们记得过去不记得未来。三种箭头方向一致，但来源不同，彭罗斯要问的是它们为什么一致。<\/p>\n<h3>概念 2：低熵初始条件（难度：高难）<\/h3>\n<p>大爆炸时宇宙的熵极低，才有后来的熵增空间。问题是：为什么初始熵那么低？在相空间里，低熵区域体积极小，随机初始条件几乎必然给出高熵。所以初始条件是被“选”过的，而现有理论说不出谁选的。<\/p>\n<h3>概念 3：韦尔曲率假说（难度：高难）<\/h3>\n<p>彭罗斯提出：初始奇点的<strong>韦尔曲率<\/strong>（描述时空形状畸变的量）为零，而物质熵可以很高。也就是说，早期宇宙“几何上极整齐”，这解释了为什么引力场没有一开始就混乱。这个假说是他后续量子引力与意识论证的物理入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三种箭头&quot;]\n  n2[&quot;低熵初始条件&quot;]\n  n1 --&gt; n2\n  n3[&quot;韦尔曲率假说&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一摞整齐的扑克牌被弹开：牌越整齐，弹开后越乱；宇宙的“整齐”不是巧合，而是初始条件。边界：扑克牌是人摆的，宇宙初始条件是谁摆的，目前没有答案。\n<\/li><li>\n<strong>实例<\/strong>：一杯热水放在房间会变凉，熵增；把凉水加热需要做功。时间箭头的方向由“初始低熵 + 孤立系统”共同决定，而不是单个粒子层面的定律。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增解释了时间箭头——实际上它只解释了方向的一部分，初始条件仍是难题。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n彭罗斯认为时间箭头的根源是？\n<ul>\n<li>\nA. 人类记忆\n<\/li><li>\nB. 宇宙极低熵的初始条件\n<\/li><li>\nC. 量子随机\n<\/li><li>\nD. 相对论效应\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：初始条件是熵增得以发生的前提。\n<\/li><li>\n韦尔曲率假说的内容是？\n<\/li><li>\nA. 初始奇点韦尔曲率为零\n<\/li><li>\nB. 宇宙在收缩\n<\/li><li>\nC. 引力不存在\n<\/li><li>\nD. 熵恒为常数\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：早期几何极整齐，物质熵可高，从而解释引力为何不混乱。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种箭头方向一致但来源不同\n<\/li><li>\n低熵初始条件无法由现有理论解释\n<\/li><li>\n韦尔曲率假说：初始几何极整齐\n<\/ul>", "ch08": "<h1>第 8 章：量子引力的寻求<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch05、ch06、ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明普朗克尺度为什么需要新理论\n<\/li><li>\n能描述霍金辐射与黑洞熵的基本图像\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把量子力学与广义相对论放在一起，会在普朗克尺度上产生无法自洽的结论；量子引力就是为填补这一块而提出的理论，而彭罗斯希望它顺带解释坍缩。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：普朗克尺度（难度：进阶）<\/h3>\n<p>在约 10^-35 米、10^-43 秒的尺度上，量子涨落与时空弯曲同样剧烈，现有两套理论都无法给出自洽描述。<strong>量子引力<\/strong>（quantum gravity）就是要在这个尺度上重建时空概念。<\/p>\n<h3>概念 2：霍金辐射与黑洞熵（难度：高难）<\/h3>\n<p>黑洞会因视界附近的量子效应发出热辐射，温度与质量成反比。黑洞熵正比于视界面积而非体积——这个“面积律”暗示引力与信息有深层联系，也提示时空可能不是连续的。<\/p>\n<h3>概念 3：彭罗斯的取向（难度：高难）<\/h3>\n<p>他发展<strong>扭量理论<\/strong>与自旋网络，试图从组合结构重建时空。他的目标不只是统一，还要给“波函数坍缩”一个物理机制：当引力能差达到阈值时，叠加会自发还原。这一猜想后来成为 Orch OR 的物理半。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;普朗克尺度&quot;]\n  n2[&quot;霍金辐射与黑洞熵&quot;]\n  n1 --&gt; n2\n  n3[&quot;彭罗斯的取向&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像两张地图拼不上：一张画城市，一张画地形，在边界处对不上，必须重画一张同时含两者的地图。边界：新地图还没画完，量子引力尚无实验验证。\n<\/li><li>\n<strong>实例<\/strong>：太阳质量黑洞的霍金温度约 10^-7 开尔文，远低于宇宙微波背景，因此实际观测不到；但面积律给出的熵值极大，说明黑洞内部状态数惊人。两个数字都能算，说明理论至少自洽。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为量子引力已被证实——实际上它仍是猜想，彭罗斯的方案也未被实验支持。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n黑洞熵正比于？\n<ul>\n<li>\nA. 质量\n<\/li><li>\nB. 视界面积\n<\/li><li>\nC. 体积\n<\/li><li>\nD. 温度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：面积律是量子引力研究的重要线索。\n<\/li><li>\n彭罗斯希望量子引力顺带解释？\n<\/li><li>\nA. 宇宙膨胀\n<\/li><li>\nB. 波函数坍缩\n<\/li><li>\nC. 电磁力\n<\/li><li>\nD. 生命起源\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：客观还原猜想把坍缩与引力能差联系起来。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n普朗克尺度：两套理论都失效\n<\/li><li>\n黑洞熵 ∝ 视界面积\n<\/li><li>\n彭罗斯：坍缩可能是引力驱动的真实过程\n<\/ul>", "ch09": "<h1>第 9 章：真实头脑和模型头脑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch02、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述神经元、突触与动作电位的基本工作\n<\/li><li>\n能比较符号 AI 与连接主义的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>大脑是物质系统：神经元以电化学信号传递信息，突触强度可塑；但“这些信号如何变成感觉”仍不是把线路图放大就能回答的问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从神经元到网络（难度：基础）<\/h3>\n<p><strong>神经元<\/strong>（neuron）接收突触输入，加权求和后超过阈值就发放<strong>动作电位<\/strong>，信号沿轴突传到下一个神经元。突触强度可调，这就是学习发生的物理位置。人脑约千亿神经元、万亿连接，远超任何人工网络的规模。<\/p>\n<h3>概念 2：连接主义与符号主义（难度：进阶）<\/h3>\n<p>符号 AI 把智能写成规则与符号操作；<strong>连接主义<\/strong>（connectionism）用大量简单单元的加权连接，靠训练调整权重。彭罗斯承认连接主义在模式识别上更强，但他指出：调整权重仍是算法过程，于是 ch04 的论证照样适用。<\/p>\n<h3>概念 3：大脑里有没有“非算法”的位置（难度：高难）<\/h3>\n<p>彭罗斯的假设是：神经元之间的信号传递在微观上可能依赖量子相干，而量子坍缩是非算法的物理过程。他把位置选在细胞内的微管结构，这就是后来 Orch OR 的雏形。这个假设目前缺乏实验支持，属于待检验的猜想。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从神经元到网络&quot;]\n  n2[&quot;连接主义与符号主义&quot;]\n  n1 --&gt; n2\n  n3[&quot;大脑里有没有“非算法”的位置&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：神经网络像一屋子互相传纸条的人：每人只看几张纸条，加权后决定要不要喊话。边界：人能理解纸条内容，神经元不“理解”，只是电化学响应。\n<\/li><li>\n<strong>实例<\/strong>：一个神经元收到三个输入 0.5、0.8、0.2，权重分别 2、1、−3，加权和 = 1+0.8−0.6=1.2，超过阈值 1 就发放。改权重就能改变输出——这就是“学习”的最小模型。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大脑只是更大的神经网络——实际上其结构、可塑性与能量效率都与人工网络有本质差别。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n突触在神经系统中主要作用是？\n<ul>\n<li>\nA. 产生能量\n<\/li><li>\nB. 连接神经元并调节信号强度\n<\/li><li>\nC. 存储 DNA\n<\/li><li>\nD. 维持体温\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：突触强度可塑，是学习的关键位点。\n<\/li><li>\n彭罗斯对连接主义的态度是？\n<\/li><li>\nA. 完全支持\n<\/li><li>\nB. 承认其能力，但仍属算法过程\n<\/li><li>\nC. 认为它比符号 AI 差\n<\/li><li>\nD. 认为它无需训练\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：权重调整仍是算法，因此不解决非算法论证。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n神经元：加权求和 + 阈值发放\n<\/li><li>\n突触强度 = 学习的物理位置\n<\/li><li>\n连接主义仍是算法\n<\/ul>", "ch10": "<h1>第 10 章：精神物理的寻求<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.7 小时 ｜ <strong>前置<\/strong>：ch04、ch08、ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清“感受质”为什么难以用物理量描述\n<\/li><li>\n能复述 Orch OR 猜想的三个环节及其争议\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>意识最难的部分不是智能行为，而是“感觉像什么”；彭罗斯把它接到量子坍缩上，提出意识发生在微管中的客观还原过程——这是一个可讨论但未证实的猜想。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：感受质与难问题（难度：进阶）<\/h3>\n<p><strong>感受质<\/strong>（qualia，白话：看到红色时那种“红”的感觉）无法用波长、频率、神经放电完整描述。你可以列出全部物理事实，仍然没说出“红的红”。这就是意识研究的难问题，也是彭罗斯认为算法解释不了的地方。<\/p>\n<h3>概念 2：Orch OR：三个环节（难度：高难）<\/h3>\n<p>①<strong>Orch<\/strong>：神经元微管中有序排列的分子结构，能维持量子相干；②<strong>OR<\/strong>：当叠加态的引力能差达到阈值，波函数客观还原，产生一个确定的经典状态；③意识 = 这些还原事件的连续序列。三个环节每一环都有争议：微管能否维持相干、引力阈值是否成立、还原与意识如何对应。<\/p>\n<h3>概念 3：评价：大胆但未证实（难度：高难）<\/h3>\n<p>支持者认为它把物理与意识接在一个可检验的机制上；批评者指出温热潮湿的脑内环境会让量子相干迅速退相干，且没有实验证据。彭罗斯自己在书里也把它定位为“猜测”，不是结论。读这本书的正确姿势是：记住论证的结构，而不是把猜想当定论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;感受质与难问题&quot;]\n  n2[&quot;Orch OR：三个环节&quot;]\n  n1 --&gt; n2\n  n3[&quot;评价：大胆但未证实&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把交响乐归因于乐谱纸张的纤维：乐谱承载音乐，但音乐不在纸里。边界：这个类比也可能反过来用——也许意识确实在“纸”的某种物理过程里，只是我们还没找到。\n<\/li><li>\n<strong>实例<\/strong>：两个人看到同一片红，波长数据完全一致，但无法交换“红的感觉”。所有物理描述加总仍缺一项，这就是难问题的可操作表述：第三人称数据无法穷尽第一人称经验。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Orch OR 已被实验证实——实际上它缺乏支持，且有退相干难题。\n<\/li><li>\n别以为彭罗斯否定 AI 的能力——实际上他否定的是“纯算法即有意识”，不是“机器不能做智能的事”。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“感受质”指的是？\n<ul>\n<li>\nA. 神经放电频率\n<\/li><li>\nB. 主观体验的质的特征\n<\/li><li>\nC. 记忆容量\n<\/li><li>\nD. 量子叠加\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：如红色的“红”，无法用物理量完全描述。\n<\/li><li>\nOrch OR 中“OR”指？\n<\/li><li>\nA. 有序排列\n<\/li><li>\nB. 客观还原\n<\/li><li>\nC. 光学共振\n<\/li><li>\nD. 开放系统\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：objective reduction，引力驱动的波函数坍缩。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n难问题 = 感受质无法被物理描述穷尽\n<\/li><li>\nOrch OR：微管相干 + 引力还原 + 意识序列\n<\/li><li>\n这是猜想，不是定论\n<\/ul>", "c01": "<h1>非算法论证<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 04 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>借助哥德尔不完备与停机问题，论证人的数学洞察不能被任何固定算法包含，因此精神不等于算法。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书的主论证，也是彭罗斯与主流 AI 立场分裂的地方。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>结构：给定任意一台声称等价于人脑的图灵机 T，构造它对应的形式系统 S；S 有哥德尔句 G，人可看出 G 真而 S 证不出；故人超出 T。<\/p>\n<p>前提一：人是一致的（不会证出矛盾）。前提二：人能看到任意给定系统的哥德尔句。两条都被批评过。<\/p>\n<p>结论的强度：它否定“精神 = 某个固定算法”，不否定“精神可以被某种更复杂的计算描述”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为这证明机器永远不如人——它只否定固定算法与意识的等价。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>真理与证明<\/td><td>论证主体<\/td><\/tr><tr><td>ch10<\/td><td>精神物理<\/td><td>接到意识问题<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n哥德尔不完备、停机问题、强 AI\n<\/ul>", "c02": "<h1>柏拉图主义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>数学对象与真理独立于人的心灵而存在，人通过洞察接触它们。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有这个前提，“人看出哥德尔句为真”就只是心理事实，撑不起非算法论证。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三条支撑：数学结论的必然性（不是约定）、跨文化一致性、物理世界惊人地遵循数学。<\/p>\n<p>反对意见：数学只是符号游戏，一致性来自我们设计规则的方式。<\/p>\n<p>彭罗斯的用法是工具性的：他不需要你信柏拉图主义，只需要你承认“看出真理”不是照着规则算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为柏拉图主义是宗教主张——它是一种关于数学对象地位的哲学立场，有大量非宗教的论证。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>数学和实在<\/td><td>提出立场<\/td><\/tr><tr><td>ch04<\/td><td>哥德尔<\/td><td>作为论证前提<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n曼德博集、数学实在\n<\/ul>", "c03": "<h1>量子测量与客观还原<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 06 章、第 08 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>测量问题指叠加如何变成确定结果；客观还原主张这是一个真实的、由引力触发的物理过程。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是彭罗斯把物理与意识接起来的唯一接口，也是全书最脆弱的一环。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准量子力学给出概率，不解释“为什么这次是这个结果”。<\/p>\n<p>客观还原假设：当叠加态中两分支的引力场差异足够大时，系统自发选择其一，时间尺度与质量差相关。<\/p>\n<p>可检验性：理论上可在质量与时间尺度上找边界，但目前没有确认的实验。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为客观还原只是哲学解释——它给出了可估算的时间尺度，具备被检验的形式。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>量子魔术<\/td><td>测量问题<\/td><\/tr><tr><td>ch08<\/td><td>量子引力<\/td><td>引力触发<\/td><\/tr><tr><td>ch10<\/td><td>意识<\/td><td>Orch OR<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n叠加、EPR、Orch OR\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：电脑能有精神吗<\/strong><br>阅读：<a href=\"#/book/emperors-new-mind/chapter/ch01\">第 1 章 电脑能有精神吗<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：算法和图灵机<\/strong><br>阅读：<a href=\"#/book/emperors-new-mind/chapter/ch02\">第 2 章 算法和图灵机<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：数学和实在<\/strong><br>阅读：<a href=\"#/book/emperors-new-mind/chapter/ch03\">第 3 章 数学和实在<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：真理、证明和洞察<\/strong><br>阅读：<a href=\"#/book/emperors-new-mind/chapter/ch04\">第 4 章 真理、证明和洞察<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：经典世界<\/strong><br>阅读：<a href=\"#/book/emperors-new-mind/chapter/ch05\">第 5 章 经典世界<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：量子魔术和量子神秘<\/strong><br>阅读：<a href=\"#/book/empe lass='quiz-opt'><input type='radio' name='ch10-q2' value='2'> 光学共振<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='3'> 开放系统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='强 ai'>强 AI — 合适程序运行即产生真正意识的主张 <span class=glossary-ref>（第 1 章 电脑能有精神吗）<\/span><\/li><li data-term='中文房间'>中文房间 — 塞尔用符号查表论证语法不等于语义的思想实验 <span class=glossary-ref>（第 1 章 电脑能有精神吗）<\/span><\/li><li data-term='算法'>算法 — 有限、确定、可机械执行的步骤 <span class=glossary-ref>（第 2 章 算法和图灵机）<\/span><\/li><li data-term='通用图灵机'>通用图灵机 — 能模拟任何图灵机的图灵机 <span class=glossary-ref>（第 2 章 算法和图灵机）<\/span><\/li><li data-term='哥德尔编码'>哥德尔编码 — 把符号串映射为自然数的编码 <span class=glossary-ref>（第 4 章 真理、证明和洞察）<\/span><\/li><li data-term='哥德尔句'>哥德尔句 — 断言自身在本系统中不可证的命题 <span class=glossary-ref>（第 4 章 真理、证明和洞察）<\/span><\/li><li data-term='柏拉图主义'>柏拉图主义 — 数学对象独立于心灵而存在 <span class=glossary-ref>（第 3 章 数学和实在）<\/span><\/li><li data-term='曼德博集'>曼德博集 — z→z²+c 迭代下有界点构成的集合 <span class=glossary-ref>（第 3 章 数学和实在）<\/span><\/li><li data-term='狭义相对论'>狭义相对论 — 光速不变与惯性系等价下的时空理论 <span class=glossary-ref>（第 5 章 经典世界）<\/span><\/li><li data-term='广义相对论'>广义相对论 — 引力即时空弯曲的理论 <span class=glossary-ref>（第 5 章 经典世界）<\/span><\/li><li data-term='叠加'>叠加 — 系统同时处于多个可能状态 <span class=glossary-ref>（第 6 章 量子魔术和量子神秘）<\/span><\/li><li data-term='纠缠'>纠缠 — 两系统状态无法分别描述的整体关联 <span class=glossary-ref>（第 6 章 量子魔术和量子神秘）<\/span><\/li><li data-term='贝尔不等式'>贝尔不等式 — 区分局域隐变量与量子关联的实验判据 <span class=glossary-ref>（第 6 章 量子魔术和量子神秘）<\/span><\/li><li data-term='韦尔曲率'>韦尔曲率 — 描述时空形状畸变的几何量 <span class=glossary-ref>（第 7 章 宇宙论和时间箭头）<\/span><\/li><li data-term='霍金辐射'>霍金辐射 — 黑洞视界附近量子效应导致的热辐射 <span class=glossary-ref>（第 8 章 量子引力的寻求）<\/span><\/li><li data-term='连接主义'>连接主义 — 用大量简单单元加权连接实现智能的路线 <span class=glossary-ref>（第 9 章 真实头脑和模型头脑）<\/span><\/li><li data-term='感受质'>感受质 — 主观体验的质的特征 <span class=glossary-ref>（第 10 章 精神物理的寻求）<\/span><\/li><li data-term='orch or'>Orch OR — 微管相干 + 客观还原的意识猜想 <span class=glossary-ref>（第 10 章 精神物理的寻求）<\/span><\/li><\/ul>", "__patterns__": "<h1>皇帝新脑 模式与框架库<\/h1>\n<h2>分析框架：彭罗斯的三层论证链<\/h2>\n<p>第一层（数学）：哥德尔句表明形式系统不完备。第二层（认知）：人能看出该系统证不出的真命题。第三层（结论）：精神不是任何固定算法。任何反驳只需攻破其中一层，通常攻第二层。<\/p>\n<h2>决策规则：遇到“机器将有意识”的说法先问三件事<\/h2>\n<ol><li>\n它主张的是行为等效还是意识本身？\n<\/li><li>\n它的“理解”是否有语义，还是只有语法？\n<\/li><li>\n它是否隐含“算法即精神”这一前提？\n<p>三问能快速定位争论层级。<\/p>\n<\/ol>\n<h2>反模式：把未证实的物理猜想当结论<\/h2>\n<p>Orch OR 是猜想，不是定理。写作或讨论时应标注“假设/待检验”，不能表述为“意识就是微管中的量子坍缩”。<\/p>\n<h2>反模式：用“人也会错”一句话打掉非算法论证<\/h2>\n<p>这个反驳成立，但它削弱的是“理想数学家”前提，不是整个结构。要推翻论证，需要说明人为何仍等价于某台图灵机。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>非算法论证四步<\/td><td>设 T → 构造 S → 得 G → 人看出 G 真 → 人 ≠ T<\/td><\/tr><tr><td>算法三要件<\/td><td>有限、确定、机械<\/td><\/tr><tr><td>哥德尔结论<\/td><td>足够强且一致 ⇒ 不完备<\/td><\/tr><tr><td>贝尔实验结论<\/td><td>局域隐变量不可能<\/td><\/tr><tr><td>黑洞熵<\/td><td>正比于视界面积<\/td><\/tr><tr><td>时间箭头三种<\/td><td>热力学 / 宇宙学 / 心理学<\/td><\/tr><tr><td>Orch OR 三环节<\/td><td>微管相干 → 引力还原 → 意识序列<\/td><\/tr><tr><td>三类世界<\/td><td>物理 / 数学 / 精神，两两相连<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 电脑能有精神吗", "href": "#/chapter/ch01"}, {"label": "第 2 章 算法和图灵机", "href": "#/ch erm": "普遍语言", "def": "莱布尼茨设想的无歧义符号系统", "chapterId": "ch01"}, {"term": "布尔代数", "def": "以真值 1/0 与与或非运算构成的对策代数", "chapterId": "ch02"}, {"term": "概念文字", "def": "弗雷格发明的带量词与关系的形式语言", "chapterId": "ch03"}, {"term": "罗素悖论", "def": "所有不包含自身的集合组成的集合导致的矛盾", "chapterId": "ch03"}, {"term": "等势", "def": "两个集合元素可一一对应", "chapterId": "ch04"}, {"term": "对角线方法", "def": "逐位构造与列表中每项都不同的对象", "chapterId": "ch04"}, {"term": "连续统假设", "def": "实数基数与自然数基数之间没有其他基数", "chapterId": "ch04"}, {"term": "判定问题", "def": "是否存在机械程序判定任意命题可证性", "chapterId": "ch05"}, {"term": "有限主义", "def": "只接受可有限构造的数学对象与方法", "chapterId": "ch05"}, {"term": "哥德尔编码", "def": "把符号与证明映射为自然数", "chapterId": "ch06"}, {"term": "第一不完备定理", "def": "足够强且一致的系统存在不可证的真命题", "chapterId": "ch06"}, {"term": "第二不完备定理", "def": "系统不能在自身内部证明自身一致", "chapterId": "ch06"}, {"term": "图灵机", "def": "纸带、读写头与规则表构成的抽象计算模型", "chapterId": "ch07"}, {"term": "停机问题", "def": "判定任意程序是否终止，不可解", "chapterId": "ch07"}, {"term": "通用图灵机", "def": "能模拟任何图灵机的机器", "chapterId": "ch07"}, {"term": "存储程序", "def": "指令与数据共存于可寻址存储器", "chapterId": "ch08"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q1", "chapterId": "ch01", "type": "single", "question": "莱布尼茨“普遍语言”的核心想法是？", "options": ["发明世界语", "用无歧义符号把推理变成计算", "建立百科全书", "改良拉丁文"], "answer": 1, "explain": "目标是让争论可计算，而非造一门自然语言。"}, {"id": "ch01-q2", "chapterId": "ch01", "type": "single", "question": "这个梦想在当时缺的关键条件是？", "options": ["纸张", "可执行的计算装置与可计算性概念", "数学家太少", "宗教反对"], "answer": 1, "explain": "缺机器与理论，符号方案本身并不缺。"}, {"id": "ch02-q1", "chapterId": "ch02", "type": "single", "question": "布尔代数中“与”对应哪种算术运算？", "options": ["加法", "乘法", "减法", "除法"], "answer": 1, "explain": "真值 1∧1=1，其余为 0，与乘法一致。"}, {"id": "ch02-q2", "chapterId": "ch02", "type": "single", "question": "布尔代数不能处理的是？", "options": ["命题连接", "真值计算", "量词与关系", "电路实现"], "answer": 2, "explain": "量词与关系需要谓词逻辑，弗雷格才补上。"}, {"id": "ch03-q1", "chapterId": "ch03", "type": "single", "question": "弗雷格比布尔多表达的是？", "options": ["真值表", "量词与关系", "电路", "概率"], "answer": 1, "explain": "概念文字引入了变量与量词，能表达数学结构。"}, {"id": "ch03-q2", "chapterId": "ch03", "type": "single", "question": "罗素悖论否定了哪条朴素原则？", "options": ["排中律", "任意性质都能确定一个集合", "无限不存在", "逻辑不可靠"], "answer": 1, "explain": "无限制概括原则导致自指矛盾。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "判断两个无限集合“一样多”的标准是？", "options": ["元素数量数完比较", "能一一对应", "体积比较", "密度比较"], "answer": 1, "explain": "等势由双射定义。"}, {"id": "ch04-q2", "chapterId": "ch04", "type": "single", "question": "对角线方法的作用是？", "options": ["计算极限", "构造一个不在列表中的元素以证明不可数", "求最大公约数", "排序"], "answer": 1, "explain": "逐位取反保证新对象与每个列出对象都不同。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "希尔伯特计划的两个核心目标是？", "options": ["简洁与优雅", "一致性与完备性", "速度与存储", "可视化与交互"], "answer": 1, "explain": "用有限方法证明数学不会矛盾且能证出所有真理。"}, {"id": "ch05-q2", "chapterId": "ch05", "type": "single", "question": "判定问题问的是？", "options": ["数学题难不难", "是否存在机械程序判定任意命题可证性", "计算机快不快", "公理有多少条"], "answer": 1, "explain": "Entscheidungsproblem 是可判定性的核心问题。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "哥德尔第一定理的前提是系统？", "options": ["足够弱", "足够强且一致", "完备", "有限"], "answer": 1, "explain": "强度足以表达算术，一致性保证不证出矛盾。"}, {"id": "ch06-q2", "chapterId": "ch06", "type": "single", "question": "第二定理说的是？", "options": ["系统能证明自身一致", "系统不能证明自身一致", "系统一定矛盾", "系统一定完备"], "answer": 1, "explain": "一致性证明若形式化，就落入系统内部，从而受限。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "图灵证明判定问题无解，靠的是？", "options": ["造出更快的机器", "停机问题不可判定", "哥德尔第二定理直接套用", "实验测量"], "answer": 1, "explain": "把判定问题归约到停机问题，后者不可解。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "通用图灵机的意义在于？", "options": ["速度最快", "程序可作为数据被模拟", "不需要纸带", "只能算加法"], "answer": 1, "explain": "这是存储程序思想的理论来源。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "ENIAC 编程主要靠？", "options": ["键盘输入", "插线与开关", "纸带", "语音"], "answer": 1, "explain": "改任务需重新接线，耗时很长。"}, {"id": "ch08-q2", "chapterId": "ch08", "type": "single", "question": "存储程序的关键是？", "options": ["指令与数据存放在可寻址存储器", "使用晶体管", "提高主频", "增加显示器"], "answer": 0, "explain": "指令成为可读取的数据，机器因此通用。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "ELIZA 的工作方式是？", "options": ["语义理解", "模式匹配与句式改写", "神经网络训练", "逻辑推理"], "answer": 1, "explain": "它没有语义模型，只按模板重组句子。"}, {"id": "ch09-q2", "chapterId": "ch09", "type": "single", "question": "戴维斯对“机器能思考吗”的态度接近？", "options": ["已经完全实现", "行为相似不等于理解，问题仍开放", "绝不可能", "只是语言问题"], "answer": 1, "explain": "他区分演算与心灵，不下绝对结论。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "从莱布尼茨到图灵，这条线索解决的核心问题是？", "options": ["如何造更快的加法器", "如何把推理变成可机械执行的符号操作，并界定其边界", "如何发明计算机语言", "如何证明上帝存在"], "answer": 1, "explain": "符号演算 + 可计算性界定是主线。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "罗素悖论与哥德尔句的共同结构是？", "options": ["都关于无限", "都靠自指导出矛盾", "都需要实验验证", "都只涉及几何"], "answer": 1, "explain": "自指构造是二者的骨架。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "如果有人说“未来计算机能判定所有数学命题”，最有力的反驳是？", "options": ["算力不够", "停机问题不可判定，且判定问题可归约到它", "数学命题太多", "人比机器聪明"], "answer": 1, "explain": "这是图灵 1936 年的结论，不是工程限制。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "莱布尼茨想造一种没有歧义的符号语言，让争论变成计算；这个梦想的方向是对的，缺的是能执行它的机器与能定义“可计算”的数学。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "争论为什么吵不完——一句话说清它是什么？", "back": "17 世纪的哲学与神学争论，多半败在语言：同一个词在不同人嘴里意思不同，推理靠自然语言的暗示滑过去。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "他还缺什么——一句话说清它是什么？", "back": "缺三样：一是概念的分解规则（怎么把复杂概念拆成基本符号），二是计算的执行装置，三是对“什么算得出”的界定。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "布尔把“真/假”当作 1/0，把“并且/或者/并非”当作乘法、加法、取反，于是逻辑推理变成了可以机械演算的代数。", "tags": ["ch02"]}, {"id": "f005", "chapterId": "ch02", "front": "从词到运算符——一句话说清它是什么？", "back": "**布尔代数**（Boolean algebra）把命题的真值看成两个值，把连接词看成运算：与（∧）像乘法，或（∨）像加法但要处理 1+1=1，非（¬）像 1−x。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "为什么它能变成电路——一句话说清它是什么？", "back": "与门、或门、非门就是这三个运算的物理实现：高电平代表 1，低电平代表 0。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "布尔的局限——一句话说清它是什么？", "back": "布尔代数处理的是命题之间的组合，不能处理“所有”“存在”这类量词，也不能处理关系（“A 大于 B”）。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "弗雷格造出了能表达量词与关系的形式语言，几乎把算术建立在逻辑之上；罗素用一个自指集合把他的地基抽掉。", "tags": ["ch03"]}, {"id": "f009", "chapterId": "ch03", "front": "概念文字——一句话说清它是什么？", "back": "**概念文字**（Begriffsschrift）是弗雷格发明的人工语言：有变量、量词（所有、存在）、谓词与推理规则，能把“每个自然数都有后继”这类句子写成无歧义的形式。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "逻辑主义计划——一句话说清它是什么？", "back": "弗雷格的目标是证明算术可以从纯逻辑推出——数是“集合的集合”的逻辑构造。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "罗素悖论——一句话说清它是什么？", "back": "设 R 为“所有不包含自身的集合组成的集合”。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "无限可以比较大小：两个集合能一一对应就是等势；自然数与实数不能一一对应，因此实数比自然数“更多”，而对角线方法给出了证明的通用套路。", "tags": ["ch04"]}, {"id": "f013", "chapterId": "ch04", "front": "等势：数不过来的东西怎么比——一句话说清它是什么？", "back": "**等势**（白话：两个集合的元素能一一配对，不剩也不多）。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "对角线：造一个漏网之数——一句话说清它是什么？", "back": "假设 0 到 1 之间的实数可以排成一列，每个写成无限小数。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "连续统假设——一句话说清它是什么？", "back": "康托尔证明实数集的基数比自然数大，然后猜测：没有介于两者之间的基数。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "面对悖论，希尔伯特提出把数学整体形式化，再用有限的、可靠的方法证明它一致且完备；判定问题（Entscheidungsproblem）是这套计划的执行入口。", "tags": ["ch05"]}, {"id": "f017", "chapterId": "ch05", "front": "形式主义方案——一句话说清它是什么？", "back": "把所有数学写成符号串与推理规则，证明变成符号操作。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "判定问题——一句话说清它是什么？", "back": "**判定问题**：是否存在一个机械程序，对任意形式命题判定它是否可证？如果有，数学家的工作就可以外包给机器。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "营救的裂缝——一句话说清它是什么？", "back": "布劳威尔等直觉主义者反对排中律在无限情形下使用，希尔伯特视之为威胁。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "任何足够强、一致的形式系统都有一条它证不出的真命题；因此“完备性”不可能，希尔伯特计划的核心目标落空。", "tags": ["ch06"]}, {"id": "f021", "chapterId": "ch06", "front": "算术化——一句话说清它是什么？", "back": "哥德尔给每个符号、公式、证明序列分配一个数（**哥德尔编码**）。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "自指句——一句话说清它是什么？", "back": "用对角线技巧构造命题 G：G 断言“不存在编号为 G 的证明”。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "第二定理与影响——一句话说清它是什么？", "back": "第二不完备定理更进一步：系统无法在自身内部证明自己的一致。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "图灵把“机械程序”定义为图灵机，证明不存在判定停机的一般程序，从而否定判定问题；同一篇论文里的通用机，成了通用计算机的理论原型。", "tags": ["ch07"]}, {"id": "f025", "chapterId": "ch07", "front": "把计算写成机器——一句话说清它是什么？", "back": "图灵机的部件（纸带、读写头、规则表）在《皇帝新脑》一章已出现过，这里重点不同：图灵要的是一个**定义**，而不是一台机器。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "停机问题否定判定问题——一句话说清它是什么？", "back": "如果存在判定任意命题可证性的程序，就能判定任意图灵机是否停机（把停机问题编码成命题）。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "通用机：一台机器模拟所有机器——一句话说清它是什么？", "back": "把某台机器的规则表编码到纸带上，通用机读它并模拟之。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "ENIAC 用插线与开关编程，算得快但改程序极慢；ACE 沿用图灵的存储程序设想，把指令放进存储器，从此改程序只需改数据。", "tags": ["ch08"]}, {"id": "f029", "chapterId": "ch08", "front": "ENIAC：电子管的速度——一句话说清它是什么？", "back": "ENIAC 用真空管做运算，每秒能完成数千次加法，比机电式机器快几个数量级。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "存储程序的分水岭——一句话说清它是什么？", "back": "把指令与数据放在同一个可寻址存储器里，机器就能读指令并执行——这是**存储程序**（stored program）。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "图灵的 ACE 与极简主义——一句话说清它是什么？", "back": "图灵设计的 ACE 追求极简：用最少的硬件，把复杂度放到程序里。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "计算机实现了莱布尼茨的“演算”部分，却没有实现“理解”部分；ELIZA 的对话幻觉提醒我们，行为像理解与真的理解之间仍有距离。", "tags": ["ch09"]}, {"id": "f033", "chapterId": "ch09", "front": "ELIZA 的幻觉——一句话说清它是什么？", "back": "ELIZA 用模式匹配把用户的句子改写成问句，例如把“我很难过”变成“你为什么难过”。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "符号处理与大脑——一句话说清它是什么？", "back": "书末把计算机与大脑放在一起看：两者都在分子层面之上做“符号处理”，但计算机的符号是人给的，大脑的符号是进化与学习形成的。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "莱布尼茨之梦的兑现与缺口——一句话说清它是什么？", "back": "兑现的部分：形式语言、可判定性、通用机、存储程序——争论确实可以变成计算。", "tags": ["ch09"]}], "companion": "engines-of-logic学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：莱布尼茨之梦<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明莱布尼茨设想的“普遍语言”要解决什么问题\n<\/li><li>\n能指出这个梦想为什么在当时无法实现\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>莱布尼茨想造一种没有歧义的符号语言，让争论变成计算；这个梦想的方向是对的，缺的是能执行它的机器与能定义“可计算”的数学。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：争论为什么吵不完（难度：基础）<\/h3>\n<p>17 世纪的哲学与神学争论，多半败在语言：同一个词在不同人嘴里意思不同，推理靠自然语言的暗示滑过去。莱布尼茨的方案是造一套<strong>普遍语言<\/strong>（characteristica universalis）：每个概念对应一个符号，推理变成符号的加减组合，两个人吵起来只需坐下来算。<\/p>\n<h3>概念 2：他还缺什么（难度：进阶）<\/h3>\n<p>缺三样：一是概念的分解规则（怎么把复杂概念拆成基本符号），二是计算的执行装置，三是对“什么算得出”的界定。莱布尼茨自己造过一台能加减乘除的机械计算器，但没有程序的概念。这三样要等布尔、图灵、工程师们分别补上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;争论为什么吵不完&quot;]\n  n2[&quot;他还缺什么&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把菜谱写成一串配方编号：只要编号表统一，谁都能复现同一道菜。边界：菜谱的“味道”没法编号，莱布尼茨的梦想也有同样的边界——并非所有意义都能符号化。\n<\/li><li>\n<strong>实例<\/strong>：用符号化重写一句争论：“自由意志与决定论不相容。”拆成 F（有自由意志）、D（一切被决定）、R（两者相容），写成 ¬(F∧D→R) 之类的形式，争论点就变成某个符号的真值，而不是词义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为莱布尼茨预言了计算机——实际上他预言的是符号演算，机器是后来才有的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n莱布尼茨“普遍语言”的核心想法是？\n<ul>\n<li>\nA. 发明世界语\n<\/li><li>\nB. 用无歧义符号把推理变成计算\n<\/li><li>\nC. 建立百科全书\n<\/li><li>\nD. 改良拉丁文\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：目标是让争论可计算，而非造一门自然语言。\n<\/li><li>\n这个梦想在当时缺的关键条件是？\n<\/li><li>\nA. 纸张\n<\/li><li>\nB. 可执行的计算装置与可计算性概念\n<\/li><li>\nC. 数学家太少\n<\/li><li>\nD. 宗教反对\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：缺机器与理论，符号方案本身并不缺。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n梦想：争论 → 计算\n<\/li><li>\n缺：分解规则、执行装置、可计算性定义\n<\/li><li>\n符号化不等于意义全部可编码\n<\/ul>", "ch02": "<h1>第 2 章：布尔把逻辑变成代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用与、或、非写出一个复合命题的真值表\n<\/li><li>\n能说明布尔代数为什么能用电路实现\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>布尔把“真/假”当作 1/0，把“并且/或者/并非”当作乘法、加法、取反，于是逻辑推理变成了可以机械演算的代数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从词到运算符（难度：基础）<\/h3>\n<p><strong>布尔代数<\/strong>（Boolean algebra）把命题的真值看成两个值，把连接词看成运算：与（∧）像乘法，或（∨）像加法但要处理 1+1=1，非（¬）像 1−x。复合命题的真值可以由子命题的真值算出，不必理解内容。这一步把“推理”从语义拉到了语法。<\/p>\n<h3>概念 2：为什么它能变成电路（难度：进阶）<\/h3>\n<p>与门、或门、非门就是这三个运算的物理实现：高电平代表 1，低电平代表 0。任意布尔表达式都能用门电路搭出来，这就是数字电路的基础。逻辑因此第一次有了“可制造”的形态。<\/p>\n<h3>概念 3：布尔的局限（难度：高难）<\/h3>\n<p>布尔代数处理的是命题之间的组合，不能处理“所有”“存在”这类量词，也不能处理关系（“A 大于 B”）。要表达数学证明，需要更强的语言——这正是弗雷格下一章要做的事。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从词到运算符&quot;]\n  n2[&quot;为什么它能变成电路&quot;]\n  n1 --&gt; n2\n  n3[&quot;布尔的局限&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把“如果下雨就带伞”写成电路：雨=1，伞=1，规则是“雨且无伞”为错误状态，报警器一响就说明推理出错。边界：电路只能检查真值组合，不能判断“带伞”是否合理。\n<\/li><li>\n<strong>实例<\/strong>：命题 P=“下雨”，Q=“地湿”。P→Q 等价于 ¬P∨Q。真值表四行：TT→T，TF→F，FT→T，FF→T。只有“下雨但地没湿”这一行是假——这一行就是反例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为布尔代数只是数学玩具——实际上它是所有数字电路与搜索引擎查询语法的底层。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n布尔代数中“与”对应哪种算术运算？\n<ul>\n<li>\nA. 加法\n<\/li><li>\nB. 乘法\n<\/li><li>\nC. 减法\n<\/li><li>\nD. 除法\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：真值 1∧1=1，其余为 0，与乘法一致。\n<\/li><li>\n布尔代数不能处理的是？\n<\/li><li>\nA. 命题连接\n<\/li><li>\nB. 真值计算\n<\/li><li>\nC. 量词与关系\n<\/li><li>\nD. 电路实现\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：量词与关系需要谓词逻辑，弗雷格才补上。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真/假 → 1/0\n<\/li><li>\n与或非 → 乘加取反\n<\/li><li>\n逻辑 → 门电路\n<\/ul>", "ch03": "<h1>第 3 章：弗雷格：从突破到绝望<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明弗雷格的“概念文字”比布尔强在哪\n<\/li><li>\n能复述罗素悖论并指出它击中了什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>弗雷格造出了能表达量词与关系的形式语言，几乎把算术建立在逻辑之上；罗素用一个自指集合把他的地基抽掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：概念文字（难度：进阶）<\/h3>\n<p><strong>概念文字<\/strong>（Begriffsschrift）是弗雷格发明的人工语言：有变量、量词（所有、存在）、谓词与推理规则，能把“每个自然数都有后继”这类句子写成无歧义的形式。它比布尔强的地方在于能表达结构与关系，而不只是命题组合。<\/p>\n<h3>概念 2：逻辑主义计划（难度：进阶）<\/h3>\n<p>弗雷格的目标是证明算术可以从纯逻辑推出——数是“集合的集合”的逻辑构造。如果成功，数学就有了绝对可靠的地基。他在《算术基础》里推进得很远，直到罗素来信。<\/p>\n<h3>概念 3：罗素悖论（难度：高难）<\/h3>\n<p>设 R 为“所有不包含自身的集合组成的集合”。问：R 包含自身吗？若包含，按定义它不该包含；若不包含，按定义它该包含。矛盾。这不是技术细节，它说明“任意性质都能确定一个集合”的朴素原则是错的。弗雷格在附录里承认地基被抽掉。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;概念文字&quot;]\n  n2[&quot;逻辑主义计划&quot;]\n  n1 --&gt; n2\n  n3[&quot;罗素悖论&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个“本店为所有不给自己理发的理发师理发”的招牌：理发师该不该给自己理发？两边都不对。边界：现实里可以加一条规则回避，逻辑系统里加规则就等于改公理。\n<\/li><li>\n<strong>实例<\/strong>：用集合语言复述：设 A={x | x∉x}。若 A∈A，则 A 满足 x∉x，故 A∉A；若 A∉A，则 A 满足 x∉x，故 A∈A。两支都推出矛盾，证明 A 不存在。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为罗素悖论只是文字游戏——实际上它迫使数学界重建集合论公理（如类型论、ZFC）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n弗雷格比布尔多表达的是？\n<ul>\n<li>\nA. 真值表\n<\/li><li>\nB. 量词与关系\n<\/li><li>\nC. 电路\n<\/li><li>\nD. 概率\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：概念文字引入了变量与量词，能表达数学结构。\n<\/li><li>\n罗素悖论否定了哪条朴素原则？\n<\/li><li>\nA. 排中律\n<\/li><li>\nB. 任意性质都能确定一个集合\n<\/li><li>\nC. 无限不存在\n<\/li><li>\nD. 逻辑不可靠\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无限制概括原则导致自指矛盾。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n概念文字：量词 + 关系\n<\/li><li>\n逻辑主义：算术从逻辑推出\n<\/li><li>\n罗素悖论抽掉地基\n<\/ul>", "ch04": "<h1>第 4 章：康托尔：在无限中摸索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释“一一对应”如何用来比较无限的大小\n<\/li><li>\n能说明对角线方法的基本构造\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无限可以比较大小：两个集合能一一对应就是等势；自然数与实数不能一一对应，因此实数比自然数“更多”，而对角线方法给出了证明的通用套路。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：等势：数不过来的东西怎么比（难度：进阶）<\/h3>\n<p><strong>等势<\/strong>（白话：两个集合的元素能一一配对，不剩也不多）。自然数与偶数等势（n↔2n），虽然偶数看起来“少一半”。这说明无限集合可以与自己的一部分等势——这正是无限与有限的根本区别。<\/p>\n<h3>概念 2：对角线：造一个漏网之数（难度：高难）<\/h3>\n<p>假设 0 到 1 之间的实数可以排成一列，每个写成无限小数。构造一个新数：第 1 位取第 1 个数的第 1 位加 1，第 2 位取第 2 个数的第 2 位加 1……得到的新数在每一位上都与对应那个数不同，因此不在列表里。矛盾。所以实数不可数。<\/p>\n<h3>概念 3：连续统假设（难度：高难）<\/h3>\n<p>康托尔证明实数集的基数比自然数大，然后猜测：没有介于两者之间的基数。这就是<strong>连续统假设<\/strong>。他没能证明，希尔伯特把它列为第一问题。后来哥德尔与科恩证明它独立于 ZFC——既不能证也不能否。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;等势：数不过来的东西怎么比&quot;]\n  n2[&quot;对角线：造一个漏网之数&quot;]\n  n1 --&gt; n2\n  n3[&quot;连续统假设&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给无限个座位与无限个人配对：只要能一一坐下就“一样多”，哪怕座位看起来只占一半。边界：现实中没有无限旅馆，这个类比只在集合论里成立。\n<\/li><li>\n<strong>实例<\/strong>：自然数与有理数等势：把有理数排成 p/q 的表格，沿对角线蛇形编号，每个有理数都能得到一个自然数编号。看似“更密”的有理数，其实与自然数一样多。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“无限都一樣大”——实际上有可数无限与不可数无限，层级还能一直往上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断两个无限集合“一样多”的标准是？\n<ul>\n<li>\nA. 元素数量数完比较\n<\/li><li>\nB. 能一一对应\n<\/li><li>\nC. 体积比较\n<\/li><li>\nD. 密度比较\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：等势由双射定义。\n<\/li><li>\n对角线方法的作用是？\n<\/li><li>\nA. 计算极限\n<\/li><li>\nB. 构造一个不在列表中的元素以证明不可数\n<\/li><li>\nC. 求最大公约数\n<\/li><li>\nD. 排序\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：逐位取反保证新对象与每个列出对象都不同。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等势 = 一一对应\n<\/li><li>\n实数不可数（对角线法）\n<\/li><li>\n连续统假设独立于 ZFC\n<\/ul>", "ch05": "<h1>第 5 章：希尔伯特的营救<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出希尔伯特计划的三个目标\n<\/li><li>\n能解释“判定问题”为什么是关键\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面对悖论，希尔伯特提出把数学整体形式化，再用有限的、可靠的方法证明它一致且完备；判定问题（Entscheidungsproblem）是这套计划的执行入口。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：形式主义方案（难度：基础）<\/h3>\n<p>把所有数学写成符号串与推理规则，证明变成符号操作。然后做两件事：<strong>一致性<\/strong>（不会推出矛盾）、<strong>完备性<\/strong>（每个真命题都能证）。这两件事必须用“有限方法”（finitism）来证，不能用有争议的无限工具——否则就是循环论证。<\/p>\n<h3>概念 2：判定问题（难度：进阶）<\/h3>\n<p><strong>判定问题<\/strong>：是否存在一个机械程序，对任意形式命题判定它是否可证？如果有，数学家的工作就可以外包给机器；如果没有，形式主义计划就缺一个关键工具。希尔伯特相信有，并把它列为重大目标。<\/p>\n<h3>概念 3：营救的裂缝（难度：高难）<\/h3>\n<p>布劳威尔等直觉主义者反对排中律在无限情形下使用，希尔伯特视之为威胁。更深的裂缝在于：要证明一个形式系统一致，所需的工具往往比系统本身更强——这使得“用有限方法证明全部数学一致”变得可疑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;形式主义方案&quot;]\n  n2[&quot;判定问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;营救的裂缝&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给一栋漏水的楼做整体加固：先把每块砖编号（形式化），再证明“这栋楼不会塌”（一致性）。边界：加固用的脚手架本身可能比楼更不稳。\n<\/li><li>\n<strong>实例<\/strong>：把“2+2=4”写成形式证明：从皮亚诺公理出发，逐步应用替换与归纳规则，得到符号串。整个证明可以检查，不需要理解“2”是什么——这就是形式化的意义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式化让数学变得无意义——实际上它让证明可机械检查，意义另在解释层。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n希尔伯特计划的两个核心目标是？\n<ul>\n<li>\nA. 简洁与优雅\n<\/li><li>\nB. 一致性与完备性\n<\/li><li>\nC. 速度与存储\n<\/li><li>\nD. 可视化与交互\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：用有限方法证明数学不会矛盾且能证出所有真理。\n<\/li><li>\n判定问题问的是？\n<\/li><li>\nA. 数学题难不难\n<\/li><li>\nB. 是否存在机械程序判定任意命题可证性\n<\/li><li>\nC. 计算机快不快\n<\/li><li>\nD. 公理有多少条\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：Entscheidungsproblem 是可判定性的核心问题。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n形式化：证明 = 符号操作\n<\/li><li>\n两目标：一致、完备\n<\/li><li>\n判定问题是执行入口\n<\/ul>", "ch06": "<h1>第 6 章：哥德尔使计划落空<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出哥德尔第一不完备定理的内容与前提\n<\/li><li>\n能解释“可证性”如何被算术化\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>任何足够强、一致的形式系统都有一条它证不出的真命题；因此“完备性”不可能，希尔伯特计划的核心目标落空。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算术化（难度：进阶）<\/h3>\n<p>哥德尔给每个符号、公式、证明序列分配一个数（<strong>哥德尔编码<\/strong>）。于是“这段符号是证明”变成“这个数满足某个算术关系”，“存在一个证明”变成“存在一个数……”。元数学的陈述被翻译进算术本身。<\/p>\n<h3>概念 2：自指句（难度：高难）<\/h3>\n<p>用对角线技巧构造命题 G：G 断言“不存在编号为 G 的证明”。若系统证出 G，则 G 为假，系统不一致；若系统一致，则 G 不可证，而 G 恰好为真。结论：一致 ⇒ 不完备。<\/p>\n<h3>概念 3：第二定理与影响（难度：高难）<\/h3>\n<p>第二不完备定理更进一步：系统无法在自身内部证明自己的一致。希尔伯特想用有限方法证明数学一致，而这类证明一旦形式化就落在系统内部，于是不可能。戴维斯的叙述强调：这不是数学的失败，而是对“数学能对自己说什么”的边界刻画。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;算术化&quot;]\n  n2[&quot;自指句&quot;]\n  n1 --&gt; n2\n  n3[&quot;第二定理与影响&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个人无法用自己写的简历证明简历全是真的：需要外部见证。边界：外部见证也存在同样的自证问题，所以只能层层外推，没有终点。\n<\/li><li>\n<strong>实例<\/strong>：把“本句不可证”换成算术句：存在一个数 n，它编码了“G 的证明”；G 说“不存在这样的 n”。检查每个 n 都不是证明，就验证了 G 为真——但这个过程不能在系统内部完成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为哥德尔定理说明数学不可靠——实际上它说明数学不能被自身完全把握，可靠性并不因此丧失。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n哥德尔第一定理的前提是系统？\n<ul>\n<li>\nA. 足够弱\n<\/li><li>\nB. 足够强且一致\n<\/li><li>\nC. 完备\n<\/li><li>\nD. 有限\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：强度足以表达算术，一致性保证不证出矛盾。\n<\/li><li>\n第二定理说的是？\n<\/li><li>\nA. 系统能证明自身一致\n<\/li><li>\nB. 系统不能证明自身一致\n<\/li><li>\nC. 系统一定矛盾\n<\/li><li>\nD. 系统一定完备\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：一致性证明若形式化，就落入系统内部，从而受限。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n哥德尔编码：符号 → 数\n<\/li><li>\nG：我不可证 → 真而不可证\n<\/li><li>\n一致 ⇒ 不完备；一致不能自证\n<\/ul>", "ch07": "<h1>第 7 章：图灵构想通用计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述图灵机并解释它如何回答判定问题\n<\/li><li>\n能说明“通用机”与“存储程序”的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图灵把“机械程序”定义为图灵机，证明不存在判定停机的一般程序，从而否定判定问题；同一篇论文里的通用机，成了通用计算机的理论原型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把计算写成机器（难度：进阶）<\/h3>\n<p>图灵机的部件（纸带、读写头、规则表）在《皇帝新脑》一章已出现过，这里重点不同：图灵要的是一个<strong>定义<\/strong>，而不是一台机器。定义清楚后，“可计算”就有了精确含义：图灵可计算。<\/p>\n<h3>概念 2：停机问题否定判定问题（难度：高难）<\/h3>\n<p>如果存在判定任意命题可证性的程序，就能判定任意图灵机是否停机（把停机问题编码成命题）。图灵证明停机不可判定，因此判定问题无解。希尔伯特计划失去执行工具。<\/p>\n<h3>概念 3：通用机：一台机器模拟所有机器（难度：高难）<\/h3>\n<p>把某台机器的规则表编码到纸带上，通用机读它并模拟之。这意味着“程序”可以作为数据被处理——这正是后来存储程序计算机的思想核心。图灵 1936 年的论文因此不只是数学，它是计算机的出生证明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;把计算写成机器&quot;]\n  n2[&quot;停机问题否定判定问题&quot;]\n  n1 --&gt; n2\n  n3[&quot;通用机：一台机器模拟所有机器&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台能读任何乐谱并演奏的自动钢琴：乐谱是数据，钢琴是通用机。边界：钢琴仍需机械结构，图灵机把结构抽象掉了。\n<\/li><li>\n<strong>实例<\/strong>：把“加法机”的规则表编号写成 0/1 串，喂给通用机；通用机按串里的规则移动读写头，输出和。整个过程没有专门的加法硬件，只有通用规则。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为图灵机只是理论玩具——实际上它定义了“可计算”，并直接启发了真实计算机的架构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n图灵证明判定问题无解，靠的是？\n<ul>\n<li>\nA. 造出更快的机器\n<\/li><li>\nB. 停机问题不可判定\n<\/li><li>\nC. 哥德尔第二定理直接套用\n<\/li><li>\nD. 实验测量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：把判定问题归约到停机问题，后者不可解。\n<\/li><li>\n通用图灵机的意义在于？\n<\/li><li>\nA. 速度最快\n<\/li><li>\nB. 程序可作为数据被模拟\n<\/li><li>\nC. 不需要纸带\n<\/li><li>\nD. 只能算加法\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是存储程序思想的理论来源。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图灵机 = 可计算的精确定义\n<\/li><li>\n停机不可判定 ⇒ 判定问题无解\n<\/li><li>\n通用机 = 存储程序原型\n<\/ul>", "ch08": "<h1>第 8 章：研制第一批通用计算机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出 ENIAC 与 ACE 的设计差别\n<\/li><li>\n能解释“存储程序”为什么是分水岭\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>ENIAC 用插线与开关编程，算得快但改程序极慢；ACE 沿用图灵的存储程序设想，把指令放进存储器，从此改程序只需改数据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ENIAC：电子管的速度（难度：基础）<\/h3>\n<p>ENIAC 用真空管做运算，每秒能完成数千次加法，比机电式机器快几个数量级。但它的“程序”体现为插线板与开关位置，换一个任务要重新接线，几天才能改好。<\/p>\n<h3>概念 2：存储程序的分水岭（难度：进阶）<\/h3>\n<p>把指令与数据放在同一个可寻址存储器里，机器就能读指令并执行——这是<strong>存储程序<\/strong>（stored program）。它让“通用”从理论变成工程：同一台机器，换一份程序就能做完全不同的事。<\/p>\n<h3>概念 3：图灵的 ACE 与极简主义（难度：高难）<\/h3>\n<p>图灵设计的 ACE 追求极简：用最少的硬件，把复杂度放到程序里。戴维斯指出这种极简思路对当时工程影响有限，但它预示了微程序设计——用软件实现硬件指令。历史选择了另一条路：硬件更复杂，软件更通用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;ENIAC：电子管的速度&quot;]\n  n2[&quot;存储程序的分水岭&quot;]\n  n1 --&gt; n2\n  n3[&quot;图灵的 ACE 与极简主义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台可换卡带的游戏机：卡带是程序，机器是通用硬件。边界：早期计算机换“卡带”要重新接线，存储程序才真正实现即换即用。\n<\/li><li>\n<strong>实例<\/strong>：同一台存储程序计算机，装入排序程序就排序，装入求解方程程序就解方程；ENIAC 做同样两件事要两次重新插线。这个差别就是通用性的实际含义。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为第一台计算机就是“通用”的——实际上 ENIAC 是专用接线式，存储程序才是通用的起点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nENIAC 编程主要靠？\n<ul>\n<li>\nA. 键盘输入\n<\/li><li>\nB. 插线与开关\n<\/li><li>\nC. 纸带\n<\/li><li>\nD. 语音\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：改任务需重新接线，耗时很长。\n<\/li><li>\n存储程序的关键是？\n<\/li><li>\nA. 指令与数据存放在可寻址存储器\n<\/li><li>\nB. 使用晶体管\n<\/li><li>\nC. 提高主频\n<\/li><li>\nD. 增加显示器\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：指令成为可读取的数据，机器因此通用。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nENIAC：快，但改程序靠接线\n<\/li><li>\n存储程序：指令即数据\n<\/li><li>\nACE 极简主义预示微程序\n<\/ul>", "ch09": "<h1>第 9 章：超越莱布尼茨之梦<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 ELIZA 揭示了什么、又误导了什么\n<\/li><li>\n能判断“机器能思考吗”这个问题在什么意义上仍未解决\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算机实现了莱布尼茨的“演算”部分，却没有实现“理解”部分；ELIZA 的对话幻觉提醒我们，行为像理解与真的理解之间仍有距离。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ELIZA 的幻觉（难度：基础）<\/h3>\n<p>ELIZA 用模式匹配把用户的句子改写成问句，例如把“我很难过”变成“你为什么难过”。它没有任何语义模型，却让不少用户以为它懂自己。戴维斯用这段真实对话说明：<strong>行为层面的相似<\/strong>极易被误读为理解。<\/p>\n<h3>概念 2：符号处理与大脑（难度：进阶）<\/h3>\n<p>书末把计算机与大脑放在一起看：两者都在分子层面之上做“符号处理”，但计算机的符号是人给的，大脑的符号是进化与学习形成的。戴维斯不否认机器智能的可能，只提醒“实现演算”与“拥有心灵”不是同一件事。<\/p>\n<h3>概念 3：莱布尼茨之梦的兑现与缺口（难度：高难）<\/h3>\n<p>兑现的部分：形式语言、可判定性、通用机、存储程序——争论确实可以变成计算。缺口：概念如何被分解、意义从哪来、意识如何出现。戴维斯把这三项留给后来者，不给廉价结论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;ELIZA 的幻觉&quot;]\n  n2[&quot;符号处理与大脑&quot;]\n  n1 --&gt; n2\n  n3[&quot;莱布尼茨之梦的兑现与缺口&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台会自动回复的客服机器人：话术对得上，理解不一定在。边界：真人客服也可能只背话术，所以“像”与“是”的界线不靠行为判定。\n<\/li><li>\n<strong>实例<\/strong>：输入“我觉得没人喜欢我”，ELIZA 回“你觉得没人喜欢你吗？”——语法正确、情绪贴合，但它没有“喜欢”的概念。把输入换成“我觉得没人恨我”，它同样能套模板，语义却反了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为通过图灵测试就等于有意识——实际上测试只检验行为不可区分，不检验内部机制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nELIZA 的工作方式是？\n<ul>\n<li>\nA. 语义理解\n<\/li><li>\nB. 模式匹配与句式改写\n<\/li><li>\nC. 神经网络训练\n<\/li><li>\nD. 逻辑推理\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它没有语义模型，只按模板重组句子。\n<\/li><li>\n戴维斯对“机器能思考吗”的态度接近？\n<\/li><li>\nA. 已经完全实现\n<\/li><li>\nB. 行为相似不等于理解，问题仍开放\n<\/li><li>\nC. 绝不可能\n<\/li><li>\nD. 只是语言问题\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他区分演算与心灵，不下绝对结论。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nELIZA：模式匹配制造理解幻觉\n<\/li><li>\n计算机实现了演算，未实现意义\n<\/li><li>\n行为相似 ≠ 内部理解\n<\/ul>", "c01": "<h1>形式化与判定问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 05 章、第 06 章、第 07 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把数学写成符号系统，并追问是否存在机械程序判定任意命题的可证性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整本书的枢纽：往前接弗雷格与康托尔，往后接哥德尔与图灵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>形式化的三件套：字母表、形成规则（什么是合法公式）、推理规则。<\/p>\n<p>判定问题要求一个对所有输入都终止、输出真/假的程序。<\/p>\n<p>历史结局：哥德尔否定了完备性，图灵否定了可判定性。两者合起来终结了希尔伯特计划的原版。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为形式化等于把数学变成无意义的符号——它只是把“可检查”与“可理解”分开。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>希尔伯特<\/td><td>提出计划<\/td><\/tr><tr><td>ch07<\/td><td>图灵<\/td><td>否定判定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n哥德尔不完备、图灵机\n<\/ul>", "c02": "<h1>自指与对角线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用“对象指涉自身”的构造制造矛盾或证明不可能性，对角线是它最常用的技术形式。<\/p>\n<h2>为什么重要<\/h2>\n<p>罗素悖论、康托尔不可数、哥德尔句、停机问题共用同一个骨架。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种形态：集合自属（罗素）、逐位取反（康托尔）、命题自指（哥德尔）。<\/p>\n<p>共同步骤：假设存在一个完备的列表/系统；构造一个“与每一项都不同”的对象；导出矛盾。<\/p>\n<p>用途：不是制造麻烦，而是划定边界——哪些列表不可能存在，哪些系统不可能完备。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对角线只是技巧——它是关于“自我指涉”的一般方法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>罗素悖论<\/td><td>集合自指<\/td><\/tr><tr><td>ch06<\/td><td>哥德尔<\/td><td>命题自指<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n罗素悖论、哥德尔句、停机问题\n<\/ul>", "c03": "<h1>可计算性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 07 章、第 08 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个函数可计算，当且仅当存在图灵机对任意输入都在有限步内给出输出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“算法”从直觉变成定义，使“不存在程序”这类命题可以被证明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>丘奇-图灵论题：直觉可计算 = 图灵可计算。它不是定理，而是被广泛接受的界定。<\/p>\n<p>不可计算的典型：停机问题、某些丢番图方程可解性判定。<\/p>\n<p>工程含义：可计算不等于可实行，复杂度与资源另算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为不可计算等于没人算得出来——它指不存在任何算法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>图灵<\/td><td>定义与否定<\/td><\/tr><tr><td>ch08<\/td><td>ACE<\/td><td>工程实现<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n图灵机、停机问题、存储程序\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：莱布尼茨之梦<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch01\">第 1 章 莱布尼茨之梦<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：布尔把逻辑变成代数<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch02\">第 2 章 布尔把逻辑变成代数<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：弗雷格：从突破到绝望<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch03\">第 3 章 弗雷格：从突破到绝望<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：康托尔：在无限中摸索<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch04\">第 4 章 康托尔：在无限中摸索<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：希尔伯特的营救<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch05\">第 5 章 希尔伯特的营救<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：哥德尔使计划落空<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch06\">第 6 章 哥德尔使计划落空<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：图灵构想通用计算机<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch07\">第 7 章 图灵构想通用计算机<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：研制第一批通用计算机<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch08\">第 8 章 研制第一批通用计算机<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：超越莱布尼茨之梦<\/strong><br>阅读：<a href=\"#/book/engines-of-logic/chapter/ch09\">第 9 章 超越莱布尼茨之梦<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章 莱布尼茨之梦<\/h2><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 莱布尼茨“普遍语言”的核心想法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 发明世界语<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 用无歧义符号把推理变成计算<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 建立百科全书<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 改良拉丁文<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 这个梦想在当时缺的关键条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 纸张<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 可执行的计算装置与可计算性概念<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 数学家太少<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 宗教反对<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章 布尔把逻辑变成代数<\/h2><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 布尔代数中“与”对应哪种算术运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 加法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 乘法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 减法<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 除法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><
