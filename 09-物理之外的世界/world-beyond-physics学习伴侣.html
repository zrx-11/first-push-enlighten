<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理之外的世界</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>

<div class="layout">
  <aside class="sidebar">
    <h1>物理之外的世界</h1>
    <div class="sub">考夫曼：生命、功能与经济的“相邻可能”</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>

  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>

  </main>
</div>

const DATA = {"manifest": {"slug": "world-beyond-physics", "title": "物理之外的世界", "subtitle": "考夫曼：生命、功能与经济的“相邻可能”", "book": {"title": "物理之外的世界", "author": "斯图尔特·考夫曼（Stuart Kauffman）", "source": ["第一推动丛书·综合系列（2022年版）"]}, "audience": "零基础", "goal": "读完能说清“相邻可能”“约束闭合”“使之成为可能而非导致”这三个概念，并用它们解释生命起源与经济演化为什么不可预测", "learningPath": [{"step": "01", "title": "世界不是一台机器", "chapterIds": ["ch01"], "checkpoint": "完成第 1 章自测题，答对 2 题以上"}, {"step": "02", "title": "功能的功能", "chapterIds": ["ch02"], "checkpoint": "完成第 2 章自测题，答对 2 题以上"}, {"step": "03", "title": "传播组织", "chapterIds": ["ch03"], "checkpoint": "完成第 3 章自测题，答对 2 题以上"}, {"step": "04", "title": "解密生命", "chapterIds": ["ch04"], "checkpoint": "完成第 4 章自测题，答对 2 题以上"}, {"step": "05", "title": "如何制造新陈代谢", "chapterIds": ["ch05"], "checkpoint": "完成第 5 章自测题，答对 2 题以上"}, {"step": "06", "title": "原初细胞", "chapterIds": ["ch06"], "checkpoint": "完成第 6 章自测题，答对 2 题以上"}, {"step": "07", "title": "可遗传变异", "chapterIds": ["ch07"], "checkpoint": "完成第 7 章自测题，答对 2 题以上"}, {"step": "08", "title": "我们玩的游戏", "chapterIds": ["ch08"], "checkpoint": "完成第 8 章自测题，答对 2 题以上"}, {"step": "09", "title": "舞台已经搭好了", "chapterIds": ["ch09"], "checkpoint": "完成第 9 章自测题，答对 2 题以上"}, {"step": "10", "title": "扩展适应和螺丝刀", "chapterIds": ["ch10"], "checkpoint": "完成第 10 章自测题，答对 2 题以上"}, {"step": "11", "title": "物理之外的世界", "chapterIds": ["ch11"], "checkpoint": "完成第 11 章自测题，答对 2 题以上"}], "chapters": [{"id": "ch01", "title": "第 1 章 世界不是一台机器", "file": "chapters/ch01-世界不是一台机器.md", "difficulty": 3}, {"id": "ch02", "title": "第 2 章 功能的功能", "file": "chapters/ch02-功能的功能.md", "difficulty": 3}, {"id": "ch03", "title": "第 3 章 传播组织", "file": "chapters/ch03-传播组织.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章 解密生命", "file": "chapters/ch04-解密生命.md", "difficulty": 3}, {"id": "ch05", "title": "第 5 章 如何制造新陈代谢", "file": "chapters/ch05-如何制造新陈代谢.md", "difficulty": 3}, {"id": "ch06", "title": "第 6 章 原初细胞", "file": "chapters/ch06-原初细胞.md", "difficulty": 3}, {"id": "ch07", "title": "第 7 章 可遗传变异", "file": "chapt "type": "single", "question": "DNA 不能编码的是？", "options": ["氨基酸序列", "碱基配对", "折叠与代谢环境", "三联体密码"], "answer": 2, "explain": "三维结构与动态环境不在线性序列里。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "自催化集合的关键特征是？", "options": ["产物催化自身生成", "需要外部催化剂", "不耗能", "只含一种分子"], "answer": 0, "explain": "闭环催化是定义特征。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "原初细胞假说中，膜的作用是？", "options": ["储存基因", "提供边界与浓度梯度", "提供能量", "传递信号"], "answer": 1, "explain": "边界是约束闭合的物理前提。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "“组成遗传”指的是？", "options": ["基因突变", "分裂时组分分配差异被传递", "水平转移", "染色体交换"], "answer": 1, "explain": "不必依赖核酸序列。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "“三和弦”不包括？", "options": ["感觉", "评价", "行动", "记忆"], "answer": 3, "explain": "三和弦是感觉-评价-行动的循环。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "考夫曼认为选择单位是？", "options": ["基因", "生物体", "种群", "生态位"], "answer": 1, "explain": "基因是搭车者，生物体被选择。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "“使之成为可能”强调的是？", "options": ["必然导致", "提供可行路径但非必然", "随机", "设计"], "answer": 1, "explain": "它是可能性关系，不是因果决定关系。"}, {"id": "ch11-q1", "chapterId": "ch11", "type": "single", "question": "“相邻可能”指的是？", "options": ["所有可能状态", "从当前状态一步可达的状态集合", "未来预测", "随机突变"], "answer": 1, "explain": "它随历史扩大，边界由当前状态决定。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "考夫曼论证“物理不能推出生命”的核心依据是？", "options": ["物理定律错误", "宇宙非遍历，组合空间远未穷尽", "生命没有规律", "实验不足"], "answer": 1, "explain": "尝试次数远小于组合数，路径不可从定律推出。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "“约束闭合”与普通反馈的关键区别是？", "options": ["有变量", "闭合的是维持条件而非仅变量循环", "需要能量", "发生在细胞内"], "answer": 1, "explain": "约束互相生产是定义特征。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "用“相邻可能”解释经济增长，最恰当的说法是？", "options": ["增长可精确预测", "新商品把一批新商品变为可能", "增长靠资本投入", "技术是外生变量"], "answer": 1, "explain": "每一步扩大边界，整体路径不可事前推出。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "宇宙的粒子数与时间都有限，从未把可能的分子组合试完；因此生命不是被定律“算出来”的，而是在未遍历的空间里长出来的。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "数量级论证——一句话说清它是什么？", "back": "宇宙约 10^17 秒、10^80 个粒子。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "非遍历的含义——一句话说清它是什么？", "back": "**遍历**（ergodic）指系统最终会走遍所有状态。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "机器隐喻的破产——一句话说清它是什么？", "back": "把世界当机器，预设了“初始条件 + 定律 → 全部未来”。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "功能是相对于“维持某个整体”而言的；物理只能给出结构，不能预言哪个结构会被选中成为功能，因此功能在出现前不可推导。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "功能的定义——一句话说清它是什么？", "back": "一个部件的作用由它在整体中的角色决定：眼睛的功能是看，因为它帮助生物体生存。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "不可预言性——一句话说清它是什么？", "back": "在眼睛出现前，物理不会告诉你“会有一种器官用于成像”。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "生命传播的不是分子，而是“约束闭合”的组织：一组约束相互维持，使整体持续存在。", "tags": ["ch03"]}, {"id": "f009", "chapterId": "ch03", "front": "约束闭合——一句话说清它是什么？", "back": "蒙特维尔与莫西奥的**约束闭合**（constraint closure）：每个约束由其他约束维持，整个集合自我维持。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "传播组织——一句话说清它是什么？", "back": "繁殖传下去的是这套闭环关系，不只是 DNA。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "与物理的区别——一句话说清它是什么？", "back": "物理系统可以有关闭的因果环（如反馈），但约束闭合强调“约束”这一层：不是变量在循环，而是维持循环的条件在互相生产。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "DNA 是线性序列，按碱基配对复制；但生命是三维的约束闭合系统，序列只是其中一层信息。", "tags": ["ch04"]}, {"id": "f013", "chapterId": "ch04", "front": "代码层——一句话说清它是什么？", "back": "A-T、C-G 配对使复制可靠。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "代码之外——一句话说清它是什么？", "back": "折叠、膜结构、代谢流、空间位置都不在序列里。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "代谢是一张自催化网络：反应的产物反过来催化生成它的反应；网络靠外部能量梯度驱动，靠约束闭合维持。", "tags": ["ch05"]}, {"id": "f016", "chapterId": "ch05", "front": "自催化——一句话说清它是什么？", "back": "**自催化集合**（autocatalytic set）：每个分子的生成至少被集合内另一个分子催化，整体不依赖外部催化剂。", "tags": ["ch05"]}, {"id": "f017", "chapterId": "ch05", "front": "能量流——一句话说清它是什么？", "back": "自催化只解决“怎么维持结构”，还需要“怎么驱动”。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "热泉边的脂质体在干湿交替中反复聚合、分裂，可能先形成能自我维持的膜结构，再容纳代谢与遗传。", "tags": ["ch06"]}, {"id": "f019", "chapterId": "ch06", "front": "三步循环——一句话说清它是什么？", "back": "湿润时脂质体是囊泡。", "tags": ["ch06"]}, {"id": "f020", "chapterId": "ch06", "front": "为什么膜先——一句话说清它是什么？", "back": "膜提供空间边界与浓度梯度，是约束闭合的物理前提。", "tags": ["ch06"]}, {"id": "f021", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "自催化集体在分裂时会把组分分配不匀，产生组成差异；这种差异可被选择，因此遗传与变异可以早于 DNA 出现。", "tags": ["ch07"]}, {"id": "f022", "chapterId": "ch07", "front": "分配不均——一句话说清它是什么？", "back": "囊泡分裂时，内部的分子的数量随机分配。", "tags": ["ch07"]}, {"id": "f023", "chapterId": "ch07", "front": "选择的作用——一句话说清它是什么？", "back": "更稳定的集体分裂得更久、留下更多后代。", "tags": ["ch07"]}, {"id": "f024", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "生命体的基本循环是：感知世界、评价对自身有利与否、采取行动；情绪是这三步最早整合成一体的形式。", "tags": ["ch08"]}, {"id": "f025", "chapterId": "ch08", "front": "三和弦——一句话说清它是什么？", "back": "考夫曼借用凯瑟琳·考夫曼的说法：**感觉**（sense）、**评价**（evaluate）、**行动**（act）构成一个循环。", "tags": ["ch08"]}, {"id": "f026", "chapterId": "ch08", "front": "情绪的位置——一句话说清它是什么？", "back": "情绪把“对我有利/有害”直接编码成可行动的状态，比符号推理更早。", "tags": ["ch08"]}, {"id": "f027", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "选择作用于完整的生物体，基因只是搭车；生态位提供机会，但不导致新物种出现。", "tags": ["ch09"]}, {"id": "f028", "chapterId": "ch09", "front": "选择单位——一句话说清它是什么？", "back": "道金斯式“自私的基因”把基因当选择单位。", "tags": ["ch09"]}, {"id": "f029", "chapterId": "ch09", "front": "生态位——一句话说清它是什么？", "back": "**生态位**（niche）是生物在群落中的资源与角色。", "tags": ["ch09"]}, {"id": "f030", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "演化不是“前者导致后者”，而是“前者使后者成为可能”；扩展适应就是旧结构被新用途征用。", "tags": ["ch10"]}, {"id": "f031", "chapterId": "ch10", "front": "enablement vs entailment——一句话说清它是什么？", "back": "**使之成为可能**（enablement）：A 出现后，B 有了可行的路径，但 B 不是 A 的必然结果。", "tags": ["ch10"]}, {"id": "f032", "chapterId": "ch10", "front": "扩展适应——一句话说清它是什么？", "back": "**扩展适应**（exaptation）：为一种功能演化的结构，被另一种功能征用。", "tags": ["ch10"]}, {"id": "f033", "chapterId": "ch11", "front": "第 11 章一句话核心是什么？", "back": "经济像生物圈：每出现一种商品，就把一批新商品变成“相邻可能”；增长不是被算出来的，是被一步步打开的。", "tags": ["ch11"]}, {"id": "f034", "chapterId": "ch11", "front": "相邻可能——一句话说清它是什么？", "back": "**相邻可能**（adjacent possible）：从当前状态出发，下一步可达到的状态集合。", "tags": ["ch11"]}, {"id": "f035", "chapterId": "ch11", "front": "经济同构——一句话说清它是什么？", "back": "个人电脑使路由器与文件共享成为可能，后者使互联网、电商、搜索成为可能。", "tags": ["ch11"]}, {"id": "f036", "chapterId": "ch11", "front": "理论的缺口——一句话说清它是什么？", "back": "主流增长理论把技术当外生变量或用生产函数拟合，无法解释“新商品从哪来”。", "tags": ["ch11"]}], "companion": "world-beyond-physics学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：世界不是一台机器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能算出“宇宙远未遍历所有可能”的数量级论证\n<\/li><li>\n能说明非遍历性如何否证“物理可推出生命”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>宇宙的粒子数与时间都有限，从未把可能的分子组合试完；因此生命不是被定律“算出来”的，而是在未遍历的空间里长出来的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数量级论证（难度：进阶）<\/h3>\n<p>宇宙约 10^17 秒、10^80 个粒子；最小时间单位是普朗克时间 10^-43 秒。若每个粒子每普朗克时间试一种状态，总尝试次数仍远小于可能的蛋白质序列数（20 种氨基酸、长度数百，组合数是天文量级）。<\/p>\n<h3>概念 2：非遍历的含义（难度：高难）<\/h3>\n<p><strong>遍历<\/strong>（ergodic）指系统最终会走遍所有状态。考夫曼指出宇宙不是遍历的：绝大多数组合从未出现，也不会出现。物理定律给的是允许空间，不是实际走过的路径。<\/p>\n<h3>概念 3：机器隐喻的破产（难度：进阶）<\/h3>\n<p>把世界当机器，预设了“初始条件 + 定律 → 全部未来”。非遍历性破坏了这个预设：未来有一部分是历史上从未出现的新组合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;数量级论证&quot;]\n  n2[&quot;非遍历的含义&quot;]\n  n1 --&gt; n2\n  n3[&quot;机器隐喻的破产&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一个只玩了百万分之一的棋局：规则固定，但走过的棋路极少。边界：棋盘状态可枚举，分子组合不可枚举。\n<\/li><li>\n<strong>实例<\/strong>：20 种氨基酸、长度 300 的蛋白链，组合数约 20^300 ≈ 10^390；宇宙总尝试次数约 10^80 × 10^17 / 10^-43 ≈ 10^140。两者相差 250 个数量级。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为非遍历性只是“算不过来”——它是原则上没走完，所以结果不能从定律推出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n考夫曼用数量级论证想说明？\n<ul>\n<li>\nA. 宇宙很小\n<\/li><li>\nB. 宇宙远未遍历所有分子组合\n<\/li><li>\nC. 蛋白质不重要\n<\/li><li>\nD. 量子力学错误\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：尝试次数远小于组合数，遍历不成立。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n宇宙非遍历\n<\/li><li>\n定律给允许空间，不给实际路径\n<\/li><li>\n机器隐喻破产\n<\/ul>", "kind": "chapter", "title": "第 1 章 世界不是一台机器"}, "ch02": {"html": "<h1>第 2 章：功能的功能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“功能”为什么在物理层面不可预言\n<\/li><li>\n能解释“功能的功能”这一说法\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>功能是相对于“维持某个整体”而言的；物理只能给出结构，不能预言哪个结构会被选中成为功能，因此功能在出现前不可推导。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：功能的定义（难度：进阶）<\/h3>\n<p>一个部件的作用由它在整体中的角色决定：眼睛的功能是看，因为它帮助生物体生存。同样的结构换个整体，功能就变。<\/p>\n<h3>概念 2：不可预言性（难度：高难）<\/h3>\n<p>在眼睛出现前，物理不会告诉你“会有一种器官用于成像”。功能是事后归因，不是事前推导。这就是“功能的功能”：功能本身有层级，且层级在演化中不断新增。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;功能的定义&quot;]\n  n2[&quot;不可预言性&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一把螺丝刀：物理上是一根带扭力的杆，功能上取决于你拿它拧什么。边界：螺丝刀的用途可穷举，生物功能的新层级不行。\n<\/li><li>\n<strong>实例<\/strong>：中耳的三块小骨由鱼的鳃弓演化而来，听觉功能是后来“用上”的。这套结构在鱼身上不是为听声音存在的。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为功能是设计出来的——多数功能是旧结构在新整体中的新角色。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“功能不可预言”的意思是？\n<ul>\n<li>\nA. 功能不存在\n<\/li><li>\nB. 物理不能事前推出哪个结构会成为功能\n<\/li><li>\nC. 功能都一样\n<\/li><li>\nD. 功能由基因决定\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：功能是事后归因，依赖整体与选择。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n功能 = 部件在整体中的角色\n<\/li><li>\n物理给结构，不给功能\n<\/li><li>\n功能层级不断新增\n<\/ul>", "kind": "chapter", "title": "第 2 章 功能的功能"}, "ch03": {"html": "<h1>第 3 章：传播组织<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“约束闭合”是什么意思\n<\/li><li>\n能解释为什么生命传播的是组织而非物质\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命传播的不是分子，而是“约束闭合”的组织：一组约束相互维持，使整体持续存在。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：约束闭合（难度：高难）<\/h3>\n<p>蒙特维尔与莫西奥的<strong>约束闭合<\/strong>（constraint closure）：每个约束由其他约束维持，整个集合自我维持。例如细胞膜维持代谢，代谢合成膜脂，形成闭环。<\/p>\n<h3>概念 2：传播组织（难度：进阶）<\/h3>\n<p>繁殖传下去的是这套闭环关系，不只是 DNA。DNA 是模板，但没有膜、酶、能量流，模板什么也做不了。<\/p>\n<h3>概念 3：与物理的区别（难度：高难）<\/h3>\n<p>物理系统可以有关闭的因果环（如反馈），但约束闭合强调“约束”这一层：不是变量在循环，而是维持循环的条件在互相生产。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;约束闭合&quot;]\n  n2[&quot;传播组织&quot;]\n  n1 --&gt; n2\n  n3[&quot;与物理的区别&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家公司：传下去的不是办公室，是“谁给谁供货、谁付谁工资”的关系网。边界：公司可以破产，细胞不能暂停。\n<\/li><li>\n<strong>实例<\/strong>：膜脂由代谢途径合成，代谢酶由膜内环境维持活性，能量由外部梯度供给。三者互为条件，缺一即崩。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“组织”是抽象比喻——它是可操作的结构条件：每个约束都有其他约束支撑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“约束闭合”强调？\n<ul>\n<li>\nA. 变量循环\n<\/li><li>\nB. 约束相互维持形成闭环\n<\/li><li>\nC. 基因决定\n<\/li><li>\nD. 能量守恒\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：闭合的是维持条件，不只是变量。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生命传播组织\n<\/li><li>\n约束闭合 = 互为条件\n<\/li><li>\nDNA 需要膜与代谢才起作用\n<\/ul>", "kind": "chapter", "title": "第 3 章 传播组织"}, "ch04": {"html": "<h1>第 4 章：解密生命<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 DNA 作为“代码”的限度\n<\/li><li>\n能解释为什么“读懂序列”不等于“造出生命”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 是线性序列，按碱基配对复制；但生命是三维的约束闭合系统，序列只是其中一层信息。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：代码层（难度：进阶）<\/h3>\n<p>A-T、C-G 配对使复制可靠；三联体密码把序列映射到氨基酸。这一层确实是“数字”的，可读、可编辑。<\/p>\n<h3>概念 2：代码之外（难度：高难）<\/h3>\n<p>折叠、膜结构、代谢流、空间位置都不在序列里。把 DNA 当全部程序，等于把建筑图纸当建筑。考夫曼据此说：解释生命不能只靠“解密基因组”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;代码层&quot;]\n  n2[&quot;代码之外&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像乐谱与演奏：谱子能复制，但没有乐器、演奏者与 acoustics，音乐不会出现。边界：乐谱不编码演奏者的身体，DNA 也不编码细胞环境。\n<\/li><li>\n<strong>实例<\/strong>：把一条基因转入大肠杆菌能生产胰岛素，前提是宿主细胞提供核糖体、能量与折叠环境。换一个没有这些条件的试管，序列什么也不做。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因组测完就能“造生命”——序列是必要信息，不是充分条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDNA 不能编码的是？\n<ul>\n<li>\nA. 氨基酸序列\n<\/li><li>\nB. 碱基配对\n<\/li><li>\nC. 折叠与代谢环境\n<\/li><li>\nD. 三联体密码\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：三维结构与动态环境不在线性序列里。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDNA = 线性代码层\n<\/li><li>\n生命 = 三维约束闭合\n<\/li><li>\n序列必要不充分\n<\/ul>", "kind": "chapter", "title": "第 4 章 解密生命"}, "ch05": {"html": "<h1>第 5 章：如何制造新陈代谢<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自催化集合如何维持代谢\n<\/li><li>\n能解释能量流在代谢中的位置\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>代谢是一张自催化网络：反应的产物反过来催化生成它的反应；网络靠外部能量梯度驱动，靠约束闭合维持。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：自催化（难度：进阶）<\/h3>\n<p><strong>自催化集合<\/strong>（autocatalytic set）：每个分子的生成至少被集合内另一个分子催化，整体不依赖外部催化剂。考夫曼用随机图论证：当分子种类与反应数超过阈值，自催化集合几乎必然出现。<\/p>\n<h3>概念 2：能量流（难度：进阶）<\/h3>\n<p>自催化只解决“怎么维持结构”，还需要“怎么驱动”。反应物化学能高于产物，能量沿链条下降，外部输入补上顶端。没有能量流，闭环会停。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;自催化&quot;]\n  n2[&quot;能量流&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一支能自己招人的球队：老队员推荐新队员，队伍不靠外部招聘也能维持。边界：球队需要联赛收入，网络需要能量输入。\n<\/li><li>\n<strong>实例<\/strong>：糖酵解途径中，部分中间产物参与调控上游反应；把关键酶去掉，整条链停摆。自催化与能量流两条都要满足。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自催化等于生命——它只是代谢的骨架，还需要膜与遗传机制。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自催化集合的关键特征是？\n<ul>\n<li>\nA. 产物催化自身生成\n<\/li><li>\nB. 需要外部催化剂\n<\/li><li>\nC. 不耗能\n<\/li><li>\nD. 只含一种分子\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：闭环催化是定义特征。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n代谢 = 自催化网络\n<\/li><li>\n靠能量梯度驱动\n<\/li><li>\n自催化≠生命\n<\/ul>", "kind": "chapter", "title": "第 5 章 如何制造新陈代谢"}, "ch06": {"html": "<h1>第 6 章：原初细胞<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述原初细胞的干湿循环三步\n<\/li><li>\n能说明为什么膜是先于基因的可能起点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>热泉边的脂质体在干湿交替中反复聚合、分裂，可能先形成能自我维持的膜结构，再容纳代谢与遗传。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三步循环（难度：基础）<\/h3>\n<p>湿润时脂质体是囊泡；近干时聚成胶状；附着矿物干燥时重新组装成多层膜。每一轮都可能把内容物包进去、把膜分裂开。<\/p>\n<h3>概念 2：为什么膜先（难度：进阶）<\/h3>\n<p>膜提供空间边界与浓度梯度，是约束闭合的物理前提。没有边界，自催化网络会被稀释掉。基因可以后到，边界不能缺。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三步循环&quot;]\n  n2[&quot;为什么膜先&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用反复干湿的泥巴捏出小碗：每一轮都留下更规整的形状。边界：泥碗不会自己装进代谢系统，脂质体可能。\n<\/li><li>\n<strong>实例<\/strong>：实验室中用脂质与矿物表面模拟干湿循环，可观察到囊泡的形成、融合与分裂。这是“原初细胞”假说的实验支撑之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为原初细胞一定先有 RNA——膜与代谢可能先行，遗传机制后嵌入。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n原初细胞假说中，膜的作用是？\n<ul>\n<li>\nA. 储存基因\n<\/li><li>\nB. 提供边界与浓度梯度\n<\/li><li>\nC. 提供能量\n<\/li><li>\nD. 传递信号\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：边界是约束闭合的物理前提。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n干湿循环三步\n<\/li><li>\n膜先于基因的可能\n<\/li><li>\n边界是约束闭合前提\n<\/ul>", "kind": "chapter", "title": "第 6 章 原初细胞"}, "ch07": {"html": "<h1>第 7 章：可遗传变异<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明自催化集体如何产生可遗传变异\n<\/li><li>\n能解释“变异”不必依赖基因突变\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自催化集体在分裂时会把组分分配不匀，产生组成差异；这种差异可被选择，因此遗传与变异可以早于 DNA 出现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分配不均（难度：进阶）<\/h3>\n<p>囊泡分裂时，内部的分子的数量随机分配；某些集体因此获得更有利于维持的组成比例。这就是<strong>组成遗传<\/strong>（compositional heredity）。<\/p>\n<h3>概念 2：选择的作用（难度：进阶）<\/h3>\n<p>更稳定的集体分裂得更久、留下更多后代。选择不需要基因，只需要“复制 + 变异 + 差异生存”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;分配不均&quot;]\n  n2[&quot;选择的作用&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像分汤时每碗料不一样：味道有差异，好喝的会被再做。边界：汤不会自我复制，集体会。\n<\/li><li>\n<strong>实例<\/strong>：实验室中自催化集合在稀释-转移循环里，某些组成比例会逐渐占优。这是“无基因选择”的演示。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为遗传必须靠 DNA——组成比例的传递也能被选择。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“组成遗传”指的是？\n<ul>\n<li>\nA. 基因突变\n<\/li><li>\nB. 分裂时组分分配差异被传递\n<\/li><li>\nC. 水平转移\n<\/li><li>\nD. 染色体交换\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：不必依赖核酸序列。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分裂造成组成差异\n<\/li><li>\n选择只需复制+变异+差异生存\n<\/li><li>\n遗传可早于 DNA\n<\/ul>", "kind": "chapter", "title": "第 7 章 可遗传变异"}, "ch08": {"html": "<h1>第 8 章：我们玩的游戏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“感觉—评价—行动”三和弦\n<\/li><li>\n能解释情绪为何是最早整合的感觉\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命体的基本循环是：感知世界、评价对自身有利与否、采取行动；情绪是这三步最早整合成一体的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三和弦（难度：进阶）<\/h3>\n<p>考夫曼借用凯瑟琳·考夫曼的说法：<strong>感觉<\/strong>（sense）、<strong>评价<\/strong>（evaluate）、<strong>行动<\/strong>（act）构成一个循环。没有评价，感觉只是输入；没有行动，评价没有后果。<\/p>\n<h3>概念 2：情绪的位置（难度：高难）<\/h3>\n<p>情绪把“对我有利/有害”直接编码成可行动的状态，比符号推理更早。它是价值判断的原型，不是理性的对立面。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三和弦&quot;]\n  n2[&quot;情绪的位置&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像开车时的仪表盘：读油量（感觉）、判断够不够（评价）、决定加油（行动）。边界：仪表盘没有情绪，生物有。\n<\/li><li>\n<strong>实例<\/strong>：遇到捕食者：心率上升（感觉）→ 威胁评估（评价）→ 逃跑（行动）。三步在一个时间窗内耦合，慢一步就死。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为情绪是理性的干扰——它是最早的价值计算装置。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“三和弦”不包括？\n<ul>\n<li>\nA. 感觉\n<\/li><li>\nB. 评价\n<\/li><li>\nC. 行动\n<\/li><li>\nD. 记忆\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：三和弦是感觉-评价-行动的循环。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n感觉-评价-行动\n<\/li><li>\n情绪 = 最早的价值整合\n<\/li><li>\n价值判断先于符号推理\n<\/ul>", "kind": "chapter", "title": "第 8 章 我们玩的游戏"}, "ch09": {"html": "<h1>第 9 章：舞台已经搭好了<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“被选择的是生物体而非基因”这一主张\n<\/li><li>\n能解释生态位与新物种的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>选择作用于完整的生物体，基因只是搭车；生态位提供机会，但不导致新物种出现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：选择单位（难度：进阶）<\/h3>\n<p>道金斯式“自私的基因”把基因当选择单位。考夫曼反驳：被选择的是能存活、繁殖、做功的生物体；基因的传播是结果，不是原因。<\/p>\n<h3>概念 2：生态位（难度：基础）<\/h3>\n<p><strong>生态位<\/strong>（niche）是生物在群落中的资源与角色。新生态位出现（如新的食物源），给已有变异提供机会，但不保证新物种出现。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;选择单位&quot;]\n  n2[&quot;生态位&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像剧场先搭好舞台，演员才有地方演：舞台不等于剧本。边界：舞台不会自己写剧本，生态位不会自己造物种。\n<\/li><li>\n<strong>实例<\/strong>：同一基因型在不同环境中表现不同；环境变，选择压变，存活率变。选择作用在表现型上，不在序列上。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为基因是唯一因果层——表现型与生态位同样是选择的作用面。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n考夫曼认为选择单位是？\n<ul>\n<li>\nA. 基因\n<\/li><li>\nB. 生物体\n<\/li><li>\nC. 种群\n<\/li><li>\nD. 生态位\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：基因是搭车者，生物体被选择。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n选择作用于生物体\n<\/li><li>\n基因是结果不是原因\n<\/li><li>\n生态位给机会不造物种\n<\/ul>", "kind": "chapter", "title": "第 9 章 舞台已经搭好了"}, "ch10": {"html": "<h1>第 10 章：扩展适应和螺丝刀<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“使之成为可能”与“导致”的区别\n<\/li><li>\n能举一个扩展适应的例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>演化不是“前者导致后者”，而是“前者使后者成为可能”；扩展适应就是旧结构被新用途征用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：enablement vs entailment（难度：高难）<\/h3>\n<p><strong>使之成为可能<\/strong>（enablement）：A 出现后，B 有了可行的路径，但 B 不是 A 的必然结果。<strong>导致<\/strong>（entailment）：B 可由 A 推出。考夫曼主张前者才是演化的真实关系。<\/p>\n<h3>概念 2：扩展适应（难度：进阶）<\/h3>\n<p><strong>扩展适应<\/strong>（exaptation）：为一种功能演化的结构，被另一种功能征用。羽毛先为保温，后为飞行；鱼鳔由肺演化而来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;enablement vs entailment&quot;]\n  n2[&quot;扩展适应&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用螺丝刀撬开罐子：工具没变，用途变了。边界：螺丝刀不会自我复制，器官会。\n<\/li><li>\n<strong>实例<\/strong>：鸟的羽毛：化石显示早期羽毛用于保温与展示，飞行是后来的功能。因果方向是“先有结构，后被征用”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为演化是“为将来做准备”——它只解决当前问题，新用途是事后征用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“使之成为可能”强调的是？\n<ul>\n<li>\nA. 必然导致\n<\/li><li>\nB. 提供可行路径但非必然\n<\/li><li>\nC. 随机\n<\/li><li>\nD. 设计\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它是可能性关系，不是因果决定关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nenablement ≠ entailment\n<\/li><li>\n扩展适应 = 旧结构新用途\n<\/li><li>\n演化不预备未来\n<\/ul>", "kind": "chapter", "title": "第 10 章 扩展适应和螺丝刀"}, "ch11": {"html": "<h1>第 11 章：物理之外的世界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明经济演化与生物演化的同构关系\n<\/li><li>\n能用“相邻可能”解释增长的不可预测\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>经济像生物圈：每出现一种商品，就把一批新商品变成“相邻可能”；增长不是被算出来的，是被一步步打开的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：相邻可能（难度：高难）<\/h3>\n<p><strong>相邻可能<\/strong>（adjacent possible）：从当前状态出发，下一步可达到的状态集合。它随历史扩大，且新成员会改变下一步的边界。<\/p>\n<h3>概念 2：经济同构（难度：进阶）<\/h3>\n<p>个人电脑使路由器与文件共享成为可能，后者使互联网、电商、搜索成为可能。每一步都不是前一步的必然结果，但都被前一步打开。<\/p>\n<h3>概念 3：理论的缺口（难度：高难）<\/h3>\n<p>主流增长理论把技术当外生变量或用生产函数拟合，无法解释“新商品从哪来”。考夫曼认为需要一种“相邻可能”的经济学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;相邻可能&quot;]\n  n2[&quot;经济同构&quot;]\n  n1 --&gt; n2\n  n3[&quot;理论的缺口&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像爬一棵不断长出新枝的树：你只能爬到已长出的枝上，但爬到之后新枝才出现。边界：树有遗传程序，经济没有。\n<\/li><li>\n<strong>实例<\/strong>：从个人电脑到互联网到电商到移动支付，每一步都依赖前一步的普及，但没有一步能从前一步“推导”出来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为经济增长可以精确预测——相邻可能的新增本身就是不可预测的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“相邻可能”指的是？\n<ul>\n<li>\nA. 所有可能状态\n<\/li><li>\nB. 从当前状态一步可达的状态集合\n<\/li><li>\nC. 未来预测\n<\/li><li>\nD. 随机突变\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它随历史扩大，边界由当前状态决定。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相邻可能随历史扩大\n<\/li><li>\n经济与生物同构\n<\/li><li>\n增长不可精确预测\n<\/ul>", "kind": "chapter", "title": "第 11 章 物理之外的世界"}, "c01": {"html": "<h1>相邻可能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 11 章、第 01 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>从当前状态出发，下一步实际可达到的状态集合；它随历史扩大。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是考夫曼解释“新事物如何出现”的核心工具，从分子组合一路用到商品经济。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>定义三要素：当前状态、可达操作、边界。<\/p>\n<p>扩大机制：每实现一个新状态，边界外移，新的可达集合出现。<\/p>\n<p>不可预测性：下一步依赖当前边界，而边界是历史产物，所以整体路径无法从初始条件推出。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为相邻可能等于“所有可能”——它只包含一步可达的部分。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>非遍历<\/td><td>前提<\/td><\/tr><tr><td>ch11<\/td><td>经济<\/td><td>应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n非遍历性、扩展适应\n<\/ul>", "kind": "concept", "title": "相邻可能"}, "c02": {"html": "<h1>约束闭合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 03 章、第 05 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一组约束相互维持，每个约束的存在由其他约束支撑，形成自我维持的闭环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“生命是什么”从物质清单变成组织条件，解释了为什么生命传播的是关系而非分子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三个例子：膜—代谢—能量；自催化网络；原初细胞的干湿循环。<\/p>\n<p>判据：去掉任一约束，闭环断裂。<\/p>\n<p>与反馈的区别：反馈是变量环，约束闭合是“维持条件的环”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为约束闭合是比喻——它是可检验的结构条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>传播组织<\/td><td>定义<\/td><\/tr><tr><td>ch06<\/td><td>原初细胞<\/td><td>实例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n相邻可能、自催化\n<\/ul>", "kind": "concept", "title": "约束闭合"}, "c03": {"html": "<h1>使之成为可能而非导致<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 10 章、第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>前者提供可行路径但不保证结果，后者可由前提必然推出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是考夫曼对抗“物理决定论”的关键区分，也是理解扩展适应与经济演化的钥匙。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>演化：羽毛先保温，后飞行——不是“为飞行而演化”。<\/p>\n<p>经济：PC 使互联网可能，但不是“必然导致互联网”。<\/p>\n<p>方法论含义：解释新事物要给“可能性条件”，不要伪造“必然因果”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“使之成为可能”是软弱解释——它比虚假的必然性更准确。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch10<\/td><td>扩展适应<\/td><td>区分<\/td><\/tr><tr><td>ch11<\/td><td>经济<\/td><td>应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n相邻可能、扩展适应\n<\/ul>", "kind": "concept", "title": "使之成为可能而非导致"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：世界不是一台机器<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 世界不是一台机器<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：功能的功能<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 功能的功能<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：传播组织<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 传播组织<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：解密生命<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 解密生命<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：如何制造新陈代谢<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 如何制造新陈代谢<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：原初细胞<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 原初细胞<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：可遗传变异<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 可遗传变异<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：我们玩的游戏<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 我们玩的游戏<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：舞台已经搭好了<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 舞台已经搭好了<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：扩展适应和螺丝刀<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 扩展适应和螺丝刀<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：物理之外的世界<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 物理之外的世界<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q12.<\/b> 考夫曼论证“物理不能推出生命”的核心依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 物理定律错误<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 宇宙非遍历，组合空间远未穷尽<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 生命没有规律<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 实验不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q13.<\/b> “约束闭合”与普通反馈的关键区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 有变量<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 闭合的是维持条件而非仅变量循环<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 需要能量<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 发生在细胞内<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q14.<\/b> 用“相邻可能”解释经济增长，最恰当的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 增长可精确预测<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 新商品把一批新商品变为可能<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 增长靠资本投入<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 技术是外生变量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章 世界不是一台机器<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 考夫曼用数量级论证想说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 宇宙很小<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 宇宙远未遍历所有分子组合<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 蛋白质不重要<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 量子力学错误<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章 功能的功能<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “功能不可预言”的意思是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 功能不存在<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 物理不能事前推出哪个结构会成为功能<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 功能都一样<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 功能由基因决定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章 传播组织<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “约束闭合”强调？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 变量循环<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 约束相互维持形成闭环<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 基因决定<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 能量守恒<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章 解密生命<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> DNA 不能编码的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 氨基酸序列<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 碱基配对<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 折叠与代谢环境<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 三联体密码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章 如何制造新陈代谢<\/h1><div class='quiz-item' data-qid='ch05-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自催化集合的关键特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q1' value='0'> 产物催化自身生成<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='1'> 需要外部催化剂<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='2'> 不耗能<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='3'> 只含一种分子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章 原初细胞<\/h1><div class='quiz-item' data-qid='ch06-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 原初细胞假说中，膜的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 储存基因<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> 提供边界与浓度梯度<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> 提供能量<\/label><label class='quiz-opt'><inp
