.<\/b> 哥德尔第一定理的前提是系统？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 足够弱<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> 足够强且一致<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> 完备<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> 有限<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 第二定理说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q2' value='0'> 系统能证明自身一致<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='1'> 系统不能证明自身一致<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='2'> 系统一定矛盾<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='3'> 系统一定完备<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章 图灵构想通用计算机<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图灵证明判定问题无解，靠的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 造出更快的机器<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 停机问题不可判定<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 哥德尔第二定理直接套用<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 实验测量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 通用图灵机的意义在于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 速度最快<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 程序可作为数据被模拟<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 不需要纸带<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 只能算加法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章 研制第一批通用计算机<\/h1><div class='quiz-item' data-qid='ch08-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ENIAC 编程主要靠？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q1' value='0'> 键盘输入<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='1'> 插线与开关<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='2'> 纸带<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='3'> 语音<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 存储程序的关键是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q2' value='0'> 指令与数据存放在可寻址存储器<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='1'> 使用晶体管<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='2'> 提高主频<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='3'> 增加显示器<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章 超越莱布尼茨之梦<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ELIZA 的工作方式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 语义理解<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 模式匹配与句式改写<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 神经网络训练<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 逻辑推理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 戴维斯对“机器能思考吗”的态度接近？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q2' value='0'> 已经完全实现<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='1'> 行为相似不等于理解，问题仍开放<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 绝不可能<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 只是语言问题<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='普遍语言'>普遍语言 — 莱布尼茨设想的无歧义符号系统 <span class=glossary-ref>（第 1 章 莱布尼茨之梦）<\/span><\/li><li data-term='布尔代数'>布尔代数 — 以真值 1/0 与与或非运算构成的对策代数 <span class=glossary-ref>（第 2 章 布尔把逻辑变成代数）<\/span><\/li><li data-term='概念文字'>概念文字 — 弗雷格发明的带量词与关系的形式语言 <span class=glossary-ref>（第 3 章 弗雷格：从突破到绝望）<\/span><\/li><li data-term='罗素悖论'>罗素悖论 — 所有不包含自身的集合组成的集合导致的矛盾 <span class=glossary-ref>（第 3 章 弗雷格：从突破到绝望）<\/span><\/li><li data-term='等势'>等势 — 两个集合元素可一一对应 <span class=glossary-ref>（第 4 章 康托尔：在无限中摸索）<\/span><\/li><li data-term='对角线方法'>对角线方法 — 逐位构造与列表中每项都不同的对象 <span class=glossary-ref>（第 4 章 康托尔：在无限中摸索）<\/span><\/li><li data-term='连续统假设'>连续统假设 — 实数基数与自然数基数之间没有其他基数 <span class=glossary-ref>（第 4 章 康托尔：在无限中摸索）<\/span><\/li><li data-term='判定问题'>判定问题 — 是否存在机械程序判定任意命题可证性 <span class=glossary-ref>（第 5 章 希尔伯特的营救）<\/span><\/li><li data-term='有限主义'>有限主义 — 只接受可有限构造的数学对象与方法 <span class=glossary-ref>（第 5 章 希尔伯特的营救）<\/span><\/li><li data-term='哥德尔编码'>哥德尔编码 — 把符号与证明映射为自然数 <span class=glossary-ref>（第 6 章 哥德尔使计划落空）<\/span><\/li><li data-term='第一不完备定理'>第一不完备定理 — 足够强且一致的系统存在不可证的真命题 <span class=glossary-ref>（第 6 章 哥德尔使计划落空）<\/span><\/li><li data-term='第二不完备定理'>第二不完备定理 — 系统不能在自身内部证明自身一致 <span class=glossary-ref>（第 6 章 哥德尔使计划落空）<\/span><\/li><li data-term='图灵机'>图灵机 — 纸带、读写头与规则表构成的抽象计算模型 <span class=glossary-ref>（第 7 章 图灵构想通用计算机）<\/span><\/li><li data-term='停机问题'>停机问题 — 判定任意程序是否终止，不可解 <span class=glossary-ref>（第 7 章 图灵构想通用计算机）<\/span><\/li><li data-term='通用图灵机'>通用图灵机 — 能模拟任何图灵机的机器 <span class=glossary-ref>（第 7 章 图灵构想通用计算机）<\/span><\/li><li data-term='存储程序'>存储程序 — 指令与数据共存于可寻址存储器 <span class=glossary-ref>（第 8 章 研制第一批通用计算机）<\/span><\/li><\/ul>", "__patterns__": "<h1>逻辑的引擎 模式与框架库<\/h1>\n<h2>分析框架：逻辑史的四次“地基危机”<\/h2>\n<ol><li>\n弗雷格：集合概括原则 → 罗素悖论；\n<\/li><li>\n康托尔：无限与连续统 → 基数层级未定；\n<\/li><li>\n希尔伯特：完备性要求 → 哥德尔否定；\n<\/li><li>\n希尔伯特：可判定性要求 → 图灵否定。\n<p>每次危机的解法都不是“修补漏洞”，而是重新定义对象（类型论、公理化集合论、可计算性）。<\/p>\n<\/ol>\n<h2>决策规则：遇到“某系统能判定一切”的主张<\/h2>\n<p>if 主张者说系统能判定任意命题 then 问：能否判定“本程序是否停机” if 能 then 与停机问题矛盾，主张不成立<\/p>\n<h2>反模式：把行为相似当理解<\/h2>\n<p>ELIZA 式的对话幻觉：模式匹配能产生“被理解”的感受。判断时要看内部机制，而不是只看输出像不像。<\/p>\n<h2>反模式：把哥德尔定理当万能反驳<\/h2>\n<p>哥德尔只约束“足够强且一致的形式系统”。用它反驳具体计算模型时，必须说明该模型确实对应这样一个系统。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>布尔三运算<\/td><td>与=乘，或=加（1+1=1），非=1−x<\/td><\/tr><tr><td>罗素悖论<\/td><td>R={x<\/td><td>x∉x}，R∈R 与 R∉R 都矛盾<\/td><\/tr><tr><td>等势<\/td><td>存在一一对应（双射）<\/td><\/tr><tr><td>对角线<\/td><td>逐位取反，构造列表外的对象<\/td><\/tr><tr><td>判定问题<\/td><td>Entscheidungsproblem，图灵用停机问题否定<\/td><\/tr><tr><td>哥德尔 G<\/td><td>“本命题不可证”：一致则不可证，故为真<\/td><\/tr><tr><td>可计算<\/td><td>图灵可计算（丘奇-图灵论题）<\/td><\/tr><tr><td>存储程序<\/td><td>指令当数据存，换程序不用接线<\/td><\/tr><\/tbody><\/table>"}};

const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
