.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}

.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}

.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}

  .layout{flex-direction:column}.main{padding:16px}}
</style>

r": 1, "explain": "兰道尔原理指出擦除 1 比特信息至少耗散 kT ln2 的能量，妖的账要一起算。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "图灵机的基本部件不包括？", "options": ["无限纸带", "读写头", "规则表", "随机数发生器"], "answer": 3, "explain": "标准图灵机是确定性的；随机性要额外加一条“掷硬币”通道，那是另一类模型。"}, {"id": "ch04-q2", "chapterId": "ch04", "type": "single", "question": "停机问题不可解，其证明的核心手法是？", "options": ["穷举所有程序", "构造自指程序制造矛盾", "证明纸带不够长", "用哥德尔编码数数"], "answer": 1, "explain": "假设存在判定机，再构造一个“专跟判定机对着干”的程序，矛盾即证。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "孟德尔的工作解决了达尔文理论的哪个难题？", "options": ["地球年龄不够长", "混合遗传会稀释变异", "物种是否会灭绝", "化石记录不完整"], "answer": 1, "explain": "离散遗传因子使变异不被混合稀释，这是现代综合的关键拼块。"}, {"id": "ch05-q2", "chapterId": "ch05", "type": "single", "question": "中性演化理论的主要主张是？", "options": ["所有变异都受选择", "大量分子变异不受选择、靠漂变固定", "进化由灾变驱动", "获得性性状可遗传"], "answer": 1, "explain": "木村资生提出中性突变-随机漂变假说，纠正了“每个变异都有适应意义”的过度解读。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "中心法则的信息流顺序是？", "options": ["蛋白质→DNA→RNA", "DNA→RNA→蛋白质", "RNA→蛋白质→DNA", "DNA→蛋白质→RNA"], "answer": 1, "explain": "转录（DNA→RNA）与翻译（RNA→蛋白质）构成主流信息流。"}, {"id": "ch06-q2", "chapterId": "ch06", "type": "single", "question": "为什么突变率不能太高？", "options": ["会让细胞立刻死亡", "后代变化过大，无法稳定积累有利性状", "会增加能耗", "会破坏双螺旋结构"], "answer": 1, "explain": "进化需要在“有变化”和“保住已有成果”之间取平衡。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "用算法信息量衡量，随机串的特点是？", "options": ["程序最短", "程序最长，几乎无法压缩", "逻辑深度最高", "熵最低"], "answer": 1, "explain": "随机串没有可利用的规律，最短描述只能逐位照抄。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "逻辑深度想补充熵和算法信息量遗漏的哪一点？", "options": ["数据长度", "生成所需的时间/步骤", "存储成本", "符号意义"], "answer": 1, "explain": "深度把“从描述到结果要跑多少步”计入复杂性，区分“短描述但难生成”的情况。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "冯·诺依曼解决自复制悖论的关键是？", "options": ["让程序无限长", "把描述与构造分成两层", "使用随机数", "允许副本出错"], "answer": 1, "explain": "通用构造器 + 独立描述，避免了描述的无限嵌套。"}, {"id": "ch08-q2", "chapterId": "ch08", "type": "single", "question": "程序自复制与 DNA 自复制最大的差别是？", "options": ["DNA 不需要能量", "程序依赖外部解释器，DNA 的解释器由自身编码", "程序不能变异", "DNA 不能复制描述"], "answer": 1, "explain": "DNA 把核糖体等执行装置也纳入了自身编码范围，闭环更完整。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "遗传算法的四个核心步骤是？", "options": ["采样、拟合、预测、验证", "初始化、评估、选择、交叉与突变", "编码、解码、压缩、解压", "训练、测试、部署、监控"], "answer": 1, "explain": "其余选项属于统计学习或工程流程，不是进化计算。"}, {"id": "ch09-q2", "chapterId": "ch09", "type": "single", "question": "罗比实验中随机策略与演化策略的平均分大约是？", "options": ["346 与 483", "100 与 400", "483 与 500", "0 与 243"], "answer": 0, "explain": "原文给出随机约 346、演化最好约 483，接近最优。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "生命游戏中一个活细胞有 4 个活邻居，下一代它会？", "options": ["存活", "死亡", "复活", "随机"], "answer": 1, "explain": "邻居多于 3 个判定为拥挤而死亡。"}, {"id": "ch10-q2", "chapterId": "ch10", "type": "single", "question": "沃尔夫勒姆第四类的特征是？", "options": ["全部归零", "稳定周期", "伪随机混沌", "局部结构能相互作用"], "answer": 3, "explain": "第四类的标志是出现可识别的局部结构（如滑翔机），并能彼此作用。"}, {"id": "ch11-q1", "chapterId": "ch11", "type": "single", "question": "元胞机中的“粒子”指的是？", "options": ["格子里的基本单元", "自发产生并能稳定传播的局部结构", "随机噪声", "外部输入的信号"], "answer": 1, "explain": "粒子是时空图上的稳定缺陷结构，能传播、能碰撞。"}, {"id": "ch11-q2", "chapterId": "ch11", "type": "single", "question": "粒子计算的核心主张是？", "options": ["计算必须由人设计", "碰撞可实现逻辑运算，计算可从规则中涌现", "元胞机不能通用", "粒子就是电子"], "answer": 1, "explain": "米歇尔的实验表明局部碰撞足以编码逻辑门。"}, {"id": "ch12-q1", "chapterId": "ch12", "type": "single", "question": "免疫系统识别病原的方式最接近下列哪一项？", "options": ["查预先存好的病原清单", "从现成多样性中筛选并扩增", "由大脑下发指令", "随机试错直到成功"], "answer": 1, "explain": "克隆选择：先有大量随机多样的受体，遇到抗原后筛选扩增。"}, {"id": "ch12-q2", "chapterId": "ch12", "type": "single", "question": "分布式信息处理的典型代价是？", "options": ["无法容错", "行为难以精确控制与解释", "必须中央存储", "无法进化"], "answer": 1, "explain": "没有中央控制带来鲁棒性，同时牺牲了可预测性与可解释性。"}, {"id": "ch13-q1", "chapterId": "ch13", "type": "single", "question": "Copycat 中“温度”参数控制的是？", "options": ["网络规模", "随机性与探索程度", "字母数量", "记忆容量"], "answer": 1, "explain": "温度高则更多随机尝试，低则更确定地沿当前路径推进。"}, {"id": "ch13-q2", "chapterId": "ch13", "type": "single", "question": "类比之所以难以规则化，核心原因是？", "options": ["词汇量太大", "哪些特征对应取决于语境，需要临时决定", "计算量太大", "缺少训练数据"], "answer": 1, "explain": "难点在“选择什么眼光”，不是匹配算力。"}, {"id": "ch14-q1", "chapterId": "ch14", "type": "single", "question": "仿真模型能提供的最强结论是？", "options": ["现实必然如此", "这套规则足以产生该现象", "现象无法预测", "模型参数唯一"], "answer": 1, "explain": "模拟证明充分性，不证明必要性。"}, {"id": "ch14-q2", "chapterId": "ch14", "type": "single", "question": "判断合作演化模拟结论是否可靠，书里强调要看？", "options": ["单次运行画面", "参数扫描后结论是否稳定", "代码行数", "作者名气"], "answer": 1, "explain": "单次运行容易凑巧，鲁棒性要靠参数扫描。"}, {"id": "ch15-q1", "chapterId": "ch15", "type": "single", "question": "小世界网络的关键结构是？", "options": ["完全随机连接", "局部密集 + 少量长程连接", "所有节点度数相同", "树状层级"], "answer": 1, "explain": "局部抱团提供冗余，少数捷径压缩平均路径。"}, {"id": "ch15-q2", "chapterId": "ch15", "type": "single", "question": "无标度网络的度分布特征是？", "options": ["正态分布", "均匀分布", "幂律分布", "双峰分布"], "answer": 2, "explain": "幂律意味着没有特征尺度，少数枢纽连接极多。"}, {"id": "ch16-q1", "chapterId": "ch16", "type": "single", "question": "生物网络呈小世界性的主要收益是？", "options": ["节点数量少", "短路径 + 局部冗余抗损", "没有枢纽", "度分布均匀"], "answer": 1, "explain": "既快又稳，这是进化偏好的组合。"}, {"id": "ch16-q2", "chapterId": "ch16", "type": "single", "question": "“引爆点”描述的是？", "options": ["网络规模上限", "传播率越过阈值后影响突然放大", "节点随机失效", "幂律的尾部"], "answer": 1, "explain": "正反馈把系统推过临界点后，增长呈爆炸式。"}, {"id": "ch17-q1", "chapterId": "ch17", "type": "single", "question": "克莱伯定律的指数是？", "options": ["1/2", "2/3", "3/4", "1"], "answer": 2, "explain": "代谢率 ∝ 体重^{3/4}，这是原文反复强调的反直觉结论。"}, {"id": "ch17-q2", "chapterId": "ch17", "type": "single", "question": "支持 3/4 的主要机制解释是？", "options": ["体表散热", "分形式输送网络的最优填充", "心跳频率恒定", "食物摄入量"], "answer": 1, "explain": "韦斯特等人的分形网络模型给出 3/4 指数，但仍有争议。"}, {"id": "ch18-q1", "chapterId": "ch18", "type": "single", "question": "下列哪项不是书中提到的复杂化机制？", "options": ["基因复制", "发育调控改变", "共生/水平转移", "所有突变都朝向更复杂"], "answer": 3, "explain": "突变是随机的，不存在朝向复杂的内在倾向。"}, {"id": "ch18-q2", "chapterId": "ch18", "type": "single", "question": "把基因组直接类比为“程序”会漏掉？", "options": ["碱基配对规则", "非编码调控与可变剪接", "双螺旋结构", "密码子表"], "answer": 1, "explain": "调控层与剪接使同一段序列产出多种结果，程序比喻覆盖不到。"}, {"id": "ch19-q1", "chapterId": "ch19", "type": "single", "question": "米歇尔对复杂性科学的总体判断是？", "options": ["已完成的统一理论", "伪科学", "正在成形的工具体系，有成果也有夸饰", "只适用于物理学"], "answer": 2, "explain": "她既承认成果，也承认“万能比喻”的问题。"}, {"id": "ch19-q2", "chapterId": "ch19", "type": "single", "question": "按本书标准，下面哪种说法最有内容？", "options": ["经济是复杂系统，所以不可预测", "涌现让整体大于部分之和", "网络枢纽占少数且传播率过阈值时会出现级联失效", "混沌边缘是创新的源泉"], "answer": 2, "explain": "只有它给出了可测量、可反驳的条件。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "某团队声称“城市交通是复杂系统，所以拥堵无法治理”。按本书标准，这句话的问题在于？", "options": ["城市不是复杂系统", "只给了隐喻，没有给出可测量的互动机制与阈值", "拥堵其实可以精确预测", "复杂系统不需要模型"], "answer": 1, "explain": "米歇尔要求把涌现翻译成具体互动与可测整体量；只贴标签不构成解释。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "要判断“蚁群比单个蚂蚁复杂”，最合适的做法是？", "options": ["比较体积", "比较熵", "比较层次结构与生成过程的深度", "比较个体数量"], "answer": 2, "explain": "层次与深度能刻画组织与生成成本，单纯熵会把随机噪声判为更复杂。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "下面哪组概念在本书里承担同一类角色（都是“简单规则生成复杂行为”）？", "options": ["熵与香农信息", "元胞自动机与遗传算法", "克莱伯定律与六度分隔", "哥德尔编码与密码子"], "answer": 1, "explain": "两者都是生成机制：局部规则 / 选择压力产生非设计的结果。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "复杂系统是由大量相对简单的成分互相作用、在没有中央指挥的情况下涌现出宏观秩序的系统；研究复杂性，就是研究这种秩序是怎么来的、又该怎么度量。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "从五个例子看共性——一句话说清它是什么？", "back": "蚁群里没有总指挥，单只蚂蚁只对几样化学信号做反应，但整个群体能分工、能修路、能打仗。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "复杂系统的三条共性——一句话说清它是什么？", "back": "第一条是**涌现**（emergent behavior，白话：整体表现出任何单个成分都不具备的行为）。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "为什么“复杂”难定义——一句话说清它是什么？", "back": "米歇尔没有给一个统一公式，而是给了一串候选：描述它需要多少信息、生成它需要多少步骤、它的组织层次有多深。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "确定性系统也能不可预测：只要演化对初值极度敏感，初始测量的一点点误差就会被指数放大，长期预测在物理上失效，而不只是技术上不够好。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "动力系统：把变化写成迭代——一句话说清它是什么？", "back": "**动力系统**（dynamical system，白话：状态按固定规则一步步变的系统）用一条规则描述“下一步是什么”。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "r 从 2 调到 4：稳定、振荡、混沌——一句话说清它是什么？", "back": "r 小的时候，无论初值取多少，序列最后都收敛到同一个固定值——这叫**不动点**。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch02", "front": "预测的三重墙——一句话说清它是什么？", "back": "米歇尔把预测的困难分成三层。", "tags": ["ch02"]}, {"id": "f009", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "信息是“不确定性的减少”：一件事越难猜，它发生时所含的信息越多；熵是这种不确定性的度量，因此信息与热力学熵是同一个数学量在两套语境下的名字。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "熵：从热机到“有多少种排法”——一句话说清它是什么？", "back": "**熵**（entropy，白话：一个宏观状态对应多少种微观排法）在统计力学里由玻尔兹曼给出：S = k·log W，W 是微观状态数。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "香农信息：意外值多少钱——一句话说清它是什么？", "back": "**香农信息**（Shannon information，白话：收到消息后不确定性减少了多少）把“信息量”定义成 −log₂ p。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch03", "front": "麦克斯韦妖：为什么它赢不了——一句话说清它是什么？", "back": "设想一个小妖守着隔板上的小门，看到快分子就放去左边、慢分子放去右边，于是左边变热、右边变冷，熵下降了。", "tags": ["ch03"]}, {"id": "f013", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "计算可以被抽象成一台极简机器：一条纸带、一个读写头、一套规则；凡是这台机器算得出的，就是“可计算”的，而它算不出的（如停机问题），任何更强的机器也算不出。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "希尔伯特的清单与哥德尔的一击——一句话说清它是什么？", "back": "希尔伯特在 1900 年提出一揽子问题，核心是：数学是否完备（每个真命题都能证）、是否一致（不会证出矛盾）、是否可判定（有机械程序判定任意命题真假）。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "图灵机：把“机械程序”变成实物——一句话说清它是什么？", "back": "**图灵机**（Turing machine，白话：一条无限长的纸带 + 一个能读能写能左右移动的读写头 + 一张规则表）只有有限个内部状态。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch04", "front": "停机问题：算不出来的东西长什么样——一句话说清它是什么？", "back": "**停机问题**（halting problem）：给定程序和输入，判断它会不会最终停下来。", "tags": ["ch04"]}, {"id": "f017", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "进化没有设计者，也没有目标：变异提供原料，遗传保证连续性，选择压力把当下有效的留下；三步循环足够在没有图纸的情况下造出精巧结构。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "达尔文之前：目的论的解释为什么不够——一句话说清它是什么？", "back": "在达尔文之前，解释生物为什么精巧，主流答案是“造物主设计”或“生命力驱动”。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "孟德尔补上“遗传怎么不稀释”——一句话说清它是什么？", "back": "达尔文的一个难题是：如果父母性状混合，优势性状几代就被稀释掉。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch05", "front": "现代综合之后被挑战的三处——一句话说清它是什么？", "back": "书里点了三个薄弱处：一是**中性演化**，木村资生指出大量分子层面的变化既不好也不坏，靠漂变固定，选择不是唯一动力。", "tags": ["ch05"]}, {"id": "f021", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "DNA 是可复制的程序，细胞是可执行它的机器；这套系统最特别的地方在于，执行程序的机器本身也是由程序编码出来的。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "双螺旋与密码子——一句话说清它是什么？", "back": "1953 年沃森和克里克给出 DNA 双螺旋结构：两条链由碱基配对（A-T、G-C）连起来，可以解开各自复制。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "突变：复制错误是进化的原料——一句话说清它是什么？", "back": "复制不是完美的：碱基配对偶尔出错，大约每千亿个核苷酸出一次。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch06", "front": "自指：机器由自己的产物造出来——一句话说清它是什么？", "back": "mRNA、tRNA、核糖体、聚合酶这些执行转录翻译的装置，本身也是 DNA 编码、由这套装置生产出来的。", "tags": ["ch06"]}, {"id": "f025", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "没有一种度量能同时抓住“随机”和“有组织”这两件事：熵把随机判为最复杂，算法信息量把规律判为最简单，逻辑深度才勉强把“花了多少步才生成”算进来——所以复杂性必须用一组度量分场景使用。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "熵与算法信息量：一对反向的尺子——一句话说清它是什么？", "back": "用熵度量，一串随机比特的熵最高，可它毫无结构。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "逻辑深度：把生成过程算进来——一句话说清它是什么？", "back": "**逻辑深度**（logical depth，贝内特提出，白话：从最短描述出发，算出这串数据要跑多少步）试图区分“简单但算得久”和“复杂但一算就出”。", "tags": ["ch07"]}, {"id": "f028", "chapterId": "ch07", "front": "其余几种与它们的局限——一句话说清它是什么？", "back": "还有热力学深度（生成过程中耗散的能量）、有效复杂度、统计复杂性（正则模型的规模）、分形维数（用维度刻画自相似结构）、层次性度量（嵌套层次的深度）。", "tags": ["ch07"]}, {"id": "f029", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "自复制不需要无限嵌套：把“描述”和“执行”分成两层，一份程序既当图纸又当工人，就能造出包含自己图纸的副本。", "tags": ["ch08"]}, {"id": "f030", "chapterId": "ch08", "front": "表面上的无限倒退——一句话说清它是什么？", "back": "复制自己必须包含对自己的描述。", "tags": ["ch08"]}, {"id": "f031", "chapterId": "ch08", "front": "程序版：打印自己的程序——一句话说清它是什么？", "back": "写一个程序，运行后输出它自己的源码。", "tags": ["ch08"]}, {"id": "f032", "chapterId": "ch08", "front": "和 DNA 的关键差别——一句话说清它是什么？", "back": "程序自复制需要一个外部**解释器**（操作系统、编译器）来执行它。", "tags": ["ch08"]}, {"id": "f033", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "遗传算法把进化搬进计算机：一群候选解，按适应度筛选，靠交叉和突变产生新解，多代之后得到人写不出来的好策略。", "tags": ["ch09"]}, {"id": "f034", "chapterId": "ch09", "front": "算法配方——一句话说清它是什么？", "back": "四步循环：①初始化一群随机个体（每个个体是一串“基因”）。", "tags": ["ch09"]}, {"id": "f035", "chapterId": "ch09", "front": "Robby：一个能数分的机器人——一句话说清它是什么？", "back": "罗比在一个 10×10 的格子里捡易拉罐，能感知上下左右和自己的方向、是否带罐，动作只有移动、捡、随机停。", "tags": ["ch09"]}, {"id": "f036", "chapterId": "ch09", "front": "为什么人看不懂却有效——一句话说清它是什么？", "back": "因为选择只奖励结果，不奖励可解释性。", "tags": ["ch09"]}, {"id": "f037", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "元胞自动机证明了一件事：极其简单的局部规则，不需要中央控制，也能生成无法用简单公式预测的复杂图案——宇宙也许就是这类系统。", "tags": ["ch10"]}, {"id": "f038", "chapterId": "ch10", "front": "规则有多简单——一句话说清它是什么？", "back": "**元胞自动机**（cellular automaton，白话：一排（或一片）格子，每格有有限种状态，每步按“看自己和邻居”的固定规则同时更新）。", "tags": ["ch10"]}, {"id": "f039", "chapterId": "ch10", "front": "生命游戏：二维的经典——一句话说清它是什么？", "back": "康威的**生命游戏**（Game of Life）规则只有三条：活细胞邻居少于 2 个则死（孤独），多于 3 个则死（拥挤），恰好 3 个则活。", "tags": ["ch10"]}, {"id": "f040", "chapterId": "ch10", "front": "沃尔夫勒姆的四类——一句话说清它是什么？", "back": "沃尔夫勒姆把一维元胞机按行为分成四类：一类迅速归于 uniform（全死或全活）。", "tags": ["ch10"]}, {"id": "f041", "chapterId": "ch11", "front": "第 11 章一句话核心是什么？", "back": "在混沌边缘的元胞机里，会自发出现能长距离传播、碰撞后仍保持身份的局部结构；这些“粒子”就是信息，碰撞就是逻辑运算。", "tags": ["ch11"]}, {"id": "f042", "chapterId": "ch11", "front": "从图案到粒子——一句话说清它是什么？", "back": "在规则 110 这类元胞机里，背景是周期性格子，但会冒出一些稳定的缺陷结构，它们在时空图上以固定速度斜着走。", "tags": ["ch11"]}, {"id": "f043", "chapterId": "ch11", "front": "碰撞即计算——一句话说清它是什么？", "back": "如果两种粒子相撞后一种消失、另一种继续，可以编码成“1 与 0 相撞得 0”。", "tags": ["ch11"]}, {"id": "f044", "chapterId": "ch11", "front": "对“生命=计算”的分寸——一句话说清它是什么？", "back": "米歇尔对“宇宙是计算机”这类说法保持距离。", "tags": ["ch11"]}, {"id": "f045", "chapterId": "ch12", "front": "第 12 章一句话核心是什么？", "back": "生命系统的信息处理没有中央处理器、没有预先写好的程序，靠大量局部互动和化学信号完成；这种“分布式 + 进化而来”的方式更难分析，也更难容错。", "tags": ["ch12"]}, {"id": "f046", "chapterId": "ch12", "front": "五种系统，五种组织方式——一句话说清它是什么？", "back": "传统计算机：指令顺序执行，存储器集中，程序与硬件分离。", "tags": ["ch12"]}, {"id": "f047", "chapterId": "ch12", "front": "三个后果——一句话说清它是什么？", "back": "第一，**难分解**：你无法把免疫系统拆成“识别模块 + 记忆模块”，功能缠在结构里。", "tags": ["ch12"]}, {"id": "f048", "chapterId": "ch12", "front": "“信息处理”这个说法该用到哪——一句话说清它是什么？", "back": "米歇尔提醒：把一切都叫信息处理，会让这个词失去内容。", "tags": ["ch12"]}, {"id": "f049", "chapterId": "ch13", "front": "第 13 章一句话核心是什么？", "back": "类比是在两件表面不同的事物之间发现抽象结构对应；它没法用固定规则查表实现，因为“哪些特征该对应”本身取决于语境。", "tags": ["ch13"]}, {"id": "f050", "chapterId": "ch13", "front": "类比不是找相同点——一句话说清它是什么？", "back": "“鞋子对脚，手套对___？”答案显而易见。", "tags": ["ch13"]}, {"id": "f051", "chapterId": "ch13", "front": "Copycat：让概念在网络上滑动——一句话说清它是什么？", "back": "侯世达的 **Copycat** 程序把字母、字母序、方向、组块等做成一个语义网络，节点有**活性**（activation），连线有**阻抗**。", "tags": ["ch13"]}, {"id": "f052", "chapterId": "ch13", "front": "为什么这件事对 AI 难——一句话说清它是什么？", "back": "因为类比需要“知道什么重要”。", "tags": ["ch13"]}, {"id": "f053", "chapterId": "ch14", "front": "第 14 章一句话核心是什么？", "back": "计算机模型不是把现实搬进机器，而是把“你认为重要的几条规则”写进去，看它们能不能长出你观察到的现象；它是论证工具，不是预言机。", "tags": ["ch14"]}, {"id": "f054", "chapterId": "ch14", "front": "模型与原理的分工——一句话说清它是什么？", "back": "**数学模型**用方程描述关系，能算却不一定解释机制（牛顿的引力公式被质疑过“没说清原理”）。", "tags": ["ch14"]}, {"id": "f055", "chapterId": "ch14", "front": "模拟能证明什么——一句话说清它是什么？", "back": "米歇尔的态度很克制：模拟能证明“这套规则足以产生那个现象”，即**充分性**。", "tags": ["ch14"]}, {"id": "f056", "chapterId": "ch14", "front": "合作演化的模拟——一句话说清它是什么？", "back": "书里讲了用 GA 演化合作行为的实验：个体在网格上博弈，背叛会被邻居看见并惩罚。", "tags": ["ch14"]}, {"id": "f057", "chapterId": "ch15", "front": "第 15 章一句话核心是什么？", "back": "真实网络既不是随机图也不是规则格子：它们平均距离很短（小世界），度分布又常常是幂律（无标度），这两种性质都能用极简的生成规则解释。", "tags": ["ch15"]}, {"id": "f058", "chapterId": "ch15", "front": "六度分隔：短路径的实证——一句话说清它是什么？", "back": "米尔格拉姆在 1960 年代做过一个传递实验：把信交给陌生人，只允许交给认识的熟人，看几跳能到目标。", "tags": ["ch15"]}, {"id": "f059", "chapterId": "ch15", "front": "瓦茨-斯特罗加茨：少量随机重连——一句话说清它是什么？", "back": "规则格子上，平均距离随规模线性增长。", "tags": ["ch15"]}, {"id": "f060", "chapterId": "ch15", "front": "无标度与枢纽——一句话说清它是什么？", "back": "**无标度**（scale-free，白话：度分布是幂律，没有“典型规模”）意味着少数节点连接极多（枢纽），多数节点连接很少。", "tags": ["ch15"]}, {"id": "f061", "chapterId": "ch16", "front": "第 16 章一句话核心是什么？", "back": "大脑、代谢、食物网、互联网、引用网络都呈小世界结构，因为小世界同时给出了“短路径”和“抗故障”这两个进化与工程都想要的性质。", "tags": ["ch16"]}, {"id": "f062", "chapterId": "ch16", "front": "生物网络为什么偏爱小世界——一句话说清它是什么？", "back": "线虫的神经网络、猫与猴的脑区连接、代谢网络都被测出小世界性。", "tags": ["ch16"]}, {"id": "f063", "chapterId": "ch16", "front": "枢纽的双面性——一句话说清它是什么？", "back": "枢纽让网络高效，也让网络脆弱。", "tags": ["ch16"]}, {"id": "f064", "chapterId": "ch16", "front": "从结构到动力学——一句话说清它是什么？", "back": "米歇尔提醒，网络拓扑只是一半。", "tags": ["ch16"]}, {"id": "f065", "chapterId": "ch17", "front": "第 17 章一句话核心是什么？", "back": "动物的代谢率与体重的 3/4 次幂成正比，而不是按表面积推算的 2/3；这个“多出来的指数”可以用分形式的养分输送网络解释。", "tags": ["ch17"]}, {"id": "f066", "chapterId": "ch17", "front": "为什么 2/3 不够——一句话说清它是什么？", "back": "热量通过体表散失，表面积随体长的平方增长，体积（体重）随立方增长，所以按面积/体积比，代谢率应正比于体重的 2/3。", "tags": ["ch17"]}, {"id": "f067", "chapterId": "ch17", "front": "分形网络：把 3/4 从几何里长出来——一句话说清它是什么？", "back": "韦斯特、布朗、恩奎斯特提出：体内输送网络（血管、气管）是**分形**（fractal，白话：每一级都在更小尺度上重复同一分支模式）。", "tags": ["ch17"]}, {"id": "f068", "chapterId": "ch17", "front": "幂律的普适与滥用——一句话说清它是什么？", "back": "幂律在自然界很常见：城市规模与专利数、词频、地震强度、公司规模。", "tags": ["ch17"]}, {"id": "f069", "chapterId": "ch18", "front": "第 18 章一句话核心是什么？", "back": "进化不保证越来越复杂：复杂度上升只是偶尔发生的结果，而且“复杂”本身没有统一度量；基因复制、发育调控、共生都能一步带来结构跃迁。", "tags": ["ch18"]}, {"id": "f070", "chapterId": "ch18", "front": "把基因组当程序看，会漏掉什么——一句话说清它是什么？", "back": "沃森-克里克之后，流行把 DNA 看成“细胞的程序”。", "tags": ["ch18"]}, {"id": "f071", "chapterId": "ch18", "front": "复杂度上升的几条真实路径——一句话说清它是什么？", "back": "第一，**基因复制**：整段基因被复制后，副本可以自由变异出new功能，这是复杂化最干净的来源。", "tags": ["ch18"]}, {"id": "f072", "chapterId": "ch18", "front": "为什么不能说“进化朝向复杂”——一句话说清它是什么？", "back": "自然选择只对当下的繁殖成功负责，没有方向。", "tags": ["ch18"]}, {"id": "f073", "chapterId": "ch19", "front": "第 19 章一句话核心是什么？", "back": "复杂性科学最大的问题不是没有洞见，而是洞见容易被说成万能比喻；它的出路是把跨领域的类比落成可检验的模型与可复现的结果。", "tags": ["ch19"]}, {"id": "f074", "chapterId": "ch19", "front": "批评：一堆比喻，没有定律——一句话说清它是什么？", "back": "约翰·霍根在 1995 年写文章质疑复杂性科学：说它只会把“涌现”“自组织”“混沌边缘”这些词从一个领域搬到另一个领域，没有可检验的预言。", "tags": ["ch19"]}, {"id": "f075", "chapterId": "ch19", "front": "已经站住的部分——一句话说清它是什么？", "back": "米歇尔列的成果包括：混沌与敏感依赖的定量刻画、小世界与幂律的网络统计、遗传算法与粒子计算的可行模型、复杂度的多种度量及其适用边界。", "tags": ["ch19"]}, {"id": "f076", "chapterId": "ch19", "front": "未来的三条路——一句话说清它是什么？", "back": "第一，从类比走向机制：把“涌现”翻译成具体的相互作用与反馈。", "tags": ["ch19"]}], "companion": "complex学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：复杂性是什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用三个例子说明“简单个体、复杂整体”是什么意思\n<\/li><li>\n能列出复杂系统的几条共性并各配一个反例检验\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂系统是由大量相对简单的成分互相作用、在没有中央指挥的情况下涌现出宏观秩序的系统；研究复杂性，就是研究这种秩序是怎么来的、又该怎么度量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从五个例子看共性（难度：基础）<\/h3>\n<p>蚁群里没有总指挥，单只蚂蚁只对几样化学信号做反应，但整个群体能分工、能修路、能打仗。大脑里没有一个神经元知道你在想什么，可上亿神经元的放电让你会算账、会认人。免疫系统没有花名册，却能认出从未见过的病原体。经济里没有一个按钮控制价格，供需却会自己找到某种平衡。万维网没有总编辑，链接却长成了有枢纽、有社区的结构。米歇尔把它们摆在一起，是为了让你先感到“像”，再去追究“为什么像”。<\/p>\n<h3>概念 2：复杂系统的三条共性（难度：基础）<\/h3>\n<p>第一条是<strong>涌现<\/strong>（emergent behavior，白话：整体表现出任何单个成分都不具备的行为）。第二条是<strong>信息处理<\/strong>：系统靠传递和解读信号来协调，蚂蚁用信息素，神经元用动作电位，免疫细胞用分子标记。第三条是<strong>适应<\/strong>：系统会随环境改变自己的行为，免疫系统会“记住”病原体，市场会因新政策重新定价。三条里最容易被忽略的是第二条——很多号称复杂的系统其实只是“乱”，不乱且有秩序的系统往往都在传递某种信号。<\/p>\n<h3>概念 3：为什么“复杂”难定义（难度：进阶）<\/h3>\n<p>米歇尔没有给一个统一公式，而是给了一串候选：描述它需要多少信息、生成它需要多少步骤、它的组织层次有多深。原因很实在：不同系统的“复杂”不是同一种东西。一串随机数不可压缩，但我们不觉得它复杂；一幅名画可以压缩成几条构图规则，我们却觉得它复杂。所以“复杂性”不是单一量，而是一族相关但不同的度量，后面第 7 章逐个过一遍。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从五个例子看共性&quot;]\n  n2[&quot;复杂系统的三条共性&quot;]\n  n1 --&gt; n2\n  n3[&quot;为什么“复杂”难定义&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：把复杂系统想成一个没有项目经理的工地：每个工人只知道自己眼前那点活，靠喊话和手势对接，最后楼盖起来了。边界：真实工地有图纸和验收标准，蚁群没有；一旦你假设系统里有“隐形的图纸”，后面的解释就会变成循环论证。\n<\/li><li>\n<strong>实例<\/strong>：拿一个蚁群验一遍三条共性：涌现——单只蚂蚁不会造桥，群体能用身体搭桥过沟；信息处理——发现食物的蚂蚁沿途留下信息素，同伴顺着浓度走；适应——食物源搬走后，旧路径的信息素会挥发，群体改道。三条都能对上，说明这套描述不是硬套。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“复杂”就是“难”或“乱”——实际上复杂系统恰恰是有秩序的一类，随机系统反而在米歇尔的意义上不复杂。\n<\/li><li>\n别以为存在某个“复杂性公式”能算出蚂蚁和大脑谁更复杂——实际上第 7 章会看到，换一种度量，排名就换。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下面哪一项最不符合米歇尔对复杂系统的描述？\n<ul>\n<li>\nA. 蚁群靠信息素协调觅食\n<\/li><li>\nB. 大脑靠神经元放电产生思维\n<\/li><li>\nC. 一台空调按设定温度开关压缩机\n<\/li><li>\nD. 市场靠买卖双方报价形成价格\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：空调的行为由中央控制器按固定规则执行，属于简单控制系统；它没有大量成分的局部互动，也没有涌现。\n<\/li><li>\n“涌现”在书里的确切含义是？\n<\/li><li>\nA. 系统变得很乱，无法预测\n<\/li><li>\nB. 整体表现出单个成分不具备的行为\n<\/li><li>\nC. 成分数量超过某个阈值\n<\/li><li>\nD. 系统对外界刺激作出反应\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：涌现强调的是整体层面的新性质，与混乱程度、数量阈值都不是一回事。数量多但没有新性质，只是“多”。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n复杂系统 = 大量简单成分 + 局部互动 + 无中央指挥 + 涌现秩序\n<\/li><li>\n三条共性：涌现、信息处理、适应\n<\/li><li>\n复杂不是单一量，是一族度量\n<\/ul>", "kind": "chapter", "title": "第 1 章 复杂性是什么"}, "ch02": {"html": "<h1>第 2 章：动力学、混沌和预测<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01；会做函数迭代\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能手算 logistic 映射的前几步并解释 r 变化带来的行为变化\n<\/li><li>\n能说清“对初值敏感”为什么等于“长期预测不可能”，而不是“系统随机”\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>确定性系统也能不可预测：只要演化对初值极度敏感，初始测量的一点点误差就会被指数放大，长期预测在物理上失效，而不只是技术上不够好。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：动力系统：把变化写成迭代（难度：基础）<\/h3>\n<p><strong>动力系统<\/strong>（dynamical system，白话：状态按固定规则一步步变的系统）用一条规则描述“下一步是什么”。兔子繁殖的经典例子是：今年兔子数 × 每只兔子的繁殖率 = 明年兔子数。如果繁殖率是常数，数量要么爆炸、要么归零。真实生态里食物有限，所以繁殖率要随数量下降——把“繁殖率 = r×(1−当前数量/上限)”代进去，就得到<strong>逻辑斯蒂映射<\/strong>（logistic map）：x_{n+1} = r·x_n·(1−x_n)，这里 x 是“占环境容量的比例”，介于 0 和 1。<\/p>\n<h3>概念 2：r 从 2 调到 4：稳定、振荡、混沌（难度：进阶）<\/h3>\n<p>r 小的时候，无论初值取多少，序列最后都收敛到同一个固定值——这叫<strong>不动点<\/strong>。r 增大到约 3 以上，序列开始在两个值之间来回跳，称为<strong>分岔<\/strong>（bifurcation，白话：一个稳定状态分裂成两个）。继续增大，2 个变 4 个、4 个变 8 个，分岔越来越密，最后进入<strong>混沌<\/strong>（chaos）：序列看起来像随机数，却完全由公式决定。判断混沌的一个实用标志是<strong>对初值敏感<\/strong>：初值差 0.000001，几十步后两条轨迹就毫无关系。<\/p>\n<h3>概念 3：预测的三重墙（难度：高难）<\/h3>\n<p>米歇尔把预测的困难分成三层。第一层是测量精度：真实初值永远测不准。第二层是误差放大：混沌系统里误差按指数增长，放大到系统尺度只需要几十步。第三层是模型误差：你连规则本身都可能写错。三层叠起来，结论是<strong>长期天气预报在这类系统里不是算力问题，是数学问题<\/strong>。这也解释了为什么气象局只能说“未来十天大致可信”，而不是“再买台超算就能算到明年”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;动力系统：把变化写成迭代&quot;]\n  n2[&quot;r 从 2 调到 4：稳定、振荡、混沌&quot;]\n  n1 --&gt; n2\n  n3[&quot;预测的三重墙&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图时注意链条的方向：越往后不是“误差更大”，而是“误差放大速度超过了你补充精度的能力”。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：混沌像把两粒几乎重合的骰子同时扔进同一个斜坡：起步只差一根头发，滚到底时一个向左一个向右。边界：斜坡是固定地形，混沌系统的“地形”本身可能随状态改变，所以类比只覆盖敏感放大这一层。\n<\/li><li>\n<strong>实例<\/strong>：取 r=4、x0=0.5，手算：0.5→1.0→0→0→0，直接死掉（这是特例，说明初值挑得巧会撞上短周期）。换 x0=0.4：0.4→0.96→0.1536→0.5200→0.9984……几步之内就在 0 和 1 之间乱跳，但每一步都可复核。再把 x0 改成 0.400001，前 5 步几乎一样，20 步后完全不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为混沌系统是随机的——实际上它是确定性的，给定完全相同的初值会给出完全相同的轨迹。\n<\/li><li>\n别以为只要算得更快就能预测混沌——实际上误差放大是指数的，算力提升是对数的，追不上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nlogistic 映射中 r=4、x0=0.5 立刻变成 0，说明了什么？\n<ul>\n<li>\nA. 混沌系统无法计算\n<\/li><li>\nB. 特定初值可能落入短周期或不动点\n<\/li><li>\nC. r=4 时系统一定是随机的\n<\/li><li>\nD. 模型参数写错了\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：这是精确初值导致的退化轨迹；混沌是对初值敏感，不是说所有初值都会乱跳。\n<\/li><li>\n“长期天气不可预测”在书中的理由是？\n<\/li><li>\nA. 观测站太少\n<\/li><li>\nB. 计算机速度不够\n<\/li><li>\nC. 误差在混沌系统中指数放大\n<\/li><li>\nD. 天气预报员经验不足\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：米歇尔强调的是数学性质：敏感依赖使误差放大速度超过任何精度提升。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nx_{n+1}=r·x_n(1−x_n)，r 越大越乱\n<\/li><li>\n分岔：一个稳定状态分成两个\n<\/li><li>\n混沌 = 确定性 + 对初值敏感 + 长期不可预测\n<\/ul>", "kind": "chapter", "title": "第 2 章 动力学、混沌和预测"}, "ch03": {"html": "<h1>第 3 章：信息<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch02；对数\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用“意外程度”解释香农信息量，并算出简单情形的比特数\n<\/li><li>\n能说清麦克斯韦妖为什么不能违反热力学第二定律\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>信息是“不确定性的减少”：一件事越难猜，它发生时所含的信息越多；熵是这种不确定性的度量，因此信息与热力学熵是同一个数学量在两套语境下的名字。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：熵：从热机到“有多少种排法”（难度：基础）<\/h3>\n<p><strong>熵<\/strong>（entropy，白话：一个宏观状态对应多少种微观排法）在统计力学里由玻尔兹曼给出：S = k·log W，W 是微观状态数。一盘整齐排列的分子只有一种排法，熵低；打散之后排法无数，熵高。系统自发从低熵走向高熵，不是因为“喜欢乱”，而是因为高熵的排法数量压倒性地多，随机走一步几乎必然走进高熵那一边。<\/p>\n<h3>概念 2：香农信息：意外值多少钱（难度：进阶）<\/h3>\n<p><strong>香农信息<\/strong>（Shannon information，白话：收到消息后不确定性减少了多少）把“信息量”定义成 −log₂ p。抛一枚均匀硬币，结果 p=0.5，信息量 1 比特；如果硬币两面都是正面，p=1，信息量 0——你早就知道，它没带来任何新东西。一串序列的总信息量是所有符号信息量之和。这里有个反直觉的结论：完全随机的序列信息量最大，但它是无意义的；有意义的信息恰恰是“有规律因而可压缩”的那部分。<\/p>\n<h3>概念 3：麦克斯韦妖：为什么它赢不了（难度：高难）<\/h3>\n<p>设想一个小妖守着隔板上的小门，看到快分子就放去左边、慢分子放去右边，于是左边变热、右边变冷，熵下降了。这个思想实验曾被当成第二定律的反例。解决的关键不在分子，而在妖：它必须<strong>测量<\/strong>分子的速度并<strong>记住<\/strong>结果，测量和存储信息本身要消耗能量、产生熵。把妖的记忆擦掉时付出的代价，正好抵消它制造的温差。信息不是免费的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;熵：从热机到“有多少种排法”&quot;]\n  n2[&quot;香农信息：意外值多少钱&quot;]\n  n1 --&gt; n2\n  n3[&quot;麦克斯韦妖：为什么它赢不了&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：信息量像“猜谜的难度”：一本你知道答案的书，翻开来什么也没告诉你。边界：这个类比只管“意外程度”，不管“意义”；一本书可能信息量很低却很深刻，香农熵不区分这两者。\n<\/li><li>\n<strong>实例<\/strong>：猜一个 1 到 8 的整数，每次只能问是/否。均匀分布时最优策略是二分，3 个问题必中，总信息量 3 比特 = log₂8。若你事先知道答案是 5，则信息量为 0。若分布是“90% 是 5”，那么问“是 5 吗”一次就有 90% 命中，期望问题数小于 3——分布越偏，熵越低。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵增是因为系统“趋向混乱”——实际上是高熵对应的微观排法更多，概率上占绝对多数。\n<\/li><li>\n别以为信息越多越好——实际上随机噪声信息量最大，却毫无用处。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一枚两面相同的硬币抛一次，香农信息量是多少？\n<ul>\n<li>\nA. 0 比特\n<\/li><li>\nB. 0.5 比特\n<\/li><li>\nC. 1 比特\n<\/li><li>\nD. 2 比特\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：p=1，−log₂1=0：结果完全可预测，没有减少任何不确定性。\n<\/li><li>\n麦克斯韦妖不能永久降低熵，关键原因是？\n<\/li><li>\nA. 分子太小抓不住\n<\/li><li>\nB. 测量与记忆、擦除记忆需要耗能产熵\n<\/li><li>\nC. 隔板不导热\n<\/li><li>\nD. 热力学第二定律只适用于宏观系统\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：兰道尔原理指出擦除 1 比特信息至少耗散 kT ln2 的能量，妖的账要一起算。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n信息 = 不确定性的减少 = −log₂p\n<\/li><li>\n熵 = 微观排法数 = k log W\n<\/li><li>\n妖要测量和记忆，信息处理有热力学成本\n<\/ul>", "kind": "chapter", "title": "第 3 章 信息"}, "ch04": {"html": "<h1>第 4 章：计算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.8 小时 ｜ <strong>前置<\/strong>：ch03；基本逻辑\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述图灵机的三个部件和它如何一步步运行\n<\/li><li>\n能说清哥德尔不完全性与停机问题的共同结构\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算可以被抽象成一台极简机器：一条纸带、一个读写头、一套规则；凡是这台机器算得出的，就是“可计算”的，而它算不出的（如停机问题），任何更强的机器也算不出。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：希尔伯特的清单与哥德尔的一击（难度：基础）<\/h3>\n<p>希尔伯特在 1900 年提出一揽子问题，核心是：数学是否完备（每个真命题都能证）、是否一致（不会证出矛盾）、是否可判定（有机械程序判定任意命题真假）。1931 年<strong>哥德尔<\/strong>（Kurt Gödel）用<strong>哥德尔编码<\/strong>把“这句话不可证”写成算术命题，证明任何足够强的一致系统里都存在既不能证真也不能证假的命题。完备性与一致性不可兼得。<\/p>\n<h3>概念 2：图灵机：把“机械程序”变成实物（难度：进阶）<\/h3>\n<p><strong>图灵机<\/strong>（Turing machine，白话：一条无限长的纸带 + 一个能读能写能左右移动的读写头 + 一张规则表）只有有限个内部状态。每一步：读当前格子符号 → 查规则 → 写下新符号 → 左移或右移 → 换状态。听起来简陋，但丘奇-图灵论题认为：任何直觉上“可机械计算”的东西，都能用图灵机算。<\/p>\n<h3>概念 3：停机问题：算不出来的东西长什么样（难度：高难）<\/h3>\n<p><strong>停机问题<\/strong>（halting problem）：给定程序和输入，判断它会不会最终停下来。图灵的证明是反证法：假设有判定机 H，构造一个程序 D，它调用 H 判断“D 自己会不会停”，然后做相反的事——若 H 说会停，D 就不停；若 H 说不听，D 就停。矛盾。结论不是“我们还没聪明到能判定”，而是<strong>这样的程序在逻辑上不存在<\/strong>。这与哥德尔同构：都是用自指把系统逼到墙角。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;希尔伯特的清单与哥德尔的一击&quot;]\n  n2[&quot;图灵机：把“机械程序”变成实物&quot;]\n  n1 --&gt; n2\n  n3[&quot;停机问题：算不出来的东西长什么样&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：图灵机像一台只会做“看、查表、写、挪一步”的流水线工人；不管多复杂的活，都拆成这几步。边界：图灵机假设纸带无限长、时间无限多；真实计算机两样都有限，所以“理论上可算”不等于“实际算得完”。\n<\/li><li>\n<strong>实例<\/strong>：写一条规则：状态 A，读到 0 → 写 1、右移、保持 A；读到 1 → 停机。输入 000，运行轨迹：格1 写1右移 → 格2 写1右移 → 格3 写1右移 → 读到空白停机，输出 111。整个过程只有一条规则，却是完整可执行的程序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为停机问题说明“计算机不够强”——实际上它是逻辑边界：强到能算它的机器会自相矛盾。\n<\/li><li>\n别以为哥德尔定理让数学变得不可靠——实际上它只否定“完备且一致”的幻想，数学照常运转。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n图灵机的基本部件不包括？\n<ul>\n<li>\nA. 无限纸带\n<\/li><li>\nB. 读写头\n<\/li><li>\nC. 规则表\n<\/li><li>\nD. 随机数发生器\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：标准图灵机是确定性的；随机性要额外加一条“掷硬币”通道，那是另一类模型。\n<\/li><li>\n停机问题不可解，其证明的核心手法是？\n<\/li><li>\nA. 穷举所有程序\n<\/li><li>\nB. 构造自指程序制造矛盾\n<\/li><li>\nC. 证明纸带不够长\n<\/li><li>\nD. 用哥德尔编码数数\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：假设存在判定机，再构造一个“专跟判定机对着干”的程序，矛盾即证。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图灵机 = 纸带 + 读写头 + 规则表\n<\/li><li>\n可计算 = 图灵可计算（丘奇-图灵论题）\n<\/li><li>\n停机问题与哥德尔同构：自指导致边界\n<\/ul>", "kind": "chapter", "title": "第 4 章 计算"}, "ch05": {"html": "<h1>第 5 章：进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用三要素复述自然选择，并指出常见误解\n<\/li><li>\n能说出孟德尔遗传与现代综合各自补上了达尔文的哪块短板\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>进化没有设计者，也没有目标：变异提供原料，遗传保证连续性，选择压力把当下有效的留下；三步循环足够在没有图纸的情况下造出精巧结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：达尔文之前：目的论的解释为什么不够（难度：基础）<\/h3>\n<p>在达尔文之前，解释生物为什么精巧，主流答案是“造物主设计”或“生命力驱动”。达尔文的贡献不是发现变异，而是提出一个不需要设计者的机制：只要变异存在、变异可遗传、不同变异带来的后代数量不同，性状分布就会一代代偏移。他用人工育种（鸽子、狗）作为可观察的证据，说明这个机制在短时间尺度上确实有效。<\/p>\n<h3>概念 2：孟德尔补上“遗传怎么不稀释”（难度：基础）<\/h3>\n<p>达尔文的一个难题是：如果父母性状混合，优势性状几代就被稀释掉。<strong>孟德尔<\/strong>（Gregor Mendel）用豌豆实验提出离散的遗传因子：性状由成对的因子决定，分离时不混合。这正好解释了为什么变异能保留。1900 年孟德尔论文被重新发现，随后与达尔文理论合并成<strong>现代综合<\/strong>（modern synthesis）：进化 = 种群中基因频率的改变。<\/p>\n<h3>概念 3：现代综合之后被挑战的三处（难度：进阶）<\/h3>\n<p>书里点了三个薄弱处：一是<strong>中性演化<\/strong>，木村资生指出大量分子层面的变化既不好也不坏，靠漂变固定，选择不是唯一动力；二是<strong>发育<\/strong>，同样的基因在不同发育程序下能长出完全不同的身体，进化不能只看基因频率；三是<strong>跃迁式变化<\/strong>，大突变、基因复制、 symbiosis 都可能一步带来大改变，不全是微小变异的累积。这些挑战没有推翻达尔文，但把“进化 = 渐变 + 选择”这个简化版修正了。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;达尔文之前：目的论的解释为什么不够&quot;]\n  n2[&quot;孟德尔补上“遗传怎么不稀释”&quot;]\n  n1 --&gt; n2\n  n3[&quot;现代综合之后被挑战的三处&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：自然选择像一个从不看说明书、只按销量补货的店主：卖得好的多进，卖不动的下架，没有谁在设计爆款。边界：店主有目标（利润），进化没有；把进化说成“为了适应而变异”就是偷回了目的论。\n<\/li><li>\n<strong>实例<\/strong>：抗生素耐药是一个可以现场验证的例子：一片菌落里本来就有极少数带耐药基因的个体（变异），抗生素杀掉其余（选择），幸存者繁殖（遗传）。三天后菌落以耐药株为主。全程没有任何细菌“努力”去突变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为进化是“为了适应环境而主动改变”——实际上变异是盲目的，选择才是定向的。\n<\/li><li>\n别以为“最强者生存”指体力最强——实际上指留下后代最多，可能靠跑得快、也可能靠会装死。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n孟德尔的工作解决了达尔文理论的哪个难题？\n<ul>\n<li>\nA. 地球年龄不够长\n<\/li><li>\nB. 混合遗传会稀释变异\n<\/li><li>\nC. 物种是否会灭绝\n<\/li><li>\nD. 化石记录不完整\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：离散遗传因子使变异不被混合稀释，这是现代综合的关键拼块。\n<\/li><li>\n中性演化理论的主要主张是？\n<\/li><li>\nA. 所有变异都受选择\n<\/li><li>\nB. 大量分子变异不受选择、靠漂变固定\n<\/li><li>\nC. 进化由灾变驱动\n<\/li><li>\nD. 获得性性状可遗传\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：木村资生提出中性突变-随机漂变假说，纠正了“每个变异都有适应意义”的过度解读。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n进化三要素：变异、遗传、选择\n<\/li><li>\n现代综合 = 达尔文 + 孟德尔（基因频率改变）\n<\/li><li>\n中性演化与发育生物学修正了“纯渐变+纯选择”\n<\/ul>", "kind": "chapter", "title": "第 5 章 进化"}, "ch06": {"html": "<h1>第 6 章：遗传学概要<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出 DNA→RNA→蛋白质的信息流，并指出其中哪一步有自指\n<\/li><li>\n能解释突变率为什么低却不为零\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DNA 是可复制的程序，细胞是可执行它的机器；这套系统最特别的地方在于，执行程序的机器本身也是由程序编码出来的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：双螺旋与密码子（难度：基础）<\/h3>\n<p>1953 年沃森和克里克给出 DNA 双螺旋结构：两条链由碱基配对（A-T、G-C）连起来，可以解开各自复制。<strong>转录<\/strong>（transcription，白话：把 DNA 抄成 mRNA）之后，<strong>翻译<\/strong>（translation，白话：按三个碱基一个<strong>密码子<\/strong>查表装氨基酸）在核糖体上装配出蛋白质。20 世纪 60 年代密码表被破译，生物学第一次有了“通用字符集”。<\/p>\n<h3>概念 2：突变：复制错误是进化的原料（难度：基础）<\/h3>\n<p>复制不是完美的：碱基配对偶尔出错，大约每千亿个核苷酸出一次；还有插入、缺失、重复。绝大多数突变有害或中性，极少数有用，但进化只需要极少数。关键是突变率不能太高：太高则后代面目全非，积累不了优势；太低则适应太慢。进化调到了一个中间值。<\/p>\n<h3>概念 3：自指：机器由自己的产物造出来（难度：高难）<\/h3>\n<p>mRNA、tRNA、核糖体、聚合酶这些执行转录翻译的装置，本身也是 DNA 编码、由这套装置生产出来的。这是一个闭环：程序生产机器，机器执行程序。米歇尔在第 8 章会拿它和冯·诺依曼的自复制自动机对照——生命与计算在这里撞上了同一个结构难题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;双螺旋与密码子&quot;]\n  n2[&quot;突变：复制错误是进化的原料&quot;]\n  n1 --&gt; n2\n  n3[&quot;自指：机器由自己的产物造出来&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：DNA 像一份既能复制自己、又能造出印刷机的图纸：印刷机印图纸，图纸造印刷机。边界：图纸不会自己行动，细胞里还有大量调控与代谢网络，不能简化成“DNA 决定一切”。\n<\/li><li>\n<strong>实例<\/strong>：一个碱基替换（点突变）可能只改一个氨基酸，蛋白质照样工作；如果替换发生在关键活性位点，酶就失效。同一个错误，后果取决于位置——这就是为什么“突变有害”不能一概而论。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为一个基因决定一个性状——实际上多数性状由多基因与环境共同决定。\n<\/li><li>\n别以为 DNA 就是“生命的全部程序”——实际上表观遗传、剪接、非编码 RNA 都在参与调控。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n中心法则的信息流顺序是？\n<ul>\n<li>\nA. 蛋白质→DNA→RNA\n<\/li><li>\nB. DNA→RNA→蛋白质\n<\/li><li>\nC. RNA→蛋白质→DNA\n<\/li><li>\nD. DNA→蛋白质→RNA\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：转录（DNA→RNA）与翻译（RNA→蛋白质）构成主流信息流。\n<\/li><li>\n为什么突变率不能太高？\n<\/li><li>\nA. 会让细胞立刻死亡\n<\/li><li>\nB. 后代变化过大，无法稳定积累有利性状\n<\/li><li>\nC. 会增加能耗\n<\/li><li>\nD. 会破坏双螺旋结构\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：进化需要在“有变化”和“保住已有成果”之间取平衡。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDNA→RNA→蛋白质\n<\/li><li>\n突变是原料，多数有害、少数有用\n<\/li><li>\n执行程序机器本身也被程序编码（自指）\n<\/ul>", "kind": "chapter", "title": "第 6 章 遗传学概要"}, "ch07": {"html": "<h1>第 7 章：度量复杂性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.8 小时 ｜ <strong>前置<\/strong>：ch03、ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能对比熵、算法信息量、逻辑深度三种度量的差别与各自失效场景\n<\/li><li>\n能用“随机串 vs 规律串 vs 复杂图案”说明为什么单一度量不够\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>没有一种度量能同时抓住“随机”和“有组织”这两件事：熵把随机判为最复杂，算法信息量把规律判为最简单，逻辑深度才勉强把“花了多少步才生成”算进来——所以复杂性必须用一组度量分场景使用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：熵与算法信息量：一对反向的尺子（难度：进阶）<\/h3>\n<p>用熵度量，一串随机比特的熵最高，可它毫无结构。<strong>算法信息量<\/strong>（algorithmic information，白话：能生成这串数据的最短程序的长度）正好相反：随机串没有更短的描述，只能照抄，程序最长；而 010101… 这种规律串，程序只要三行。把两把尺子并排看，就能区分“随机复杂”与“有规律所以简单”。<\/p>\n<h3>概念 2：逻辑深度：把生成过程算进来（难度：高难）<\/h3>\n<p><strong>逻辑深度<\/strong>（logical depth，贝内特提出，白话：从最短描述出发，算出这串数据要跑多少步）试图区分“简单但算得久”和“复杂但一算就出”。比如一张复杂的分形图，描述极短（几条迭代规则），但要跑很多步才显现——深度高。而随机串描述长、几乎不用算——深度低。这个度量抓住了“组织需要时间积累”的直觉。<\/p>\n<h3>概念 3：其余几种与它们的局限（难度：高难）<\/h3>\n<p>还有热力学深度（生成过程中耗散的能量）、有效复杂度、统计复杂性（正则模型的规模）、分形维数（用维度刻画自相似结构）、层次性度量（嵌套层次的深度）。劳埃德统计过 40 种。米歇尔的态度是：不要指望挑出一个“正确”的，先问你想区分什么——想区分随机与有序用熵与算法信息量，想区分“精巧”与“平淡”用深度与层次。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;熵与算法信息量：一对反向的尺子&quot;]\n  n2[&quot;逻辑深度：把生成过程算进来&quot;]\n  n1 --&gt; n2\n  n3[&quot;其余几种与它们的局限&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：三种度量像一个班的三张成绩单：熵只看出勤乱不乱，算法信息量看笔记能不能精简，逻辑深度看做作业花了多少步。边界：成绩单再好也不能代替“这人是否聪明”，度量只是刻画某一个侧面。\n<\/li><li>\n<strong>实例<\/strong>：三个 20 位的串：A=00000000000000000000，B=01010101010101010101，C=随机生成的 20 位。熵：C 最高。算法信息量：A 与 B 极短（“全零”“交替”），C 约 20 位。逻辑深度：A 与 B 跑一两步就出，C 也不用算，三者都低；真正深度高的是“一条规则跑一万步才出现的图案”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熵最高的系统最复杂——实际上随机系统没有组织，米歇尔不把它算作复杂。\n<\/li><li>\n别以为算法信息量不可计算就毫无用处——实际上它给出了理论边界，并启发了压缩、统计复杂性等可计算的近似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用算法信息量衡量，随机串的特点是？\n<ul>\n<li>\nA. 程序最短\n<\/li><li>\nB. 程序最长，几乎无法压缩\n<\/li><li>\nC. 逻辑深度最高\n<\/li><li>\nD. 熵最低\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：随机串没有可利用的规律，最短描述只能逐位照抄。\n<\/li><li>\n逻辑深度想补充熵和算法信息量遗漏的哪一点？\n<\/li><li>\nA. 数据长度\n<\/li><li>\nB. 生成所需的时间/步骤\n<\/li><li>\nC. 存储成本\n<\/li><li>\nD. 符号意义\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：深度把“从描述到结果要跑多少步”计入复杂性，区分“短描述但难生成”的情况。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n熵：随机最高；算法信息量：随机最长\n<\/li><li>\n逻辑深度 = 从最短描述跑到结果的步数\n<\/li><li>\n复杂性是一族度量，按问题选用\n<\/ul>", "kind": "chapter", "title": "第 7 章 度量复杂性"}, "ch08": {"html": "<h1>第 8 章：自我复制的计算机程序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch04、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述自复制的逻辑悖论并说明冯·诺依曼怎么绕开\n<\/li><li>\n能指出程序自复制与 DNA 自复制的关键差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自复制不需要无限嵌套：把“描述”和“执行”分成两层，一份程序既当图纸又当工人，就能造出包含自己图纸的副本。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：表面上的无限倒退（难度：基础）<\/h3>\n<p>复制自己必须包含对自己的描述；描述里又包含描述……看起来要无限嵌套，物理上做不到。冯·诺依曼的解法是把事情拆成两件：一份<strong>描述<\/strong>（数据）和一台<strong>通用构造器<\/strong>（能读描述并照着造东西的机器）。构造器照着描述造出新的构造器，再把描述本身复制一份附上去。副本 = 新构造器 + 原描述，自复制完成，没有无限倒退。<\/p>\n<h3>概念 2：程序版：打印自己的程序（难度：进阶）<\/h3>\n<p>写一个程序，运行后输出它自己的源码。技巧是准备两段字符串：一段是“模板”，一段是“数据”（就是模板本身）。程序按模板把数据填进去打印，输出的恰好是原程序。这个构造在 Lisp、C 里都能实现，是理解<strong>自指<\/strong>最便宜的方式。<\/p>\n<h3>概念 3：和 DNA 的关键差别（难度：高难）<\/h3>\n<p>程序自复制需要一个外部<strong>解释器<\/strong>（操作系统、编译器）来执行它；DNA 自复制所用的核糖体、聚合酶，是 DNA 自己编码、由细胞制造的。也就是说，DNA 系统把解释器也纳进了被复制的内容里，闭环更完整。这个差别不是细节，它关系到“生命能不能从零出现”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;表面上的无限倒退&quot;]\n  n2[&quot;程序版：打印自己的程序&quot;]\n  n1 --&gt; n2\n  n3[&quot;和 DNA 的关键差别&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一台复印机同时复印文件和自己：复印机照着图纸造出下一台复印机，然后把自己的图纸也复印一份塞进去。边界：复印机需要外部供电和维修，DNA 系统连“供电维修”都编码在自己的程序里。\n<\/li><li>\n<strong>实例<\/strong>：用两段字符串 s1=「打印(s2 的内容)」、s2=「s1 的内容」，程序执行时把 s1 里的占位换成 s2 的原文再打印，输出即原程序。这是最简自复制，Quine 程序就是这个原理。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自复制必须“完全一样”——实际上副本只要包含描述与构造能力即可，允许微小差异，这正是变异的空间。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n冯·诺依曼解决自复制悖论的关键是？\n<ul>\n<li>\nA. 让程序无限长\n<\/li><li>\nB. 把描述与构造分成两层\n<\/li><li>\nC. 使用随机数\n<\/li><li>\nD. 允许副本出错\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：通用构造器 + 独立描述，避免了描述的无限嵌套。\n<\/li><li>\n程序自复制与 DNA 自复制最大的差别是？\n<\/li><li>\nA. DNA 不需要能量\n<\/li><li>\nB. 程序依赖外部解释器，DNA 的解释器由自身编码\n<\/li><li>\nC. 程序不能变异\n<\/li><li>\nD. DNA 不能复制描述\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：DNA 把核糖体等执行装置也纳入了自身编码范围，闭环更完整。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n描述 + 通用构造器 = 自复制\n<\/li><li>\nQuine 程序：打印自己的源码\n<\/li><li>\nDNA 把解释器也编码进去\n<\/ul>", "kind": "chapter", "title": "第 8 章 自我复制的计算机程序"}, "ch09": {"html": "<h1>第 9 章：遗传算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch05、ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出遗传算法的四个步骤并用 Robby 例子说明\n<\/li><li>\n能解释为什么“进化出的策略”常常是人类看不懂的\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>遗传算法把进化搬进计算机：一群候选解，按适应度筛选，靠交叉和突变产生新解，多代之后得到人写不出来的好策略。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算法配方（难度：基础）<\/h3>\n<p>四步循环：①初始化一群随机个体（每个个体是一串“基因”）；②计算每个个体的<strong>适应度<\/strong>（fitness，白话：它解决任务的表现分数）；③按适应度选择，分数高的多留后代；④<strong>交叉<\/strong>（crossover，白话：两个父代基因串切一刀互换片段）加<strong>突变<\/strong>（mutation，白话：随机改几个位）。重复几百上千代。<\/p>\n<h3>概念 2：Robby：一个能数分的机器人（难度：进阶）<\/h3>\n<p>罗比在一个 10×10 的格子里捡易拉罐，能感知上下左右和自己的方向、是否带罐，动作只有移动、捡、随机停。评分规则：捡一个罐加分，撞墙、乱捡扣分。它的“基因”是 243 个格子的查表规则。随机策略平均约 346 分；遗传算法演化出的最好策略约 483 分，几乎接近理论最优。关键不是分数，而是<strong>策略长得不像人写的<\/strong>：它会绕圈、会先扫边缘、会在特定格子上做看似多余的动作，但统计上更优。<\/p>\n<h3>概念 3：为什么人看不懂却有效（难度：高难）<\/h3>\n<p>因为选择只奖励结果，不奖励可解释性。243 条规则里很多条几乎用不到，是演化路径上的“历史残留”。这也带来一个代价：<strong>过拟合<\/strong>。如果训练场景太单一，演化出的策略可能只是背下了那些场景，换个地形就崩。所以评估环境必须足够多样。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;算法配方&quot;]\n  n2[&quot;Robby：一个能数分的机器人&quot;]\n  n1 --&gt; n2\n  n3[&quot;为什么人看不懂却有效&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像让一千个盲人画师各自临摹，只把最像的几张留下来互相拼接涂改，几百轮后出现一幅谁也没设计过的画。边界：画师有明确的“像”作为目标，进化只有当下的分数，目标本身可能漂移。\n<\/li><li>\n<strong>实例<\/strong>：手算一代：4 个个体分数 10、8、5、3。按比例选择，前两个各留两份、第三个留一份、第四个淘汰；把 1 号与 2 号的基因串在第 5 位切开互换，得到两个新个体；再随机翻转一位。新一代重新评分。这个流程跑十代，肉眼可见分数上升。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为遗传算法一定找到全局最优——实际上它容易卡在局部高峰，且高度依赖评估环境的设计。\n<\/li><li>\n别以为演化出的策略越简单越好——实际上冗余规则常常是演化路径的必要脚手架。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n遗传算法的四个核心步骤是？\n<ul>\n<li>\nA. 采样、拟合、预测、验证\n<\/li><li>\nB. 初始化、评估、选择、交叉与突变\n<\/li><li>\nC. 编码、解码、压缩、解压\n<\/li><li>\nD. 训练、测试、部署、监控\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：其余选项属于统计学习或工程流程，不是进化计算。\n<\/li><li>\n罗比实验中随机策略与演化策略的平均分大约是？\n<\/li><li>\nA. 346 与 483\n<\/li><li>\nB. 100 与 400\n<\/li><li>\nC. 483 与 500\n<\/li><li>\nD. 0 与 243\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：原文给出随机约 346、演化最好约 483，接近最优。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGA = 初始化 + 适应度 + 选择 + 交叉突变\n<\/li><li>\n选择只奖励结果，不保证可解释\n<\/li><li>\n评估环境要多样，否则过拟合\n<\/ul>", "kind": "chapter", "title": "第 9 章 遗传算法"}, "ch10": {"html": "<h1>第 10 章：元胞自动机、生命和宇宙<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能定义元胞自动机并说明局部规则如何产生全局图案\n<\/li><li>\n能说出沃尔夫勒姆四类元胞机的区别，并指出“第四类=复杂”的证据与争议\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>元胞自动机证明了一件事：极其简单的局部规则，不需要中央控制，也能生成无法用简单公式预测的复杂图案——宇宙也许就是这类系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：规则有多简单（难度：基础）<\/h3>\n<p><strong>元胞自动机<\/strong>（cellular automaton，白话：一排（或一片）格子，每格有有限种状态，每步按“看自己和邻居”的固定规则同时更新）。一维两状态、只看左右邻居的规则共 256 条，编号 0–255。比如规则 90 从单个黑格出发，生成的是谢尔宾斯基三角；规则 30 生成的图案看起来像随机噪声，却完全确定。<\/p>\n<h3>概念 2：生命游戏：二维的经典（难度：进阶）<\/h3>\n<p>康威的<strong>生命游戏<\/strong>（Game of Life）规则只有三条：活细胞邻居少于 2 个则死（孤独），多于 3 个则死（拥挤），恰好 3 个则活；死细胞周围恰好 3 个活则复活。就这三条，能产生滑翔机（每四代平移一格）、振荡器、甚至能构造逻辑门与通用计算机。<\/p>\n<h3>概念 3：沃尔夫勒姆的四类（难度：高难）<\/h3>\n<p>沃尔夫勒姆把一维元胞机按行为分成四类：一类迅速归于 uniform（全死或全活）；二类变成稳定周期图案；三类是混沌式的伪随机；四类产生局部结构，结构之间还能相互作用。他主张第四类位于“混沌边缘”，是复杂计算的温床。争议在于：分类靠肉眼与统计，四类的边界并不严格，而且“宇宙是元胞机”目前只是假说，没有可检验的推论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;规则有多简单&quot;]\n  n2[&quot;生命游戏：二维的经典&quot;]\n  n1 --&gt; n2\n  n3[&quot;沃尔夫勒姆的四类&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一屋子人只按“我身边三个人的动作”决定自己下一步动作，没有人喊口令，最后整屋人却跳起了同一支舞。边界：这支舞是规则决定的，不是他们商量出来的；一旦你把“跳舞的意图”加回去，就误解了元胞机。\n<\/li><li>\n<strong>实例<\/strong>：生命游戏里放三个活细胞成一条横线，下一代变成竖线，再下一代又变回横线——这是周期 2 的振荡器。放五个细胞成“滑翔机”形，四代之后整体平移一格，形状不变。只看规则，你能手推出前两代；推二十代就会算错，这正是复杂性的手感。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为元胞机只是玩具——实际上它被用来做通用计算、模拟流体与生态系统。\n<\/li><li>\n别以为规则简单就一定能预测——实际上规则 30 这类系统没有比逐步模拟更快的算法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n生命游戏中一个活细胞有 4 个活邻居，下一代它会？\n<ul>\n<li>\nA. 存活\n<\/li><li>\nB. 死亡\n<\/li><li>\nC. 复活\n<\/li><li>\nD. 随机\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：邻居多于 3 个判定为拥挤而死亡。\n<\/li><li>\n沃尔夫勒姆第四类的特征是？\n<\/li><li>\nA. 全部归零\n<\/li><li>\nB. 稳定周期\n<\/li><li>\nC. 伪随机混沌\n<\/li><li>\nD. 局部结构能相互作用\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：第四类的标志是出现可识别的局部结构（如滑翔机），并能彼此作用。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nCA：局部规则 + 同步更新 → 全局图案\n<\/li><li>\n生命游戏三条规则可产生通用计算\n<\/li><li>\n沃尔夫勒姆四类：均匀、周期、混沌、复杂\n<\/ul>", "kind": "chapter", "title": "第 10 章 元胞自动机、生命和宇宙"}, "ch11": {"html": "<h1>第 11 章：粒子计算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释“粒子”在元胞机里指什么，以及为什么它等于信息载体\n<\/li><li>\n能说明用粒子碰撞实现逻辑门的基本思路\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>在混沌边缘的元胞机里，会自发出现能长距离传播、碰撞后仍保持身份的局部结构；这些“粒子”就是信息，碰撞就是逻辑运算。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从图案到粒子（难度：进阶）<\/h3>\n<p>在规则 110 这类元胞机里，背景是周期性格子，但会冒出一些稳定的缺陷结构，它们在时空图上以固定速度斜着走。米歇尔和赫拉贝尔、达斯把这些结构叫<strong>粒子<\/strong>（particle，白话：能移动、能保持形状的局部构型）。粒子的种类有限，相遇时的结果可枚举——这就像一张碰撞表。<\/p>\n<h3>概念 2：碰撞即计算（难度：高难）<\/h3>\n<p>如果两种粒子相撞后一种消失、另一种继续，可以编码成“1 与 0 相撞得 0”；调整角度和相位，就能搭出与、或、非门。把所有门连起来，元胞机就能做通用计算。这条思路的意义在于：计算不必由人设计进去，它可以<strong>从规则里长出来<\/strong>。<\/p>\n<h3>概念 3：对“生命=计算”的分寸（难度：高难）<\/h3>\n<p>米歇尔对“宇宙是计算机”这类说法保持距离。她的论点更窄：某些自然系统确实在做信息处理，粒子计算给出了一个可操作的模型；但这不等于说所有自然过程都等价于图灵机，也不等于说“计算”能解释意义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从图案到粒子&quot;]\n  n2[&quot;碰撞即计算&quot;]\n  n1 --&gt; n2\n  n3[&quot;对“生命=计算”的分寸&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像高速公路上的车流：车是粒子，变道与刹车是碰撞，交通规则是元胞机规则；某些路口的通过顺序恰好实现了“与门”。边界：车有司机，粒子没有意图；把碰撞说成“设计好的逻辑”容易倒果为因。\n<\/li><li>\n<strong>实例<\/strong>：规则 110 中，一个“滑翔”结构从右向左移动，另一结构从左向右移动，二者相遇后一个湮灭、一个转向。把“湮灭”记为输出 0，把“继续”记为 1，两张碰撞表拼起来就是半个逻辑门。这不需要额外写代码，规则 110 本身已包含。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为粒子是元胞机里被专门放进去的元件——实际上它们是规则自发产生的稳定结构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n元胞机中的“粒子”指的是？\n<ul>\n<li>\nA. 格子里的基本单元\n<\/li><li>\nB. 自发产生并能稳定传播的局部结构\n<\/li><li>\nC. 随机噪声\n<\/li><li>\nD. 外部输入的信号\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：粒子是时空图上的稳定缺陷结构，能传播、能碰撞。\n<\/li><li>\n粒子计算的核心主张是？\n<\/li><li>\nA. 计算必须由人设计\n<\/li><li>\nB. 碰撞可实现逻辑运算，计算可从规则中涌现\n<\/li><li>\nC. 元胞机不能通用\n<\/li><li>\nD. 粒子就是电子\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：米歇尔的实验表明局部碰撞足以编码逻辑门。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n粒子 = 可传播的稳定局部结构 = 信息载体\n<\/li><li>\n碰撞表 → 逻辑门 → 通用计算\n<\/li><li>\n计算可以从规则中长出来\n<\/ul>", "kind": "chapter", "title": "第 11 章 粒子计算"}, "ch12": {"html": "<h1>第 12 章：生命系统中的信息处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch11\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能对比计算机、元胞机、免疫系统、蚁群、代谢网络五种信息处理方式的差别\n<\/li><li>\n能说明“分布式、无程序、靠进化得到”带来的三个后果\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命系统的信息处理没有中央处理器、没有预先写好的程序，靠大量局部互动和化学信号完成；这种“分布式 + 进化而来”的方式更难分析，也更难容错。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：五种系统，五种组织方式（难度：进阶）<\/h3>\n<p>传统计算机：指令顺序执行，存储器集中，程序与硬件分离。元胞机：规则固定、更新并行、无中央。免疫系统：细胞在体内游走，靠分子识别“自我/非我”，没有清单，靠克隆扩增与选择。蚁群：个体只对信息素浓度反应，路径是集体记忆。代谢网络：酶催化反应链，局部浓度调节流量。米歇尔把它们的共同点抽出来：都在处理“环境中有什么、该做什么”的信息。<\/p>\n<h3>概念 2：三个后果（难度：高难）<\/h3>\n<p>第一，<strong>难分解<\/strong>：你无法把免疫系统拆成“识别模块 + 记忆模块”，功能缠在结构里。第二，<strong>容错<\/strong>：没有单点，坏掉一部分仍能运转，代价是行为难以精确控制。第三，<strong>解释难<\/strong>：系统没有可读的程序，只能用统计、扰动实验、模型去反推规则。<\/p>\n<h3>概念 3：“信息处理”这个说法该用到哪（难度：高难）<\/h3>\n<p>米歇尔提醒：把一切都叫信息处理，会让这个词失去内容。她的用法有门槛——系统必须靠某种可传递的差异（浓度、电位、分子标记）来协调行为，并且这种差异能被系统“读取”而影响后续动作。蚂蚁的信息素符合，心脏跳动就未必要这么说。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;五种系统，五种组织方式&quot;]\n  n2[&quot;三个后果&quot;]\n  n1 --&gt; n2\n  n3[&quot;“信息处理”这个说法该用到哪&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家没有老板、没有流程手册的餐馆：厨师看备料剩多少决定做什么，跑堂看客人表情决定推荐什么，最后菜上齐了。边界：餐馆还有菜单和账本作为外部约束，免疫系统连“菜单”都是边做边改的。\n<\/li><li>\n<strong>实例<\/strong>：免疫系统的克隆选择：某种 B 细胞受体恰好能识别新病原，遇到抗原后被刺激大量增殖，其中一部分变成记忆细胞。整个过程没有“病原数据库”，识别能力是现成多样性的筛选结果——和遗传算法的选择步骤结构相同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为所有生物系统都在“计算”——实际上米歇尔要求有可读取的差异参与协调，否则“计算”只是修辞。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n免疫系统识别病原的方式最接近下列哪一项？\n<ul>\n<li>\nA. 查预先存好的病原清单\n<\/li><li>\nB. 从现成多样性中筛选并扩增\n<\/li><li>\nC. 由大脑下发指令\n<\/li><li>\nD. 随机试错直到成功\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：克隆选择：先有大量随机多样的受体，遇到抗原后筛选扩增。\n<\/li><li>\n分布式信息处理的典型代价是？\n<\/li><li>\nA. 无法容错\n<\/li><li>\nB. 行为难以精确控制与解释\n<\/li><li>\nC. 必须中央存储\n<\/li><li>\nD. 无法进化\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：没有中央控制带来鲁棒性，同时牺牲了可预测性与可解释性。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五种系统：计算机、CA、免疫、蚁群、代谢\n<\/li><li>\n分布式 = 容错 + 难解释\n<\/li><li>\n“信息处理”需要可读取的差异参与协调\n<\/ul>", "kind": "chapter", "title": "第 12 章 生命系统中的信息处理"}, "ch13": {"html": "<h1>第 13 章：如何进行类比（如果你是计算机）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch12\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能定义类比并说明它为什么是智能的核心而非装饰\n<\/li><li>\n能说出 Copycat 里“滑动”和“温度”各控制什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>类比是在两件表面不同的事物之间发现抽象结构对应；它没法用固定规则查表实现，因为“哪些特征该对应”本身取决于语境。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：类比不是找相同点（难度：基础）<\/h3>\n<p>“鞋子对脚，手套对___？”答案显而易见。但米歇尔指出真正难的是开放类比：abc 变成 abd，那么 kji 该变成什么？可以是 kjh（改末尾），也可以是 hji（改开头），还可以是 lkj（整体后移）。选哪个取决于你把哪部分看成“核心结构”。<strong>类比<\/strong>（analogy，白话：在两个不同事物间建立结构对应）的难点不在找相似，而在决定用什么眼光看。<\/p>\n<h3>概念 2：Copycat：让概念在网络上滑动（难度：高难）<\/h3>\n<p>侯世达的 <strong>Copycat<\/strong> 程序把字母、字母序、方向、组块等做成一个语义网络，节点有<strong>活性<\/strong>（activation），连线有<strong>阻抗<\/strong>。解题时，程序在网络上随机游走，哪个概念被反复激活就更容易被用；<strong>滑动<\/strong>（slippage）允许对应关系在解题中途改变，比如把“改末尾”滑成“改开头”。<strong>温度<\/strong>（temperature）控制随机性：温度高时乱试，低时锁定当前方案。<\/p>\n<h3>概念 3：为什么这件事对 AI 难（难度：高难）<\/h3>\n<p>因为类比需要“知道什么重要”。传统程序把重要特征写死在特征表里；而人类是临时决定什么算特征。Copycat 的尝试是用动态激活替代固定特征表，但它仍在一个很小的字母世界里工作。米歇尔自己的看法是：类比能力可能是通用智能的门槛之一，而不是一个可以单独模块化的技能。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;类比不是找相同点&quot;]\n  n2[&quot;Copycat：让概念在网络上滑动&quot;]\n  n1 --&gt; n2\n  n3[&quot;为什么这件事对 AI 难&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把一段旋律从钢琴搬到吉他：不是每个音都一样，而是“起伏的形状”被保留。边界：音乐有明确的音阶约束，开放类比连“该保留什么形状”都要现定。\n<\/li><li>\n<strong>实例<\/strong>：abc→abd 是“改最后一个字母”。kji 按同一眼光应为 kjh。若你把 abc 看成“a 后面跟着递增序列”，则会得到 lkj（整体后移）。同一个例子，两种合理答案，差别在你看重哪层结构——这就是 Copycat 要处理的事。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为类比就是相似度打分——实际上它要求先建立对应关系，再判断哪些差异可以忽略。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nCopycat 中“温度”参数控制的是？\n<ul>\n<li>\nA. 网络规模\n<\/li><li>\nB. 随机性与探索程度\n<\/li><li>\nC. 字母数量\n<\/li><li>\nD. 记忆容量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：温度高则更多随机尝试，低则更确定地沿当前路径推进。\n<\/li><li>\n类比之所以难以规则化，核心原因是？\n<\/li><li>\nA. 词汇量太大\n<\/li><li>\nB. 哪些特征对应取决于语境，需要临时决定\n<\/li><li>\nC. 计算量太大\n<\/li><li>\nD. 缺少训练数据\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：难点在“选择什么眼光”，不是匹配算力。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n类比 = 跨表面差异的结构对应\n<\/li><li>\nCopycat：激活 + 阻抗 + 滑动 + 温度\n<\/li><li>\n难在决定什么算重要特征\n<\/ul>", "kind": "chapter", "title": "第 13 章 如何进行类比（如果你是计算机）"}, "ch14": {"html": "<h1>第 14 章：计算机模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch09、ch13\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分“数学模型”与“原理模型”，并说明仿真模型属于哪一类\n<\/li><li>\n能指出糖域模型这类模拟在什么意义上算证据\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>计算机模型不是把现实搬进机器，而是把“你认为重要的几条规则”写进去，看它们能不能长出你观察到的现象；它是论证工具，不是预言机。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：模型与原理的分工（难度：基础）<\/h3>\n<p><strong>数学模型<\/strong>用方程描述关系，能算却不一定解释机制（牛顿的引力公式被质疑过“没说清原理”）。<strong>原理模型<\/strong>用可理解的机制描述“事情如何发生”，如自然选择。仿真模型是第三种：把规则写成程序跑起来，让现象自己涌现。糖域（Sugarscape）就是代表——格子有糖，代理人有代谢、视野、规则，结果自发出现迁徙、贫富分化、贸易。<\/p>\n<h3>概念 2：模拟能证明什么（难度：高难）<\/h3>\n<p>米歇尔的态度很克制：模拟能证明“这套规则足以产生那个现象”，即<strong>充分性<\/strong>；它不能证明现实就是这套规则，即<strong>必要性<\/strong>。所以模拟的价值在于排除不可能、生成假设、找出反直觉后果，而不是“跑出结果就等于发现规律”。<\/p>\n<h3>概念 3：合作演化的模拟（难度：高难）<\/h3>\n<p>书里讲了用 GA 演化合作行为的实验：个体在网格上博弈，背叛会被邻居看见并惩罚。结果显示，只要惩罚成本不太高、能被看见，合作就能稳定存在。这类结论的说服力来自“参数扫一遍、结论仍成立”，而不是某一次运行的好看画面——单次运行什么都能凑出来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;模型与原理的分工&quot;]\n  n2[&quot;模拟能证明什么&quot;]\n  n1 --&gt; n2\n  n3[&quot;合作演化的模拟&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用乐高搭一座桥：能站住就说明这套积木和搭法可行，但不能证明真桥就是这么搭的。边界：乐高没有重力与材料疲劳，仿真模型也总有被省略的变量。\n<\/li><li>\n<strong>实例<\/strong>：糖域里给代理两条规则：看向视野内糖最多的格子、移动到那里；每走一步消耗代谢糖。跑起来会看到人群聚成几团、边缘贫瘠区被放弃。你能复核每条规则，却无法手算 1000 步后的分布——这正是仿真模型的用处。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为仿真跑出漂亮结果就等于发现了机制——实际上它只证明“规则够用”，不证明“现实就是这样”。\n<\/li><li>\n别以为模型越复杂越真实——实际上关键变量没抓住时，加细节只是加噪声。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n仿真模型能提供的最强结论是？\n<ul>\n<li>\nA. 现实必然如此\n<\/li><li>\nB. 这套规则足以产生该现象\n<\/li><li>\nC. 现象无法预测\n<\/li><li>\nD. 模型参数唯一\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：模拟证明充分性，不证明必要性。\n<\/li><li>\n判断合作演化模拟结论是否可靠，书里强调要看？\n<\/li><li>\nA. 单次运行画面\n<\/li><li>\nB. 参数扫描后结论是否稳定\n<\/li><li>\nC. 代码行数\n<\/li><li>\nD. 作者名气\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：单次运行容易凑巧，鲁棒性要靠参数扫描。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n模型三类：数学、原理、仿真\n<\/li><li>\n模拟证明充分性，不证明必要性\n<\/li><li>\n结论可靠性靠参数扫描\n<\/ul>", "kind": "chapter", "title": "第 14 章 计算机模型"}, "ch15": {"html": "<h1>第 15 章：网络科学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch14\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能画出小世界网络的形成过程并解释“少量长程连接”的作用\n<\/li><li>\n能区分小世界性与无标度性，各给一个例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>真实网络既不是随机图也不是规则格子：它们平均距离很短（小世界），度分布又常常是幂律（无标度），这两种性质都能用极简的生成规则解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：六度分隔：短路径的实证（难度：基础）<\/h3>\n<p>米尔格拉姆在 1960 年代做过一个传递实验：把信交给陌生人，只允许交给认识的熟人，看几跳能到目标。成功送达的信平均经过约六步，这就是“<strong>六度分隔<\/strong>”（six degrees of separation）。这个实验的样本小、完成率低，但结论——真实社交网络的平均路径极短——后来被大量数据反复验证。<\/p>\n<h3>概念 2：瓦茨-斯特罗加茨：少量随机重连（难度：进阶）<\/h3>\n<p>规则格子上，平均距离随规模线性增长。瓦茨和斯特罗加茨的做法是：从规则格子出发，把极少数边随机重连到远处。结果平均路径长度骤降——原文提到前 5 次随机重连就能把平均路径砍掉一半左右。这就是<strong>小世界网络<\/strong>（small-world network，白话：局部抱团 + 少数长程捷径）。<\/p>\n<h3>概念 3：无标度与枢纽（难度：高难）<\/h3>\n<p><strong>无标度<\/strong>（scale-free，白话：度分布是幂律，没有“典型规模”）意味着少数节点连接极多（枢纽），多数节点连接很少。巴拉巴西用网页链接、论文引用验证了这一点。幂律的来源常被归因于“优先连接”：新节点更愿意连已经很有名的节点。争议在于：很多真实网络只在部分区间近似幂律，硬套会误导。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;六度分隔：短路径的实证&quot;]\n  n2[&quot;瓦茨-斯特罗加茨：少量随机重连&quot;]\n  n1 --&gt; n2\n  n3[&quot;无标度与枢纽&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：小世界像一个大公司里每个人都认识本部门所有人，另有几个人跨部门认识很多人：找人只需两三跳。边界：公司有组织架构，社交网络没有；把“部门”当成真实分群会过度简化。\n<\/li><li>\n<strong>实例<\/strong>：1000 个节点的环，平均距离约 250。加 5 条随机长边，平均距离掉到几十。再加到 20 条，几乎降到个位数——这就是“少量捷径改变全局”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为小世界性等于“人人相连”——实际上它靠少量长程连接，多数连接仍是局部的。\n<\/li><li>\n别以为幂律无处不在——实际上很多分布只是头部像幂律，尾部不是。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n小世界网络的关键结构是？\n<ul>\n<li>\nA. 完全随机连接\n<\/li><li>\nB. 局部密集 + 少量长程连接\n<\/li><li>\nC. 所有节点度数相同\n<\/li><li>\nD. 树状层级\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：局部抱团提供冗余，少数捷径压缩平均路径。\n<\/li><li>\n无标度网络的度分布特征是？\n<\/li><li>\nA. 正态分布\n<\/li><li>\nB. 均匀分布\n<\/li><li>\nC. 幂律分布\n<\/li><li>\nD. 双峰分布\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：幂律意味着没有特征尺度，少数枢纽连接极多。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n小世界 = 局部 + 少量长程捷径\n<\/li><li>\n无标度 = 度分布幂律 + 枢纽\n<\/li><li>\n六度分隔：平均路径极短\n<\/ul>", "kind": "chapter", "title": "第 15 章 网络科学"}, "ch16": {"html": "<h1>第 16 章：真实世界中的网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch15\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能举出三类真实网络并说明它们为什么都呈小世界\n<\/li><li>\n能解释网络的鲁棒性与脆弱性为什么是一枚硬币的两面\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>大脑、代谢、食物网、互联网、引用网络都呈小世界结构，因为小世界同时给出了“短路径”和“抗故障”这两个进化与工程都想要的性质。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：生物网络为什么偏爱小世界（难度：进阶）<\/h3>\n<p>线虫的神经网络、猫与猴的脑区连接、代谢网络都被测出小世界性。原因是双重收益：短路径让信号快速到达，局部冗余让局部损伤不致命。代谢网络里，大多数底物参与少数反应，少数枢纽（如 ATP、NAD）参与极多反应——去掉一个普通节点几乎无感，去掉枢纽就瘫痪。<\/p>\n<h3>概念 2：枢纽的双面性（难度：高难）<\/h3>\n<p>枢纽让网络高效，也让网络脆弱。互联网删掉随机路由器影响有限，删掉少数核心路由器可能分裂成孤岛；流行病学里，免疫枢纽个体比随机免疫同样比例的人更有效。这也解释了“<strong>引爆点<\/strong>”（tipping point）：当连接度或传播率越过某条线，影响会突然放大——论文引用、时尚流行、金融传染都符合这个形状。<\/p>\n<h3>概念 3：从结构到动力学（难度：高难）<\/h3>\n<p>米歇尔提醒，网络拓扑只是一半。同一个网络，传播规则不同（是谣言还是病毒、是否有免疫、是否重连），结果差很远。所以“网络科学”的结论往往是条件性的：在什么传播规则下，什么结构会带来什么行为。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;生物网络为什么偏爱小世界&quot;]\n  n2[&quot;枢纽的双面性&quot;]\n  n1 --&gt; n2\n  n3[&quot;从结构到动力学&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：枢纽像城市里的机场中转站：航线效率极高，一旦关闭，全国转机都乱。边界：机场可以临时启用备用，生物网络没有“备用枢纽”，损伤就是永久的。\n<\/li><li>\n<strong>实例<\/strong>：在 1000 节点的小世界网络里做传播模拟：随机去掉 10% 节点，连通性基本保持；按度数从高到低去掉 10%，网络很快碎成多块。同样 10%，位置决定后果。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为连接越多越好——实际上多连接带来效率，也带来级联失效与传播风险。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n生物网络呈小世界性的主要收益是？\n<ul>\n<li>\nA. 节点数量少\n<\/li><li>\nB. 短路径 + 局部冗余抗损\n<\/li><li>\nC. 没有枢纽\n<\/li><li>\nD. 度分布均匀\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：既快又稳，这是进化偏好的组合。\n<\/li><li>\n“引爆点”描述的是？\n<\/li><li>\nA. 网络规模上限\n<\/li><li>\nB. 传播率越过阈值后影响突然放大\n<\/li><li>\nC. 节点随机失效\n<\/li><li>\nD. 幂律的尾部\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：正反馈把系统推过临界点后，增长呈爆炸式。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n脑、代谢、食物网、互联网都是小世界\n<\/li><li>\n枢纽 = 高效 + 脆弱\n<\/li><li>\n引爆点 = 阈值 + 正反馈\n<\/ul>", "kind": "chapter", "title": "第 16 章 真实世界中的网络"}, "ch17": {"html": "<h1>第 17 章：比例之谜<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch15\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出克莱伯定律的 3/4 指数并说明它为何反直觉\n<\/li><li>\n能说明分形网络如何把 3/4 推出来，以及这个解释的争议\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>动物的代谢率与体重的 3/4 次幂成正比，而不是按表面积推算的 2/3；这个“多出来的指数”可以用分形式的养分输送网络解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么 2/3 不够（难度：进阶）<\/h3>\n<p>热量通过体表散失，表面积随体长的平方增长，体积（体重）随立方增长，所以按面积/体积比，代谢率应正比于体重的 2/3。但克莱伯的数据显示指数是 3/4：体重变 16 倍，代谢率变 8 倍（16^{3/4}=8），而不是 16^{2/3}≈6.35。差得不多，却是系统性的偏差，几十年的数据都指向 3/4。<\/p>\n<h3>概念 2：分形网络：把 3/4 从几何里长出来（难度：高难）<\/h3>\n<p>韦斯特、布朗、恩奎斯特提出：体内输送网络（血管、气管）是<strong>分形<\/strong>（fractal，白话：每一级都在更小尺度上重复同一分支模式）。为了让末端（细胞）都能被服务，网络必须不断分叉、填充三维空间。数学上这种最优填充给出的标度指数是 3/4。这个理论漂亮，但争议不断：不同类群测出的指数在 2/3 到 1 之间浮动，代谢率还受温度、活动量影响。<\/p>\n<h3>概念 3：幂律的普适与滥用（难度：高难）<\/h3>\n<p>幂律在自然界很常见：城市规模与专利数、词频、地震强度、公司规模。米歇尔的态度与前面一致：先确认机制，再谈普适。看到直线在双对数坐标上，不能立刻宣布“发现了幂律”——有限尺度、采样偏差、拟合区间都能造出假直线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;为什么 2/3 不够&quot;]\n  n2[&quot;分形网络：把 3/4 从几何里长出来&quot;]\n  n1 --&gt; n2\n  n3[&quot;幂律的普适与滥用&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：分形网络像一棵树：主干粗、分支多，每片叶子都能接到水，但整棵树的“管道总长”随体积以特定比例增长。边界：树是静止的，血管会随运动扩张收缩，真实代谢还受激素与行为调节。\n<\/li><li>\n<strong>实例<\/strong>：取体重 1 kg 与 16 kg 的两只动物：按 3/4 律，代谢率比 = 16^{0.75} = 8；按 2/3 律为 16^{0.667≈}6.35。实测小鼠与山羊的差距更接近 8。这个可复核的算式，就是 3/4 之所以被接受的原因之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 3/4 是精确普适常数——实际上类群间有差异，很多研究给出 0.65–0.75 的区间。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n克莱伯定律的指数是？\n<ul>\n<li>\nA. 1/2\n<\/li><li>\nB. 2/3\n<\/li><li>\nC. 3/4\n<\/li><li>\nD. 1\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：代谢率 ∝ 体重^{3/4}，这是原文反复强调的反直觉结论。\n<\/li><li>\n支持 3/4 的主要机制解释是？\n<\/li><li>\nA. 体表散热\n<\/li><li>\nB. 分形式输送网络的最优填充\n<\/li><li>\nC. 心跳频率恒定\n<\/li><li>\nD. 食物摄入量\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：韦斯特等人的分形网络模型给出 3/4 指数，但仍有争议。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n代谢率 ∝ 体重^{3/4}（克莱伯定律）\n<\/li><li>\n2/3 来自表面积，3/4 来自分形输送网络\n<\/li><li>\n双对数直线不等于真幂律\n<\/ul>", "kind": "chapter", "title": "第 17 章 比例之谜"}, "ch18": {"html": "<h1>第 18 章：进化，复杂化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch05、ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“基因组复杂性随时间增长”这一说法为何站不住\n<\/li><li>\n能举出两种不靠渐变也能提高复杂性的机制\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>进化不保证越来越复杂：复杂度上升只是偶尔发生的结果，而且“复杂”本身没有统一度量；基因复制、发育调控、共生都能一步带来结构跃迁。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把基因组当程序看，会漏掉什么（难度：进阶）<\/h3>\n<p>沃森-克里克之后，流行把 DNA 看成“细胞的程序”。这个比喻有用，但会漏掉三件事：一是大量非编码序列在调控而非编码；二是同一个基因通过<strong>可变剪接<\/strong>能产出多种蛋白；三是发育过程本身有物理与几何约束，不是纯粹按指令装配。<\/p>\n<h3>概念 2：复杂度上升的几条真实路径（难度：高难）<\/h3>\n<p>第一，<strong>基因复制<\/strong>：整段基因被复制后，副本可以自由变异出new功能，这是复杂化最干净的来源。第二，<strong>发育调控<\/strong>：少量调控基因改变表达时序，就能长出全新的身体结构，不必新增很多基因。第三，<strong>共生与水平转移<\/strong>：整块遗传物质从一处搬到另一处，一步获得整套能力。三条都不是“微小变异慢慢累积”的教科书版本。<\/p>\n<h3>概念 3：为什么不能说“进化朝向复杂”（难度：高难）<\/h3>\n<p>自然选择只对当下的繁殖成功负责，没有方向。寄生虫、洞穴鱼在复杂环境里反而简化。所谓“复杂化趋势”是观察偏差：复杂系统更容易被我们注意到，而简单化在化石里不留痕迹。米歇尔把结论收得很紧：复杂性可以上升，也可以下降，没有内在箭头。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;把基因组当程序看，会漏掉什么&quot;]\n  n2[&quot;复杂度上升的几条真实路径&quot;]\n  n1 --&gt; n2\n  n3[&quot;为什么不能说“进化朝向复杂”&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家公司扩大业务：既可能靠一点点加人手（渐变），也可能靠并购一整支团队（基因复制）、靠改组织架构（发育调控）。边界：公司有老板想扩张，进化没有意图。\n<\/li><li>\n<strong>实例<\/strong>：脊椎动物的基因组里有一段古老的整基因组复制痕迹（两轮），随后大量副本丢失、少数获得新功能（如血红蛋白家族的多个版本）。这说明“复制—丢失—分化”是一条可查的复杂化路径。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为进化必然从简单走向复杂——实际上简化在寄生与洞穴生物中很常见，且更省能量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列哪项不是书中提到的复杂化机制？\n<ul>\n<li>\nA. 基因复制\n<\/li><li>\nB. 发育调控改变\n<\/li><li>\nC. 共生/水平转移\n<\/li><li>\nD. 所有突变都朝向更复杂\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：突变是随机的，不存在朝向复杂的内在倾向。\n<\/li><li>\n把基因组直接类比为“程序”会漏掉？\n<\/li><li>\nA. 碱基配对规则\n<\/li><li>\nB. 非编码调控与可变剪接\n<\/li><li>\nC. 双螺旋结构\n<\/li><li>\nD. 密码子表\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：调控层与剪接使同一段序列产出多种结果，程序比喻覆盖不到。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n复杂度没有单一度量，也就没有单一趋势\n<\/li><li>\n复杂化路径：复制、调控、共生\n<\/li><li>\n进化没有方向，简化同样常见\n<\/ul>", "kind": "chapter", "title": "第 18 章 进化，复杂化"}, "ch19": {"html": "<h1>第 19 章：复杂性科学的过去和未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述霍根式批评的要点并给出米歇尔的回应\n<\/li><li>\n能判断一个“复杂系统”说法属于有内容的结论还是隐喻\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂性科学最大的问题不是没有洞见，而是洞见容易被说成万能比喻；它的出路是把跨领域的类比落成可检验的模型与可复现的结果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：批评：一堆比喻，没有定律（难度：进阶）<\/h3>\n<p>约翰·霍根在 1995 年写文章质疑复杂性科学：说它只会把“涌现”“自组织”“混沌边缘”这些词从一个领域搬到另一个领域，没有可检验的预言。米歇尔承认部分批评有理，尤其是“什么都往里装”的倾向，但她指出批评也常引用失真——她自己被引用的那句话就被剪得只剩负面半句。<\/p>\n<h3>概念 2：已经站住的部分（难度：高难）<\/h3>\n<p>米歇尔列的成果包括：混沌与敏感依赖的定量刻画、小世界与幂律的网络统计、遗传算法与粒子计算的可行模型、复杂度的多种度量及其适用边界。这些不是“万物理论”，但它们各自在自己的领域里可计算、可复现、可反驳。<\/p>\n<h3>概念 3：未来的三条路（难度：高难）<\/h3>\n<p>第一，从类比走向机制：把“涌现”翻译成具体的相互作用与反馈。第二，从单次模拟走向统计规律：报告分布而非个例。第三，从“跨学科口号”走向共享工具：网络分析、信息度量、进化算法已经做到了，下一步是把它们接到真实数据上。米歇尔最后的态度是谨慎乐观：复杂性研究更像一门正在成形的工具箱，而不是一门已经完成的学科。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;批评：一堆比喻，没有定律&quot;]\n  n2[&quot;已经站住的部分&quot;]\n  n1 --&gt; n2\n  n3[&quot;未来的三条路&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一群医生各自带着不同的听诊器来会诊同一个病人：工具不同，结论要能对上同一份病历。边界：会诊有共同的解剖学，复杂性科学还没有统一的对象定义。\n<\/li><li>\n<strong>实例<\/strong>：拿一个“复杂系统”说法检验：如果它只说“这是复杂系统所以难预测”，那是隐喻；如果它能说出“因为度分布是幂律、枢纽占 5%、传播率超过阈值 1.2，所以会级联失效”，那是可检验的结论。二者的差别就是米歇尔要守的线。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为复杂性科学已经给出普适定律——实际上它给出的是一组工具与条件性结论。\n<\/li><li>\n别以为批评者全是外行误解——实际上部分批评点中了“比喻替代机制”的要害。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n米歇尔对复杂性科学的总体判断是？\n<ul>\n<li>\nA. 已完成的统一理论\n<\/li><li>\nB. 伪科学\n<\/li><li>\nC. 正在成形的工具体系，有成果也有夸饰\n<\/li><li>\nD. 只适用于物理学\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：她既承认成果，也承认“万能比喻”的问题。\n<\/li><li>\n按本书标准，下面哪种说法最有内容？\n<\/li><li>\nA. 经济是复杂系统，所以不可预测\n<\/li><li>\nB. 涌现让整体大于部分之和\n<\/li><li>\nC. 网络枢纽占少数且传播率过阈值时会出现级联失效\n<\/li><li>\nD. 混沌边缘是创新的源泉\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：只有它给出了可测量、可反驳的条件。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n复杂性科学 = 工具集，不是万物理论\n<\/li><li>\n批评的要害：比喻替代机制\n<\/li><li>\n出路：机制化、统计化、接真实数据\n<\/ul>", "kind": "chapter", "title": "第 19 章 复杂性科学的过去和未来"}, "c01": {"html": "<h1>涌现<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 01 章、第 10 章、第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>整体表现出任何单个成分都不具备的行为，且这种行为来自成分之间的局部互动，而不是某个中央控制器。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整本书的组织原则：没有涌现，蚂蚁、大脑、市场就只是“很多个体”而已。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判断一个现象是不是涌现，问三个问题：成分是否相对简单？互动是否局部？整体性质能否从单个成分的规则里直接读出来？三个都“是”，才谈得上涌现。<\/p>\n<p>反例检验：一台空调也能表现出“维持恒温”的整体行为，但它靠中央控制器读取温度并开关压缩机，规则里已经写好了目标，所以不算涌现。<\/p>\n<p>边界：涌现常被滥用成“说不清就推给涌现”。有内容的说法必须能指出是哪些互动、通过什么反馈，产生了哪个可测量的整体量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为涌现意味着“无法分析”——实际上多数涌现现象可以用模拟逐步还原互动规则。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>五个复杂系统例子的共同点<\/td><td>整体行为不由单个成分决定<\/td><\/tr><tr><td>ch10<\/td><td>元胞自动机<\/td><td>简单局部规则生成全局图案<\/td><\/tr><tr><td>ch11<\/td><td>粒子计算<\/td><td>稳定结构从规则中自发出现<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n自组织、元胞自动机、分布式信息处理\n<\/ul>", "kind": "concept", "title": "涌现"}, "c02": {"html": "<h1>混沌与对初值的敏感依赖<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 02 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>确定性系统因误差被指数放大，使长期演化在实际上不可预测。<\/p>\n<h2>为什么重要<\/h2>\n<p>它划出了预测能力的边界，也是米歇尔反驳“算力万能论”的核心武器。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三个要件：确定性规则、有界状态空间、相邻轨迹指数分离。满足三者，系统就是混沌的。<\/p>\n<p>量化工具是李雅普诺夫指数：两条轨迹的间距大约按 e^{λt} 变化，λ&gt;0 即发散。<\/p>\n<p>重要区分：混沌 ≠ 随机。随机系统没有规则，混沌系统有规则但对初值敏感。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为混沌等于不可知——短期预测仍然可行，失效的是长期。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>logistic 映射与天气<\/td><td>长期预测受数学限制<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n逻辑斯蒂映射、分岔、预测极限\n<\/ul>", "kind": "concept", "title": "混沌与对初值的敏感依赖"}, "c03": {"html": "<h1>算法信息量与逻辑深度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 07 章、第 18 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>算法信息量是描述一段数据所需的最短程序长度；逻辑深度是从该描述算出结果所需的步数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是“复杂性”能否被量化的关键尝试，也解释了为什么不能用一个数字给所有系统排名。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>算法信息量把“随机”判为最复杂（不可压缩），把“有规律”判为最简单。逻辑深度补上了“生成成本”：一条极短规则跑很久才出现的图案，深度高。<\/p>\n<p>两者都不可直接计算（前者不可判定），但可逼近：压缩算法给上界，运行步数给下界。<\/p>\n<p>用途：区分“随机噪声”“简单重复”“精巧组织”三类，正好对应复杂系统研究最想分开的东西。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为算法信息量能直接测量——实际上它不可计算，只能估计。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>度量复杂性<\/td><td>多种度量各有适用面<\/td><\/tr><tr><td>ch18<\/td><td>进化与复杂化<\/td><td>复杂度没有单一趋势<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n熵、统计复杂性、分形维数\n<\/ul>", "kind": "concept", "title": "算法信息量与逻辑深度"}, "c04": {"html": "<h1>自指与自复制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 04 章、第 06 章、第 08 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个系统把对自身的描述纳入自身，从而产生逻辑悖论或实现自我复制。<\/p>\n<h2>为什么重要<\/h2>\n<p>它同时是哥德尔、图灵、冯·诺依曼、DNA 四条线的交汇点，也是“生命为何能自我维持”的抽象答案。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两种用法：破坏性的（哥德尔句、停机问题，用自指制造矛盾证明边界）与建设性的（Quine 程序、冯·诺依曼构造器，用分层绕开无限倒退）。<\/p>\n<p>建设性版本的关键是<strong>分层<\/strong>：描述是一层，执行描述的是另一层；两层都由同一份编码提供，就形成闭环。<\/p>\n<p>生命系统把这一层做到了极致：连解释器（核糖体、聚合酶）也被编码。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自指必然导致悖论——实际上加一层“元”区分就能变成可执行的构造。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>哥德尔与图灵<\/td><td>自指证明系统边界<\/td><\/tr><tr><td>ch08<\/td><td>自复制程序<\/td><td>分层绕开无限倒退<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n哥德尔不完备、停机问题、DNA 复制\n<\/ul>", "kind": "concept", "title": "自指与自复制"}, "c05": {"html": "<h1>小世界与幂律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 15 章、第 16 章、第 17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>小世界指平均路径极短而聚类系数高的网络；幂律指度分布或规模分布没有特征尺度。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两个统计事实把“复杂系统”从定性比喻拉到了可测量层面，也解释了效率与脆弱的共存。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>小世界的生成：局部连接 + 极少数随机长程连接，平均路径长度骤降。<\/p>\n<p>幂律的生成：优先连接（富者愈富）或临界过程。<\/p>\n<p>两者结合产生枢纽：少数节点承担大量连接，效率高、风险集中。<\/p>\n<p>使用时要看区间：很多真实数据只在头部近似幂律。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为幂律意味着普适定律——实际上很多分布只是局部近似。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch15<\/td><td>网络科学<\/td><td>少量捷径压缩路径<\/td><\/tr><tr><td>ch17<\/td><td>比例之谜<\/td><td>代谢率的 3/4 幂律<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n六度分隔、枢纽、引爆点\n<\/ul>", "kind": "concept", "title": "小世界与幂律"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：复杂性是什么<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 复杂性是什么<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：动力学、混沌和预测<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 动力学、混沌和预测<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：信息<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 信息<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：计算<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 计算<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：进化<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 进化<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：遗传学概要<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 遗传学概要<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：度量复杂性<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 度量复杂性<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：自我复制的计算机程序<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 自我复制的计算机程序<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：遗传算法<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 遗传算法<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：元胞自动机、生命和宇宙<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 元胞自动机、生命和宇宙<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：粒子计算<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 粒子计算<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-12'><strong>步骤 12：生命系统中的信息处理<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章 生命系统中的信息处理<\/a><br>检查点：完成第 12 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-13'><strong>步骤 13：如何进行类比（如果你是计算机）<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章 如何进行类比（如果你是计算机）<\/a><br>检查点：完成第 13 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-14'><strong>步骤 14：计算机模型<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章 计算机模型<\/a><br>检查点：完成第 14 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-15'><strong>步骤 15：网络科学<\/strong><br>阅读：<a href=\"#/chapter/ch15\">第 15 章 网络科学<\/a><br>检查点：完成第 15 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-16'><strong>步骤 16：真实世界中的网络<\/strong><br>阅读：<a href=\"#/chapter/ch16\">第 16 章 真实世界中的网络<\/a><br>检查点：完成第 16 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-17'><strong>步骤 17：比例之谜<\/strong><br>阅读：<a href=\"#/chapter/ch17\">第 17 章 比例之谜<\/a><br>检查点：完成第 17 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-18'><strong>步骤 18：进化，复杂化<\/strong><br>阅读：<a href=\"#/chapter/ch18\">第 18 章 进化，复杂化<\/a><br>检查点：完成第 18 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-19'><strong>步骤 19：复杂性科学的过去和未来<\/strong><br>阅读：<a href=\"#/chapter/ch19\">第 19 章 复杂性科学的过去和未来<\/a><br>检查点：完成第 19 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q39.<\/b> 某团队声称“城市交通是复杂系统，所以拥堵无法治理”。按本书标准，这句话的问题在于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 城市不是复杂系统<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 只给了隐喻，没有给出可测量的互动机制与阈值<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 拥堵其实可以精确预测<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 复杂系统不需要模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q40.<\/b> 要判断“蚁群比单个蚂蚁复杂”，最合适的做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 比较体积<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 比较熵<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 比较层次结构与生成过程的深度<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 比较个体数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q41.<\/b> 下面哪组概念在本书里承担同一类角色（都是“简单规则生成复杂行为”）？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 熵与香农信息<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 元胞自动机与遗传算法<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 克莱伯定律与六度分隔<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 哥德尔编码与密码子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章 复杂性是什么<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下面哪一项最不符合米歇尔对复杂系统的描述？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 蚁群靠信息素协调觅食<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 大脑靠神经元放电产生思维<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1
