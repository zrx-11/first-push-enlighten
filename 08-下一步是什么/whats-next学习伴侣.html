: ["违反实验", "需要极端精细抵消才成立", "数学太复杂", "无法观测"], "answer": 1, "explain": "精细抵消缺少对称性保护，被视为可疑。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "暗能量的主要观测证据不包括？", "options": ["超新星", "微波背景", "星系团形成", "实验室称重"], "answer": 3, "explain": "它通过宇宙学尺度效应间接推断。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "青少年冒险增加的一个解释是？", "options": ["前额叶过早成熟", "社会情绪系统与控制系统发育不同步", "灰质消失", "白质减少"], "answer": 1, "explain": "油门先到、刹车后到。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "脑成像解码的核心方法是？", "options": ["单个体素阈值", "多体素模式分类", "脑电频率", "问卷"], "answer": 1, "explain": "它靠模式而不是单点。"}, {"id": "ch08-q1", "chapterId": "ch08", "type": "single", "question": "心身二元论持久的主要原因是？", "options": ["实验支持", "符合直觉且易传播", "数学证明", "宗教唯一"], "answer": 1, "explain": "认知直觉与传播优势，而非证据。"}, {"id": "ch09-q1", "chapterId": "ch09", "type": "single", "question": "两版电车难题的关键差别是？", "options": ["死亡人数", "是否亲手造成死亡", "时间长短", "地点"], "answer": 1, "explain": "亲历性与情绪参与不同。"}, {"id": "ch10-q1", "chapterId": "ch10", "type": "single", "question": "目前证据支持的版本是？", "options": ["语言决定思维", "语言影响注意与分类", "语言无关思维", "只有汉语影响思维"], "answer": 1, "explain": "强版本缺证据，弱版本有实验支持。"}, {"id": "ch11-q1", "chapterId": "ch11", "type": "single", "question": "“再巩固窗口”指的是？", "options": ["记忆形成前", "记忆被唤起后可被修改的时段", "睡眠期", "婴儿期"], "answer": 1, "explain": "唤起后记忆暂时不稳定，可被干预。"}, {"id": "ch12-q1", "chapterId": "ch12", "type": "single", "question": "儿童假装游戏体现的能力是？", "options": ["分不清现实", "同时保持现实与虚构两套表征", "记忆力强", "语言早熟"], "answer": 1, "explain": "双重表征是假装与反事实推理的基础。"}, {"id": "ch13-q1", "chapterId": "ch13", "type": "single", "question": "停表错觉说明？", "options": ["眼睛不眨", "时间感是被重建的", "秒针坏了", "大脑不处理视觉"], "answer": 1, "explain": "倒填机制说明时间感非实时录制。"}, {"id": "ch14-q1", "chapterId": "ch14", "type": "single", "question": "错误信念任务测试的是？", "options": ["记忆力", "能否理解他人持有与自己不同的信念", "语言", "算术"], "answer": 1, "explain": "它要求把他人信念与事实分开。"}, {"id": "ch15-q1", "chapterId": "ch15", "type": "single", "question": "朊病毒的特别之处是？", "options": ["含 DNA", "不含核酸却能传播", "能光合作用", "比细菌大"], "answer": 1, "explain": "它以蛋白构象传递信息。"}, {"id": "ch16-q1", "chapterId": "ch16", "type": "single", "question": "真社会性不包括下列哪项？", "options": ["繁殖分工", "世代重叠", "共同育幼", "个体独立迁徙"], "answer": 3, "explain": "真社会性要求群体长期共存与育幼。"}, {"id": "ch17-q1", "chapterId": "ch17", "type": "single", "question": "判断人类导致灭绝的关键证据不包括？", "options": ["猎杀遗址", "灭绝随人类到达推进", "只针对大型动物", "灭绝动物数量多"], "answer": 3, "explain": "数量多本身不构成因果证据。"}, {"id": "ch18-q1", "chapterId": "ch18", "type": "single", "question": "作者认为科学未碎裂的主要原因是？", "options": ["大家都聪明", "共享方法与工具形成向心力", "经费充足", "期刊少"], "answer": 1, "explain": "方法共识把分化领域拉住。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "“镜像神经元证明人天生有道德”这一说法的主要问题是？", "options": ["样本太少", "从共享运动表征跳到道德判断，跨层无论证", "没有仪器", "只在猴子身上发现"], "answer": 1, "explain": "跨层推论缺少独立论证。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "暗能量“不自然”指的是？", "options": ["违反相对论", "真空能需要极端精细抵消", "无法观测", "密度太大"], "answer": 1, "explain": "理论估算与观测差约 120 个量级。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "青少年冒险增加最合理的解释是？", "options": ["前额叶先成熟", "奖赏系统先于控制系统成熟", "灰质消失", "白质减少"], "answer": 1, "explain": "两系统发育不同步，同伴在场放大效应。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "气候争论的重心已经从“是否变暖”转到“如何适应”；作者认为大规模人口向北迁移是可预见的一种适应方式。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "争论重心的转移——一句话说清它是什么？", "back": "当科学共识基本确立后，公共讨论的问题变成“影响多大、何时发生、怎么应对”。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "迁移作为适应——一句话说清它是什么？", "back": "农业带、水资源、宜居温度都会随纬度变化。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "观察他人动作时，观察者大脑中执行同一动作的神经元也会活动；但这只说明共享表征，不足以直接推出“天生有道德”。", "tags": ["ch02"]}, {"id": "f005", "chapterId": "ch02", "front": "现象——一句话说清它是什么？", "back": "猴子看到别人抓取物体时，自己运动前区的**镜像神经元**（mirror neuron）也会放电。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "从表征到道德的距离——一句话说清它是什么？", "back": "共享动作表征可以解释模仿、共情的一部分，但道德判断还涉及规则、意图、后果权衡。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "人体是进化在旧环境下拼出的产物，许多“缺陷”是环境变化后的失配；增强的思路是找出这些失配点再干预。", "tags": ["ch03"]}, {"id": "f008", "chapterId": "ch03", "front": "进化失配——一句话说清它是什么？", "back": "喜欢高糖高脂在食物稀缺时是优势，在超市时代变成风险。", "tags": ["ch03"]}, {"id": "f009", "chapterId": "ch03", "front": "干预的参数——一句话说清它是什么？", "back": "作者主张先识别可调参数（营养、运动、光暴露、认知训练），再评估副作用与个体差异。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "物理学家用“自然性”判断理论是否可疑：参数需要极端精细的抵消才成立，就被视为不自然；暗能量的微小值正是这种不自然的典型。", "tags": ["ch04"]}, {"id": "f011", "chapterId": "ch04", "front": "自然性标准——一句话说清它是什么？", "back": "如果两个大数几乎完全抵消、只留下一个极小的余量，物理学家会怀疑背后有对称性保护。", "tags": ["ch04"]}, {"id": "f012", "chapterId": "ch04", "front": "两种解释——一句话说清它是什么？", "back": "一是新物理（超对称、额外维度）提供保护。", "tags": ["ch04"]}, {"id": "f013", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "暗能量是让宇宙加速膨胀的成分，占宇宙能量的大部分；它的性质（是否恒定、是否随时间变）仍未有定论。", "tags": ["ch05"]}, {"id": "f014", "chapterId": "ch05", "front": "证据——一句话说清它是什么？", "back": "三类独立观测：遥远超新星的亮度-红移关系、宇宙微波背景的角功率谱、星系团的形成速率。", "tags": ["ch05"]}, {"id": "f015", "chapterId": "ch05", "front": "未定之处——一句话说清它是什么？", "back": "如果它是**宇宙常数**，密度应恒定。", "tags": ["ch05"]}, {"id": "f016", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "青少年期前额叶皮质仍在重组，而社会情绪系统先成熟；两套系统发育不同步，造成“油门先到、刹车后到”。", "tags": ["ch06"]}, {"id": "f017", "chapterId": "ch06", "front": "两条变化——一句话说清它是什么？", "back": "①灰质体积先增后减（突触修剪）。", "tags": ["ch06"]}, {"id": "f018", "chapterId": "ch06", "front": "不同步——一句话说清它是什么？", "back": "负责奖赏与同伴评价的系统在青春期已很活跃，负责抑制与长期规划的系统还在建设。", "tags": ["ch06"]}, {"id": "f019", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "脑成像解码靠模式分类：从体素活动模式推断受试者看的是哪类刺激，但它读的是统计模式，不是思想内容。", "tags": ["ch07"]}, {"id": "f020", "chapterId": "ch07", "front": "模式解码——一句话说清它是什么？", "back": "把每次试验的体素响应当成一个高维向量，训练分类器区分类别。", "tags": ["ch07"]}, {"id": "f021", "chapterId": "ch07", "front": "边界——一句话说清它是什么？", "back": "解码依赖训练数据的类别与受试者配合。", "tags": ["ch07"]}, {"id": "f022", "chapterId": "ch08", "front": "第 8 章一句话核心是什么？", "back": "心身二元论之所以牢固，不是因为证据强，而是因为它符合直觉、容易传播、能安抚对死亡的恐惧；观念的生命力与真假是两条线。", "tags": ["ch08"]}, {"id": "f023", "chapterId": "ch08", "front": "为什么难清除——一句话说清它是什么？", "back": "直觉上“我的身体”与“我”是两样东西。", "tags": ["ch08"]}, {"id": "f024", "chapterId": "ch08", "front": "观念的传播——一句话说清它是什么？", "back": "作者用**模因**（meme）类比：观念靠可记忆、可转述、可情绪共鸣来复制。", "tags": ["ch08"]}, {"id": "f025", "chapterId": "ch09", "front": "第 9 章一句话核心是什么？", "back": "道岔版与天桥版的差别不在结果（都是死一救五），而在是否亲手把人推下去；情绪参与程度不同，判断就不同。", "tags": ["ch09"]}, {"id": "f026", "chapterId": "ch09", "front": "两个版本——一句话说清它是什么？", "back": "道岔版：扳开关，一人死五人活，多数人说可以。", "tags": ["ch09"]}, {"id": "f027", "chapterId": "ch09", "front": "情绪的权重——一句话说清它是什么？", "back": "成像研究显示，亲手推人涉及更强的情绪与身体反应区域。", "tags": ["ch09"]}, {"id": "f028", "chapterId": "ch10", "front": "第 10 章一句话核心是什么？", "back": "语言不决定你能想什么（强版本不成立），但会影响你默认注意什么、怎么分类（弱版本有证据）。", "tags": ["ch10"]}, {"id": "f029", "chapterId": "ch10", "front": "强弱两版——一句话说清它是什么？", "back": "强版本（语言决定思维）缺少证据：没有语言的人也能完成复杂推理。", "tags": ["ch10"]}, {"id": "f030", "chapterId": "ch10", "front": "证据样例——一句话说清它是什么？", "back": "有的语言用绝对方位（东南西北）而非相对方位（左右），使用者在地点记忆任务中表现不同。", "tags": ["ch10"]}, {"id": "f031", "chapterId": "ch11", "front": "第 11 章一句话核心是什么？", "back": "记忆可以被药物与干预调节：增强巩固、削弱再巩固；技术上可行的一部分已经在动物与早期临床中出现，伦理争议比技术更快到来。", "tags": ["ch11"]}, {"id": "f032", "chapterId": "ch11", "front": "两条路径——一句话说清它是什么？", "back": "**增强**：促进突触巩固（如某些促智药、睡眠干预）。", "tags": ["ch11"]}, {"id": "f033", "chapterId": "ch11", "front": "伦理——一句话说清它是什么？", "back": "记忆是人格的一部分：擦除创伤可能救人，也可能抹掉证人证词、改变自我叙述。", "tags": ["ch11"]}, {"id": "f034", "chapterId": "ch12", "front": "第 12 章一句话核心是什么？", "back": "儿童很早就能区分虚构与真实，同时能在虚构世界里做真实推理；假装游戏是练习“心理模型切换”的场所。", "tags": ["ch12"]}, {"id": "f035", "chapterId": "ch12", "front": "两条区分——一句话说清它是什么？", "back": "儿童知道蝙蝠侠是虚构的。", "tags": ["ch12"]}, {"id": "f036", "chapterId": "ch12", "front": "为什么重要——一句话说清它是什么？", "back": "假装要求同时保持两个表征（现实与设定），并按规定切换。", "tags": ["ch12"]}, {"id": "f037", "chapterId": "ch13", "front": "第 13 章一句话核心是什么？", "back": "眼动时你看不到自己的眼睛在移动，因为大脑把两帧画面“缝合”并倒填了时间；时间感是重建出来的，不是实时录制的。", "tags": ["ch13"]}, {"id": "f038", "chapterId": "ch13", "front": "停表错觉——一句话说清它是什么？", "back": "快速转眼看向秒针，会觉得秒针“停了一下”。", "tags": ["ch13"]}, {"id": "f039", "chapterId": "ch13", "front": "为什么需要重建——一句话说清它是什么？", "back": "感官信号有不同延迟，若按到达时间排序，世界会错位。", "tags": ["ch13"]}, {"id": "f040", "chapterId": "ch14", "front": "第 14 章一句话核心是什么？", "back": "智人的关键优势不是单个大脑更大，而是能推断他人知道什么、并据此合作；心理理论与合作形成正反馈。", "tags": ["ch14"]}, {"id": "f041", "chapterId": "ch14", "front": "心理理论——一句话说清它是什么？", "back": "**心理理论**（theory of mind）：能把他人的信念与自己的信念分开。", "tags": ["ch14"]}, {"id": "f042", "chapterId": "ch14", "front": "合作的正反馈——一句话说清它是什么？", "back": "会读心的人更容易合作，合作带来更大收益，收益又奖励更强的读心能力。", "tags": ["ch14"]}, {"id": "f043", "chapterId": "ch15", "front": "第 15 章一句话核心是什么？", "back": "生命树不止细菌与真核两支，还有古菌；朊病毒没有核酸却能传播，逼着我们把“生命”定义从“有 DNA”改成更功能化的判据。", "tags": ["ch15"]}, {"id": "f044", "chapterId": "ch15", "front": "第三支——一句话说清它是什么？", "back": "古菌在膜脂、转录机器上与细菌差异显著，却常生活在极端环境。", "tags": ["ch15"]}, {"id": "f045", "chapterId": "ch15", "front": "朊病毒——一句话说清它是什么？", "back": "**朊病毒**（prion）是错误折叠的蛋白，能把正常蛋白“带坏”，形成连锁。", "tags": ["ch15"]}, {"id": "f046", "chapterId": "ch16", "front": "第 16 章一句话核心是什么？", "back": "真社会性靠三件事：繁殖分工、世代重叠、共同育幼；工蚁不育可以用亲缘选择解释——帮亲属繁殖，基因照样传下去。", "tags": ["ch16"]}, {"id": "f047", "chapterId": "ch16", "front": "三个特征——一句话说清它是什么？", "back": "①只有部分个体繁殖（女王与雄蜂）。", "tags": ["ch16"]}, {"id": "f048", "chapterId": "ch16", "front": "亲缘选择——一句话说清它是什么？", "back": "汉密尔顿规则：利他行为在“受益者携带相同基因的概率 × 收益 > 付出”时能被选择。", "tags": ["ch16"]}, {"id": "f049", "chapterId": "ch17", "front": "第 17 章一句话核心是什么？", "back": "更新世末期的大型动物灭绝与人类到达的时间高度重合；气候也在变化，因此多数案例是“双重驱动”，而非单一原因。", "tags": ["ch17"]}, {"id": "f050", "chapterId": "ch17", "front": "时间重合——一句话说清它是什么？", "back": "澳大利亚约 5 万年前、美洲约 1.1 万年前出现大型动物灭绝，与人类到达时间接近。", "tags": ["ch17"]}, {"id": "f051", "chapterId": "ch17", "front": "气候的角色——一句话说清它是什么？", "back": "同期气候也在剧烈变化。", "tags": ["ch17"]}, {"id": "f052", "chapterId": "ch18", "front": "第 18 章一句话核心是什么？", "back": "专业化把科学越分越细（离心），但共享的方法、工具、评价标准与跨领域问题把它拉住（向心）；两者同时存在，所以没有碎裂。", "tags": ["ch18"]}, {"id": "f053", "chapterId": "ch18", "front": "离心力——一句话说清它是什么？", "back": "期刊、会议、术语、经费渠道都在细分。", "tags": ["ch18"]}, {"id": "f054", "chapterId": "ch18", "front": "向心力——一句话说清它是什么？", "back": "统计方法、可重复性规范、计算工具、跨学科问题（气候、脑、AI）把不同领域拉回同一张桌子。", "tags": ["ch18"]}], "companion": "whats-next学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：我们将撤往北缘地区？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明气候争论为何从“是否发生”转向“会发生什么”\n<\/li><li>\n能指出“迁移适应”这一主张的前提\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>气候争论的重心已经从“是否变暖”转到“如何适应”；作者认为大规模人口向北迁移是可预见的一种适应方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：争论重心的转移（难度：基础）<\/h3>\n<p>当科学共识基本确立后，公共讨论的问题变成“影响多大、何时发生、怎么应对”。这不是争论结束，而是争论换了一个层面。<\/p>\n<h3>概念 2：迁移作为适应（难度：进阶）<\/h3>\n<p>农业带、水资源、宜居温度都会随纬度变化。作者设想人口与产业向北移动。前提是：迁移成本可承受、接收地基础设施跟得上、政治边界允许流动。三条任一不成立，方案就落空。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;争论重心的转移&quot;]\n  n2[&quot;迁移作为适应&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像下棋时先保帅再谋子：先承认局面已定，再谈怎么走。边界：气候不是棋局，反馈与阈值会让“逐步适应”突然失效。\n<\/li><li>\n<strong>实例<\/strong>：同一作物品种在不同纬度产量差异明显；温度带北移会改变适宜种植区。这是“农业带迁移”说法的物理基础。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“适应”等于“不用减排”——适应有成本上限，超过阈值就无从适应。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n气候争论重心的转移指的是？\n<ul>\n<li>\nA. 从不相信到相信\n<\/li><li>\nB. 从“是否发生”到“影响与应对”\n<\/li><li>\nC. 从科学到政治\n<\/li><li>\nD. 从全球到局部\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：共识形成后，问题转向影响评估与适应。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n争论换层面，不是结束\n<\/li><li>\n迁移适应依赖三前提\n<\/li><li>\n适应有成本上限\n<\/ul>", "kind": "chapter", "title": "第 1 章 我们将撤往北缘地区？"}, "ch02": {"html": "<h1>第 2 章：镜像神经元：我们天生就合乎道德吗？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明镜像神经元的基本现象\n<\/li><li>\n能指出“看到即理解他人”这一推论的问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>观察他人动作时，观察者大脑中执行同一动作的神经元也会活动；但这只说明共享表征，不足以直接推出“天生有道德”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：现象（难度：基础）<\/h3>\n<p>猴子看到别人抓取物体时，自己运动前区的<strong>镜像神经元<\/strong>（mirror neuron）也会放电。后来在人类身上用成像手段观察到类似的重叠激活。<\/p>\n<h3>概念 2：从表征到道德的距离（难度：高难）<\/h3>\n<p>共享动作表征可以解释模仿、共情的一部分，但道德判断还涉及规则、意图、后果权衡。把镜像神经元直接说成“道德本能”，是把一层机制当成全部解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;现象&quot;]\n  n2[&quot;从表征到道德的距离&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像看别人打球时自己的手臂会微微绷紧：身体在模拟，但不等于你也上场。边界：模拟能帮助理解，不能替代判断。\n<\/li><li>\n<strong>实例<\/strong>：看到别人打哈欠会跟着打，是镜像式激活的日常证据；但“该不该在会议上打哈欠”是另一套规则系统。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为镜像神经元已被证实是共情与道德的核心——它的功能仍有争议，且过度解读常见。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n镜像神经元最稳妥的解释是？\n<ul>\n<li>\nA. 道德器官\n<\/li><li>\nB. 观察动作时共享运动表征\n<\/li><li>\nC. 语言中枢\n<\/li><li>\nD. 记忆存储\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它解释动作理解的共享机制，不直接解释道德。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n观察动作激活运动表征\n<\/li><li>\n共享表征 ≠ 道德判断\n<\/li><li>\n过度解读是常见陷阱\n<\/ul>", "kind": "chapter", "title": "第 2 章 镜像神经元：我们天生就合乎道德吗？"}, "ch03": {"html": "<h1>第 3 章：如何增强人自身<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“进化失配”是什么意思\n<\/li><li>\n能指出增强技术的风险评估该看什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>人体是进化在旧环境下拼出的产物，许多“缺陷”是环境变化后的失配；增强的思路是找出这些失配点再干预。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：进化失配（难度：基础）<\/h3>\n<p>喜欢高糖高脂在食物稀缺时是优势，在超市时代变成风险；久坐、近视、睡眠不足都属此类。<strong>失配<\/strong>（mismatch）指旧适应与新环境不匹配。<\/p>\n<h3>概念 2：干预的参数（难度：进阶）<\/h3>\n<p>作者主张先识别可调参数（营养、运动、光暴露、认知训练），再评估副作用与个体差异。不是“越强越好”，而是“在哪个参数上、对谁、代价多大”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;进化失配&quot;]\n  n2[&quot;干预的参数&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给老款车换零件：能改，但要先知道原设计为什么那样。边界：车不会自我修复，人会。\n<\/li><li>\n<strong>实例<\/strong>：近视率在东亚城市快速上升，而户外光照时间是可干预参数。这个例子说明“环境失配 + 可调参数”的分析路径。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为增强就是加东西——很多增强是恢复被环境破坏的原有功能。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“进化失配”指的是？\n<ul>\n<li>\nA. 进化停止\n<\/li><li>\nB. 旧适应与新环境不匹配\n<\/li><li>\nC. 基因突变\n<\/li><li>\nD. 物种灭绝\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：失配是环境变化快于适应速度的结果。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n失配 = 旧适应 + 新环境\n<\/li><li>\n先找可调参数\n<\/li><li>\n增强不是越大越好\n<\/ul>", "kind": "chapter", "title": "第 3 章 如何增强人自身"}, "ch04": {"html": "<h1>第 4 章：我们在非自然宇宙中的位置<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明物理学中“自然性”判断是什么意思\n<\/li><li>\n能指出精细调节问题的两种解释方向\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>物理学家用“自然性”判断理论是否可疑：参数需要极端精细的抵消才成立，就被视为不自然；暗能量的微小值正是这种不自然的典型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：自然性标准（难度：进阶）<\/h3>\n<p>如果两个大数几乎完全抵消、只留下一个极小的余量，物理学家会怀疑背后有对称性保护。没有保护机制的精细抵消被称为<strong>不自然<\/strong>（unnatural）。<\/p>\n<h3>概念 2：两种解释（难度：高难）<\/h3>\n<p>一是新物理（超对称、额外维度）提供保护；二是<strong>人择<\/strong>（anthropic）：不同的宇宙参数不同，我们只能在允许生命存在的那个里观测。两者都缺少直接证据，这正是“下一步”的争议所在。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;自然性标准&quot;]\n  n2[&quot;两种解释&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把两个几乎相等的巨数相减得到 0.0001：可能是巧合，也可能是有人刻意调过。边界：宇宙只有一个样本，无法做重复实验。\n<\/li><li>\n<strong>实例<\/strong>：真空能的理论估算与观测值相差约 120 个数量级。这个巨大偏差是“自然性”讨论最著名的案例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“不自然”就是“错”——它是启发式的怀疑，不是判决。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“不自然”在物理中指的是？\n<ul>\n<li>\nA. 违反实验\n<\/li><li>\nB. 需要极端精细抵消才成立\n<\/li><li>\nC. 数学太复杂\n<\/li><li>\nD. 无法观测\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：精细抵消缺少对称性保护，被视为可疑。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n自然性 = 精细抵消需有保护\n<\/li><li>\n真空能差 120 个量级\n<\/li><li>\n人择 vs 新物理，均缺证据\n<\/ul>", "kind": "chapter", "title": "第 4 章 我们在非自然宇宙中的位置"}, "ch05": {"html": "<h1>第 5 章：暗能量到底是什么？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明暗能量的观测证据\n<\/li><li>\n能指出“它是什么”为何仍未定\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>暗能量是让宇宙加速膨胀的成分，占宇宙能量的大部分；它的性质（是否恒定、是否随时间变）仍未有定论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：证据（难度：基础）<\/h3>\n<p>三类独立观测：遥远超新星的亮度-红移关系、宇宙微波背景的角功率谱、星系团的形成速率。三者共同指向“加速膨胀 + 冷暗物质 + 少量普通物质”的模型。<\/p>\n<h3>概念 2：未定之处（难度：高难）<\/h3>\n<p>如果它是<strong>宇宙常数<\/strong>，密度应恒定；若它是某种场（quintessence），密度随时间变。两种可能给出的未来演化不同，而现有数据精度不足以分辨。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;证据&quot;]\n  n2[&quot;未定之处&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像发现屋子里有一笔看不见的开支：账对得上，但不知道花在哪。边界：账本能查，宇宙只有一个样本。\n<\/li><li>\n<strong>实例<\/strong>：超新星作为“标准烛光”：亮度已知，越远越暗，由亮度推距离，再由距离-红移关系判断膨胀是加速还是减速。1998 年的结果偏向了加速。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为暗能量是“一种新物质”——它更接近真空的能量属性，不是可收集的粒子。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n暗能量的主要观测证据不包括？\n<ul>\n<li>\nA. 超新星\n<\/li><li>\nB. 微波背景\n<\/li><li>\nC. 星系团形成\n<\/li><li>\nD. 实验室称重\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：它通过宇宙学尺度效应间接推断。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n暗能量 = 加速膨胀的成分\n<\/li><li>\n三类独立证据\n<\/li><li>\n常数 vs 场，未定\n<\/ul>", "kind": "chapter", "title": "第 5 章 暗能量到底是什么？"}, "ch06": {"html": "<h1>第 6 章：青少年中社会脑的发展<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明青少年大脑发育的两条主要变化\n<\/li><li>\n能解释青少年冒险行为的一个神经解释\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>青少年期前额叶皮质仍在重组，而社会情绪系统先成熟；两套系统发育不同步，造成“油门先到、刹车后到”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条变化（难度：基础）<\/h3>\n<p>①灰质体积先增后减（突触修剪）；②白质持续增加（连接效率提高）。前额叶的控制网络成熟较晚，约到二十多岁。<\/p>\n<h3>概念 2：不同步（难度：进阶）<\/h3>\n<p>负责奖赏与同伴评价的系统在青春期已很活跃，负责抑制与长期规划的系统还在建设。结果是对同伴在场的奖赏特别敏感，对风险的成本估计偏低。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两条变化&quot;]\n  n2[&quot;不同步&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一辆油门灵敏、刹车还在调校的车：不是驾驶员不懂规则，是硬件还没配平。边界：青少年不是被动被硬件决定，经验与训练能改变轨迹。\n<\/li><li>\n<strong>实例<\/strong>：同样的风险任务，有同伴观看时青少年冒险率显著上升，成人变化较小。这个实验把“社会脑”与“冒险”接了起来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为青少年“不懂事”——他们的风险估计在无同伴时接近成人，差别在社交情境。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n青少年冒险增加的一个解释是？\n<ul>\n<li>\nA. 前额叶过早成熟\n<\/li><li>\nB. 社会情绪系统与控制系统发育不同步\n<\/li><li>\nC. 灰质消失\n<\/li><li>\nD. 白质减少\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：油门先到、刹车后到。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n灰质修剪 + 白质增加\n<\/li><li>\n两系统不同步\n<\/li><li>\n同伴在场放大冒险\n<\/ul>", "kind": "chapter", "title": "第 6 章 青少年中社会脑的发展"}, "ch07": {"html": "<h1>第 7 章：观察大脑的互动<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明脑成像解码的基本逻辑\n<\/li><li>\n能指出“解码”与“读心”的距离\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>脑成像解码靠模式分类：从体素活动模式推断受试者看的是哪类刺激，但它读的是统计模式，不是思想内容。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：模式解码（难度：进阶）<\/h3>\n<p>把每次试验的体素响应当成一个高维向量，训练分类器区分类别。分类准确率高于随机，就说明该类信息在脑活动中可被区分。<\/p>\n<h3>概念 2：边界（难度：高难）<\/h3>\n<p>解码依赖训练数据的类别与受试者配合；它不能读出未预设的任意思想，也无法可靠用于个体测谎。把解码说成“读心术”，是把分类准确率当成了语义理解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;模式解码&quot;]\n  n2[&quot;边界&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像根据用电模式猜你家开了哪台电器：能猜，但猜不出你在用什么心情用它。边界：电器有限，思想无限。\n<\/li><li>\n<strong>实例<\/strong>：看不同物体图片时，视觉皮层的体素模式可被分类到对应类别；换成“想象一个从未见过的物体”，准确率就下降。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为解码成功就等于读到了思想——它读到的是与刺激相关的活动模式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n脑成像解码的核心方法是？\n<ul>\n<li>\nA. 单个体素阈值\n<\/li><li>\nB. 多体素模式分类\n<\/li><li>\nC. 脑电频率\n<\/li><li>\nD. 问卷\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它靠模式而不是单点。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n解码 = 模式分类\n<\/li><li>\n依赖预设类别\n<\/li><li>\n读心是误称\n<\/ul>", "kind": "chapter", "title": "第 7 章 观察大脑的互动"}, "ch08": {"html": "<h1>第 8 章：是什么使得大观念如此牢固？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明心身二元论为何长期不衰\n<\/li><li>\n能指出“观念像病毒”这一类比的限度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>心身二元论之所以牢固，不是因为证据强，而是因为它符合直觉、容易传播、能安抚对死亡的恐惧；观念的生命力与真假是两条线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么难清除（难度：基础）<\/h3>\n<p>直觉上“我的身体”与“我”是两样东西；语言结构（“我的大脑”）也在强化这种分离。<strong>二元论<\/strong>（dualism）因此有认知上的天然入口。<\/p>\n<h3>概念 2：观念的传播（难度：进阶）<\/h3>\n<p>作者用<strong>模因<\/strong>（meme）类比：观念靠可记忆、可转述、可情绪共鸣来复制。真假只是其中一个变量，甚至不是最重要的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;为什么难清除&quot;]\n  n2[&quot;观念的传播&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一首洗脑神曲：好听好记就会传播，与音乐价值不完全相关。边界：观念会被证据淘汰，神曲不太会被“证据”淘汰。\n<\/li><li>\n<strong>实例<\/strong>：“人脑只用了 10%”这个说法反复被辟谣却仍在流传，因为它简短、惊奇、易转述——传播优势与真实性无关。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为一个观念流传久就说明它真——传播机制与证据机制是两套。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n心身二元论持久的主要原因是？\n<ul>\n<li>\nA. 实验支持\n<\/li><li>\nB. 符合直觉且易传播\n<\/li><li>\nC. 数学证明\n<\/li><li>\nD. 宗教唯一\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：认知直觉与传播优势，而非证据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二元论有直觉入口\n<\/li><li>\n观念靠模因复制\n<\/li><li>\n流传 ≠ 为真\n<\/ul>", "kind": "chapter", "title": "第 8 章 是什么使得大观念如此牢固？"}, "ch09": {"html": "<h1>第 9 章：道德心灵的生理学基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述电车难题的两种版本及其差别\n<\/li><li>\n能说明情绪在道德判断中的角色\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>道岔版与天桥版的差别不在结果（都是死一救五），而在是否亲手把人推下去；情绪参与程度不同，判断就不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两个版本（难度：基础）<\/h3>\n<p>道岔版：扳开关，一人死五人活，多数人说可以。天桥版：把身边的大个子推下去，一人死五人活，多数人说不行。<strong>功利计算<\/strong>在两版相同，直觉判断却相反。<\/p>\n<h3>概念 2：情绪的权重（难度：进阶）<\/h3>\n<p>成像研究显示，亲手推人涉及更强的情绪与身体反应区域；脑损伤影响情绪加工的个案，会做出更“冷”的判断。这说明道德判断不是纯推理。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两个版本&quot;]\n  n2[&quot;情绪的权重&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像算账时手在发抖：账算得一样，手抖不抖改变决定。边界：手抖是情绪，道德还有社会规则层。\n<\/li><li>\n<strong>实例<\/strong>：同一批受试者先做道岔版再做天桥版，天桥版的“不允许”比例显著更高，反应时间也更长。差别来自“亲手”这一变量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为情绪参与就说明道德是主观的——情绪是机制的一部分，规则仍可被公共讨论。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两版电车难题的关键差别是？\n<ul>\n<li>\nA. 死亡人数\n<\/li><li>\nB. 是否亲手造成死亡\n<\/li><li>\nC. 时间长短\n<\/li><li>\nD. 地点\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：亲历性与情绪参与不同。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n结果相同，判断相反\n<\/li><li>\n亲手 = 更强情绪\n<\/li><li>\n道德非纯推理\n<\/ul>", "kind": "chapter", "title": "第 9 章 道德心灵的生理学基础"}, "ch10": {"html": "<h1>第 10 章：语言是如何影响我们思考的？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“语言相对论”的强版本与弱版本\n<\/li><li>\n能举一个语言影响认知的实验证据\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>语言不决定你能想什么（强版本不成立），但会影响你默认注意什么、怎么分类（弱版本有证据）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：强弱两版（难度：基础）<\/h3>\n<p>强版本（语言决定思维）缺少证据：没有语言的人也能完成复杂推理。弱版本（语言影响注意与分类）有实验支持：颜色词、空间方位词、语法时态都会改变任务表现。<\/p>\n<h3>概念 2：证据样例（难度：进阶）<\/h3>\n<p>有的语言用绝对方位（东南西北）而非相对方位（左右），使用者在地点记忆任务中表现不同。差异出现在需要编码方位的任务上，不出现在所有任务上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;强弱两版&quot;]\n  n2[&quot;证据样例&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像工具箱里多一把改锥：不会让你变聪明，但会让某些活更好干。边界：工具影响手法，不决定能力上限。\n<\/li><li>\n<strong>实例<\/strong>：俄语有独立词区分深浅蓝，俄语使用者在快速区分蓝色色阶的任务中更快。这是弱版本最常被引用的证据之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为说不同语言的人世界观完全不同——差异集中在特定任务，不是全面决定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n目前证据支持的版本是？\n<ul>\n<li>\nA. 语言决定思维\n<\/li><li>\nB. 语言影响注意与分类\n<\/li><li>\nC. 语言无关思维\n<\/li><li>\nD. 只有汉语影响思维\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：强版本缺证据，弱版本有实验支持。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n强版不成立，弱版有证据\n<\/li><li>\n差异集中在特定任务\n<\/li><li>\n语言是工具，不是牢笼\n<\/ul>", "kind": "chapter", "title": "第 10 章 语言是如何影响我们思考的？"}, "ch11": {"html": "<h1>第 11 章：记忆增强，记忆擦除：我们过去的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分“增强记忆”与“擦除记忆”的技术路径\n<\/li><li>\n能指出记忆干预的伦理问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>记忆可以被药物与干预调节：增强巩固、削弱再巩固；技术上可行的一部分已经在动物与早期临床中出现，伦理争议比技术更快到来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条路径（难度：基础）<\/h3>\n<p><strong>增强<\/strong>：促进突触巩固（如某些促智药、睡眠干预）。<strong>削弱<\/strong>：在记忆被唤起后的“再巩固窗口”内用药或干预，使情绪记忆淡化。<\/p>\n<h3>概念 2：伦理（难度：进阶）<\/h3>\n<p>记忆是人格的一部分：擦除创伤可能救人，也可能抹掉证人证词、改变自我叙述。作者主张区分“治疗性淡化”与“选择性删除”，后者需要更强的公共约束。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两条路径&quot;]\n  n2[&quot;伦理&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像编辑一段录像：可以调亮、可以剪掉，但剪掉的那段也是你的历史。边界：录像有备份，记忆没有。\n<\/li><li>\n<strong>实例<\/strong>：PTSD 的干预研究在唤起记忆后给予特定药物，复发率下降；同一机制若用于证人，就会破坏证据链。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为记忆像文件可以随意删除——每次唤起都会重写，删除也伴随重构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“再巩固窗口”指的是？\n<ul>\n<li>\nA. 记忆形成前\n<\/li><li>\nB. 记忆被唤起后可被修改的时段\n<\/li><li>\nC. 睡眠期\n<\/li><li>\nD. 婴儿期\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：唤起后记忆暂时不稳定，可被干预。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n增强巩固 vs 削弱再巩固\n<\/li><li>\n记忆即人格\n<\/li><li>\n治疗与证据的边界\n<\/ul>", "kind": "chapter", "title": "第 11 章 记忆增强，记忆擦除：我们过去的未来"}, "ch12": {"html": "<h1>第 12 章：想象的极端重要性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch11\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明儿童如何区分“虚构”与“真实”\n<\/li><li>\n能解释假装游戏对认知的作用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>儿童很早就能区分虚构与真实，同时能在虚构世界里做真实推理；假装游戏是练习“心理模型切换”的场所。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条区分（难度：基础）<\/h3>\n<p>儿童知道蝙蝠侠是虚构的；也知道在故事内部，蝙蝠侠不能飞出现实。他们同时掌握“是否真实”与“故事内是否成立”两套标准。<\/p>\n<h3>概念 2：为什么重要（难度：进阶）<\/h3>\n<p>假装要求同时保持两个表征（现实与设定），并按规定切换。这种<strong>双重表征<\/strong>（dual representation）能力与后来的反事实推理、科学假设思维相关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两条区分&quot;]\n  n2[&quot;为什么重要&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像同时在两个频道间切换：知道哪个是新闻、哪个是剧，还能在剧里讲逻辑。边界：儿童切换得比成人慢，但方向一致。\n<\/li><li>\n<strong>实例<\/strong>：给 4 岁儿童看一个空盒子，问“里面有什么”，他说“没有”；再问“如果假装里面有糖，谁能吃到”，他能按假装设定回答。两个问题都对，说明两套标准并行。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为爱假装就是分不清现实——能假装的前提恰恰是分得清。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n儿童假装游戏体现的能力是？\n<ul>\n<li>\nA. 分不清现实\n<\/li><li>\nB. 同时保持现实与虚构两套表征\n<\/li><li>\nC. 记忆力强\n<\/li><li>\nD. 语言早熟\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：双重表征是假装与反事实推理的基础。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n虚构/真实可区分\n<\/li><li>\n故事内逻辑独立\n<\/li><li>\n假装 = 双重表征训练\n<\/ul>", "kind": "chapter", "title": "第 12 章 想象的极端重要性"}, "ch13": {"html": "<h1>第 13 章：脑时间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“停表错觉”现象\n<\/li><li>\n能解释大脑为什么需要重建时间感\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>眼动时你看不到自己的眼睛在移动，因为大脑把两帧画面“缝合”并倒填了时间；时间感是重建出来的，不是实时录制的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：停表错觉（难度：基础）<\/h3>\n<p>快速转眼看向秒针，会觉得秒针“停了一下”。这段时间被<strong>倒填<\/strong>（chronostasis）：大脑用眼动后的稳定画面填补了运动中的模糊。<\/p>\n<h3>概念 2：为什么需要重建（难度：高难）<\/h3>\n<p>感官信号有不同延迟，若按到达时间排序，世界会错位。大脑用预测与校正把事件对齐，代价是时间感可被操纵（如“奇数球”错觉）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;停表错觉&quot;]\n  n2[&quot;为什么需要重建&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像直播有延迟，导播把画面接起来让你看不出卡顿。边界：导播知道真实时间，大脑不知道。\n<\/li><li>\n<strong>实例<\/strong>：盯着镜子左右转眼，看不到眼动过程；盯着秒针转眼，秒针像停了一拍。两个现象机制相同：运动期间的视觉输入被抑制并被填充。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大脑像摄像机在记录时间——它是先预测再校正，时间感可被欺骗。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n停表错觉说明？\n<ul>\n<li>\nA. 眼睛不眨\n<\/li><li>\nB. 时间感是被重建的\n<\/li><li>\nC. 秒针坏了\n<\/li><li>\nD. 大脑不处理视觉\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：倒填机制说明时间感非实时录制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n眼动期间视觉被抑制\n<\/li><li>\n时间感靠重建\n<\/li><li>\n倒填造成停表错觉\n<\/ul>", "kind": "chapter", "title": "第 13 章 脑时间"}, "ch14": {"html": "<h1>第 14 章：超越大脑：为什么智人从树上下来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch12\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“心理理论”是什么\n<\/li><li>\n能解释合作与心智读取为何可能互相强化\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>智人的关键优势不是单个大脑更大，而是能推断他人知道什么、并据此合作；心理理论与合作形成正反馈。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：心理理论（难度：进阶）<\/h3>\n<p><strong>心理理论<\/strong>（theory of mind）：能把他人的信念与自己的信念分开。经典的错误信念任务：孩子知道盒子里是铅笔，但能说出“妈妈会以为是口香糖”，就算通过。<\/p>\n<h3>概念 2：合作的正反馈（难度：高难）<\/h3>\n<p>会读心的人更容易合作，合作带来更大收益，收益又奖励更强的读心能力。这个循环可能是智人脱离其他灵长类的原因之一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;心理理论&quot;]\n  n2[&quot;合作的正反馈&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像打牌时能猜对手手里有什么：不是作弊，是建模。边界：打牌是零和，合作常是正和。\n<\/li><li>\n<strong>实例<\/strong>：4 岁左右儿童通过错误信念任务；黑猩猩在类似任务上表现有限。差异不在记忆力，而在“他人可以持有错误信念”这一表征。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为心理理论就是“聪明”——它是特定的社会推理能力，与智商测验不完全重合。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n错误信念任务测试的是？\n<ul>\n<li>\nA. 记忆力\n<\/li><li>\nB. 能否理解他人持有与自己不同的信念\n<\/li><li>\nC. 语言\n<\/li><li>\nD. 算术\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它要求把他人信念与事实分开。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n心理理论 = 分离他人信念\n<\/li><li>\n合作与读心正反馈\n<\/li><li>\n4 岁是通过节点\n<\/ul>", "kind": "chapter", "title": "第 14 章 超越大脑：为什么智人从树上下来"}, "ch15": {"html": "<h1>第 15 章：我们当中的外来者<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明古菌与细菌的区别\n<\/li><li>\n能解释朊病毒为何挑战“生命”定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命树不止细菌与真核两支，还有古菌；朊病毒没有核酸却能传播，逼着我们把“生命”定义从“有 DNA”改成更功能化的判据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第三支（难度：基础）<\/h3>\n<p>古菌在膜脂、转录机器上与细菌差异显著，却常生活在极端环境。三域分类把生命分成细菌、古菌、真核，改变了“原核生物”这个旧框。<\/p>\n<h3>概念 2：朊病毒（难度：进阶）<\/h3>\n<p><strong>朊病毒<\/strong>（prion）是错误折叠的蛋白，能把正常蛋白“带坏”，形成连锁。它不含核酸却能传染，说明“复制”不必依赖 DNA/RNA 模板。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;第三支&quot;]\n  n2[&quot;朊病毒&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一张折错的纸能教会下一张也折错：没有图纸，只靠形状传递。边界：纸不会自我复制，蛋白在细胞内会被持续生产。\n<\/li><li>\n<strong>实例<\/strong>：羊瘙痒病、疯牛病都由朊病毒引起；病原体对常规灭活（核酸酶、辐射）有抵抗，因为它不是核酸。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为所有病原体都含核酸——朊病毒正是反例，也因此难以灭活。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n朊病毒的特别之处是？\n<ul>\n<li>\nA. 含 DNA\n<\/li><li>\nB. 不含核酸却能传播\n<\/li><li>\nC. 能光合作用\n<\/li><li>\nD. 比细菌大\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它以蛋白构象传递信息。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三域：细菌、古菌、真核\n<\/li><li>\n朊病毒无核酸可传染\n<\/li><li>\n生命判据需功能化\n<\/ul>", "kind": "chapter", "title": "第 15 章 我们当中的外来者"}, "ch16": {"html": "<h1>第 16 章：社群性昆虫是如何变得具有社会性的？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch15\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明真社会性的三个特征\n<\/li><li>\n能解释亲缘选择如何解释不育工蚁\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>真社会性靠三件事：繁殖分工、世代重叠、共同育幼；工蚁不育可以用亲缘选择解释——帮亲属繁殖，基因照样传下去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个特征（难度：基础）<\/h3>\n<p>①只有部分个体繁殖（女王与雄蜂）；②多世代同巢；③共同照料后代。三者齐全才是<strong>真社会性<\/strong>（eusociality）。<\/p>\n<h3>概念 2：亲缘选择（难度：高难）<\/h3>\n<p>汉密尔顿规则：利他行为在“受益者携带相同基因的概率 × 收益 &gt; 付出”时能被选择。膜翅目的性别决定机制使姐妹间亲缘度高，这被用来解释工职不育。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三个特征&quot;]\n  n2[&quot;亲缘选择&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像家族企业：有人负责经营，有人只出资，收益按股份分。边界：昆虫没有股份合同，靠亲缘系数。\n<\/li><li>\n<strong>实例<\/strong>：蜜蜂工蜂不育，但通过照顾姐妹（与自己共享约 3/4 基因）传递基因。若亲缘系数降到 1/4，这套解释就弱得多。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为亲缘选择能解释一切社会行为——它解释不育与互助，不解释复杂分工的全部细节。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n真社会性不包括下列哪项？\n<ul>\n<li>\nA. 繁殖分工\n<\/li><li>\nB. 世代重叠\n<\/li><li>\nC. 共同育幼\n<\/li><li>\nD. 个体独立迁徙\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：真社会性要求群体长期共存与育幼。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真社会性三特征\n<\/li><li>\n汉密尔顿规则\n<\/li><li>\n亲缘系数解释不育\n<\/ul>", "kind": "chapter", "title": "第 16 章 社群性昆虫是如何变得具有社会性的？"}, "ch17": {"html": "<h1>第 17 章：人类的灭绝和进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch16\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明巨型动物灭绝与人类扩散的关系\n<\/li><li>\n能区分“气候驱动”与“人类驱动”两种解释\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>更新世末期的大型动物灭绝与人类到达的时间高度重合；气候也在变化，因此多数案例是“双重驱动”，而非单一原因。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：时间重合（难度：基础）<\/h3>\n<p>澳大利亚约 5 万年前、美洲约 1.1 万年前出现大型动物灭绝，与人类到达时间接近。这种重合是“人类驱动”说的主要证据。<\/p>\n<h3>概念 2：气候的角色（难度：进阶）<\/h3>\n<p>同期气候也在剧烈变化。仅靠重合不能定因果，需要看：灭绝是否只发生在大动物、是否随人类到达顺序推进、是否有直接猎杀证据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;时间重合&quot;]\n  n2[&quot;气候的角色&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像房子着火同时停了电：两件事同时发生，不能只怪其中一个。边界：火灾有起火点可查，灭绝的证据链更稀疏。\n<\/li><li>\n<strong>实例<\/strong>：新西兰恐鸟在人类到达后数百年内灭绝，且有猎杀遗址证据；北美则争议更大，因为气候同期也剧变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“人类一到就灭绝”已被证实——时间重合只是相关性，因果需要更多证据。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断人类导致灭绝的关键证据不包括？\n<ul>\n<li>\nA. 猎杀遗址\n<\/li><li>\nB. 灭绝随人类到达推进\n<\/li><li>\nC. 只针对大型动物\n<\/li><li>\nD. 灭绝动物数量多\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：数量多本身不构成因果证据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n时间重合是相关性\n<\/li><li>\n气候与人类可能双驱动\n<\/li><li>\n要看猎杀与推进顺序\n<\/ul>", "kind": "chapter", "title": "第 17 章 人类的灭绝和进化"}, "ch18": {"html": "<h1>第 18 章：为什么专业化没有导致科学四分五裂？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“离心力”与“向心力”各指什么\n<\/li><li>\n能指出科学整合的机制\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>专业化把科学越分越细（离心），但共享的方法、工具、评价标准与跨领域问题把它拉住（向心）；两者同时存在，所以没有碎裂。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：离心力（难度：基础）<\/h3>\n<p>期刊、会议、术语、经费渠道都在细分；每个子领域有自己的行话与门槛。这是专业化的自然结果。<\/p>\n<h3>概念 2：向心力（难度：进阶）<\/h3>\n<p>统计方法、可重复性规范、计算工具、跨学科问题（气候、脑、AI）把不同领域拉回同一张桌子。作者认为真正的裂痕来自体制（评价、经费），不是知识本身。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;离心力&quot;]\n  n2[&quot;向心力&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一座城市不断分出新街区，但共用同一套水电与交通规则。边界：城市可以断水，科学的方法共识更韧。\n<\/li><li>\n<strong>实例<\/strong>：同一套因果推断方法被流行病学、经济学、机器学习共用；同一批成像工具被神经科学与临床医学共用。工具是向心力的具体形态。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为专业化必然导致隔行如隔山——隔阂在术语层，方法层仍在流通。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n作者认为科学未碎裂的主要原因是？\n<ul>\n<li>\nA. 大家都聪明\n<\/li><li>\nB. 共享方法与工具形成向心力\n<\/li><li>\nC. 经费充足\n<\/li><li>\nD. 期刊少\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：方法共识把分化领域拉住。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n离心：专业化细分\n<\/li><li>\n向心：方法、工具、跨域问题\n<\/li><li>\n裂痕多在体制层\n<\/ul>", "kind": "chapter", "title": "第 18 章 为什么专业化没有导致科学四分五裂？"}, "c01": {"html": "<h1>表征与解释的分层<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 02 章、第 07 章、第 09 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一现象可以在神经、认知、社会三个层次描述；低层机制不自动给出高层解释。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是读懂这十八篇的方法论：镜像神经元、脑解码、道德判断都在同一陷阱上打转——把一层机制当成全部解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>神经层：哪些区域激活、什么模式可分。<\/p>\n<p>认知层：什么表征、什么任务、什么错误。<\/p>\n<p>社会层：规则、规范、制度如何约束行为。<\/p>\n<p>跨层推论需要额外论证；缺了这一步，就会得到“镜像神经元=道德”“解码=读心”这类跳跃。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为找到脑区就等于解释了行为——区域定位只是第一层。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>镜像神经元<\/td><td>过度解读<\/td><\/tr><tr><td>ch07<\/td><td>解码<\/td><td>模式≠语义<\/td><\/tr><tr><td>ch09<\/td><td>道德<\/td><td>情绪≠全部<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n可检验性、自然性\n<\/ul>", "kind": "concept", "title": "表征与解释的分层"}, "c02": {"html": "<h1>自然性与精细调节<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 04 章、第 05 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>理论参数需要极端精细抵消才成立，称为不自然；暗能量的微小值是最著名的案例。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了当代物理为何对“看起来能算但算出来差 120 个量级”如此不安，也引出人择与新物理两条路线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>自然性不是实验判决，是启发式怀疑。<\/p>\n<p>两条出路：对称性保护（超对称等）或人择选择（多宇宙）。<\/p>\n<p>两者都缺直接证据，所以是“下一步”的核心争议。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“不自然”就是“错”——它是“背后可能有结构”的信号。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>自然性<\/td><td>标准<\/td><\/tr><tr><td>ch05<\/td><td>暗能量<\/td><td>案例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n表征分层、暗能量\n<\/ul>", "kind": "concept", "title": "自然性与精细调节"}, "c03": {"html": "<h1>发育不同步<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 06 章、第 12 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>不同脑系统成熟时间不同，行为是各系统成熟度之差的结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>它同时解释了青少年冒险、儿童双重表征、心理理论的发展节点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>青少年：情绪/奖赏系统先成熟，控制网络后成熟。<\/p>\n<p>儿童：表征能力先于抑制能力，所以能假装但不能长时间按规则抑制。<\/p>\n<p>发展节点（4 岁通过错误信念）不是突然开窍，是多系统到位的产物。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为发育不同步等于“缺陷”——它是阶段性配置，不是病。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>青少年<\/td><td>油门与刹车<\/td><\/tr><tr><td>ch12<\/td><td>假装<\/td><td>双重表征<\/td><\/tr><tr><td>ch14<\/td><td>心理理论<\/td><td>4 岁节点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n表征分层、社会脑\n<\/ul>", "kind": "concept", "title": "发育不同步"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：我们将撤往北缘地区？<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 我们将撤往北缘地区？<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：镜像神经元：我们天生就合乎道德吗？<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 镜像神经元：我们天生就合乎道德吗？<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：如何增强人自身<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 如何增强人自身<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：我们在非自然宇宙中的位置<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 我们在非自然宇宙中的位置<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：暗能量到底是什么？<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 暗能量到底是什么？<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：青少年中社会脑的发展<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 青少年中社会脑的发展<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：观察大脑的互动<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 观察大脑的互动<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：是什么使得大观念如此牢固？<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 是什么使得大观念如此牢固？<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：道德心灵的生理学基础<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 道德心灵的生理学基础<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：语言是如何影响我们思考的？<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 语言是如何影响我们思考的？<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：记忆增强，记忆擦除：我们过去的未来<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 记忆增强，记忆擦除：我们过去的未来<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-12'><strong>步骤 12：想象的极端重要性<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章 想象的极端重要性<\/a><br>检查点：完成第 12 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-13'><strong>步骤 13：脑时间<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章 脑时间<\/a><br>检查点：完成第 13 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-14'><strong>步骤 14：超越大脑：为什么智人从树上下来<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章 超越大脑：为什么智人从树上下来<\/a><br>检查点：完成第 14 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-15'><strong>步骤 15：我们当中的外来者<\/strong><br>阅读：<a href=\"#/chapter/ch15\">第 15 章 我们当中的外来者<\/a><br>检查点：完成第 15 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-16'><strong>步骤 16：社群性昆虫是如何变得具有社会性的？<\/strong><br>阅读：<a href=\"#/chapter/ch16\">第 16 章 社群性昆虫是如何变得具有社会性的？<\/a><br>检查点：完成第 16 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-17'><strong>步骤 17：人类的灭绝和进化<\/strong><br>阅读：<a href=\"#/chapter/ch17\">第 17 章 人类的灭绝和进化<\/a><br>检查点：完成第 17 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-18'><strong>步骤 18：为什么专业化没有导致科学四分五裂？<\/strong><br>阅读：<a href=\"#/chapter/ch18\">第 18 章 为什么专业化没有导致科学四分五裂？<\/a><br>检查点：完成第 18 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q19.<\/b> “镜像神经元证明人天生有道德”这一说法的主要问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 样本太少<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 从共享运动表征跳到道德判断，跨层无论证<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 没有仪器<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 只在猴子身上发现<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q20.<\/b> 暗能量“不自然”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 违反相对论<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 真空能需要极端精细抵消<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 无法观测<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 密度太大<\/label><\/div><div class='quiz-actions'><b rds__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='镜像神经元'>镜像神经元 — 观察他人动作时也放电的运动神经元 <span class=glossary-ref>（第 2 章 镜像神经元：我们天生就合乎道德吗？）<\/span><\/li><li data-term='进化失配'>进化失配 — 旧适应与新环境不匹配 <span class=glossary-ref>（第 3 章 如何增强人自身）<\/span><\/li><li data-term='自然性'>自然性 — 参数无需精细抵消即成立的性质 <span class=glossary-ref>（第 4 章 我们在非自然宇宙中的位置）<\/span><\/li><li data-term='暗能量'>暗能量 — 导致宇宙加速膨胀的成分 <span class=glossary-ref>（第 5 章 暗能量到底是什么？）<\/span><\/li><li data-term='突触修剪'>突触修剪 — 青春期减少无用连接的过程 <span class=glossary-ref>（第 6 章 青少年中社会脑的发展）<\/span><\/li><li data-term='模式解码'>模式解码 — 从多体素活动模式分类刺激 <span class=glossary-ref>（第 7 章 观察大脑的互动）<\/span><\/li><li data-term='模因'>模因 — 靠模仿传播的观念单位 <span class=glossary-ref>（第 8 章 是什么使得大观念如此牢固？）<\/span><\/li><li data-term='语言相对论'>语言相对论 — 语言影响思维强弱不一的假说 <span class=glossary-ref>（第 10 章 语言是如何影响我们思考的？）<\/span><\/li><li data-term='再巩固'>再巩固 — 记忆唤起后可被修改的窗口 <span class=glossary-ref>（第 11 章 记忆增强，记忆擦除：我们过去的未来）<\/span><\/li><li data-term='双重表征'>双重表征 — 同时保持现实与虚构两套表征 <span class=glossary-ref>（第 12 章 想象的极端重要性）<\/span><\/li><li data-term='停表错觉'>停表错觉 — 眼动后时间感被倒填的现象 <span class=glossary-ref>（第 13 章 脑时间）<\/span><\/li><li data-term='心理理论'>心理理论 — 推断他人信念的能力 <span class=glossary-ref>（第 14 章 超越大脑：为什么智人从树上下来）<\/span><\/li><li data-term='朊病毒'>朊病毒 — 错误折叠、无核酸却能传播的蛋白 <span class=glossary-ref>（第 15 章 我们当中的外来者）<\/span><\/li><li data-term='真社会性'>真社会性 — 繁殖分工、世代重叠、共同育幼 <span class=glossary-ref>（第 16 章 社群性昆虫是如何变得具有社会性的？）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>下一步是什么 模式与框架库<\/h1>\n<h2>分析框架：读一篇前沿短文的三问<\/h2>\n<p>①它说的“已知”是哪一层证据（神经/行为/统计）？②它推到的“未知”跨了几层？③跨层那一步有没有独立论证？三问能挡掉大部分过度解读。<\/p>\n<h2>决策规则：相关性还是因果<\/h2>\n<p>if 只有时间重合或空间重合 then 先列替代解释（气候、采样偏差、共同原因） if 替代解释无法排除 then 结论只能写“相关”<\/p>\n<h2>反模式：用脑区解释一切<\/h2>\n<p>“某区域激活”只说明任务与该区域有关，不说明该区域单独负责该功能。定位不等于解释。<\/p>\n<h2>反模式：把传播当证明<\/h2>\n<p>一个观念流传广、听起来顺，不等于有证据。二元论与“人脑只用 10%”都是传播优势的产物。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>真社会性三特征<\/td><td>繁殖分工、世代重叠、共同育幼<\/td><\/tr><tr><td>青少年大脑<\/td><td>灰质先增后减，白质持续增；控制网络晚熟<\/td><\/tr><tr><td>暗能量证据<\/td><td>超新星、微波背景、星系团形成<\/td><\/tr><tr><td>自然性<\/td><td>精细抵消需有对称性保护<\/td><\/tr><tr><td>语言相对论<\/td><td>强版不成立，弱版有证据<\/td><\/tr><tr><td>停表错觉<\/td><td>眼动期间视觉抑制 + 时间倒填<\/td><\/tr><tr><td>错误信念任务<\/td><td>约 4 岁通过<\/td><\/tr><tr><td>科学向心力<\/td><td>方法、工具、跨域问题<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/08-下一步是什么", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 我们将撤往北缘地区？", "href": "#/chapter/ch01"}, {"label": "第 2 章 镜像神经元：我们天生就合乎道德吗？", "href": "#/chapter/ch02"}, {"label": "第 3 章 如何增强人自身", "href": "#/chapter/ch03"}, {"label": "第 4 章 我们在非自然宇宙中的位置", "href": "#/chapter/ch04"}, {"label": "第 5 章 暗能量到底是什么？", "href": "#/chapter/ch05"}, {"label": "第 6 章 青少年中社会脑的发展", "href": "#/chapter/ch06"}, {"label": "第 7 章 观察大脑的互动", "href": "#/chapter/ch07"}, {"label": "第 8 章 是什么使得大观念如此牢固？", "href": "#/chapter/ch08"}, {"label": "第 9 章 道德心灵的生理学基础", "href": "#/chapter/ch09"}, {"label": "第 10 章 语言是如何影响我们思考的？", "href": "#/chapter/ch10"}, {"label": "第 11 章 记忆增强，记忆擦除：我们过去的未来", "href": "#/chapter/ch11"}, {"label": "第 12 章 想象的极端重要性", "href": "#/chapter/ch12"}, {"label": "第 13 章 脑时间", "href": "#/chapter/ch13"}, {"label": "第 14 章 超越大脑：为什么智人从树上下来", "href": "#/chapter/ch14"}, {"label": "第 15 章 我们当中的外来者", "href": "#/chapter/ch15"}, {"label": "第 16 章 社群性昆虫是如何变得具有社会性的？", "href": "#/chapter/ch16"}, {"label": "第 17 章 人类的灭绝和进化", "href": "#/chapter/ch17"}, {"label": "第 18 章 为什么专业化没有导致科学四分五裂？", "href": "#/chapter/ch18"}]}, {"label": "概念", "children": [{"label": "表征与解释的分层", "href": "#/concept/c01"}, {"label": "自然性与精细调节", "href": "#/concept/c02"}, {"label": "发育不同步", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 我们将撤往北缘地区？", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 镜像神经元：我们天生就合乎道德吗？", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 如何增强人自身", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 我们在非自然宇宙中的位置", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 暗能量到底是什么？", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 青少年中社会脑的发展", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 观察大脑的互动", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 是什么使得大观念如此牢固？", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 道德心灵的生理学基础", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 语言是如何影响我们思考的？", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章 记忆增强，记忆擦除：我们过去的未来", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章 想象的极端重要性", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章 脑时间", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章 超越大脑：为什么智人从树上下来", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章 我们当中的外来者", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章 社群性昆虫是如何变得具有社会性的？", "href": "#/quiz/ch16"}, {"label": "测验：第 17 章 人类的灭绝和进化", "href": "#/quiz/ch17"}, {"label": "测验：第 18 章 为什么专业化没有导致科学四分五裂？", "href": "#/quiz/ch18"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：我们将撤往北缘地区？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明气候争论为何从“是否发生”转向“会发生什么”\n<\/li><li>\n能指出“迁移适应”这一主张的前提\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>气候争论的重心已经从“是否变暖”转到“如何适应”；作者认为大规模人口向北迁移是可预见的一种适应方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：争论重心的转移（难度：基础）<\/h3>\n<p>当科学共识基本确立后，公共讨论的问题变成“影响多大、何时发生、怎么应对”。这不是争论结束，而是争论换了一个层面。<\/p>\n<h3>概念 2：迁移作为适应（难度：进阶）<\/h3>\n<p>农业带、水资源、宜居温度都会随纬度变化。作者设想人口与产业向北移动。前提是：迁移成本可承受、接收地基础设施跟得上、政治边界允许流动。三条任一不成立，方案就落空。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;争论重心的转移&quot;]\n  n2[&quot;迁移作为适应&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像下棋时先保帅再谋子：先承认局面已定，再谈怎么走。边界：气候不是棋局，反馈与阈值会让“逐步适应”突然失效。\n<\/li><li>\n<strong>实例<\/strong>：同一作物品种在不同纬度产量差异明显；温度带北移会改变适宜种植区。这是“农业带迁移”说法的物理基础。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“适应”等于“不用减排”——适应有成本上限，超过阈值就无从适应。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n气候争论重心的转移指的是？\n<ul>\n<li>\nA. 从不相信到相信\n<\/li><li>\nB. 从“是否发生”到“影响与应对”\n<\/li><li>\nC. 从科学到政治\n<\/li><li>\nD. 从全球到局部\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：共识形成后，问题转向影响评估与适应。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n争论换层面，不是结束\n<\/li><li>\n迁移适应依赖三前提\n<\/li><li>\n适应有成本上限\n<\/ul>", "ch02": "<h1>第 2 章：镜像神经元：我们天生就合乎道德吗？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明镜像神经元的基本现象\n<\/li><li>\n能指出“看到即理解他人”这一推论的问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>观察他人动作时，观察者大脑中执行同一动作的神经元也会活动；但这只说明共享表征，不足以直接推出“天生有道德”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：现象（难度：基础）<\/h3>\n<p>猴子看到别人抓取物体时，自己运动前区的<strong>镜像神经元<\/strong>（mirror neuron）也会放电。后来在人类身上用成像手段观察到类似的重叠激活。<\/p>\n<h3>概念 2：从表征到道德的距离（难度：高难）<\/h3>\n<p>共享动作表征可以解释模仿、共情的一部分，但道德判断还涉及规则、意图、后果权衡。把镜像神经元直接说成“道德本能”，是把一层机制当成全部解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;现象&quot;]\n  n2[&quot;从表征到道德的距离&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像看别人打球时自己的手臂会微微绷紧：身体在模拟，但不等于你也上场。边界：模拟能帮助理解，不能替代判断。\n<\/li><li>\n<strong>实例<\/strong>：看到别人打哈欠会跟着打，是镜像式激活的日常证据；但“该不该在会议上打哈欠”是另一套规则系统。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为镜像神经元已被证实是共情与道德的核心——它的功能仍有争议，且过度解读常见。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n镜像神经元最稳妥的解释是？\n<ul>\n<li>\nA. 道德器官\n<\/li><li>\nB. 观察动作时共享运动表征\n<\/li><li>\nC. 语言中枢\n<\/li><li>\nD. 记忆存储\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它解释动作理解的共享机制，不直接解释道德。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n观察动作激活运动表征\n<\/li><li>\n共享表征 ≠ 道德判断\n<\/li><li>\n过度解读是常见陷阱\n<\/ul>", "ch03": "<h1>第 3 章：如何增强人自身<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“进化失配”是什么意思\n<\/li><li>\n能指出增强技术的风险评估该看什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>人体是进化在旧环境下拼出的产物，许多“缺陷”是环境变化后的失配；增强的思路是找出这些失配点再干预。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：进化失配（难度：基础）<\/h3>\n<p>喜欢高糖高脂在食物稀缺时是优势，在超市时代变成风险；久坐、近视、睡眠不足都属此类。<strong>失配<\/strong>（mismatch）指旧适应与新环境不匹配。<\/p>\n<h3>概念 2：干预的参数（难度：进阶）<\/h3>\n<p>作者主张先识别可调参数（营养、运动、光暴露、认知训练），再评估副作用与个体差异。不是“越强越好”，而是“在哪个参数上、对谁、代价多大”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;进化失配&quot;]\n  n2[&quot;干预的参数&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像给老款车换零件：能改，但要先知道原设计为什么那样。边界：车不会自我修复，人会。\n<\/li><li>\n<strong>实例<\/strong>：近视率在东亚城市快速上升，而户外光照时间是可干预参数。这个例子说明“环境失配 + 可调参数”的分析路径。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为增强就是加东西——很多增强是恢复被环境破坏的原有功能。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“进化失配”指的是？\n<ul>\n<li>\nA. 进化停止\n<\/li><li>\nB. 旧适应与新环境不匹配\n<\/li><li>\nC. 基因突变\n<\/li><li>\nD. 物种灭绝\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：失配是环境变化快于适应速度的结果。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n失配 = 旧适应 + 新环境\n<\/li><li>\n先找可调参数\n<\/li><li>\n增强不是越大越好\n<\/ul>", "ch04": "<h1>第 4 章：我们在非自然宇宙中的位置<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明物理学中“自然性”判断是什么意思\n<\/li><li>\n能指出精细调节问题的两种解释方向\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>物理学家用“自然性”判断理论是否可疑：参数需要极端精细的抵消才成立，就被视为不自然；暗能量的微小值正是这种不自然的典型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：自然性标准（难度：进阶）<\/h3>\n<p>如果两个大数几乎完全抵消、只留下一个极小的余量，物理学家会怀疑背后有对称性保护。没有保护机制的精细抵消被称为<strong>不自然<\/strong>（unnatural）。<\/p>\n<h3>概念 2：两种解释（难度：高难）<\/h3>\n<p>一是新物理（超对称、额外维度）提供保护；二是<strong>人择<\/strong>（anthropic）：不同的宇宙参数不同，我们只能在允许生命存在的那个里观测。两者都缺少直接证据，这正是“下一步”的争议所在。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;自然性标准&quot;]\n  n2[&quot;两种解释&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像把两个几乎相等的巨数相减得到 0.0001：可能是巧合，也可能是有人刻意调过。边界：宇宙只有一个样本，无法做重复实验。\n<\/li><li>\n<strong>实例<\/strong>：真空能的理论估算与观测值相差约 120 个数量级。这个巨大偏差是“自然性”讨论最著名的案例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“不自然”就是“错”——它是启发式的怀疑，不是判决。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“不自然”在物理中指的是？\n<ul>\n<li>\nA. 违反实验\n<\/li><li>\nB. 需要极端精细抵消才成立\n<\/li><li>\nC. 数学太复杂\n<\/li><li>\nD. 无法观测\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：精细抵消缺少对称性保护，被视为可疑。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n自然性 = 精细抵消需有保护\n<\/li><li>\n真空能差 120 个量级\n<\/li><li>\n人择 vs 新物理，均缺证据\n<\/ul>", "ch05": "<h1>第 5 章：暗能量到底是什么？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明暗能量的观测证据\n<\/li><li>\n能指出“它是什么”为何仍未定\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>暗能量是让宇宙加速膨胀的成分，占宇宙能量的大部分；它的性质（是否恒定、是否随时间变）仍未有定论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：证据（难度：基础）<\/h3>\n<p>三类独立观测：遥远超新星的亮度-红移关系、宇宙微波背景的角功率谱、星系团的形成速率。三者共同指向“加速膨胀 + 冷暗物质 + 少量普通物质”的模型。<\/p>\n<h3>概念 2：未定之处（难度：高难）<\/h3>\n<p>如果它是<strong>宇宙常数<\/strong>，密度应恒定；若它是某种场（quintessence），密度随时间变。两种可能给出的未来演化不同，而现有数据精度不足以分辨。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;证据&quot;]\n  n2[&quot;未定之处&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像发现屋子里有一笔看不见的开支：账对得上，但不知道花在哪。边界：账本能查，宇宙只有一个样本。\n<\/li><li>\n<strong>实例<\/strong>：超新星作为“标准烛光”：亮度已知，越远越暗，由亮度推距离，再由距离-红移关系判断膨胀是加速还是减速。1998 年的结果偏向了加速。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为暗能量是“一种新物质”——它更接近真空的能量属性，不是可收集的粒子。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n暗能量的主要观测证据不包括？\n<ul>\n<li>\nA. 超新星\n<\/li><li>\nB. 微波背景\n<\/li><li>\nC. 星系团形成\n<\/li><li>\nD. 实验室称重\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：它通过宇宙学尺度效应间接推断。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n暗能量 = 加速膨胀的成分\n<\/li><li>\n三类独立证据\n<\/li><li>\n常数 vs 场，未定\n<\/ul>", "ch06": "<h1>第 6 章：青少年中社会脑的发展<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明青少年大脑发育的两条主要变化\n<\/li><li>\n能解释青少年冒险行为的一个神经解释\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>青少年期前额叶皮质仍在重组，而社会情绪系统先成熟；两套系统发育不同步，造成“油门先到、刹车后到”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条变化（难度：基础）<\/h3>\n<p>①灰质体积先增后减（突触修剪）；②白质持续增加（连接效率提高）。前额叶的控制网络成熟较晚，约到二十多岁。<\/p>\n<h3>概念 2：不同步（难度：进阶）<\/h3>\n<p>负责奖赏与同伴评价的系统在青春期已很活跃，负责抑制与长期规划的系统还在建设。结果是对同伴在场的奖赏特别敏感，对风险的成本估计偏低。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两条变化&quot;]\n  n2[&quot;不同步&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一辆油门灵敏、刹车还在调校的车：不是驾驶员不懂规则，是硬件还没配平。边界：青少年不是被动被硬件决定，经验与训练能改变轨迹。\n<\/li><li>\n<strong>实例<\/strong>：同样的风险任务，有同伴观看时青少年冒险率显著上升，成人变化较小。这个实验把“社会脑”与“冒险”接了起来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为青少年“不懂事”——他们的风险估计在无同伴时接近成人，差别在社交情境。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n青少年冒险增加的一个解释是？\n<ul>\n<li>\nA. 前额叶过早成熟\n<\/li><li>\nB. 社会情绪系统与控制系统发育不同步\n<\/li><li>\nC. 灰质消失\n<\/li><li>\nD. 白质减少\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：油门先到、刹车后到。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n灰质修剪 + 白质增加\n<\/li><li>\n两系统不同步\n<\/li><li>\n同伴在场放大冒险\n<\/ul>", "ch07": "<h1>第 7 章：观察大脑的互动<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明脑成像解码的基本逻辑\n<\/li><li>\n能指出“解码”与“读心”的距离\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>脑成像解码靠模式分类：从体素活动模式推断受试者看的是哪类刺激，但它读的是统计模式，不是思想内容。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：模式解码（难度：进阶）<\/h3>\n<p>把每次试验的体素响应当成一个高维向量，训练分类器区分类别。分类准确率高于随机，就说明该类信息在脑活动中可被区分。<\/p>\n<h3>概念 2：边界（难度：高难）<\/h3>\n<p>解码依赖训练数据的类别与受试者配合；它不能读出未预设的任意思想，也无法可靠用于个体测谎。把解码说成“读心术”，是把分类准确率当成了语义理解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;模式解码&quot;]\n  n2[&quot;边界&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像根据用电模式猜你家开了哪台电器：能猜，但猜不出你在用什么心情用它。边界：电器有限，思想无限。\n<\/li><li>\n<strong>实例<\/strong>：看不同物体图片时，视觉皮层的体素模式可被分类到对应类别；换成“想象一个从未见过的物体”，准确率就下降。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为解码成功就等于读到了思想——它读到的是与刺激相关的活动模式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n脑成像解码的核心方法是？\n<ul>\n<li>\nA. 单个体素阈值\n<\/li><li>\nB. 多体素模式分类\n<\/li><li>\nC. 脑电频率\n<\/li><li>\nD. 问卷\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它靠模式而不是单点。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n解码 = 模式分类\n<\/li><li>\n依赖预设类别\n<\/li><li>\n读心是误称\n<\/ul>", "ch08": "<h1>第 8 章：是什么使得大观念如此牢固？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明心身二元论为何长期不衰\n<\/li><li>\n能指出“观念像病毒”这一类比的限度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>心身二元论之所以牢固，不是因为证据强，而是因为它符合直觉、容易传播、能安抚对死亡的恐惧；观念的生命力与真假是两条线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么难清除（难度：基础）<\/h3>\n<p>直觉上“我的身体”与“我”是两样东西；语言结构（“我的大脑”）也在强化这种分离。<strong>二元论<\/strong>（dualism）因此有认知上的天然入口。<\/p>\n<h3>概念 2：观念的传播（难度：进阶）<\/h3>\n<p>作者用<strong>模因<\/strong>（meme）类比：观念靠可记忆、可转述、可情绪共鸣来复制。真假只是其中一个变量，甚至不是最重要的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;为什么难清除&quot;]\n  n2[&quot;观念的传播&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一首洗脑神曲：好听好记就会传播，与音乐价值不完全相关。边界：观念会被证据淘汰，神曲不太会被“证据”淘汰。\n<\/li><li>\n<strong>实例<\/strong>：“人脑只用了 10%”这个说法反复被辟谣却仍在流传，因为它简短、惊奇、易转述——传播优势与真实性无关。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为一个观念流传久就说明它真——传播机制与证据机制是两套。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n心身二元论持久的主要原因是？\n<ul>\n<li>\nA. 实验支持\n<\/li><li>\nB. 符合直觉且易传播\n<\/li><li>\nC. 数学证明\n<\/li><li>\nD. 宗教唯一\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：认知直觉与传播优势，而非证据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二元论有直觉入口\n<\/li><li>\n观念靠模因复制\n<\/li><li>\n流传 ≠ 为真\n<\/ul>", "ch09": "<h1>第 9 章：道德心灵的生理学基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch08\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述电车难题的两种版本及其差别\n<\/li><li>\n能说明情绪在道德判断中的角色\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>道岔版与天桥版的差别不在结果（都是死一救五），而在是否亲手把人推下去；情绪参与程度不同，判断就不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两个版本（难度：基础）<\/h3>\n<p>道岔版：扳开关，一人死五人活，多数人说可以。天桥版：把身边的大个子推下去，一人死五人活，多数人说不行。<strong>功利计算<\/strong>在两版相同，直觉判断却相反。<\/p>\n<h3>概念 2：情绪的权重（难度：进阶）<\/h3>\n<p>成像研究显示，亲手推人涉及更强的情绪与身体反应区域；脑损伤影响情绪加工的个案，会做出更“冷”的判断。这说明道德判断不是纯推理。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两个版本&quot;]\n  n2[&quot;情绪的权重&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像算账时手在发抖：账算得一样，手抖不抖改变决定。边界：手抖是情绪，道德还有社会规则层。\n<\/li><li>\n<strong>实例<\/strong>：同一批受试者先做道岔版再做天桥版，天桥版的“不允许”比例显著更高，反应时间也更长。差别来自“亲手”这一变量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为情绪参与就说明道德是主观的——情绪是机制的一部分，规则仍可被公共讨论。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两版电车难题的关键差别是？\n<ul>\n<li>\nA. 死亡人数\n<\/li><li>\nB. 是否亲手造成死亡\n<\/li><li>\nC. 时间长短\n<\/li><li>\nD. 地点\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：亲历性与情绪参与不同。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n结果相同，判断相反\n<\/li><li>\n亲手 = 更强情绪\n<\/li><li>\n道德非纯推理\n<\/ul>", "ch10": "<h1>第 10 章：语言是如何影响我们思考的？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“语言相对论”的强版本与弱版本\n<\/li><li>\n能举一个语言影响认知的实验证据\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>语言不决定你能想什么（强版本不成立），但会影响你默认注意什么、怎么分类（弱版本有证据）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：强弱两版（难度：基础）<\/h3>\n<p>强版本（语言决定思维）缺少证据：没有语言的人也能完成复杂推理。弱版本（语言影响注意与分类）有实验支持：颜色词、空间方位词、语法时态都会改变任务表现。<\/p>\n<h3>概念 2：证据样例（难度：进阶）<\/h3>\n<p>有的语言用绝对方位（东南西北）而非相对方位（左右），使用者在地点记忆任务中表现不同。差异出现在需要编码方位的任务上，不出现在所有任务上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;强弱两版&quot;]\n  n2[&quot;证据样例&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像工具箱里多一把改锥：不会让你变聪明，但会让某些活更好干。边界：工具影响手法，不决定能力上限。\n<\/li><li>\n<strong>实例<\/strong>：俄语有独立词区分深浅蓝，俄语使用者在快速区分蓝色色阶的任务中更快。这是弱版本最常被引用的证据之一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为说不同语言的人世界观完全不同——差异集中在特定任务，不是全面决定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n目前证据支持的版本是？\n<ul>\n<li>\nA. 语言决定思维\n<\/li><li>\nB. 语言影响注意与分类\n<\/li><li>\nC. 语言无关思维\n<\/li><li>\nD. 只有汉语影响思维\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：强版本缺证据，弱版本有实验支持。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n强版不成立，弱版有证据\n<\/li><li>\n差异集中在特定任务\n<\/li><li>\n语言是工具，不是牢笼\n<\/ul>", "ch11": "<h1>第 11 章：记忆增强，记忆擦除：我们过去的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分“增强记忆”与“擦除记忆”的技术路径\n<\/li><li>\n能指出记忆干预的伦理问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>记忆可以被药物与干预调节：增强巩固、削弱再巩固；技术上可行的一部分已经在动物与早期临床中出现，伦理争议比技术更快到来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条路径（难度：基础）<\/h3>\n<p><strong>增强<\/strong>：促进突触巩固（如某些促智药、睡眠干预）。<strong>削弱<\/strong>：在记忆被唤起后的“再巩固窗口”内用药或干预，使情绪记忆淡化。<\/p>\n<h3>概念 2：伦理（难度：进阶）<\/h3>\n<p>记忆是人格的一部分：擦除创伤可能救人，也可能抹掉证人证词、改变自我叙述。作者主张区分“治疗性淡化”与“选择性删除”，后者需要更强的公共约束。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两条路径&quot;]\n  n2[&quot;伦理&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像编辑一段录像：可以调亮、可以剪掉，但剪掉的那段也是你的历史。边界：录像有备份，记忆没有。\n<\/li><li>\n<strong>实例<\/strong>：PTSD 的干预研究在唤起记忆后给予特定药物，复发率下降；同一机制若用于证人，就会破坏证据链。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为记忆像文件可以随意删除——每次唤起都会重写，删除也伴随重构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“再巩固窗口”指的是？\n<ul>\n<li>\nA. 记忆形成前\n<\/li><li>\nB. 记忆被唤起后可被修改的时段\n<\/li><li>\nC. 睡眠期\n<\/li><li>\nD. 婴儿期\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：唤起后记忆暂时不稳定，可被干预。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n增强巩固 vs 削弱再巩固\n<\/li><li>\n记忆即人格\n<\/li><li>\n治疗与证据的边界\n<\/ul>", "ch12": "<h1>第 12 章：想象的极端重要性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch11\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明儿童如何区分“虚构”与“真实”\n<\/li><li>\n能解释假装游戏对认知的作用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>儿童很早就能区分虚构与真实，同时能在虚构世界里做真实推理；假装游戏是练习“心理模型切换”的场所。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条区分（难度：基础）<\/h3>\n<p>儿童知道蝙蝠侠是虚构的；也知道在故事内部，蝙蝠侠不能飞出现实。他们同时掌握“是否真实”与“故事内是否成立”两套标准。<\/p>\n<h3>概念 2：为什么重要（难度：进阶）<\/h3>\n<p>假装要求同时保持两个表征（现实与设定），并按规定切换。这种<strong>双重表征<\/strong>（dual representation）能力与后来的反事实推理、科学假设思维相关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;两条区分&quot;]\n  n2[&quot;为什么重要&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像同时在两个频道间切换：知道哪个是新闻、哪个是剧，还能在剧里讲逻辑。边界：儿童切换得比成人慢，但方向一致。\n<\/li><li>\n<strong>实例<\/strong>：给 4 岁儿童看一个空盒子，问“里面有什么”，他说“没有”；再问“如果假装里面有糖，谁能吃到”，他能按假装设定回答。两个问题都对，说明两套标准并行。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为爱假装就是分不清现实——能假装的前提恰恰是分得清。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n儿童假装游戏体现的能力是？\n<ul>\n<li>\nA. 分不清现实\n<\/li><li>\nB. 同时保持现实与虚构两套表征\n<\/li><li>\nC. 记忆力强\n<\/li><li>\nD. 语言早熟\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：双重表征是假装与反事实推理的基础。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n虚构/真实可区分\n<\/li><li>\n故事内逻辑独立\n<\/li><li>\n假装 = 双重表征训练\n<\/ul>", "ch13": "<h1>第 13 章：脑时间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“停表错觉”现象\n<\/li><li>\n能解释大脑为什么需要重建时间感\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>眼动时你看不到自己的眼睛在移动，因为大脑把两帧画面“缝合”并倒填了时间；时间感是重建出来的，不是实时录制的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：停表错觉（难度：基础）<\/h3>\n<p>快速转眼看向秒针，会觉得秒针“停了一下”。这段时间被<strong>倒填<\/strong>（chronostasis）：大脑用眼动后的稳定画面填补了运动中的模糊。<\/p>\n<h3>概念 2：为什么需要重建（难度：高难）<\/h3>\n<p>感官信号有不同延迟，若按到达时间排序，世界会错位。大脑用预测与校正把事件对齐，代价是时间感可被操纵（如“奇数球”错觉）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;停表错觉&quot;]\n  n2[&quot;为什么需要重建&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像直播有延迟，导播把画面接起来让你看不出卡顿。边界：导播知道真实时间，大脑不知道。\n<\/li><li>\n<strong>实例<\/strong>：盯着镜子左右转眼，看不到眼动过程；盯着秒针转眼，秒针像停了一拍。两个现象机制相同：运动期间的视觉输入被抑制并被填充。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大脑像摄像机在记录时间——它是先预测再校正，时间感可被欺骗。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n停表错觉说明？\n<ul>\n<li>\nA. 眼睛不眨\n<\/li><li>\nB. 时间感是被重建的\n<\/li><li>\nC. 秒针坏了\n<\/li><li>\nD. 大脑不处理视觉\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：倒填机制说明时间感非实时录制。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n眼动期间视觉被抑制\n<\/li><li>\n时间感靠重建\n<\/li><li>\n倒填造成停表错觉\n<\/ul>", "ch14": "<h1>第 14 章：超越大脑：为什么智人从树上下来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch12\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“心理理论”是什么\n<\/li><li>\n能解释合作与心智读取为何可能互相强化\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>智人的关键优势不是单个大脑更大，而是能推断他人知道什么、并据此合作；心理理论与合作形成正反馈。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：心理理论（难度：进阶）<\/h3>\n<p><strong>心理理论<\/strong>（theory of mind）：能把他人的信念与自己的信念分开。经典的错误信念任务：孩子知道盒子里是铅笔，但能说出“妈妈会以为是口香糖”，就算通过。<\/p>\n<h3>概念 2：合作的正反馈（难度：高难）<\/h3>\n<p>会读心的人更容易合作，合作带来更大收益，收益又奖励更强的读心能力。这个循环可能是智人脱离其他灵长类的原因之一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;心理理论&quot;]\n  n2[&quot;合作的正反馈&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像打牌时能猜对手手里有什么：不是作弊，是建模。边界：打牌是零和，合作常是正和。\n<\/li><li>\n<strong>实例<\/strong>：4 岁左右儿童通过错误信念任务；黑猩猩在类似任务上表现有限。差异不在记忆力，而在“他人可以持有错误信念”这一表征。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为心理理论就是“聪明”——它是特定的社会推理能力，与智商测验不完全重合。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n错误信念任务测试的是？\n<ul>\n<li>\nA. 记忆力\n<\/li><li>\nB. 能否理解他人持有与自己不同的信念\n<\/li><li>\nC. 语言\n<\/li><li>\nD. 算术\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它要求把他人信念与事实分开。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n心理理论 = 分离他人信念\n<\/li><li>\n合作与读心正反馈\n<\/li><li>\n4 岁是通过节点\n<\/ul>", "ch15": "<h1>第 15 章：我们当中的外来者<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明古菌与细菌的区别\n<\/li><li>\n能解释朊病毒为何挑战“生命”定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命树不止细菌与真核两支，还有古菌；朊病毒没有核酸却能传播，逼着我们把“生命”定义从“有 DNA”改成更功能化的判据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第三支（难度：基础）<\/h3>\n<p>古菌在膜脂、转录机器上与细菌差异显著，却常生活在极端环境。三域分类把生命分成细菌、古菌、真核，改变了“原核生物”这个旧框。<\/p>\n<h3>概念 2：朊病毒（难度：进阶）<\/h3>\n<p><strong>朊病毒<\/strong>（prion）是错误折叠的蛋白，能把正常蛋白“带坏”，形成连锁。它不含核酸却能传染，说明“复制”不必依赖 DNA/RNA 模板。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;第三支&quot;]\n  n2[&quot;朊病毒&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一张折错的纸能教会下一张也折错：没有图纸，只靠形状传递。边界：纸不会自我复制，蛋白在细胞内会被持续生产。\n<\/li><li>\n<strong>实例<\/strong>：羊瘙痒病、疯牛病都由朊病毒引起；病原体对常规灭活（核酸酶、辐射）有抵抗，因为它不是核酸。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为所有病原体都含核酸——朊病毒正是反例，也因此难以灭活。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n朊病毒的特别之处是？\n<ul>\n<li>\nA. 含 DNA\n<\/li><li>\nB. 不含核酸却能传播\n<\/li><li>\nC. 能光合作用\n<\/li><li>\nD. 比细菌大\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它以蛋白构象传递信息。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三域：细菌、古菌、真核\n<\/li><li>\n朊病毒无核酸可传染\n<\/li><li>\n生命判据需功能化\n<\/ul>", "ch16": "<h1>第 16 章：社群性昆虫是如何变得具有社会性的？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch15\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明真社会性的三个特征\n<\/li><li>\n能解释亲缘选择如何解释不育工蚁\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>真社会性靠三件事：繁殖分工、世代重叠、共同育幼；工蚁不育可以用亲缘选择解释——帮亲属繁殖，基因照样传下去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个特征（难度：基础）<\/h3>\n<p>①只有部分个体繁殖（女王与雄蜂）；②多世代同巢；③共同照料后代。三者齐全才是<strong>真社会性<\/strong>（eusociality）。<\/p>\n<h3>概念 2：亲缘选择（难度：高难）<\/h3>\n<p>汉密尔顿规则：利他行为在“受益者携带相同基因的概率 × 收益 &gt; 付出”时能被选择。膜翅目的性别决定机制使姐妹间亲缘度高，这被用来解释工职不育。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;三个特征&quot;]\n  n2[&quot;亲缘选择&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像家族企业：有人负责经营，有人只出资，收益按股份分。边界：昆虫没有股份合同，靠亲缘系数。\n<\/li><li>\n<strong>实例<\/strong>：蜜蜂工蜂不育，但通过照顾姐妹（与自己共享约 3/4 基因）传递基因。若亲缘系数降到 1/4，这套解释就弱得多。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为亲缘选择能解释一切社会行为——它解释不育与互助，不解释复杂分工的全部细节。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n真社会性不包括下列哪项？\n<ul>\n<li>\nA. 繁殖分工\n<\/li><li>\nB. 世代重叠\n<\/li><li>\nC. 共同育幼\n<\/li><li>\nD. 个体独立迁徙\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：真社会性要求群体长期共存与育幼。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真社会性三特征\n<\/li><li>\n汉密尔顿规则\n<\/li><li>\n亲缘系数解释不育\n<\/ul>", "ch17": "<h1>第 17 章：人类的灭绝和进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：ch16\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明巨型动物灭绝与人类扩散的关系\n<\/li><li>\n能区分“气候驱动”与“人类驱动”两种解释\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>更新世末期的大型动物灭绝与人类到达的时间高度重合；气候也在变化，因此多数案例是“双重驱动”，而非单一原因。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：时间重合（难度：基础）<\/h3>\n<p>澳大利亚约 5 万年前、美洲约 1.1 万年前出现大型动物灭绝，与人类到达时间接近。这种重合是“人类驱动”说的主要证据。<\/p>\n<h3>概念 2：气候的角色（难度：进阶）<\/h3>\n<p>同期气候也在剧烈变化。仅靠重合不能定因果，需要看：灭绝是否只发生在大动物、是否随人类到达顺序推进、是否有直接猎杀证据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;时间重合&quot;]\n  n2[&quot;气候的角色&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像房子着火同时停了电：两件事同时发生，不能只怪其中一个。边界：火灾有起火点可查，灭绝的证据链更稀疏。\n<\/li><li>\n<strong>实例<\/strong>：新西兰恐鸟在人类到达后数百年内灭绝，且有猎杀遗址证据；北美则争议更大，因为气候同期也剧变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“人类一到就灭绝”已被证实——时间重合只是相关性，因果需要更多证据。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断人类导致灭绝的关键证据不包括？\n<ul>\n<li>\nA. 猎杀遗址\n<\/li><li>\nB. 灭绝随人类到达推进\n<\/li><li>\nC. 只针对大型动物\n<\/li><li>\nD. 灭绝动物数量多\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：数量多本身不构成因果证据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n时间重合是相关性\n<\/li><li>\n气候与人类可能双驱动\n<\/li><li>\n要看猎杀与推进顺序\n<\/ul>", "ch18": "<h1>第 18 章：为什么专业化没有导致科学四分五裂？<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.5 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“离心力”与“向心力”各指什么\n<\/li><li>\n能指出科学整合的机制\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>专业化把科学越分越细（离心），但共享的方法、工具、评价标准与跨领域问题把它拉住（向心）；两者同时存在，所以没有碎裂。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：离心力（难度：基础）<\/h3>\n<p>期刊、会议、术语、经费渠道都在细分；每个子领域有自己的行话与门槛。这是专业化的自然结果。<\/p>\n<h3>概念 2：向心力（难度：进阶）<\/h3>\n<p>统计方法、可重复性规范、计算工具、跨学科问题（气候、脑、AI）把不同领域拉回同一张桌子。作者认为真正的裂痕来自体制（评价、经费），不是知识本身。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;离心力&quot;]\n  n2[&quot;向心力&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一座城市不断分出新街区，但共用同一套水电与交通规则。边界：城市可以断水，科学的方法共识更韧。\n<\/li><li>\n<strong>实例<\/strong>：同一套因果推断方法被流行病学、经济学、机器学习共用；同一批成像工具被神经科学与临床医学共用。工具是向心力的具体形态。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为专业化必然导致隔行如隔山——隔阂在术语层，方法层仍在流通。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n作者认为科学未碎裂的主要原因是？\n<ul>\n<li>\nA. 大家都聪明\n<\/li><li>\nB. 共享方法与工具形成向心力\n<\/li><li>\nC. 经费充足\n<\/li><li>\nD. 期刊少\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：方法共识把分化领域拉住。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n离心：专业化细分\n<\/li><li>\n向心：方法、工具、跨域问题\n<\/li><li>\n裂痕多在体制层\n<\/ul>", "c01": "<h1>表征与解释的分层<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 02 章、第 07 章、第 09 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一现象可以在神经、认知、社会三个层次描述；低层机制不自动给出高层解释。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是读懂这十八篇的方法论：镜像神经元、脑解码、道德判断都在同一陷阱上打转——把一层机制当成全部解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>神经层：哪些区域激活、什么模式可分。<\/p>\n<p>认知层：什么表征、什么任务、什么错误。<\/p>\n<p>社会层：规则、规范、制度如何约束行为。<\/p>\n<p>跨层推论需要额外论证；缺了这一步，就会得到“镜像神经元=道德”“解码=读心”这类跳跃。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为找到脑区就等于解释了行为——区域定位只是第一层。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>镜像神经元<\/td><td>过度解读<\/td><\/tr><tr><td>ch07<\/td><td>解码<\/td><td>模式≠语义<\/td><\/tr><tr><td>ch09<\/td><td>道德<\/td><td>情绪≠全部<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n可检验性、自然性\n<\/ul>", "c02": "<h1>自然性与精细调节<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 04 章、第 05 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>理论参数需要极端精细抵消才成立，称为不自然；暗能量的微小值是最著名的案例。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了当代物理为何对“看起来能算但算出来差 120 个量级”如此不安，也引出人择与新物理两条路线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>自然性不是实验判决，是启发式怀疑。<\/p>\n<p>两条出路：对称性保护（超对称等）或人择选择（多宇宙）。<\/p>\n<p>两者都缺直接证据，所以是“下一步”的核心争议。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“不自然”就是“错”——它是“背后可能有结构”的信号。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>自然性<\/td><td>标准<\/td><\/tr><tr><td>ch05<\/td><td>暗能量<\/td><td>案例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n表征分层、暗能量\n<\/ul>", "c03": "<h1>发育不同步<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 06 章、第 12 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>不同脑系统成熟时间不同，行为是各系统成熟度之差的结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>它同时解释了青少年冒险、儿童双重表征、心理理论的发展节点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>青少年：情绪/奖赏系统先成熟，控制网络后成熟。<\/p>\n<p>儿童：表征能力先于抑制能力，所以能假装但不能长时间按规则抑制。<\/p>\n<p>发展节点（4 岁通过错误信念）不是突然开窍，是多系统到位的产物。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为发育不同步等于“缺陷”——它是阶段性配置，不是病。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>青少年<\/td><td>油门与刹车<\/td><\/tr><tr><td>ch12<\/td><td>假装<\/td><td>双重表征<\/td><\/tr><tr><td>ch14<\/td><td>心理理论<\/td><td>4 岁节点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n表征分层、社会脑\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p
