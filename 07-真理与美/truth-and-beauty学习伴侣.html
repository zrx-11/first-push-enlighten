<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>真理与美</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;

}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}

.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}

.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}

  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>

epts/c02-美作为科学判据.md", "chapterIds": ["ch04", "ch07"]}, {"id": "c03", "title": "可检验性作为分界", "file": "concepts/c03-可检验性作为分界.md", "chapterIds": ["ch01", "ch06"]}], "glossary": [{"term": "恒星结构", "def": "用引力与压强平衡等方程描述恒星内部", "chapterId": "ch05"}, {"term": "爱丁顿数", "def": "爱丁顿断言的宇宙质子总数", "chapterId": "ch06"}, {"term": "狄拉克判据", "def": "同等符合数据时选更美的理论", "chapterId": "ch04"}, {"term": "拉马努金直觉", "def": "未经证明却大量正确的公式直觉", "chapterId": "ch04"}, {"term": "史瓦西解", "def": "球对称时空的精确解，黑洞研究基础", "chapterId": "ch07"}, {"term": "近日点进动", "def": "水星轨道每百年的额外偏移", "chapterId": "ch07"}, {"term": "独立证实", "def": "由不同实验者重复验证", "chapterId": "ch01"}, {"term": "审美启发式", "def": "用美引导理论选择的方法", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q1", "chapterId": "ch01", "type": "single", "question": "卢瑟福模型的关键证据是？", "options": ["光谱线", "α 粒子大角度散射", "x 射线衍射", "光电效应"], "answer": 1, "explain": "大角度反弹说明存在小而重的核心。"}, {"id": "ch01-q2", "chapterId": "ch01", "type": "single", "question": "钱德拉塞卡强调科学的分水岭是？", "options": ["灵感", "独立实验证实", "声望", "数学优美"], "answer": 1, "explain": "可重复的独立验证才是关键。"}, {"id": "ch02-q1", "chapterId": "ch02", "type": "single", "question": "开普勒坚持二十多年的核心信念是？", "options": ["行星沿圆轨道", "宇宙有几何与音乐的和谐", "地球是中心", "引力不存在"], "answer": 1, "explain": "和谐信念驱动他不断换模型，最终被数据纠正。"}, {"id": "ch02-q2", "chapterId": "ch02", "type": "single", "question": "钱德拉塞卡对动机的态度是？", "options": ["只有好奇才正当", "不同动机支撑不同工作形态", "动机不重要", "实用动机最高"], "answer": 1, "explain": "他不评判高下，只看动机与证据的关系。"}, {"id": "ch03-q1", "chapterId": "ch03", "type": "single", "question": "钱德拉塞卡归纳的三种创造模式是？", "options": ["早熟、晚成、平庸", "早年巅峰、一次爆发、持续上升", "理论、实验、应用", "天才、勤奋、运气"], "answer": 1, "explain": "分别对应莎士比亚、牛顿、贝多芬。"}, {"id": "ch03-q2", "chapterId": "ch03", "type": "single", "question": "他用艺术家对照科学家的目的是？", "options": ["说明艺术更高", "把创造力形态作为可比较的结构", "贬低科学", "讨论音乐"], "answer": 1, "explain": "跨领域对照能看清“创造寿命”的形状。"}, {"id": "ch04-q1", "chapterId": "ch04", "type": "single", "question": "狄拉克的选择原则是？", "options": ["数据多者胜", "同等符合数据时选更美的", "作者名气大者胜", "越复杂越好"], "answer": 1, "explain": "美是证据不足时的判据。"}, {"id": "ch04-q2", "chapterId": "ch04", "type": "single", "question": "钱德拉塞卡对“美作判据”的态度是？", "options": ["绝对可靠", "启发式，不能替代证据", "完全无用", "只适用数学"], "answer": 1, "explain": "美是向导，不是证明。"}, {"id": "ch05-q1", "chapterId": "ch05", "type": "single", "question": "恒星结构理论要解决的核心平衡是？", "options": ["引力与压强", "磁场与电流", "熵与温度", "质量与电荷"], "answer": 0, "explain": "流体静力学平衡是恒星模型的起点。"}, {"id": "ch05-q2", "chapterId": "ch05", "type": "single", "question": "钱德拉塞卡对米尔恩风格的评价是？", "options": ["完全正确", "有气魄也有风险", "毫无价值", "只是运气"], "answer": 1, "explain": "直觉能开辟方向，也可能压过数据。"}, {"id": "ch06-q1", "chapterId": "ch06", "type": "single", "question": "爱丁顿数指的是？", "options": ["光速数值", "他断言的宇宙质子总数", "电子质量", "太阳温度"], "answer": 1, "explain": "一个用基本常数拼出的巨大数字。"}, {"id": "ch06-q2", "chapterId": "ch06", "type": "single", "question": "区分爱丁顿早年与晚年的标准是？", "options": ["数学难度", "是否有可检验预言", "写作风格", "年龄"], "answer": 1, "explain": "可检验性是分界。"}, {"id": "ch07-q1", "chapterId": "ch07", "type": "single", "question": "广义相对论“美”的核心是？", "options": ["公式短", "几何化统一与少量假设解释多现象", "作者有名", "实验多"], "answer": 1, "explain": "统一与简洁是美学判断的实质。"}, {"id": "ch07-q2", "chapterId": "ch07", "type": "single", "question": "钱德拉塞卡认为美学论证的限度是？", "options": ["不能写进论文", "不能替代观测裁决", "只适用于数学", "只对年轻人有效"], "answer": 1, "explain": "美引导方向，观测决定去留。"}, {"id": "zx-q1", "chapterId": "__all__", "type": "single", "question": "把一位科学家归入“牛顿型”，最需要看的是？", "options": ["他活了多久", "核心成果是否集中在短窗口、之后是否转移", "他获过多少奖", "他的学生多少"], "answer": 1, "explain": "模式判断依据是成果密度与形态变化。"}, {"id": "zx-q2", "chapterId": "__all__", "type": "single", "question": "“美是真理的判据”最准确的理解是？", "options": ["美的理论一定真", "证据不足时用美做启发式选择", "美与科学无关", "丑的理论一定假"], "answer": 1, "explain": "美引导搜索，证据裁决。"}, {"id": "zx-q3", "chapterId": "__all__", "type": "single", "question": "爱丁顿晚年工作的主要问题是？", "options": ["数学太难", "缺乏可检验的预言", "没有合作者", "语言晦涩"], "answer": 1, "explain": "数字拼凑无法被观测裁决。"}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "第 1 章一句话核心是什么？", "back": "科学家不是靠灵感生活的人，而是把大部分时间花在测量、计算、验证上的人；一个模型的价值，取决于它能否被独立实验证实。", "tags": ["ch01"]}, {"id": "f002", "chapterId": "ch01", "front": "从散射实验到原子核模型——一句话说清它是什么？", "back": "卢瑟福让 α 粒子打金箔，发现大多数穿过去、少数大角度反弹。", "tags": ["ch01"]}, {"id": "f003", "chapterId": "ch01", "front": "科学家的日常——一句话说清它是什么？", "back": "他描述科学家的生活：长时间的重复测量、枯燥的计算、与同行争论、写论文被拒。", "tags": ["ch01"]}, {"id": "f004", "chapterId": "ch01", "front": "验证的分量——一句话说清它是什么？", "back": "模型提出后，盖革与马斯顿用一系列实验证实了散射公式的预言。", "tags": ["ch01"]}, {"id": "f005", "chapterId": "ch02", "front": "第 2 章一句话核心是什么？", "back": "科学追求的动机不止实用与好奇，还包括对秩序与和谐的信念；开普勒就是被“宇宙必须是和谐的”这一信念推着走的。", "tags": ["ch02"]}, {"id": "f006", "chapterId": "ch02", "front": "开普勒的执念——一句话说清它是什么？", "back": "开普勒相信行星轨道背后有几何与音乐的和谐，花了二十多年试各种正多面体模型，最后用第谷的观测数据逼出椭圆轨道。", "tags": ["ch02"]}, {"id": "f007", "chapterId": "ch02", "front": "动机的谱系——一句话说清它是什么？", "back": "钱德拉塞卡列出几类：实用（计时、导航）、好奇（想知道为什么）、审美（追求简洁与对称）、野心（想要名声）。", "tags": ["ch02"]}, {"id": "f008", "chapterId": "ch02", "front": "动机与诚实——一句话说清它是什么？", "back": "他提醒：动机会影响你接受什么证据。", "tags": ["ch02"]}, {"id": "f009", "chapterId": "ch03", "front": "第 3 章一句话核心是什么？", "back": "创造力在人生中的分布有三种形态：早年即巅峰后转向（莎士比亚）、一次爆发后不再有原创（牛顿）、持续上升到晚年（贝多芬）。", "tags": ["ch03"]}, {"id": "f010", "chapterId": "ch03", "front": "莎士比亚：早年巅峰——一句话说清它是什么？", "back": "莎士比亚在三十岁前后写出主要喜剧与历史剧，随后转向悲剧与传奇剧。", "tags": ["ch03"]}, {"id": "f011", "chapterId": "ch03", "front": "牛顿：一次爆发——一句话说清它是什么？", "back": "牛顿的核心工作（微积分、光学、引力）集中在二十几岁到三十出头，之后转向造币厂与神学，再没有同等量级的原创。", "tags": ["ch03"]}, {"id": "f012", "chapterId": "ch03", "front": "贝多芬：持续上升——一句话说清它是什么？", "back": "贝多芬从早期古典风格，到晚期的《第九交响曲》与弦乐四重奏，创造力持续深化到耳聋之后。", "tags": ["ch03"]}, {"id": "f013", "chapterId": "ch04", "front": "第 4 章一句话核心是什么？", "back": "科学家用“美”作为选择理论的判据：简洁、对称、少假设的理论更可能真；但美是启发式，不是证明。", "tags": ["ch04"]}, {"id": "f014", "chapterId": "ch04", "front": "狄拉克的判据——一句话说清它是什么？", "back": "狄拉克说：如果两个理论都符合数据，选更美的那个。", "tags": ["ch04"]}, {"id": "f015", "chapterId": "ch04", "front": "拉马努金的直觉——一句话说清它是什么？", "back": "拉马努金给出大量没有证明的公式，后来被逐一证实。", "tags": ["ch04"]}, {"id": "f016", "chapterId": "ch04", "front": "风险——一句话说清它是什么？", "back": "美可能来自人的认知偏好，而非世界的结构。", "tags": ["ch04"]}, {"id": "f017", "chapterId": "ch05", "front": "第 5 章一句话核心是什么？", "back": "米尔恩把恒星内部当作可计算的结构问题，也把强烈的个人信念带进理论；钱德拉塞卡借此说明科学家的性格会留在工作里。", "tags": ["ch05"]}, {"id": "f018", "chapterId": "ch05", "front": "把恒星当结构算——一句话说清它是什么？", "back": "恒星靠引力与压强平衡，内部温度与密度由方程决定。", "tags": ["ch05"]}, {"id": "f019", "chapterId": "ch05", "front": "性格与方法——一句话说清它是什么？", "back": "米尔恩有强烈的直觉式风格，喜欢从少数原理推出大胆结论。", "tags": ["ch05"]}, {"id": "f020", "chapterId": "ch06", "front": "第 6 章一句话核心是什么？", "back": "爱丁顿早年以严谨的恒星物理与广义相对论验证著称，晚年却沉迷用基本常数拼出宇宙结构；同一个人可以同时留下两种极端的遗产。", "tags": ["ch06"]}, {"id": "f021", "chapterId": "ch06", "front": "爱丁顿数——一句话说清它是什么？", "back": "爱丁顿曾断言宇宙中质子数是一个精确的巨大数字（136×2^256 量级），并试图从基本常数推出它。", "tags": ["ch06"]}, {"id": "f022", "chapterId": "ch06", "front": "早年的严谨——一句话说清它是什么？", "back": "他最早给出恒星辐射平衡的理论，并在 1919 年日食观测中验证光线弯曲，使广义相对论获得公众承认。", "tags": ["ch06"]}, {"id": "f023", "chapterId": "ch06", "front": "如何评价——一句话说清它是什么？", "back": "钱德拉塞卡不嘲笑晚年，也不为其辩护。", "tags": ["ch06"]}, {"id": "f024", "chapterId": "ch07", "front": "第 7 章一句话核心是什么？", "back": "广义相对论的美来自三条：几何化的统一、极少的假设、与观测的精确吻合；但“美”本身仍不能代替观测。", "tags": ["ch07"]}, {"id": "f025", "chapterId": "ch07", "front": "几何化的统一——一句话说清它是什么？", "back": "引力不再是力，而是时空曲率。", "tags": ["ch07"]}, {"id": "f026", "chapterId": "ch07", "front": "史瓦西解——一句话说清它是什么？", "back": "史瓦西在第一次世界大战期间给出球对称解，后来成为黑洞研究的基础。", "tags": ["ch07"]}, {"id": "f027", "chapterId": "ch07", "front": "限度——一句话说清它是什么？", "back": "钱德拉塞卡提醒：美学判断依赖历史与文化，也依赖研究者的训练。", "tags": ["ch07"]}], "companion": "truth-and-beauty学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：科学家（1946）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述科学家工作的日常形态与动机\n<\/li><li>\n能说明“模型被实验证实”在科学中的分量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>科学家不是靠灵感生活的人，而是把大部分时间花在测量、计算、验证上的人；一个模型的价值，取决于它能否被独立实验证实。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从散射实验到原子核模型（难度：基础）<\/h3>\n<p>卢瑟福让 α 粒子打金箔，发现大多数穿过去、少数大角度反弹。要解释这个分布，只能假设原子质量集中在一个很小的带电核心。钱德拉塞卡复述这段历史，是为了说明：模型的产生不是为了好看，而是为了解释一个反常的分布。<\/p>\n<h3>概念 2：科学家的日常（难度：进阶）<\/h3>\n<p>他描述科学家的生活：长时间的重复测量、枯燥的计算、与同行争论、写论文被拒。灵感只占很小一部分，剩下的是把想法钉死的功夫。这一点与公众想象差距很大。<\/p>\n<h3>概念 3：验证的分量（难度：进阶）<\/h3>\n<p>模型提出后，盖革与马斯顿用一系列实验证实了散射公式的预言。钱德拉塞卡强调：<strong>独立证实<\/strong>才是科学的分水岭，而不是提出者的声望。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从散射实验到原子核模型&quot;]\n  n2[&quot;科学家的日常&quot;]\n  n1 --&gt; n2\n  n3[&quot;验证的分量&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像侦探破案：灵感是“我怀疑是他”，定案要靠证据链。边界：侦探有嫌疑人名单，科学家连“嫌疑人”都要自己造。\n<\/li><li>\n<strong>实例<\/strong>：α 粒子散射：大多数穿过（原子内部很空），约万分之几大角度偏转（存在小而重的核）。两个比例一对比，核的大小与电荷就能估出来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为科学家的主要工作是提出理论——实际上大部分时间在验证与排除。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n卢瑟福模型的关键证据是？\n<ul>\n<li>\nA. 光谱线\n<\/li><li>\nB. α 粒子大角度散射\n<\/li><li>\nC. x 射线衍射\n<\/li><li>\nD. 光电效应\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：大角度反弹说明存在小而重的核心。\n<\/li><li>\n钱德拉塞卡强调科学的分水岭是？\n<\/li><li>\nA. 灵感\n<\/li><li>\nB. 独立实验证实\n<\/li><li>\nC. 声望\n<\/li><li>\nD. 数学优美\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可重复的独立验证才是关键。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n模型为解释反常而生\n<\/li><li>\n日常是测量与验证\n<\/li><li>\n独立证实是分水岭\n<\/ul>", "kind": "chapter", "title": "第 1 章 科学家（1946）"}, "ch02": {"html": "<h1>第 2 章：科学的追求及其动机（1985）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能列出驱动科学追求的几种动机\n<\/li><li>\n能说明开普勒的动机与今天的“职业科学家”有何不同\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>科学追求的动机不止实用与好奇，还包括对秩序与和谐的信念；开普勒就是被“宇宙必须是和谐的”这一信念推着走的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：开普勒的执念（难度：基础）<\/h3>\n<p>开普勒相信行星轨道背后有几何与音乐的和谐，花了二十多年试各种正多面体模型，最后用第谷的观测数据逼出椭圆轨道。他的动机不是“预测位置”，而是“证明宇宙有秩序”。<\/p>\n<h3>概念 2：动机的谱系（难度：进阶）<\/h3>\n<p>钱德拉塞卡列出几类：实用（计时、导航）、好奇（想知道为什么）、审美（追求简洁与对称）、野心（想要名声）。他并不评判高下，只指出不同动机支撑的工作形态不同：审美驱动的人更能忍受长期无用的探索。<\/p>\n<h3>概念 3：动机与诚实（难度：高难）<\/h3>\n<p>他提醒：动机会影响你接受什么证据。开普勒晚年沉迷和谐模型，几乎放弃数据；牛顿晚年沉迷神学与炼金。动机越强，越需要外部检验来拉住。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;开普勒的执念&quot;]\n  n2[&quot;动机的谱系&quot;]\n  n1 --&gt; n2\n  n3[&quot;动机与诚实&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像有人登山是为了风景，有人为了纪录，有人只是因为山在那里：同一座山，不同的坚持方式。边界：登山有明确终点，科学探索没有。\n<\/li><li>\n<strong>实例<\/strong>：开普勒先用正多面体嵌套解释行星间距，误差很大；改用椭圆后，与第谷数据吻合到观测精度。同一动机，两次模型，胜负由数据判。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为动机纯粹是好事——强动机也会让人拒斥不利证据。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n开普勒坚持二十多年的核心信念是？\n<ul>\n<li>\nA. 行星沿圆轨道\n<\/li><li>\nB. 宇宙有几何与音乐的和谐\n<\/li><li>\nC. 地球是中心\n<\/li><li>\nD. 引力不存在\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：和谐信念驱动他不断换模型，最终被数据纠正。\n<\/li><li>\n钱德拉塞卡对动机的态度是？\n<\/li><li>\nA. 只有好奇才正当\n<\/li><li>\nB. 不同动机支撑不同工作形态\n<\/li><li>\nC. 动机不重要\n<\/li><li>\nD. 实用动机最高\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他不评判高下，只看动机与证据的关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n动机谱系：实用、好奇、审美、野心\n<\/li><li>\n强动机需外部检验拉住\n<\/li><li>\n开普勒：和谐信念 + 数据纠正\n<\/ul>", "kind": "chapter", "title": "第 2 章 科学的追求及其动机（1985）"}, "ch03": {"html": "<h1>第 3 章：莎士比亚、牛顿和贝多芬：不同的创造模式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述三种创造模式并各举一例\n<\/li><li>\n能说明钱德拉塞卡为什么用艺术家来对照科学家\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>创造力在人生中的分布有三种形态：早年即巅峰后转向（莎士比亚）、一次爆发后不再有原创（牛顿）、持续上升到晚年（贝多芬）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：莎士比亚：早年巅峰（难度：进阶）<\/h3>\n<p>莎士比亚在三十岁前后写出主要喜剧与历史剧，随后转向悲剧与传奇剧。钱德拉塞卡注意的是：他的创造力没有消失，而是换了形态——从情节转向人物内心。格林早年对他的攻击，恰好说明他上升之快。<\/p>\n<h3>概念 2：牛顿：一次爆发（难度：进阶）<\/h3>\n<p>牛顿的核心工作（微积分、光学、引力）集中在二十几岁到三十出头，之后转向造币厂与神学，再没有同等量级的原创。这是“单峰”模式：一次高强度爆发，随后不再回到同一高度。<\/p>\n<h3>概念 3：贝多芬：持续上升（难度：进阶）<\/h3>\n<p>贝多芬从早期古典风格，到晚期的《第九交响曲》与弦乐四重奏，创造力持续深化到耳聋之后。这是“上升”模式：每一次都在前一次的基础上开新层。钱德拉塞卡用三种模式问：科学家属于哪一种？他自己的答案偏向“贝多芬式”是可能的，但需要极长的专注。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;莎士比亚：早年巅峰&quot;]\n  n2[&quot;牛顿：一次爆发&quot;]\n  n1 --&gt; n2\n  n3[&quot;贝多芬：持续上升&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图时注意三条曲线不是高低之分，而是“峰值出现的时间”与“后期形态”之分；不要把它读成成就排名。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像三种树：有的早春开花，有的只开一季，有的逐年长高、秋天还在结果。边界：人的创造力受健康、机遇、学科阶段影响，不能只归因于性格。\n<\/li><li>\n<strong>实例<\/strong>：把三人的作品按年龄排一条时间轴：莎士比亚 30 岁前后密度最高；牛顿 1665–1687 集中爆发；贝多芬 30 岁后每十年上一个台阶。三条形状一看就不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为三种模式有优劣——钱德拉塞卡明确说这是形态差异，不是价值排序。\n<\/li><li>\n别以为牛顿晚年“江郎才尽”——他的注意力转移到了别的领域，这在三种模式里属于正常形态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n钱德拉塞卡归纳的三种创造模式是？\n<ul>\n<li>\nA. 早熟、晚成、平庸\n<\/li><li>\nB. 早年巅峰、一次爆发、持续上升\n<\/li><li>\nC. 理论、实验、应用\n<\/li><li>\nD. 天才、勤奋、运气\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：分别对应莎士比亚、牛顿、贝多芬。\n<\/li><li>\n他用艺术家对照科学家的目的是？\n<\/li><li>\nA. 说明艺术更高\n<\/li><li>\nB. 把创造力形态作为可比较的结构\n<\/li><li>\nC. 贬低科学\n<\/li><li>\nD. 讨论音乐\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：跨领域对照能看清“创造寿命”的形状。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三模式：早峰 / 单峰 / 上升\n<\/li><li>\n形态差异不是价值排序\n<\/li><li>\n创造寿命受多因素影响\n<\/ul>", "kind": "chapter", "title": "第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式"}, "ch04": {"html": "<h1>第 4 章：美与科学对美的探求（1979）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明狄拉克“美是真理判据”的主张\n<\/li><li>\n能指出这种判据的风险\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>科学家用“美”作为选择理论的判据：简洁、对称、少假设的理论更可能真；但美是启发式，不是证明。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：狄拉克的判据（难度：进阶）<\/h3>\n<p>狄拉克说：如果两个理论都符合数据，选更美的那个。他的理由是历史上的成功案例——相对论、量子力学的形式都极简洁。钱德拉塞卡补充：这种美不是装饰，而是“用最少的结构解释最多的现象”。<\/p>\n<h3>概念 2：拉马努金的直觉（难度：高难）<\/h3>\n<p>拉马努金给出大量没有证明的公式，后来被逐一证实。他说公式是“神告诉他的”。钱德拉塞卡用这个例子说明：审美直觉可以走到证明前面，但它也可能出错——拉马努金也有失败的猜想。<\/p>\n<h3>概念 3：风险（难度：高难）<\/h3>\n<p>美可能来自人的认知偏好，而非世界的结构。对称性崇拜曾让开普勒坚持圆轨道；简洁性崇拜也可能砍掉必要的复杂度。所以美只能是“在证据不足时的向导”，不能替代证据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;狄拉克的判据&quot;]\n  n2[&quot;拉马努金的直觉&quot;]\n  n1 --&gt; n2\n  n3[&quot;风险&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像选房子：采光好、结构简洁的更让人信服，但住进去才知道漏不漏水。边界：房子能住，理论要能预测。\n<\/li><li>\n<strong>实例<\/strong>：麦克斯韦方程组用四个方程统一电、磁、光；狄拉克方程把相对论与量子力学结合，还预言了正电子。两者都以极简形式给出大量可检验结论——这是“美”能当判据的实证基础。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为美的理论一定真——对称与简洁也可能是人的偏好投射。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n狄拉克的选择原则是？\n<ul>\n<li>\nA. 数据多者胜\n<\/li><li>\nB. 同等符合数据时选更美的\n<\/li><li>\nC. 作者名气大者胜\n<\/li><li>\nD. 越复杂越好\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：美是证据不足时的判据。\n<\/li><li>\n钱德拉塞卡对“美作判据”的态度是？\n<\/li><li>\nA. 绝对可靠\n<\/li><li>\nB. 启发式，不能替代证据\n<\/li><li>\nC. 完全无用\n<\/li><li>\nD. 只适用数学\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：美是向导，不是证明。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n美 = 最少结构解释最多现象\n<\/li><li>\n直觉可先行，也可出错\n<\/li><li>\n美不能替代证据\n<\/ul>", "kind": "chapter", "title": "第 4 章 美与科学对美的探求（1979）"}, "ch05": {"html": "<h1>第 5 章：米尔恩讲座：米尔恩与现代天体物理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch01、ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明米尔恩在恒星结构研究中的贡献\n<\/li><li>\n能指出“性格塑造理论”这一观察的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>米尔恩把恒星内部当作可计算的结构问题，也把强烈的个人信念带进理论；钱德拉塞卡借此说明科学家的性格会留在工作里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把恒星当结构算（难度：基础）<\/h3>\n<p>恒星靠引力与压强平衡，内部温度与密度由方程决定。米尔恩参与建立这套<strong>恒星结构<\/strong>（stellar structure）计算，使天体物理从描述走向定量。<\/p>\n<h3>概念 2：性格与方法（难度：进阶）<\/h3>\n<p>米尔恩有强烈的直觉式风格，喜欢从少数原理推出大胆结论。钱德拉塞卡既欣赏这种气魄，也指出它的风险：当直觉与数据冲突时，坚持直觉的人容易走偏。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;把恒星当结构算&quot;]\n  n2[&quot;性格与方法&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像建筑师既算结构又凭手感定比例：算得对才站得住，手感决定好不好看。边界：建筑要验收，理论要预测。\n<\/li><li>\n<strong>实例<\/strong>：太阳中心温度约一千五百万开尔文，可由流体静力学平衡与理想气体方程估算。这个数量级不是直接测量，而是结构方程的解。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为个人风格只影响写作——它会决定选择哪些问题、接受哪些证据。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n恒星结构理论要解决的核心平衡是？\n<ul>\n<li>\nA. 引力与压强\n<\/li><li>\nB. 磁场与电流\n<\/li><li>\nC. 熵与温度\n<\/li><li>\nD. 质量与电荷\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：流体静力学平衡是恒星模型的起点。\n<\/li><li>\n钱德拉塞卡对米尔恩风格的评价是？\n<\/li><li>\nA. 完全正确\n<\/li><li>\nB. 有气魄也有风险\n<\/li><li>\nC. 毫无价值\n<\/li><li>\nD. 只是运气\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：直觉能开辟方向，也可能压过数据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n恒星 = 引力与压强平衡\n<\/li><li>\n风格进入理论选择\n<\/li><li>\n直觉有气魄也有风险\n<\/ul>", "kind": "chapter", "title": "第 5 章 米尔恩讲座：米尔恩与现代天体物理"}, "ch06": {"html": "<h1>第 6 章：纪念爱丁顿诞辰一百周年<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明爱丁顿数是什么\n<\/li><li>\n能区分爱丁顿早年严谨工作与晚年推测性理论\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>爱丁顿早年以严谨的恒星物理与广义相对论验证著称，晚年却沉迷用基本常数拼出宇宙结构；同一个人可以同时留下两种极端的遗产。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：爱丁顿数（难度：进阶）<\/h3>\n<p>爱丁顿曾断言宇宙中质子数是一个精确的巨大数字（136×2^256 量级），并试图从基本常数推出它。这类“用纯数解释宇宙”的努力，后来被视为推测性建构，而非可检验理论。<\/p>\n<h3>概念 2：早年的严谨（难度：进阶）<\/h3>\n<p>他最早给出恒星辐射平衡的理论，并在 1919 年日食观测中验证光线弯曲，使广义相对论获得公众承认。这部分工作扎实、可检验，与晚年形成鲜明对照。<\/p>\n<h3>概念 3：如何评价（难度：高难）<\/h3>\n<p>钱德拉塞卡不嘲笑晚年，也不为其辩护。他把它当作一个案例：<strong>审美与统一冲动<\/strong>可以驱动最严谨的工作，也可以在缺乏约束时滑向数字神秘主义。分界线是有没有可检验的预言。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;爱丁顿数&quot;]\n  n2[&quot;早年的严谨&quot;]\n  n1 --&gt; n2\n  n3[&quot;如何评价&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一位工匠早年造桥、晚年用同一把尺子量星座：手艺还在，对象错了。边界：爱丁顿的晚年不是手艺退步，而是约束消失。\n<\/li><li>\n<strong>实例<\/strong>：1919 年日食观测：星光经过太阳附近发生偏折，偏折角与广义相对论预言一致。这是可重复、可反驳的证据，与数字拼凑完全不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为晚年失误会抹掉早年贡献——评价应按工作分别进行。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n爱丁顿数指的是？\n<ul>\n<li>\nA. 光速数值\n<\/li><li>\nB. 他断言的宇宙质子总数\n<\/li><li>\nC. 电子质量\n<\/li><li>\nD. 太阳温度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：一个用基本常数拼出的巨大数字。\n<\/li><li>\n区分爱丁顿早年与晚年的标准是？\n<\/li><li>\nA. 数学难度\n<\/li><li>\nB. 是否有可检验预言\n<\/li><li>\nC. 写作风格\n<\/li><li>\nD. 年龄\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可检验性是分界。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n爱丁顿数：数字神秘主义\n<\/li><li>\n1919 日食验证：可检验\n<\/li><li>\n统一冲动需约束\n<\/ul>", "kind": "chapter", "title": "第 6 章 纪念爱丁顿诞辰一百周年"}, "ch07": {"html": "<h1>第 7 章：史瓦西讲座：广义相对论的美学基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明广义相对论为何被视为“美的理论”\n<\/li><li>\n能指出美学论证在物理中的限度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>广义相对论的美来自三条：几何化的统一、极少的假设、与观测的精确吻合；但“美”本身仍不能代替观测。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：几何化的统一（难度：进阶）<\/h3>\n<p>引力不再是力，而是时空曲率；物质告诉时空如何弯曲，时空告诉物质如何运动。一个几何框架同时解释水星近日点进动、光线偏折、引力红移——这种“一个结构管多件事”是美的核心。<\/p>\n<h3>概念 2：史瓦西解（难度：高难）<\/h3>\n<p>史瓦西在第一次世界大战期间给出球对称解，后来成为黑洞研究的基础。钱德拉塞卡以他命名讲座，是因为这项工作展示了“简洁假设 + 严格推导”的典型美学。<\/p>\n<h3>概念 3：限度（难度：高难）<\/h3>\n<p>钱德拉塞卡提醒：美学判断依赖历史与文化，也依赖研究者的训练。广义相对论的美在 1915 年并未说服所有人，是观测把它确立下来的。美可以引导，不能裁决。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;几何化的统一&quot;]\n  n2[&quot;史瓦西解&quot;]\n  n1 --&gt; n2\n  n3[&quot;限度&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一座桥：线条简洁、受力清晰，看上去就“对”；但能不能通车要算过、试过。边界：桥的失败是塌，理论的失败是预言不准。\n<\/li><li>\n<strong>实例<\/strong>：水星近日点每百年进动约 43 角秒，牛顿理论解释不了，广义相对论算出来正好。一个数字就把“美”变成“可信”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“美”是主观的，所以与科学无关——它是有结构的判断（统一、简洁、对称），只是不能单独裁决。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n广义相对论“美”的核心是？\n<ul>\n<li>\nA. 公式短\n<\/li><li>\nB. 几何化统一与少量假设解释多现象\n<\/li><li>\nC. 作者有名\n<\/li><li>\nD. 实验多\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：统一与简洁是美学判断的实质。\n<\/li><li>\n钱德拉塞卡认为美学论证的限度是？\n<\/li><li>\nA. 不能写进论文\n<\/li><li>\nB. 不能替代观测裁决\n<\/li><li>\nC. 只适用于数学\n<\/li><li>\nD. 只对年轻人有效\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：美引导方向，观测决定去留。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGR 之美：几何统一 + 少假设 + 精确吻合\n<\/li><li>\n史瓦西解：简洁推导的典范\n<\/li><li>\n美引导，观测裁决\n<\/ul>", "kind": "chapter", "title": "第 7 章 史瓦西讲座：广义相对论的美学基础"}, "c01": {"html": "<h1>三种创造模式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 03 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>创造力在人生中的三种分布：早年巅峰后转向、一次爆发后转移、持续上升到晚年。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“科学家老了还行不行”这个模糊问题变成可比较的形态问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>莎士比亚型：早期密度最高，后期换形态（情节→人物）。<\/p>\n<p>牛顿型：核心成果集中在短窗口，之后注意力转向别处。<\/p>\n<p>贝多芬型：每个阶段都在前一阶段上开新层，晚期反而更抽象。<\/p>\n<p>判断一个人属于哪型，要看作品密度与形态变化，不看单次成败。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为三种模式是成就排名——它是形态分类。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>三种模式<\/td><td>核心文本<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n科学动机、审美判据\n<\/ul>", "kind": "concept", "title": "三种创造模式"}, "c02": {"html": "<h1>美作为科学判据<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 04 章、第 07 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在证据不足时，用简洁、对称、统一等审美标准在多个等价理论间做选择。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了科学史上许多“先觉得美、后被证实”的选择，也暴露了这种选择的危险。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>美的三种可操作形态：更少的独立假设、更大的统一范围、更精确的结构对应。<\/p>\n<p>成功案例：麦克斯韦方程、狄拉克方程、广义相对论。<\/p>\n<p>失败案例：开普勒的圆轨道执念、爱丁顿的数字拼凑。<\/p>\n<p>结论：美是搜索启发式，证据是裁决者。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为美是纯主观偏好——它有可分析的结构，只是不能单独定案。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>美与科学<\/td><td>狄拉克判据<\/td><\/tr><tr><td>ch07<\/td><td>GR 美学<\/td><td>统一与简洁<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n三种创造模式、可检验性\n<\/ul>", "kind": "concept", "title": "美作为科学判据"}, "c03": {"html": "<h1>可检验性作为分界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 01 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个主张是否科学，取决于它能否给出可被独立观测推翻的预言。<\/p>\n<h2>为什么重要<\/h2>\n<p>钱德拉塞卡用它区分爱丁顿的早年与晚年，也用它评价米尔恩的直觉风格。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>可检验的三要素：明确的预言数值、独立的观测手段、可重复的结果。<\/p>\n<p>缺一项，主张就退化为建构或信念。<\/p>\n<p>注意：可检验不等于已被检验，也不等于正确；它是“有资格被裁决”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为可检验就是已被证实——它只是获得了被裁决的资格。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>科学家<\/td><td>独立证实<\/td><\/tr><tr><td>ch06<\/td><td>爱丁顿<\/td><td>分界应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n美作为判据、科学动机\n<\/ul>", "kind": "concept", "title": "可检验性作为分界"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：科学家（1946）<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 科学家（1946）<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：科学的追求及其动机（1985）<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 科学的追求及其动机（1985）<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：莎士比亚、牛顿和贝多芬：不同的创造模式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：美与科学对美的探求（1979）<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 美与科学对美的探求（1979）<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：米尔恩讲座：米尔恩与现代天体物理<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 米尔恩讲座：米尔恩与现代天体物理<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：纪念爱丁顿诞辰一百周年<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 纪念爱丁顿诞辰一百周年<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：史瓦西讲座：广义相对论的美学基础<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 史瓦西讲座：广义相对论的美学基础<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q15.<\/b> 把一位科学家归入“牛顿型”，最需要看的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 他活了多久<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 核心成果是否集中在短窗口、之后是否转移<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 他获过多少奖<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 他的学生多少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q16.<\/b> “美是真理的判据”最准确的理解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 美的理论一定真<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 证据不足时用美做启发式选择<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 美与科学无关<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 丑的理论一定假<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q17.<\/b> 爱丁顿晚年工作的主要问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 数学太难<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 缺乏可检验的预言<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 没有合作者<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 语言晦涩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章 科学家（1946）<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 卢瑟福模型的关键证据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 光谱线<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> α 粒子大角度散射<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> x 射线衍射<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 光电效应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡强调科学的分水岭是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 灵感<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 独立实验证实<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 声望<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 数学优美<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章 科学的追求及其动机（1985）<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 开普勒坚持二十多年的核心信念是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 行星沿圆轨道<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 宇宙有几何与音乐的和谐<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 地球是中心<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 引力不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡对动机的态度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q2' value='0'> 只有好奇才正当<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='1'> 不同动机支撑不同工作形态<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='2'> 动机不重要<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='3'> 实用动机最高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 钱德拉塞卡归纳的三种创造模式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 早熟、晚成、平庸<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 早年巅峰、一次爆发、持续上升<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 理论、实验、应用<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 天才、勤奋、运气<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 他用艺术家对照科学家的目的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q2' value='0'> 说明艺术更高<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='1'> 把创造力形态作为可比较的结构<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='2'> 贬低科学<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='3'> 讨论音乐<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章 美与科学对美的探求（1979）<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 狄拉克的选择原则是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 数据多者胜<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 同等符合数据时选更美的<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 作者名气大者胜<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 越复杂越好<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡对“美作判据”的态度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q2' value='0'> 绝对可靠<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='1'> 启发式，不能替代证据<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='2'> 完全无用<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='3'> 只适用数学<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章 米尔恩讲座：米尔恩与现代天体物理<\/h1><div class='quiz-item' data-qid='ch05-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 恒星结构理论要解决的核心平衡是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q1' value='0'> 引力与压强<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='1'> 磁场与电流<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='2'> 熵与温度<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='3'> 质量与电荷<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡对米尔恩风格的评价是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q2' value='0'> 完全正确<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='1'> 有气魄也有风险<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='2'> 毫无价值<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='3'> 只是运气<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章 纪念爱丁顿诞辰一百周年<\/h1><div class='quiz-item' data-qid='ch06-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 爱丁顿数指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 光速数值<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> 他断言的宇宙质子总数<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> 电子质量<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> 太阳温度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 区分爱丁顿早年与晚年的标准是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q2' value='0'> 数学难度<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='1'> 是否有可检验预言<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='2'> 写作风格<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='3'> 年龄<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章 史瓦西讲座：广义相对论的美学基础<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 广义相对论“美”的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 公式短<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 几何化统一与少量假设解释多现象<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 作者有名<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 实验多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡认为美学论证的限度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 不能写进论文<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 不能替代观测裁决<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 只适用于数学<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 只对年轻人有效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='恒星结构'>恒星结构 — 用引力与压强平衡等方程描述恒星内部 <span class=glossary-ref>（第 5 章 米尔恩讲座：米尔恩与现代天体物理）<\/span><\/li><li data-term='爱丁顿数'>爱丁顿数 — 爱丁顿断言的宇宙质子总数 <span class=glossary-ref>（第 6 章 纪念爱丁顿诞辰一百周年）<\/span><\/li><li data-term='狄拉克判据'>狄拉克判据 — 同等符合数据时选更美的理论 <span class=glossary-ref>（第 4 章 美与科学对美的探求（1979））<\/span><\/li><li data-term='拉马努金直觉'>拉马努金直觉 — 未经证明却大量正确的公式直觉 <span class=glossary-ref>（第 4 章 美与科学对美的探求（1979））<\/span><\/li><li data-term='史瓦西解'>史瓦西解 — 球对称时空的精确解，黑洞研究基础 <span class=glossary-ref>（第 7 章 史瓦西讲座：广义相对论的美学基础）<\/span><\/li><li data-term='近日点进动'>近日点进动 — 水星轨道每百年的额外偏移 <span class=glossary-ref>（第 7 章 史瓦西讲座：广义相对论的美学基础）<\/span><\/li><li data-term='独立证实'>独立证实 — 由不同实验者重复验证 <span class=glossary-ref>（第 1 章 科学家（1946））<\/span><\/li><li data-term='审美启发式'>审美启发式 — 用美引导理论选择的方法 <span class=glossary-ref>（第 4 章 美与科学对美的探求（1979））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>真理与美 模式与框架库<\/h1>\n<h2>分析框架：评价一位科学家的一生<\/h2>\n<p>分三段看：①核心贡献集中在哪个年龄段；②贡献形态有没有变化（换问题、换方法）；③晚年工作是否仍受可检验性约束。三段合起来才能判断属于哪种创造模式，而不是用“老了不行了”一句概括。<\/p>\n<h2>决策规则：两个理论都符合数据时怎么选<\/h2>\n<p>先看独立假设数量（少者优）→ 再看统一范围（管的现象多者优）→ 再看结构对应是否精确 → 最后才看个人偏好。任何一步都不能跳过证据。<\/p>\n<h2>反模式：用审美替代裁决<\/h2>\n<p>对称、简洁、统一都可以引导搜索，但不能决定去留。开普勒的圆轨道与爱丁顿的数字拼凑都是审美越界的案例。<\/p>\n<h2>反模式：用晚年否定早年<\/h2>\n<p>同一个人可以同时留下严谨与狂想两种遗产。评价要按工作分项，不能整体贴标签。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>三模式<\/td><td>莎士比亚（早峰）/ 牛顿（单峰）/ 贝多芬（上升）<\/td><\/tr><tr><td>美三形态<\/td><td>少假设、大统一、精确对应<\/td><\/tr><tr><td>可检验三要素<\/td><td>明确预言、独立观测、可重复<\/td><\/tr><tr><td>爱丁顿数<\/td><td>136×2^256 量级<\/td><\/tr><tr><td>GR 三大验证<\/td><td>水星进动、光线偏折、引力红移<\/td><\/tr><tr><td>史瓦西解<\/td><td>球对称真空解<\/td><\/tr><tr><td>选择顺序<\/td><td>假设数 → 统一范围 → 精确性 → 偏好<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/07-真理与美", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 科学家（1946）", "href": "#/chapter/ch01"}, {"label": "第 2 章 科学的追求及其动机（1985）", "href": "#/chapter/ch02"}, {"label": "第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式", "href": "#/chapter/ch03"}, {"label": "第 4 章 美与科学对美的探求（1979）", "href": "#/chapter/ch04"}, {"label": "第 5 章 米尔恩讲座：米尔恩与现代天体物理", "href": "#/chapter/ch05"}, {"label": "第 6 章 纪念爱丁顿诞辰一百周年", "href": "#/chapter/ch06"}, {"label": "第 7 章 史瓦西讲座：广义相对论的美学基础", "href": "#/chapter/ch07"}]}, {"label": "概念", "children": [{"label": "三种创造模式", "href": "#/concept/c01"}, {"label": "美作为科学判据", "href": "#/concept/c02"}, {"label": "可检验性作为分界", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 科学家（1946）", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 科学的追求及其动机（1985）", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 美与科学对美的探求（1979）", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 米尔恩讲座：米尔恩与现代天体物理", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 纪念爱丁顿诞辰一百周年", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 史瓦西讲座：广义相对论的美学基础", "href": "#/quiz/ch07"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：科学家（1946）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：0.8 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述科学家工作的日常形态与动机\n<\/li><li>\n能说明“模型被实验证实”在科学中的分量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>科学家不是靠灵感生活的人，而是把大部分时间花在测量、计算、验证上的人；一个模型的价值，取决于它能否被独立实验证实。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从散射实验到原子核模型（难度：基础）<\/h3>\n<p>卢瑟福让 α 粒子打金箔，发现大多数穿过去、少数大角度反弹。要解释这个分布，只能假设原子质量集中在一个很小的带电核心。钱德拉塞卡复述这段历史，是为了说明：模型的产生不是为了好看，而是为了解释一个反常的分布。<\/p>\n<h3>概念 2：科学家的日常（难度：进阶）<\/h3>\n<p>他描述科学家的生活：长时间的重复测量、枯燥的计算、与同行争论、写论文被拒。灵感只占很小一部分，剩下的是把想法钉死的功夫。这一点与公众想象差距很大。<\/p>\n<h3>概念 3：验证的分量（难度：进阶）<\/h3>\n<p>模型提出后，盖革与马斯顿用一系列实验证实了散射公式的预言。钱德拉塞卡强调：<strong>独立证实<\/strong>才是科学的分水岭，而不是提出者的声望。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从散射实验到原子核模型&quot;]\n  n2[&quot;科学家的日常&quot;]\n  n1 --&gt; n2\n  n3[&quot;验证的分量&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像侦探破案：灵感是“我怀疑是他”，定案要靠证据链。边界：侦探有嫌疑人名单，科学家连“嫌疑人”都要自己造。\n<\/li><li>\n<strong>实例<\/strong>：α 粒子散射：大多数穿过（原子内部很空），约万分之几大角度偏转（存在小而重的核）。两个比例一对比，核的大小与电荷就能估出来。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为科学家的主要工作是提出理论——实际上大部分时间在验证与排除。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n卢瑟福模型的关键证据是？\n<ul>\n<li>\nA. 光谱线\n<\/li><li>\nB. α 粒子大角度散射\n<\/li><li>\nC. x 射线衍射\n<\/li><li>\nD. 光电效应\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：大角度反弹说明存在小而重的核心。\n<\/li><li>\n钱德拉塞卡强调科学的分水岭是？\n<\/li><li>\nA. 灵感\n<\/li><li>\nB. 独立实验证实\n<\/li><li>\nC. 声望\n<\/li><li>\nD. 数学优美\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可重复的独立验证才是关键。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n模型为解释反常而生\n<\/li><li>\n日常是测量与验证\n<\/li><li>\n独立证实是分水岭\n<\/ul>", "ch02": "<h1>第 2 章：科学的追求及其动机（1985）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能列出驱动科学追求的几种动机\n<\/li><li>\n能说明开普勒的动机与今天的“职业科学家”有何不同\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>科学追求的动机不止实用与好奇，还包括对秩序与和谐的信念；开普勒就是被“宇宙必须是和谐的”这一信念推着走的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：开普勒的执念（难度：基础）<\/h3>\n<p>开普勒相信行星轨道背后有几何与音乐的和谐，花了二十多年试各种正多面体模型，最后用第谷的观测数据逼出椭圆轨道。他的动机不是“预测位置”，而是“证明宇宙有秩序”。<\/p>\n<h3>概念 2：动机的谱系（难度：进阶）<\/h3>\n<p>钱德拉塞卡列出几类：实用（计时、导航）、好奇（想知道为什么）、审美（追求简洁与对称）、野心（想要名声）。他并不评判高下，只指出不同动机支撑的工作形态不同：审美驱动的人更能忍受长期无用的探索。<\/p>\n<h3>概念 3：动机与诚实（难度：高难）<\/h3>\n<p>他提醒：动机会影响你接受什么证据。开普勒晚年沉迷和谐模型，几乎放弃数据；牛顿晚年沉迷神学与炼金。动机越强，越需要外部检验来拉住。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;开普勒的执念&quot;]\n  n2[&quot;动机的谱系&quot;]\n  n1 --&gt; n2\n  n3[&quot;动机与诚实&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像有人登山是为了风景，有人为了纪录，有人只是因为山在那里：同一座山，不同的坚持方式。边界：登山有明确终点，科学探索没有。\n<\/li><li>\n<strong>实例<\/strong>：开普勒先用正多面体嵌套解释行星间距，误差很大；改用椭圆后，与第谷数据吻合到观测精度。同一动机，两次模型，胜负由数据判。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为动机纯粹是好事——强动机也会让人拒斥不利证据。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n开普勒坚持二十多年的核心信念是？\n<ul>\n<li>\nA. 行星沿圆轨道\n<\/li><li>\nB. 宇宙有几何与音乐的和谐\n<\/li><li>\nC. 地球是中心\n<\/li><li>\nD. 引力不存在\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：和谐信念驱动他不断换模型，最终被数据纠正。\n<\/li><li>\n钱德拉塞卡对动机的态度是？\n<\/li><li>\nA. 只有好奇才正当\n<\/li><li>\nB. 不同动机支撑不同工作形态\n<\/li><li>\nC. 动机不重要\n<\/li><li>\nD. 实用动机最高\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：他不评判高下，只看动机与证据的关系。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n动机谱系：实用、好奇、审美、野心\n<\/li><li>\n强动机需外部检验拉住\n<\/li><li>\n开普勒：和谐信念 + 数据纠正\n<\/ul>", "ch03": "<h1>第 3 章：莎士比亚、牛顿和贝多芬：不同的创造模式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能复述三种创造模式并各举一例\n<\/li><li>\n能说明钱德拉塞卡为什么用艺术家来对照科学家\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>创造力在人生中的分布有三种形态：早年即巅峰后转向（莎士比亚）、一次爆发后不再有原创（牛顿）、持续上升到晚年（贝多芬）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：莎士比亚：早年巅峰（难度：进阶）<\/h3>\n<p>莎士比亚在三十岁前后写出主要喜剧与历史剧，随后转向悲剧与传奇剧。钱德拉塞卡注意的是：他的创造力没有消失，而是换了形态——从情节转向人物内心。格林早年对他的攻击，恰好说明他上升之快。<\/p>\n<h3>概念 2：牛顿：一次爆发（难度：进阶）<\/h3>\n<p>牛顿的核心工作（微积分、光学、引力）集中在二十几岁到三十出头，之后转向造币厂与神学，再没有同等量级的原创。这是“单峰”模式：一次高强度爆发，随后不再回到同一高度。<\/p>\n<h3>概念 3：贝多芬：持续上升（难度：进阶）<\/h3>\n<p>贝多芬从早期古典风格，到晚期的《第九交响曲》与弦乐四重奏，创造力持续深化到耳聋之后。这是“上升”模式：每一次都在前一次的基础上开新层。钱德拉塞卡用三种模式问：科学家属于哪一种？他自己的答案偏向“贝多芬式”是可能的，但需要极长的专注。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;莎士比亚：早年巅峰&quot;]\n  n2[&quot;牛顿：一次爆发&quot;]\n  n1 --&gt; n2\n  n3[&quot;贝多芬：持续上升&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图时注意三条曲线不是高低之分，而是“峰值出现的时间”与“后期形态”之分；不要把它读成成就排名。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像三种树：有的早春开花，有的只开一季，有的逐年长高、秋天还在结果。边界：人的创造力受健康、机遇、学科阶段影响，不能只归因于性格。\n<\/li><li>\n<strong>实例<\/strong>：把三人的作品按年龄排一条时间轴：莎士比亚 30 岁前后密度最高；牛顿 1665–1687 集中爆发；贝多芬 30 岁后每十年上一个台阶。三条形状一看就不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为三种模式有优劣——钱德拉塞卡明确说这是形态差异，不是价值排序。\n<\/li><li>\n别以为牛顿晚年“江郎才尽”——他的注意力转移到了别的领域，这在三种模式里属于正常形态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n钱德拉塞卡归纳的三种创造模式是？\n<ul>\n<li>\nA. 早熟、晚成、平庸\n<\/li><li>\nB. 早年巅峰、一次爆发、持续上升\n<\/li><li>\nC. 理论、实验、应用\n<\/li><li>\nD. 天才、勤奋、运气\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：分别对应莎士比亚、牛顿、贝多芬。\n<\/li><li>\n他用艺术家对照科学家的目的是？\n<\/li><li>\nA. 说明艺术更高\n<\/li><li>\nB. 把创造力形态作为可比较的结构\n<\/li><li>\nC. 贬低科学\n<\/li><li>\nD. 讨论音乐\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：跨领域对照能看清“创造寿命”的形状。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三模式：早峰 / 单峰 / 上升\n<\/li><li>\n形态差异不是价值排序\n<\/li><li>\n创造寿命受多因素影响\n<\/ul>", "ch04": "<h1>第 4 章：美与科学对美的探求（1979）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.1 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明狄拉克“美是真理判据”的主张\n<\/li><li>\n能指出这种判据的风险\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>科学家用“美”作为选择理论的判据：简洁、对称、少假设的理论更可能真；但美是启发式，不是证明。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：狄拉克的判据（难度：进阶）<\/h3>\n<p>狄拉克说：如果两个理论都符合数据，选更美的那个。他的理由是历史上的成功案例——相对论、量子力学的形式都极简洁。钱德拉塞卡补充：这种美不是装饰，而是“用最少的结构解释最多的现象”。<\/p>\n<h3>概念 2：拉马努金的直觉（难度：高难）<\/h3>\n<p>拉马努金给出大量没有证明的公式，后来被逐一证实。他说公式是“神告诉他的”。钱德拉塞卡用这个例子说明：审美直觉可以走到证明前面，但它也可能出错——拉马努金也有失败的猜想。<\/p>\n<h3>概念 3：风险（难度：高难）<\/h3>\n<p>美可能来自人的认知偏好，而非世界的结构。对称性崇拜曾让开普勒坚持圆轨道；简洁性崇拜也可能砍掉必要的复杂度。所以美只能是“在证据不足时的向导”，不能替代证据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;狄拉克的判据&quot;]\n  n2[&quot;拉马努金的直觉&quot;]\n  n1 --&gt; n2\n  n3[&quot;风险&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像选房子：采光好、结构简洁的更让人信服，但住进去才知道漏不漏水。边界：房子能住，理论要能预测。\n<\/li><li>\n<strong>实例<\/strong>：麦克斯韦方程组用四个方程统一电、磁、光；狄拉克方程把相对论与量子力学结合，还预言了正电子。两者都以极简形式给出大量可检验结论——这是“美”能当判据的实证基础。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为美的理论一定真——对称与简洁也可能是人的偏好投射。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n狄拉克的选择原则是？\n<ul>\n<li>\nA. 数据多者胜\n<\/li><li>\nB. 同等符合数据时选更美的\n<\/li><li>\nC. 作者名气大者胜\n<\/li><li>\nD. 越复杂越好\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：美是证据不足时的判据。\n<\/li><li>\n钱德拉塞卡对“美作判据”的态度是？\n<\/li><li>\nA. 绝对可靠\n<\/li><li>\nB. 启发式，不能替代证据\n<\/li><li>\nC. 完全无用\n<\/li><li>\nD. 只适用数学\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：美是向导，不是证明。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n美 = 最少结构解释最多现象\n<\/li><li>\n直觉可先行，也可出错\n<\/li><li>\n美不能替代证据\n<\/ul>", "ch05": "<h1>第 5 章：米尔恩讲座：米尔恩与现代天体物理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch01、ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明米尔恩在恒星结构研究中的贡献\n<\/li><li>\n能指出“性格塑造理论”这一观察的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>米尔恩把恒星内部当作可计算的结构问题，也把强烈的个人信念带进理论；钱德拉塞卡借此说明科学家的性格会留在工作里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：把恒星当结构算（难度：基础）<\/h3>\n<p>恒星靠引力与压强平衡，内部温度与密度由方程决定。米尔恩参与建立这套<strong>恒星结构<\/strong>（stellar structure）计算，使天体物理从描述走向定量。<\/p>\n<h3>概念 2：性格与方法（难度：进阶）<\/h3>\n<p>米尔恩有强烈的直觉式风格，喜欢从少数原理推出大胆结论。钱德拉塞卡既欣赏这种气魄，也指出它的风险：当直觉与数据冲突时，坚持直觉的人容易走偏。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;把恒星当结构算&quot;]\n  n2[&quot;性格与方法&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像建筑师既算结构又凭手感定比例：算得对才站得住，手感决定好不好看。边界：建筑要验收，理论要预测。\n<\/li><li>\n<strong>实例<\/strong>：太阳中心温度约一千五百万开尔文，可由流体静力学平衡与理想气体方程估算。这个数量级不是直接测量，而是结构方程的解。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为个人风格只影响写作——它会决定选择哪些问题、接受哪些证据。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n恒星结构理论要解决的核心平衡是？\n<ul>\n<li>\nA. 引力与压强\n<\/li><li>\nB. 磁场与电流\n<\/li><li>\nC. 熵与温度\n<\/li><li>\nD. 质量与电荷\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：流体静力学平衡是恒星模型的起点。\n<\/li><li>\n钱德拉塞卡对米尔恩风格的评价是？\n<\/li><li>\nA. 完全正确\n<\/li><li>\nB. 有气魄也有风险\n<\/li><li>\nC. 毫无价值\n<\/li><li>\nD. 只是运气\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：直觉能开辟方向，也可能压过数据。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n恒星 = 引力与压强平衡\n<\/li><li>\n风格进入理论选择\n<\/li><li>\n直觉有气魄也有风险\n<\/ul>", "ch06": "<h1>第 6 章：纪念爱丁顿诞辰一百周年<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明爱丁顿数是什么\n<\/li><li>\n能区分爱丁顿早年严谨工作与晚年推测性理论\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>爱丁顿早年以严谨的恒星物理与广义相对论验证著称，晚年却沉迷用基本常数拼出宇宙结构；同一个人可以同时留下两种极端的遗产。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：爱丁顿数（难度：进阶）<\/h3>\n<p>爱丁顿曾断言宇宙中质子数是一个精确的巨大数字（136×2^256 量级），并试图从基本常数推出它。这类“用纯数解释宇宙”的努力，后来被视为推测性建构，而非可检验理论。<\/p>\n<h3>概念 2：早年的严谨（难度：进阶）<\/h3>\n<p>他最早给出恒星辐射平衡的理论，并在 1919 年日食观测中验证光线弯曲，使广义相对论获得公众承认。这部分工作扎实、可检验，与晚年形成鲜明对照。<\/p>\n<h3>概念 3：如何评价（难度：高难）<\/h3>\n<p>钱德拉塞卡不嘲笑晚年，也不为其辩护。他把它当作一个案例：<strong>审美与统一冲动<\/strong>可以驱动最严谨的工作，也可以在缺乏约束时滑向数字神秘主义。分界线是有没有可检验的预言。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;爱丁顿数&quot;]\n  n2[&quot;早年的严谨&quot;]\n  n1 --&gt; n2\n  n3[&quot;如何评价&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一位工匠早年造桥、晚年用同一把尺子量星座：手艺还在，对象错了。边界：爱丁顿的晚年不是手艺退步，而是约束消失。\n<\/li><li>\n<strong>实例<\/strong>：1919 年日食观测：星光经过太阳附近发生偏折，偏折角与广义相对论预言一致。这是可重复、可反驳的证据，与数字拼凑完全不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为晚年失误会抹掉早年贡献——评价应按工作分别进行。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n爱丁顿数指的是？\n<ul>\n<li>\nA. 光速数值\n<\/li><li>\nB. 他断言的宇宙质子总数\n<\/li><li>\nC. 电子质量\n<\/li><li>\nD. 太阳温度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：一个用基本常数拼出的巨大数字。\n<\/li><li>\n区分爱丁顿早年与晚年的标准是？\n<\/li><li>\nA. 数学难度\n<\/li><li>\nB. 是否有可检验预言\n<\/li><li>\nC. 写作风格\n<\/li><li>\nD. 年龄\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可检验性是分界。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n爱丁顿数：数字神秘主义\n<\/li><li>\n1919 日食验证：可检验\n<\/li><li>\n统一冲动需约束\n<\/ul>", "ch07": "<h1>第 7 章：史瓦西讲座：广义相对论的美学基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1 小时 ｜ <strong>前置<\/strong>：ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明广义相对论为何被视为“美的理论”\n<\/li><li>\n能指出美学论证在物理中的限度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>广义相对论的美来自三条：几何化的统一、极少的假设、与观测的精确吻合；但“美”本身仍不能代替观测。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：几何化的统一（难度：进阶）<\/h3>\n<p>引力不再是力，而是时空曲率；物质告诉时空如何弯曲，时空告诉物质如何运动。一个几何框架同时解释水星近日点进动、光线偏折、引力红移——这种“一个结构管多件事”是美的核心。<\/p>\n<h3>概念 2：史瓦西解（难度：高难）<\/h3>\n<p>史瓦西在第一次世界大战期间给出球对称解，后来成为黑洞研究的基础。钱德拉塞卡以他命名讲座，是因为这项工作展示了“简洁假设 + 严格推导”的典型美学。<\/p>\n<h3>概念 3：限度（难度：高难）<\/h3>\n<p>钱德拉塞卡提醒：美学判断依赖历史与文化，也依赖研究者的训练。广义相对论的美在 1915 年并未说服所有人，是观测把它确立下来的。美可以引导，不能裁决。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;几何化的统一&quot;]\n  n2[&quot;史瓦西解&quot;]\n  n1 --&gt; n2\n  n3[&quot;限度&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一座桥：线条简洁、受力清晰，看上去就“对”；但能不能通车要算过、试过。边界：桥的失败是塌，理论的失败是预言不准。\n<\/li><li>\n<strong>实例<\/strong>：水星近日点每百年进动约 43 角秒，牛顿理论解释不了，广义相对论算出来正好。一个数字就把“美”变成“可信”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“美”是主观的，所以与科学无关——它是有结构的判断（统一、简洁、对称），只是不能单独裁决。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n广义相对论“美”的核心是？\n<ul>\n<li>\nA. 公式短\n<\/li><li>\nB. 几何化统一与少量假设解释多现象\n<\/li><li>\nC. 作者有名\n<\/li><li>\nD. 实验多\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：统一与简洁是美学判断的实质。\n<\/li><li>\n钱德拉塞卡认为美学论证的限度是？\n<\/li><li>\nA. 不能写进论文\n<\/li><li>\nB. 不能替代观测裁决\n<\/li><li>\nC. 只适用于数学\n<\/li><li>\nD. 只对年轻人有效\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：美引导方向，观测决定去留。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGR 之美：几何统一 + 少假设 + 精确吻合\n<\/li><li>\n史瓦西解：简洁推导的典范\n<\/li><li>\n美引导，观测裁决\n<\/ul>", "c01": "<h1>三种创造模式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 03 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>创造力在人生中的三种分布：早年巅峰后转向、一次爆发后转移、持续上升到晚年。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“科学家老了还行不行”这个模糊问题变成可比较的形态问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>莎士比亚型：早期密度最高，后期换形态（情节→人物）。<\/p>\n<p>牛顿型：核心成果集中在短窗口，之后注意力转向别处。<\/p>\n<p>贝多芬型：每个阶段都在前一阶段上开新层，晚期反而更抽象。<\/p>\n<p>判断一个人属于哪型，要看作品密度与形态变化，不看单次成败。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为三种模式是成就排名——它是形态分类。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>三种模式<\/td><td>核心文本<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n科学动机、审美判据\n<\/ul>", "c02": "<h1>美作为科学判据<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 04 章、第 07 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在证据不足时，用简洁、对称、统一等审美标准在多个等价理论间做选择。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了科学史上许多“先觉得美、后被证实”的选择，也暴露了这种选择的危险。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>美的三种可操作形态：更少的独立假设、更大的统一范围、更精确的结构对应。<\/p>\n<p>成功案例：麦克斯韦方程、狄拉克方程、广义相对论。<\/p>\n<p>失败案例：开普勒的圆轨道执念、爱丁顿的数字拼凑。<\/p>\n<p>结论：美是搜索启发式，证据是裁决者。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为美是纯主观偏好——它有可分析的结构，只是不能单独定案。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>美与科学<\/td><td>狄拉克判据<\/td><\/tr><tr><td>ch07<\/td><td>GR 美学<\/td><td>统一与简洁<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n三种创造模式、可检验性\n<\/ul>", "c03": "<h1>可检验性作为分界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 01 章、第 06 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个主张是否科学，取决于它能否给出可被独立观测推翻的预言。<\/p>\n<h2>为什么重要<\/h2>\n<p>钱德拉塞卡用它区分爱丁顿的早年与晚年，也用它评价米尔恩的直觉风格。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>可检验的三要素：明确的预言数值、独立的观测手段、可重复的结果。<\/p>\n<p>缺一项，主张就退化为建构或信念。<\/p>\n<p>注意：可检验不等于已被检验，也不等于正确；它是“有资格被裁决”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为可检验就是已被证实——它只是获得了被裁决的资格。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>科学家<\/td><td>独立证实<\/td><\/tr><tr><td>ch06<\/td><td>爱丁顿<\/td><td>分界应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n美作为判据、科学动机\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：科学家（1946）<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 科学家（1946）<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：科学的追求及其动机（1985）<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 科学的追求及其动机（1985）<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：莎士比亚、牛顿和贝多芬：不同的创造模式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：美与科学对美的探求（1979）<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 美与科学对美的探求（1979）<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：米尔恩讲座：米尔恩与现代天体物理<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 米尔恩讲座：米尔恩与现代天体物理<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：纪念爱丁顿诞辰一百周年<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 纪念爱丁顿诞辰一百周年<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：史瓦西讲座：广义相对论的美学基础<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 史瓦西讲座：广义相对论的美学基础<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q15.<\/b> 把一位科学家归入“牛顿型”，最需要看的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 他活了多久<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 核心成果是否集中在短窗口、之后是否转移<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 他获过多少奖<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 他的学生多少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q16.<\/b> “美是真理的判据”最准确的理解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 美的理论一定真<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 证据不足时用美做启发式选择<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 美与科学无关<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 丑的理论一定假<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q17.<\/b> 爱丁顿晚年工作的主要问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 数学太难<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 缺乏可检验的预言<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 没有合作者<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 语言晦涩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章 科学家（1946）<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 卢瑟福模型的关键证据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 光谱线<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> α 粒子大角度散射<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> x 射线衍射<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 光电效应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡强调科学的分水岭是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 灵感<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 独立实验证实<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 声望<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 数学优美<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章 科学的追求及其动机（1985）<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 开普勒坚持二十多年的核心信念是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 行星沿圆轨道<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 宇宙有几何与音乐的和谐<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> 地球是中心<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 引力不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡对动机的态度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q2' value='0'> 只有好奇才正当<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='1'> 不同动机支撑不同工作形态<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='2'> 动机不重要<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='3'> 实用动机最高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章 莎士比亚、牛顿和贝多芬：不同的创造模式<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 钱德拉塞卡归纳的三种创造模式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 早熟、晚成、平庸<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 早年巅峰、一次爆发、持续上升<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 理论、实验、应用<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 天才、勤奋、运气<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 他用艺术家对照科学家的目的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q2' value='0'> 说明艺术更高<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='1'> 把创造力形态作为可比较的结构<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='2'> 贬低科学<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='3'> 讨论音乐<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章 美与科学对美的探求（1979）<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 狄拉克的选择原则是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 数据多者胜<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 同等符合数据时选更美的<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 作者名气大者胜<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 越复杂越好<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡对“美作判据”的态度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q2' value='0'> 绝对可靠<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='1'> 启发式，不能替代证据<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='2'> 完全无用<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='3'> 只适用数学<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章 米尔恩讲座：米尔恩与现代天体物理<\/h1><div class='quiz-item' data-qid='ch05-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 恒星结构理论要解决的核心平衡是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q1' value='0'> 引力与压强<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='1'> 磁场与电流<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='2'> 熵与温度<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='3'> 质量与电荷<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡对米尔恩风格的评价是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q2' value='0'> 完全正确<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='1'> 有气魄也有风险<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='2'> 毫无价值<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='3'> 只是运气<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章 纪念爱丁顿诞辰一百周年<\/h1><div class='quiz-item' data-qid='ch06-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 爱丁顿数指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 光速数值<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> 他断言的宇宙质子总数<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> 电子质量<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> 太阳温度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 区分爱丁顿早年与晚年的标准是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q2' value='0'> 数学难度<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='1'> 是否有可检验预言<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='2'> 写作风格<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='3'> 年龄<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章 史瓦西讲座：广义相对论的美学基础<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 广义相对论“美”的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 公式短<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 几何化统一与少量假设解释多现象<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 作者有名<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 实验多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 钱德拉塞卡认为美学论证的限度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 不能写进论文<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 不能替代观测裁决<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 只适用于数学<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 只对年轻人有效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='恒星结构'>恒星结构 — 用引力与压强平衡等方程描述恒星内部 <span class=glossary-ref>（第 5 章 米尔恩讲座：米尔恩与现代天体物理）<\/span><\/li><li data-term='爱丁顿数'>爱丁顿数 — 爱丁顿断言的宇宙质子总数 <span class=glossary-ref>（第 6 章 纪念爱丁顿诞辰一百周年）<\/span><\/li><li data-term='狄拉克判据'>狄拉克判据 — 同等符合数据时选更美的理论 <span class=glossary-ref>（第 4 章 美与科学对美的探求（1979））<\/span><\/li><li data-term='拉马努金直觉'>拉马努金直觉 — 未经证明却大量正确的公式直觉 <span class=glossary-ref>（第 4 章 美与科学对美的探求（1979））<\/span><\/li><li data-term='史瓦西解'>史瓦西解 — 球对称时空的精确解，黑洞研究基础 <span class=glossary-ref>（第 7 章 史瓦西讲座：广义相对论的美学基础）<\/span><\/li><li data-term='近日点进动'>近日点进动 — 水星轨道每百年的额外偏移 <span class=glossary-ref>（第 7 章 史瓦西讲座：广义相对论的美学基础）<\/span><\/li><li data-term='独立证实'>独立证实 — 由不同实验者重复验证 <span class=glossary-ref>（第 1 章 科学家（1946））<\/span><\/li><li data-term='审美启发式'>审美启发式 — 用美引导理论选择的方法 <span class=glossary-ref>（第 4 章 美与科学对美的探求（1979））<\/span><\/li><\/ul>", "__patterns__": "<h1>真理与美 模式与框架库<\/h1>\n<h2>分析框架：评价一位科学家的一生<\/h2>\n<p>分三段看：①核心贡献集中在哪个年龄段；②贡献形态有没有变化（换问题、换方法）；③晚年工作是否仍受可检验性约束。三段合起来才能判断属于哪种创造模式，而不是用“老了不行了”一句概括。<\/p>\n<h2>决策规则：两个理论都符合数据时怎么选<\/h2>\n<p>先看独立假设数量（少者优）→ 再看统一范围（管的现象多者优）→ 再看结构对应是否精确 → 最后才看个人偏好。任何一步都不能跳过证据。<\/p>\n<h2>反模式：用审美替代裁决<\/h2>\n<p>对称、简洁、统一都可以引导搜索，但不能决定去留。开普勒的圆轨道与爱丁顿的数字拼凑都是审美越界的案例。<\/p>\n<h2>反模式：用晚年否定早年<\/h2>\n<p>同一个人可以同时留下严谨与狂想两种遗产。评价要按工作分项，不能整体贴标签。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>三模式<\/td><td>莎士比亚（早峰）/ 牛顿（单峰）/ 贝多芬（上升）<\/td><\/tr><tr><td>美三形态<\/td><td>少假设、大统一、精确对应<\/td><\/tr><tr><td>可检验三要素<\/td><td>明确预言、独立观测、可重复<\/td><\/tr><tr><td>爱丁顿数<\/td><td>136×2^256 量级<\/td><\/tr><tr><td>GR 三大验证<\/td><td>水星进动、光线偏折、引力红移<\/td><\/tr><tr><td>史瓦西解<\/td><td>球对称真空解<\/td><\/tr><tr><td>选择顺序<\/td><td>假设数 → 统一范围 → 精确性 → 偏好<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
