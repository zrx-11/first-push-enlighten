el class='quiz-opt'><input type='radio' name='ch12-q1' value='2'> 只适用于生命<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='3'> 与熵无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 协同进化推动复杂度上升的机制是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q2' value='0'> 固定目标优化<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='1'> 互为环境导致选择压力不断变化<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='2'> 随机漂变<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='3'> 能量输入增加<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章 过去和现在<\/h1><div class='quiz-item' data-qid='ch13-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “复制优先”与“代谢优先”争论的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q1' value='0'> 地球年龄<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1' value='1'> 先有遗传机制还是先有自维持化学循环<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1' value='2'> 是否有水<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1' value='3'> 氧气浓度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 免疫系统对生命起源研究的启示是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q2' value='0'> 必须有清单<\/label><label class='quiz-opt'><input type='radio' name='ch13-q2' value='1'> 生成多样性再筛选可产生识别能力<\/label><label class='quiz-opt'><input type='radio' name='ch13-q2' value='2'> 复制必须先于代谢<\/label><label class='quiz-opt'><input type='radio' name='ch13-q2' value='3'> 生命需要氧气<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章 未来<\/h1><div class='quiz-item' data-qid='ch14-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 摩尔定律在书中被理解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q1' value='0'> 物理定律<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1' value='1'> 制度化引擎的历史斜率<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1' value='2'> 市场宣传<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1' value='3'> 随机波动<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 技术加速的主要限制不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q2' value='0'> 散热与量子效应<\/label><label class='quiz-opt'><input type='radio' name='ch14-q2' value='1'> 研发成本上升<\/label><label class='quiz-opt'><input type='radio' name='ch14-q2' value='2'> 社会监管成为筛选层<\/label><label class='quiz-opt'><input type='radio' name='ch14-q2' value='3'> 人类不再有创意<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='免费的结构'>免费的结构 — 物理定律自发形成、无需指令的秩序 <span class=glossary-ref>（第 3 章 免费的结构）<\/span><\/li><li data-term='目的性结构'>目的性结构 — 为实现功能、由指令生成的结构 <span class=glossary-ref>（第 4 章 目的性结构）<\/span><\/li><li data-term='复杂引擎'>复杂引擎 — 复制、变异、选择、累积构成的循环 <span class=glossary-ref>（第 5 章 无概率性和复杂引擎）<\/span><\/li><li data-term='无概率性'>无概率性 — 结果概率极低却实际发生 <span class=glossary-ref>（第 5 章 无概率性和复杂引擎）<\/span><\/li><li data-term='算法进化'>算法进化 — 把引擎写成程序，如遗传算法 <span class=glossary-ref>（第 6 章 算法进化）<\/span><\/li><li data-term='适应度'>适应度 — 个体在任务上的评分 <span class=glossary-ref>（第 6 章 算法进化）<\/span><\/li><li data-term='体细胞超突变'>体细胞超突变 — 免疫细胞在筛选后进一步加速变异 <span class=glossary-ref>（第 7 章 身体内的进化）<\/span><\/li><li data-term='阴性选择'>阴性选择 — 删除识别自身的免疫细胞 <span class=glossary-ref>（第 7 章 身体内的进化）<\/span><\/li><li data-term='负反馈'>负反馈 — 按偏差反向修正的控制方式 <span class=glossary-ref>（第 8 章 控制循环）<\/span><\/li><li data-term='布尔网络'>布尔网络 — 节点只有开/关、由逻辑规则更新的网络 <span class=glossary-ref>（第 9 章 复杂系统）<\/span><\/li><li data-term='混沌边缘'>混沌边缘 — 有序与混沌之间的临界区域 <span class=glossary-ref>（第 9 章 复杂系统）<\/span><\/li><li data-term='拟子'>拟子 — 文化中可复制传播的单位 <span class=glossary-ref>（第 11 章 文化的进化）<\/span><\/li><li data-term='负熵'>负熵 — 相对最大熵状态的有序程度 <span class=glossary-ref>（第 12 章 复杂性的进化）<\/span><\/li><li data-term='协同进化'>协同进化 — 两个种群互为环境、选择压力互相变化 <span class=glossary-ref>（第 12 章 复杂性的进化）<\/span><\/li><li data-term='红皇后效应'>红皇后效应 — 必须不断进化才能维持相对位置 <span class=glossary-ref>（第 12 章 复杂性的进化）<\/span><\/li><li data-term='摩尔定律'>摩尔定律 — 集成电路晶体管数约每两年翻倍 <span class=glossary-ref>（第 14 章 未来）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>复杂的引擎 模式与框架库<\/h1>\n<h2>分析框架：四问判断一个过程是否为“引擎”<\/h2>\n<p>有没有复制？副本之间有没有差异？差异是否影响留存？留存的优势是否能进入下一轮？四问全“是”，才配得上“进化/引擎”这个词。<\/p>\n<h2>分析框架：结构来源判别<\/h2>\n<p>看形态是否由对称性与能量最低决定 → 免费结构；看形态是否服务于某个功能、需要步骤才能造出 → 目的性结构；两者都有 → 分层解释，别用一个词糊过去。<\/p>\n<h2>决策规则：评估函数优先<\/h2>\n<p>if 你要用算法进化/训练得到某个能力 then 先把该能力写成可测分数，并检查有没有被漏掉的性质 if 分数只覆盖一部分 then 结果一定会利用漏洞<\/p>\n<h2>反模式：把负熵当复杂度<\/h2>\n<p>有序 ≠ 复杂。晶体熵极低却简单。要区分“简单有序”与“精巧组织”，必须引入描述长度或生成步骤。<\/p>\n<h2>反模式：把拟子当基因<\/h2>\n<p>文化单位没有清晰边界与物理载体，不能直接套用基因的频率、适应度算法。当启发式用，别当理论用。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>引擎四步<\/td><td>复制 → 变异 → 选择 → 累积（闭环）<\/td><\/tr><tr><td>两类结构<\/td><td>免费（物理自发）/ 目的性（指令 + 功能）<\/td><\/tr><tr><td>元胞机规则数<\/td><td>一维两态看左右邻居：2^8=256 条<\/td><\/tr><tr><td>无概率性换算<\/td><td>单次 2^-1000 vs 多轮小幅改进<\/td><\/tr><tr><td>免疫三步<\/td><td>多样性生成 → 抗原筛选 → 克隆扩增<\/td><\/tr><tr><td>布尔网络<\/td><td>稀疏连接→周期态；密集→混沌<\/td><\/tr><tr><td>拟子的边界问题<\/td><td>一个笑话改一字还是同一个吗<\/td><\/tr><tr><td>协同进化<\/td><td>适应度地形随对手移动，无固定终点<\/td><\/tr><tr><td>摩尔定律<\/td><td>约每两年翻倍，遇范式转换则重置<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452506321646594/点化学习系统/02-复杂的引擎", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章 问题", "href": "#/chapter/ch01"}, {"label": "第 2 章 计算", "href": "#/chapter/ch02"}, {"label": "第 3 章 免费的结构", "href": "#/chapter/ch03"}, {"label": "第 4 章 目的性结构", "href": "#/chapter/ch04"}, {"label": "第 5 章 无概率性和复杂引擎", "href": "#/chapter/ch05"}, {"label": "第 6 章 算法进化", "href": "#/chapter/ch06"}, {"label": "第 7 章 身体内的进化", "href": "#/chapter/ch07"}, {"label": "第 8 章 控制循环", "href": "#/chapter/ch08"}, {"label": "第 9 章 复杂系统", "href": "#/chapter/ch09"}, {"label": "第 10 章 人类学习和创造性", "href": "#/chapter/ch10"}, {"label": "第 11 章 文化的进化", "href": "#/chapter/ch11"}, {"label": "第 12 章 复杂性的进化", "href": "#/chapter/ch12"}, {"label": "第 13 章 过去和现在", "href": "#/chapter/ch13"}, {"label": "第 14 章 未来", "href": "#/chapter/ch14"}]}, {"label": "概念", "children": [{"label": "复杂引擎", "href": "#/concept/c01"}, {"label": "免费的结构与目的性结构", "href": "#/concept/c02"}, {"label": "无概率性与累积选择", "href": "#/concept/c03"}, {"label": "混沌边缘", "href": "#/concept/c04"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章 问题", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 计算", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章 免费的结构", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 目的性结构", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章 无概率性和复杂引擎", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章 算法进化", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章 身体内的进化", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章 控制循环", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章 复杂系统", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章 人类学习和创造性", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章 文化的进化", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章 复杂性的进化", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章 过去和现在", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章 未来", "href": "#/quiz/ch14"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清“随机蕴含万物”为什么在实践上等于“什么都长不出来”\n<\/li><li>\n能区分“有序”与“有目的”两种结构\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>组分的随机组合在足够长的时间里能造出任何东西，但任何特定有趣结构出现的概率都低到不可能；宇宙里那些精巧结构不是等来的，是被某种过程造出来的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：随机为什么不够（难度：基础）<\/h3>\n<p>原子组合的可能性是天文数字，所以“理论上什么都能出现”。问题在于概率分布：绝大多数组合是无意义的排列，有趣结构只占极小一撮。就像把一箱零件摇一万年，摇出一台闹钟的概率依然接近于零。梅菲尔德把这种困境讲成全书起点：既然不是等来的，那它是怎么来的？<\/p>\n<h3>概念 2：两种结构（难度：基础）<\/h3>\n<p><strong>免费的结构<\/strong>（白话：不需要指令、物理定律自己就会形成的秩序）：雪花六角、岩浆冷却的柱状节理、热水对流形成的贝纳德花纹。<strong>目的性结构<\/strong>（白话：为了某个功能而被组织起来的结构）：螺丝刀、蛋白质、鸟巢、程序。前者的形状由能量最低与对称性决定，后者的形状由“要干什么”决定。全书的主线就是把后者的来源说清楚。<\/p>\n<h3>概念 3：答案的形状：一台引擎（难度：进阶）<\/h3>\n<p>梅菲尔德提前给出结论：目的性结构来自一种计算——不是先想好答案再执行，而是反复生成候选、按结果筛选、把筛选结果留作下一轮起点。他把这套机制叫<strong>复杂引擎<\/strong>。后面十几章都是把这台引擎拆开看它在不同尺度上怎么运转。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;随机为什么不够&quot;]\n  n2[&quot;两种结构&quot;]\n  n1 --&gt; n2\n  n3[&quot;答案的形状：一台引擎&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像赌场里的老虎机：单次中奖纯靠运气，但如果把中奖的机器留下继续转、不中的淘汰，几百轮后剩下的机器就不再是运气。边界：赌场有明确的“中奖”标准，进化里“好”的标准是当下的繁殖成功率，会随环境变化。\n<\/li><li>\n<strong>实例<\/strong>：10 个位置、每位可填 0 或 1，共 2^10=1024 种串。想要“全部为 1”，随机一次命中率 1/1024；若允许每轮保留最接近全 1 的串并随机改一位，通常十几轮就能到全 1。同一目标，两种过程，代价差两个数量级。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“时间足够长什么都会出现”——实际上组合空间增长得比时间快得多，等不来。\n<\/li><li>\n别以为雪花和螺丝刀是同一种“秩序”——实际上前者免费，后者需要指令。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n书中“免费的结构”指的是？\n<ul>\n<li>\nA. 不需要材料的结构\n<\/li><li>\nB. 物理定律自发形成的秩序\n<\/li><li>\nC. 生物免费获得的结构\n<\/li><li>\nD. 随机产生的结构\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：雪花、对流花纹属于无需指令、由物理过程自动形成的结构。\n<\/li><li>\n为什么说随机组合“蕴含万物”却不产生万物？\n<\/li><li>\nA. 随机不是真随机\n<\/li><li>\nB. 有趣结构在组合空间中占比极小\n<\/li><li>\nC. 时间不够长\n<\/li><li>\nD. 原子数量不足\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：可能性存在，但概率低到实际不可能。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n随机蕴含万物 ≠ 随机能造出万物\n<\/li><li>\n两类结构：免费的结构 / 目的性结构\n<\/li><li>\n答案：一台生成并筛选的引擎\n<\/ul>", "ch02": "<h1>第 2 章：计算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“指令”为什么必须是一串可执行的操作而不是一张蓝图\n<\/li><li>\n能用元胞自动机解释简单规则如何生成复杂图样\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>结构由指令生成，指令的本质是计算：一串有限、机械、可重复执行的步骤；计算不需要理解自己在做什么。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：系统与边界（难度：基础）<\/h3>\n<p>梅菲尔德先定义<strong>系统<\/strong>（白话：有边界的、由部分组成的东西）。边界不是物理墙，而是你划出来用于分析的范围：一个细胞、一台机器、一个经济体。划定边界后，系统内部有状态，外部有输入输出，计算就是状态之间的转换。<\/p>\n<h3>概念 2：计算的极简模型（难度：进阶）<\/h3>\n<p>他沿用图灵机与元胞自动机两条线索。元胞自动机尤其有用：一维两状态、只看左右邻居时只有 256 条规则（2^8），规则 110 能从单个黑格生成复杂到无法用短公式描述的图案。这说明<strong>复杂图样不需要复杂规则<\/strong>，只需要规则被反复执行。<\/p>\n<h3>概念 3：指令与蓝图的分野（难度：高难）<\/h3>\n<p>蓝图描述最终形状，指令描述生成步骤。生物不用蓝图：DNA 不描述你的脸，它给的是发育过程中每一步的化学操作。这也是为什么同卵双胞胎不是完全一样——同一套指令在不同环境里执行会得到不同结果。计算的意义就在这里：它是“过程”而不是“图像”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;系统与边界&quot;]\n  n2[&quot;计算的极简模型&quot;]\n  n1 --&gt; n2\n  n3[&quot;指令与蓝图的分野&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：做菜是计算，菜谱是程序：菜谱写的是步骤，不是成品照片。边界：菜谱依赖厨师的理解，程序依赖机器严格执行；生物介于两者之间，靠化学环境“执行”指令。\n<\/li><li>\n<strong>实例<\/strong>：规则 110 从单个黑格出发，前几代是简单的三角形，几十代后出现周期性背景上滑动的结构。你能手推前 5 代，但推 100 代必须写程序——这就是“简单规则、复杂结果”的手感。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为复杂结构必须有复杂规则——实际上规则可以极简，复杂度来自反复执行与累积。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一维两状态、看左右邻居的元胞自动机共有多少条规则？\n<ul>\n<li>\nA. 16\n<\/li><li>\nB. 64\n<\/li><li>\nC. 256\n<\/li><li>\nD. 1024\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：3 个格子的 8 种状态各对应 0/1 输出，共 2^8=256 条。\n<\/li><li>\nDNA 更像下列哪一种？\n<\/li><li>\nA. 成品蓝图\n<\/li><li>\nB. 分步执行的指令序列\n<\/li><li>\nC. 随机噪声\n<\/li><li>\nD. 固定几何模具\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：基因给的是发育与代谢的操作步骤，而非成品形状描述。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n计算 = 状态按规则转换\n<\/li><li>\n简单规则 + 反复执行 = 复杂图样\n<\/li><li>\nDNA 是指令，不是蓝图\n<\/ul>", "ch03": "<h1>第 3 章：免费的结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.9 小时 ｜ <strong>前置<\/strong>：ch01、ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能举三个物理自发结构的例子并说出其共同机制\n<\/li><li>\n能说明“不需要知道形成细节也能理解结构”的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>物理系统在能量与对称性的约束下会自动形成有序结构，不需要任何指令；这类秩序是“免费”的，但它的形态种类有限。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：雪花与对流（难度：基础）<\/h3>\n<p>雪花：水分子按氢键角度附着，六角对称由分子几何决定，每片雪花的细节不同但骨架相同。对流：底部受热的流体会形成规则六边形胞（贝纳德胞），因为这种对流模式最有效地输运热量。两者都不需要“设计”，只需要能量梯度与局部规则。<\/p>\n<h3>概念 2：为什么免费结构有限（难度：进阶）<\/h3>\n<p>免费结构的形态由物理常数与对称性决定，因此可复现、可预测，但种类不多——晶体、波纹、条纹、胞状结构，翻来覆去就这些。要得到螺丝刀这种“为了拧螺丝而存在”的形状，物理定律帮不上忙：能量最低态不会自己变成工具。<\/p>\n<h3>概念 3：理解结构不需要知道形成史（难度：进阶）<\/h3>\n<p>梅菲尔德指出：理解一个结构，只需知道它<strong>可能的<\/strong>形成途径，不必知道具体哪一次怎么形成。这和“读懂一句外语”类似——你不需要知道说话人今天的经历，也能理解句子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;雪花与对流&quot;]\n  n2[&quot;为什么免费结构有限&quot;]\n  n1 --&gt; n2\n  n3[&quot;理解结构不需要知道形成史&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：水烧开时的对流花纹像一支不用指挥的合唱团：每个人只按身边的温度行动，最后自动排出队形。边界：合唱团的队形由物理约束决定，目的性结构还要有“要达成什么”的目标。\n<\/li><li>\n<strong>实例<\/strong>：把一锅水从底部加热，温差超过临界值后表面出现规则六边形花纹。降温后花纹消失。整个过程没有指令，只有温度梯度——这就是免费结构的可复现性。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为所有秩序都需要设计——实际上物理自发秩序大量存在，只是形态种类有限。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n贝纳德胞的形成主要依靠？\n<ul>\n<li>\nA. 化学指令\n<\/li><li>\nB. 温度梯度驱动的对流\n<\/li><li>\nC. 随机涨落\n<\/li><li>\nD. 外部模具\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：底部加热产生对流，六边形是最有效的输运模式。\n<\/li><li>\n免费结构与目的性结构的关键区别是？\n<\/li><li>\nA. 是否需要能量\n<\/li><li>\nB. 是否由指令生成以达成功能\n<\/li><li>\nC. 是否可复现\n<\/li><li>\nD. 是否有对称性\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：两者都消耗能量、都可复现；区别在是否为实现功能而组织。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n物理自发秩序：雪花、对流、晶体\n<\/li><li>\n免费结构形态有限\n<\/li><li>\n理解结构只需知道可能的形成途径\n<\/ul>", "ch04": "<h1>第 4 章：目的性结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能对比螺丝刀与盐晶的形成过程，指出差在哪一步\n<\/li><li>\n能说明“功能”如何反过来约束结构\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>目的性结构不是物理定律的直接产物，它需要一份把“要做什么”翻译成“怎么做”的指令；这份指令本身必须是可执行的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：螺丝刀：从图到步骤（难度：基础）<\/h3>\n<p>梅菲尔德用一把手工螺丝刀做例子：设计图只给出形状，真正造出来还需要一系列制造步骤（选料、切割、车削、热处理、装配）。图是<strong>描述<\/strong>，步骤是<strong>指令<\/strong>。缺了步骤，图不会自己变成螺丝刀；缺了图，步骤也没有方向。<\/p>\n<h3>概念 2：蛋白质：自然界的目的性结构（难度：进阶）<\/h3>\n<p>蛋白质由氨基酸链自发折叠成特定三维形状，形状决定功能（催化、结构、识别）。但“自发折叠”不等于免费：氨基酸序列由 mRNA 决定，mRNA 由 DNA 决定，序列才是那份指令。折叠是物理过程，序列是计算产物。<\/p>\n<h3>概念 3：功能如何约束结构（难度：高难）<\/h3>\n<p>目的性结构的特点是：形状被功能筛选过。螺丝刀的刃口角度要能卡进螺丝槽，蛋白质的活性位点要能结合底物。这种“为了”关系不能从物理定律推出，只能从选择历史推出——这就是为什么下一章要引入引擎。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;螺丝刀：从图到步骤&quot;]\n  n2[&quot;蛋白质：自然界的目的性结构&quot;]\n  n1 --&gt; n2\n  n3[&quot;功能如何约束结构&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：螺丝刀像一把“被问题捏出来的钥匙”：不是自然长成，而是为了开某个锁被磨成那样。边界：钥匙是人磨的，蛋白质是选择留下的；两者都体现功能约束，但机制不同。\n<\/li><li>\n<strong>实例<\/strong>：把螺丝刀的图纸给一个不懂加工的人，他造不出来；把制造步骤给他，他能照着做。反过来，只给步骤不给目标，他会造出一堆无用零件。目的性结构需要“描述 + 步骤 + 目标”三件套。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为蛋白质折叠是“免费的”——实际上折叠靠物理，序列靠指令，二者缺一不可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n螺丝刀例子说明目的性结构必须包含？\n<ul>\n<li>\nA. 设计图即可\n<\/li><li>\nB. 制造步骤即可\n<\/li><li>\nC. 描述、步骤与目标\n<\/li><li>\nD. 随机试错\n<\/li><li>\n<strong>答案<\/strong>：C；<strong>解析<\/strong>：图、步骤、目标三者缺一不可。\n<\/li><li>\n蛋白质的形状最终由什么决定？\n<\/li><li>\nA. 环境温度\n<\/li><li>\nB. 氨基酸序列\n<\/li><li>\nC. 随机折叠\n<\/li><li>\nD. 细胞膜\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：序列由基因编码，折叠过程遵循物理，但形状信息在序列里。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n目的性结构 = 描述 + 可执行步骤 + 功能目标\n<\/li><li>\n蛋白质：序列是指令，折叠是物理\n<\/li><li>\n“为了”关系只能由选择历史解释\n<\/ul>", "ch05": "<h1>第 5 章：无概率性和复杂引擎<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.5 小时 ｜ <strong>前置<\/strong>：ch02、ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释“既不可能又必然”这一说法\n<\/li><li>\n能写出复杂引擎的四步并说明每一步缺了会怎样\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂引擎把“极不可能的结果”变成“几乎必然出现”：靠的是复制、变异、选择、累积四步，把一次性的概率事件拆成许多次小概率事件的串联筛选。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：无概率性：不可能与必然同时成立（难度：进阶）<\/h3>\n<p>抛 1000 次硬币得到某个特定序列，概率是 2^-1000，几乎不可能；但“某个序列”必然出现。<strong>无概率性<\/strong>（improbability，白话：结果极不可能，却又确实发生了）正是生物复杂性的特征：你的基因组是无数可能组合中的一个，概率极低，可它就在这。<\/p>\n<h3>概念 2：四步引擎（难度：基础）<\/h3>\n<p>①<strong>复制<\/strong>：让已有的结构产生副本；②<strong>变异<\/strong>：副本与原件有微小差异；③<strong>选择<\/strong>：按当下表现为副本定去留；④<strong>累积<\/strong>：保留的优势成为下一轮的起点。四步缺一不可：没有复制，成果无法积累；没有变异，无法探索新可能；没有选择，方向随机；没有累积，永远从零开始。<\/p>\n<h3>概念 3：为什么这是计算（难度：高难）<\/h3>\n<p>引擎不预设答案，它通过大量候选的生成与筛选来“搜索”解空间。这与计算机里的搜索算法同构：生成—测试—保留。区别在于搜索空间巨大、评价标准随环境变化。梅菲尔德因此说：进化是一台计算机，它算出的结果是“能活的形状”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;无概率性：不可能与必然同时成立&quot;]\n  n2[&quot;四步引擎&quot;]\n  n1 --&gt; n2\n  n3[&quot;为什么这是计算&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>读图时把四步当环路看：累积把结果送回复制，形成闭环；断掉任何一条边，引擎就退化成随机漂变或死水。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像抄写员一代代抄一本书，每代抄错一两个字母，读者只留下读得通的版本：几百年后这本书既不是原本，也不是随机乱码。边界：抄写员没有“目标文本”，读者的偏好就是唯一标准。\n<\/li><li>\n<strong>实例<\/strong>：目标串 16 个字母。随机一次命中率 26^-16。若每轮复制 100 份、每份随机改一个字母、只留下与目标最接近的 1 份，通常几十轮可达。总尝试次数从 10^22 降到 10^4 量级——这就是累积选择的力量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为进化是“随机搜索”——实际上它是累积选择，随机只负责提供变异。\n<\/li><li>\n别以为“极不可能”就等于“不可能”——实际上无概率性正是生命的常态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复杂引擎的四步是？\n<ul>\n<li>\nA. 复制、变异、选择、累积\n<\/li><li>\nB. 观察、假设、实验、结论\n<\/li><li>\nC. 编码、解码、压缩、存储\n<\/li><li>\nD. 生成、评估、部署、监控\n<\/li><li>\n<strong>答案<\/strong>：A；<strong>解析<\/strong>：四步构成闭环，缺一不可。\n<\/li><li>\n“无概率性”指的是？\n<\/li><li>\nA. 概率无法计算\n<\/li><li>\nB. 结果极不可能却实际发生\n<\/li><li>\nC. 随机性不存在\n<\/li><li>\nD. 概率等于零\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：生命与复杂结构正是这种“几乎不可能却发生了”的产物。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n复杂引擎：复制—变异—选择—累积\n<\/li><li>\n累积把一次性概率拆成多轮筛选\n<\/li><li>\n进化 = 一台搜索计算机\n<\/ul>", "ch06": "<h1>第 6 章：算法进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch05\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明遗传算法与神经网络训练共享哪套引擎\n<\/li><li>\n能指出“评估函数”在算法进化中的决定性作用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把复杂引擎写成程序就是算法进化：遗传算法搜索控制串，神经网络搜索权重，两者都靠“生成候选—按分数保留—在保留者上继续扰动”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：神经网络：权重就是基因（难度：进阶）<\/h3>\n<p><strong>神经网络<\/strong>（neural network，白话：许多节点按层连接，连接上有权重，输入逐层加权求和后输出）的能力全在权重里。训练的一种原始办法是：复制一份网络，随机微调若干权重，测试表现，保留更好的。这就是引擎四步在权重空间里跑。<\/p>\n<h3>概念 2：推土机与遗传算法（难度：进阶）<\/h3>\n<p>书里用“推土机”任务说明遗传算法：机器人要在随机地形上推平土堆，控制串决定动作。做法是生成一批控制串、在多种初始地形上测试、选最好的变异再测。要点是<strong>评估必须覆盖多种环境<\/strong>，否则演化出的只是对某一张地图的记忆。<\/p>\n<h3>概念 3：评估函数就是“选择压力”（难度：高难）<\/h3>\n<p>算法进化能出什么，取决于你给什么打分。分数写错，演化出的东西会精准地利用评分漏洞——这不是 bug，是选择压力在忠实工作。设计者因此必须把想要的性质写进评估，而不是写进期望。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;神经网络：权重就是基因&quot;]\n  n2[&quot;推土机与遗传算法&quot;]\n  n1 --&gt; n2\n  n3[&quot;评估函数就是“选择压力”&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像公司考核：你考核什么，员工就优化什么。考核“代码行数”，就得到一堆长代码。边界：公司还能讲道理，算法只认分数。\n<\/li><li>\n<strong>实例<\/strong>：训练一个 3 层网络识别手写数字：先随机初始化权重，测准确率；保留最好的 10 个，各复制 10 份并随机扰动权重；再测、再选。几十轮后准确率从 10% 升到 90% 以上。全程没有“理解”，只有分数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为遗传算法一定比梯度法差——实际上在搜索空间崎岖、不可导时，它更稳。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n神经网络训练中“基因”对应什么？\n<ul>\n<li>\nA. 节点数量\n<\/li><li>\nB. 连接权重\n<\/li><li>\nC. 层数\n<\/li><li>\nD. 输入数据\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：能力主要编码在权重里，扰动与保留都作用于权重。\n<\/li><li>\n遗传算法演化出“作弊策略”的根本原因是？\n<\/li><li>\nA. 代码有 bug\n<\/li><li>\nB. 评估函数只测了部分目标\n<\/li><li>\nC. 变异率太高\n<\/li><li>\nD. 种群太小\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：选择压力忠实优化被测量的东西，漏测的性质不会被演化出来。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算法进化 = 引擎的程序版\n<\/li><li>\n权重/控制串 = 基因\n<\/li><li>\n评估函数决定能演化出什么\n<\/ul>", "ch07": "<h1>第 7 章：身体内的进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch05、ch06\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明免疫系统为什么必须在身体内部“再跑一次进化”\n<\/li><li>\n能区分迭代过程与序列过程\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>身体里的进化是加速版：免疫系统在几周内完成病原体与抗体之间的“生成—筛选—扩增”，因为病原体也在进化，慢一步就输。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要体内进化（难度：进阶）<\/h3>\n<p>病原体繁殖快、变异快，靠固定的一套识别清单必然失效。免疫系统的办法是生成海量随机多样的 B 细胞受体，遇到病原体后筛选出能结合的那几个，快速扩增并进一步变异（体细胞超突变），再选一轮。整个过程就是引擎四步，时间尺度是周而不是百万年。<\/p>\n<h3>概念 2：迭代与序列：两类过程的区别（难度：进阶）<\/h3>\n<p><strong>迭代过程<\/strong>（白话：反复执行同一动作）如晶体生长、细胞分裂；<strong>序列过程<\/strong>（白话：按顺序执行不同动作）如发育、装配、免疫应答。梅菲尔德用这个区分说明：不同过程的组合方式决定了复杂度上限——串联的序列过程能积累出更深的层次。<\/p>\n<h3>概念 3：代价与限制（难度：高难）<\/h3>\n<p>体内进化有自身免疫的风险：随机生成受体，总有几个会认自己。系统因此需要“阴性选择”把认自身的细胞删掉，代价是可用多样性减少。这是引擎在真实约束下的折中，不是完美设计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;为什么需要体内进化&quot;]\n  n2[&quot;迭代与序列：两类过程的区别&quot;]\n  n1 --&gt; n2\n  n3[&quot;代价与限制&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家公司临时组建项目组：从员工池里挑几个对口的，干得好就扩编，干不好就解散。边界：员工池是人，抗体池是随机生成的分子，且没有“培训”。\n<\/li><li>\n<strong>实例<\/strong>：接种疫苗后，能识别该抗原的 B 细胞被选中扩增，部分转为记忆细胞。十年后同一病原再来，记忆细胞几天内就能大量产生抗体——反应速度的差别就是“提前跑过一轮引擎”的收益。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为免疫系统有“病原清单”——实际上它靠生成多样性再筛选，没有预先的名单。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n免疫系统在体内进行的“进化”主要发生在？\n<ul>\n<li>\nA. 骨髓造血\n<\/li><li>\nB. B 细胞筛选与扩增\n<\/li><li>\nC. 体温调节\n<\/li><li>\nD. 神经传导\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：B 细胞多样性生成、抗原筛选、克隆扩增与超突变构成引擎循环。\n<\/li><li>\n迭代过程与序列过程的区别是？\n<\/li><li>\nA. 是否有能量消耗\n<\/li><li>\nB. 是否重复同一动作\n<\/li><li>\nC. 是否有随机性\n<\/li><li>\nD. 是否有边界\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：迭代重复同一操作，序列按顺序执行不同操作。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n免疫系统 = 体内加速版引擎\n<\/li><li>\n多样性生成 → 筛选 → 扩增 → 再变异\n<\/li><li>\n阴性选择是必要代价\n<\/ul>", "ch08": "<h1>第 8 章：控制循环<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.6 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明负反馈与“目的性”的关系\n<\/li><li>\n能指出控制循环为什么是目的性结构的最小单元\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>目的性的最小实现是一个控制循环：设定目标、测量偏差、执行修正、再测量；蛋白质调控、恒温器、细菌趋化都是这个结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从蛋白质到恒温器（难度：基础）<\/h3>\n<p>蛋白质的活性位点结合底物后改变构象，抑制或激活下一步反应——这是分子级的负反馈。恒温器测温度、开关加热——同一逻辑。<strong>负反馈<\/strong>（白话：偏差越大，修正越强）让系统在扰动下维持在目标附近，这就是“目的”的最朴素形态。<\/p>\n<h3>概念 2：为什么它能代表目的性（难度：进阶）<\/h3>\n<p>目的性常被误解为“有意识的目标”。控制循环给出可操作的定义：系统持续把某个量拉回参考值。细菌趋化（向营养物游动）没有意识，却在做同一件事。梅菲尔德因此说：目的性可以工程化，不必神秘化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;从蛋白质到恒温器&quot;]\n  n2[&quot;为什么它能代表目的性&quot;]\n  n1 --&gt; n2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像洗澡调水温：手试水温，太凉就拧大热水，太烫就回调。边界：人会烦躁放弃，控制循环只按规则执行，可能震荡。\n<\/li><li>\n<strong>实例<\/strong>：细菌在葡萄糖浓度梯度中游动：浓度升高就继续直游，降低就翻滚换向。结果是总体向高浓度聚集。没有传感器清单，只有“测变化—改动作”的循环。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为目的性必须有意识——实际上负反馈循环就足以表现目的性行为。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n负反馈控制的核心是？\n<ul>\n<li>\nA. 放大偏差\n<\/li><li>\nB. 按偏差反向修正\n<\/li><li>\nC. 随机切换\n<\/li><li>\nD. 固定输出\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：偏差越大修正越强，从而把量拉回参考值。\n<\/li><li>\n细菌趋化体现的是？\n<\/li><li>\nA. 有意识的目标\n<\/li><li>\nB. 无意识的控制循环\n<\/li><li>\nC. 随机游走\n<\/li><li>\nD. 固定程序无反馈\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它按浓度变化调整游动方式，属于控制循环。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n目的性最小单元 = 控制循环\n<\/li><li>\n测偏差 → 修正 → 再测\n<\/li><li>\n目的性可以被工程化定义\n<\/ul>", "ch09": "<h1>第 9 章：复杂系统<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释布尔网络与“混沌边缘”的关系\n<\/li><li>\n能说明基因调控网络为何是复杂系统\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>大量节点按简单规则互动会自发产生有序行为；系统在完全有序与完全混沌之间的“边缘”区域，才具备既稳定又能灵活变化的计算能力。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：布尔网络（难度：进阶）<\/h3>\n<p><strong>布尔网络<\/strong>（Boolean network，白话：每个节点只有开/关两态，下一态由若干个输入节点的逻辑函数决定）。考夫曼发现：节点少、连接稀疏时，网络会稳定到少数几个周期状态；连接多时进入混沌。介于两者之间，周期数随规模缓慢增长——这就是<strong>混沌边缘<\/strong>（edge of chaos）。<\/p>\n<h3>概念 2：基因调控网络（难度：进阶）<\/h3>\n<p>转录因子结合 DNA 调控基因开关，本身就是一张布尔式的调控网。它必须既稳定（细胞类型不能乱变）又灵活（能响应信号）。考夫曼的猜想是：生物调控网络被进化推到了临界附近，因为只有那里同时具备稳健与可塑性。<\/p>\n<h3>概念 3：证据与争议（难度：高难）<\/h3>\n<p>支持证据：多种细胞的基因表达网络确实呈现临界特征。争议：临界性是因还是果，测量方法是否可靠，仍有争论。梅菲尔德的态度是把它当有前景的框架，而不是已定论的定律。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;布尔网络&quot;]\n  n2[&quot;基因调控网络&quot;]\n  n1 --&gt; n2\n  n3[&quot;证据与争议&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一屋子开关连成的电路：每个开关只看两三个邻居，整屋灯却会形成稳定的闪烁节奏。边界：电路有设计图，基因网络是进化凑出来的。\n<\/li><li>\n<strong>实例<\/strong>：10 个节点的网络，若每个节点接 2 个输入，系统通常收敛到少数几个循环；若每个接 5 个输入，多数初态会走向长周期或混沌。改连接数，行为类型就变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为网络越连接越“智能”——实际上连接过密会进入混沌，反而失去稳定计算能力。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n布尔网络的节点状态是？\n<ul>\n<li>\nA. 连续数值\n<\/li><li>\nB. 开/关两态\n<\/li><li>\nC. 三种状态\n<\/li><li>\nD. 随机值\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：每节点只有布尔两态，下一步由逻辑函数决定。\n<\/li><li>\n“混沌边缘”被认为有利于计算，因为？\n<\/li><li>\nA. 完全随机\n<\/li><li>\nB. 既稳定又灵活\n<\/li><li>\nC. 完全固定\n<\/li><li>\nD. 无法预测\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：临界区域兼具稳健性与可塑性，适合信息处理。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n布尔网络：两态 + 逻辑规则\n<\/li><li>\n稀疏→有序，密集→混沌\n<\/li><li>\n生物网络可能被演化推到临界\n<\/ul>", "ch10": "<h1>第 10 章：人类学习和创造性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch06、ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能把学习解释成同一台引擎的神经版本\n<\/li><li>\n能说明“创造”为什么也可以看作搜索而非灵感\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>学习是神经系统内部的变异-选择：突触权重被随机扰动，能改善表现的保留下来；创造则是把已有表征重组，再由现实筛选。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：大脑里的变异与选择（难度：进阶）<\/h3>\n<p>动作电位的频率与突触强度共同编码信息。学习的一种机制是：随机调整突触权重，行为变好就巩固，变差就回退。这不是比喻——书里引用的实验显示，随机扰动加保留策略确实能提升任务表现。<\/p>\n<h3>概念 2：创造作为重组搜索（难度：高难）<\/h3>\n<p>创造性常被描述为“灵感”。梅菲尔德把它拆成两步：先把已有概念以不寻常的方式重组（变异），再由现实或同行评议筛选（选择）。科学史里的“同时发现”正是搜索空间被多处同时探索的证据。<\/p>\n<h3>概念 3：为什么人比算法快（难度：高难）<\/h3>\n<p>人不需要真的试一万次：可以用模型预演、用语言交流、用已有知识剪掉大部分候选。这是“引擎 + 世界模型”的组合，效率远高于纯试错。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;大脑里的变异与选择&quot;]\n  n2[&quot;创造作为重组搜索&quot;]\n  n1 --&gt; n2\n  n3[&quot;为什么人比算法快&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像厨师改配方：每次只换一味料，好吃就留着，难吃就退回；几百次后形成自己的菜系。边界：厨师有味觉作为评估，学习者的评估标准可能被偏见带偏。\n<\/li><li>\n<strong>实例<\/strong>：学投篮：每次微调出手角度与力度（变异），命中就记住这种感觉（选择），下次在此基础上再调（累积）。教练的作用是加快评估、减少无效变异。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为创造是无中生有——实际上它多半是已有元素的重组加筛选。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n书中把学习描述为？\n<ul>\n<li>\nA. 被动接收信息\n<\/li><li>\nB. 权重扰动与保留的循环\n<\/li><li>\nC. 记忆容量扩大\n<\/li><li>\nD. 情绪调节\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：随机调整 + 表现筛选 + 巩固，与引擎同构。\n<\/li><li>\n人类创造比纯算法搜索高效，主要因为？\n<\/li><li>\nA. 大脑算力更高\n<\/li><li>\nB. 能用模型预演与知识剪枝\n<\/li><li>\nC. 人不会犯错\n<\/li><li>\nD. 灵感来自外部\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：世界模型与语言让候选空间大幅缩小。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n学习 = 突触层面的变异-选择\n<\/li><li>\n创造 = 重组 + 筛选\n<\/li><li>\n人靠模型预演减少试错\n<\/ul>", "ch11": "<h1>第 11 章：文化的进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch05、ch10\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“拟子”概念的用处与硬伤\n<\/li><li>\n能举出一个文化特征沿引擎四步传播的例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>文化也在跑同一台引擎：观念被复制、被改写、被受众选择、被累积成传统；但文化单位的边界模糊，使“拟子”难以成为严格概念。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：拟子的用处（难度：基础）<\/h3>\n<p><strong>拟子<\/strong>（meme，白话：文化中可被复制传播的单位，如旋律、口号、做法）提供了一个类比框架：观念像基因一样复制、变异、竞争注意力。它能解释为什么某些旋律越传越简单、某些做法越传越极端。<\/p>\n<h3>概念 2：拟子的硬伤（难度：进阶）<\/h3>\n<p>基因有明确的物理载体（DNA 序列），拟子没有：一个笑话的边界在哪？改一个字还算同一个吗？没有边界就无法计数、无法测量适应度。所以梅菲尔德把它当启发式，不当严格理论。<\/p>\n<h3>概念 3：文化引擎的真实机制（难度：高难）<\/h3>\n<p>可操作的部分是：传播（复制）、传者改写（变异）、受众采纳（选择）、代际沉淀（累积）。这条链在语言、工艺、制度里都能追踪。分工与贸易是累积的文化结构最典型的例子——没有哪个人能独自造出一辆车。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;拟子的用处&quot;]\n  n2[&quot;拟子的硬伤&quot;]\n  n1 --&gt; n2\n  n3[&quot;文化引擎的真实机制&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像老字号菜谱：每代厨师改一点，客人用脚投票，几代后成了“本地口味”。边界：菜谱有文本可考，多数文化单位没有清晰版本记录。\n<\/li><li>\n<strong>实例<\/strong>：一个网络梗的传播：原版被截图（复制）、二创改编（变异）、点赞转发多的留下来（选择）、成为固定用法（累积）。四步齐全，且每一步都能在平台数据里看到。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为文化进化等于基因进化——实际上文化可以横向传播、可以快速重组，不遵循代际传递。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n拟子概念的主要缺陷是？\n<ul>\n<li>\nA. 无法解释传播\n<\/li><li>\nB. 缺少明确边界与物理载体\n<\/li><li>\nC. 只适用于语言\n<\/li><li>\nD. 无法变异\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无法界定单位，就难以测量与检验。\n<\/li><li>\n文化累积的典型例子是？\n<\/li><li>\nA. 个人灵感\n<\/li><li>\nB. 分工与贸易形成的复杂产品\n<\/li><li>\nC. 基因突变\n<\/li><li>\nD. 个体记忆\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：复杂产品需要多代多人积累，个人无法独立完成。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n文化也跑复制-变异-选择-累积\n<\/li><li>\n拟子是启发式，不是严格单位\n<\/li><li>\n累积文化能造出个人造不出的东西\n<\/ul>", "ch12": "<h1>第 12 章：复杂性的进化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.4 小时 ｜ <strong>前置<\/strong>：ch05、ch09\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明“负熵”为什么不能等同于复杂性\n<\/li><li>\n能区分最优化与协同进化\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂性不是“熵低”，而是“难以用短描述生成”；复杂度可以进化上升，因为协同进化会不断给对手加难度，把系统推向更复杂的解。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：负熵的陷阱（难度：进阶）<\/h3>\n<p><strong>负熵<\/strong>（白话：相对于最大熵状态的有序程度）看似能度量复杂性，但两种复杂度差很远的系统可以有同样的负熵。有序不等于复杂：一块完美晶体高度有序，却极其简单。<\/p>\n<h3>概念 2：最优化与协同进化（难度：进阶）<\/h3>\n<p><strong>最优化<\/strong>：朝一个固定目标改进，容易收敛到局部最优。<strong>协同进化<\/strong>（co-evolution，白话：两个种群互为环境，彼此的选择压力随对方变化）则没有固定终点：猎物快了，捕食者也要快，复杂度被不断推高。这是“红皇后效应”的机制。<\/p>\n<h3>概念 3：复杂性的上升不是必然（难度：高难）<\/h3>\n<p>协同进化能解释局部上升，但不构成全局趋势。寄生、简化同样能成功。梅菲尔德因此把“复杂性进化”说成条件性的：在竞争激烈的生态位里，复杂度会被推高；在稳定环境里，简化更划算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;负熵的陷阱&quot;]\n  n2[&quot;最优化与协同进化&quot;]\n  n1 --&gt; n2\n  n3[&quot;复杂性的上升不是必然&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像两家公司互相追着升级产品：一家加功能，另一家也得加，几年后产品复杂到没人能全懂。边界：公司可以选择退出竞争，物种也可以退化简化。\n<\/li><li>\n<strong>实例<\/strong>：宿主与病原体的军备竞赛：宿主进化出新受体，病原体进化出新配体，宿主再换受体。每一步都让对方的选择压力变化，复杂度因此螺旋上升。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为低熵就等于高复杂——实际上晶体熵很低却很简单的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n负熵不能作为复杂性度量的原因是？\n<ul>\n<li>\nA. 无法计算\n<\/li><li>\nB. 不同复杂度可有相同负熵\n<\/li><li>\nC. 只适用于生命\n<\/li><li>\nD. 与熵无关\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：有序程度不能区分“简单有序”与“精巧组织”。\n<\/li><li>\n协同进化推动复杂度上升的机制是？\n<\/li><li>\nA. 固定目标优化\n<\/li><li>\nB. 互为环境导致选择压力不断变化\n<\/li><li>\nC. 随机漂变\n<\/li><li>\nD. 能量输入增加\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：对手变化使适应度地形不断移动，系统被推着升级。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n负熵 ≠ 复杂性\n<\/li><li>\n最优化有终点，协同进化没有\n<\/li><li>\n复杂度上升是条件性的，不是趋势\n<\/ul>", "ch13": "<h1>第 13 章：过去和现在<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：1.2 小时 ｜ <strong>前置<\/strong>：ch05、ch07\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能描述生命起源问题中“化学—计算”两条线索如何合流\n<\/li><li>\n能说明为什么“先有复制还是先有代谢”是难点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>生命起源的难点是：复制需要机器，机器需要复制；解法只能是把两者看作同一台引擎在不同阶段的产物，而不是先后两个奇迹。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：早期地球的化学条件（难度：进阶）<\/h3>\n<p>书里汇总的模型认为早期大气偏中性或弱还原（水、氮、二氧化碳，局部火山口强还原），有机分子可以由闪电、紫外、热液口的能量合成。米勒-尤里式实验证明氨基酸可以非生物生成——原料不是问题。<\/p>\n<h3>概念 2：复制与代谢的先后之争（难度：高难）<\/h3>\n<p><strong>复制优先<\/strong>：先出现能自我复制的分子（RNA 世界），再演化出代谢。<strong>代谢优先<\/strong>：先出现自维持的化学循环，再出现遗传。两派各有实验支持，也都缺关键环节。梅菲尔德的看法是：不必二选一，引擎可以在“半复制半代谢”的系统中启动。<\/p>\n<h3>概念 3：免疫系统的启示（难度：高难）<\/h3>\n<p>免疫系统展示了“没有清单也能识别”的可行路径：生成多样性、筛选、扩增。生命起源可能走了类似的路：一堆随机分子中，能自我维持的那几个被环境筛选出来，逐步固化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;早期地球的化学条件&quot;]\n  n2[&quot;复制与代谢的先后之争&quot;]\n  n1 --&gt; n2\n  n3[&quot;免疫系统的启示&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家没有老板的初创公司：先有几个能干活的人（代谢），还是先有一份商业计划（复制）？现实里往往是边干边写。边界：公司可以招人，早期地球只能靠化学反应。\n<\/li><li>\n<strong>实例<\/strong>：热液口附近的矿物表面能催化简单反应，形成局部化学循环；若某个循环偶然产生能促进该循环的分子，就出现“自我增强”。这一步是复制与代谢的共同雏形。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为生命起源必须有一个明确的第一步——实际上可能是一段模糊的过渡，多个机制同时变强。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“复制优先”与“代谢优先”争论的核心是？\n<ul>\n<li>\nA. 地球年龄\n<\/li><li>\nB. 先有遗传机制还是先有自维持化学循环\n<\/li><li>\nC. 是否有水\n<\/li><li>\nD. 氧气浓度\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：两派分别主张 RNA 复制或代谢网络先行。\n<\/li><li>\n免疫系统对生命起源研究的启示是？\n<\/li><li>\nA. 必须有清单\n<\/li><li>\nB. 生成多样性再筛选可产生识别能力\n<\/li><li>\nC. 复制必须先于代谢\n<\/li><li>\nD. 生命需要氧气\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：无预设清单也能通过筛选产生功能。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n原料可由非生物过程生成\n<\/li><li>\n复制与代谢可能同时起步\n<\/li><li>\n筛选可以在无清单系统中产生功能\n<\/ul>", "ch14": "<h1>第 14 章：未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：0.7 小时 ｜ <strong>前置<\/strong>：ch12、ch13\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明摩尔定律与引擎的关系\n<\/li><li>\n能判断“技术加速”说法的合理边界\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>技术演化也是引擎：发明被复制、被改进、被市场选择、被累积成平台；但加速曲线会遇到物理与评估标准的双重限制，不是无限指数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：摩尔定律是引擎的产物（难度：基础）<\/h3>\n<p>晶体管数量每两年翻倍，靠的不是单一发明的灵感，而是设计—制造—测试—保留的循环被制度化：每代工艺被复制、微调、由市场筛选、再作为下一代基础。库兹韦尔把它外推到 2020 年前后转向分子计算，属于推测而非定律。<\/p>\n<h3>概念 2：限制在哪里（难度：进阶）<\/h3>\n<p>物理限制：散热、量子效应、光刻极限。经济限制：研发成本指数上升。评估限制：当技术影响面变大，选择压力不再由单一市场给出，社会与监管成为新的筛选层。<\/p>\n<h3>概念 3：对“复杂性未来”的态度（难度：高难）<\/h3>\n<p>梅菲尔德不给预言，只给框架：只要引擎还在运转，复杂度就会在某些方向继续上升；但上升的方向由当下的选择压力决定，而选择压力是人可以部分改变的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;摩尔定律是引擎的产物&quot;]\n  n2[&quot;限制在哪里&quot;]\n  n1 --&gt; n2\n  n3[&quot;对“复杂性未来”的态度&quot;]\n  n2 --&gt; n3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方框是本章的概念顺序，箭头表示后一个概念必须建立在前一个之上。读图时先确认每个方框你都说得出一句白话定义，再往下看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像竹子生长：一段时间内每天窜高很多，但到一定高度就停，因为运输水分的结构跟不上。边界：技术可以换“结构”（新范式），竹子不能。\n<\/li><li>\n<strong>实例<\/strong>：1971 年单芯片 2000 个晶体管，按两年翻倍推算到 2011 年应在十亿量级——实际商用芯片确实接近这个量级。这个可复核的对照，说明定律描述的是历史斜率，不是物理常数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为指数增长可以无限延续——实际上每次范式转换都要重新起一条曲线。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n摩尔定律在书中被理解为？\n<ul>\n<li>\nA. 物理定律\n<\/li><li>\nB. 制度化引擎的历史斜率\n<\/li><li>\nC. 市场宣传\n<\/li><li>\nD. 随机波动\n<\/li><li>\n<strong>答案<\/strong>：B；<strong>解析<\/strong>：它是设计-制造-选择循环被制度化后的统计规律。\n<\/li><li>\n技术加速的主要限制不包括？\n<\/li><li>\nA. 散热与量子效应\n<\/li><li>\nB. 研发成本上升\n<\/li><li>\nC. 社会监管成为筛选层\n<\/li><li>\nD. 人类不再有创意\n<\/li><li>\n<strong>答案<\/strong>：D；<strong>解析<\/strong>：前三项是物理与经济约束；创意并非确定枯竭。\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n技术演化 = 引擎 + 制度化\n<\/li><li>\n指数曲线会遇范式转换\n<\/li><li>\n选择压力可以被政策改变\n<\/ul>", "c01": "<h1>复杂引擎<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 05 章、第 06 章、第 07 章、第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复制、变异、选择、累积四步构成的循环，能把极不可能的有用结构变成几乎必然出现的结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书的统一解释框架，把物理、生物、免疫、学习、文化、技术串在同一台机器上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>四步不是并列，而是闭环：累积的结果回到复制环节，成为下一轮的起点。<\/p>\n<p>判断一个过程是不是引擎，问：有没有副本？副本有没有差异？差异是否影响留存？留存优势能否叠加？<\/p>\n<p>缺一环的后果：无复制则无法积累，无变异则无法探索，无选择则方向随机，无累积则永远从零开始。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为引擎需要设计者——实际上它只需要变异来源与选择压力。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>无概率性与引擎<\/td><td>四步定义<\/td><\/tr><tr><td>ch06<\/td><td>算法进化<\/td><td>程序版实现<\/td><\/tr><tr><td>ch11<\/td><td>文化进化<\/td><td>观念版实现<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n自然选择、遗传算法、免疫克隆选择\n<\/ul>", "c02": "<h1>免费的结构与目的性结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 03 章、第 04 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>免费结构由物理定律自发形成；目的性结构为实现功能而由指令生成。<\/p>\n<h2>为什么重要<\/h2>\n<p>这条分界线决定了哪些秩序不需要解释、哪些必须用引擎解释。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>免费结构：雪花、晶体、对流，特点是可复现、形态种类有限、不需要指令。<\/p>\n<p>目的性结构：螺丝刀、蛋白质、程序，特点是被功能约束、需要可执行指令、形态种类开放。<\/p>\n<p>误用的典型：把生物结构说成“物理必然”，或把雪花说成“被设计”。两者都越界。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为所有秩序都是设计出来的——实际上物理自发秩序大量存在。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>免费结构<\/td><td>物理自发<\/td><\/tr><tr><td>ch04<\/td><td>目的性结构<\/td><td>指令生成<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n涌现、控制循环\n<\/ul>", "c03": "<h1>无概率性与累积选择<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 05 章、第 12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>无概率性指结果概率极低却必然出现；累积选择通过多轮小步骤筛选把总概率拆解。<\/p>\n<h2>为什么重要<\/h2>\n<p>它回答了“生命这么精巧怎么可能自然出现”这一最顽固的质疑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>单次事件的概率 = 各步概率相乘，极小；累积选择把“一次成功”换成“每步只要求小幅改进”，把乘积变成加和。<\/p>\n<p>类比：爬山不必一步跳到山顶，只要每步都往上一点。<\/p>\n<p>边界：适应度地形有局部高峰时，累积选择会卡住；这也是进化会遇到平台期的原因。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为累积选择保证找到最优——实际上它常常停在局部最优。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>无概率性<\/td><td>概率拆解<\/td><\/tr><tr><td>ch12<\/td><td>复杂性进化<\/td><td>协同进化推动上升<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n复杂引擎、适应度地形\n<\/ul>", "c04": "<h1>混沌边缘<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 09 章、第 12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>系统处于完全有序与完全混沌之间的临界区域，兼具稳定性与可塑性，被认为最适合计算与适应。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了为什么生物网络既稳定又能响应，也为“复杂度为何停在某个区间”提供机制。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  n1[&quot;前置&quot;] --&gt; n2[&quot;本概念&quot;] --&gt; n3[&quot;后续用途&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判据包括：扰动传播的临界性、周期数随规模的增长速度、相互信息量的峰值。<\/p>\n<p>生物学证据：基因调控网络、神经网络的临界特征。<\/p>\n<p>争议：临界是被进化选择出来的，还是测量方法的产物，仍无定论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为越复杂越好——实际上完全混沌的系统无法稳定保存信息。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>复杂系统<\/td><td>布尔网络与临界<\/td><\/tr><tr><td>ch12<\/td><td>复杂性进化<\/td><td>协同进化推高复杂度<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n布尔网络、自组织临界\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：问题<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 问题<\/a><br>检查点：完成第 1 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-02'><strong>步骤 02：计算<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 计算<\/a><br>检查点：完成第 2 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-03'><strong>步骤 03：免费的结构<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章 免费的结构<\/a><br>检查点：完成第 3 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-04'><strong>步骤 04：目的性结构<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 目的性结构<\/a><br>检查点：完成第 4 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-05'><strong>步骤 05：无概率性和复杂引擎<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章 无概率性和复杂引擎<\/a><br>检查点：完成第 5 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-06'><strong>步骤 06：算法进化<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章 算法进化<\/a><br>检查点：完成第 6 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-07'><strong>步骤 07：身体内的进化<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章 身体内的进化<\/a><br>检查点：完成第 7 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-08'><strong>步骤 08：控制循环<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章 控制循环<\/a><br>检查点：完成第 8 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-09'><strong>步骤 09：复杂系统<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章 复杂系统<\/a><br>检查点：完成第 9 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-10'><strong>步骤 10：人类学习和创造性<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章 人类学习和创造性<\/a><br>检查点：完成第 10 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-11'><strong>步骤 11：文化的进化<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章 文化的进化<\/a><br>检查点：完成第 11 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-12'><strong>步骤 12：复杂性的进化<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章 复杂性的进化<\/a><br>检查点：完成第 12 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-13'><strong>步骤 13：过去和现在<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章 过去和现在<\/a><br>检查点：完成第 13 章自测题，答对 2 题以上<\/li><li class='path-step' id='path-14'><strong>步骤 14：未来<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章 未来<\/a><br>检查点：完成第 14 章自测题，答对 2 题以上<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='zx-q1' data-type='single'><p class='quiz-q'><b>Q29.<\/b> 把“雪花的六角”和“螺丝刀的刃口”放在一起比较，最准确的结论是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q1' value='0'> 两者都是设计的<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='1'> 两者都是物理必然<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='2'> 前者由物理自发形成，后者由功能与指令约束<\/label><label class='quiz-opt'><input type='radio' name='zx-q1' value='3'> 两者都无法解释<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q2' data-type='single'><p class='quiz-q'><b>Q30.<\/b> 某算法在模拟环境中演化出“原地转圈也能拿高分”的策略，最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q2' value='0'> 变异率过低<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='1'> 评估函数漏掉了“必须真正完成任务”这一项<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='2'> 种群规模太小<\/label><label class='quiz-opt'><input type='radio' name='zx-q2' value='3'> 交叉算子失效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='zx-q3' data-type='single'><p class='quiz-q'><b>Q31.<\/b> “生命极不可能，却必然出现”在书中的解释是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='zx-q3' value='0'> 宇宙无限多<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='1'> 累积选择把一次大概率事件拆成多轮小步骤<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='2'> 概率计算有误<\/label><label class='quiz-opt'><input type='radio' name='zx-q3' value='3'> 生命不复杂<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章 问题<\/h1><div class='quiz-item' data-qid='ch01-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 书中“免费的结构”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q1' value='0'> 不需要材料的结构<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='1'> 物理定律自发形成的秩序<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='2'> 生物免费获得的结构<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 随机产生的结构<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 为什么说随机组合“蕴含万物”却不产生万物？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 随机不是真随机<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 有趣结构在组合空间中占比极小<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 时间不够长<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 原子数量不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='q o' name='ch09-q2' value='1'> 既稳定又灵活<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 完全固定<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 无法预测<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章 人类学习和创造性<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 书中把学习描述为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 被动接收信息<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 权重扰动与保留的循环<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 记忆容量扩大<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 情绪调节<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 人类创造比纯算法搜索高效，主要因为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q2' value='0'> 大脑算力更高<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='1'> 能用模型预演与知识剪枝<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='2'> 人不会犯错<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='3'> 灵感来自外部<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章 文化的进化<\/h1><div class='quiz-item' data-qid='ch11-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 拟子概念的主要缺陷是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1' value='0'> 无法解释传播<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='1'> 缺少明确边界与物理载体<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='2'> 只适用于语言<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='3'> 无法变异<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 文化累积的典型例子是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q2' value='0'> 个人灵感<\/label><label class='quiz-opt'><input type='radio' name='ch11-q2' value='1'> 分工与贸易形成的复杂产品<\/label><label class='quiz-opt'><input type='radio' name='ch11-q2' value='2'> 基因突变<\/label><label class='quiz-opt'><input type='radio' name='ch11-q2' value='3'> 个体记忆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章 复杂性的进化<\/h1><div class='quiz-item' data-qid='ch12-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 负熵不能作为复杂性度量的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q1' value='0'> 无法计算<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='1'> 不同复杂度可有相同负熵<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='2'> 只适用于生命<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='3'> 与熵无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 协同进化推动复杂度上升的机制是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q2' value='0'> 固定目标优化<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='1'> 互为环境导致选择压力不断变化<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='2'> 随机漂变<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='3'> 能量输入增加<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章 过去和现在<\/h1><div class='quiz-item' data-qid='ch13-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “复制优先”与“代谢优先”争论的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q1' value='0'> 地球年龄<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1' value='1'> 先有遗传机制还是先有自维持化学循环<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1' value='2'> 是否有水<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1' value='3'> 氧气浓度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 免疫系统对生命起源研究的启示是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q2' value='0'> 必须有清单<\/label><label class='quiz-opt'><input type='radio' name='ch13-q2' value='1'> 生成多样性再筛选可产生识别能力<\/label><label class='quiz-opt'><input type='radio' name='ch13-q2' value='2'> 复制必须先于代谢<\/label><label class='quiz-opt'><input type='radio' name='ch13-q2' value='3'> 生命需要氧气<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章 未来<\/h1><div class='quiz-item' data-qid='ch14-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 摩尔定律在书中被理解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q1' value='0'> 物理定律<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1' value='1'> 制度化引擎的历史斜率<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1' value='2'> 市场宣传<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1' value='3'> 随机波动<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 技术加速的主要限制不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q2' value='0'> 散热与量子效应<\/label><label class='quiz-opt'><input type='radio' name='ch14-q2' value='1'> 研发成本上升<\/label><label class='quiz-opt'><input type='radio' name='ch14-q2' value='2'> 社会监管成为筛选层<\/label><label class='quiz-opt'><input type='radio' name='ch14-q2' value='3'> 人类不再有创意<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='免费的结构'>免费的结构 — 物理定律自发形成、无需指令的秩序 <span class=glossary-ref>（第 3 章 免费的结构）<\/span><\/li><li data-term='目的性结构'>目的性结构 — 为实现功能、由指令生成的结构 <span class=glossary-ref>（第 4 章 目的性结构）<\/span><\/li><li data-term='复杂引擎'>复杂引擎 — 复制、变异、选择、累积构成的循环 <span class=glossary-ref>（第 5 章 无概率性和复杂引擎）<\/span><\/li><li data-term='无概率性'>无概率性 — 结果概率极低却实际发生 <span class=glossary-ref>（第 5 章 无概率性和复杂引擎）<\/span><\/li><li data-term='算法进化'>算法进化 — 把引擎写成程序，如遗传算法 <span class=glossary-ref>（第 6 章 算法进化）<\/span><\/li><li data-term='适应度'>适应度 — 个体在任务上的评分 <span class=glossary-ref>（第 6 章 算法进化）<\/span><\/li><li data-term='体细胞超突变'>体细胞超突变 — 免疫细胞在筛选后进一步加速变异 <span class=glossary-ref>（第 7 章 身体内的进化）<\/span><\/li><li data-term='阴性选择'>阴性选择 — 删除识别自身的免疫细胞 <span class=glossary-ref>（第 7 章 身体内的进化）<\/span><\/li><li data-term='负反馈'>负反馈 — 按偏差反向修正的控制方式 <span class=glossary-ref>（第 8 章 控制循环）<\/span><\/li><li data-term='布尔网络'>布尔网络 — 节点只有开/关、由逻辑规则更新的网络 <span class=glossary-ref>（第 9 章 复杂系统）<\/span><\/li><li data-term='混沌边缘'>混沌边缘 — 有序与混沌之间的临界区域 <span class=glossary-ref>（第 9 章 复杂系统）<\/span><\/li><li data-term='拟子'>拟子 — 文化中可复制传播的单位 <span class=glossary-ref>（第 11 章 文化的进化）<\/span><\/li><li data-term='负熵'>负熵 — 相对最大熵状态的有序程度 <span class=glossary-ref>（第 12 章 复杂性的进化）<\/span><\/li><li data-term='协同进化'>协同进化 — 两个种群互为环境、选择压力互相变化 <span class=glossary-ref>（第 12 章 复杂性的进化）<\/span><\/li><li data-term='红皇后效应'>红皇后效应 — 必须不断进化才能维持相对位置 <span class=glossary-ref>（第 12 章 复杂性的进化）<\/span><\/li><li data-term='摩尔定律'>摩尔定律 — 集成电路晶体管数约每两年翻倍 <span class=glossary-ref>（第 14 章 未来）<\/span><\/li><\/ul>", "__patterns__": "<h1>复杂的引擎 模式与框架库<\/h1>\n<h2>分析框架：四问判断一个过程是否为“引擎”<\/h2>\n<p>有没有复制？副本之间有没有差异？差异是否影响留存？留存的优势是否能进入下一轮？四问全“是”，才配得上“进化/引擎”这个词。<\/p>\n<h2>分析框架：结构来源判别<\/h2>\n<p>看形态是否由对称性与能量最低决定 → 免费结构；看形态是否服务于某个功能、需要步骤才能造出 → 目的性结构；两者都有 → 分层解释，别用一个词糊过去。<\/p>\n<h2>决策规则：评估函数优先<\/h2>\n<p>if 你要用算法进化/训练得到某个能力 then 先把该能力写成可测分数，并检查有没有被漏掉的性质 if 分数只覆盖一部分 then 结果一定会利用漏洞<\/p>\n<h2>反模式：把负熵当复杂度<\/h2>\n<p>有序 ≠ 复杂。晶体熵极低却简单。要区分“简单有序”与“精巧组织”，必须引入描述长度或生成步骤。<\/p>\n<h2>反模式：把拟子当基因<\/h2>\n<p>文化单位没有清晰边界与物理载体，不能直接套用基因的频率、适应度算法。当启发式用，别当理论用。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>引擎四步<\/td><td>复制 → 变异 → 选择 → 累积（闭环）<\/td><\/tr><tr><td>两类结构<\/td><td>免费（物理自发）/ 目的性（指令 + 功能）<\/td><\/tr><tr><td>元胞机规则数<\/td><td>一维两态看左右邻居：2^8=256 条<\/td><\/tr><tr><td>无概率性换算<\/td><td>单次 2^-1000 vs 多轮小幅改进<\/td><\/tr><tr><td>免疫三步<\/td><td>多样性生成 → 抗原筛选 → 克隆扩增<\/td><\/tr><tr><td>布尔网络<\/td><td>稀疏连接→周期态；密集→混沌<\/td><\/tr><tr><td>拟子的边界问题<\/td><td>一个笑话改一字还是同一个吗<\/td><\/tr><tr><td>协同进化<\/td><td>适应度地形随对手移动，无固定终点<\/td><\/tr><tr><td>摩尔定律<\/td><td>约每两年翻倍，遇范式转换则重置<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
