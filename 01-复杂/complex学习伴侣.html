' value='2'> 一台空调按设定温度开关压缩机<\/label><label class='quiz-opt'><input type='radio' name='ch01-q1' value='3'> 市场靠买卖双方报价形成价格<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> “涌现”在书里的确切含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q2' value='0'> 系统变得很乱，无法预测<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='1'> 整体表现出单个成分不具备的行为<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='2'> 成分数量超过某个阈值<\/label><label class='quiz-opt'><input type='radio' name='ch01-q2' value='3'> 系统对外界刺激作出反应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章 动力学、混沌和预测<\/h1><div class='quiz-item' data-qid='ch02-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> logistic 映射中 r=4、x0=0.5 立刻变成 0，说明了什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q1' value='0'> 混沌系统无法计算<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='1'> 特定初值可能落入短周期或不动点<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='2'> r=4 时系统一定是随机的<\/label><label class='quiz-opt'><input type='radio' name='ch02-q1' value='3'> 模型参数写错了<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> “长期天气不可预测”在书中的理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q2' value='0'> 观测站太少<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='1'> 计算机速度不够<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='2'> 误差在混沌系统中指数放大<\/label><label class='quiz-opt'><input type='radio' name='ch02-q2' value='3'> 天气预报员经验不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章 信息<\/h1><div class='quiz-item' data-qid='ch03-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一枚两面相同的硬币抛一次，香农信息量是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q1' value='0'> 0 比特<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='1'> 0.5 比特<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='2'> 1 比特<\/label><label class='quiz-opt'><input type='radio' name='ch03-q1' value='3'> 2 比特<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 麦克斯韦妖不能永久降低熵，关键原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q2' value='0'> 分子太小抓不住<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='1'> 测量与记忆、擦除记忆需要耗能产熵<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='2'> 隔板不导热<\/label><label class='quiz-opt'><input type='radio' name='ch03-q2' value='3'> 热力学第二定律只适用于宏观系统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章 计算<\/h1><div class='quiz-item' data-qid='ch04-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图灵机的基本部件不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q1' value='0'> 无限纸带<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='1'> 读写头<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='2'> 规则表<\/label><label class='quiz-opt'><input type='radio' name='ch04-q1' value='3'> 随机数发生器<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 停机问题不可解，其证明的核心手法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q2' value='0'> 穷举所有程序<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='1'> 构造自指程序制造矛盾<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='2'> 证明纸带不够长<\/label><label class='quiz-opt'><input type='radio' name='ch04-q2' value='3'> 用哥德尔编码数数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章 进化<\/h1><div class='quiz-item' data-qid='ch05-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 孟德尔的工作解决了达尔文理论的哪个难题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q1' value='0'> 地球年龄不够长<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='1'> 混合遗传会稀释变异<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='2'> 物种是否会灭绝<\/label><label class='quiz-opt'><input type='radio' name='ch05-q1' value='3'> 化石记录不完整<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 中性演化理论的主要主张是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q2' value='0'> 所有变异都受选择<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='1'> 大量分子变异不受选择、靠漂变固定<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='2'> 进化由灾变驱动<\/label><label class='quiz-opt'><input type='radio' name='ch05-q2' value='3'> 获得性性状可遗传<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章 遗传学概要<\/h1><div class='quiz-item' data-qid='ch06-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 中心法则的信息流顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q1' value='0'> 蛋白质→DNA→RNA<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='1'> DNA→RNA→蛋白质<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='2'> RNA→蛋白质→DNA<\/label><label class='quiz-opt'><input type='radio' name='ch06-q1' value='3'> DNA→蛋白质→RNA<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 为什么突变率不能太高？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q2' value='0'> 会让细胞立刻死亡<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='1'> 后代变化过大，无法稳定积累有利性状<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='2'> 会增加能耗<\/label><label class='quiz-opt'><input type='radio' name='ch06-q2' value='3'> 会破坏双螺旋结构<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章 度量复杂性<\/h1><div class='quiz-item' data-qid='ch07-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用算法信息量衡量，随机串的特点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q1' value='0'> 程序最短<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='1'> 程序最长，几乎无法压缩<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='2'> 逻辑深度最高<\/label><label class='quiz-opt'><input type='radio' name='ch07-q1' value='3'> 熵最低<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 逻辑深度想补充熵和算法信息量遗漏的哪一点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q2' value='0'> 数据长度<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='1'> 生成所需的时间/步骤<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='2'> 存储成本<\/label><label class='quiz-opt'><input type='radio' name='ch07-q2' value='3'> 符号意义<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章 自我复制的计算机程序<\/h1><div class='quiz-item' data-qid='ch08-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 冯·诺依曼解决自复制悖论的关键是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q1' value='0'> 让程序无限长<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='1'> 把描述与构造分成两层<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='2'> 使用随机数<\/label><label class='quiz-opt'><input type='radio' name='ch08-q1' value='3'> 允许副本出错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 程序自复制与 DNA 自复制最大的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q2' value='0'> DNA 不需要能量<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='1'> 程序依赖外部解释器，DNA 的解释器由自身编码<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='2'> 程序不能变异<\/label><label class='quiz-opt'><input type='radio' name='ch08-q2' value='3'> DNA 不能复制描述<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章 遗传算法<\/h1><div class='quiz-item' data-qid='ch09-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 遗传算法的四个核心步骤是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q1' value='0'> 采样、拟合、预测、验证<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='1'> 初始化、评估、选择、交叉与突变<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='2'> 编码、解码、压缩、解压<\/label><label class='quiz-opt'><input type='radio' name='ch09-q1' value='3'> 训练、测试、部署、监控<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 罗比实验中随机策略与演化策略的平均分大约是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q2' value='0'> 346 与 483<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='1'> 100 与 400<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='2'> 483 与 500<\/label><label class='quiz-opt'><input type='radio' name='ch09-q2' value='3'> 0 与 243<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章 元胞自动机、生命和宇宙<\/h1><div class='quiz-item' data-qid='ch10-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 生命游戏中一个活细胞有 4 个活邻居，下一代它会？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1' value='0'> 存活<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='1'> 死亡<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='2'> 复活<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1' value='3'> 随机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 沃尔夫勒姆第四类的特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q2' value='0'> 全部归零<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='1'> 稳定周期<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='2'> 伪随机混沌<\/label><label class='quiz-opt'><input type='radio' name='ch10-q2' value='3'> 局部结构能相互作用<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章 粒子计算<\/h1><div class='quiz-item' data-qid='ch11-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 元胞机中的“粒子”指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1' value='0'> 格子里的基本单元<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='1'> 自发产生并能稳定传播的局部结构<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='2'> 随机噪声<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1' value='3'> 外部输入的信号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 粒子计算的核心主张是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q2' value='0'> 计算必须由人设计<\/label><label class='quiz-opt'><input type='radio' name='ch11-q2' value='1'> 碰撞可实现逻辑运算，计算可从规则中涌现<\/label><label class='quiz-opt'><input type='radio' name='ch11-q2' value='2'> 元胞机不能通用<\/label><label class='quiz-opt'><input type='radio' name='ch11-q2' value='3'> 粒子就是电子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章 生命系统中的信息处理<\/h1><div class='quiz-item' data-qid='ch12-q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 免疫系统识别病原的方式最接近下列哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q1' value='0'> 查预先存好的病原清单<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='1'> 从现成多样性中筛选并扩增<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='2'> 由大脑下发指令<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1' value='3'> 随机试错直到成功<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 分布式信息处理的典型代价是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q2' value='0'> 无法容错<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='1'> 行为难以精确控制与解释<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='2'> 必须中央存储<\/label><label class='quiz-opt'><input type='radio' name='ch12-q2' value='3'> 无法进化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章 如何进行类比（如果你是计算机）<\/h1><div class='quiz-item' data-qid='ch13-q1' data-type='single'><p class='quiz-q'><b>
